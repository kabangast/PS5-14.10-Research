<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>PS5 Probe Local Tester</title>
<style>
body{background:#0d1117;color:#c9d1d9;font:13px monospace;margin:12px;}
h2{color:#58a6ff;margin:4px 0;}
pre{background:#161b22;border:1px solid #30363d;padding:8px;border-radius:4px;white-space:pre-wrap;max-height:400px;overflow-y:auto;}
.ok{color:#3fb950;}.fail{color:#f85149;}.info{color:#58a6ff;}.hot{color:#ffa657;}
button{background:#238636;color:#fff;border:0;padding:6px 16px;border-radius:4px;cursor:pointer;margin:4px;}
button:hover{background:#2ea043;}
iframe{border:1px solid #30363d;border-radius:4px;background:#000;}
#beacons{color:#7ee787;}
</style>
</head><body>
<h2>PS5 Probe Local Flow Tester</h2>
<p class="info">Tests JS flow, beacon timing, and error catching. Exploit-specific behavior (UAF, bmalloc) requires real PS5.</p>
<div>
  <button onclick="loadProbe()">Load Probe in iframe</button>
  <button onclick="clearLog()">Clear Log</button>
  <input id="probePath" type="text" value="/document/en/ps5/index.html" style="width:400px;background:#0d1117;color:#c9d1d9;border:1px solid #30363d;padding:4px;border-radius:4px;">
</div>
<br>
<iframe id="probeFrame" width="100%" height="300" sandbox="allow-scripts allow-same-origin"></iframe>
<h2>Intercepted Beacons</h2>
<pre id="beacons">(beacons will appear here)</pre>
<h2>Console Errors</h2>
<pre id="errors">(errors will appear here)</pre>

<script>
var beaconEl=document.getElementById('beacons');
var errorEl=document.getElementById('errors');
var beaconCount=0;

function clearLog(){
  beaconEl.textContent='(cleared)';
  errorEl.textContent='(cleared)';
  beaconCount=0;
}

function loadProbe(){
  var path=document.getElementById('probePath').value;
  document.getElementById('probeFrame').src=path;
  beaconEl.textContent='Loading '+path+'...\n';
}

// Intercept beacon XHRs from iframe via message passing
window.addEventListener('message',function(e){
  if(e.data&&e.data.type==='beacon'){
    beaconCount++;
    var line=beaconCount+'. ['+new Date().toISOString().slice(11,23)+'] '+e.data.tag+' | '+e.data.data+'\n';
    beaconEl.textContent+=line;
    beaconEl.scrollTop=beaconEl.scrollHeight;
  }
});

// Note: iframe beacons won't be intercepted unless probe cooperates
// This mainly tests that the page LOADS without syntax errors
</script>
</body></html>
