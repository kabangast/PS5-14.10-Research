// D5: Resizable ArrayBuffer edge cases
addTest('D5-RAB-EDGES',function(cb){
  var res=[];
  try{
    if(!ArrayBuffer.prototype.resize){cb('SKIP-no-RAB');return;}
    var rab=new ArrayBuffer(64,{maxByteLength:1024});
    var view=new Uint8Array(rab);
    view[0]=0xFF;
    // Resize larger
    rab.resize(128);
    res.push('grow:'+rab.byteLength+'|val:0x'+view[0].toString(16));
    // Resize to 0
    rab.resize(0);
    res.push('zero:'+rab.byteLength);
    try{var v=view[0];res.push('oob-read:0x'+v.toString(16));}
    catch(e3){res.push('oob-read:'+e3.name);}
    // Resize back
    rab.resize(256);
    res.push('regrow:'+rab.byteLength+'|init:0x'+view[0].toString(16));
    // Race: resize during typed array operation
    var rab2=new ArrayBuffer(1024,{maxByteLength:4096});
    var u32=new Uint32Array(rab2);
    for(var i=0;i<u32.length;i++)u32[i]=i;
    // Shrink while iterating
    var sum=0;
    for(var j=0;j<u32.length;j++){
      if(j===128)try{rab2.resize(256);}catch(e4){}
      try{sum+=u32[j];}catch(e5){break;}
    }
    res.push('race-sum:'+sum);
  }catch(e){res.push('ERR:'+e.name+':'+e.message);}
  cb(res.join('|'));
});

    div.className='c'+i;
    var cs=getComputedStyle(div);
    vals.push(cs.fontSize);
    if(i%10===0){
      var child=document.createElement('span');
      div.appendChild(child);
    }
    if(i%15===0)div.innerHTML='';
  }
  cb('OK-reads:'+vals.length+'|last:'+vals[vals.length-1]);
});

// Run tests sequentially
function runNext(){
  if(tidx>=tests.length){
    var s=results.map(function(r){return r.id+'='+r.res;}).join('|');
    bn('DONE','total='+tests.length+'|crashes='+crashes.length+'|'+s);
    log('COMPLETE: '+tests.length+' tests, '+crashes.length+' crashes','ok');
    return;
  }
  var t=tests[tidx];
  log('['+tidx+'/'+tests.length+'] '+t.id,'warn');
  bn('PRE-'+t.id,'starting');

  var done=false;
  function finish(res){
    if(done)return;
    done=true;
    results.push({id:t.id,res:res});
    var isErr=res.indexOf('ERR')>=0||res.indexOf('CRASH')>=0;
    if(isErr)crashes.push(t.id);
    bn('POST-'+t.id,res);
    log('  -> '+res,isErr?'hot':'ok');
    tidx++;
    setTimeout(runNext,150);
  }

  try{
    t.fn(finish);
    setTimeout(function(){if(!done)finish('TIMEOUT-5s');},5000);
  }catch(e){
    finish('EXCEPTION:'+e.name+':'+e.message);
  }
}

setTimeout(runNext,300);
</script></body></html>
