<!-- A: Proxy type confusion -->
<script>
log('\n--- A: Proxy type confusion ---');
var aR=[];

// A1: Proxy.get returns object with valueOf for length (safe: max 5)
try{
  var cc=0;
  var p=new Proxy({},{
    get:function(t,prop){
      cc++;
      if(prop==='length') return {valueOf:function(){return 5;}};
      if(prop===Symbol.iterator) return undefined;
      if(typeof prop==='string'&&!isNaN(prop)) return 'val_'+prop;
      return undefined;
    },
    has:function(){return true;}
  });
  var arr=Array.from(p);
  aR.push('A1:len='+arr.length+'|cc='+cc+'|v0='+arr[0]);
}catch(e){aR.push('A1:ERR:'+e.message.slice(0,60));}

// A2: Proxy ownKeys with non-string keys
try{
  var p2=new Proxy({a:1,b:2},{
    ownKeys:function(){return ['a','b'];}
  });
  var k=Object.keys(p2);
  aR.push('A2:keys='+k.join(','));
}catch(e){aR.push('A2:ERR:'+e.message.slice(0,60));}

// A3: Proxy get trap returning different value each time
try{
  var ctr=0;
  var p3=new Proxy({},{
    get:function(t,prop){
      ctr++;
      if(prop==='constructor') return Array;
      if(prop==='length') return ctr<5?10:0;
      return ctr;
    }
  });
  var v1=p3.length,v2=p3.length,v3=p3.length;
  aR.push('A3:v1='+v1+'|v2='+v2+'|v3='+v3);
}catch(e){aR.push('A3:ERR:'+e.message.slice(0,60));}

// A4: Proxy as prototype — cache invalidation
try{
  var tc=0;
  var proto=new Proxy({},{
    get:function(t,prop,recv){tc++;if(prop==='x')return tc;return undefined;}
  });
  var o=Object.create(proto);
  o.y=42;
  var x1=o.x,x2=o.x;
  o.x='own';
  var x3=o.x;
  delete o.x;
  var x4=o.x;
  aR.push('A4:x1='+x1+'|x2='+x2+'|x3='+x3+'|x4='+x4+'|tc='+tc);
}catch(e){aR.push('A4:ERR:'+e.message.slice(0,60));}

// A5: Proxy with has trap confusion — "in" operator lies
try{
  var hasCalls=[];
  var p5=new Proxy({a:1},{
    has:function(t,prop){hasCalls.push(prop);return prop==='ghost';}
  });
  var r1=('a' in p5),r2=('ghost' in p5),r3=('b' in p5);
  aR.push('A5:a='+r1+'|ghost='+r2+'|b='+r3+'|calls='+hasCalls.join(','));
}catch(e){aR.push('A5:ERR:'+e.message.slice(0,60));}

B('A',aR.join('||'));
log('A: '+aR.join(' | '));
</script>

<!-- E: arguments aliasing (non-strict) -->
<script>
log('\n--- E: arguments aliasing ---');
var eR=[];

function testAlias(a,b,c){
  var r=[];
  r.push('a='+a);
  arguments[0]='mod';
  r.push('after:a='+a);
  a='direct';
  r.push('arg0='+arguments[0]);
  delete arguments[1];
  r.push('b='+b+'|arg1='+arguments[1]);
  arguments[5]='extra';
  r.push('arg5='+arguments[5]+'|len='+arguments.length);
  return r.join('|');
}
eR.push('E1:'+testAlias(1,2,3));

function testReentrant(){
  var orig=arguments;
  function inner(){orig[0]='hacked';return arguments[0];}
  var before=arguments[0];
  var ir=inner.call(null,'inner_val');
  return 'before='+before+'|inner='+ir+'|after='+arguments[0];
}
eR.push('E2:'+testReentrant('original'));

function testCallee(n){
  if(n<=0)return 'done';
  arguments[0]=n-1;
  return n+','+arguments.callee(n);
}
try{eR.push('E3:'+testCallee(5));}catch(e){eR.push('E3:ERR:'+e.message.slice(0,60));}

}

B('E',eR.join('||'));
