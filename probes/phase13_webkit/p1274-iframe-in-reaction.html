<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P1274</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#0f0;font:11px/1.4 monospace;padding:8px;overflow-y:auto}
#log{white-space:pre-wrap;word-break:break-all}
.hdr{color:#ff0}
</style>
</head>
<body>
<div id="log"></div>

<script>
var L=document.getElementById('log');
function log(s){L.textContent+=s+'\n';}
function B(tag,data){
  try{
    var u='/beacon.php?tag=P1274-'+encodeURIComponent(tag);
    if(data)u+='&data='+encodeURIComponent(String(data).slice(0,500));
    u+='&t='+(window.__seq=(window.__seq||0)+1);
    var x=new XMLHttpRequest();x.open('GET',u,false);x.send(null);
  }catch(e){}
}
log('=== P1274: IFRAME CREATED *INSIDE* THE CE REACTION ===');
log('P1273 proved the adopt-dance alone is SAFE. Both crashers (P1270-B2, P1271-B)');
log('created the iframe + document.write INSIDE the synchronous connectedCallback.');
log('This probe isolates the minimal fatal operation. Last beacon = crash point.');
B('START','P1274');

var madeIframes=[];
function mkIframeInline(){
  var ifr=document.createElement('iframe');
  ifr.style.cssText='width:1px;height:1px;position:absolute;left:-9999px';
  madeIframes.push(ifr);
  return ifr;
}
function cleanupAll(){
  for(var i=0;i<madeIframes.length;i++){
    try{ if(madeIframes[i].parentNode) madeIframes[i].parentNode.removeChild(madeIframes[i]); }catch(e){}
  }
  madeIframes=[];
}
function mkParent(){
  var p=document.createElement('div');
  p.style.cssText='position:absolute;left:-9999px';
  p.innerHTML='<p>Before CE</p>';
  document.body.appendChild(p);
  return p;
}
</script>

<!-- T0: iframe created + appended to body INSIDE the reaction. No write, no adopt. -->
<!-- Does merely creating a browsing context during a CE reaction crash?           -->
<script>
log('\n<span class="hdr">--- T0: create+append iframe inside reaction (no write, no adopt) ---</span>');
(function(){
  var parent;
  try{
    var done=false;
    customElements.define('x-t0', class extends HTMLElement {
      connectedCallback(){
        if(done){B('T0-reentry','x');return;} done=true;
        B('T0-cc','entered callback');
        var ifr=mkIframeInline();
        B('T0-ifr-made','iframe element created; next: appendChild to body');
        document.body.appendChild(ifr);
        B('T0-ifr-appended','iframe appended -> browsing context created');
      }
    });
    parent=mkParent();
    var ce=document.createElement('x-t0');
    B('T0-pre','insert CE (iframe created inside callback)');
    parent.appendChild(ce);
    B('T0-post','SURVIVED');
  }catch(e){ B('T0-err',e.name+':'+e.message.slice(0,120)); }
  try{ if(parent&&parent.parentNode) parent.parentNode.removeChild(parent); }catch(e){}
  cleanupAll();
})();
</script>

<!-- T1: iframe created + appended + document.write/open/close INSIDE the reaction. -->
<!-- No adopt. Does writing into a fresh frame during a reaction crash?             -->
<script>
log('\n<span class="hdr">--- T1: create+append+write iframe inside reaction (no adopt) ---</span>');
(function(){
  var parent;
  try{
    var done=false;
    customElements.define('x-t1', class extends HTMLElement {
      connectedCallback(){
        if(done){B('T1-reentry','x');return;} done=true;
        B('T1-cc','entered callback');
        var ifr=mkIframeInline();
        document.body.appendChild(ifr);
        B('T1-ifr-appended','iframe appended; next: open/write/close');
        ifr.contentDocument.open();
        ifr.contentDocument.write('<html><body></body></html>');
        ifr.contentDocument.close();
        B('T1-ifr-written','document.write into fresh frame complete');
      }
    });
    parent=mkParent();
    var ce=document.createElement('x-t1');
    B('T1-pre','insert CE (iframe+write inside callback)');
    parent.appendChild(ce);
    B('T1-post','SURVIVED');
  }catch(e){ B('T1-err',e.name+':'+e.message.slice(0,120)); }
  try{ if(parent&&parent.parentNode) parent.parentNode.removeChild(parent); }catch(e){}
  cleanupAll();
})();
</script>

<!-- T2: iframe-in-reaction + write + adopt ANCESTOR into it + append to iframe body. -->
<!-- No restore. Does inserting the ancestor into the just-created frame crash?       -->
<script>
log('\n<span class="hdr">--- T2: iframe-in-reaction + adopt ancestor + append to iframe body (no restore) ---</span>');
(function(){
  var parent;
  try{
    var done=false;
    customElements.define('x-t2', class extends HTMLElement {
      connectedCallback(){
        if(done){B('T2-reentry','x');return;} done=true;
        var p=this.parentNode;
        B('T2-cc','entered; parent='+(p?p.nodeName:'null'));
        var ifr=mkIframeInline();
        document.body.appendChild(ifr);
        ifr.contentDocument.open();
        ifr.contentDocument.write('<html><body></body></html>');
        ifr.contentDocument.close();
        B('T2-ifr-written','frame ready; next: adopt ancestor into it');
        ifr.contentDocument.adoptNode(p);
        B('T2-adopted','ancestor adopted into frame doc; next: append to frame body');
        ifr.contentDocument.body.appendChild(p);
        B('T2-appended','ancestor appended into frame body (no restore)');
      }
    });
    parent=mkParent();
    var ce=document.createElement('x-t2');
    B('T2-pre','iframe-in-reaction + adopt ancestor + append, no restore');
    parent.appendChild(ce);
    B('T2-post','SURVIVED');
  }catch(e){ B('T2-err',e.name+':'+e.message.slice(0,120)); }
  try{ if(parent&&parent.parentNode) parent.parentNode.removeChild(parent); }catch(e){}
  cleanupAll();
})();
</script>

<!-- T3: FULL P1271-B replica, ONE-SHOT, internal step beacons.                       -->
<!-- iframe-in-reaction + write + adopt ancestor + append to frame body + adopt back  -->
<!-- + re-append to main. This is the expected killer. Last beacon = fatal operation. -->
<script>
log('\n<span class="hdr">--- T3: FULL replica (iframe-in-reaction), one-shot, step beacons ---</span>');
(function(){
  var parent;
  try{
    var done=false;
    customElements.define('x-t3', class extends HTMLElement {
      connectedCallback(){
        if(done){B('T3-reentry','suppressed');return;} done=true;
        var p=this.parentNode;
        B('T3-cc','entered; parent='+(p?p.nodeName:'null'));
        var ifr=mkIframeInline();
        B('T3-ifr-made','iframe created');
        document.body.appendChild(ifr);
        B('T3-ifr-appended','iframe appended (browsing context)');
        ifr.contentDocument.open();
        ifr.contentDocument.write('<html><body></body></html>');
        ifr.contentDocument.close();
        B('T3-ifr-written','frame written; next: adopt ancestor');
        ifr.contentDocument.adoptNode(p);
        B('T3-adopted','ancestor adopted into frame; next: append to frame body');
        ifr.contentDocument.body.appendChild(p);
        B('T3-appended','appended into frame body; next: adopt back to main');
        document.adoptNode(p);
        B('T3-adoptback','adopted back to main; next: re-append to main body');
        document.body.appendChild(p);
        B('T3-restored','re-appended to main body; dance complete');
      }
    });
    parent=mkParent();
    var ce=document.createElement('x-t3');
    B('T3-pre','FULL replica one-shot — about to insert CE');
    parent.appendChild(ce);
    B('T3-post','SURVIVED FULL ONE-SHOT REPLICA');
  }catch(e){ B('T3-err',e.name+':'+e.message.slice(0,120)); }
  try{ if(parent&&parent.parentNode) parent.parentNode.removeChild(parent); }catch(e){}
  cleanupAll();
})();
</script>

<!-- T4: EXACT P1271-B (un-guarded, lazy iframe, re-entrant) with safety cap 30.      -->
<!-- If T3 one-shot survived but THIS crashes, re-entrancy is required.               -->
<script>
log('\n<span class="hdr">--- T4: exact P1271-B un-guarded, safety cap 30 ---</span>');
(function(){
  var parent;
  try{
    var n=0, SAFETY=30, ifrB=null;
    customElements.define('x-t4', class extends HTMLElement {
      connectedCallback(){
        n++;
        if(n>SAFETY){ return; }
        B('T4-depth','enter n='+n);
        var p=this.parentNode; if(!p){ B('T4-noparent','n='+n); return; }
        if(!ifrB){ ifrB=mkIframeInline(); document.body.appendChild(ifrB);
          ifrB.contentDocument.open(); ifrB.contentDocument.write('<html><body></body></html>');
          ifrB.contentDocument.close(); B('T4-ifr','lazy iframe made at n='+n); }
        ifrB.contentDocument.adoptNode(p);
        ifrB.contentDocument.body.appendChild(p);
        document.adoptNode(p);
        document.body.appendChild(p);
        B('T4-done','n='+n+' dance complete');
      }
    });
    parent=mkParent();
    var ce=document.createElement('x-t4');
    B('T4-pre','exact P1271-B un-guarded, cap=30');
    parent.appendChild(ce);
    B('T4-post','SURVIVED|n_reached<=cap|in_dom='+document.body.contains(parent));
  }catch(e){ B('T4-err',e.name+':'+e.message.slice(0,120)); }
  try{ if(parent&&parent.parentNode) parent.parentNode.removeChild(parent); }catch(e){}
  cleanupAll();
})();
</script>

<script>
setTimeout(function(){
  B('DONE','all');
  log('\n=== P1274 COMPLETE (if you see this, nothing crashed) ===');
}, 3000);
</script>

</body>
</html>
