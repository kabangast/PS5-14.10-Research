      var view3=new Uint8Array(rab2);
      tests9++;
      rep9+='|shrink8|view3Len='+view3.length;

      /* Auto-tracking vs fixed length */
      var rab3=new ArrayBuffer(32,{maxByteLength:256});
      var autoView=new Uint8Array(rab3); /* Auto-tracking */
      var fixedView=new Uint8Array(rab3,0,32); /* Fixed length */
      rab3.resize(64);
      tests9++;
      rep9+='|autoLen='+autoView.length+'|fixedLen='+fixedView.length;

      /* Try to use fixedView after shrink past its range */
      rab3.resize(8);
      try{
        var fv=fixedView[0];
        tests9++;
        rep9+='|fixedOOB='+(fv===undefined?'undef':'val:'+fv);
      }catch(e){
        tests9++;
        rep9+='|fixedOOB:'+e.constructor.name;
      }
    }else{
      rep9='RAB:NO';
    }

    /* structuredClone transfer then access */
    try{
      var ab9=new ArrayBuffer(32);
      var u9=new Uint8Array(ab9);
      for(var qi=0;qi<32;qi++) u9[qi]=0xFF;
      var cloned=structuredClone(ab9,{transfer:[ab9]});
      tests9++;
      /* ab9 should be detached */
      rep9+='|transfer:srcLen='+ab9.byteLength+'|dstLen='+cloned.byteLength;
      /* Read from detached view */
      try{
        var stale=u9[0];
        rep9+='|staleRead='+(stale===undefined?'undef':'val:'+stale);
      }catch(e){rep9+='|staleRead:THROW';}
    }catch(e){tests9++;rep9+='|transfer:THROW';}

    rep9+='|tests='+tests9+'|anomalies='+anomalies9;
  }catch(e){
    rep9='THROW:'+e.message;
  }
  done(rep9);

/* ---- bigintEdge ---- */
}else if(cur==='bigintEdge'){
  setPhase('BigInt arithmetic edge cases');
  B('ATTEMPT','bigintEdge');
  var anomalies10=0,tests10=0;
  var rep10='';

  try{
    /* Large BigInt operations that stress the allocator */
    var big1=BigInt('0x'+'FF'.repeat(1024)); /* 1024-byte number */
    var big2=BigInt('0x'+'AA'.repeat(1024));

    var sum=big1+big2;
    var prod=big1*big2;
    tests10+=2;
    rep10='sum:'+sum.toString(16).length+'hex|prod:'+prod.toString(16).length+'hex';

    /* Division edge cases */
    try{
      var div=big1/BigInt(0);
      anomalies10++; /* Should throw */
    }catch(e){
      tests10++;
      rep10+='|div0:'+e.constructor.name;
    }

    /* BigInt with TypedArray */
    try{
      var bu64=new BigUint64Array(16);
      bu64[0]=BigInt('0xFFFFFFFFFFFFFFFF');
      bu64[1]=BigInt(0);
      bu64[2]=bu64[0]+BigInt(1); /* Overflow wraps */
      tests10++;
      rep10+='|bu64wrap='+bu64[2].toString(16);
    }catch(e){tests10++;rep10+='|bu64:THROW';}

    /* BigInt ↔ Number edge cases */
    try{
      var big3=BigInt(Number.MAX_SAFE_INTEGER)+BigInt(1);
      var back=Number(big3);
      tests10++;
      rep10+='|backConv='+(back===Number.MAX_SAFE_INTEGER+1?'ok':'IMPRECISE');
    }catch(e){tests10++;rep10+='|conv:THROW';}

    /* Comparison edge */
    try{
      var cmp1=(BigInt(0)===0);     /* false: strict no coercion */
      var cmp2=(BigInt(0)==0);      /* true: loose coercion */
      var cmp3=(BigInt(1)<2);       /* true: mixed comparison */
      tests10++;
      rep10+='|cmp:'+cmp1+'/'+cmp2+'/'+cmp3;
    }catch(e){tests10++;rep10+='|cmp:THROW';}

    /* sort BigUint64Array */
    try{
      var sortArr=new BigUint64Array([BigInt(5),BigInt(3),BigInt(1),BigInt(4),BigInt(2)]);
      sortArr.sort();
      tests10++;
      var sorted=(sortArr[0]===BigInt(1)&&sortArr[4]===BigInt(5));
      rep10+='|sort='+(sorted?'ok':'WRONG');
    }catch(e){tests10++;rep10+='|sort:THROW';}

    rep10+='|tests='+tests10+'|anomalies='+anomalies10;
  }catch(e){
    rep10='THROW:'+e.message;
  }
  done(rep10);
}

})(); /* end IIFE */
