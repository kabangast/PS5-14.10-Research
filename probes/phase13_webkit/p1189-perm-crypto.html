<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P1189 Permissions/Crypto/Event Dict Re-entrancy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050508;color:#e8ffe8;font:14px/1.5 'Courier New',monospace;padding:12px}
#hud{background:#0a0a18;border:2px solid #2a2a5a;border-radius:10px;padding:12px;margin-bottom:10px}
#hud h1{color:#00ff88;font-size:18px;margin-bottom:6px}
#status{font-size:20px;font-weight:bold;color:#ffd75e;padding:6px 0}
#phase{font-size:16px;color:#00ffee}
#counters{font-size:14px;color:#b9c6ee;line-height:1.8}
#finds{font-size:14px;color:#ff55c8;line-height:1.7;white-space:pre-wrap;word-break:break-all}
#log{background:#0a0a12;border:1px solid #22223a;border-radius:8px;padding:8px;margin-top:8px;
max-height:40vh;overflow-y:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
.ok{color:#00ff88}.err{color:#ff4466}.info{color:#44aaff}.warn{color:#ffaa00}.hit{color:#ff00ff;font-weight:bold}
</style>
</head><body>
<div id="hud">
  <h1>P1189 — PERMISSIONS/CRYPTO/EVENT DICT RE-ENTRANCY</h1>
  <div id="status">BOOTING...</div>
  <div id="phase">phase: init</div>
  <div id="counters">stage: ?</div>
  <div id="finds">no findings yet</div>
</div>
<div id="log"></div>
<script>
'use strict';
var L=document.getElementById('log'),S=document.getElementById('status'),
PH=document.getElementById('phase'),CT=document.getElementById('counters'),FD=document.getElementById('finds');
var T0=Date.now();
function setStatus(t){S.textContent=t;}
function setPhase(t){PH.textContent='phase: '+t;}
function setCounters(t){CT.textContent=t;}
function addFind(t){var d=document.createElement('div');d.textContent=t;FD.textContent='';FD.appendChild(d);}
function log(m,c){var d=document.createElement('div');d.className=c||'';
d.textContent='['+(((Date.now()-T0)/1000).toFixed(1))+'s] '+m;L.appendChild(d);L.scrollTop=1e6;}
function B(tag,data){try{var u='/beacon.php?tag=P1189-'+encodeURIComponent(tag);
if(data)u+='&data='+encodeURIComponent(String(data).slice(0,900));
u+='&t='+Date.now();new Image().src=u;}catch(e){}}
window.onerror=function(m,s,l){try{B('JSERR',m+'@'+l);}catch(e){}};

/* P1189: Permissions.query + SubtleCrypto dict re-entrancy (audited:
   conversions fire JS getters after context capture; test hostile
   getters that navigate/GC/detach during conversion). */
(function run(){
var STAGES=['detect','permGetter','cryptoGetter','extEvent','combos'];
var stage=0,results=[];
try{stage=parseInt(localStorage.getItem('p1189_stage')||'0');}catch(e){}
try{var r=localStorage.getItem('p1189_res');if(r)results=JSON.parse(r);}catch(e){}
if(!Array.isArray(results))results=[];
B('BOOT','stage='+stage+'|'+STAGES[stage]);
setStatus('STAGE '+stage+'/4 — '+STAGES[stage]);

if(stage>=STAGES.length){
  setStatus('ALL DONE');
  B('ALL-DONE',JSON.stringify(results).slice(0,800));
  log('=== ALL DONE ===','ok');
  try{localStorage.removeItem('p1189_stage');}catch(e){}
}else{
try{localStorage.setItem('p1189_stage',''+(stage+1));}catch(e){}
var cur=STAGES[stage];

function done(rep){
  results.push({stage:stage,name:cur,result:rep});
  try{localStorage.setItem('p1189_res',JSON.stringify(results));}catch(e){}
  B('RESULT',rep.slice(0,700));
  addFind(cur+': '+rep.slice(0,300));
  setStatus(rep.slice(0,80));
  log('=== '+cur+' -> '+rep+' ===','ok');
  B('NEXT');setTimeout(function(){location.reload(true);},700);
}
function gcP(){for(var g=0;g<2000;g++){var t=new ArrayBuffer(2048);t=null;}}

if(cur==='detect'){
  var hasPerm=(navigator.permissions&&typeof navigator.permissions.query==='function');
  var hasCrypto=(crypto&&crypto.subtle&&typeof crypto.subtle.digest==='function');
  done('permissions='+hasPerm+'|subtle='+hasCrypto);
}else if(cur==='permGetter'){
  setPhase('Permissions.query name getter');
  var rep='';
  try{
    var d={};
    Object.defineProperty(d,'name',{configurable:true,get:function(){
      B('PERM-GETTER','fired');
      gcP();
      return 'geolocation';
    }});
    navigator.permissions.query(d).then(function(st){
      rep='resolved:'+st.state;
      done(rep);
    },function(e){rep='rejected:'+e.name;done(rep);});
    return;
  }catch(e){rep='THROW:'+e.constructor.name;}
  done(rep);
}else if(cur==='cryptoGetter'){
  setPhase('SubtleCrypto algo getter');
  var rep2='';
  try{
    var alg={};
    Object.defineProperty(alg,'name',{configurable:true,get:function(){
      B('CRYPTO-GETTER','fired');
      gcP();
      return 'SHA-256';
    }});
    var data=new TextEncoder().encode('hello');
    crypto.subtle.digest(alg,data).then(function(hash){
      rep2='digested:'+hash.byteLength;
      done(rep2);
    },function(e){rep2='rejected:'+e.name;done(rep2);});
    return;
  }catch(e){rep2='THROW:'+e.constructor.name;}
  done(rep2);
}else if(cur==='extEvent'){
  setPhase('ExtendableMessageEvent init');
  var rep3='';
  try{
    var ev=new ExtendableMessageEvent('msg',{data:1,ports:[],source:null,
      get origin(){B('EV-GETTER','fired');gcP();return 'https://x';}});
    rep3='created:'+(ev.origin||'?');
  }catch(e){rep3='THROW:'+e.constructor.name+':'+String(e.message).slice(0,30);}
  done(rep3);
}else if(cur==='combos'){
  setPhase('combo: perm+getter with nav');
  var rep4='';
  try{
    var d2={};
    Object.defineProperty(d2,'name',{configurable:true,get:function(){
      B('COMBO-GETTER','fired');
      /* heavy DOM churn during conversion */
      for(var i=0;i<2000;i++){
        var el=document.createElement('div');
        el.textContent='x';
        document.body.appendChild(el);
      }
      return 'notifications';
    }});
    navigator.permissions.query(d2).then(function(st){
      rep4='resolved:'+st.state;
      done(rep4);
    },function(e){rep4='rejected:'+e.name;done(rep4);});
    return;
  }catch(e){rep4='THROW:'+e.constructor.name;}
  done(rep4);
}
} /* stage machine */
})(); /* end IIFE */

(function(){
  var cur='P1189-perm-crypto';
  setTimeout(function check(){
    try{
      var x=new XMLHttpRequest();
      x.open('GET','/reload.txt?c='+Date.now(),true);
      x.onload=function(){
        var t=(x.responseText||'').trim();
        if(t&&t!==cur){location.reload(true);return;}
        setTimeout(check,3000);};
      x.onerror=function(){setTimeout(check,5000);};
      x.send();
    }catch(e){setTimeout(check,5000);}
  },4000);
})();
</script>
</body></html>
