<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P1191 Canvas Pixel-Path Edge Battery</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050508;color:#e8ffe8;font:14px/1.5 'Courier New',monospace;padding:12px}
#hud{background:#0a0a18;border:2px solid #2a2a5a;border-radius:10px;padding:12px;margin-bottom:10px}
#hud h1{color:#00ff88;font-size:18px;margin-bottom:6px}
#status{font-size:20px;font-weight:bold;color:#ffd75e;padding:6px 0}
#phase{font-size:16px;color:#00ffee}
#counters{font-size:14px;color:#b9c6ee;line-height:1.8}
#finds{font-size:14px;color:#ff55c8;line-height:1.7;white-space:pre-wrap;word-break:break-all}
#log{background:#0a0a12;border:1px solid #22223a;border-radius:8px;padding:8px;margin-top:8px;
max-height:40vh;overflow-y:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
.ok{color:#00ff88}.err{color:#ff4466}.info{color:#44aaff}.warn{color:#ffaa00}.hit{color:#ff00ff;font-weight:bold}
</style>
</head><body>
<div id="hud">
  <h1>P1191 — CANVAS PIXEL-PATH EDGE BATTERY</h1>
  <div id="status">BOOTING...</div>
  <div id="phase">phase: init</div>
  <div id="counters">stage: ?</div>
  <div id="finds">no findings yet</div>
</div>
<div id="log"></div>
<script>
'use strict';
var L=document.getElementById('log'),S=document.getElementById('status'),
PH=document.getElementById('phase'),CT=document.getElementById('counters'),FD=document.getElementById('finds');
var T0=Date.now();
function setStatus(t){S.textContent=t;}
function setPhase(t){PH.textContent='phase: '+t;}
function setCounters(t){CT.textContent=t;}
function addFind(t){var d=document.createElement('div');d.textContent=t;FD.textContent='';FD.appendChild(d);}
function log(m,c){var d=document.createElement('div');d.className=c||'';
d.textContent='['+(((Date.now()-T0)/1000).toFixed(1))+'s] '+m;L.appendChild(d);L.scrollTop=1e6;}
function B(tag,data){try{var u='/beacon.php?tag=P1191-'+encodeURIComponent(tag);
if(data)u+='&data='+encodeURIComponent(String(data).slice(0,900));
u+='&t='+Date.now();new Image().src=u;}catch(e){}}
window.onerror=function(m,s,l){try{B('JSERR',m+'@'+l);}catch(e){}};

/* P1191: canvas pixel-path edges — getImageData/putImageData rect
   arithmetic, drawImage 9-arg extremes, ImageData size edges. */
var STAGES=['gidRects','pidRects','draw9','imgData','hugeCanvas'];
var stage=0,results=[];
try{stage=parseInt(localStorage.getItem('p1191_stage')||'0');}catch(e){}
try{var r=localStorage.getItem('p1191_res');if(r)results=JSON.parse(r);}catch(e){}
if(!Array.isArray(results))results=[];
B('BOOT','stage='+stage+'|'+STAGES[stage]);
setStatus('STAGE '+stage+'/4 — '+STAGES[stage]);

if(stage>=STAGES.length){
  setStatus('ALL DONE');
  B('ALL-DONE',JSON.stringify(results).slice(0,800));
  log('=== ALL DONE ===','ok');
  try{localStorage.removeItem('p1191_stage');}catch(e){}
}else{
try{localStorage.setItem('p1191_stage',''+(stage+1));}catch(e){}
var cur=STAGES[stage];

function done(rep){
  results.push({stage:stage,name:cur,result:rep});
  try{localStorage.setItem('p1191_res',JSON.stringify(results));}catch(e){}
  B('RESULT',rep.slice(0,700));
  addFind(cur+': '+rep.slice(0,300));
  setStatus(rep.slice(0,80));
  log('=== '+cur+' -> '+rep+' ===','ok');
  B('NEXT');setTimeout(function(){location.reload(true);},700);
}
function cv(){var c=document.createElement('canvas');c.width=64;c.height=64;var x=c.getContext('2d');x.fillStyle='#3366cc';x.fillRect(0,0,64,64);return c;}

if(cur==='gidRects'){
  setPhase('getImageData rect edges');
  var c=cv();var x=c.getContext('2d');
  var rects=[[-1e9,-1e9,2e9,2e9],[1e9,1e9,1,1],[0,0,-5,-5],[60,60,10,10],[0,0,NaN,64],[0,0,Infinity,64]];
  var reps=[];
  for(var i=0;i<rects.length;i++){
    var r=rects[i];
    try{
      var d=x.getImageData(r[0],r[1],r[2],r[3]);
      reps.push(i+':ok'+d.width+'x'+d.height);
    }catch(e){reps.push(i+':THROW:'+e.constructor.name);}
  }
  done(reps.join('|'));
}else if(cur==='pidRects'){
  setPhase('putImageData rect edges');
  var c2=cv();var x2=c2.getContext('2d');
  var im=x2.getImageData(0,0,8,8);
  var reps2=[];
  var rects2=[[0,0],[-1e9,-1e9],[1e9,1e9],[60,60],[NaN,0],[0,Infinity]];
  for(var j=0;j<rects2.length;j++){
    try{
      x2.putImageData(im,rects2[j][0],rects2[j][1]);
      reps2.push(j+':ok');
    }catch(e){reps2.push(j+':THROW:'+e.constructor.name);}
  }
  done(reps2.join('|'));
}else if(cur==='draw9'){
  setPhase('drawImage 9-arg extremes');
  var src=cv();var dst=document.createElement('canvas');dst.width=64;dst.height=64;
  var dx=dst.getContext('2d');
  var cases=[[0,0,64,64,-1e9,-1e9,2e9,2e9],[0,0,64,64,0,0,NaN,64],[0,0,64,64,0,0,64,Infinity],[-32,-32,128,128,0,0,64,64],[1e9,1e9,64,64,0,0,64,64]];
  var reps3=[];
  for(var k=0;k<cases.length;k++){
    var cc=cases[k];
    try{
      dx.drawImage(src,cc[0],cc[1],cc[2],cc[3],cc[4],cc[5],cc[6],cc[7]);
      reps3.push(k+':ok');
    }catch(e){reps3.push(k+':THROW:'+e.constructor.name);}
  }
  done(reps3.join('|'));
}else if(cur==='imgData'){
  setPhase('ImageData size edges');
  var reps4=[];
  var sizes=[[0,0],[1,1],[-1,8],[8,-1],[1e9,1],[1,1e9],[0x7FFFFFFF,1]];
  for(var s=0;s<sizes.length;s++){
    try{
      var id=new ImageData(sizes[s][0],sizes[s][1]);
      reps4.push(s+':ok'+id.width+'x'+id.height);
    }catch(e){reps4.push(s+':THROW:'+e.constructor.name);}
  }
  done(reps4.join('|'));
}else if(cur==='hugeCanvas'){
  setPhase('huge canvas dims');
  var reps5=[];
  var dims=[[100000,100],[100,100000],[32767,32767],[0x7FFFFFFF,1],[100000000,1]];
  for(var d2=0;d2<dims.length;d2++){
    try{
      var hc=document.createElement('canvas');
      hc.width=dims[d2][0];hc.height=dims[d2][1];
      var hx=hc.getContext('2d');
      reps5.push(d2+':ok'+hc.width+'x'+hc.height);
    }catch(e){reps5.push(d2+':THROW:'+e.constructor.name);}
  }
  done(reps5.join('|'));
}
} /* stage machine */

(function(){
  var cur='P1191-pixel-edges';
  setTimeout(function check(){
    try{
      var x=new XMLHttpRequest();
      x.open('GET','/reload.txt?c='+Date.now(),true);
      x.onload=function(){
        var t=(x.responseText||'').trim();
        if(t&&t!==cur){location.reload(true);return;}
        setTimeout(check,3000);};
      x.onerror=function(){setTimeout(check,5000);};
      x.send();
    }catch(e){setTimeout(check,5000);}
  },4000);
})();
</script>
</body></html>
