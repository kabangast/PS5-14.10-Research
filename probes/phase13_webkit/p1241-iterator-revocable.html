<!-- A: Map/Set iterator invalidation during iteration -->
<script>
log('\n--- A: Map/Set iterator invalidation ---');
var aR=[];

// A1: Delete Map entries during iteration
try{
  var m=new Map();for(var i=0;i<10;i++)m.set('k'+i,i);
  var seen=[];
  m.forEach(function(v,k){
    seen.push(k);
    if(k==='k3'){m.delete('k4');m.delete('k5');m.set('k99',99);}
  });
  aR.push('A1:seen='+seen.join(',')+'|size='+m.size);
}catch(e){aR.push('A1:ERR:'+e.message.slice(0,60));}

// A2: Set iterator with add/delete
try{
  var s=new Set([1,2,3,4,5,6,7,8]);
  var seen2=[];
  for(var v of s){
    seen2.push(v);
    if(v===3){s.delete(4);s.delete(5);s.add(99);}
  }
  aR.push('A2:'+seen2.join(','));
}catch(e){aR.push('A2:ERR:'+e.message.slice(0,60));}

// A3: Map iterator with clear during iteration
try{
  var m3=new Map([['a',1],['b',2],['c',3],['d',4]]);
  var seen3=[];
  for(var e of m3){
    seen3.push(e[0]);
    if(e[0]==='b')m3.clear();
  }
  aR.push('A3:'+seen3.join(',')+'|size='+m3.size);
}catch(e){aR.push('A3:ERR:'+e.message.slice(0,60));}

// A4: Multiple concurrent iterators on same Map
try{
  var m4=new Map([['a',1],['b',2],['c',3]]);
  var it1=m4[Symbol.iterator](),it2=m4[Symbol.iterator]();
  var r=[];
  r.push('i1:'+it1.next().value);
  r.push('i2:'+it2.next().value);
  m4.set('d',4);
  r.push('i1:'+it1.next().value);
  m4.delete('c');
  r.push('i2:'+it2.next().value);
  r.push('i1:'+it1.next().value);
  r.push('i2:'+it2.next().value);
  aR.push('A4:'+r.join('|'));
}catch(e){aR.push('A4:ERR:'+e.message.slice(0,60));}

// A5: WeakMap behavior — can we detect GC?
try{
  var wm=new WeakMap();
  var keys=[];
  for(var i=0;i<100;i++){var k={id:i};wm.set(k,i);keys.push(k);}
  // Check all accessible
  var allPresent=true;
  for(var i=0;i<100;i++){if(!wm.has(keys[i])){allPresent=false;break;}}
  // Drop half the references
  for(var i=0;i<50;i++)keys[i]=null;
  // GC pressure
  for(var i=0;i<200;i++){var tmp=new ArrayBuffer(65536);}
  // Check remaining
  var remain=0;
  for(var i=50;i<100;i++){if(wm.has(keys[i]))remain++;}
  aR.push('A5:allPre='+allPresent+'|remain='+remain);
}catch(e){aR.push('A5:ERR:'+e.message.slice(0,60));}

B('A',aR.join('||'));
log('A: '+aR.join(' | '));
</script>

<!-- B: Proxy.revocable timing attacks -->
<script>
log('\n--- B: Proxy.revocable ---');
var bR=[];

// B1: Revoke during trap execution
try{
  var revoke;
  var trapCalls=0;
  var r=Proxy.revocable({x:1,y:2,z:3},{
    get:function(t,p){
      trapCalls++;
      if(trapCalls===2)revoke();
      return t[p];
    }
  });
  revoke=r.revoke;
  var p=r.proxy;
  var results=[];
  try{results.push('x='+p.x);}catch(e){results.push('x:'+e.message.slice(0,30));}
  try{results.push('y='+p.y);}catch(e){results.push('y:'+e.message.slice(0,30));}
  try{results.push('z='+p.z);}catch(e){results.push('z:'+e.message.slice(0,30));}
  bR.push('B1:'+results.join('|')+'|tc='+trapCalls);
}catch(e){bR.push('B1:ERR:'+e.message.slice(0,60));}

// B2: Revoke during ownKeys enumeration
try{
  var rev2;
  var r2=Proxy.revocable({a:1,b:2,c:3},{
    ownKeys:function(t){
      rev2();
      return ['a','b','c'];
    },
    getOwnPropertyDescriptor:function(t,p){
      return {value:t[p],enumerable:true,configurable:true};
    }
  });
  rev2=r2.revoke;
  var keys;
  try{keys=Object.keys(r2.proxy);}catch(e){keys='threw:'+e.message.slice(0,40);}
  bR.push('B2:keys='+keys);
}catch(e){bR.push('B2:ERR:'+e.message.slice(0,60));}

// B3: Revoke between has and get
try{
  var rev3;
  var phase=0;
  var r3=Proxy.revocable({x:42},{
    has:function(t,p){phase=1;return true;},
    get:function(t,p){
      if(phase===1){rev3();phase=2;}
      return t[p];
    }
  });
  rev3=r3.revoke;
  var result;
  try{
    if('x' in r3.proxy){result='has:true,get='+r3.proxy.x;}
  }catch(e){result='threw:'+e.message.slice(0,40);}
  bR.push('B3:'+result+'|phase='+phase);
}catch(e){bR.push('B3:ERR:'+e.message.slice(0,60));}

// B4: Double revoke
try{
  var r4=Proxy.revocable({},{});
  r4.revoke();
  r4.revoke(); // Should be no-op
  try{r4.proxy.x;}catch(e){bR.push('B4:double_revoke_ok|'+e.message.slice(0,30));}
}catch(e){bR.push('B4:ERR:'+e.message.slice(0,60));}

// B5: Revocable proxy as Map key — revoke then access
try{
  var r5=Proxy.revocable({},{});
  var m5=new Map();
  m5.set(r5.proxy,'value');
  var before=m5.get(r5.proxy);
  r5.revoke();
  var after;
  try{after=m5.get(r5.proxy);}catch(e){after='threw:'+e.message.slice(0,30);}
  bR.push('B5:before='+before+'|after='+after+'|size='+m5.size);
}catch(e){bR.push('B5:ERR:'+e.message.slice(0,60));}

B('B',bR.join('||'));
log('B: '+bR.join(' | '));
</script>

<!-- C: eval/Function constructor edge cases -->
<script>
log('\n--- C: eval/Function edge cases ---');
var cR=[];

// C1: eval with scope manipulation
try{
  var secret='hidden';
  var r=eval('secret');
  cR.push('C1:direct='+r);
}catch(e){cR.push('C1:ERR:'+e.message.slice(0,60));}

// C2: Indirect eval (global scope)
try{
  var secret2='local_secret';
  var geval=(0,eval);
  var r2;
  try{r2=geval('secret2');}catch(e){r2='threw:'+e.message.slice(0,30);}
  cR.push('C2:indirect='+r2);
}catch(e){cR.push('C2:ERR:'+e.message.slice(0,60));}

// C3: Function constructor — can it access local scope?
try{
  var localVar='should_not_see';
  var fn=new Function('return typeof localVar');
  cR.push('C3:typeof='+fn());
}catch(e){cR.push('C3:ERR:'+e.message.slice(0,60));}

// C4: eval modifying local scope
try{
  var a=1;
  eval('a=42;var b=99;');
  cR.push('C4:a='+a+'|b='+b);
}catch(e){cR.push('C4:ERR:'+e.message.slice(0,60));}

// C5: eval creating functions that close over eval scope
try{
  var evaled=eval('(function(){var x=123;return function(){return x;}})()');
  cR.push('C5:closure='+evaled());
}catch(e){cR.push('C5:ERR:'+e.message.slice(0,60));}

// C6: Function.prototype.toString — can we read source?
try{
  var src=Array.prototype.map.toString();
  var natLen=src.length;
  var isNative=src.indexOf('[native code]')>=0;
  cR.push('C6:native='+isNative+'|len='+natLen);
}catch(e){cR.push('C6:ERR:'+e.message.slice(0,60));}

// C7: Overwrite built-in then restore
try{
  var origPush=Array.prototype.push;
  var hijacked=false;
  Array.prototype.push=function(){hijacked=true;return origPush.apply(this,arguments);};
  var arr=[];arr.push(1);
  Array.prototype.push=origPush;
  cR.push('C7:hijacked='+hijacked+'|arr='+arr.join(','));
}catch(e){cR.push('C7:ERR:'+e.message.slice(0,60));}

B('C',cR.join('||'));
log('C: '+cR.join(' | '));
</script>

<!-- D: Error/stack trace information -->
<script>
log('\n--- D: Error stack traces ---');
var dR=[];

// D1: Error.stack content
try{
  var e=new Error('test');
  var stack=e.stack||'';
  var lines=stack.split('\n');
  dR.push('D1:lines='+lines.length+'|first='+lines[0].slice(0,80));
}catch(e){dR.push('D1:ERR:'+e.message.slice(0,60));}

// D2: Stack from nested calls — address leak?
try{
  function deep3(){return new Error('deep');}
  function deep2(){return deep3();}
  function deep1(){return deep2();}
  var err=deep1();
  var s=err.stack||'';
  // Look for hex addresses
  var addrs=s.match(/0x[0-9a-f]+/gi)||[];
  var has_hex=addrs.length>0;
  dR.push('D2:has_hex='+has_hex+'|addrs='+addrs.slice(0,5).join(',')+'|lines='+s.split('\n').length);
}catch(e){dR.push('D2:ERR:'+e.message.slice(0,60));}

// D3: Stack overflow depth + address info
try{
  var depth=0;
  function recurse(){depth++;recurse();}
  try{recurse();}catch(e){
    var s=e.stack||'';
    var addrs=s.match(/0x[0-9a-f]+/gi)||[];
    dR.push('D3:depth='+depth+'|stack_len='+s.length+'|hex='+addrs.slice(0,3).join(','));
  }
}catch(e){dR.push('D3:ERR:'+e.message.slice(0,60));}

// D4: Error.prepareStackTrace (V8-specific, likely absent)
try{
  var hasPrepare=typeof Error.prepareStackTrace;
  var hasCaptureStack=typeof Error.captureStackTrace;
  dR.push('D4:prepare='+hasPrepare+'|capture='+hasCaptureStack);
}catch(e){dR.push('D4:ERR:'+e.message.slice(0,60));}

// D5: Error subclass stack
try{
  class CustomError extends Error{constructor(m){super(m);this.name='CustomError';}}
  var ce=new CustomError('custom');
  dR.push('D5:name='+ce.name+'|stack_has_name='+(ce.stack.indexOf('CustomError')>=0));
}catch(e){dR.push('D5:ERR:'+e.message.slice(0,60));}

B('D',dR.join('||'));
log('D: '+dR.join(' | '));
</script>

<!-- E: String.normalize + ICU edge cases -->
<script>
log('\n--- E: String/ICU edge cases ---');
var eR=[];

  var tests=[
    'Å',   // A + combining ring = Å
    'Å',         // Precomposed Å

<!-- G: Promise/async edge cases -->
<script>

  var result='pending';
  Promise.resolve(thenable).then(
    function(v){result='resolved:'+v;},

  );

  gR.push('G2:sync='+allResult);

// G3: Promise constructor executor throws

    resolve('first');

<script>

<script>

// I2: Proxy handler invariant — non-configurable property must be reported

  var target={};
  Object.defineProperty(target,'fixed',{value:42,configurable:false});
  var p=new Proxy(target,{
    getOwnPropertyDescriptor:function(t,p){
      if(p==='fixed')return{value:99,configurable:true,writable:true,enumerable:true};
      return Object.getOwnPropertyDescriptor(t,p);
    }
  });
  var desc;
  try{desc=Object.getOwnPropertyDescriptor(p,'fixed');}catch(e){desc='threw:'+e.message.slice(0,40);}
  iR.push('I2:desc='+JSON.stringify(desc));
}catch(e){iR.push('I2:ERR:'+e.message.slice(0,60));}

// I3: Reflect.apply with exotic this
try{
  var r3=Reflect.apply(Array.prototype.join,[1,2,3],['-']);
  iR.push('I3:join='+r3);
}catch(e){iR.push('I3:ERR:'+e.message.slice(0,60));}

// I4: Proxy defineProperty invariant — can't add to non-extensible
try{
  var t4={};
  Object.preventExtensions(t4);
  var p4=new Proxy(t4,{
    defineProperty:function(t,p,d){return true;}
