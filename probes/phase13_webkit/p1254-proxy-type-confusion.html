function mkFrame(){

  ifr.contentDocument.open();

  return {win:ifr.contentWindow, doc:ifr.contentDocument, ifr:ifr};

<!-- A: Array.from with Proxy reporting fake length -->
<script>
log('\n--- A: Proxy fake length in Array.from ---');
(function(){
  var f=mkFrame();
  var handler=f.win.eval('({'+
    'get:function(t,p){'+
      'if(p==="length") return 0x10000;'+ // Fake huge length
      'if(typeof p==="string"&&!isNaN(p)){'+
        'var i=parseInt(p);'+
        'if(i<10) return i*2;'+ // First 10 elements
        'return undefined;'+ // Rest undefined
      '}'+
      'return t[p];'+
    '}'+
  '})');
  document.body.removeChild(f.ifr); // Kill realm

  var target=[1,2,3,4,5];
  var proxy=new Proxy(target, handler);

  // Array.from uses iterable protocol first, then length
  try{
    // Direct length access
    B('A1','proxy_len='+proxy.length+'|real='+target.length);
  }catch(e){B('A1','err:'+e.message.slice(0,40));}

  // Array.from with the proxy
  try{
    var result=Array.from(proxy);
    B('A2','from_len='+result.length+'|first5='+result.slice(0,5).join(',')+
      '|last5='+result.slice(-5).join(',')+'|undef_count='+result.filter(function(x){return x===undefined;}).length);
  }catch(e){B('A2','from_err:'+e.name+':'+e.message.slice(0,40));}

  // Array.from with mapFn
  try{
    var mapped=Array.from({length:proxy.length}, function(v,i){return i<5?i*3:0;});
    B('A3','mapped_len='+mapped.length+'|first='+mapped.slice(0,3).join(','));
  }catch(e){B('A3','map_err:'+e.name+':'+e.message.slice(0,40));}

  // Spread operator with proxy
  try{
    // This would call Symbol.iterator, not length
    var spread=[].concat(proxy);
    B('A4','concat_len='+spread.length);
  }catch(e){B('A4','spread_err:'+e.name+':'+e.message.slice(0,40));}
})();
</script>

<!-- C: Sort with adversarial comparator from dead realm -->
<script>
log('\n--- C: Adversarial sort comparator ---');
(function(){
  var f=mkFrame();

  // Comparator that changes behavior after N calls
  var cmpCode='var calls=0;(function cmp(a,b){'+
    'calls++;'+
    'if(calls>50) return -a;'+ // Inconsistent after 50 calls
    'return a-b;'+
  '})';
  var cmp=f.win.eval(cmpCode);
  document.body.removeChild(f.ifr);

  // Sort with dead-realm comparator
  var arr=[];
  for(var i=0;i<100;i++) arr.push(Math.random()*1000|0);
  var orig=arr.slice();

  try{
    arr.sort(cmp);
    // Check if sort produced valid results
    var sorted=true;
    for(var i=1;i<arr.length;i++){
      if(arr[i]<arr[i-1]){sorted=false;break;}
    }
    B('C1','sort_done|sorted='+sorted+'|len='+arr.length+'|orig_len='+orig.length);
  }catch(e){B('C1','sort_err:'+e.name+':'+e.message.slice(0,40));}

  // Sort with comparator that modifies the array during sort
  var f2=mkFrame();
  var evilCmp=f2.win.eval('(function(a,b){'+
    'if(this&&this.length>50){this.length=10;}'+ // Shrink during sort
    'return a-b;'+
  '})');
  document.body.removeChild(f2.ifr);

  var arr2=[];
  for(var i=0;i<100;i++) arr2.push(i);
  try{
    arr2.sort(evilCmp.bind(arr2));
    B('C2','mutating_sort|len='+arr2.length);
  }catch(e){B('C2','mut_err:'+e.name+':'+e.message.slice(0,40));}

  // Sort with comparator that returns non-numeric values
  var f3=mkFrame();
  var weirdCmp=f3.win.eval('(function(a,b){'+
    'var r=["NaN",undefined,null,{},true,Infinity,-Infinity,0,-0];'+
    'return r[Math.floor(Math.random()*r.length)];'+
  '})');
  document.body.removeChild(f3.ifr);

  var arr3=[5,3,1,4,2,8,6,7,9,0];
  try{
    arr3.sort(weirdCmp);
    B('C3','weird_sort|len='+arr3.length+'|vals='+arr3.join(','));
  }catch(e){B('C3','weird_err:'+e.name+':'+e.message.slice(0,40));}
})();
</script>

<!-- D: Proxy-wrapped TypedArray with dead handler -->
<script>
log('\n--- D: Proxy TypedArray confusion ---');
(function(){
  var f=mkFrame();
  var buf=new ArrayBuffer(64);
  var u32=new Uint32Array(buf);
  for(var i=0;i<u32.length;i++) u32[i]=i*0x11111111;

  // Proxy that makes TypedArray report wrong length/type
  var handler=f.win.eval('({'+
    'get:function(t,p){'+
      'if(p==="length") return t.length*4;'+ // 4x actual length
      'if(p==="byteLength") return t.byteLength*2;'+ // 2x actual
      'if(p==="BYTES_PER_ELEMENT") return 1;'+ // Claim byte elements
      'if(p==="buffer") return t.buffer;'+ // Real buffer
      'return t[p];'+
    '}'+
  '})');
  document.body.removeChild(f.ifr);

  var proxy=new Proxy(u32, handler);

  B('D1','len='+proxy.length+'|realLen='+u32.length+
    '|byteLen='+proxy.byteLength+'|realByteLen='+u32.byteLength+
    '|bpe='+proxy.BYTES_PER_ELEMENT);

  // Try to create a new TypedArray from the proxy
  try{
    var copy=new Uint8Array(proxy);
    B('D2','u8_from_proxy|len='+copy.length+'|first4='+copy[0]+','+copy[1]+','+copy[2]+','+copy[3]);
  }catch(e){B('D2','u8_err:'+e.name+':'+e.message.slice(0,40));}

  // TypedArray.from with proxy
  try{
    var fromProxy=Uint32Array.from(proxy);
    B('D3','from_proxy|len='+fromProxy.length+'|v0=0x'+fromProxy[0].toString(16));
  }catch(e){B('D3','from_err:'+e.name+':'+e.message.slice(0,40));}

  // DataView on proxy's buffer
  try{
    var dv=new DataView(proxy.buffer);
    B('D4','dv_ok|byteLen='+dv.byteLength+'|v0=0x'+dv.getUint32(0).toString(16));
  }catch(e){B('D4','dv_err:'+e.name+':'+e.message.slice(0,40));}

  // set() with proxy as source
  try{
    var dest=new Uint32Array(32); // Bigger than real, smaller than fake
    dest.set(proxy);
    B('D5','set_ok|dest_len='+dest.length+'|v0=0x'+dest[0].toString(16)+'|v15=0x'+dest[15].toString(16));
  }catch(e){B('D5','set_err:'+e.name+':'+e.message.slice(0,40));}
})();
</script>

<!-- F: Iterator protocol from dead realm -->
<script>

      'var i=0;'+

    '}'+

<!-- G: NodeIterator + dead filter + DOM mutation (exploit the P1252 B divergence) -->
<script>

    s.id='G'+i;
    container.appendChild(s);
  }
  document.body.appendChild(container);

  // Test: advance NodeIterator, detach filter realm, mutate, iterate
  var f=mkFrame();
  var filter=f.win.eval('(function(n){return 1;})');
  var ni=document.createNodeIterator(container, 1, {acceptNode:filter});

  // Advance to G3
  for(var i=0;i<4;i++) ni.nextNode();
  B('G1','advanced_4');

  // Detach
  document.body.removeChild(f.ifr);

  // Mutate: remove the CURRENT reference node and its neighbors
  document.getElementById('G3').remove();
  document.getElementById('G4').remove();
  B('G2','removed_G3_G4');

  // Try to iterate forward
  var forward=[];
  try{
    var n;
    while(n=ni.nextNode()){
      forward.push(n.id||n.textContent);
      if(forward.length>15) break;
    }
    B('G3','forward='+forward.join(',')+' ('+forward.length+')');
  }catch(e){B('G3','fwd_err:'+e.name+':'+e.message.slice(0,40));}

  // Try previousNode

  try{
    var n;
    while(n=ni.previousNode()){

      if(backward.length>15) break;

    B('G4','backward='+backward.join(',')+' ('+backward.length+')');
  }catch(e){B('G4','bwd_err:'+e.name+':'+e.message.slice(0,40));}

  // Test 2: mutate DURING iteration with dead filter

  var ni2=document.createNodeIterator(container, 1, {acceptNode:filter2});

  var mutResults=[];

      // Remove every other node DURING iteration

    B('G5','mut_during|visited='+mutResults.join(','));
  }catch(e){B('G5','mut_err:'+e.name+':'+e.message.slice(0,40));}
